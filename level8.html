/* ============================================================================
   NACHTSCHICHT - LEVEL 8: HEIMWEG (FINALES LEVEL)

   Die letzte Etappe der Nacht. Kein Kampf, kein Türsteher, kein Gegner mit
   Fäusten - der Endgegner ist die Sonne selbst. Der Himmel wird waehrend des
   ganzen Levels sichtbar heller, das ist gleichzeitig die Uhr UND die
   Niederlage: erreicht das Licht 100, bist du auf offener Strasse erwischt
   worden. Schatten (Baeume, Haeuser, eine Unterfuehrung) bremsen die Sonne,
   Hindernisse (Muelltonnen, Jogger, ein Muellwagen) kosten dir Zeit und
   zusaetzlich Licht, wenn du sie nicht ueberspringst.

   Dieses Level hat KEIN Level 9. Sieg fuehrt zurueck zu index.html
   ("ganzes Spiel neu starten"), nicht zu einem naechsten Level.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG - etwas ruhiger als Level 2, das ist der letzte lange Weg */
  gehTempo:       100,
  beschleunigung: 950,
  bremsung:      1300,
  luftKontrolle:   0.55,
  gravitation:    920,
  sprungKraft:   -235,
  kurzsprung:      0.45,
  coyoteMs:        95,
  puffermMs:      130,

  /* (2) KAMERA */
  kameraTraegheit: 6.5,
  blickVoraus:    26,

  /* (3) DER PEGEL - was vom Abend noch uebrig ist, baut hier weiter ab.
     Kein Blackout mehr in diesem Level - der Gegner ist die Sonne, nicht
     der Alkohol. Der Pegel ist hier nur noch Flavor/Erschwernis (Wackeln,
     Tempo), keine eigene Niederlage. */
  pegelAbbau:      1.0,
  wackelnAb:       55,
  langsamAb:       70,

  /* (4) DIE SONNE - der Endgegner. Steigt immer, im Schatten langsamer. */
  lichtDauerBasis: 55,     // Sekunden bis 100% Sonne bei voller Belichtung
  schattenFaktor:   0.35,  // Baeume/Haeuser: die Sonne waechst nur so schnell
  tunnelFaktor:     0.12,  // Unterfuehrung schuetzt noch deutlich mehr
  hindernisStrafe:  9,     // Lichtsprung bei einem Treffer
  hindernisRuettel: 5,
  hindernisKnockback: 55,

  /* (5) HINDERNISSE */
  hindernisRadius:  9,     // wie nah du dran sein musst, um zu treffen
  hindernisHoehe:  13,     // so hoch muss dein Sprung sein, um drueberzukommen

  joggerTempo:      1.6,

  /* (6) DIE WELT */
  levelBreite:   5200,
  zielPuffer:      40,
};

const P = {

    '.xxxxxxxxxxxx.',
    'xxxxxxxxxxxxxx',
    'x..ll.....oo.x',
    'xxxxxxxxxxxxxx',
    'xxxxxxxxxxxxxx',

    '.kk........kk.',
  ],
  /* Baum, wirft Schatten */

/* ==========================================================================
   AUDIO
   ========================================================================== */


const SFX={
  schritt:()=>piep(95+Math.random()*20,.03,'triangle',.016),
  sprung: ()=>piep(430,.06,'square',.032),
  landen: ()=>piep(160,.05,'triangle',.028),
  aua:    ()=>{ rauschen(.16,.07); glissando(260,80,.18,'sawtooth',.05); },
  warn:   ()=>piep(880,.07,'square',.05),
  sieg:   ()=>{ [660,880,1100,1320,1568].forEach((f,i)=>setTimeout(()=>piep(f,.16),i*110)); },
  erwischt:()=>{ rauschen(.4,.1); glissando(300,60,.5,'sawtooth',.07); },
};
/* Musik: ruhiger Puls, der schneller und drängender wird, je heller es wird */
const BASS=[110,0,110,0, 98,0,98,0, 87,0,87,0, 98,0,110,0];

function musik(){
  if(!AC||muted||S.modus==='pause') return;
  const drang=Math.min(1,S.licht/100);
  const st=60/(112+drang*40)/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut=S.modus==='spiel'?.02+drang*.02:.012;
    if(f) ton(f,MUS.next,st*.85,'square',laut);
    if(S.modus==='spiel'&&i%4===0) ton(55,MUS.next,.09,'sine',.045);
    MUS.next+=st; MUS.step++;
  }
}

/* ==========================================================================
   AUFBAU
   ========================================================================== */


const BODEN=142;


/* ==========================================================================
   DIE STRASSE NACH HAUSE
   ========================================================================== */
const LEVEL_B=TUNE.levelBreite;
const ZIEL_X=LEVEL_B-TUNE.zielPuffer;
const ZONEN=[
  { von:0,    bis:900,  name:'HAUPTSTRASSE' },
  { von:900,  bis:1900, name:'AN DEN BAEUMEN' },
  { von:1900, bis:2700, name:'UNTERFUEHRUNG' },
  { von:2700, bis:3700, name:'WOHNBLOCKS' },
  { von:3700, bis:4600, name:'LETZTE KREUZUNG' },
  { von:4600, bis:LEVEL_B, name:'DEINE STRASSE' },
];

/* Schattenspender - hier waechst die Sonne langsamer (Unterfuehrung am meisten) */
const SCHATTEN=[
  { von:300,  bis:750,  art:'baum',   label:'BAEUME' },
  { von:1550, bis:2050, art:'tunnel', label:'UNTERFUEHRUNG' },
  { von:2500, bis:2900, art:'haus',   label:'HAUSSCHATTEN' },
  { von:3400, bis:3800, art:'baum',   label:'BAEUME' },
  { von:4300, bis:4700, art:'haus',   label:'HAUSSCHATTEN' },
];
function schattenBei(x){
  for(const z of SCHATTEN) if(x>=z.von&&x<z.bis) return z;
  return null;
}
function lichtFaktorBei(x){
  const z=schattenBei(x);
  if(!z) return 1;
  return z.art==='tunnel'?TUNE.tunnelFaktor:TUNE.schattenFaktor;
}

/* Hindernisse - einmalig, statisch entlang der Strecke. Jogger wackeln etwas
   um ihre Position, damit der Sprung nicht immer exakt gleich getimt ist. */
const HINDERNISSE=[
  { x:550,  art:'tonne' },
  { x:1000, art:'jogger' },
  { x:1400, art:'tonne' },
  { x:1800, art:'jogger' },
  { x:2300, art:'tonne' },
  { x:2750, art:'jogger' },
  { x:3150, art:'tonne' },
  { x:3600, art:'laster' },
  { x:4050, art:'tonne' },
  { x:4500, art:'jogger' },
  { x:4900, art:'tonne' },
];
const HIND_BREITE={ tonne:5, jogger:7, laster:14 };

/* Laternen - rein optisch, gehen aus, wenn es hell genug ist */
const LATERNEN=[200,1150,2200,3250,4350,4950];

/* ==========================================================================
   ZUSTAND
   ========================================================================== */



const BEST_KEY='nachtschicht.bestzeit8';
const ladeBest=()=>{ const v=parseFloat(localStorage.getItem(BEST_KEY)); return isFinite(v)?v:null; };
const tempoBonus=()=>ladeCrew().includes('MAX FERDI')?1.15:1;

let S={};
function neuesSpiel(){
  S={
    modus:'titel', t:0, zeit:0,
    spielerK:null, gegner:null, handlanger:[], flaschen:[],
    arena:0, arenaWechselT:0, hilfeT:0, blockAn:false, kampfGewonnen:false,
    x:40, y:BODEN, vx:0, vy:0, amBoden:true, letzterBoden:0, blick:1, gehPhase:0, schritte:0,
    kamX:0,
    pegel:ladePegel(),
    licht:0,
    hinTreffer:{},
    meldung:'', meldungT:0, hinweis:'', hinweisT:0,
    ruettel:0,
    szene:0, szeneT:0, skipT:0,
    gewonnen:false, faenger:'', neueBestzeit:false,
  };
  S.kamX=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2));
}
neuesSpiel();

/* ==========================================================================
   EINGABE
   ========================================================================== */

let linksAn=false, rechtsAn=false, sprungAn=false, aktionGehalten=false;
let sprungPuffer=[], aktionPuffer=[];

function druckSprung(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){
    /* Kein Level 9 - E fuehrt zurueck zum Anfang des GANZEN Spiels.
       Leertaste (druckSprung) startet stattdessen nur dieses Level neu. */
    if(S.gewonnen){ location.href='index.html'; return; }
    neuesSpiel(); return;
  }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['KeyE','Enter'].includes(e.code)) aktionGehalten=false;
  if(e.code==='Space') sprungAn=false; });
let rolleGedrueckt=false, hochAn=false, runterAn=false;
addEventListener('keydown',e=>{
  if(['ShiftLeft','ShiftRight'].includes(e.code)){ e.preventDefault(); if(S) S.blockAn=true; }
  if(['ArrowUp','KeyW'].includes(e.code)) hochAn=true;
  if(['ArrowDown','KeyS'].includes(e.code)) runterAn=true;
});
addEventListener('keyup',e=>{
  if(['ShiftLeft','ShiftRight'].includes(e.code)&&S) S.blockAn=false;
  if(['ArrowUp','KeyW'].includes(e.code)) hochAn=false;
  if(['ArrowDown','KeyS'].includes(e.code)) runterAn=false;
});
bind('tblock',['touchstart','mousedown'],()=>{ if(S) S.blockAn=true; });
bind('tblock',['touchend','mouseup','touchcancel'],()=>{ if(S) S.blockAn=false; });
bind('trolle',['touchstart','mousedown'],()=>{ rolleGedrueckt=true; });
addEventListener('blur',()=>{ linksAn=rechtsAn=sprungAn=aktionGehalten=false; });


bind('tleft',['touchstart','mousedown'],()=>linksAn=true);
bind('tleft',['touchend','mouseup','touchcancel'],()=>linksAn=false);
bind('tright',['touchstart','mousedown'],()=>rechtsAn=true);
bind('tright',['touchend','mouseup','touchcancel'],()=>rechtsAn=false);
bind('tjump',['touchstart','mousedown'],druckSprung);
bind('tjump',['touchend','mouseup','touchcancel'],()=>sprungAn=false);
bind('thit',['touchstart','mousedown'],()=>{ aktionGehalten=true; druckAktion(); });
bind('thit',['touchend','mouseup','touchcancel'],()=>aktionGehalten=false);


/* ==========================================================================
   INTRO
   ========================================================================== */
const INTRO=[

const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function pruefeSonne(){
  if(S.licht<100||S.modus==='ende') return false;
  S.modus='ende'; S.gewonnen=false;
  S.faenger='DIE SONNE HAT DICH ERWISCHT.'; SFX.erwischt();
  return true;
}
function pruefeZiel(){
  if(S.x<ZIEL_X||!S.amBoden||S.modus==='ende') return false;
  starteCutscene();
  return true;
}

function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='kampf'){ kampf8(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  /* --- Bewegung (gleiches Gefuehl wie in Level 2) --- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*tempoBonus()*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));

  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  /* Reine Menue-Eingaben in diesem Modus ignorieren (kein Reden/Suchen hier) */
  aktionPuffer.length=0;

  /* --- Die Sonne steigt, im Schatten langsamer --- */
  const faktor=lichtFaktorBei(S.x);
  S.licht=Math.min(100,S.licht+(100/TUNE.lichtDauerBasis)*faktor*dt);

  /* --- Hindernisse: einmaliger Treffer, wenn nicht hoch genug gesprungen --- */
  for(let i=0;i<HINDERNISSE.length;i++){
    if(S.hinTreffer[i]) continue;
    const o=HINDERNISSE[i];
    const effX=o.art==='jogger'?o.x+Math.sin(S.t*TUNE.joggerTempo+i)*TUNE.joggerAmplitude:o.x;
    const breite=HIND_BREITE[o.art]||6;
    if(Math.abs(S.x-effX)<TUNE.hindernisRadius+breite*.3&&S.y>BODEN-TUNE.hindernisHoehe){
      S.hinTreffer[i]=true;
      S.licht=Math.min(100,S.licht+TUNE.hindernisStrafe);
      S.ruettel=TUNE.hindernisRuettel;
      S.vx-=Math.sign(S.vx||1)*TUNE.hindernisKnockback;
      SFX.aua(); meldung(pick(['AUA','MIST','VORSICHT']),1.2);
    }
  }

  if(pruefeZiel()){ kamera(dt); return; }
  if(pruefeSonne()){ kamera(dt); return; }
  kamera(dt);
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

     ueber index.html soll wieder nuechtern anfangen. */

    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

   ZEICHNEN
   ========================================================================== */
/* Farbverlauf des Himmels - von Nacht bis Blendend-Hell, ueber das Licht */
const SONNENFARBEN=[
  { t:0.00, oben:[11,15,42],  unten:[27,16,48]  },
  { t:0.30, oben:[26,20,58],  unten:[58,26,70]  },
  { t:0.55, oben:[58,34,86],  unten:[214,90,140]},
  { t:0.78, oben:[120,70,110],unten:[255,140,80]},
  { t:1.00, oben:[220,190,180],unten:[255,240,196]},
];
function lerp(a,b,f){ return a+(b-a)*f; }
function himmelFarbe(licht){
  const t=Math.max(0,Math.min(1,licht/100));
  let a=SONNENFARBEN[0], b=SONNENFARBEN[SONNENFARBEN.length-1];
  for(let i=0;i<SONNENFARBEN.length-1;i++){
    if(t>=SONNENFARBEN[i].t&&t<=SONNENFARBEN[i+1].t){ a=SONNENFARBEN[i]; b=SONNENFARBEN[i+1]; break; }
  }
  const span=(b.t-a.t)||1, f=(t-a.t)/span;
  const mix=(c1,c2)=>[Math.round(lerp(c1[0],c2[0],f)),Math.round(lerp(c1[1],c2[1],f)),Math.round(lerp(c1[2],c2[2],f))];
  const ob=mix(a.oben,b.oben), un=mix(a.unten,b.unten);
  return { oben:`rgb(${ob[0]},${ob[1]},${ob[2]})`, unten:`rgb(${un[0]},${un[1]},${un[2]})`, t };
}

function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }
  if(S.modus==='kampf'){ zeichneKampf8(); hudKampf8(); bildschirme(); return; }

  ctx.save();
  const p=S.pegel/100;
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneStrasse();
  ctx.restore();

  hud();
  /* Die Sonne holt dich ein - je hoeher das Licht, desto mehr wird das Bild
     ausgewaschen. Bewusst kein hartes Weiss, sonst ist der letzte Moment
     nicht mehr lesbar. */
  if(S.licht>55){
    const a=Math.min(.55,(S.licht-55)/45*.55);
    ctx.fillStyle=`rgba(255,250,230,${a.toFixed(3)})`; ctx.fillRect(0,0,W,H);
  }
  bildschirme();
}

function zeichneStrasse(){
  const kx=Math.round(S.kamX);
  const himmel=himmelFarbe(S.licht);

  /* Himmel */
  const grd=ctx.createLinearGradient(0,0,0,BODEN);
  grd.addColorStop(0,himmel.oben); grd.addColorStop(1,himmel.unten);
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,BODEN);

  /* Sterne, verblassen mit steigendem Licht */
  if(himmel.t<0.6){
    ctx.globalAlpha=Math.max(0,1-himmel.t/0.6);
    for(let i=0;i<30;i++){ ctx.fillStyle=i%5===0?'#ffffffaa':'#ffffff55';
      ctx.fillRect((i*57-kx*0.05)%W,(i*23)%100+4,1,1); }
    ctx.globalAlpha=1;
  }

  /* Die Sonne selbst - steigt langsam am Horizont hoch */
  const sonneX=W*0.74;
  const sonneY=Math.round(BODEN-6-(S.licht/100)*88);
  zeichneSonne(sonneX,sonneY,himmel.t);

  ctx.save(); ctx.translate(-kx,0);

  /* Haeuser-Silhouette im Hintergrund, langsamerer Parallax */
  ctx.save(); ctx.translate(-kx*0.4,0);
  for(let i=0;i<40;i++){
    const bx=i*140, bh=30+((i*53)%40);
    ctx.fillStyle=himmel.t<0.5?'#141224':'#2a2338';
    ctx.fillRect(bx,BODEN-bh,90,bh);
  }
  ctx.restore();

  /* Zonen-Hintergrund + Strasse */
  for(const z of ZONEN){
    ctx.fillStyle=himmel.t<0.5?'#1c1826':'#2c2436';
    ctx.fillRect(z.von,BODEN-2,z.bis-z.von,2);
    text(z.name,z.von+6,BODEN-14,'#ffffff14');
  }
  ctx.fillStyle='#221c2c'; ctx.fillRect(0,BODEN,LEVEL_B,H-BODEN);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,LEVEL_B,1);
  ctx.fillStyle='#00000033';
  for(let x=0;x<LEVEL_B;x+=16) ctx.fillRect(x,BODEN+6,8,1);

  /* Schatten-Zonen: Baumkronen/Haus-Kante oben, dunkler Ueberzug am Boden */
  for(const z of SCHATTEN){
    const dunkel=z.art==='tunnel'?0.5:0.28;
    ctx.fillStyle=`rgba(0,0,0,${dunkel})`;
    ctx.fillRect(z.von,20,z.bis-z.von,BODEN-20);
    if(z.art==='baum'){
      for(let x=z.von+10;x<z.bis;x+=40) sprite(SPR.baum,x,BODEN-24);
    } else if(z.art==='tunnel'){
      ctx.fillStyle='#0a0812'; ctx.fillRect(z.von,20,z.bis-z.von,18);
    } else {
      ctx.fillStyle='#000000aa'; ctx.fillRect(z.von,20,z.bis-z.von,10);
    }
    text(z.label,z.von+6,26,'#ffffff30');
  }

  /* Laternen - gehen aus, wenn es hell genug ist */
  for(const lx of LATERNEN){
    sprite(SPR.laterne,lx,BODEN-24);
    if(himmel.t<0.55){
      ctx.globalAlpha=.5+Math.sin(S.t*3+lx)*.15;
      ctx.fillStyle='#ffe08a'; ctx.fillRect(lx-1,BODEN-25,3,3);
      ctx.globalAlpha=1;
    }
  }

  /* Hindernisse */
  for(let i=0;i<HINDERNISSE.length;i++){
    const o=HINDERNISSE[i];
    const effX=o.art==='jogger'?o.x+Math.sin(S.t*TUNE.joggerTempo+i)*TUNE.joggerAmplitude:o.x;
    const rows=SPR[o.art];
    const y=BODEN-rows.length;
    outline(rows,effX-Math.round(rows[0].length/2),y,1,.5);
    if(o.art==='jogger'){
      const geht=Math.sin(S.t*TUNE.joggerTempo*3+i)>0;
      sprite(rows,effX-Math.round(rows[0].length/2),y);
    } else sprite(rows,effX-Math.round(rows[0].length/2),y);
    if(!S.hinTreffer[i]&&Math.abs(effX-S.x)<40&&Math.floor(S.t*5)%2===0){
      text('!',effX-1,y-9,P.rot);
    }
  }

  /* Ziel: die eigene Haustuer */
  {
    const rows=SPR.haustuer, y=BODEN-rows.length;
    outline(rows,ZIEL_X-4,y,1,.6); sprite(rows,ZIEL_X-4,y);
    const nah=Math.abs(S.x-ZIEL_X)<120;
    text('ZUHAUSE',ZIEL_X+4-textW('ZUHAUSE')/2,y-9,nah?P.gold:P.dunkel);
  }

  /* Spieler */
  let rows;
  if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  outline(rows,S.x-3,S.y-rows.length,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,S.y-rows.length); else sprite(rows,S.x-3,S.y-rows.length);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),BODEN,7,1); ctx.globalAlpha=1;

  ctx.restore();
}

/* Die Sonne wird pixelig aus Reihen gezeichnet statt aus einem Canvas-
   Gradient - passt besser zum Rest der Optik und muss nicht mit wechselnder
   Position/Farbe gecacht werden (waere sonst ein wachsender Cache pro Frame). */
function zeichneSonne(x,y,t){
  const farbe = t<0.35?'#fff4c2':t<0.65?'#ffd447':'#ff8a3d';
  ctx.globalAlpha=.18;
  ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
}

/* ---- HUD ---- */
function hud(){
  /* Sonnenanzeige - der eigentliche Gegner dieses Levels */
  const bw=90,bx=(W-bw)/2,by=6, l=S.licht/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=l<.5?P.neon2:l<.8?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*l),4);
  text('SONNE',bx+(bw-textW('SONNE'))/2,by+6,l>0.8&&Math.floor(S.t*4)%2===0?P.rot:P.dunkel);

  /* Fortschritt zur Haustuer */
  const fbw=50, fbx=W-fbw-6, fby=6;
  const frac=Math.max(0,Math.min(1,S.x/ZIEL_X));
  ctx.fillStyle='#000a'; ctx.fillRect(fbx-2,fby-2,fbw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(fbx,fby,fbw,4);
  ctx.fillStyle=P.gruen; ctx.fillRect(fbx,fby,Math.round(fbw*frac),4);
  text('HEIMWEG',fbx+(fbw-textW('HEIMWEG'))/2,fby+6,P.dunkel);

  /* Restpegel, falls noch da */
  if(S.pegel>2){
    const pbw=40,pbx=6,pby=6;
    ctx.fillStyle='#000a'; ctx.fillRect(pbx-2,pby-2,pbw+4,8);
    ctx.fillStyle='#2a2440'; ctx.fillRect(pbx,pby,pbw,4);
    ctx.fillStyle=P.neon2; ctx.fillRect(pbx,pby,Math.round(pbw*S.pegel/100),4);
    text('PEGEL',pbx+(pbw-textW('PEGEL'))/2,pby+6,P.dunkel);
  }

  if(S.licht>80&&Math.floor(S.t*3)%2===0) textC('DIE SONNE GEHT AUF',H-42,P.rot);

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
}

function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('DURCHGESPIELT',30,P.gold,2);
      textC('DU BIST ZUHAUSE. DIE SONNE WAR ZU LANGSAM.',52,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),70,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',80,P.gold);
      const crew=ladeCrew();
      textC(crew.length?'MIT DABEI: '+crew.join(', '):'GANZ ALLEIN DURCH DIE NACHT',94,P.neon2);
      textC('DIE NACHT IST VORBEI.',108,P.dim);
      if(Math.floor(S.t*2)%2===0)
        textGlowC(IS_TOUCH?'TIPPEN: GANZES SPIEL NEU STARTEN':'E: GANZES SPIEL NEU STARTEN',132,P.gruen,1);
      text(IS_TOUCH?'ODER TIPPEN (SPR): NUR DIESES LEVEL':'ODER LEERTASTE: NUR DIESES LEVEL',
        (W-textW('ODER LEERTASTE: NUR DIESES LEVEL'))/2,144,P.dunkel);
    } else {
      textGlowC('ERWISCHT',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}


/* ==========================================================================
   DER GROSSE FIGHT
   Die Gruppe, die euch seit dem Club verfolgt, stellt euch auf dem Heimweg.

   Drei Phasen, und die Arena wechselt mit jeder: Strasse, Hinterhof,
   Baustelle. Jede Phase bringt etwas dazu, das die vorige Antwort entwertet -
   in Phase 2 Handlanger, die dich einkreisen, in Phase 3 unblockbare
   Angriffe und Wuerfe. Nur Blocken reicht dann nicht mehr.

   Verlieren beendet das Spiel NICHT. Es kostet Licht-Vorsprung fuer den
   Heimweg und faerbt das Ende ein.
   ========================================================================== */
const KAMPF8 = {
  /* (1) DER ANFUEHRER */
  anfuehrerHp:      9,
  anfuehrerReich:  19,
  schwungWindup: 0.95, schwungSchlag: 0.22,
  jabWindup:     0.48, jabSchlag:     0.14,
  rammeWindup:   0.72, rammeSchlag:   0.28,
  wurfWindup:    0.85, wurfSchlag:    0.16,
  pause:         0.80,
  pauseKuerzerProPhase: 0.20,
  windupKuerzerProPhase:0.10,

  /* (2) HANDLANGER - ab Phase 2, sie kreisen dich ein */
  handlangerAb:     2,
  handlangerAnzahl: 2,

  /* (3) FLASCHEN - ab Phase 3, kommen geflogen */
  flascheTempo:   122,
  wurfAb:          58,   // ab dieser Entfernung wirft er statt zu schlagen
  flascheSchaden:   1,

  /* (4) DEINE CREW - wer dich mag, geht dazwischen */
  hilfeIntervall: 5.5,   // Sekunden zwischen zwei Einmischungen
  hilfeBetaeubung: 1.0,

  /* (5) ARENA */
  arenaLinks:   18,
  arenaRechts:  22,
  tiefeHinten: 118,
  tiefeVorne:  152,
  gehTempo:     78,

  /* (6) NIEDERLAGE - kein Spielende, nur ein schwererer Heimweg */
  lichtStrafeBeiNiederlage: 22,
};

const ARENEN = [
  { name:'DIE STRASSE',   himmel:'#12101f', boden:'#1d1728', kante:'#3a2f4e' },
  { name:'DER HINTERHOF', himmel:'#0f1418', boden:'#18201c', kante:'#2e3a32' },
  { name:'DIE BAUSTELLE', himmel:'#1a1410', boden:'#241c14', kante:'#4a3720' },
];

function phase8(){
  const g=S.gegner; if(!g) return 1;
  const a=g.hp/KAMPF8.anfuehrerHp;
  return a<=0.34?3:a<=0.67?2:1;
}

function starteGrossenKampf(){
  S.modus='kampf';
  document.documentElement.classList.add('kampf');
  setzeTiefenband(KAMPF8.tiefeHinten,KAMPF8.tiefeVorne);
  S.spielerK=kaempfer({ x:70, t:0.5, blick:1, hp:3, maxHp:3 });
  S.gegner=kaempfer({ x:210, t:0.5, blick:-1, art:'anfuehrer',
    hp:KAMPF8.anfuehrerHp, maxHp:KAMPF8.anfuehrerHp,
    reichweite:KAMPF8.anfuehrerReich, pauseT:1.2, vorZustand:'frei' });
  S.handlanger=[]; S.flaschen=[]; S.arena=0; S.arenaWechselT=0;
  S.hilfeT=KAMPF8.hilfeIntervall; S.hilfeText='';
  S.blockAn=false;
  zeigeHinweis('E SCHLAGEN - SHIFT BLOCKEN - LEER AUSWEICHEN',4);
  meldung('DIE HABEN AUF EUCH GEWARTET',2);
}

function wechsleArena(neu){
  S.arena=neu; S.arenaWechselT=1.6;
  S.flaschen.length=0;
  meldung(ARENEN[neu].name,2);
  SFX.aua();
  /* Handlanger tauchen auf, sobald es in den Hinterhof geht. */
  if(neu+1>=KAMPF8.handlangerAb && !S.handlanger.length){
    for(let i=0;i<KAMPF8.handlangerAnzahl;i++)
      S.handlanger.push(gegner(i===0?'flitzer':'schlaeger',
        i===0?250:30, i===0?0.2:0.8));
  }
}

/* ---- Der Anfuehrer ---- */
function naechsterAngriff8(g){
  const ph=phase8();
  /* 'wurf' steht bewusst NICHT hier drin: der wird in anfuehrerTakt nach
     Entfernung gewaehlt. Im Test hat er sonst aus zwei Pixeln Entfernung
     geworfen - die Flasche traf im selben Bild, ohne Ausweichfenster. */
  let moeglich=['schwung','jab'];
  if(ph>=2) moeglich.push('ramme');
  if(ph>=3) moeglich.push('ramme');
  let art=pick(moeglich);
  if(g.letzteArt===art) g.serie=(g.serie||0)+1; else g.serie=0;
  if(g.serie>=2){ art=pick(moeglich.filter(a=>a!==art)); g.serie=0; }
  g.letzteArt=art;
  return art;
}
function starteAngriff8(g,art){
  const ph=phase8();
  const k=1-(ph-1)*KAMPF8.windupKuerzerProPhase;
  g.art=art;
  g.ausholenDauer=(art==='schwung'?KAMPF8.schwungWindup
                  :art==='jab'?KAMPF8.jabWindup
                  :art==='ramme'?KAMPF8.rammeWindup:KAMPF8.wurfWindup)*k;
  g.schlagDauer=(art==='schwung'?KAMPF8.schwungSchlag
                :art==='jab'?KAMPF8.jabSchlag
                :art==='ramme'?KAMPF8.rammeSchlag:KAMPF8.wurfSchlag);
  g.unblockbarJetzt=(art==='ramme');
  g.fensterAnteil=KAMPF.konterAnteil;
  g.zustand='ausholen'; g.zT=0; g.trefferGesetzt=false;
  SFX.aua();
}
function anfuehrerTakt(dt,ziel){
  const g=S.gegner;
  kaempferTakt(g,dt);
  if(g.hp<=0) return;
  g.blick=Math.sign(ziel.x-g.x)||g.blick;

  if(g.art==='ramme'){
    if(g.zustand==='ausholen') g.x+=g.blick*30*dt;
    if(g.zustand==='schlag')   g.x+=g.blick*165*dt;
  }
  /* Der Wurf loest beim Schlag eine Flasche aus, kein Nahkampftreffer. */
  if(g.art==='wurf'&&g.zustand==='schlag'&&!g.trefferGesetzt){
    g.trefferGesetzt=true;
    S.flaschen.push({x:g.x,t:g.t,vx:g.blick*KAMPF8.flascheTempo});
  }

  if(g.zustand==='frei'&&g.vorZustand!=='frei')
    g.pauseT=Math.max(0.22,KAMPF8.pause-(phase8()-1)*KAMPF8.pauseKuerzerProPhase);
  g.vorZustand=g.zustand;
  if(g.zustand!=='frei') return;

  g.pauseT-=dt;
  const dx=ziel.x-g.x, dtf=(ziel.t||0)-(g.t||0);
  const abstand=Math.abs(dx);

  /* Ab Phase 3 bleibt er auch mal weg und wirft. Die Flasche braucht dann
     eine halbe Sekunde - Zeit genug, um zur Seite oder in die Tiefe zu gehen. */
  if(g.pauseT<=0 && phase8()>=3 && abstand>KAMPF8.wurfAb){
    starteAngriff8(g,'wurf'); return;
  }

  const zuWeit=abstand>g.reichweite*0.8||Math.abs(dtf)>KAMPF.tiefeToleranz*0.8;
  if(g.pauseT>0||zuWeit){
    if(abstand>g.reichweite*0.75) g.x+=Math.sign(dx)*52*dt;
    if(Math.abs(dtf)>0.05) bewegeTiefe(g,Math.sign(dtf),dt,TIEFE.tempo*0.6,9);
    return;
  }
  starteAngriff8(g,naechsterAngriff8(g));
}

/* ---- Deine Crew mischt sich ein ----
   Wer dabei ist und dich mag, geht dazwischen. Wen du versetzt hast,
   schaut zu. Beziehung kommt aus nacht.js, Crew aus stand.js. */
function crewHilfeTakt(dt){
  const crew=ladeCrew();
  if(!crew.length) return;
  S.hilfeT-=dt;
  if(S.hilfeT>0) return;
  S.hilfeT=KAMPF8.hilfeIntervall;
  const willig=crew.filter(n=>beziehung(n)>=-20);
  if(!willig.length){ meldung('KEINER GEHT DAZWISCHEN',1.4); return; }
  const wer=pick(willig);
  /* Lieber einen Handlanger aufhalten als den Anfuehrer. */
  const ziel=S.handlanger.find(h=>h.hp>0)||S.gegner;
  ziel.zustand='getroffen'; ziel.betaeubt=KAMPF8.hilfeBetaeubung;
  S.hilfeText=wer+' GEHT DAZWISCHEN';
  meldung(S.hilfeText,1.6);
}

function kampf8(dt){
  kampfStopTakt(dt);
  const zdt=dt*kampfZeitFaktor();
  if(zdt<=0) return;
  const s=S.spielerK, g=S.gegner;

  if(S.arenaWechselT>0){ S.arenaWechselT-=zdt; return; }

  /* ---- Eingabe ---- */
  if(rolleGedrueckt){
    rolleGedrueckt=false;
    const r=(runterAn?1:0)-(hochAn?1:0);
    rolle(s,r||(s.t<0.5?1:-1));
  }
  blocke(s,!!S.blockAn && aktionPuffer.length===0);
  if(s.zustand==='frei'||s.zustand==='block'){
    const rx=(rechtsAn?1:0)-(linksAn?1:0);
    const langsamer=s.zustand==='block'?0.45:1;
    if(rx){ s.x+=rx*KAMPF8.gehTempo*langsamer*zdt; s.blick=rx; }
    const rt=(runterAn?1:0)-(hochAn?1:0);
    bewegeTiefe(s,rt,zdt,TIEFE.tempo*langsamer);
  }
  s.x=Math.max(KAMPF8.arenaLinks,Math.min(W-KAMPF8.arenaRechts,s.x));

  while(aktionPuffer.length){
    aktionPuffer.shift();
    if(s.ausdauer<KAMPF.ausdauerSchlag){ meldung('AUSSER PUSTE',0.9); continue; }
    /* Konter zuerst - gegen den Anfuehrer und gegen jeden Handlanger. */
    let gekontert=konterVersuch(s,g,{schaden:2,unblockbar:g.unblockbarJetzt});
    if(!gekontert){
      for(const h of S.handlanger){
        if(h.hp>0&&konterVersuch(s,h,{schaden:2})){ gekontert=true; break; }
      }
    }
    if(gekontert){ S.ruettel=5; SFX.warn(); meldung(pick(['SITZT','KONTER','BAM']),1.0); continue; }
    schlage(s);
  }

  kaempferTakt(s,zdt);
  anfuehrerTakt(zdt,s);
  for(const h of S.handlanger) if(h.hp>0) gegnerTakt(h,zdt,s,{tempoFaktor:0.9});
  crewHilfeTakt(zdt);

  /* ---- Flaschen ---- */
  for(const f of S.flaschen){ f.x+=f.vx*zdt; }
  S.flaschen=S.flaschen.filter(f=>{
    if(Math.abs(f.x-s.x)<7&&Math.abs(f.t-s.t)<=KAMPF.tiefeToleranz){
      if(s.unverwundbar<=0&&s.zustand!=='rolle'){
        s.hp-=KAMPF8.flascheSchaden; s.unverwundbar=KAMPF.unverwundbarNachTreffer;
        S.ruettel=5; SFX.aua(); meldung('FLASCHE',1.1);
      }
      return false;
    }
    return f.x>-10&&f.x<W+10;
  });

  /* ---- Treffer ---- */
  if(s.zustand==='schlag'&&!s.trefferGesetzt){
    let r=loeseTreffer(s,g,{schaden:1});
    if(!r) for(const h of S.handlanger){ if(h.hp>0){ r=loeseTreffer(s,h,{schaden:1}); if(r) break; } }
    if(r==='treffer'){ S.ruettel=3; SFX.warn(); }
    else if(r==='block') meldung('GEBLOCKT',0.7);
  }
  if(g.zustand==='schlag'&&g.art!=='wurf'&&!g.trefferGesetzt){
    const r=loeseTreffer(g,s,{schaden:1,unblockbar:g.unblockbarJetzt,
      reichweite:g.reichweite,betaeubung:0.35});
    if(r==='treffer'||r==='gardebruch'){ S.ruettel=6; SFX.aua();
      meldung(g.art==='ramme'?'UMGERANNT':'VOLL DRAUF',1.2); }
    else if(r==='block'){ S.ruettel=2; meldung('GEBLOCKT',0.7); }
    else if(r==='daneben') meldung('AUSGEWICHEN',0.9);
  }
  for(const h of S.handlanger){
    if(h.hp>0&&h.zustand==='schlag'&&!h.trefferGesetzt){
      const r=loeseTreffer(h,s,{schaden:1,reichweite:h.reichweite});
      if(r==='treffer'||r==='gardebruch'){ S.ruettel=4; SFX.aua(); meldung('VON HINTEN',1.0); }
    }
  }

  /* ---- Phasenwechsel ---- */
  const ph=phase8();
  if(ph-1>S.arena) wechsleArena(ph-1);

  /* ---- Ausgang ---- */
  if(s.hp<=0){ beendeGrossenKampf(false); return; }
  if(g.hp<=0){ beendeGrossenKampf(true); return; }
}

function beendeGrossenKampf(gewonnen){
  document.documentElement.classList.remove('kampf');
  S.kampfGewonnen=gewonnen;
  setzeFlag(gewonnen?'fightGewonnen':'fightVerloren');
  if(gewonnen){
    meldung('ER BLEIBT LIEGEN',2.2); SFX.sieg();
    aendereWert('ruf',12);
  } else {
    meldung('IHR KOMMT GERADE SO WEG',2.2); SFX.aua();
    aendereWert('ruf',-8);
    S.licht=Math.min(95,S.licht+KAMPF8.lichtStrafeBeiNiederlage);
  }
  S.modus='spiel';
  zeigeHinweis(gewonnen?'UND JETZT NACH HAUSE':'LOS - BEVOR DIE SONNE DA IST',3);
}

/* ---- Zeichnen ---- */
function zeichneKampf8(){
  const A=ARENEN[S.arena], s=S.spielerK, g=S.gegner;
  ctx.fillStyle=A.himmel; ctx.fillRect(0,0,W,H);

  /* Kulisse je Arena - grob, aber klar unterscheidbar */
  ctx.fillStyle='#00000033';
  for(let i=0;i<6;i++){
    const bx=(i*61)%W, bh=30+((i*37)%40);
    ctx.fillRect(bx,bodenY(0)-bh-16,44,bh);
  }
  if(S.arena===1){ ctx.fillStyle='#232c26';
    for(let i=0;i<4;i++) ctx.fillRect(20+i*74,bodenY(0)-26,16,26); }
  if(S.arena===2){ ctx.fillStyle='#5a4420';
    for(let i=0;i<5;i++){ ctx.fillRect(14+i*62,bodenY(0)-34,3,34); ctx.fillRect(14+i*62,bodenY(0)-34,26,3); } }

  ctx.fillStyle=A.boden; ctx.fillRect(0,bodenY(0)-2,W,H-bodenY(0)+2);
  ctx.fillStyle=A.kante; ctx.fillRect(0,bodenY(0)-2,W,1);
  ctx.fillStyle='#00000044'; ctx.fillRect(0,bodenY(1)+3,W,H-bodenY(1));

  const liste=[];
  const malKaempfer=(k,spr,tintBlock,grundTint)=>({t:k.t, mal:()=>{
    const y=bodenY(k.t)-spr.length+(k.zustand==='rolle'?3:0);
    bodenSchatten(k,7,.3);
    const blinkt=k.unverwundbar>0&&Math.floor(S.t*18)%2===0;
    const tint=k.zustand==='block'?tintBlock:(blinkt?'#ffffff':
               (k.zustand==='getroffen'?'#ff8080':grundTint));
    outline(spr,k.x-3,y,1,.6);
    if(k.blick<0) spriteFlip(spr,k.x-3,y,1,tint); else sprite(spr,k.x-3,y,1,tint);
    if(k.zustand==='ausholen'&&Math.floor(S.t*10)%2===0)
      text('!',k.x,y-9,k.unblockbarJetzt?P.gold:P.rot);
  }});
  /* Ohne eigene Faerbung sehen Anfuehrer, Handlanger und du identisch aus -
     im Gewuehl von Phase 2 war nicht mehr erkennbar, wen man schlaegt. */
  liste.push(malKaempfer(s,SPR.steh,'#42d9ff',null));
  liste.push(malKaempfer(g,SPR.steh,'#42d9ff','#c8324a'));
  for(const h of S.handlanger) if(h.hp>0) liste.push(malKaempfer(h,SPR.steh,'#42d9ff','#7a5a86'));
  for(const f of S.flaschen) liste.push({t:f.t, mal:()=>{
    ctx.fillStyle=P.gruen; ctx.fillRect(Math.round(f.x),Math.round(bodenY(f.t)-9),2,3); }});
  zeichneNachTiefe(liste);

  /* Anfuehrer heben wir farblich ab, damit man ihn im Gewuehl findet */
  ctx.fillStyle=P.rot; ctx.fillRect(Math.round(g.x-2),Math.round(bodenY(g.t)-20),5,1);
}

function hudKampf8(){
  const s=S.spielerK, g=S.gegner;
  for(let i=0;i<s.maxHp;i++){
    const x=6+i*7,y=6, voll=i<Math.ceil(s.hp);
    ctx.fillStyle=voll?P.rot:'#2a2440';
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  const bw=46,bx=6,by=14;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-1,by-1,bw+2,5);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,3);
  ctx.fillStyle=s.ausdauer<KAMPF.ausdauerSchlag?P.rot:P.gruen;
  ctx.fillRect(bx,by,Math.round(bw*s.ausdauer/KAMPF.ausdauerMax),3);

  const gw=70,gx=Math.round(W/2-gw/2);
  ctx.fillStyle='#000a'; ctx.fillRect(gx-1,5,gw+2,6);
  ctx.fillStyle=P.rot; ctx.fillRect(gx,6,Math.round(gw*Math.max(0,g.hp)/g.maxHp),4);
  textC('DER ANFUEHRER',14,P.dim);
  const ph='PHASE '+phase8()+'  '+ARENEN[S.arena].name;
  text(ph,W-textW(ph)-6,6,phase8()>1?P.gold:P.dunkel);

  if(S.arenaWechselT>0) textGlowC(ARENEN[S.arena].name,H/2-4,P.gold,2);
  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
}
