   zusaetzlich Licht, wenn du sie nicht ueberspringst.

const BASS=[110,0,110,0, 98,0,98,0, 87,0,87,0, 98,0,110,0];

function musik(){
  if(!AC||muted||S.modus==='pause') return;
  const drang=Math.min(1,S.licht/100);
  const st=60/(112+drang*40)/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut=S.modus==='spiel'?.02+drang*.02:.012;
    if(f) ton(f,MUS.next,st*.85,'square',laut);
    if(S.modus==='spiel'&&i%4===0) ton(55,MUS.next,.09,'sine',.045);
    MUS.next+=st; MUS.step++;
  }
}

const SCHATTEN=[
  { von:300,  bis:750,  art:'baum',   label:'BAEUME' },
  { von:1550, bis:2050, art:'tunnel', label:'UNTERFUEHRUNG' },

  { von:3400, bis:3800, art:'baum',   label:'BAEUME' },
  { von:4300, bis:4700, art:'haus',   label:'HAUSSCHATTEN' },
];
function schattenBei(x){
  for(const z of SCHATTEN) if(x>=z.von&&x<z.bis) return z;
  return null;
}
function lichtFaktorBei(x){
  const z=schattenBei(x);
  if(!z) return 1;
  return z.art==='tunnel'?TUNE.tunnelFaktor:TUNE.schattenFaktor;
}

/* Wer abbiegt: nur Crew-Figuren, je ein Slot in der festen Reihenfolge. MAX FERDI
   und MORITZ biegen nie ab. Slots ohne Crew-Figur entfallen. */

function abbiegungenPlanen(){
  const crew=ladeCrew();
  const plan=ABBIEGER.filter(n=>crew.includes(n)).slice(0,TUNE.abbiegeBei.length)
    .map((name,i)=>({ name, x:Math.round(TUNE.abbiegeBei[i]*ZIEL_X), erledigt:false }));
  return { plan, fenster:null, steht:0, figur:null };
}

let linksAn=false, rechtsAn=false, sprungAn=false, aktionGehalten=false;
let sprungPuffer=[], aktionPuffer=[];

function druckSprung(){
  ensureAudio();
  if(erzaehlTaste()) return;
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene'||S.modus==='finale') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  if(erzaehlTaste()) return;
  if(typeof gespraechAktiv==='function'&&gespraechAktiv()){ ensureAudio(); gespraechBestaetigen(); return; }
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){
    /* Kein Level 9 - E fuehrt zurueck zum Anfang des GANZEN Spiels.
       Leertaste (druckSprung) startet stattdessen nur dieses Level neu. */
    if(S.gewonnen){ location.href='index.html'; return; }
    neuesSpiel(); return;
  }
  /* Finale und Abspann: jede Karte ist antippbar. */
  if(S.modus==='finale'){ finaleTippen(); return; }
  if(S.modus==='cutscene'){ if(S.szeneT>=TUNE.abspannFrei) S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
/* Was P in diesem Level heisst. nacht/eingabe.js ruft es auf. */
function pauseTaste(){
  if(S.modus==='spiel'||S.modus==='pause') S.modus=S.modus==='spiel'?'pause':'spiel';
}

addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['KeyE','Enter'].includes(e.code)) aktionGehalten=false;
  if(e.code==='Space') sprungAn=false; });
let rolleGedrueckt=false, hochAn=false, runterAn=false;

/* Knopf-Aufschriften fuer nacht/mobil.js. Im Kampf sind es andere Knoepfe
   als auf dem Heimweg - vorher zeigte das Handy im Finale SPRUNG und keinen
   Blockknopf. */
function mobilKontext(){
  const ek=(typeof erzaehlKontext==='function')?erzaehlKontext():null; if(ek) return ek;
  if(S.modus==='titel')    return {aktion:'START',  zwei:null};
  if(S.modus==='intro'||S.modus==='cutscene'||S.modus==='finale') return {aktion:'WEITER', zwei:null};
  /* Endbildschirm: E (Aktion) = ganzes Spiel neu, Leertaste (zwei) = nur dieses Level. */
  if(S.modus==='ende')     return S.gewonnen?{aktion:'GANZ NEU', zwei:'LEVEL 8'}:{aktion:'NOCHMAL', zwei:null};
  /* Das Abbiegefenster blendet TSCHUESS ein - ruhig, ohne Blinken. */
  if(S.modus==='spiel'&&S.abb&&S.abb.fenster) return {aktion:'TSCHUESS', zwei:'SPRUNG'};
  if(S.modus==='pause')    return {aktion:null, zwei:null};
  if(S.modus==='kampf')    return {aktion:'SCHLAG', zwei:'ROLLE', block:true};
  return {aktion:null, zwei:'SPRUNG'};
}
addEventListener('keydown',e=>{
  if(['ShiftLeft','ShiftRight'].includes(e.code)){ e.preventDefault(); if(S) S.blockAn=true; }
  /* Die Ausweichrolle lag bisher NUR auf dem alten Touch-Knopf - auf der
     Tastatur gab es sie im Finale gar nicht. Leertaste wie in Level 3 und 4. */
  if(e.code==='Space'&&S&&S.modus==='kampf'){ e.preventDefault(); rolleGedrueckt=true; }
  if(['ArrowUp','KeyW'].includes(e.code)) hochAn=true;
  if(['ArrowDown','KeyS'].includes(e.code)) runterAn=true;
});
addEventListener('keyup',e=>{
  if(['ShiftLeft','ShiftRight'].includes(e.code)&&S) S.blockAn=false;
  if(['ArrowUp','KeyW'].includes(e.code)) hochAn=false;
  if(['ArrowDown','KeyS'].includes(e.code)) runterAn=false;
});

  { d:2.4, txt:'ALSO LOS. NACH HAUSE. VOR DER SONNE.' },
];
function starte(){ neuesSpiel(); kapitelZeigen(8); S.modus='intro'; S.szene=0; S.szeneT=0; piep(330,.1,'sine',.04); }
function starteLevel(){ starteKonfrontation(); return;
  /* alter Direkteinstieg, bleibt fuer Tests erreichbar */
  S.modus='spiel'; zeigeHinweis('LAUF NACH HAUSE - MEIDE DIE SONNE',3);
  piep(660,.08); setTimeout(()=>piep(990,.12),90); }
const INTRO_SKIP=0.5;   // so lange halten, dann ist das Intro vorbei
function intro(dt){ S.szeneT+=dt;
  /* Halten ueberspringt das ganze Intro, Tippen eine Szene. Level 1 hat
     sieben Szenen - beim zweiten Durchlauf war das siebenmal tippen. */
  if(aktionGehalten){ S.skipT=(S.skipT||0)+dt; if(S.skipT>INTRO_SKIP){ starteLevel(); return; } }
  else S.skipT=Math.max(0,(S.skipT||0)-dt*2);
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function pruefeSonne(){
  if(S.licht<100||S.modus==='ende') return false;
  /* Wer auf den Sonnenaufgang wartet, verliert nicht gegen die Sonne - er
     sieht sie. Die Nacht endet dann genau hier. */
  if(endeWeg()==='sonne'){ starteFinale(); return true; }
  S.modus='ende'; S.gewonnen=false;
  S.faenger='DIE SONNE HAT DICH ERWISCHT.'; SFX.erwischt();
  return true;
}
function pruefeZiel(){
  if(S.x<ZIEL_X||!S.amBoden||S.modus==='ende') return false;
  starteFinale();
  return true;
}

/* ==========================================================================
   ABBIEGUNGEN
   Die Crew biegt nach und nach ab. Wer stehenbleibt, um Tschuess zu sagen,
   verliert Sonne: das ist die Frage der Nacht als Mechanik. Freiwillig, keine
   Strafe fuer Durchlaufen. Nur Figuren der Crew; sonst gibt es im Wettlauf
   keine Crew-Sprites und keine Crew-Bewegung.
   ========================================================================== */
const sonneVorsprungOk=()=>S.licht<100-TUNE.abbiegeVorsprung*100/TUNE.lichtDauerBasis;
/* Wie hell ist es bei der Haustuer, wenn man ab hier ohne Pause und ohne
   Treffer weiterlaeuft? (Schatten eingerechnet, Anlauf 5 % Aufschlag.) */
function lichtBeiAnkunft(x,l){
  const v=TUNE.gehTempo*tempoBonus()*.95;
  for(let px=x;px<ZIEL_X;px+=20) l+=(100/TUNE.lichtDauerBasis)*lichtFaktorBei(px)*(20/v);
  return l;
}
/* Ein Abschied darf den Heimweg nicht unschaffbar machen: nach den Kosten muss
   noch eine Reserve an Sonne bleiben, sonst biegt der Abbieger grusslos ab. */
const abschiedLeistbar=x=>lichtBeiAnkunft(x,S.licht+TUNE.abbiegeKosten*100/TUNE.lichtDauerBasis)
  <=100-TUNE.abbiegeReserve*100/TUNE.lichtDauerBasis;

function abbiegeTakt(dt){
  const A=S.abb; if(!A) return;
  if(A.steht>0) A.steht=Math.max(0,A.steht-dt);
  if(A.figur){ A.figur.rest-=dt; if(A.figur.rest<=0) A.figur=null; }
  if(A.fenster){
    A.fenster.rest-=dt;
    if(aktionPuffer.length){ tschuessRufen(A.fenster.name); return; }
    if(A.fenster.rest<=0){ A.fenster=null; S.hinweisT=Math.min(S.hinweisT,0); }
    return;
  }
  const p=A.plan.find(e=>!e.erledigt&&S.x>=e.x);
  if(!p) return;
  p.erledigt=true;
  /* Zu wenig Sonne-Vorsprung: der Abbieger geht grusslos. */
  if(!sonneVorsprungOk()||!abschiedLeistbar(S.x)) return;
  const dauer=flag('kiraTschuess')?TUNE.abbiegeFensterKira:TUNE.abbiegeFenster;
  A.fenster={ name:p.name, rest:dauer, gesamt:dauer };
  A.figur={ name:p.name, rest:dauer };
  PLAUSCH.sag(p.name,'HIER LANG. BIS GLEICH.');
  zeigeHinweis(IS_TOUCH?'TSCHUESS RUFEN':'E: TSCHUESS',dauer);
}

/* Das Wort zum Abschied. Je Figur ein Zweig mit literalem Flag-Namen, damit
   flagcheck ihn liest. */
function tschuessRufen(name){
  const A=S.abb;
  A.fenster=null; A.steht=TUNE.abbiegeKosten; A.figur={ name, rest:TUNE.abbiegeKosten };
  S.hinweisT=0; S.vx=0;
  const b=TUNE.abbiegeBeziehung;
  if(name==='DENNIS'){ wirke({flag:'tschuess_dennis', mag:['DENNIS',b]}); PLAUSCH.sag('DENNIS','PASST.'); }
  else if(name==='SEMIH'){ wirke({flag:'tschuess_semih', mag:['SEMIH',b]}); PLAUSCH.sag('SEMIH','ICH RUF AN. KENN DEINE NUMMER.'); }
  else if(name==='JONAS'){ wirke({flag:'tschuess_jonas', mag:['JONAS',b]}); PLAUSCH.sag('JONAS','EHRLICH? ICH SCHREIB DIR.'); }
  else if(name==='LEA'){ wirke({flag:'tschuess_lea', mag:['LEA',b]}); PLAUSCH.sag('LEA','SEITE 9. WARTE AB.'); }
  else if(name==='TOBI'){ wirke({flag:'tschuess_tobi', mag:['TOBI',b]}); PLAUSCH.sag('TOBI','05:17. BRUECKE. FALLS DU FRAGST.'); }
  piep(392,.07,'sine',.04);
}

function update(dt){
  /* Im Wettlauf darf geplauscht werden, sonst nicht (nacht/erzaehl.js). */
  PLAUSCH.sperre=S.modus!=='spiel';
  if(erzaehlTakt(dt)) return;
  S.t+=dt; musik();
  if(typeof gespraechAktiv==='function'&&gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='kampf'){ kampf8(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); return; }
  if(S.modus==='finale'){ finale(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);
  abbiegeTakt(dt);
  const steht=S.abb&&S.abb.steht>0;

  /* --- Bewegung (gleiches Gefuehl wie in Level 2) --- */
  const richtung=steht?0:(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*tempoBonus()*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  if(steht) S.vx=0;     // Tschuess sagen: Tempo 0
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));

  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  /* Reine Menue-Eingaben in diesem Modus ignorieren (kein Reden/Suchen hier) */
  aktionPuffer.length=0;

  /* --- Die Sonne steigt, im Schatten langsamer --- */
  const faktor=lichtFaktorBei(S.x);
  S.licht=Math.min(100,S.licht+(100/TUNE.lichtDauerBasis)*faktor*dt);

  /* --- Hindernisse: einmaliger Treffer, wenn nicht hoch genug gesprungen --- */
  for(let i=0;i<HINDERNISSE.length;i++){
    if(S.hinTreffer[i]||steht) continue;
    const o=HINDERNISSE[i];
    const effX=o.art==='jogger'?o.x+Math.sin(S.t*TUNE.joggerTempo+i)*TUNE.joggerAmplitude:o.x;
    const breite=HIND_BREITE[o.art]||6;
    if(Math.abs(S.x-effX)<TUNE.hindernisRadius+breite*.3&&S.y>BODEN-TUNE.hindernisHoehe){
      S.hinTreffer[i]=true;
      S.licht=Math.min(100,S.licht+TUNE.hindernisStrafe);
      S.ruettel=TUNE.hindernisRuettel;   // Zeichnen: FX.wackel
      S.vx-=Math.sign(S.vx||1)*TUNE.hindernisKnockback;
      SFX.aua(); meldung(pick(['AUA','MIST','VORSICHT']),1.2);
    }
  }

  if(pruefeZiel()){ kamera(dt); return; }
  if(pruefeSonne()){ kamera(dt); return; }
  kamera(dt);
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   FINALE: SCHICHTWECHSEL
   Ziel erreicht (oder: auf den Sonnenaufgang gewartet). Eine Kartenfolge, ca.
   75 Sekunden, jede Karte antippbar, E halten springt zum Abspann. Wahlen

};
const finDauer=txt=>Math.max(TUNE.finaleSchrittMin,TUNE.finaleBasis+TUNE.finaleJeZeichen*String(txt).replace(/\|/g,'').length);

  else wahl({ start:{ wer:'UNBEKANNT', text:'WIR SEHEN EUCH.', zeit:0, wahl:[

  else karte('ALI: KEINE TUETE. EGAL. GESICHT HAB ICH.',{ d:3.4 });

  wahl({ start:{ wer:'MORITZ', text:'TSCHUESS.', zeit:0, wahl:[

function starteFinale(){
  if(S.modus==='finale'||S.modus==='cutscene'||S.modus==='ende') return;
  S.modus='finale'; S.vx=0; S.skipT=0; S.hinweisT=0; S.meldungT=0;
  S.abb.fenster=null; S.abb.figur=null;
  S.fin={ i:-1, t:0, d:0, st:null, ort:endeWeg(), hell:66, marvin:false, baeckerin:false, ali:false,
          maxSitzt:false, dreh:false, steps:[] };
  S.fin.steps=finaleSteps();
  finaleWeiter();
}
function finaleWeiter(){
  const F=S.fin; if(!F) return;
  for(;;){
    F.i++;
    const st=F.steps[F.i];
    if(!st){ starteCutscene(); return; }
    if(st.wenn&&!st.wenn()) continue;
    F.st=st; F.t=0; F.d=st.auto?0:(st.d||0);
    if(st.tu) st.tu();
    if(st.wahl){
      starteGespraech(st.wahl,'start',()=>finaleWeiter());
      return;
    }
    return;
  }
}
/* Tippen: die Karte ist durch. Eine kurze Sperre, damit ein Doppeltipp nicht
   gleich zwei Karten schluckt. */
function finaleTippen(){
  const F=S.fin; if(!F||!F.st||F.st.wahl) return;
  if(F.t>=TUNE.finaleFrei) F.t=F.d;
}
function finale(dt){
  const F=S.fin; if(!F) return;
  F.t+=dt;
  /* Der Himmel hellt ruhig auf: nur Interpolation, kein Flackern. */
  const ziel=66+34*Math.min(1,Math.max(0,F.i)/Math.max(1,F.steps.length-1));
  F.hell+=(ziel-F.hell)*Math.min(1,dt*.8);
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>TUNE.ueberspringen){ starteCutscene(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  if(F.st&&!F.st.wahl&&F.t>=F.d) finaleWeiter();
}

/* ==========================================================================
   ABSPANN
   ========================================================================== */
function starteCutscene(){
  if(S.modus==='cutscene'||S.modus==='ende') return;
  /* Das Ende zaehlt, sobald der Abspann beginnt - dann stimmt auch die Zahl
     auf der Karte ENDEN GESEHEN. */
  if(!S.registriert){ S.registriert=true; endeRegistrieren(endeTitel()); }
  S.fin=null;
  S.szenen=baueEnde(); S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; S.vx=0; SFX.sieg();
}
function levelGeschafft(){
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Letztes Level - der Pegel wird nicht mehr gebraucht. Ein neuer Durchlauf
     ueber index.html soll wieder nuechtern anfangen. */
  try{ localStorage.removeItem(PEGEL_KEY); }catch(e){}
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>TUNE.ueberspringen){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=S.szenen[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=S.szenen.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
/* Farbverlauf des Himmels - von Nacht bis Blendend-Hell, ueber das Licht */
const SONNENFARBEN=[
  { t:0.00, oben:[11,15,42],  unten:[27,16,48]  },
  { t:0.30, oben:[26,20,58],  unten:[58,26,70]  },
  { t:0.55, oben:[58,34,86],  unten:[214,90,140]},
  { t:0.78, oben:[120,70,110],unten:[255,140,80]},
  { t:1.00, oben:[220,190,180],unten:[255,240,196]},
];
function lerp(a,b,f){ return a+(b-a)*f; }
function himmelFarbe(licht){
  const t=Math.max(0,Math.min(1,licht/100));
  let a=SONNENFARBEN[0], b=SONNENFARBEN[SONNENFARBEN.length-1];
  for(let i=0;i<SONNENFARBEN.length-1;i++){
    if(t>=SONNENFARBEN[i].t&&t<=SONNENFARBEN[i+1].t){ a=SONNENFARBEN[i]; b=SONNENFARBEN[i+1]; break; }
  }
  const span=(b.t-a.t)||1, f=(t-a.t)/span;
  const mix=(c1,c2)=>[Math.round(lerp(c1[0],c2[0],f)),Math.round(lerp(c1[1],c2[1],f)),Math.round(lerp(c1[2],c2[2],f))];
  const ob=mix(a.oben,b.oben), un=mix(a.unten,b.unten);
  return { oben:`rgb(${ob[0]},${ob[1]},${ob[2]})`, unten:`rgb(${un[0]},${un[1]},${un[2]})`, t };
}

function draw(dt){
  zeichneBild(dt);
  erzaehlZeichne();      // Kapitelkarte, Polaroid, Plausch: ganz oben ueber dem Bild
}
function zeichneBild(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }
  if(S.modus==='kampf'){ zeichneKampf8(); hudKampf8(); bildschirme(); return; }
  if(S.modus==='finale'){ zeichneFinale(); zeichneGespraech(); return; }
  if(S.modus==='cutscene'){ zeichneAbspann(); return; }

  ctx.save();
  const p=S.pegel/100;
  /* Wackeln (Rest-Pegel, Treffer) laeuft ueber FX: aus bei "Wackeln aus", halb bei Flackerschutz. */
  const wack = FX.wackel(S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0);
  const rw=FX.wackel(S.ruettel);
  const rx=(Math.random()-.5)*rw+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*rw+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneStrasse();
  ctx.restore();

  hud();
  zeichneGespraech();
  /* Die Sonne holt dich ein - je hoeher das Licht, desto mehr wird das Bild
     ausgewaschen. Bewusst kein hartes Weiss, sonst ist der letzte Moment
     nicht mehr lesbar. */
  if(S.licht>55){
    const a=Math.min(.55,(S.licht-55)/45*.55);
    ctx.fillStyle=`rgba(255,250,230,${a.toFixed(3)})`; ctx.fillRect(0,0,W,H);
  }
  bildschirme();
}

function zeichneStrasse(){
  const kx=Math.round(S.kamX);
  const himmel=himmelFarbe(S.licht);

  /* Himmel */
  const grd=ctx.createLinearGradient(0,0,0,BODEN);
  grd.addColorStop(0,himmel.oben); grd.addColorStop(1,himmel.unten);
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,BODEN);

  /* Sterne, verblassen mit steigendem Licht - dicht genug, dass auch
     ein einzelner Bildschirmausschnitt mehrere sieht (PLAYTEST.md: obere
     Bildhaelfte leer). An den Lichtfaktor gekoppelt, wie der Mond unten. */
  if(himmel.t<0.7){
    ctx.globalAlpha=Math.max(0,1-himmel.t/0.7);
    for(let i=0;i<320;i++){ ctx.fillStyle=i%5===0?'#ffffffaa':'#ffffff55';
      ctx.fillRect(((i*23-kx*0.05)%W+W)%W,(i*11)%70+4,1,1); }
    ctx.globalAlpha=1;
  }
  /* Der Mond - gegenueber der Sonne, verblasst mit ihr zusammen mit den
     Sternen beim Tagesanbruch. */
  if(himmel.t<0.7){
    ctx.globalAlpha=Math.max(0,1-himmel.t/0.7);
    ctx.fillStyle='#d8dcee';
    ctx.beginPath(); ctx.arc(W*0.18,28,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=himmel.oben;
    ctx.beginPath(); ctx.arc(W*0.18+4,25,8,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.save(); ctx.translate(-kx,0);

  /* Haeuser-Reihe im Hintergrund, langsamerer Parallax - durchgehend
     (vorher 50 px Luecke zwischen den Haeusern) und mit Fenstern, damit
     die obere Bildhaelfte nicht leer bleibt, auch wenn Sterne/Mond mit
     dem Tageslicht schon verblasst sind. */
  ctx.save(); ctx.translate(-kx*0.4,0);
  for(let i=0;i<62;i++){
    const bx=i*90, bh=30+((i*53)%40);
    ctx.fillStyle=himmel.t<0.5?'#141224':'#2a2338';
    ctx.fillRect(bx,BODEN-bh,90,bh);
    ctx.fillStyle=himmel.t<0.5?'#ffd44766':'#00000022';
    for(let wy=BODEN-bh+6;wy<BODEN-6;wy+=10)
      for(let wx=bx+6;wx<bx+84;wx+=14) ctx.fillRect(wx,wy,6,6);
  }
  ctx.restore();

  /* Zonen-Hintergrund + Strasse */
  for(const z of ZONEN){
    ctx.fillStyle=himmel.t<0.5?'#1c1826':'#2c2436';
    ctx.fillRect(z.von,BODEN-2,z.bis-z.von,2);
    text(z.name,z.von+6,BODEN-14,'#ffffff14');
  }
  ctx.fillStyle='#221c2c'; ctx.fillRect(0,BODEN,LEVEL_B,H-BODEN);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,LEVEL_B,1);
  ctx.fillStyle='#00000033';
  for(let x=0;x<LEVEL_B;x+=16) ctx.fillRect(x,BODEN+6,8,1);

  /* Schatten-Zonen: Baumkronen/Haus-Kante oben, dunkler Ueberzug am Boden */
  for(const z of SCHATTEN){
    const dunkel=z.art==='tunnel'?0.5:0.28;
    ctx.fillStyle=`rgba(0,0,0,${dunkel})`;
    ctx.fillRect(z.von,20,z.bis-z.von,BODEN-20);
    if(z.art==='baum'){
      for(let x=z.von+10;x<z.bis;x+=40) sprite(SPR.baum,x,BODEN-24);
    } else if(z.art==='tunnel'){
      ctx.fillStyle='#0a0812'; ctx.fillRect(z.von,20,z.bis-z.von,18);
    } else {
      ctx.fillStyle='#000000aa'; ctx.fillRect(z.von,20,z.bis-z.von,10);
    }
    text(z.label,z.von+6,26,'#ffffff30');
  }

  /* Laternen - gehen aus, wenn es hell genug ist */
  for(const lx of LATERNEN){
    sprite(SPR.laterne,lx,BODEN-24);
    if(himmel.t<0.55){
      ctx.globalAlpha=.5+Math.sin(S.t*3+lx)*.15;
      ctx.fillStyle='#ffe08a'; ctx.fillRect(lx-1,BODEN-25,3,3);
      ctx.globalAlpha=1;
    }
  }

  /* Hindernisse */
  for(let i=0;i<HINDERNISSE.length;i++){
    const o=HINDERNISSE[i];
    const effX=o.art==='jogger'?o.x+Math.sin(S.t*TUNE.joggerTempo+i)*TUNE.joggerAmplitude:o.x;
    const rows=SPR[o.art];
    const y=BODEN-rows.length;
    outline(rows,effX-Math.round(rows[0].length/2),y,1,.5);
    if(o.art==='jogger'){
      const geht=Math.sin(S.t*TUNE.joggerTempo*3+i)>0;
      sprite(rows,effX-Math.round(rows[0].length/2),y);
    } else sprite(rows,effX-Math.round(rows[0].length/2),y);
    if(!S.hinTreffer[i]&&Math.abs(effX-S.x)<40&&Math.floor(S.t*5)%2===0){
      text('!',effX-1,y-9,P.rot);
    }
  }

  /* Ziel: die eigene Haustuer */
  {
    const rows=SPR.haustuer, y=BODEN-rows.length;
    outline(rows,ZIEL_X-4,y,1,.6); sprite(rows,ZIEL_X-4,y);
    const nah=Math.abs(S.x-ZIEL_X)<120;
    text('ZUHAUSE',ZIEL_X+4-textW('ZUHAUSE')/2,y-9,nah?P.gold:P.dunkel);
  }

  /* Spieler */
  let rows;
  if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  outline(rows,S.x-3,S.y-rows.length,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,S.y-rows.length); else sprite(rows,S.x-3,S.y-rows.length);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),BODEN,7,1); ctx.globalAlpha=1;

  /* Der Abbieger: eine Figur am Strassenrand, nur solange sein Fenster offen ist
     (und waehrend des Abschieds). Sonst gibt es im Wettlauf keine Crew-Sprites. */
  const fg=S.abb&&S.abb.figur;
  if(fg){
    const a=Math.min(1,fg.rest/.3), ax=Math.round(S.x-TUNE.abbiegeAbstand), ay=BODEN-3-SPR.steh.length;
    ctx.globalAlpha=Math.max(0,a)*.35; outline(SPR.steh,ax-3,ay,1,.6);
    ctx.globalAlpha=Math.max(0,a); sprite(SPR.steh,ax-3,ay,1,stimmeFarbe(fg.name));
    ctx.globalAlpha=1;
    if(S.abb.fenster){
      const f=S.abb.fenster, bw=20, bx=ax-bw/2+3, by=ay-6;
      ctx.fillStyle='#000a'; ctx.fillRect(bx-1,by-1,bw+2,4);
      ctx.fillStyle=stimmeFarbe(fg.name); ctx.fillRect(bx,by,Math.round(bw*Math.max(0,f.rest)/f.gesamt),2);
    }
  }

  ctx.restore();

  /* Die Sonne selbst - steigt langsam am Horizont hoch. Erst hier, nach
     der durchgehenden Haeuserreihe, gezeichnet: sonst wuerde sie von
     einem Haus verdeckt, solange sie noch tief steht. */
  const sonneX=W*0.74;
  const sonneY=Math.round(BODEN-6-(S.licht/100)*88);
  zeichneSonne(sonneX,sonneY,himmel.t);
}

/* Die Sonne wird pixelig aus Reihen gezeichnet statt aus einem Canvas-
   Gradient - passt besser zum Rest der Optik und muss nicht mit wechselnder
   Position/Farbe gecacht werden (waere sonst ein wachsender Cache pro Frame). */
function zeichneSonne(x,y,t){
  const farbe = t<0.35?'#fff4c2':t<0.65?'#ffd447':'#ff8a3d';
  ctx.globalAlpha=.18;
  ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=farbe; ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
}

/* ---- HUD ---- */
function hud(){
  /* Sonnenanzeige - der eigentliche Gegner dieses Levels */
  const bw=90,bx=(W-bw)/2,by=6, l=S.licht/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=l<.5?P.neon2:l<.8?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*l),4);
  text('SONNE',bx+(bw-textW('SONNE'))/2,by+6,l>0.8&&Math.floor(S.t*4)%2===0?P.rot:P.dunkel);

  /* Fortschritt zur Haustuer */
  const fbw=50, fbx=W-fbw-6, fby=6;
  const frac=Math.max(0,Math.min(1,S.x/ZIEL_X));
  ctx.fillStyle='#000a'; ctx.fillRect(fbx-2,fby-2,fbw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(fbx,fby,fbw,4);
  ctx.fillStyle=P.gruen; ctx.fillRect(fbx,fby,Math.round(fbw*frac),4);
  text('HEIMWEG',fbx+(fbw-textW('HEIMWEG'))/2,fby+6,P.dunkel);

  /* Restpegel, falls noch da */
  if(S.pegel>2){
    const pbw=40,pbx=6,pby=6;
    ctx.fillStyle='#000a'; ctx.fillRect(pbx-2,pby-2,pbw+4,8);
    ctx.fillStyle='#2a2440'; ctx.fillRect(pbx,pby,pbw,4);
    ctx.fillStyle=P.neon2; ctx.fillRect(pbx,pby,Math.round(pbw*S.pegel/100),4);
    text('PEGEL',pbx+(pbw-textW('PEGEL'))/2,pby+6,P.dunkel);
  }

  if(S.licht>80&&Math.floor(S.t*3)%2===0) textC('DIE SONNE GEHT AUF',H-42,P.rot);

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
}

/* ---- Finale: das Bild ---- */
const finMix=(a,b,f)=>'rgb('+[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*f)).join(',')+')';

function finFigur(x,basis,tint,o){
  o=o||{};
  const rows=SPR.steh, y=basis-rows.length+(o.tief||0);
  outline(rows,x-3,y,1,.6);
  if(o.flip) spriteFlip(rows,x-3,y,1,tint); else sprite(rows,x-3,y,1,tint);
  ctx.globalAlpha=.28; ctx.fillStyle='#000'; ctx.fillRect(x-3,basis,7,1); ctx.globalAlpha=1;
}

/* Ein Laden im Viertel: Rollladen oben, Schaufenster, Tuer. */
function finLaden(x,w,h,basis,wand,name,offen,rolladen){
  ctx.fillStyle=wand; ctx.fillRect(x,basis-h,w,h);
  ctx.fillStyle='#00000055'; ctx.fillRect(x,basis-h,w,3);
  text(name,x+Math.round((w-textW(name))/2),basis-h+5,P.gold);
  const fx=x+5, fw=Math.round(w*.45), fy=basis-h+13, fh=h-13-2;
  ctx.fillStyle=offen?'#ffd44777':'#0a0812'; ctx.fillRect(fx,fy,fw,fh);
  const rh=Math.round(fh*rolladen);
  if(rh>0){
    ctx.fillStyle='#5a5a66'; ctx.fillRect(fx,fy,fw,rh);
    ctx.fillStyle='#00000055'; for(let yy=fy+2;yy<fy+rh;yy+=3) ctx.fillRect(fx,yy,fw,1);
  }
  const dh=Math.min(14,h-6), dx=x+w-17;
  ctx.fillStyle=offen?'#150f1c':'#2a1c14'; ctx.fillRect(dx,basis-dh,10,dh);
  ctx.fillStyle=P.gold; if(!offen) ctx.fillRect(dx+7,basis-dh+Math.round(dh/2),1,1);
  return dx+5;      // x der Tuermitte
}

function zeichneFinale(){
  const F=S.fin; if(!F) return;
  const himmel=himmelFarbe(F.hell), t=himmel.t;
  const brueckeOrt=F.ort==='sonne';
  const grd=ctx.createLinearGradient(0,0,0,BODEN);
  grd.addColorStop(0,himmel.oben); grd.addColorStop(1,himmel.unten);
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,BODEN);

  /* Die Sonne steigt, ruhig, hinter den Haeusern */
  zeichneSonne(Math.round(W*.52),Math.round(BODEN-4-Math.max(0,(F.hell-60))/40*34),t);

  /* Haeuserreihe */
  for(let i=0;i<7;i++){
    const bx=i*50, bh=34+((i*53)%30);
    ctx.fillStyle=finMix([20,18,36],[70,56,86],t); ctx.fillRect(bx,BODEN-bh,50,bh);
    ctx.fillStyle=t<.55?'#ffd44744':'#00000022';
    for(let wy=BODEN-bh+6;wy<BODEN-6;wy+=10) for(let wx=bx+6;wx<bx+44;wx+=14) ctx.fillRect(wx,wy,5,5);
  }

  /* Strasse oder Bruecke */
  const boden=finMix([34,28,44],[110,94,124],t);
  let basisLaden=BODEN, ladenH=44;
  if(brueckeOrt){
    ctx.fillStyle=finMix([20,36,66],[120,150,190],t); ctx.fillRect(0,BODEN+8,W,H-BODEN-8);
    ctx.fillStyle='#ffd44744';
    for(let i=0;i<9;i++) ctx.fillRect(110+((i*17)%60),BODEN+12+((i*7)%22),10+(i%3)*4,1);
    ctx.fillStyle=boden; ctx.fillRect(0,BODEN+8,84,H-BODEN-8); ctx.fillRect(W-84,BODEN+8,84,H-BODEN-8);
    ctx.fillStyle=finMix([44,36,60],[130,112,146],t); ctx.fillRect(0,BODEN,W,8);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,W,1);
    ctx.fillStyle=finMix([70,60,100],[170,150,190],t);
    ctx.fillRect(0,BODEN-9,W,2); for(let x=4;x<W;x+=22) ctx.fillRect(x,BODEN-9,2,9);
    basisLaden=H-2; ladenH=26;
  } else {
    ctx.fillStyle=boden; ctx.fillRect(0,BODEN,W,H-BODEN);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,W,1);
  }
  const fb=brueckeOrt?H-2:BODEN;     // Standlinie der Ladenfiguren

  /* Baeckerei links, Alis Laden rechts: bei allen drei Orten im Viertel */
  const bx=finLaden(8,64,ladenH,basisLaden,'#4a3446','BAECKEREI',F.baeckerin,F.baeckerin?0:1);
  const ax=finLaden(250,62,ladenH,basisLaden,'#2e3a4e','ALI',F.ali,F.ali?0:1);
  if(F.ort==='heim'){
    outline(SPR.haustuer,96,BODEN-20,2,.6); sprite(SPR.haustuer,96,BODEN-20,2);
    text('ZUHAUSE',100-Math.round(textW('ZUHAUSE')/2)+8,BODEN-28,P.gold);
  }
  if(F.baeckerin) finFigur(bx,fb,'#ffd6a0');
  if(F.ali)       finFigur(ax,fb,'#c8a070');

  /* Die Runde: du, Moritz, Max Ferdi (sitzt als erster), Marvin */
  const drehen=F.dreh;
  if(F.marvin) finFigur(118,BODEN,stimmeFarbe('MARVIN'),{flip:drehen});
  finFigur(142,BODEN,stimmeFarbe('MAX FERDI'),{tief:F.maxSitzt?4:0,flip:drehen});
  finFigur(166,BODEN,null);
  finFigur(190,BODEN,stimmeFarbe('MORITZ'),{flip:drehen});

  /* Ruhig mehr Licht: ein heller Schleier, der nur langsam waechst */
  const a=Math.max(0,(F.hell-80)/20)*.25;
  if(a>0){ ctx.fillStyle='rgba(255,246,220,'+a.toFixed(3)+')'; ctx.fillRect(0,0,W,H); }

  finBeschriftung(F);
  const h=IS_TOUCH?'':'E HALTEN: UEBERSPRINGEN';
  if(h) text(h,W-textW(h)-4,4,P.dunkel);
  zeichneUeberspringen(S.skipT,TUNE.ueberspringen);
}

/* Die Karte unten: Sprecher in seiner Farbe, '|' bricht um. */
function finBeschriftung(F){
  const st=F.st;
  if(!st||st.wahl||st.auto||!st.txt||gespraechAktiv()) return;
  const zl=String(st.txt).split('|'), hh=zl.length*8+8;
  const a=Math.max(0,Math.min(1,F.t/.25,(F.d-F.t)/.25));
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-hh-4,W,hh+4);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-hh-4,W,1);
  ctx.globalAlpha=a;
  zl.forEach((l,i)=>{
    const y=H-hh+i*8, x=Math.round((W-textW(l))/2);
    const m=!st.col&&i===0?/^([A-Z][A-Z ]*?)( \(HANDY\))?: /.exec(l):null;
    if(m){ text(m[0],x,y,stimmeFarbe(m[1])); text(l.slice(m[0].length),x+m[0].length*4,y,P.weiss); }
    else text(l,x,y,st.col||P.weiss);
  });
  ctx.globalAlpha=1;
}

/* ---- Abspann: eine Karte nach der anderen auf dunklem Grund ---- */
function zeichneAbspann(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  /* ein ruhiger Streifen Morgenlicht unten, ohne Bewegung */
  const hm=himmelFarbe(100), g=ctx.createLinearGradient(0,H-46,0,H);
  g.addColorStop(0,'rgba(8,6,15,0)'); g.addColorStop(1,hm.unten);
  ctx.globalAlpha=.22; ctx.fillStyle=g; ctx.fillRect(0,H-46,W,46); ctx.globalAlpha=1;
  const s=S.szenen&&S.szenen[S.szene]; if(!s) return;
  const a=Math.max(0,Math.min(1,S.szeneT/.25,(s.d-S.szeneT)/.25));
  ctx.globalAlpha=a;
  if(s.art==='wolle'){
    zeichneWolle(s.knoten,H/2-8,S.szeneT);
    const st=s.stempel||'';
    textC(st,H/2+18,st==='SCHICHTWECHSEL'?P.gold:P.weiss,st==='SCHICHTWECHSEL'?2:1);
  } else if(s.txt){
    const zl=[]; for(const t of s.txt.split('|')) zl.push(...umbrich(t,W-24,1));
    const n=Math.max(1,zl.length), y0=Math.round(H/2-n*4-4);
    const ende=/^(ENDE:|ENDEN GESEHEN)/.test(s.txt), party=s.txt==='PARTY GAME DRUNK';
    zeichneKarte(s.txt,party?H/2-8:y0,ende?P.gold:party?P.neon:/^GRUPPE:/.test(s.txt)?P.neon2:P.weiss,party?2:1);
  }
  ctx.globalAlpha=1;
  const h=IS_TOUCH?'TIPPEN: WEITER':'E HALTEN: UEBERSPRINGEN';
  text(h,W-textW(h)-4,4,P.dunkel);
  zeichneUeberspringen(S.skipT,TUNE.ueberspringen);
}

function bildschirme(){
  if(S.modus==='pause'){

   VOR DEM KAMPF
   Wer Marvin im Club gesehen hat, trifft ihn wieder, und er weiss noch,
   wie es lief. Wer nicht, trifft einen Fremden, der seit dem Club hinter
   einem her ist.
   ========================================================================== */
const anfuehrerName=()=>flag('marvinKennt')?'MARVIN':'DER ANFUEHRER';
function vorDemKampf(){
  const wer=anfuehrerName();
  /* Wer Marvin nachgerufen oder ihm Wasser gegeben hat, wird so empfangen. */
  const auftakt =
      flag('marvinNachgerufen')  ? 'Du hast gerufen. Im Club. Ich hab es gehoert.'
    : flag('marvinWasser')       ? 'Danke fuer das Wasser. Das aendert nichts. Kein Stress.'
    : flag('clubKloppeGewonnen') ? 'Du schon wieder. Im Club hattest du Glueck.'
    : flag('clubGekniffen')      ? 'Der, der im Club gekniffen hat. Diesmal laeufst du nicht.'
    : flag('marvinRueckzug')     ? 'Deine Jungs sehen muede aus. Heute Nacht zaehlt das.'
    : flag('marvinKennt')        ? 'Wir haben noch was offen, du und ich.'
    :                              'Ihr lauft seit dem Club durch unsere Strasse.';

  /* Der seltene Weg: ohne Kampf nach Hause ist ein eigenes Ende. Entweder
     mutig UND angesehen (wie bisher) oder der Weg ueber Taten: Wasser gegeben
     und nachgerufen. Die Oder-Bedingung geht nur per JS, nicht per wenn:{}. */
  const mut=wert('mut');
  const friedenOffen =
      (flag('marvinKennt')&&mut>=60&&wert('ruf')>=65)
    ||(flag('marvinWasser')&&flag('marvinNachgerufen')&&mut>=40);

  /* Die Wahlen; die SMS-Frage steht nur beim ersten Mal da. */
  const wahlen=(ohneSms)=>{
    const w=[];
    if(!ohneSms&&flag('marvinKennt')) w.push({ txt:'Hast du die SMS auch gekriegt?', geh:'sms' });
    if(flag('angstZugegeben')) w.push({ txt:'Ich hab Angst. Aber ich geh nicht weg.', geh:'ehrlich' });
    if(friedenOffen) w.push({ txt:'Heute nicht. Geh nach Hause, Marvin.', geh:'frieden' });
    w.push({ txt:'Lass uns einfach vorbei.', geh:'lacht' });
    w.push({ txt:'Dann los.', geh:'@kampf', tu:{mut:2} });
    return w;
  };
  /* Laeuft die Bedenkzeit ab, gilt die letzte Wahl: "Dann los." (wie bisher). */

  return {
    start:{ wer, text:auftakt, wahl:wahlen(false), zeit:9, standard:9 },
    sms:{ wer, text:'Gleiche Nummer. Ich schreib so was nicht. Ich komm vorbei.',
      wahl:wahlen(true), zeit:9, standard:9 },
    ehrlich:{ wer, text:'...Das hat noch keiner zu mir gesagt. Egal. Komm.',
      tu:{flag:'mutigerKopf'}, geh:'@kampf' },
    lacht:{ wer, text:'Vorbei. Klar. Erst durch mich.', geh:'@kampf' },
    frieden:{ wer, text:'...Weisst du was. Du hast recht. Ich bin auch muede.',
      tu:{flag:'friedlich', ruf:10}, geh:flag('traumEinsicht')?'frieden2':'@frieden' },
    frieden2:{ wer, text:'...Lea hat auch zu mir gesagt: Man darf.', geh:'@frieden' },
  };
}

/* Zeilen hoechstens 44 Zeichen: lange Saetze brechen an Wortgrenzen um. */
function bricht44(txt){
  const aus=[];
  for(const zl of String(txt).split('|')){
    let z='';
    for(const w of zl.split(' ')){
      if(z&&(z+' '+w).length>44){ aus.push(z); z=w; } else z=z?z+' '+w:w;
    }
    aus.push(z);
  }
  return aus.join('|');
}

/* ==========================================================================
   DER GROSSE FIGHT
   Die Gruppe, die euch seit dem Club verfolgt, stellt euch auf dem Heimweg.

   Drei Phasen, und die Arena wechselt mit jeder: Strasse, Hinterhof,
   Baustelle. Jede Phase bringt etwas dazu, das die vorige Antwort entwertet -
   in Phase 2 Handlanger, die dich einkreisen, in Phase 3 unblockbare
   Angriffe und Wuerfe. Nur Blocken reicht dann nicht mehr.

   Verlieren beendet das Spiel NICHT. Es kostet Licht-Vorsprung fuer den
   Heimweg und faerbt das Ende ein.
   ========================================================================== */
const KAMPF8 = {
  /* (1) DER ANFUEHRER */
  anfuehrerHp:      9,
  anfuehrerReich:  19,
  schwungWindup: 0.95, schwungSchlag: 0.22,
  jabWindup:     0.48, jabSchlag:     0.14,
  rammeWindup:   0.72, rammeSchlag:   0.28,
  wurfWindup:    0.85, wurfSchlag:    0.16,
  pause:         0.80,
  pauseKuerzerProPhase: 0.20,
  windupKuerzerProPhase:0.10,

  /* (2) HANDLANGER - ab Phase 2, sie kreisen dich ein */
  handlangerAb:     2,
  handlangerAnzahl: 2,

  /* (3) FLASCHEN - ab Phase 3, kommen geflogen */
  flascheTempo:   122,
  wurfAb:          58,   // ab dieser Entfernung wirft er statt zu schlagen
  flascheSchaden:   1,

  /* (4) DEINE CREW - wer dich mag, geht dazwischen */
  hilfeIntervall: 5.5,   // Sekunden zwischen zwei Einmischungen
  hilfeBetaeubung: 1.0,

  /* (5) ARENA */
  arenaLinks:   18,
  arenaRechts:  22,
  tiefeHinten: 118,
  tiefeVorne:  152,
  gehTempo:     78,

  /* (6) NIEDERLAGE - kein Spielende, nur ein schwererer Heimweg */
  lichtStrafeBeiNiederlage: 22,
};

const ARENEN = [
  { name:'DIE STRASSE',   himmel:'#12101f', boden:'#1d1728', kante:'#3a2f4e' },
  { name:'DER HINTERHOF', himmel:'#0f1418', boden:'#18201c', kante:'#2e3a32' },
  { name:'DIE BAUSTELLE', himmel:'#1a1410', boden:'#241c14', kante:'#4a3720' },
];

function phase8(){
  const g=S.gegner; if(!g) return 1;
  const a=g.hp/KAMPF8.anfuehrerHp;
  return a<=0.34?3:a<=0.67?2:1;
}

function starteGrossenKampf(){
  S.modus='kampf';
  document.documentElement.classList.add('kampf');
  setzeTiefenband(KAMPF8.tiefeHinten,KAMPF8.tiefeVorne);
  /* Wer im Traum die Angst zugegeben und es ihm gesagt hat, steht
     fester. Ein Leben mehr ist viel in diesem Kampf - gemessen. */
  const leben=flag('mutigerKopf')?4:3;
  S.spielerK=kaempfer({ x:70, t:0.5, blick:1, hp:leben, maxHp:leben });
  S.gegner=kaempfer({ x:210, t:0.5, blick:-1, art:'anfuehrer',
    hp:KAMPF8.anfuehrerHp, maxHp:KAMPF8.anfuehrerHp,
    reichweite:KAMPF8.anfuehrerReich, pauseT:1.2, vorZustand:'frei' });
  S.handlanger=[]; S.flaschen=[]; S.arena=0; S.arenaWechselT=0;
  S.hilfeT=KAMPF8.hilfeIntervall; S.hilfeText='';
  S.blockAn=false;
  zeigeHinweis(flag('taxiTipp')?'DER TAXIFAHRER HATTE RECHT: STEHENBLEIBEN, BLOCKEN, KONTERN'
                              :'E SCHLAGEN - SHIFT BLOCKEN - LEER AUSWEICHEN',4);
  meldung(anfuehrerName()==='MARVIN'?'MARVIN UND SEINE LEUTE':'DIE HABEN AUF EUCH GEWARTET',2);
}

function wechsleArena(neu){
  S.arena=neu; S.arenaWechselT=1.6;
  S.flaschen.length=0;
  meldung(ARENEN[neu].name,2);
  SFX.aua();
  /* Handlanger tauchen auf, sobald es in den Hinterhof geht. */
  if(neu+1>=KAMPF8.handlangerAb && !S.handlanger.length){
    for(let i=0;i<KAMPF8.handlangerAnzahl;i++)
      S.handlanger.push(gegner(i===0?'flitzer':'schlaeger',
        i===0?250:30, i===0?0.2:0.8));
  }
}

/* ---- Der Anfuehrer ---- */
function naechsterAngriff8(g){
  const ph=phase8();
  /* 'wurf' steht bewusst NICHT hier drin: der wird in anfuehrerTakt nach
     Entfernung gewaehlt. Im Test hat er sonst aus zwei Pixeln Entfernung
     geworfen - die Flasche traf im selben Bild, ohne Ausweichfenster. */
  let moeglich=['schwung','jab'];
  if(ph>=2) moeglich.push('ramme');
  if(ph>=3) moeglich.push('ramme');
  let art=pick(moeglich);
  if(g.letzteArt===art) g.serie=(g.serie||0)+1; else g.serie=0;
  if(g.serie>=2){ art=pick(moeglich.filter(a=>a!==art)); g.serie=0; }
  g.letzteArt=art;
  return art;
}
function starteAngriff8(g,art){
  const ph=phase8();
  /* Mit dem Tipp vom Taxifahrer kennt man sein Muster - sein Ausholen
     ist eine Spur laenger lesbar. */
  const k=(1-(ph-1)*KAMPF8.windupKuerzerProPhase)*(flag('taxiTipp')?1.15:1);
  g.art=art;
  g.ausholenDauer=(art==='schwung'?KAMPF8.schwungWindup
                  :art==='jab'?KAMPF8.jabWindup
                  :art==='ramme'?KAMPF8.rammeWindup:KAMPF8.wurfWindup)*k;
  g.schlagDauer=(art==='schwung'?KAMPF8.schwungSchlag
                :art==='jab'?KAMPF8.jabSchlag
                :art==='ramme'?KAMPF8.rammeSchlag:KAMPF8.wurfSchlag);
  g.unblockbarJetzt=(art==='ramme');
  g.fensterAnteil=KAMPF.konterAnteil;
  g.zustand='ausholen'; g.zT=0; g.trefferGesetzt=false;
  SFX.aua();
}
function anfuehrerTakt(dt,ziel){
  const g=S.gegner;
  kaempferTakt(g,dt);
  if(g.hp<=0) return;
  g.blick=Math.sign(ziel.x-g.x)||g.blick;

  if(g.art==='ramme'){
    if(g.zustand==='ausholen') g.x+=g.blick*30*dt;
    if(g.zustand==='schlag')   g.x+=g.blick*165*dt;
  }
  /* Der Wurf loest beim Schlag eine Flasche aus, kein Nahkampftreffer. */
  if(g.art==='wurf'&&g.zustand==='schlag'&&!g.trefferGesetzt){
    g.trefferGesetzt=true;
    S.flaschen.push({x:g.x,t:g.t,vx:g.blick*KAMPF8.flascheTempo});
  }

  if(g.zustand==='frei'&&g.vorZustand!=='frei')
    g.pauseT=Math.max(0.22,KAMPF8.pause-(phase8()-1)*KAMPF8.pauseKuerzerProPhase);
  g.vorZustand=g.zustand;
  if(g.zustand!=='frei') return;

  g.pauseT-=dt;
  const dx=ziel.x-g.x, dtf=(ziel.t||0)-(g.t||0);
  const abstand=Math.abs(dx);

  /* Ab Phase 3 bleibt er auch mal weg und wirft. Die Flasche braucht dann
     eine halbe Sekunde - Zeit genug, um zur Seite oder in die Tiefe zu gehen. */
  if(g.pauseT<=0 && phase8()>=3 && abstand>KAMPF8.wurfAb){
    starteAngriff8(g,'wurf'); return;
  }

  const zuWeit=abstand>g.reichweite*0.8||Math.abs(dtf)>KAMPF.tiefeToleranz*0.8;
  if(g.pauseT>0||zuWeit){
    if(abstand>g.reichweite*0.75) g.x+=Math.sign(dx)*52*dt;
    if(Math.abs(dtf)>0.05) bewegeTiefe(g,Math.sign(dtf),dt,TIEFE.tempo*0.6,9);
    return;
  }
  starteAngriff8(g,naechsterAngriff8(g));
}

/* ---- Deine Crew mischt sich ein ----
   Wer dabei ist und dich mag, geht dazwischen. Wen du versetzt hast,
   schaut zu. Beziehung kommt aus nacht.js, Crew aus stand.js. */
function crewHilfeTakt(dt){
  const crew=ladeCrew();
  if(!crew.length) return;
  S.hilfeT-=dt;
  if(S.hilfeT>0) return;
  S.hilfeT=KAMPF8.hilfeIntervall;
  const willig=crew.filter(n=>beziehung(n)>=-20);
  if(!willig.length){ meldung('KEINER GEHT DAZWISCHEN',1.4); return; }
  const wer=pick(willig);
  /* Lieber einen Handlanger aufhalten als den Anfuehrer. */
  const ziel=S.handlanger.find(h=>h.hp>0)||S.gegner;
  ziel.zustand='getroffen'; ziel.betaeubt=KAMPF8.hilfeBetaeubung;
  S.hilfeText=wer+' GEHT DAZWISCHEN';
  meldung(S.hilfeText,1.6);
}

function kampf8(dt){
  kampfStopTakt(dt);
  const zdt=dt*kampfZeitFaktor();
  if(zdt<=0) return;
  const s=S.spielerK, g=S.gegner;

  if(S.arenaWechselT>0){ S.arenaWechselT-=zdt; return; }

  /* ---- Eingabe ---- */
  if(rolleGedrueckt){
    rolleGedrueckt=false;
    const r=(runterAn?1:0)-(hochAn?1:0);
    rolle(s,r||(s.t<0.5?1:-1));
  }
  blocke(s,!!S.blockAn && aktionPuffer.length===0);
  if(s.zustand==='frei'||s.zustand==='block'){
    const rx=(rechtsAn?1:0)-(linksAn?1:0);
    const langsamer=s.zustand==='block'?0.45:1;
    if(rx){ s.x+=rx*KAMPF8.gehTempo*langsamer*zdt; s.blick=rx; }
    const rt=(runterAn?1:0)-(hochAn?1:0);
    kampfTiefe(s,rt,zdt,langsamer);
  }
  s.x=Math.max(KAMPF8.arenaLinks,Math.min(W-KAMPF8.arenaRechts,s.x));

  while(aktionPuffer.length){
    aktionPuffer.shift();
    if(s.ausdauer<KAMPF.ausdauerSchlag){ meldung('AUSSER PUSTE',0.9); continue; }
    rasteAufGegner(s,[g].concat(S.handlanger),KAMPF8.anfuehrerReich);
    /* Konter zuerst - gegen den Anfuehrer und gegen jeden Handlanger. */
    let gekontert=konterVersuch(s,g,{schaden:2,unblockbar:g.unblockbarJetzt});
    if(!gekontert){
      for(const h of S.handlanger){
        if(h.hp>0&&konterVersuch(s,h,{schaden:2})){ gekontert=true; break; }
      }
    }
    if(gekontert){ S.ruettel=5; SFX.warn(); meldung(pick(['SITZT','KONTER','BAM']),1.0); continue; }
    schlage(s);
  }

  kaempferTakt(s,zdt);
  anfuehrerTakt(zdt,s);
  for(const h of S.handlanger) if(h.hp>0) gegnerTakt(h,zdt,s,{tempoFaktor:0.9});
  crewHilfeTakt(zdt);

  /* ---- Flaschen ---- */
  for(const f of S.flaschen){ f.x+=f.vx*zdt; }
  S.flaschen=S.flaschen.filter(f=>{
    if(Math.abs(f.x-s.x)<7&&Math.abs(f.t-s.t)<=KAMPF.tiefeToleranz){
      if(s.unverwundbar<=0&&s.zustand!=='rolle'){
        s.hp-=KAMPF8.flascheSchaden; s.unverwundbar=KAMPF.unverwundbarNachTreffer;
        S.ruettel=5; SFX.aua(); meldung('FLASCHE',1.1);
      }
      return false;
    }
    return f.x>-10&&f.x<W+10;
  });

  /* ---- Treffer ---- */
  if(s.zustand==='schlag'&&!s.trefferGesetzt){
    let r=loeseTreffer(s,g,{schaden:1});
    if(!r) for(const h of S.handlanger){ if(h.hp>0){ r=loeseTreffer(s,h,{schaden:1}); if(r) break; } }
    if(r==='treffer'){ S.ruettel=3; SFX.warn(); }
    else if(r==='block') meldung('GEBLOCKT',0.7);
  }
  if(g.zustand==='schlag'&&g.art!=='wurf'&&!g.trefferGesetzt){
    const r=loeseTreffer(g,s,{schaden:1,unblockbar:g.unblockbarJetzt,
      reichweite:g.reichweite,betaeubung:0.35});
    if(r==='treffer'||r==='gardebruch'){ S.ruettel=6; SFX.aua();
      meldung(g.art==='ramme'?'UMGERANNT':'VOLL DRAUF',1.2); }
    else if(r==='block'){ S.ruettel=2; meldung('GEBLOCKT',0.7); }
    else if(r==='daneben') meldung('AUSGEWICHEN',0.9);
  }
  for(const h of S.handlanger){
    if(h.hp>0&&h.zustand==='schlag'&&!h.trefferGesetzt){
      const r=loeseTreffer(h,s,{schaden:1,reichweite:h.reichweite});
      if(r==='treffer'||r==='gardebruch'){ S.ruettel=4; SFX.aua(); meldung('VON HINTEN',1.0); }
    }
  }

  /* ---- Phasenwechsel ---- */
  const ph=phase8();
  if(ph-1>S.arena) wechsleArena(ph-1);

  /* ---- Ausgang ---- */
  if(s.hp<=0){ beendeGrossenKampf(false); return; }
  if(g.hp<=0){ beendeGrossenKampf(true); return; }
}

function beendeGrossenKampf(gewonnen){
  document.documentElement.classList.remove('kampf');
  S.kampfGewonnen=gewonnen;
  setzeFlag(gewonnen?'fightGewonnen':'fightVerloren');
  if(gewonnen){
    meldung('ER BLEIBT LIEGEN',2.2); SFX.sieg();
    aendereWert('ruf',12);
  } else {
    meldung('IHR KOMMT GERADE SO WEG',2.2); SFX.aua();
    aendereWert('ruf',-8);
    S.licht=Math.min(95,S.licht+KAMPF8.lichtStrafeBeiNiederlage);
  }
  S.modus='spiel';
  zeigeHinweis(gewonnen?'UND JETZT NACH HAUSE':'LOS - BEVOR DIE SONNE DA IST',3);
}

/* ---- Zeichnen ---- */
function zeichneKampf8(){
  const A=ARENEN[S.arena], s=S.spielerK, g=S.gegner;
  ctx.fillStyle=A.himmel; ctx.fillRect(0,0,W,H);

  /* Kulisse je Arena - grob, aber klar unterscheidbar */
  ctx.fillStyle='#00000033';
  for(let i=0;i<6;i++){
    const bx=(i*61)%W, bh=30+((i*37)%40);
    ctx.fillRect(bx,bodenY(0)-bh-16,44,bh);
  }
  if(S.arena===1){ ctx.fillStyle='#232c26';
    for(let i=0;i<4;i++) ctx.fillRect(20+i*74,bodenY(0)-26,16,26); }
  if(S.arena===2){ ctx.fillStyle='#5a4420';
    for(let i=0;i<5;i++){ ctx.fillRect(14+i*62,bodenY(0)-34,3,34); ctx.fillRect(14+i*62,bodenY(0)-34,26,3); } }

  ctx.fillStyle=A.boden; ctx.fillRect(0,bodenY(0)-2,W,H-bodenY(0)+2);
  ctx.fillStyle=A.kante; ctx.fillRect(0,bodenY(0)-2,W,1);
  ctx.fillStyle='#00000044'; ctx.fillRect(0,bodenY(1)+3,W,H-bodenY(1));

  /* Erst nach dem Boden, sonst uebermalt ihn die Arena wieder. */
  zeichneTiefenlinien(0,W);
  zeichneTiefenMarke(g,s);
  for(const h of S.handlanger) zeichneTiefenMarke(h,s);

  const liste=[];
  const malKaempfer=(k,steh,tintBlock,grundTint)=>({t:k.t, mal:()=>{
    /* Wer sich bewegt, geht - vorher glitten alle drei Rollen mit dem
       Stehbild ueber den Boden. */
    const lauf=laufBild(k);
    const spr=(lauf>=0&&(k.zustand==='frei'||k.zustand==='block'))?SPR.geh[lauf]:steh;
    const y=bodenY(k.t)-spr.length+(k.zustand==='rolle'?3:0);
    bodenSchatten(k,7,.3);
    const blinkt=k.unverwundbar>0&&(FX.ruhig()?Math.floor(S.t*4)%2===0:Math.floor(S.t*18)%2===0);
    const tint=k.zustand==='block'?tintBlock:(blinkt?'#ffffff':
               (k.zustand==='getroffen'?'#ff8080':grundTint));
    outline(spr,k.x-3,y,1,.6);
    if(k.blick<0) spriteFlip(spr,k.x-3,y,1,tint); else sprite(spr,k.x-3,y,1,tint);
    if(k.zustand==='ausholen'&&(FX.ruhig()||Math.floor(S.t*10)%2===0))
      text('!',k.x,y-9,k.unblockbarJetzt?P.gold:P.rot);
  }});
  /* Ohne eigene Faerbung sehen Anfuehrer, Handlanger und du identisch aus -
     im Gewuehl von Phase 2 war nicht mehr erkennbar, wen man schlaegt. */
  liste.push(malKaempfer(s,SPR.steh,'#42d9ff',null));
  liste.push(malKaempfer(g,SPR.steh,'#42d9ff','#c8324a'));
  for(const h of S.handlanger) if(h.hp>0) liste.push(malKaempfer(h,SPR.steh,'#42d9ff','#7a5a86'));
  for(const f of S.flaschen) liste.push({t:f.t, mal:()=>{
    ctx.fillStyle=P.gruen; ctx.fillRect(Math.round(f.x),Math.round(bodenY(f.t)-9),2,3); }});
  zeichneNachTiefe(liste);

  /* Anfuehrer heben wir farblich ab, damit man ihn im Gewuehl findet */
  ctx.fillStyle=P.rot; ctx.fillRect(Math.round(g.x-2),Math.round(bodenY(g.t)-20),5,1);
}

function hudKampf8(){
  const s=S.spielerK, g=S.gegner;
  for(let i=0;i<s.maxHp;i++){
    const x=6+i*7,y=6, voll=i<Math.ceil(s.hp);
    ctx.fillStyle=voll?P.rot:'#2a2440';
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  const bw=46,bx=6,by=14;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-1,by-1,bw+2,5);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,3);
  ctx.fillStyle=s.ausdauer<KAMPF.ausdauerSchlag?P.rot:P.gruen;
  ctx.fillRect(bx,by,Math.round(bw*s.ausdauer/KAMPF.ausdauerMax),3);

  const gw=70,gx=Math.round(W/2-gw/2);
  ctx.fillStyle='#000a'; ctx.fillRect(gx-1,5,gw+2,6);
  ctx.fillStyle=P.rot; ctx.fillRect(gx,6,Math.round(gw*Math.max(0,g.hp)/g.maxHp),4);
  textC(anfuehrerName(),14,P.dim);
  const ph='PHASE '+phase8()+'  '+ARENEN[S.arena].name;
  text(ph,W-textW(ph)-6,6,phase8()>1?P.gold:P.dunkel);

  /* Derselbe Balken wie beim Tuersteher. Dort lernt man das Konterfenster -
     hier muss man es anwenden koennen, und hier ist es am engsten. */
  zeichneAusholbalken(g, g.art==='schwung'?'SCHWUNG':g.art==='jab'?'JAB'
                       :g.art==='ramme'?'RAMME - AUSWEICHEN':'WURF', 30);

  if(S.arenaWechselT>0) textGlowC(ARENEN[S.arena].name,H/2-4,P.gold,2);
  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
}
