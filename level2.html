<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#04030a; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:monospace; touch-action:none; -webkit-tap-highlight-color:transparent;
    background-image:radial-gradient(ellipse at 50% 40%,#1b1030 0%,#04030a 70%); }
  #cab { position:relative; padding:10px 12px 14px; border-radius:10px;
    background:linear-gradient(#1b1730,#0e0b1a 60%,#17132a);
    box-shadow:0 0 0 2px #2a2246,0 0 60px rgba(120,60,220,.2),0 30px 60px rgba(0,0,0,.8); }

  #base { display:flex; justify-content:space-between; font:700 8px/1 monospace; letter-spacing:2px;
    color:#4a4363; padding-top:8px; user-select:none; }
  #screen { position:relative; line-height:0; border-radius:6px; overflow:hidden;
    box-shadow:inset 0 0 0 2px #000,0 0 24px rgba(255,80,180,.08); }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#000; }
  #crt { position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(105deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 38%),
      radial-gradient(ellipse at center,rgba(0,0,0,0) 54%,rgba(0,0,0,.6) 100%),
      repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,rgba(0,0,0,0) 1px 3px); }
  #crt::after { content:''; position:absolute; inset:0;
    box-shadow:inset 0 0 40px rgba(0,0,0,.8),inset 0 0 90px rgba(0,0,0,.5); }
  #touch { position:absolute; inset:0; display:none; }
  #touch .btn { position:absolute; border-radius:50%;
    background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.13);
    color:#ffffff55; font:700 11px/1 monospace; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center; user-select:none; }
  #touch .btn:active { background:rgba(255,61,139,.3); border-color:#ff3d8b; color:#fff; }
  #tleft  { left:3%;  bottom:8%; width:17%; aspect-ratio:1; }
  #tright { left:22%; bottom:8%; width:17%; aspect-ratio:1; }
  #thit   { right:3%; bottom:8%; width:17%; aspect-ratio:1; }
  #tjump  { right:22%;bottom:8%; width:17%; aspect-ratio:1; }
  #fs { position:absolute; top:6px; right:8px; z-index:5;
    background:rgba(20,16,34,.75); color:#8d86a8; border:1px solid #2a2246;
    border-radius:5px; font:700 9px monospace; letter-spacing:1px; padding:4px 7px; cursor:pointer; }

  #levelbar { display:flex; gap:6px; justify-content:center; padding-top:8px; }
  #levelbar a { flex:1; text-align:center; text-decoration:none;
    font:700 9px/1 monospace; letter-spacing:1px; padding:7px 4px;
    color:#8d86a8; background:rgba(255,255,255,.04);
    border:1px solid #2a2246; border-radius:5px; }
  #levelbar a:hover { color:#ffd447; border-color:#ffd447; background:rgba(255,212,71,.08); }
  #levelbar a.aktiv { color:#ff3d8b; border-color:#ff3d8b; background:rgba(255,61,139,.10); }
  /* Noch zu (Level davor fehlt) bzw. noch gar nicht gebaut. */
  #levelbar span.zu, #levelbar span.bald {
    flex:1; text-align:center; font:700 9px/1 monospace; letter-spacing:1px; padding:7px 4px;
    color:#3f3a55; background:rgba(255,255,255,.02);
    border:1px dashed #241d3c; border-radius:5px; user-select:none; cursor:default; }
  #levelbar span.bald { border-style:dotted; }
  html.touch #levelbar { padding:6px 8px; }
  html.touch #levelbar a, html.touch #levelbar span { padding:11px 4px; font-size:11px; }
  #cab:fullscreen #levelbar { display:none; }
  html.touch #touch { display:block; }
  html.touch #marquee, html.touch #base, html.touch #fs { display:none; }
  html.touch #cab { padding:0; border-radius:0; box-shadow:none; background:#000; }
  #cab:fullscreen { padding:0; border-radius:0; box-shadow:none; background:#000;
    width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #cab:fullscreen #marquee, #cab:fullscreen #base { display:none; }
  #rotate { position:fixed; inset:0; z-index:99; display:none; background:#06050c; color:#f4f0ff;

  #rotate .ph { width:52px; height:88px; border:3px solid #ff3d8b; border-radius:8px;

  #rotate b { font:700 13px monospace; letter-spacing:3px; color:#ff3d8b; }
  #rotate span { font:400 10px monospace; letter-spacing:1px; color:#8d86a8; }

  @media (orientation:portrait){ html.touch #rotate{display:flex;} }

<script>
/* ============================================================================
   NACHTSCHICHT - LEVEL 2: BEI MORITZ

   Bewusst KEIN zweites Schleich-Level. In Level 1 geht es darum, nicht
   gesehen zu werden. Hier geht es darum, eine Meute in Bewegung zu kriegen.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG */
  gehTempo:       104,
  beschleunigung: 900,
  bremsung:      1250,
  luftKontrolle:   0.55,
  gravitation:    920,
  sprungKraft:   -240,
  kurzsprung:      0.45,
  coyoteMs:        95,
  puffermMs:      130,

  /* (2) KAMERA */
  kameraTraegheit: 6.5,
  blickVoraus:    26,

  /* (3) DER PEGEL - neu in diesem Level, und er bleibt dir erhalten */
  pegelMax:       100,
  proSchluck:      16,
  pegelAbbau:       0.6,   // pro Sekunde, sehr langsam
  mutAb:           35,     // ab hier traust du dich Sachen
  wackelnAb:       55,     // ab hier faengt das Bild an zu schwanken
  langsamAb:       70,     // ab hier wirst du spuerbar langsamer
  blackoutBei:    100,

  /* (4) DIE UHR - um 22:00 faehrt die Bahn
     190 Sekunden waren zu viel: eine saubere Runde dauert keine dreissig.
     Der Druck kommt jetzt aus der Geduld der Jungs, die Uhr ist die
     aeussere Grenze fuer eine Runde, die aus dem Ruder laeuft. */
  startMinute:   21*60+10,
  endMinute:     22*60,
  levelSekunden: 165,

  /* (5) REDEN UND SUCHEN */
  reichweite:      15,     // wie nah du an Leuten und Sachen sein musst
  suchDauer:        0.6,
  /* Betrunken suchst du schlechter. Das ist die andere Seite vom Pegel -
     vorher war er nur ein Schalter fuer den Telefonierer. */
  suchPegel:        1.1,   // so viel langsamer bei vollem Pegel
  uebersehenAb:    55,     // ab hier uebersiehst du auch mal was
  uebersehen:       0.5,   // wie oft dann ein Fund durchrutscht

  /* (5c) DIE GEDULD DER JUNGS - das Herz des Levels
     Vorher war eine Aufgabe erledigt und blieb erledigt. Man konnte in
     aller Ruhe eine Liste abarbeiten. So laeuft ein Vorgluehen aber
     nicht: wer fertig ist, macht nach zwei Minuten wieder eine auf.
     Es reicht nicht, alle vier fertig zu KRIEGEN - sie muessen es
     GLEICHZEITIG sein.

     Die Zahlen sind an einer sauberen Runde gemessen: einmal quer durch
     die Wohnung und alle vier einsammeln dauert gut zehn Sekunden. Wer
     von rechts nach links arbeitet - Telefonierer, Moritz, Schlaefer,
     Max, und der kuerzeste Balken liegt an der Tuer - schafft es ohne
     einen einzigen Absprung. Wer die Reihenfolge nicht sieht, laeuft
     hinterher. Genau das soll der Unterschied sein.

     Wer wie lange durchhaelt, haengt daran, wie teuer es ist, ihn wieder
     einzusammeln. Den Schlaefer ruettelt man im Vorbeigehen wach, und er
     liegt an der Tuer - der darf der kuerzeste sein. Den Telefonierer
     kostet es Mut, also einen Umweg ueber die Kueche: der braucht Luft. */
  geduldSchlaefer: 15,     // schlaeft am schnellsten wieder ein
  geduldTelefon:   22,     // teuer zurueckzuholen, darum mehr Zeit
  geduldMoritz:    26,
  geduldMax:       36,     // der will ja los, der haelt am laengsten durch
  geduldWarnung:    7,     // ab hier blinkt sein Balken
  leuteTempo:      42,     // wie schnell sie durch die Wohnung laufen
  sammelX:         74,     // wo sie sich sammeln - nicht direkt vor der Tuer

  /* (5d) DER GUTE SCHNAPS - steht oben auf dem Schrank
     Einmal pro Runde. Setzt die Geduld aller zurueck und kostet Pegel. */
  schnapsPegel:    24,
  schnapsHoehe:    18,     // wie weit ueber dem Schrank die Flasche steht

  /* (5b) DIE ANDEREN - Statisten, die nur rumstehen */
  schwatzDauer:     2.6,   // wie lange ein Spruch stehen bleibt
  schwatzPauseMin:  2.5,   // Stille dazwischen - immer nur einer redet
  schwatzPauseMax:  6,

  /* (6) DER KRACHER AM ENDE - drei Muster statt einem
     Mit nur einem Schwinger war der Kampf nach dem zweiten Konter
     durchschaut: hinsehen, druecken, fertig. Jetzt muss man lesen, was
     kommt - und darf nicht mehr einfach draufhalten. */
  gegnerTreffer:    3,     // so oft musst du kontern
  konterFenster:    0.4,   // nur im letzten Teil des Ausholens zaehlt E
  gegnerWindup:     0.8,   // SCHWINGER - lange Vorwarnung, daran lernt man es
  doppelWindup:     0.55,  // DOPPEL   - zweimal kurz hintereinander
  doppelLuecke:     0.34,  // Pause zwischen den beiden Schlaegen
  fintenWindup:     0.6,   // FINTE    - er holt aus...
  fintenHalt:       0.55,  // ...haelt an (hier ist E ein Fehler)...
  fintenNach:       0.45,  // ...und kommt dann doch
  gegnerHektik:     0.9,   // beim letzten Treffer laeuft alles etwas schneller
  gegnerSchlag:     0.2,
  gegnerPause:      1.1,
  fehlschlagStrafe: 0.65,  // zu frueh gedrueckt - so lange geht bei dir nichts
  leben:            3,

  /* (7) MUSIK - der Pegel schlaegt auf den Ton durch
     Nuechtern ist es ein sauberer Bass. Je voller du wirst, desto lauter,
     schiefer, dreckiger und traeger wird er. Man hoert den eigenen Zustand,
     bevor man ihn am Balken abliest. */
  musikLaut:      0.026,   // Grundlautstaerke im Spiel
  musikLautPegel: 0.034,   // so viel kommt bei vollem Pegel dazu
  musikSchiefAb:  0.45,    // ab diesem Pegelanteil faengt es an zu schwanken
  musikSchief:    0.10,    // wie weit die Toene dann daneben liegen
  musikDreckAb:   0.60,    // ab hier saegt der Bass statt zu pulsen
  musikQuinteAb:  0.75,    // ab hier liegt eine schiefe Quinte drunter
  musikSchleppen:  12,     // um so viele BPM zieht es sich bei vollem Pegel
  musikBpm:       128,
};

const SPR={

  geh:[
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk']),
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','.p...p.','.p...p.','kk...kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','.p.pp..','p..pp..','.kk.kk.']),
  ],
  sprung:[...KOPF,'k.ttt.k','.tttttt','..ttt..','..ttt..','..ppp..','.pp.pp.','.p...p.','kk...kk'],
  fall:  [...KOPF,'..ttt..','ktttttk','..ttt..','..ppp..','..p.p..','.pp.pp.','.p...p.','.k...k.'],
  suchen:[...KOPF,'..ttt..','.ttttts','k.ttt.s','..ttt..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  konter:['..hhh....','.hsssh...','.sssss...','..sss....','..ttt....','.ttttssss',
          'k.ttt....','..ttt....','..ppp....','..p.p....','..p.p....','.pp.pp...','.kk..kk..'],

  /* MORITZ - dunkle Haare, groesser, weiss-blaues Fussballtrikot */
  moritz:['..HHH..','.HsssH.','.sssss.','..sss..','..sss..','..TBT..','.TTBTT.',
          'kTTBTTk','.TTBTT.','..TBT..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  moritzGeh:['..HHH..','.HsssH.','.sssss.','..sss..','..sss..','..TBT..','TTBTT..',
             'kTTBTTk','.TTBTT.','..TBT..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk'],
  /* MAX FERDI - aus Level 1, Sportler */
  max:['..hhh..','.hsssh.','.sssss.','..sss..','..ccc..','.ccccc.','k.ccc.k','..ccc..',
       '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* Der Schlaefer auf dem Sofa */
  schlaefer:['..........','..hhh.....','.hsssh....','.sssss....','.vvvvvvvv.','.vvvvvvvv.',
             '..pppppp..','..kk..kk..'],
  /* Der Telefonierer auf dem Balkon */
  telefon:['..hhh..','.hsssh.','.sssssg','..sss.g','..mmm..','.mmmmm.','k.mmm..','..mmm..',
           '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],

  kracher:['..ddd..','.dkkkd.','.dsssd.','..ksk..','..sss..','.vvvvv.','vvvvvvv','k.vvv.k',

  kracherAus:['..ddd....','.dkkkd...','.dsssd...','..ksk....','..sss....','.vvvvvss.',
              'vvvvvvvss','k.vvv....','..vvv....','..mmm....','..m.m....','.mm.mm...','.kk..kk..'],

  /* ---- Statisten. Die stehen nur rum. ----
     Bewusst ohne Gesichtsdetails und ohne Namen: sie sollen als Hintergrund
     lesbar sein, damit niemand versucht, mit ihnen zu reden. */
  gastKapuze:['..hhh..','.hsssh.','.sssss.','..sss..','..qqq..','.qqqqq.','.qqqqq.','..qqq..',
              '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  gastBecher:['..hhh..','.hsssh.','.sssss.','..sss..','..vvv..','.vvvvvc','k.vvv.s','..vvv..',
              '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  gastLehnt: ['...hhh.','..hsssh','..sssss','...sss.','..uuu..','.uuuuu.','k.uuu.k','..uuu..',
              '..ppp..','..p.p..','.pp.p..','.pp.p..','.kk.kk.'],
  gastHockt: ['..........','..hhh.....','.hsssh....','.sssss....','..sss.....',
              '..ooo.....','.ooooo....','.ooooooo..','..pppppp..','..kk..kk..'],

  gastTanz:[
    ['k.....k','..hhh..','.hsssh.','.sssss.','..sss..','..nnn..','.nnnnn.','..nnn..','..nnn..',
     '..ppp..','..p.p..','.pp.pp.','.kk..kk'],

  /* Einrichtung */

  tuer:  ['zzzzzzzz','zjjjjjjz','zjjjjjjz','zjjjjjjz','zjjjjjjz','zjjjjgjz','zjjjjjjz','zjjjjjjz',

/* ==========================================================================
   AUDIO
   ========================================================================== */
const SFX={
  schritt:()=>piep(95+Math.random()*20,.03,'triangle',.016),
  sprung: ()=>piep(430,.06,'square',.032),
  landen: ()=>piep(160,.05,'triangle',.028),
  reden:  ()=>piep(520+Math.random()*180,.04,'square',.025),
  fund:   ()=>{ piep(880,.08); setTimeout(()=>piep(1320,.1),80); setTimeout(()=>piep(1760,.15),170); },
  nichts: ()=>piep(220,.09,'sine',.03),
  schluck:()=>{ glissando(300,160,.22,'sine',.05); rauschen(.1,.03); },
  erledigt:()=>{ piep(660,.08); setTimeout(()=>piep(990,.12),85); },
  warn:   ()=>piep(880,.07,'square',.05),
  klatsch:()=>{ rauschen(.09,.13); glissando(220,60,.14,'square',.07); },
  daneben:()=>{ rauschen(.12,.05); glissando(520,240,.14,'sine',.03); },
  /* Wenn einer wieder abspringt - runter statt rauf, das hoert man sofort */

  sammeln:()=>{ [523,659,784].forEach((f,i)=>setTimeout(()=>piep(f,.12,'square',.045),i*90)); },

/* Musik: Vorgluehen laeuft - und kippt mit dem Pegel.
   Es bleibt eine einzige Bassfigur, es kommt kein zweiter Klangerzeuger
   dazu. Was sich aendert, ist wie sie gespielt wird. */
const BASS=[110,0,110,0, 146,0,110,0, 98,0,98,0, 130,0,146,164];
function musik(){
  if(!AC||muted||S.modus==='pause') return;
  const spielt = S.modus==='spiel'||S.modus==='kampf';
  const p = spielt ? S.pegel/TUNE.pegelMax : 0;
  /* Das Tempo zieht sich - der Abend wird zaeh. */
  const st=60/(TUNE.musikBpm-p*TUNE.musikSchleppen)/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut = spielt ? TUNE.musikLaut+p*TUNE.musikLautPegel : .014;
    if(f){
      /* Verstimmung: nicht gleichmaessig hoch, sondern hin und her -
         gleichmaessig klaenge nach Tonartwechsel, nicht nach schief. */
      const schief = p>TUNE.musikSchiefAb
        ? 1+(p-TUNE.musikSchiefAb)*TUNE.musikSchief*Math.sin(MUS.step*1.7) : 1;
      ton(f*schief,MUS.next,st*.85,p>TUNE.musikDreckAb?'sawtooth':'square',laut);
      /* Ganz oben liegt eine schiefe Quinte drunter. Das ist der Punkt, ab
         dem es nicht mehr nach Musik klingt, sondern nach zu viel. */
      if(p>TUNE.musikQuinteAb&&i%2===0) ton(f*1.47*schief,MUS.next,st*.6,'sawtooth',laut*.45);
    }
    if(spielt){
      if(i%4===0) ton(55,MUS.next,.09+p*.06,'sine',.05+p*.03);
      if(i%4===2) rauschenKurz(MUS.next);
    }
    MUS.next+=st; MUS.step++;
  }
}

    meldung:'', meldungT:0, hinweis:'', hinweisT:0,
    suchT:0, suchZiel:null,
    ruettel:0, blitz:0,
    szene:0, szeneT:0, skipT:0,
    gegner:null, fehlT:0, gewonnen:false, faenger:'',
    neueBestzeit:false, alteBest:null,
    schwatzWer:-1, schwatzText:'', schwatzT:2,
    /* Wer gerade mitkommt, wie lange er noch will, und wo er steht. */
    bereit:{}, geduld:{}, warSchon:{}, leuteX:{},
    abmarsch:false, abmarschT:0,
    schnapsDa:true, hatSchnaps:false,
  };
  LEUTE.forEach(l=>{
    S.leuteX[l.id]=l.x;
    if(l.startFertig){ S.bereit[l.id]=true; S.warSchon[l.id]=true; S.geduld[l.id]=TUNE[l.geduld]; }
  });
  /* Jacke und Ausweis liegen jede Runde woanders.
     Das Sofa faellt bewusst raus - dort liegt der Schlaefer, und bei
     gleichem Abstand gewinnt die Person. Ein Fund dort waere nicht
     erreichbar. */
  const belegt=LEUTE.map(l=>l.x);
  const versteckbar=DINGE.filter(d=>
    ['tisch','schrank','regal','bett','box','spuele'].includes(d.art) &&
    !belegt.some(px=>Math.abs(px-(d.x+6))<TUNE.reichweite));
  const mischen=mische(versteckbar);
  S.jackeBei=mischen[0].art;
  S.ausweisBei=mischen[1].art;
  S.kamX=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2));
}

const keys={};

function druckSprung(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){
    /* Gewonnen fuehrt weiter - solange es ein naechstes Level gibt.
       Sonst bleibt nur der Neustart, zurueck nach Level 1 waere ein
       Rueckschritt. */
    if(S.gewonnen){ const n=Stand.naechstes(LEVEL_NR);
      if(n){ location.href=Stand.link(n.datei); return; } }
    neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(S.modus==='titel'&&(e.code==='Digit1'||e.code==='Numpad1')){
    e.preventDefault(); Stand.geheZu(1); }
  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['KeyE','Enter'].includes(e.code)) aktionGehalten=false;

function pruefeBlackout(){
  if(S.pegel<TUNE.blackoutBei||S.modus==='ende') return false;
  S.modus='ende'; S.gewonnen=false;
  S.faenger='BLACKOUT. AUF MORITZ SOFA.'; SFX.aua();
  return true;
}
const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };
/* Eine Aufgabe ist erledigt, wenn der Gegenstand da ist - oder, bei den
   Leuten, solange derjenige gerade auch mitkommen will. */
const aufgabeOk=a=>a.wer?!!S.bereit[a.wer]:!!S.erledigt[a.id];
const alleFertig=()=>AUFGABEN.every(aufgabeOk);

/* ==========================================================================
   DIE GEDULD DER JUNGS
   Vorher war eine Aufgabe erledigt und blieb erledigt - man konnte in
   aller Ruhe eine Liste abarbeiten. Jetzt zaehlt nur der Moment, in dem
   alle gleichzeitig stehen.
   ========================================================================== */
function machtMit(l){
  S.bereit[l.id]=true;
  S.warSchon[l.id]=true;
  S.geduld[l.id]=TUNE[l.geduld];
  SFX.erledigt();
}
function springtAb(l){
  S.bereit[l.id]=false;
  S.geduld[l.id]=0;
  meldung(l.absprung,2.4);
  SFX.absprung();
}
function geduldLaeuft(dt){
  /* Sobald einmal alle vier gleichzeitig standen, ist Schluss. Sonst
     koennte einem der Erfolg im letzten Moment noch wegbrechen, und das
     waere keine Spannung mehr, sondern Willkuer. */
  if(S.abmarsch){ S.abmarschT+=dt; return; }
  for(const l of LEUTE){
    if(!S.bereit[l.id]) continue;
    S.geduld[l.id]-=dt;
    if(S.geduld[l.id]<=0) springtAb(l);
  }
  if(alleFertig()) starteAbmarsch();
}
function starteAbmarsch(){
  S.abmarsch=true; S.abmarschT=0;
  zeigeHinweis('ALLE VIER STEHEN - RAUS HIER',4);
  SFX.sammeln();
}
/* Sie laufen selbst durch die Wohnung: zu ihrem Rueckzugsort, wenn sie
   abgesprungen sind, sonst auf ihren Platz - und am Ende alle zur Tuer. */
function leuteLaufen(dt){
  LEUTE.forEach((l,i)=>{
    let ziel=l.x;
    /* Nur wer schon mal mitkam und wieder abgesprungen ist, zieht sich
       zurueck. Am Anfang steht jeder auf seinem Platz - Moritz sucht ja
       noch seinen Ausweis, er sitzt nicht schon auf dem Bett. */
    if(S.abmarsch) ziel=TUNE.sammelX+i*12;
    else if(!S.bereit[l.id]&&S.warSchon[l.id]&&l.wegX!==undefined) ziel=l.wegX;
    const jetzt=S.leuteX[l.id], d=ziel-jetzt;
    if(Math.abs(d)>0.5) S.leuteX[l.id]=jetzt+Math.sign(d)*Math.min(Math.abs(d),TUNE.leuteTempo*dt);
  });
}
/* Auf welcher Hoehe jemand steht. Moritz setzt sich aufs Bett, wenn er
   abspringt - dann muss man zu ihm hoch. */
function leuteY(l){
  if(!S.abmarsch&&!S.bereit[l.id]&&S.warSchon[l.id]&&l.wegHoch){
    const p=plattform(l.wegHoch); if(p) return p.y;
  }
  return BODEN;
}

/* Immer nur einer der Statisten sagt was, dann ist eine Weile Ruhe.
   Alle gleichzeitig waere Krach, nicht Atmosphaere. */
function geschwaetz(dt){
  S.schwatzT-=dt;
  if(S.schwatzT>0) return;
  if(S.schwatzWer>=0){
    S.schwatzWer=-1;
    S.schwatzT=TUNE.schwatzPauseMin+Math.random()*(TUNE.schwatzPauseMax-TUNE.schwatzPauseMin);
  } else {
    S.schwatzWer=Math.floor(Math.random()*STATISTEN.length);
    S.schwatzText=pick(S.pegel>=TUNE.mutAb?GESCHWAETZ_SPAET:GESCHWAETZ);
    S.schwatzT=TUNE.schwatzDauer;
  }
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(S.minute>=TUNE.endMinute){ S.modus='ende'; S.gewonnen=false;
    S.faenger='DIE BAHN IST WEG'; SFX.aua(); return; }

  /* Pegel baut sich sehr langsam ab */
  if(pruefeBlackout()) return;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  /* Im Kampf ist Ruhe - da soll man auf ihn achten, nicht auf die Gaeste. */
  if(S.modus==='kampf'){ kampf(dt); kamera(dt); return; }
  geschwaetz(dt);
  /* Die Geduld laeuft weiter, auch waehrend du mit jemandem redest.
     Sonst waere Reden eine Pause, und genau das ist es nicht. */
  geduldLaeuft(dt);
  leuteLaufen(dt);

  /* --- Gespraech laeuft --- */
  if(S.reden){
    S.redeT+=dt;
    while(aktionPuffer.length){ aktionPuffer.shift(); naechsteZeile(); }
    kamera(dt); return;
  }

  /* --- Bewegung --- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*tempoBonus()*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));

  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt;
  const vorherY=S.y;
  S.y+=S.vy*dt;
  /* Auf welcher Hoehe landen wir? Standardmaessig auf dem Boden - es sei
     denn, wir kreuzen von oben eine Moebelkante. Nach oben blockiert
     nichts: man springt durch die Platte durch und landet oben drauf. */
  let boden=BODEN;
  if(S.vy>=0){
    for(const p of PLATTFORMEN){
      if(S.x+3<p.x||S.x-3>p.x+p.breite) continue;
      if(vorherY<=p.y+0.01&&S.y>=p.y&&p.y<boden) boden=p.y;
    }
  }
  if(S.y>=boden){ S.y=boden; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  /* --- Suchen laeuft --- */
  if(S.suchT>0){
    S.suchT-=dt;
    /* Tastendruecke waehrend des Wuehlens verfallen. Vorher stapelten
       sie sich und loesten danach alle auf einmal aus - man kam aus dem
       Schrank raus und hatte drei Sachen gemacht, die man nicht wollte. */
    while(aktionPuffer.length) aktionPuffer.shift();
    if(S.suchT<=0) suchErgebnis();
    kamera(dt); return;
  }

  /* --- Aktion --- */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    /* Das Naehere gewinnt. Haetten Personen immer Vorrang, waeren Moebel
       direkt neben jemandem gar nicht erreichbar - genau so war das Bett
       neben Moritz unbenutzbar und der Ausweis unauffindbar. */
    let person=null, dPerson=1e9;
    for(const l of LEUTE){
      const d=Math.abs(S.leuteX[l.id]-S.x);
      /* Wer ueber dir sitzt, ist von unten nicht ansprechbar - da muss man
         hoch. Runter reicht man dagegen immer: wer auf dem Sofa steht,
         kommt an den ran, der davor liegt. */
      if(leuteY(l)<S.y-4) continue;
      if(d<TUNE.reichweite&&d<dPerson){ person=l; dPerson=d; }
    }
    let ding=null, dDing=1e9;
    for(const d0 of DINGE){ const d=Math.abs(d0.x+6-S.x);
      if(d<TUNE.reichweite&&d<dDing){ ding=d0; dDing=d; } }
    /* Der Schnaps oben auf dem Schrank geht allem vor - wer da oben
       steht, will nicht den Schrank durchsuchen. */
    if(schnapsInReichweite()) nimmSchnaps();
    /* An der Tuer geht Rausgehen vor allem anderen. Sonst stehen einem
       die eigenen Leute im Weg: sie sammeln sich beim Abmarsch neben der
       Tuer, und jedes E hat dann mit ihnen geredet statt zu oeffnen. */
    else if(S.x<60&&alleFertig()) starteKampf();
    else if(S.hatSchnaps&&!person&&!ding) schnapsRunde();
    else if(person&&(!ding||dPerson<=dDing)) rede(person);
    else if(ding) benutze(ding);
    else if(S.x<60){ meldung(fehltNoch(),1.8); SFX.nichts(); }
  }
  kamera(dt);
}

/* ---- Dinge benutzen ---- */
function benutze(d){
  if(d.art==='getraenk'){
    S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.proSchluck);
    SFX.schluck(); meldung(pick(['AUF EX','RUNTER DAMIT','NOCH EINEN']),1.2);
    /* Sofort pruefen. Getrunken wird am Ende eines Bildes, geprueft wurde
       am Anfang des naechsten - dazwischen baut der Pegel ab und lag nie
       mehr bei 100. Der Blackout konnte dadurch nie ausloesen. */
    pruefeBlackout();
    return;
  }
  if(d.art==='kuehl'){
    if(S.inventar.dose){ meldung('HAST SCHON EINE',1); SFX.nichts(); return; }
    S.inventar.dose=true; SFX.fund(); S.blitz=.4;
    meldung('ENERGYDRINK EINGESTECKT',1.8);
    zeigeHinweis('DAMIT KRIEGST DU DEN SCHLAEFER WACH',3);
    return;
  }
  if(d.art==='spiegel'){
    meldung(S.pegel>TUNE.mutAb?'DU SIEHST GUT AUS':'GEHT SO',1.4); SFX.reden(); return;
  }
  if(S.durchsucht[d.art]){ meldung('SCHON DURCHSUCHT',1); SFX.nichts(); return; }
  /* Je voller, desto laenger wuehlst du. */
  S.suchT=TUNE.suchDauer*(1+(S.pegel/TUNE.pegelMax)*TUNE.suchPegel);
  S.suchZiel=d; rauschen(.12,.03);
}
function suchErgebnis(){
  const d=S.suchZiel; S.suchZiel=null;
  const treffer = (d.art===S.jackeBei&&!S.inventar.jacke)
               || (d.art===S.ausweisBei&&!S.inventar.ausweis);
  /* Betrunken rutscht dir auch mal was durch. Das Moebel bleibt dann
     offen - du kannst nochmal ran, es kostet nur Zeit. Deshalb lohnt es
     sich, nuechtern zu suchen und erst danach zu trinken.
     Die Gefahr waechst von der Schwelle an, sie springt nicht: bei 55
     ist sie null, erst ganz oben ist sie voll. Ein Schalter, der bei
     einem Punkt Unterschied von 0 auf 50 Prozent geht, fuehlt sich
     ungerecht an, auch wenn er angesagt ist. */
  const risiko = S.pegel>=TUNE.uebersehenAb
    ? TUNE.uebersehen*(S.pegel-TUNE.uebersehenAb)/(TUNE.pegelMax-TUNE.uebersehenAb) : 0;
  if(treffer&&Math.random()<risiko){
    SFX.nichts(); meldung('DA WAR DOCH WAS... NOCHMAL',1.8); return;
  }
  S.durchsucht[d.art]=true;
  if(d.art===S.jackeBei&&!S.inventar.jacke){
    S.inventar.jacke=true; S.erledigt.jacke=true; SFX.fund(); S.blitz=.6;
    meldung('DEINE JACKE',2); SFX.erledigt(); return;
  }
  if(d.art===S.ausweisBei&&!S.inventar.ausweis){
    S.inventar.ausweis=true; SFX.fund(); S.blitz=.6;
    meldung('MORITZ AUSWEIS',2);
    zeigeHinweis('BRING IHN MORITZ',3); return;
  }
  SFX.nichts(); meldung(pick(['NICHTS','NUR KRAM','LEER']),1);
}

/* ---- Der gute Schnaps ----
   Steht oben auf dem Schrank. Man sieht ihn von unten, kommt aber nur
   dran, wenn man raufspringt. Einmal pro Runde, und er kostet Pegel -
   die Rettung ist nicht umsonst. */
const schnapsInReichweite=()=>{
  if(!S.schnapsDa) return false;
  const p=plattform('schrank');
  return Math.abs(S.y-p.y)<1 && Math.abs(S.x-(p.x+p.breite/2))<10;
};
function nimmSchnaps(){
  S.schnapsDa=false; S.hatSchnaps=true;
  SFX.fund(); S.blitz=.5;
  meldung('DER GUTE SCHNAPS',2);
  zeigeHinweis('E IRGENDWO - EINE RUNDE FUER ALLE',4);
}
function schnapsRunde(){
  S.hatSchnaps=false;
  for(const l of LEUTE) if(S.bereit[l.id]) S.geduld[l.id]=TUNE[l.geduld];
  S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.schnapsPegel);
  SFX.schluck(); S.blitz=.7; S.ruettel=3;
  meldung('EINE RUNDE FUER ALLE',2.2);
  pruefeBlackout();
}

/* Wer noch fehlt - statt nur "NICHT OHNE DIE JUNGS". */
function fehltNoch(){
  const offen=AUFGABEN.filter(a=>!aufgabeOk(a));
  if(!offen.length) return '';
  if(offen.length===1) return 'OHNE '+offen[0].text+' NICHT';
  return 'ES FEHLEN NOCH '+offen.length;
}

/* ---- Reden ---- */
function rede(p){
  S.reden=p; S.redeZeile=0; S.redeT=0; S.vx=0; SFX.reden();
  p._zeilen=p.zeilen;

  /* Wer den Schnaps in der Hand hat und bei jemandem steht, der sowieso
     schon mitkommt, macht daraus eine Runde. Sonst muesste man erst ein
     leeres Fleckchen suchen, um ihn loszuwerden. */
  if(S.bereit[p.id]){
    if(S.hatSchnaps){ S.reden=null; schnapsRunde(); return; }
    p._zeilen=p.dabei; return;
  }

  /* Mut ist kein Gegenstand: den Telefonierer muss man jedes Mal neu
     unterbrechen, und dafuer muss der Pegel wieder oben sein. */
  if(p.brauchtMut){
    if(S.pegel>=TUNE.mutAb){
      p._zeilen=S.warSchon[p.id]?p.zurueck:[p.nimmt,...p.danach];
      machtMit(p);
    } else {
      p._zeilen=[...p.zeilen,'(DU TRAUST DICH NICHT, IHN ZU UNTERBRECHEN)'];
    }
    return;
  }
  /* Wer schon mal mitkam, braucht kein zweites Mal ueberzeugt zu werden.
     Den Ausweis hat Moritz ja - er zieht nur wieder die Schuhe aus. */
  if(S.warSchon[p.id]){ p._zeilen=p.zurueck; machtMit(p); return; }
  if(p.braucht&&S.inventar[p.braucht]){
    S.inventar[p.braucht]=false;
    p._zeilen=[p.nimmt,...p.danach];
    machtMit(p);
  }
}
function naechsteZeile(){
  const p=S.reden;
  S.redeZeile++;
  if(S.redeZeile>=p._zeilen.length){ S.reden=null; return; }
  SFX.reden();
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   DER KRACHER - erster Kampf im Spiel
   ========================================================================== */
/* Seine drei Muster. Der Schwinger kommt von Anfang an - daran lernt man,
   was ein Konter ueberhaupt ist. Der Doppelschlag kommt dazu, sobald der
   erste Konter gesessen hat, die Finte erst, wenn es fuer ihn eng wird.
   So wird der Kampf schwerer, waehrend man besser wird. */
const MUSTER={
  schwinger:{ zeichen:'!',  schlaege:1, windup:()=>TUNE.gegnerWindup },
  doppel:   { zeichen:'!!', schlaege:2, windup:()=>TUNE.doppelWindup },
  finte:    { zeichen:'!',  schlaege:1, windup:()=>TUNE.fintenWindup, finte:true },
};
function naechstesMuster(g){
  const offen=['schwinger'];
  if(g.hp<=TUNE.gegnerTreffer-1) offen.push('doppel');
  if(g.hp<=TUNE.gegnerTreffer-2) offen.push('finte');
  /* Nicht zweimal dasselbe hintereinander - sonst lernt man die Reihenfolge
     auswendig statt hinzusehen. */
  const frei=offen.filter(m=>m!==g.letztes);
  return pick(frei.length?frei:offen);
}
/* Ab dem letzten Treffer zieht er das Tempo an. */
const hektik=g=>g.hp<=1?TUNE.gegnerHektik:1;

function starteKampf(){
  S.modus='kampf';
  S.gegner={ x:S.x-70, hp:TUNE.gegnerTreffer, zustand:'komm', t:0, dauer:0,
             muster:MUSTER.schwinger, letztes:'', rest:0, gefintet:false };
  S.fehlT=0;
  S.x=Math.max(80,S.x); S.vx=0;
  zeigeHinweis('E ERST WENN DER BALKEN GOLD WIRD',4.5);
  SFX.warn(); meldung('WER IST DAS DENN',2);
}

function holtAus(g,name){
  g.muster=MUSTER[name]; g.letztes=name;
  g.rest=g.muster.schlaege-1;
  g.gefintet=false;
  g.zustand='wind'; g.t=0;
  g.dauer=g.muster.windup()*hektik(g);
  SFX.warn();
}
function kontert(g){
  /* Ein Konter unterbricht ihn ganz - auch den zweiten Teil eines
     Doppelschlags. Sonst waere Kontern eine Strafe. */
  g.hp--; g.rest=0; g.zustand='getroffen'; g.t=0;
  S.ruettel=5; S.blitz=.5; SFX.klatsch();
  meldung(pick(['SITZT','KONTER','ZU LANGSAM']),1.2);
}
function fehlschlag(){
  S.fehlT=TUNE.fehlschlagStrafe;
  SFX.daneben(); meldung('DANEBEN',1);
}
function trifftDich(g){
  g.zustand='schlag'; g.t=0;
  S.hp--; S.ruettel=6; S.blitz=.5; SFX.aua();
  meldung('AUTSCH',1.4);
  if(S.hp<=0){ S.modus='ende'; S.gewonnen=false; S.faenger='ER HAT DICH RAUSGEWORFEN'; }
}

function kampf(dt){
  const g=S.gegner; g.t+=dt;
  if(S.fehlT>0) S.fehlT-=dt;
  const dist=S.x-g.x;
  /* Der Puffer wird in jedem Zustand geleert, sonst loest ein Druck von
     vorhin spaeter aus. Waehrend der Fehlschlag-Strafe zaehlt er nicht. */
  const gesperrt=S.fehlT>0;
  const gedrueckt=()=>{ let n=0; while(aktionPuffer.length){ aktionPuffer.shift(); n++; }
                        return n>0&&!gesperrt; };

  if(g.zustand==='komm'){
    g.x+=Math.sign(dist)*70*dt;
    gedrueckt();
    if(Math.abs(dist)<22) holtAus(g,naechstesMuster(g));
    return;
  }
  if(g.zustand==='wind'){
    if(gedrueckt()){
      if(g.t>=g.dauer*(1-TUNE.konterFenster)) kontert(g);
      else fehlschlag();                       // zu frueh drauf
      return;
    }
    if(g.t>=g.dauer){
      /* Die Finte haelt genau dann an, wenn du gleich druecken wuerdest. */
      if(g.muster.finte&&!g.gefintet){ g.gefintet=true; g.zustand='halt'; g.t=0; SFX.nichts(); return; }
      trifftDich(g);
    }
    return;
  }
  if(g.zustand==='halt'){
    if(gedrueckt()){ fehlschlag(); return; }   // in die Finte gelaufen
    if(g.t>=TUNE.fintenHalt){
      g.zustand='wind'; g.t=0; g.dauer=TUNE.fintenNach*hektik(g); SFX.warn();
    }
    return;
  }
  if(g.zustand==='schlag'){
    gedrueckt();
    if(g.t>=TUNE.gegnerSchlag){
      if(g.rest>0){ g.rest--; g.zustand='luecke'; }   // der zweite kommt gleich
      else g.zustand='pause';
      g.t=0;
    }
    return;
  }
  if(g.zustand==='luecke'){
    gedrueckt();
    if(g.t>=TUNE.doppelLuecke){
      g.zustand='wind'; g.t=0; g.dauer=g.muster.windup()*hektik(g); SFX.warn();
    }
    return;
  }
  if(g.zustand==='getroffen'){
    g.x-=Math.sign(dist)*90*dt;
    gedrueckt();
    if(g.t>=0.5){
      if(g.hp<=0){ starteCutscene(); return; }
      g.zustand='pause'; g.t=0;
    }
    return;
  }
  if(g.zustand==='pause'){
    gedrueckt();
    if(g.t>=TUNE.gegnerPause){ g.zustand='komm'; g.t=0; }
  }
}

/* ==========================================================================
   CUTSCENE
   ========================================================================== */
const SZENEN=[
  { d:1.2, txt:'' },
  { d:2.2, txt:'*DER TYP LIEGT IM FLUR*' },
  { d:2.2, txt:'MORITZ: WER WAR DAS UEBERHAUPT' },
  { d:2.0, txt:'DU: KEINE AHNUNG' },
  { d:2.2, txt:'MAX FERDI: BAHN. JETZT.' },
  { d:1.2, txt:'' },
  { d:2.4, txt:'MORITZ: WARTE - MEIN TRIKOT' },
  { d:2.2, txt:'DU: DAS TRAEGST DU SEIT DREI TAGEN' },
  { d:2.4, txt:'MORITZ: EBEN. DAS BRINGT GLUECK.' },
  { d:2.0, txt:'' },
  { d:2.8, txt:'MORITZ IST JETZT DABEI' },
  { d:2.8, txt:'MIT IHM LAEUFT ES BESSER MIT DEN CHAYAS' },
  { d:2.4, txt:'LEVEL 2 GESCHAFFT' },
];
function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0;
  S.gegner=null; SFX.sieg(); }
function levelGeschafft(){
  /* Alte Bestzeit vor dem Speichern merken - danach ist sie ueberschrieben. */
  S.alteBest=ladeBest();
  S.neueBestzeit=Stand.geschafft(LEVEL_NR,S.zeit,'MORITZ');
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const p=S.pegel/100;
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneWohnung();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneWohnung(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  /* Raeume */
  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,BODEN-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    /* Trennwand */
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,BODEN-20);
    /* Boden */
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,BODEN,o.bis-o.von,H-BODEN);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,BODEN,o.bis-o.von,1);
    ctx.fillStyle='#00000033';
    for(let x=o.von;x<o.bis;x+=14) ctx.fillRect(x,BODEN+5,7,1);
    /* Name des Raums */
    text(o.name,o.von+6,26,'#ffffff18');
  }
  /* Wohnungstuer im Flur */
  sprite(SPR.tuer,34,BODEN-12);
  text('RAUS',34+4-textW('RAUS')/2,BODEN-20,alleFertig()?P.gold:P.dunkel);

  /* Partylicht im Wohnzimmer */
  const puls=(Math.sin(S.t*6)*.5+.5);
  ctx.globalAlpha=.10+puls*.10;
  ctx.drawImage(verlauf('partylicht',200,120,g=>{
    const gr=g.createRadialGradient(100,20,4,100,20,100);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,200,120); }),160,26);
  ctx.globalAlpha=1;
  /* Balkon: Nachthimmel */
  ctx.fillStyle='#0b1024'; ctx.fillRect(890,20,90,BODEN-20);
  for(let i=0;i<22;i++) { ctx.fillStyle=i%4===0?'#ffffff55':'#ffffff22';
    ctx.fillRect(895+(i*37)%84,26+(i*29)%70,1,1); }
  ctx.fillStyle='#2a3450';
  for(let x=890;x<980;x+=8) ctx.fillRect(x,BODEN-24,2,24);
  ctx.fillRect(890,BODEN-26,90,2);

  /* Statisten - vor der Wand, hinter allem anderen. */
  zeichneStatisten();

  /* Dinge */
  for(const d of DINGE){
    const rows=SPR[d.moebel]; if(!rows) continue;
    const y=d.hoch?BODEN-40:BODEN-rows.length;
    outline(rows,d.x,y,1,.5); sprite(rows,d.x,y);
    const nah=Math.abs(d.x+6-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
    if(nah&&Math.floor(S.t*4)%2===0){
      const t=S.durchsucht[d.art]?'OK':'E';
      text(t,d.x+6-textW(t)/2,y-9,S.durchsucht[d.art]?P.dunkel:P.gold);
    }
  }

  /* Leute.
     Wer mitkommt, steht - wer abgesprungen ist, liegt/telefoniert wieder.
     Man soll auf einen Blick sehen, wer gerade wieder weg ist. */
  for(const l of LEUTE){
    const bereit=!!S.bereit[l.id];
    /* Der Schlaefer liegt nur, solange er wieder pennt. */
    const liegt=l.liegt&&!bereit&&!S.abmarsch;
    let rows=SPR[l.spr]||SPR.steh;
    if(l.id==='schlaefer'&&!liegt) rows=SPR.steh;
    if(l.id==='telefon'&&bereit) rows=SPR.steh;
    const x=S.leuteX[l.id], fuss=leuteY(l);
    const y=liegt?BODEN-8:fuss-rows.length;
    outline(rows,x-3,y,1,.55);
    sprite(rows,x-3,y);
    text(l.name,x+3-textW(l.name)/2,y-16,bereit?P.gruen:P.dim);
    if(bereit){
      text('OK',x+3-textW('OK')/2,y-9,P.gruen);
      /* Kleiner Geduldsbalken ueber dem Kopf, damit man nicht nur im HUD
         sieht, wem gleich die Lust ausgeht. */
      if(!S.abmarsch){
        const g=S.geduld[l.id]/TUNE[l.geduld], bw=14;
        const knapp=S.geduld[l.id]<=TUNE.geduldWarnung;
        if(!knapp||Math.floor(S.t*6)%2===0){
          ctx.fillStyle='#000a'; ctx.fillRect(x-4,y-6,bw+2,3);
          ctx.fillStyle=knapp?P.rot:(g<.45?P.gold:P.gruen);
          ctx.fillRect(x-3,y-5,Math.max(1,Math.round(bw*g)),1);
        }
      }
    } else {
      const nah=Math.abs(x-S.x)<TUNE.reichweite&&fuss>=S.y-4
                &&S.modus==='spiel'&&!S.reden;
      if(nah&&Math.floor(S.t*4)%2===0) text('E',x+2,y-9,P.gold);
      /* Wer oben sitzt, bekommt einen Pfeil - sonst rennt man unten
         dagegen und versteht nicht, warum E nichts tut. */
      else if(fuss<BODEN&&Math.floor(S.t*3)%2===0) text('*',x+2,y-9,P.neon2);
    }
  }

  /* Der gute Schnaps auf dem Schrank */
  if(S.schnapsDa){
    const p=plattform('schrank');
    const sx=p.x+p.breite/2-3, sy=p.y-7+Math.round(Math.sin(S.t*2)*.6);
    outline(SPR.schnaps,sx,sy,1,.5); sprite(SPR.schnaps,sx,sy);
    if(Math.floor(S.t*2)%2===0) text('*',sx+2,sy-7,P.gold);
  }

  /* Der Kracher */
  if(S.gegner){
    const g=S.gegner;
    const rows = g.zustand==='schlag'?SPR.kracherAus:SPR.kracher;
    const blinkt = g.zustand==='wind'&&Math.floor(S.t*16)%2===0;
    outline(rows,g.x,BODEN-rows.length,1,.6);
    sprite(rows,g.x,BODEN-rows.length,1,blinkt?'#ffffff':null);
    if(g.zustand==='wind'||g.zustand==='halt'){
      const oy=BODEN-rows.length, halt=g.zustand==='halt';
      /* Zeichen ueber dem Kopf: ! Schwinger, !! Doppel, ? er haelt an */
      /* Das ! blinkt, das ? nicht: waehrend der Finte ist es der einzige
         zusaetzliche Hinweis, und ein Hinweis, den man verpassen kann,
         weil er gerade aus ist, waere keiner. */
      const z=halt?'?':g.muster.zeichen;
      if(halt||Math.floor(S.t*10)%2===0) text(z,g.x+4-textW(z)/2,oy-10,halt?P.gold:P.rot);
      /* Der Balken sagt, wann E zaehlt. Hinten liegt das Konterfenster und
         ist heller unterlegt - der Balken muss dort ankommen, vorher ist
         jeder Druck ein Fehlschlag. Bei der Finte steht er still und wird
         grau: dann wartet man. */
      const bw=18, bx=g.x-3, by=oy-6;
      const auf=halt?1:Math.min(1,g.t/g.dauer);
      const imFenster=!halt&&auf>=1-TUNE.konterFenster;
      const fw=Math.round(bw*TUNE.konterFenster);
      ctx.fillStyle='#000a';   ctx.fillRect(bx,by,bw+2,4);
      ctx.fillStyle='#2a1a26'; ctx.fillRect(bx+1,by+1,bw,2);
      ctx.fillStyle='#5c4322'; ctx.fillRect(bx+1+bw-fw,by+1,fw,2);
      ctx.fillStyle=halt?P.dunkel:(imFenster?P.gold:P.rot);
      ctx.fillRect(bx+1,by+1,Math.round(bw*auf),2);
    }
    /* Lebensbalken */
    const bw=40, bx=Math.round(S.kamX)+W/2-bw/2;
    ctx.fillStyle='#000a'; ctx.fillRect(bx-1,25,bw+2,6);
    ctx.fillStyle=P.rot; ctx.fillRect(bx,26,Math.round(bw*g.hp/TUNE.gegnerTreffer),4);
  }

  /* Spieler */
  let rows, tint=null;
  if(S.suchT>0) rows=SPR.suchen;
  /* Danebengehauen: derselbe ausgestreckte Arm, aber grau - man sieht,
     dass gerade nichts geht. */
  else if(S.fehlT>0){ rows=SPR.konter; tint=P.dunkel; }
  else if(S.modus==='kampf'&&S.gegner&&S.gegner.zustand==='getroffen') rows=SPR.konter;
  else if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  outline(rows,S.x-3,S.y-rows.length,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,S.y-rows.length,1,tint);
  else sprite(rows,S.x-3,S.y-rows.length,1,tint);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),BODEN,7,1); ctx.globalAlpha=1;

  ctx.restore();

  /* Vignette, staerker mit steigendem Pegel */
  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- Statisten ----
   Blasser und ohne Namensschild. Der Unterschied zu den echten Leuten muss
   auf den ersten Blick da sein, sonst rennt man sie an und drueckt ins Leere. */
function zeichneStatisten(){
  for(let i=0;i<STATISTEN.length;i++){
    const s=STATISTEN[i];
    const rows = s.art==='tanz' ? SPR.gastTanz[Math.floor(S.t*4)%2] : SPR[s.spr];
    /* Leichtes Wippen, damit sie nicht wie Moebel wirken. Jeder mit eigenem
       Versatz - sonst atmet die halbe Wohnung im Gleichschritt. */
    const wippe = s.art==='hockt' ? 0 : Math.round(Math.sin(S.t*1.8+i*2.1)*.7);
    const y=BODEN-rows.length+wippe;
    outline(rows,s.x-3,y,1,.3);
    sprite(rows,s.x-3,y,1,null,.78);
    if(S.schwatzWer===i&&S.modus==='spiel'&&!S.reden) sprechblase(S.schwatzText,s.x,y-3);
  }
}
function sprechblase(txt,x,y){
  const b=textW(txt)+4;
  /* Am Rand der Wohnung nicht in die Wand laufen. */
  const bx=Math.max(2,Math.min(LEVEL_B-b-2,Math.round(x-b/2)));
  ctx.fillStyle='#000000bb'; ctx.fillRect(bx,y-8,b,8);
  text(txt,bx+2,y-6,P.dim);
  ctx.fillStyle='#000000bb'; ctx.fillRect(Math.round(x)-1,y,2,1);
}

/* ---- HUD ---- */
function hud(){
  /* Herzen */
  for(let i=0;i<TUNE.leben;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-12;
  text(uhr,W-textW(uhr)-6,6,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  /* Mut-Marke */
  ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*TUNE.mutAb/100),by-1,1,6);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Aufgabenliste - jetzt eine lebende Anzeige.
     Bei den Leuten haengt hinter dem Haken ein Balken: so lange kommt er
     noch mit. Man muss sehen koennen, wo es gleich kippt, sonst ist das
     Abspringen eine Ueberraschung statt einer Ansage. */
  let y=22;
  for(const a of AUFGABEN){
    const ok=aufgabeOk(a);
    text(ok?'X':'-',6,y,ok?P.gruen:P.dunkel);
    text(a.text,14,y,ok?P.dunkel:P.weiss);
    if(a.wer&&ok&&!S.abmarsch){
      const l=person(a.wer), g=S.geduld[a.wer]/TUNE[l.geduld];
      const knapp=S.geduld[a.wer]<=TUNE.geduldWarnung;
      const bx=14+textW(a.text)+5, bw=26;
      ctx.fillStyle='#2a2440'; ctx.fillRect(bx,y+1,bw,3);
      if(!knapp||Math.floor(S.t*6)%2===0){
        ctx.fillStyle=knapp?P.rot:(g<.45?P.gold:P.gruen);
        ctx.fillRect(bx,y+1,Math.max(1,Math.round(bw*g)),3);
      }
    }
    y+=8;
  }
  if(S.abmarsch&&Math.floor(S.t*2)%2===0) textC('ALLE VIER STEHEN - RAUS AUS DER WOHNUNG',H-42,P.gold);

  /* Inventar */
  let ix=W-30;
  if(S.inventar.jacke){ sprite(SPR.jacke,ix,16); ix-=12; }
  if(S.inventar.ausweis){ sprite(SPR.ausweis,ix,16); ix-=12; }
  if(S.inventar.dose){ sprite(SPR.dose,ix,16); ix-=10; }
  if(S.hatSchnaps){ sprite(SPR.schnaps,ix,16); ix-=10;
    if(Math.floor(S.t*2)%2===0) text('E',ix+8,17,P.gold); }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Gespraech */
  if(S.reden){
    const p2=S.reden;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(p2.name,8,H-38,P.neon2);
    const zeile=p2._zeilen[S.redeZeile]||'';
    textC(zeile,H-24,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E',W-12,H-12,P.dunkel);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('BEI MORITZ',22,P.neon,3);
  textC('LEVEL 2 - VORGLUEHEN',44,P.dim);
  const zeilen=['DIE BAHN FAEHRT UM ZEHN','VIER LEUTE. KEINER WILL LOS.','MACH SIE FERTIG.'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=[['A D','LAUFEN'],['LEER','SPRINGEN'],['E','REDEN, SUCHEN, TRINKEN']];
  st.forEach((z,i)=>{ text(z[0],70,108+i*9,P.gold); text(z[1],104,108+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC('LEERTASTE ODER E',H-19,P.weiss,1);
  const a='TASTE 1    LEVEL 1 - '+Stand.level(1).name;
  const b='LEERTASTE  LEVEL 2 - '+Stand.level(2).name;
  text(a,(W-textW(a))/2,H-11,P.dunkel);
  text(b,(W-textW(b))/2,H-5,P.neon2);
}
function zeichneIntro(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,0,W,H);
  const m=Math.round(W/2);
  ctx.fillStyle='#241a2c'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#1d1727'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  /* Partylicht */
  const puls=(Math.sin(S.t*5)*.5+.5);
  ctx.globalAlpha=.14+puls*.12;
  ctx.drawImage(verlauf('introlicht',220,110,g=>{
    const gr=g.createRadialGradient(110,14,4,110,14,96);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,220,110); }),m-110,30);
  ctx.globalAlpha=1;
  sprite(SPR.sofa,m-60,124);
  sprite(SPR.schlaefer,m-52,122);
  sprite(SPR.steh,m+20,130-13);
  sprite(SPR.moritz,m+46,130-15);
  /* Zwei Statisten, damit das Intro schon nach Wohnung voller Leute aussieht */
  sprite(SPR.gastTanz[Math.floor(S.t*4)%2],m+82,130-13,1,null,.7);
  sprite(SPR.gastKapuze,m-96,130-13,1,null,.7);
  ctx.drawImage(verlauf('introvig',W,H,g=>{
    const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 2 GESCHAFFT',34,P.gold,2);
      textC('IHR SEID DRAUSSEN. GERADE NOCH.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      else if(S.alteBest!==null&&S.alteBest!==undefined)
        textC('BESTZEIT  '+Math.floor(S.alteBest/60)+':'+String(Math.floor(S.alteBest%60)).padStart(2,'0'),84,P.dunkel);
      textC('PEGEL  '+Math.round(S.pegel),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      const n=Stand.naechstes(LEVEL_NR), bald=Stand.level(LEVEL_NR+1);
      if(n){
        textC('LEVEL '+n.nr+' - '+n.name,124,P.dunkel);
        if(Math.floor(S.t*2)%2===0) textGlowC('E  WEITER',136,P.gruen,1);
      } else {
        textC(bald?'LEVEL '+bald.nr+' - '+bald.name+' FOLGT':'MEHR KOMMT NOCH',124,P.dunkel);
      }
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC('LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */
let letzte=performance.now();
function bild(jetzt){
  const dt=Math.min(.05,(jetzt-letzte)/1000); letzte=jetzt;
  update(dt); draw(dt);
  requestAnimationFrame(bild);
}
requestAnimationFrame(bild);
</script>
