const SFX={

/* Musik: das Vorgluehen laeuft im Hintergrund - und kippt mit dem Pegel.
   Nicht nur lauter: ab dem Wackelpunkt wird die Wellenform haerter, eine
   zweite Stimme kommt knapp daneben dazu (das Schweben macht den Kopf
   schwer), der Takt zieht an und die Hi-Hat verdoppelt sich.
   Alles haengt an einem Wert - p, dem Pegel von 0 bis 1. */
const BASS=[110,0,110,0, 146,0,110,0, 98,0,98,0, 130,0,146,164];
const MUS={step:0,next:0};
function musik(){
  if(!AC||muted||S.modus==='pause') return;
  /* Im Kampf laeuft die Musik weiter - sonst faellt der Ton genau dann aus,
     wenn es spannend wird. */
  const laeuft=S.modus==='spiel'||S.modus==='kampf';
  const p=Math.min(1,Math.max(0,(S.pegel||0)/100));
  const kippt=p>TUNE.wackelnAb/100;
  const st=60/(128+p*12)/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut=laeuft?.026+p*.030:.014;
    const form=kippt?'sawtooth':'square';
    /* Verstimmung: schwankt langsam und waechst ueberproportional mit dem
       Pegel. Bei p=0.5 sind das keine 2 Cent, bei p=1 hoert man es deutlich. */
    const schief=1+Math.sin(MUS.step*.37)*p*p*.05;
    if(f){
      ton(f*schief,MUS.next,st*.85,form,laut);
      if(kippt) ton(f*schief*1.013,MUS.next,st*.85,form,laut*.65);
    }
    if(laeuft){
      if(i%4===0) ton(55,MUS.next,.09,'sine',.05+p*.03);
      if(i%4===2) rauschenKurz(MUS.next,.012+p*.022);
      if(kippt&&i%2===1) rauschenKurz(MUS.next+st*.5,.008+p*.012);
    }
    MUS.next+=st; MUS.step++;
  }
}
function rauschenKurz(when,vol=.012){
  if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*.02), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(AC.destination); s.start(when);
}

/* Die anderen auf der Party. Sie stehen rum, sie wippen, sie reden Unsinn -
   mehr nicht. Bewusst NICHT in LEUTE: die Reichweiten-Suche fuer E sucht das
   naechste Ding oder die naechste Person, und ein Statist neben dem Schrank
   wuerde den Schrank unbenutzbar machen. Hier sind sie reine Kulisse.
   Die Plaetze liegen zwischen den Moebeln, nicht darauf. */
const STATISTEN=[
  { x:300, spr:umfaerben(SPR.steh,'t','q'),  phase:0.0 },
  { x:378, spr:umfaerben(SPR.steh,'t','o'),  phase:1.7 },
  { x:470, spr:umfaerben(SPR.steh,'t','u'),  phase:3.1 },
  { x:572, spr:umfaerben(SPR.hockt,'t','m'), phase:4.4, hockt:true },
  { x:864, spr:umfaerben(SPR.steh,'t','n'),  phase:5.6 },
];
/* Was sie sagen, haengt daran, wie der Abend gerade steht. */
const SPRUECHE={
  normal:['EY','LAEUFT','NOCH EINEN','WER FAEHRT','MACH LAUTER','HAHAHA',
          'WO IST MEIN GLAS','IST DAS DEINE JACKE','WIE SPAET'],
  bereit:['ENDLICH','LOS JETZT','BAHN BAHN BAHN','ZIEHT EUCH AN'],
  voll:  ['ALTER','...','MIR IST SCHLECHT','WER DREHT SICH DA'],
  kampf: ['OH','HAU IHN WEG','EYYY','NICHT DIE LAMPE'],
};

/* Was du finden musst */
const AUFGABEN=[
  { id:'jacke',  text:'DEINE JACKE FINDEN' },
  { id:'ausweis',text:'MORITZ AUSWEIS FINDEN' },
  { id:'schlaefer',text:'DEN SCHLAEFER WECKEN' },
  { id:'telefon',text:'DEN TELEFONIERER HOLEN' },
];

/* ==========================================================================
   ZUSTAND
   ========================================================================== */
let S={};
function neuesSpiel(){
  S={
    modus:'titel', t:0, zeit:0,
    x:40, y:BODEN, vx:0, vy:0, amBoden:true, letzterBoden:0, blick:1, gehPhase:0, schritte:0,
    kamX:0, hp:TUNE.leben,
    pegel:0, minute:TUNE.startMinute,
    inventar:{}, erledigt:{}, durchsucht:{},
    reden:null, redeZeile:0, redeT:0,
    ruf:null, rufT:2.5,
    meldung:'', meldungT:0, hinweis:'', hinweisT:0,
    suchT:0, suchZiel:null,
    ruettel:0, blitz:0,
    szene:0, szeneT:0, skipT:0,
    gegner:null, erholung:0, wuchtigGezeigt:false, gewonnen:false, faenger:'',
  };
  /* Jacke und Ausweis liegen jede Runde woanders.
     Das Sofa faellt bewusst raus - dort liegt der Schlaefer, und bei
     gleichem Abstand gewinnt die Person. Ein Fund dort waere nicht
     erreichbar. */
  const belegt=LEUTE.map(l=>l.x);
  const versteckbar=DINGE.filter(d=>
    ['tisch','schrank','regal','bett','box','spuele'].includes(d.art) &&
    !belegt.some(px=>Math.abs(px-(d.x+6))<TUNE.reichweite));
  const mischen=[...versteckbar].sort(()=>Math.random()-0.5);
  S.jackeBei=mischen[0].art;
  S.ausweisBei=mischen[1].art;
  S.kamX=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2));
}
neuesSpiel();

/* Crew, Bestzeiten und Freischaltung liegen in spielstand.js - gemeinsam
   fuer alle Level. Hier stehen nur noch kurze Namen dafuer. */
const LEVEL_NR=2;
const ladeCrew=()=>SPIELSTAND.crew();
const speichereCrew=n=>SPIELSTAND.nimmAuf(n);
const ladeBest=()=>SPIELSTAND.bestzeit(LEVEL_NR);
const tempoBonus=()=>SPIELSTAND.tempoBonus();

/* ==========================================================================
   EINGABE
   ========================================================================== */
const keys={};
let linksAn=false, rechtsAn=false, sprungAn=false, aktionGehalten=false;
let sprungPuffer=[], aktionPuffer=[];

function druckSprung(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  /* Gewonnen: weiter ins naechste Level. Solange es keins gibt, bleibt der
     Neustart - frueher landete man hier wieder in Level 1, was sich wie ein
     Rueckschritt angefuehlt hat. */
  if(S.modus==='ende'){
    if(S.gewonnen&&SPIELSTAND.naechstes(LEVEL_NR)){ SPIELSTAND.gehZu(LEVEL_NR+1); return; }
    neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  /* Levelauswahl auf dem Titelbild - die Ziffern kommen aus spielstand.js. */
  if(S.modus==='titel'){
    const w=SPIELSTAND.tasteZuLevel(e.code,LEVEL_NR);
    if(w){ e.preventDefault();
      if(w==='start') starte();
      else if(w==='zu'){ piep(150,.14,'square',.05); zeigeHinweis('NOCH ZU - ERST DAS LEVEL DAVOR',2); } } }
  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['KeyE','Enter'].includes(e.code)) aktionGehalten=false;
  if(e.code==='Space') sprungAn=false; });
addEventListener('blur',()=>{ linksAn=rechtsAn=sprungAn=aktionGehalten=false; });
const el=id=>document.getElementById(id);
const bind=(id,evs,fn)=>evs.forEach(ev=>el(id).addEventListener(ev,e=>{e.preventDefault();fn();},{passive:false}));
bind('tleft',['touchstart','mousedown'],()=>linksAn=true);
bind('tleft',['touchend','mouseup','touchcancel'],()=>linksAn=false);
bind('tright',['touchstart','mousedown'],()=>rechtsAn=true);
bind('tright',['touchend','mouseup','touchcancel'],()=>rechtsAn=false);
bind('tjump',['touchstart','mousedown'],druckSprung);
bind('tjump',['touchend','mouseup','touchcancel'],()=>sprungAn=false);
bind('thit',['touchstart','mousedown'],()=>{ aktionGehalten=true; druckAktion(); });
bind('thit',['touchend','mouseup','touchcancel'],()=>aktionGehalten=false);
if(IS_TOUCH) addEventListener('touchstart',function einmal(){ vollbild(); removeEventListener('touchstart',einmal); },{once:true});

/* ==========================================================================
   INTRO
   ========================================================================== */
const INTRO=[
  { d:2.4, txt:'21:10. BEI MORITZ.' },
  { d:2.4, txt:'DIE BAHN FAEHRT UM ZEHN.' },
  { d:2.6, txt:'DIE JUNGS SITZEN SEIT ZWEI STUNDEN HIER.' },
  { d:2.6, txt:'UND KEINER MACHT ANSTALTEN LOSZUGEHEN.' },
  { d:2.6, txt:'ALSO MACHST DU ES.' },
];
function starte(){ neuesSpiel(); S.modus='intro'; S.szene=0; S.szeneT=0; piep(330,.1,'sine',.04); }
function starteLevel(){ S.modus='spiel'; zeigeHinweis('KRIEG DIE JUNGS AUS DER WOHNUNG',3);
  piep(660,.08); setTimeout(()=>piep(990,.12),90); }
function intro(dt){ S.szeneT+=dt;
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

function pruefeBlackout(){
  if(S.pegel<TUNE.blackoutBei||S.modus==='ende') return false;
  S.modus='ende'; S.gewonnen=false;
  S.faenger='BLACKOUT. AUF MORITZ SOFA.'; SFX.aua();
  return true;
}
const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };
const alleFertig=()=>AUFGABEN.every(a=>S.erledigt[a.id]);

/* Immer nur einer redet. Zwei Sprechblasen gleichzeitig liest keiner, und
   der Raum soll nebenbei laufen, nicht um Aufmerksamkeit betteln. */
function statisten(dt){
  if(S.ruf){ S.ruf.t-=dt; if(S.ruf.t<=0) S.ruf=null; }
  S.rufT-=dt;
  if(S.rufT>0) return;
  const topf = S.modus==='kampf'            ? SPRUECHE.kampf
             : S.pegel>=TUNE.wackelnAb      ? SPRUECHE.voll
             : alleFertig()                 ? SPRUECHE.bereit
             :                                SPRUECHE.normal;
  const i=Math.floor(Math.random()*STATISTEN.length);
  S.ruf={ i, txt:pick(topf), t:1.7 };
  S.rufT=2.4+Math.random()*3.4;
  /* Ton nur, wenn der Rufer auch im Bild steht. */
  if(Math.abs(STATISTEN[i].x-(S.kamX+W/2))<W/2) SFX.reden();
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(S.minute>=TUNE.endMinute){ S.modus='ende'; S.gewonnen=false;
    S.faenger='DIE BAHN IST WEG'; SFX.aua(); return; }

  /* Pegel baut sich sehr langsam ab */
  if(pruefeBlackout()) return;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);
  statisten(dt);

  /* Der Kampf laeuft, die Bewegung darunter bleibt an. Vorher stand man im
     Kampf fest und konnte nur kontern - mit drei Angriffsmustern braucht es
     Laufen und Springen als zweite Antwort. */
  if(S.modus==='kampf'){
    kampf(dt);
    /* Der Kampf kann hier enden - in die Cutscene oder ins Aus. Dann darf
       die Bewegung darunter nicht mehr laufen. */
    if(S.modus!=='kampf'){ kamera(dt); return; }
  }

  /* --- Gespraech laeuft --- */
  else if(S.reden){
    S.redeT+=dt;
    while(aktionPuffer.length){ aktionPuffer.shift(); naechsteZeile(); }
    kamera(dt); return;
  }

  /* --- Bewegung --- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*tempoBonus()*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));

  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  /* Im Kampf ist der Flur die Arena. Hinter dir stehen die anderen, vor dir
     steht er - Durchsuchen und Reden sind hier vorbei. */
  if(S.modus==='kampf'){
    S.x=Math.max(TUNE.arenaVon,Math.min(TUNE.arenaBis,S.x));
    kamera(dt); return;
  }

  /* --- Suchen laeuft --- */
  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0) suchErgebnis();
    kamera(dt); return;
  }

  /* --- Aktion --- */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    /* Das Naehere gewinnt. Haetten Personen immer Vorrang, waeren Moebel
       direkt neben jemandem gar nicht erreichbar - genau so war das Bett
       neben Moritz unbenutzbar und der Ausweis unauffindbar. */
    let person=null, dPerson=1e9;
    for(const l of LEUTE){ const d=Math.abs(l.x-S.x);
      if(d<TUNE.reichweite&&d<dPerson){ person=l; dPerson=d; } }
    let ding=null, dDing=1e9;
    for(const d0 of DINGE){ const d=Math.abs(d0.x+6-S.x);
      if(d<TUNE.reichweite&&d<dDing){ ding=d0; dDing=d; } }
    if(person&&(!ding||dPerson<=dDing)) rede(person);
    else if(ding) benutze(ding);
    else if(S.x<60&&alleFertig()) starteKampf();
    else if(S.x<60) { meldung('NICHT OHNE DIE JUNGS'); SFX.nichts(); }
  }
  kamera(dt);
}

/* ---- Dinge benutzen ---- */
function benutze(d){
  if(d.art==='getraenk'){
    S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.proSchluck);
    SFX.schluck(); meldung(pick(['AUF EX','RUNTER DAMIT','NOCH EINEN']),1.2);
    /* Sofort pruefen. Getrunken wird am Ende eines Bildes, geprueft wurde
       am Anfang des naechsten - dazwischen baut der Pegel ab und lag nie
       mehr bei 100. Der Blackout konnte dadurch nie ausloesen. */
    pruefeBlackout();
    return;
  }
  if(d.art==='kuehl'){
    if(S.inventar.dose){ meldung('HAST SCHON EINE',1); SFX.nichts(); return; }
    S.inventar.dose=true; SFX.fund(); S.blitz=.4;
    meldung('ENERGYDRINK EINGESTECKT',1.8);
    zeigeHinweis('DAMIT KRIEGST DU DEN SCHLAEFER WACH',3);
    return;
  }
  if(d.art==='spiegel'){
    meldung(S.pegel>TUNE.mutAb?'DU SIEHST GUT AUS':'GEHT SO',1.4); SFX.reden(); return;
  }
  if(S.durchsucht[d.art]){ meldung('SCHON DURCHSUCHT',1); SFX.nichts(); return; }
  S.suchT=TUNE.suchDauer; S.suchZiel=d; rauschen(.12,.03);
}
function suchErgebnis(){
  const d=S.suchZiel; S.suchZiel=null;
  S.durchsucht[d.art]=true;
  if(d.art===S.jackeBei&&!S.inventar.jacke){
    S.inventar.jacke=true; S.erledigt.jacke=true; SFX.fund(); S.blitz=.6;
    meldung('DEINE JACKE',2); SFX.erledigt(); return;
  }
  if(d.art===S.ausweisBei&&!S.inventar.ausweis){
    S.inventar.ausweis=true; SFX.fund(); S.blitz=.6;
    meldung('MORITZ AUSWEIS',2);
    zeigeHinweis('BRING IHN MORITZ',3); return;
  }
  SFX.nichts(); meldung(pick(['NICHTS','NUR KRAM','LEER']),1);
}

/* ---- Reden ---- */
function rede(p){
  S.reden=p; S.redeZeile=0; S.redeT=0; S.vx=0; SFX.reden();
  /* Bedingungen pruefen */
  p._zeilen = p.zeilen;
  if(p.id==='moritz'&&S.inventar.ausweis&&!S.erledigt.ausweis){
    p._zeilen=['DU HAST IHN','ALTER DANKE',...p.danach];
    S.erledigt.ausweis=true; S.inventar.ausweis=false; SFX.erledigt();
  } else if(p.id==='schlaefer'&&S.inventar.dose&&!S.erledigt.schlaefer){
    p._zeilen=['*DU HAELTST IHM DIE DOSE HIN*',...p.danach];
    S.erledigt.schlaefer=true; S.inventar.dose=false; SFX.erledigt();
  } else if(p.id==='telefon'&&!S.erledigt.telefon){
    if(S.pegel>=TUNE.mutAb){
      p._zeilen=['*DU NIMMST IHM EINFACH DAS HANDY AB*',...p.danach];
      S.erledigt.telefon=true; SFX.erledigt();
    } else {
      p._zeilen=[...p.zeilen,'(DU TRAUST DICH NICHT, IHN ZU UNTERBRECHEN)'];
    }
  } else if(p.id==='moritz'&&S.erledigt.ausweis){
    p._zeilen=['ALLES KLAR BEI DIR','WIR KOENNEN'];
  }
}
function naechsteZeile(){
  const p=S.reden;
  S.redeZeile++;
  if(S.redeZeile>=p._zeilen.length){ S.reden=null; return; }
  SFX.reden();
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   DER KRACHER - erster Kampf im Spiel
   ========================================================================== */
function starteKampf(){
  S.modus='kampf';
  S.gegner={ x:S.x-70, hp:TUNE.gegnerTreffer, zustand:'komm', t:0, muster:'normal', blick:1 };
  S.x=Math.max(90,S.x); S.vx=0; S.erholung=0;
  zeigeHinweis('E IM RICHTIGEN MOMENT - KONTERN',4);
  SFX.warn(); meldung('WER IST DAS DENN',2);
}

/* Er packt mit jedem kassierten Treffer ein Muster drauf. Der erste Kampf
   im Spiel soll die Ansage beibringen, nicht sie voraussetzen. */
function naechstesMuster(g){
  if(g.hp>=TUNE.gegnerTreffer) return 'normal';
  if(g.hp===TUNE.gegnerTreffer-1) return Math.random()<.5?'normal':'schnell';
  return pick(['normal','schnell','wuchtig']);
}
function ansage(g){
  const m=MUSTER[g.muster];
  piep(m.ton,.08,'square',.05);
  if(m.ruf) meldung(m.ruf,.8);
  if(!m.konterbar&&!S.wuchtigGezeigt){
    S.wuchtigGezeigt=true;
    zeigeHinweis('BLAU KANNST DU NICHT KONTERN - SPRINGEN ODER WEG',3.6);
  }
}
/* Gepufferte Tastendruecke wegwerfen. Sonst zaehlt ein E aus der Pause
   noch im naechsten Ausholen mit - und kontert etwas, das man gar nicht
   gesehen hat. */
const schluckePuffer=()=>{ aktionPuffer.length=0; };

function kampf(dt){
  const g=S.gegner; g.t+=dt;
  if(S.erholung>0) S.erholung=Math.max(0,S.erholung-dt);
  const abstand=()=>Math.abs(S.x-g.x);

  if(g.zustand==='komm'){
    /* Weglaufen geht. Er setzt dann schneller nach - und die Bahn faehrt
       trotzdem um zehn, Zeit spielt also gegen dich. */
    const richtung=Math.sign(S.x-g.x)||1;
    const tempo=abstand()>64?TUNE.gegnerTempoFern:TUNE.gegnerTempo;
    g.x+=richtung*tempo*dt; g.blick=richtung;
    g.x=Math.max(TUNE.arenaVon-16,Math.min(TUNE.arenaBis,g.x));
    if(abstand()<22){ g.muster=naechstesMuster(g); g.zustand='wind'; g.t=0; ansage(g); }
    schluckePuffer(); return;
  }

  const m=MUSTER[g.muster];

  if(g.zustand==='wind'){
    while(aktionPuffer.length){
      aktionPuffer.shift();
      if(S.erholung>0) continue;                    // du stehst noch krumm da
      const offen=m.konterbar && g.t>=m.windup*(1-TUNE.konterFenster);
      if(offen){
        g.hp--; g.zustand='getroffen'; g.t=0;
        S.ruettel=5; S.blitz=.5; SFX.klatsch();
        meldung(pick(['SITZT','KONTER','ZU LANGSAM']),1.2);
      } else {
        /* Ins Leere gehauen. Die Erholung ist genau so lang, dass man das
           echte Fenster verpasst - Draufhauen kostet, statt nur nichts zu
           bringen. */
        S.erholung=TUNE.fehlErholung; SFX.nichts();
        meldung(m.konterbar?'ZU FRUEH':'DAS BLOCKST DU NICHT',1.2);
      }
      break;
    }
    if(g.zustand==='wind'&&g.t>=m.windup) schlagAus(g,m);
    return;
  }

  if(g.zustand==='schlag'){
    if(g.t>=TUNE.gegnerSchlag){ g.zustand='pause'; g.t=0; }
    schluckePuffer(); return;
  }
  if(g.zustand==='getroffen'){
    g.x-=(Math.sign(S.x-g.x)||1)*90*dt;
    if(g.t>=.5){
      if(g.hp<=0){ starteCutscene(); return; }
      g.zustand='pause'; g.t=0;
    }
    schluckePuffer(); return;
  }
  if(g.zustand==='pause'){
    /* Je angeschlagener er ist, desto weniger Luft laesst er dir. */
    const pause=TUNE.gegnerPause*(0.6+0.4*g.hp/TUNE.gegnerTreffer);
    if(g.t>=pause){ g.zustand='komm'; g.t=0; }
    schluckePuffer();
  }
}

/* Der Schlag faellt. Er setzt dabei vor - Abstand allein rettet nur, wenn
   man ihn vorher aufgebaut hat. Beim Wuchtigen geht er tief durch, da
   hilft der Sprung. */
function schlagAus(g,m){
  g.zustand='schlag'; g.t=0;
  const richtung=Math.sign(S.x-g.x)||1;
  g.blick=richtung;
  g.x+=richtung*Math.min(m.satz,Math.max(0,Math.abs(S.x-g.x)-10));
  S.ruettel=Math.max(S.ruettel,3);
  const zuWeit=Math.abs(S.x-g.x)>m.weite;
  const drueber=!m.konterbar&&!S.amBoden;
  if(zuWeit||drueber){
    meldung(drueber?'DRUEBER':'VORBEI',1.2); rauschen(.12,.05);
    return;
  }
  S.hp--; S.ruettel=6; S.blitz=.5; SFX.aua(); meldung('AUTSCH',1.4);
  if(S.hp<=0){ S.modus='ende'; S.gewonnen=false; S.faenger='ER HAT DICH RAUSGEWORFEN'; }
}

function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0;
  S.gegner=null; SFX.sieg(); }
function levelGeschafft(){
  if(S.abgerechnet) return;          // Cutscene und Ueberspringen rufen beide hier an
  S.abgerechnet=true;
  speichereCrew('MORITZ');
  S.neueBestzeit=SPIELSTAND.schaffe(LEVEL_NR,S.zeit);
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const p=S.pegel/100;
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneWohnung();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneWohnung(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  /* Raeume */
  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,BODEN-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    /* Trennwand */
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,BODEN-20);
    /* Boden */
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,BODEN,o.bis-o.von,H-BODEN);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,BODEN,o.bis-o.von,1);
    ctx.fillStyle='#00000033';
    for(let x=o.von;x<o.bis;x+=14) ctx.fillRect(x,BODEN+5,7,1);
    /* Name des Raums */
    text(o.name,o.von+6,26,'#ffffff18');
  }
  /* Wohnungstuer im Flur */
  sprite(SPR.tuer,34,BODEN-12);
  text('RAUS',34+4-textW('RAUS')/2,BODEN-20,alleFertig()?P.gold:P.dunkel);

  /* Partylicht im Wohnzimmer */
  const puls=(Math.sin(S.t*6)*.5+.5);
  ctx.globalAlpha=.10+puls*.10;
  ctx.drawImage(verlauf('partylicht',200,120,g=>{
    const gr=g.createRadialGradient(100,20,4,100,20,100);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,200,120); }),160,26);
  ctx.globalAlpha=1;
  /* Balkon: Nachthimmel */
  ctx.fillStyle='#0b1024'; ctx.fillRect(890,20,90,BODEN-20);
  for(let i=0;i<22;i++) { ctx.fillStyle=i%4===0?'#ffffff55':'#ffffff22';
    ctx.fillRect(895+(i*37)%84,26+(i*29)%70,1,1); }
  ctx.fillStyle='#2a3450';
  for(let x=890;x<980;x+=8) ctx.fillRect(x,BODEN-24,2,24);
  ctx.fillRect(890,BODEN-26,90,2);

  /* Die anderen auf der Party. Vor den Moebeln gezeichnet, aber leicht
     durchscheinend und ohne Namen ueber dem Kopf - so sieht man auf einen
     Blick, dass mit ihnen nichts zu holen ist. */
  const schwank=S.pegel>TUNE.wackelnAb?(S.pegel-TUNE.wackelnAb)/45:0;
  for(let i=0;i<STATISTEN.length;i++){
    const s0=STATISTEN[i], rows=s0.spr;
    const takt=Math.sin(S.t*3.1+s0.phase);
    const y=BODEN-rows.length-(takt>.45?1:0);
    const x=s0.x+(schwank?Math.round(Math.sin(S.t*1.7+s0.phase)*schwank*2):0);
    ctx.globalAlpha=.22; ctx.fillStyle='#000'; ctx.fillRect(x,BODEN,7,1);
    ctx.globalAlpha=1;
    outline(rows,x,y,1,.35);
    ctx.globalAlpha=.9;
    if(S.x<s0.x) spriteFlip(rows,x,y); else sprite(rows,x,y);
    ctx.globalAlpha=1;
    if(S.ruf&&S.ruf.i===i){
      const t=S.ruf.txt;
      text(t,Math.round(x+3-textW(t)/2),y-8,P.dim);
    }
  }

  /* Dinge */
  for(const d of DINGE){
    const rows=SPR[d.moebel]; if(!rows) continue;
    const y=d.hoch?BODEN-40:BODEN-rows.length;
    outline(rows,d.x,y,1,.5); sprite(rows,d.x,y);
    const nah=Math.abs(d.x+6-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
    if(nah&&Math.floor(S.t*4)%2===0){
      const t=S.durchsucht[d.art]?'OK':'E';
      text(t,d.x+6-textW(t)/2,y-9,S.durchsucht[d.art]?P.dunkel:P.gold);
    }
  }

  /* Leute */
  const imKampf=S.modus==='kampf';
  for(const l of LEUTE){
    const rows=SPR[l.spr]||SPR.steh;
    const y=l.liegt?BODEN-8:BODEN-rows.length;
    outline(rows,l.x-3,y,1,.55);
    sprite(rows,l.x-3,y);
    const erledigt = l.id==='max' || S.erledigt[l.id==='moritz'?'ausweis':l.id];
    /* Im Kampf keine Namensschilder - sie stehen nur noch rum und gucken. */
    if(imKampf) continue;
    text(l.name,l.x+3-textW(l.name)/2,y-16,erledigt?P.gruen:P.dim);
    if(erledigt) text('OK',l.x+3-textW('OK')/2,y-9,P.gruen);
    else {
      const nah=Math.abs(l.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
      if(nah&&Math.floor(S.t*4)%2===0) text('E',l.x+2,y-9,P.gold);
    }
  }

  /* Der Kracher */
  if(S.gegner){
    const g=S.gegner, m=MUSTER[g.muster]||MUSTER.normal;
    const wind=g.zustand==='wind';
    const rows = g.zustand==='schlag' ? SPR.kracherAus
               : (wind&&!m.konterbar) ? SPR.kracherWucht
               : SPR.kracher;
    const y=BODEN-rows.length;
    /* Er leuchtet auf, sobald das Konterfenster offen ist. Das Fenster ist
       kurz - dann darf man auch sehen, wann es dran ist. */
    const offen = wind && m.konterbar && g.t>=m.windup*(1-TUNE.konterFenster);
    const blinkt = offen && Math.floor(S.t*20)%2===0;
    outline(rows,g.x,y,1,.6);
    if(g.blick<0) spriteFlip(rows,g.x,y,1,blinkt?'#ffffff':null);
    else sprite(rows,g.x,y,1,blinkt?'#ffffff':null);
    if(wind){
      const farbe = m.farbe==='rot'?P.rot : m.farbe==='gold'?P.gold : P.neon2;
      const bw=22, bx=g.x-7, by=y-7;
      ctx.fillStyle='#000a'; ctx.fillRect(bx-1,by-1,bw+2,5);
      ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,3);
      /* Das Konterfenster steht als hellerer Abschnitt drin - man sieht,
         worauf man wartet, statt es auswendig zu lernen. */
      if(m.konterbar){
        const von=Math.round(bw*(1-TUNE.konterFenster));
        ctx.fillStyle='#4a4363'; ctx.fillRect(bx+von,by,bw-von,3);
      }
      ctx.fillStyle=farbe; ctx.fillRect(bx,by,Math.round(bw*Math.min(1,g.t/m.windup)),3);
      const zeichen=m.konterbar?'!':'!!';
      if(Math.floor(S.t*10)%2===0) text(zeichen,Math.round(g.x+3-textW(zeichen)/2),by-7,farbe);
    }
  }

  /* Die Arena: hinter dir und hinter ihm stehen die anderen im Weg.
     Ohne das waere die Wand am Flurende einfach unsichtbar. */
  if(S.modus==='kampf'){
    ctx.globalAlpha=.5;
    for(const rand of [TUNE.arenaVon-6,TUNE.arenaBis+6]){
      ctx.fillStyle='#0d0a14'; ctx.fillRect(rand-2,BODEN-26,4,26);
      ctx.fillStyle='#1c1730'; ctx.fillRect(rand-1,BODEN-24,2,24);
    }
    ctx.globalAlpha=1;
  }

  /* Spieler */
  let rows;
  if(S.suchT>0) rows=SPR.suchen;
  else if(S.modus==='kampf'&&S.gegner&&S.gegner.zustand==='getroffen') rows=SPR.konter;
  else if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  outline(rows,S.x-3,S.y-rows.length,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,S.y-rows.length); else sprite(rows,S.x-3,S.y-rows.length);
  /* Danebengehauen - solange das X steht, geht kein Konter. */
  if(S.erholung>0){
    ctx.globalAlpha=.4+Math.abs(Math.sin(S.t*24))*.5;
    text('X',Math.round(S.x-1),S.y-rows.length-8,P.rot);
    ctx.globalAlpha=1;
  }
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),BODEN,7,1); ctx.globalAlpha=1;

  ctx.restore();

  /* Vignette, staerker mit steigendem Pegel */
  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  /* Herzen */
  for(let i=0;i<TUNE.leben;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-12;
  text(uhr,W-textW(uhr)-6,6,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  /* Mut-Marke */
  ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*TUNE.mutAb/100),by-1,1,6);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Lebensbalken des Krachers. Steht im HUD und nicht in der Welt, sonst
     liegt er auf den Raumnamen an der Wand. */
  if(S.gegner){
    const g=S.gegner, bw=44, bx=Math.round((W-bw)/2);
    ctx.fillStyle='#000c'; ctx.fillRect(bx-2,20,bw+4,8);
    ctx.fillStyle='#2a2440'; ctx.fillRect(bx,21,bw,4);
    ctx.fillStyle=P.rot; ctx.fillRect(bx,21,Math.round(bw*g.hp/TUNE.gegnerTreffer),4);
    text('DER KRACHER',bx+(bw-textW('DER KRACHER'))/2,27,P.dunkel);
  }

  /* Aufgabenliste - im Kampf ausgeblendet. Da geht es nur noch um ihn. */
  if(S.modus!=='kampf'){
    let y=22;
    for(const a of AUFGABEN){
      const ok=!!S.erledigt[a.id];
      text(ok?'X':'-',6,y,ok?P.gruen:P.dunkel);
      text(a.text,14,y,ok?P.dunkel:P.weiss);
      y+=8;
    }
    if(alleFertig()&&Math.floor(S.t*2)%2===0) textC('ALLE BEREIT - RAUS AUS DER WOHNUNG',H-42,P.gold);
  }

  /* Inventar */
  let ix=W-30;
  if(S.inventar.jacke){ sprite(SPR.jacke,ix,16); ix-=12; }
  if(S.inventar.ausweis){ sprite(SPR.ausweis,ix,16); ix-=12; }
  if(S.inventar.dose){ sprite(SPR.dose,ix,16); ix-=10; }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Gespraech */
  if(S.reden){
    const p2=S.reden;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(p2.name,8,H-38,P.neon2);
    const zeile=p2._zeilen[S.redeZeile]||'';
    textC(zeile,H-24,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E',W-12,H-12,P.dunkel);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('BEI MORITZ',22,P.neon,3);
  textC('LEVEL 2 - VORGLUEHEN',44,P.dim);
  const zeilen=['DIE BAHN FAEHRT UM ZEHN','VIER LEUTE. KEINER WILL LOS.','MACH SIE FERTIG.'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=[['A D','LAUFEN'],['LEER','SPRINGEN'],['E','REDEN, SUCHEN, TRINKEN']];
  st.forEach((z,i)=>{ text(z[0],70,108+i*9,P.gold); text(z[1],104,108+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textC(S.hinweis,H-25,P.rot); ctx.globalAlpha=1; }
  else if(Math.floor(S.t*1.6)%2===0) textGlowC('LEERTASTE ODER E',H-25,P.weiss,1);
  levelZeile(H-13);
}

/* Levelauswahl auf dem Titelbild. Eine Zeile, eine Farbe pro Zustand:
   pink = das hier, gruen = schon geschafft, blau = offen, grau = noch zu.
   Baut sich aus spielstand.js, waechst also mit jedem neuen Level mit. */
function levelZeile(y){
  const eintraege=SPIELSTAND.menue(LEVEL_NR);
  const teile=eintraege.map(l=>l.nr+' '+(l.frei?l.kurz:'ZU'));
  const luft=7;
  let breite=-luft; for(const t of teile) breite+=textW(t)+luft;
  let x=Math.round((W-breite)/2);
  eintraege.forEach((l,i)=>{
    const col=l.aktuell?P.neon:(!l.frei?P.dunkel:(l.geschafft?P.gruen:P.neon2));
    text(teile[i],x,y,col); x+=textW(teile[i])+luft;
  });
  const hinweis='TASTE 1-'+LEVEL.length+' WECHSELT DAS LEVEL';
  text(hinweis,Math.round((W-textW(hinweis))/2),y+7,P.dunkel);
}

function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 2 GESCHAFFT',34,P.gold,2);
      textC('IHR SEID DRAUSSEN. GERADE NOCH.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegel),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      const n=SPIELSTAND.naechstes(LEVEL_NR);
      if(n){ if(Math.floor(S.t*2)%2===0)
               textGlowC('E  WEITER ZU LEVEL '+n.nr+' - '+n.name,128,P.gruen,1); }
      else { textC('LEVEL 3 FOLGT',124,P.dunkel);
             if(Math.floor(S.t*2)%2===0) textC('E  NOCH MAL',136,P.dunkel); }
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC('LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */
let letzte=performance.now();
function bild(jetzt){
  const dt=Math.min(.05,(jetzt-letzte)/1000); letzte=jetzt;
  update(dt); draw(dt);
  requestAnimationFrame(bild);
}
requestAnimationFrame(bild);
</script>
