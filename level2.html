<script>
/* ============================================================================
   NACHTSCHICHT - LEVEL 2: BEI MORITZ

   Bewusst KEIN zweites Schleich-Level. In Level 1 geht es darum, nicht
   gesehen zu werden. Hier geht es darum, eine Meute in Bewegung zu kriegen.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG */
  gehTempo:       104,
  beschleunigung: 900,
  bremsung:      1250,
  luftKontrolle:   0.55,
  gravitation:    920,
  sprungKraft:   -240,
  kurzsprung:      0.45,
  coyoteMs:        95,
  puffermMs:      130,

  /* (2) KAMERA */
  kameraTraegheit: 6.5,
  blickVoraus:    26,

  /* (3) DER PEGEL - neu in diesem Level, und er bleibt dir erhalten */
  pegelMax:       100,
  proSchluck:      16,
  pegelAbbau:       0.6,   // pro Sekunde, sehr langsam
  mutAb:           35,     // ab hier traust du dich Sachen
  wackelnAb:       55,     // ab hier faengt das Bild an zu schwanken
  langsamAb:       70,     // ab hier wirst du spuerbar langsamer
  blackoutBei:    100,

  /* (4) DIE UHR - um 22:00 faehrt die Bahn */

  endMinute:     22*60,
  levelSekunden: 190,

  /* (5) REDEN UND SUCHEN */

  suchDauer:        0.6,

  /* (6) DER KRACHER AM ENDE
     Drei Muster, die er nacheinander dazulernt. Phase 0 ist nur der
     Schwinger - der erste Kampf im Spiel muss sich selbst erklaeren.
     Ab Phase 1 kommt die Finte dazu, ab Phase 2 der Ansturm. Alles
     zwischen "..." und "...Min" wird ueber die Phasen hinweg gemischt. */
  gegnerTreffer:    4,     // so oft musst du ihn treffen (= Anzahl Phasen)
  kampfReichweite: 24,     // ab hier ist er bei dir
  kampfAbstand:    15,     // naeher als das geht er nicht an dich ran
  gegnerTempo:     70,     // wie schnell er auf dich zugeht
  folgeTempo:       0.35,  // Anteil davon, waehrend er ausholt (kein Weglaufen)

  gegnerWindup:     0.85,  // Vorwarnzeit beim Schwinger, Phase 0
  gegnerWindupMin:  0.50,  // ... in der letzten Phase
  konterFenster:    1.00,  // Anteil des Ausholens, in dem E zaehlt, Phase 0
  konterFensterMin: 0.55,  // ... in der letzten Phase
  gegnerSchlag:     0.2,
  gegnerPause:      1.10,
  gegnerPauseMin:   0.60,

  finteDauer:       0.70,  // die Finte laeuft ins Leere. Wer zuschlaegt, zahlt.
  finteStrafe:      0.26,  // so kurz ist der Schlag, der danach sofort kommt
  anlaufDauer:      0.60,  // er geht sichtbar zurueck und nimmt Anlauf
  sturmTempo:     200,
  sturmDauer:       1.20,
  sturmSprung:     12,     // so hoch musst du sein, damit er unter dir durch geht
  benommenDauer:    1.70,  // nach dem Volltreffer in die Wand steht er offen
  vertretenLang:    0.60,  // Strafe fuer einen Schlag ins Leere
  vertretenKurz:    0.26,  // Strafe fuers blinde Draufhauen
  vertretenTempo:   0.35,  // so langsam bist du, waehrend du dich fangen musst
  arenaVon:        22,     // im Flur wird gekaempft, aber nicht auf der Stelle
  arenaBis:       168,

  /* (7) MUSIK - der Pegel schlaegt auf den Ton durch */
  verzerrungAb:    35,     // ab hier faengt die Anlage an zu zerren
  verzerrungMax:    0.85,  // wieviel vom Signal am Ende durch den Verzerrer geht
  lautBonus:        0.5,   // um soviel wird alles lauter
  schwankMax:       0.08,  // wie sehr das Tempo bei vollem Pegel eiert
  schwebungMax:     0.018, // Verstimmung der zweiten Bassstimme

  leben:            3,
};

const P = {
  ink:'#08060f', weiss:'#f2f0ff', dim:'#8d86a8', dunkel:'#4a4363',
  neon:'#ff3d8b', neon2:'#42d9ff', gold:'#ffd447', rot:'#ff4d4d', gruen:'#48e08a',
  boden:'#20182a', bodenKante:'#4a3a58',
};

/* ==========================================================================
   3x5 BITMAP-FONT
   ========================================================================== */
const F = {
 A:'010,101,111,101,101', B:'110,101,110,101,110', C:'011,100,100,100,011',
 D:'110,101,101,101,110', E:'111,100,110,100,111', F:'111,100,110,100,100',
 G:'011,100,101,101,011', H:'101,101,111,101,101', I:'111,010,010,010,111',
 J:'001,001,001,101,010', K:'101,110,100,110,101', L:'100,100,100,100,111',
 M:'101,111,111,101,101', N:'101,111,101,101,101', O:'010,101,101,101,010',
 P:'110,101,110,100,100', Q:'010,101,101,110,011', R:'110,101,110,101,101',
 S:'011,100,010,001,110', T:'111,010,010,010,010', U:'101,101,101,101,111',
 V:'101,101,101,101,010', W:'101,101,111,111,101', X:'101,101,010,101,101',
 Y:'101,101,010,010,010', Z:'111,001,010,100,111',
 0:'111,101,101,101,111', 1:'010,110,010,010,111', 2:'111,001,111,100,111',
 3:'111,001,111,001,111', 4:'101,101,111,001,001', 5:'111,100,111,001,111',
 6:'111,100,111,101,111', 7:'111,001,001,001,001', 8:'111,101,111,101,111',
 9:'111,101,111,001,111',
 ' ':'000,000,000,000,000', '.':'000,000,000,000,010', ':':'000,010,000,010,000',
 '-':'000,000,111,000,000', '!':'010,010,010,000,010', '?':'110,001,010,000,010',
 '/':'001,001,010,100,100', '+':'000,010,111,010,000', ',':'000,000,000,010,100',
 '<':'001,010,100,010,001', '>':'100,010,001,010,100', '*':'101,010,111,010,101',
};
const GLYPH={}; for(const k in F) GLYPH[k]=F[k].split(',');

/* ==========================================================================
   BILD-CACHE
   ========================================================================== */
const _ids=new WeakMap(); let _nid=0;
const _spr=new Map(), _out=new Map(), _txt=new Map(), _gly=new Map(), _grd=new Map();
const rowsId=r=>{ let i=_ids.get(r); if(i===undefined){ i=++_nid; _ids.set(r,i);} return i; };
function leinwand(w,h){ const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return [c,x]; }
function verlauf(key,w,h,mal){ let c=_grd.get(key);
  if(!c){ const [cc,xx]=leinwand(w,h); mal(xx); c=cc; _grd.set(key,c); } return c; }

const KEY={ k:'#08060f', s:'#e8b088', h:'#2a1c14', t:'#3ad1a0', p:'#2b2b48', w:'#f2f0ff',
  g:'#ffd447', n:'#ff3d8b', c:'#42d9ff', r:'#ff4d4d', d:'#4a4363', b:'#6b4a2a',
  o:'#a8681f', e:'#20182e', l:'#ffe08a', v:'#c8324a', m:'#7a2d3d', a:'#1a1626',
  j:'#3d2f22', u:'#8c94ad', q:'#2e3350', z:'#5a4632',
  /* Moritz: dunkle Haare, weiss-blaues Trikot */
  H:'#1d150e', T:'#eef2ff', B:'#2f6fd0' };

function backeSprite(rows,sc,tint){
  let bw=0; for(const r of rows) if(r.length>bw) bw=r.length;
  const [c,x]=leinwand(bw*sc,rows.length*sc);
  for(let r=0;r<rows.length;r++){ const row=rows[r];
    for(let i=0;i<row.length;i++){ const ch=row[i]; if(ch==='.') continue;
      x.fillStyle=tint||KEY[ch]||'#fff'; x.fillRect(i*sc,r*sc,sc,sc); } }
  return c;
}
function holeSprite(rows,sc,tint){ const k=rowsId(rows)+'|'+sc+'|'+(tint||'-');
  let c=_spr.get(k); if(!c){ c=backeSprite(rows,sc,tint); _spr.set(k,c);} return c; }
function sprite(rows,x,y,sc=1,tint=null,alpha=1){
  const c=holeSprite(rows,sc,tint);
  if(alpha!==1) ctx.globalAlpha=alpha;
  ctx.drawImage(c,Math.round(x),Math.round(y));
  if(alpha!==1) ctx.globalAlpha=1;
}
function spriteFlip(rows,x,y,sc=1,tint=null){
  const c=holeSprite(rows,sc,tint);
  ctx.save(); ctx.translate(Math.round(x)+c.width,Math.round(y)); ctx.scale(-1,1);
  ctx.drawImage(c,0,0); ctx.restore();
}
function outline(rows,x,y,sc=1,a=.7){
  const k=rowsId(rows)+'|'+sc; let c=_out.get(k);
  if(!c){ const s=holeSprite(rows,sc,'#000'); const [cc,xx]=leinwand(s.width+2*sc,s.height+2*sc);
    xx.drawImage(s,0,sc); xx.drawImage(s,2*sc,sc); xx.drawImage(s,sc,0); xx.drawImage(s,sc,2*sc);
    c=cc; _out.set(k,c); }
  ctx.globalAlpha=a; ctx.drawImage(c,Math.round(x)-sc,Math.round(y)-sc); ctx.globalAlpha=1;
}
function textTo(g,str,x,y,col,s){
  g.fillStyle=col; str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const gl=GLYPH[str[i]]||GLYPH['?'];
    for(let r=0;r<5;r++) for(let c=0;c<3;c++)
      if(gl[r][c]==='1') g.fillRect(x+(i*4+c)*s,y+r*s,s,s); } }
function text(str,x,y,col,s=1){
  str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const ch=str[i]; if(ch===' ') continue;
    const k=ch+col+s; let c=_gly.get(k);
    if(!c){ const [cc,xx]=leinwand(3*s,5*s); textTo(xx,ch,0,0,col,s); c=cc; _gly.set(k,c); }
    ctx.drawImage(c,Math.round(x+i*4*s),Math.round(y)); } }
const textW=(s0,s=1)=>String(s0).length*4*s-s;
const textC=(s0,y,col,s=1)=>text(s0,Math.round((W-textW(s0,s))/2),y,col,s);
function textGlow(str,x,y,col,s=1){
  str=String(str).toUpperCase(); const k=str+'|'+col+'|'+s;
  let c=_txt.get(k);
  if(!c){ const pad=s,[cc,xx]=leinwand(textW(str,s)+2*pad,5*s+2*pad);
    xx.globalAlpha=.25;
    textTo(xx,str,pad-s,pad,col,s); textTo(xx,str,pad+s,pad,col,s);
    textTo(xx,str,pad,pad-s,col,s); textTo(xx,str,pad,pad+s,col,s);
    xx.globalAlpha=1; textTo(xx,str,pad,pad,col,s);
    c=cc; if(_txt.size>300) _txt.clear(); _txt.set(k,c); }
  ctx.drawImage(c,Math.round(x)-s,Math.round(y)-s); }
const textGlowC=(s0,y,col,s=1)=>textGlow(s0,Math.round((W-textW(s0,s))/2),y,col,s);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ==========================================================================
   SPRITES
   ========================================================================== */
const KOPF=['..hhh..','.hsssh.','.sssss.','..sss..'];
const geh=b=>[...KOPF,'..ttt..',...b];
const SPR={
  steh: geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
  geh:[
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk']),
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','.p...p.','.p...p.','kk...kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','.p.pp..','p..pp..','.kk.kk.']),
  ],
  sprung:[...KOPF,'k.ttt.k','.tttttt','..ttt..','..ttt..','..ppp..','.pp.pp.','.p...p.','kk...kk'],
  fall:  [...KOPF,'..ttt..','ktttttk','..ttt..','..ppp..','..p.p..','.pp.pp.','.p...p.','.k...k.'],
  suchen:[...KOPF,'..ttt..','.ttttts','k.ttt.s','..ttt..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  konter:['..hhh....','.hsssh...','.sssss...','..sss....','..ttt....','.ttttssss',
          'k.ttt....','..ttt....','..ppp....','..p.p....','..p.p....','.pp.pp...','.kk..kk..'],
  /* Ins Leere geschlagen und aus dem Tritt: Arme rudern, Beine breit. */
  vertreten:['..hhh..','.hsssh.','.sssss.','..sss..','s.ttt.s','.ttttt.','..ttt..',
             '..ppp..','..p.p..','.p...p.','p.....p','k.....k'],

  /* MORITZ - dunkle Haare, groesser, weiss-blaues Fussballtrikot */
  moritz:['..HHH..','.HsssH.','.sssss.','..sss..','..sss..','..TBT..','.TTBTT.',
          'kTTBTTk','.TTBTT.','..TBT..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  moritzGeh:['..HHH..','.HsssH.','.sssss.','..sss..','..sss..','..TBT..','TTBTT..',
             'kTTBTTk','.TTBTT.','..TBT..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk'],
  /* MAX FERDI - aus Level 1, Sportler */
  max:['..hhh..','.hsssh.','.sssss.','..sss..','..ccc..','.ccccc.','k.ccc.k','..ccc..',
       '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* Der Schlaefer auf dem Sofa */
  schlaefer:['..........','..hhh.....','.hsssh....','.sssss....','.vvvvvvvv.','.vvvvvvvv.',
             '..pppppp..','..kk..kk..'],
  /* Der Telefonierer auf dem Balkon */
  telefon:['..hhh..','.hsssh.','.sssssg','..sss.g','..mmm..','.mmmmm.','k.mmm..','..mmm..',
           '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* Der Kracher am Ende */
  kracher:['..ddd..','.dkkkd.','.dsssd.','..ksk..','..sss..','.vvvvv.','vvvvvvv','k.vvv.k',
           '..vvv..','..mmm..','..m.m..','.mm.mm.','.kk..kk'],
  kracherAus:['..ddd....','.dkkkd...','.dsssd...','..ksk....','..sss....','.vvvvvss.',
              'vvvvvvvss','k.vvv....','..vvv....','..mmm....','..m.m....','.mm.mm...','.kk..kk..'],
  /* Anlauf: er geht in die Hocke und laedt durch. */
  kracherAnlauf:['.......','..ddd..','.dkkkd.','.dsssd.','..ksk..','..sss..','.vvvvv.',
                 'kvvvvvk','..vvv..','..mmm..','.mm.mm.','.mm.mm.','kk...kk'],
  /* Ansturm: Kopf voran, Arme hinten. */
  kracherSturm:['...ddd...','..dkkkd..','..dsssd..','...ksk...','...sss...','k..vvvvv.',
                '.kkvvvvvv','...vvvv..','....vvv..','...mmm...','..mm..m..','.mm...mm.','.kk...kk.'],
  /* In die Wand gerannt: haengt in den Seilen, offen fuer alles. */
  kracherBenommen:['.......','.......','.dkkkd.','.dsssd.','..sss..','..ksk..','.vvvvv.',
                   'kvvvvvk','..vvv..','..mmm..','..m.m..','.mm.mm.','kk...kk'],

let AC=null, muted=false;
/* Alles laeuft durch dieselbe Kette:
       Tonquelle --> DRY  ----------------> MASTER --> Boxen
                 \-> WET --> Verzerrer --/
   Je hoeher der Pegel, desto mehr Signal geht ueber WET und desto lauter
   steht MASTER. Nuechtern hoert man die Anlage, betrunken hoert man sie
   zerren. */
let MASTER=null, DRY=null, WET=null;
function zerrKurve(menge){
  const n=256, c=new Float32Array(n), k=menge*100;
  for(let i=0;i<n;i++){ const x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); }
  return c; }
function ensureAudio(){ if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=1; MASTER.connect(AC.destination);
    DRY=AC.createGain(); DRY.gain.value=1; DRY.connect(MASTER);
    const shaper=AC.createWaveShaper();
    shaper.curve=zerrKurve(.5); shaper.oversample='2x'; shaper.connect(MASTER);
    WET=AC.createGain(); WET.gain.value=0; WET.connect(shaper);
    MUS.next=AC.currentTime+.05;
  }
  catch(e){ AC=null; } return AC; }
/* Jede Quelle haengt an beiden Wegen - das Verhaeltnis macht die Verzerrung. */
function anschliessen(g){ if(DRY) g.connect(DRY); if(WET) g.connect(WET);
  if(!DRY&&!WET) g.connect(AC.destination); }
function ton(f,when,dur,type='square',vol=.05){
  if(!AC||muted) return; const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,when);
  g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g); anschliessen(g); o.start(when); o.stop(when+dur+.02); }
const piep=(f,d=.07,t='square',v=.05)=>{ ensureAudio(); if(AC) ton(f,AC.currentTime,d,t,v); };
function glissando(f1,f2,dur,type='square',vol=.05){
  ensureAudio(); if(!AC||muted) return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); anschliessen(g); o.start(t0); o.stop(t0+dur+.02); }
function rauschen(dur=.25,vol=.08){
  ensureAudio(); if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); anschliessen(g); s.start(); }
const SFX={
  schritt:()=>piep(95+Math.random()*20,.03,'triangle',.016),
  sprung: ()=>piep(430,.06,'square',.032),

/* Musik: das Vorgluehen laeuft im Hintergrund. Mit steigendem Pegel wird
   die Anlage lauter, die zweite Bassstimme verstimmt sich gegen die erste,
   das Tempo eiert - und der Verzerrer macht den Rest. */
const BASS=[110,0,110,0, 146,0,110,0, 98,0,98,0, 130,0,146,164];
const MUS={step:0,next:0,zerre:-1};
/* 0 nuechtern .. 1 voll */
const pegelAnteil=()=>{
  const ab=TUNE.verzerrungAb;
  return Math.max(0,Math.min(1,(S.pegel-ab)/Math.max(1,TUNE.pegelMax-ab)));
};
function pegelKlang(){
  const p=(S.modus==='spiel'||S.modus==='kampf')?pegelAnteil():0;
  /* Nur nachfuehren, wenn sich wirklich was tut - sonst planen wir 60 mal
     pro Sekunde Rampen, die keiner hoert. */
  if(MUS.zerre>=0&&Math.abs(p-MUS.zerre)<.02) return;
  MUS.zerre=p;
  const nass=p*TUNE.verzerrungMax, jetzt=AC.currentTime;
  DRY.gain.setTargetAtTime(1-nass*.75,jetzt,.25);
  WET.gain.setTargetAtTime(nass,jetzt,.25);
  MASTER.gain.setTargetAtTime(1+p*TUNE.lautBonus,jetzt,.25);
}
function musik(){
  if(!AC) return;
  /* Nach Pause oder Stummschaltung nicht die verpasste Zeit nachholen -
     sonst feuert die halbe Schleife auf einen Schlag los. */
  if(muted||S.modus==='pause'){ MUS.next=Math.max(MUS.next,AC.currentTime); return; }
  if(MUS.next<AC.currentTime) MUS.next=AC.currentTime;
  pegelKlang();
  const p=(S.modus==='spiel'||S.modus==='kampf')?pegelAnteil():0;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    /* Tempo eiert mit dem Pegel */
    const st=60/128/4*(1+Math.sin(MUS.step*.37)*TUNE.schwankMax*p);
    const laut=(S.modus==='spiel'||S.modus==='kampf')?.026+(S.pegel/100)*.02:.014;
    if(f){
      ton(f,MUS.next,st*.85,'square',laut);
      /* Zweite Stimme, die gegen die erste schwebt */
      if(p>.02) ton(f*(1+TUNE.schwebungMax*p),MUS.next,st*.85,p>.6?'sawtooth':'square',laut*.7);
    }
    if(S.modus==='spiel'||S.modus==='kampf'){
      if(i%4===0) ton(55,MUS.next,.09,'sine',.05+p*.03);
      if(i%4===2) rauschenKurz(MUS.next,.012+p*.014);
    }
    MUS.next+=st; MUS.step++;
  }
}
function rauschenKurz(when,vol=.012){
  if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*.02), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); anschliessen(g); s.start(when);
}

  const rand=(imVollbild()||IS_TOUCH)?0:46;
  const vw=innerWidth-rand, vh=innerHeight-rand;
  W=Math.max(320,Math.min(432,Math.round(H*(vw/vh)/2)*2));

  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}

  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }

  sprungPuffer.push(S.t); sprungAn=true;

  ensureAudio();

  if(S.modus==='intro'){ S.szeneT+=99; return; }

  if(S.modus==='ende'){ if(S.gewonnen&&weiter()) return; neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }

  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }

function intro(dt){ S.szeneT+=dt;
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

function pruefeBlackout(){
  if(S.pegel<TUNE.blackoutBei||S.modus==='ende') return false;
  S.modus='ende'; S.gewonnen=false;
  S.faenger='BLACKOUT. AUF MORITZ SOFA.'; SFX.aua();
  return true;
}
const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };
const alleFertig=()=>AUFGABEN.every(a=>S.erledigt[a.id]);

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(S.minute>=TUNE.endMinute){ S.modus='ende'; S.gewonnen=false;
    S.faenger='DIE BAHN IST WEG'; SFX.aua(); return; }

  /* Pegel baut sich sehr langsam ab */
  if(pruefeBlackout()) return;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  if(S.modus==='kampf'){ kampf(dt); kamera(dt); return; }

  /* --- Gespraech laeuft --- */
  if(S.reden){
    S.redeT+=dt;
    while(aktionPuffer.length){ aktionPuffer.shift(); naechsteZeile(); }
    kamera(dt); return;
  }

  bewegung(dt,false);

  /* --- Suchen laeuft --- */
  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0) suchErgebnis();
    kamera(dt); return;
  }

  /* --- Aktion --- */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    /* Das Naehere gewinnt. Haetten Personen immer Vorrang, waeren Moebel
       direkt neben jemandem gar nicht erreichbar - genau so war das Bett
       neben Moritz unbenutzbar und der Ausweis unauffindbar. */
    let person=null, dPerson=1e9;
    for(const l of ANSPRECHBAR){ const d=Math.abs(l.x-S.x);
      if(d<TUNE.reichweite&&d<dPerson){ person=l; dPerson=d; } }
    let ding=null, dDing=1e9;
    for(const d0 of DINGE){ const d=Math.abs(d0.x+6-S.x);
      if(d<TUNE.reichweite&&d<dDing){ ding=d0; dDing=d; } }
    if(person&&(!ding||dPerson<=dDing)) rede(person);
    else if(ding) benutze(ding);
    else if(S.x<60&&alleFertig()) starteKampf();
    else if(S.x<60) { meldung('NICHT OHNE DIE JUNGS'); SFX.nichts(); }
  }
  kamera(dt);
}

/* ---- Bewegung ----
   Laeuft im Level und im Kampf. Im Kampf bleibt sie in der Arena, damit
   man dem Kracher nicht einfach in die Kueche davonlaeuft - aber springen
   muss gehen, sonst kommt man ueber seinen Ansturm nicht drueber. */
function bewegung(dt,imKampf){
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const gefangen = S.vertreten>0 ? TUNE.vertretenTempo : 1;
  const hoechst = TUNE.gehTempo*tempoBonus()*langsam*gefangen;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  const links=imKampf?TUNE.arenaVon:14, rechts=imKampf?TUNE.arenaBis:LEVEL_B-14;
  if(S.x<links||S.x>rechts) S.vx=0;
  S.x=Math.max(links,Math.min(rechts,S.x));

  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.vertreten>0) continue;              // wer sich vertreten hat, springt nicht
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;
}

/* ---- Dinge benutzen ---- */
function benutze(d){
  if(d.art==='getraenk'){
    S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.proSchluck);
    SFX.schluck(); meldung(pick(['AUF EX','RUNTER DAMIT','NOCH EINEN']),1.2);
    /* Sofort pruefen. Getrunken wird am Ende eines Bildes, geprueft wurde
       am Anfang des naechsten - dazwischen baut der Pegel ab und lag nie
       mehr bei 100. Der Blackout konnte dadurch nie ausloesen. */
    pruefeBlackout();
    return;
  }
  if(d.art==='kuehl'){
    if(S.inventar.dose){ meldung('HAST SCHON EINE',1); SFX.nichts(); return; }
    S.inventar.dose=true; SFX.fund(); S.blitz=.4;
    meldung('ENERGYDRINK EINGESTECKT',1.8);
    zeigeHinweis('DAMIT KRIEGST DU DEN SCHLAEFER WACH',3);
    return;
  }
  if(d.art==='spiegel'){
    meldung(S.pegel>TUNE.mutAb?'DU SIEHST GUT AUS':'GEHT SO',1.4); SFX.reden(); return;
  }
  if(S.durchsucht[d.art]){ meldung('SCHON DURCHSUCHT',1); SFX.nichts(); return; }
  S.suchT=TUNE.suchDauer; S.suchZiel=d; rauschen(.12,.03);
}
function suchErgebnis(){
  const d=S.suchZiel; S.suchZiel=null;
  S.durchsucht[d.art]=true;
  if(d.art===S.jackeBei&&!S.inventar.jacke){
    S.inventar.jacke=true; S.erledigt.jacke=true; SFX.fund(); S.blitz=.6;
    meldung('DEINE JACKE',2); SFX.erledigt(); return;
  }
  if(d.art===S.ausweisBei&&!S.inventar.ausweis){
    S.inventar.ausweis=true; SFX.fund(); S.blitz=.6;
    meldung('MORITZ AUSWEIS',2);
    zeigeHinweis('BRING IHN MORITZ',3); return;
  }
  SFX.nichts(); meldung(pick(['NICHTS','NUR KRAM','LEER']),1);
}

/* ---- Reden ---- */
function rede(p){
  S.reden=p; S.redeZeile=0; S.redeT=0; S.vx=0; SFX.reden();
  /* Bedingungen pruefen. Wer einen zweiten Satz Zeilen hat, kriegt ihn
     ab dem Mut-Pegel - die Wohnung redet anders, wenn Du anders bist. */
  p._zeilen = (p.spaet&&S.pegel>=TUNE.mutAb) ? p.spaet : p.zeilen;
  if(p.id==='moritz'&&S.inventar.ausweis&&!S.erledigt.ausweis){
    p._zeilen=['DU HAST IHN','ALTER DANKE',...p.danach];
    S.erledigt.ausweis=true; S.inventar.ausweis=false; SFX.erledigt();
  } else if(p.id==='schlaefer'&&S.inventar.dose&&!S.erledigt.schlaefer){
    p._zeilen=['*DU HAELTST IHM DIE DOSE HIN*',...p.danach];
    S.erledigt.schlaefer=true; S.inventar.dose=false; SFX.erledigt();
  } else if(p.id==='telefon'&&!S.erledigt.telefon){
    if(S.pegel>=TUNE.mutAb){
      p._zeilen=['*DU NIMMST IHM EINFACH DAS HANDY AB*',...p.danach];
      S.erledigt.telefon=true; SFX.erledigt();
    } else {
      p._zeilen=[...p.zeilen,'(DU TRAUST DICH NICHT, IHN ZU UNTERBRECHEN)'];
    }
  } else if(p.id==='moritz'&&S.erledigt.ausweis){
    p._zeilen=['ALLES KLAR BEI DIR','WIR KOENNEN'];
  }
}
function naechsteZeile(){
  const p=S.reden;
  S.redeZeile++;
  if(S.redeZeile>=p._zeilen.length){ S.reden=null; return; }
  SFX.reden();
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   DER KRACHER - erster Kampf im Spiel

   Drei Muster, und der Kampf bringt sie Dir nacheinander bei:

     SCHWINGER  roter Balken, "!"   -> E im Konterfenster. Trifft immer,
                                      wenn Du nichts machst. Weglaufen
                                      hilft nicht, er geht mit.
     FINTE      goldener Balken,"?" -> laeuft ins Leere. Wer trotzdem
                                      draufhaut, vertritt sich und kassiert
                                      sofort den kurzen Nachschlag.
     ANSTURM    blauer Balken, ">>" -> nicht konterbar. Spring drueber.
                                      Er rennt in die Wand und steht offen.

   Phase 0 ist nur der Schwinger, ab Phase 1 kommt die Finte dazu, ab
   Phase 2 der Ansturm. Gleichzeitig wandern Vorwarnzeit, Konterfenster
   und Erholung von den grosszuegigen Startwerten auf die harten.
   ========================================================================== */
const MUSTER=[
  ['wind'],
  ['wind','finte'],
  ['wind','finte','anlauf'],
  ['wind','finte','anlauf'],
];
/* Was der Kampf Dir sagt, sobald ein neues Muster dazukommt. */
const PHASENHINWEIS=[
  '',
  'ER TAEUSCHT AN - NICHT BLIND DRAUFHAUEN',
  'ER NIMMT ANLAUF - SPRING DRUEBER',
  'LETZTE RUNDE. ER WIRD SCHNELLER.',
];

function starteKampf(){
  S.modus='kampf';
  S.x=Math.max(TUNE.arenaVon+70,Math.min(TUNE.arenaBis-16,S.x));
  S.vx=0; S.vy=0; S.vertreten=0;
  S.gegner={ x:TUNE.arenaVon-26, hp:TUNE.gegnerTreffer, phase:0,
             zustand:'komm', t:0, letzt:'', wiederholt:0, blick:1,
             trafDich:false, verfehlt:false, sturmBlick:1, offen:false };
  zeigeHinweis('E IM RICHTIGEN MOMENT - KONTERN',4);
  SFX.warn(); meldung('WER IST DAS DENN',2);
}

/* Die Werte wandern linear von Phase 0 zur letzten Phase. */
function kampfWerte(g){
  const f=TUNE.gegnerTreffer>1?g.phase/(TUNE.gegnerTreffer-1):1;
  const misch=(a,b)=>a+(b-a)*f;
  return { windup:misch(TUNE.gegnerWindup,TUNE.gegnerWindupMin),
           fenster:misch(TUNE.konterFenster,TUNE.konterFensterMin),
           pause: misch(TUNE.gegnerPause,TUNE.gegnerPauseMin) };
}

/* Dasselbe Muster darf zweimal hintereinander kommen, dreimal nicht -
   sonst faengt der Kampf an, wie eine Wiederholung auszusehen. */
function starteMuster(g){
  const alle=MUSTER[Math.min(g.phase,MUSTER.length-1)];
  const frei=(g.wiederholt>=2&&alle.length>1)?alle.filter(m=>m!==g.letzt):alle;
  const m=pick(frei);
  g.wiederholt = m===g.letzt ? g.wiederholt+1 : 1;
  g.letzt=m; g.zustand=m; g.t=0;
  if(m==='wind')   SFX.warn();
  if(m==='finte')  piep(560,.05,'square',.045);
  if(m==='anlauf'){ piep(300,.14,'sawtooth',.05); rauschen(.1,.04); }
}

/* Konter oder freier Treffer - beides kostet ihn ein Leben. */
function trefferFuerDich(g,txt){
  g.hp--; g.zustand='getroffen'; g.t=0; g.offen=false;
  S.ruettel=5; S.blitz=.5; SFX.klatsch();
  meldung(txt||pick(['SITZT','KONTER','ZU LANGSAM']),1.2);
}
function trefferFuerIhn(txt){
  S.hp--; S.ruettel=6; S.blitz=.5; SFX.aua();
  meldung(txt||'AUTSCH',1.4);
  if(S.hp<=0){ S.modus='ende'; S.gewonnen=false;
    S.faenger='ER HAT DICH RAUSGEWORFEN'; }
}
/* Schlag ins Leere: Du bist kurz aus dem Tritt und kannst nicht kontern. */
function fehlschlag(dauer){
  S.vertreten=Math.max(S.vertreten,dauer);
  SFX.nichts(); rauschen(.06,.03);
  meldung(pick(['DANEBEN','INS LEERE','VERTRETEN']),.9);
}

function kampf(dt){
  const g=S.gegner; g.t+=dt;
  if(S.vertreten>0) S.vertreten=Math.max(0,S.vertreten-dt);
  bewegung(dt,true);

  const K=kampfWerte(g);
  const dist=S.x-g.x;
  const nah=Math.abs(dist)<TUNE.kampfReichweite;
  /* Ein Tastendruck pro Bild zaehlt, der Rest verfaellt - sonst zaehlt
     Hammern auf E schneller als Hinsehen. */
  const gedrueckt=()=>{ const n=aktionPuffer.length; aktionPuffer.length=0; return n>0; };

  if(g.zustand==='komm'){
    if(gedrueckt()) fehlschlag(TUNE.vertretenKurz);
    g.blick=Math.sign(dist)||1;
    g.x+=g.blick*TUNE.gegnerTempo*dt;
    if(nah) starteMuster(g);

  } else if(g.zustand==='wind'){
    /* Er geht langsam mit, damit Weglaufen kein Konterersatz ist -
       aber nicht in Dich hinein. */
    g.blick=Math.sign(dist)||g.blick;
    if(Math.abs(dist)>TUNE.kampfAbstand) g.x+=g.blick*TUNE.gegnerTempo*TUNE.folgeTempo*dt;
    const offen = g.t>=K.windup*(1-K.fenster);
    if(gedrueckt()){
      if(offen&&S.vertreten<=0) trefferFuerDich(g);
      else fehlschlag(TUNE.vertretenLang);
    }
    if(g.zustand==='wind'&&g.t>=K.windup){
      g.zustand='schlag'; g.t=0; trefferFuerIhn();
    }

  } else if(g.zustand==='finte'){
    g.blick=Math.sign(dist)||g.blick;
    if(gedrueckt()){
      /* Genau darauf war die Finte aus: Du stehst offen, er zieht durch. */
      fehlschlag(TUNE.vertretenLang);
      meldung('FINTE',1.1);
      g.zustand='wind'; g.t=Math.max(0,K.windup-TUNE.finteStrafe); SFX.warn();
    } else if(g.t>=TUNE.finteDauer){
      g.zustand='pause'; g.t=0; meldung('WAR NUR ANGETAEUSCHT',1.1);
    }

  } else if(g.zustand==='anlauf'){
    if(gedrueckt()) fehlschlag(TUNE.vertretenKurz);
    g.blick=Math.sign(dist)||g.blick;
    g.x-=g.blick*46*dt;                       // er geht zurueck und laedt durch
    g.x=Math.max(TUNE.arenaVon,Math.min(TUNE.arenaBis,g.x));
    if(g.t>=TUNE.anlaufDauer){
      g.zustand='sturm'; g.t=0; g.sturmBlick=Math.sign(S.x-g.x)||1;
      g.trafDich=false; SFX.klatsch();
    }

  } else if(g.zustand==='sturm'){
    if(gedrueckt()) fehlschlag(TUNE.vertretenKurz);
    g.x+=g.sturmBlick*TUNE.sturmTempo*dt;
    g.blick=g.sturmBlick;
    if(!g.trafDich&&Math.abs(S.x-g.x)<TUNE.kampfReichweite-8){
      if(BODEN-S.y>=TUNE.sturmSprung){
        g.trafDich=true; g.verfehlt=true;
        meldung('DRUEBER',1); piep(990,.09,'square',.05);
      } else {
        g.trafDich=true; g.verfehlt=false;
        trefferFuerIhn('UMGERANNT'); S.vx=g.sturmBlick*180;
      }
    }
    /* Nur die Wand vor ihm zaehlt - sonst waere er schon in dem Moment
       angekommen, in dem er sich vom Anlauf abstoesst. */
    const wand = g.sturmBlick>0 ? g.x>=TUNE.arenaBis : g.x<=TUNE.arenaVon;
    if(wand||g.t>=TUNE.sturmDauer){
      g.x=Math.max(TUNE.arenaVon,Math.min(TUNE.arenaBis,g.x));
      g.t=0;
      if(g.trafDich&&!g.verfehlt){ g.zustand='pause'; }
      else {
        /* Voll in die Wand. Jetzt steht er da. */
        g.zustand='benommen'; g.offen=true; S.ruettel=6; SFX.aua();
        zeigeHinweis('JETZT - E',1.8);
      }
    }

  } else if(g.zustand==='benommen'){
    if(gedrueckt()){
      if(Math.abs(S.x-g.x)<TUNE.kampfReichweite+6) trefferFuerDich(g,'VOLL ERWISCHT');
      else fehlschlag(TUNE.vertretenKurz);
    }
    if(g.zustand==='benommen'&&g.t>=TUNE.benommenDauer){
      g.zustand='pause'; g.t=0; g.offen=false; }

  } else if(g.zustand==='schlag'){
    aktionPuffer.length=0;
    if(g.t>=TUNE.gegnerSchlag){ g.zustand='pause'; g.t=0; }

  } else if(g.zustand==='getroffen'){
    aktionPuffer.length=0;
    g.x-=g.blick*90*dt;
    g.x=Math.max(TUNE.arenaVon-30,Math.min(TUNE.arenaBis+30,g.x));
    if(g.t>=0.5){
      if(g.hp<=0){ starteCutscene(); return; }
      g.phase=TUNE.gegnerTreffer-g.hp;
      const h=PHASENHINWEIS[Math.min(g.phase,PHASENHINWEIS.length-1)];
      if(h) zeigeHinweis(h,3.2);
      g.zustand='pause'; g.t=0;
    }

  } else if(g.zustand==='pause'){
    if(gedrueckt()) fehlschlag(TUNE.vertretenKurz);
    if(g.t>=K.pause){ g.zustand='komm'; g.t=0; }
  }
}

/* ==========================================================================
   CUTSCENE
   ========================================================================== */
const SZENEN=[
  { d:1.2, txt:'' },
  { d:2.2, txt:'*DER TYP LIEGT IM FLUR*' },
  { d:2.2, txt:'MORITZ: WER WAR DAS UEBERHAUPT' },
  { d:2.0, txt:'DU: KEINE AHNUNG' },
  { d:2.2, txt:'MAX FERDI: BAHN. JETZT.' },
  { d:1.2, txt:'' },
  { d:2.4, txt:'MORITZ: WARTE - MEIN TRIKOT' },
  { d:2.2, txt:'DU: DAS TRAEGST DU SEIT DREI TAGEN' },
  { d:2.4, txt:'MORITZ: EBEN. DAS BRINGT GLUECK.' },
  { d:2.0, txt:'' },
  { d:2.8, txt:'MORITZ IST JETZT DABEI' },
  { d:2.8, txt:'MIT IHM LAEUFT ES BESSER MIT DEN CHAYAS' },
  { d:2.4, txt:'LEVEL 2 GESCHAFFT' },
];
function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0;
  S.gegner=null; S.vertreten=0; SFX.sieg(); }
function levelGeschafft(){
  speichereCrew('MORITZ');
  Fortschritt.geschafft(LEVEL_NR);
  S.neueBestzeit=Fortschritt.setzeBestzeit(LEVEL_NR,S.zeit);
  Fortschritt.leiste(LEVEL_NR);
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const p=S.pegel/100;
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneWohnung();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneWohnung(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  /* Raeume */
  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,BODEN-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    /* Trennwand */
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,BODEN-20);
    /* Boden */
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,BODEN,o.bis-o.von,H-BODEN);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,BODEN,o.bis-o.von,1);
    ctx.fillStyle='#00000033';
    for(let x=o.von;x<o.bis;x+=14) ctx.fillRect(x,BODEN+5,7,1);
    /* Name des Raums */
    text(o.name,o.von+6,26,'#ffffff18');
  }
  /* Wohnungstuer im Flur */
  sprite(SPR.tuer,34,BODEN-12);
  text('RAUS',34+4-textW('RAUS')/2,BODEN-20,alleFertig()?P.gold:P.dunkel);

  /* Partylicht im Wohnzimmer */
  const puls=(Math.sin(S.t*6)*.5+.5);
  ctx.globalAlpha=.10+puls*.10;
  ctx.drawImage(verlauf('partylicht',200,120,g=>{
    const gr=g.createRadialGradient(100,20,4,100,20,100);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,200,120); }),160,26);
  ctx.globalAlpha=1;
  /* Balkon: Nachthimmel */
  ctx.fillStyle='#0b1024'; ctx.fillRect(890,20,90,BODEN-20);
  for(let i=0;i<22;i++) { ctx.fillStyle=i%4===0?'#ffffff55':'#ffffff22';
    ctx.fillRect(895+(i*37)%84,26+(i*29)%70,1,1); }
  ctx.fillStyle='#2a3450';
  for(let x=890;x<980;x+=8) ctx.fillRect(x,BODEN-24,2,24);
  ctx.fillRect(890,BODEN-26,90,2);

  /* Dinge */
  for(const d of DINGE){
    const rows=SPR[d.moebel]; if(!rows) continue;
    const y=d.hoch?BODEN-40:BODEN-rows.length;
    outline(rows,d.x,y,1,.5); sprite(rows,d.x,y);
    const nah=Math.abs(d.x+6-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
    if(nah&&Math.floor(S.t*4)%2===0){
      const t=S.durchsucht[d.art]?'OK':'E';
      text(t,d.x+6-textW(t)/2,y-9,S.durchsucht[d.art]?P.dunkel:P.gold);
    }
  }

  /* Statisten - stehen hinter den Moebeln und nicken zum Bass */
  for(const st of STATISTEN){
    const rows=st.rows, hoehe=rows.length;
    const nick = st.nickt&&Math.sin(S.t*13.4+st.takt)>.3 ? 1 : 0;
    const y=BODEN-hoehe+nick;
    const schaut = Math.sin(S.t*.4+st.takt)>0 ? 1 : -1;
    outline(rows,st.x-3,y,1,.45);
    if(schaut<0) spriteFlip(rows,st.x-3,y); else sprite(rows,st.x-3,y);
    const nah=Math.abs(st.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
    if(nah){
      text(st.name,st.x+3-textW(st.name)/2,y-16,P.dim);
      if(Math.floor(S.t*4)%2===0) text('E',st.x+2,y-9,P.dunkel);
    }
  }

  /* Leute */
  for(const l of LEUTE){
    const rows=SPR[l.spr]||SPR.steh;
    const y=l.liegt?BODEN-8:BODEN-rows.length;
    outline(rows,l.x-3,y,1,.55);
    sprite(rows,l.x-3,y);
    const erledigt = l.id==='max' || S.erledigt[l.id==='moritz'?'ausweis':l.id];
    text(l.name,l.x+3-textW(l.name)/2,y-16,erledigt?P.gruen:P.dim);
    if(erledigt) text('OK',l.x+3-textW('OK')/2,y-9,P.gruen);
    else {
      const nah=Math.abs(l.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
      if(nah&&Math.floor(S.t*4)%2===0) text('E',l.x+2,y-9,P.gold);
    }
  }

  /* Der Kracher */
  if(S.gegner) zeichneKracher();

  /* Spieler */
  let rows;
  if(S.suchT>0) rows=SPR.suchen;
  else if(S.vertreten>0) rows=SPR.vertreten;
  else if(S.modus==='kampf'&&S.gegner&&S.gegner.zustand==='getroffen') rows=SPR.konter;
  else if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  outline(rows,S.x-3,S.y-rows.length,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,S.y-rows.length); else sprite(rows,S.x-3,S.y-rows.length);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),BODEN,7,1); ctx.globalAlpha=1;
  /* Wer sich vertreten hat, sieht wie lange er noch braucht */
  if(S.vertreten>0){
    const bw=14, f=Math.min(1,S.vertreten/TUNE.vertretenLang);
    ctx.fillStyle='#000a'; ctx.fillRect(S.x-bw/2-1,S.y-rows.length-6,bw+2,4);
    ctx.fillStyle=P.dim; ctx.fillRect(S.x-bw/2,S.y-rows.length-5,Math.round(bw*f),2);
  }

  ctx.restore();

  /* Vignette, staerker mit steigendem Pegel */
  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- Der Kracher ----
   Jedes Muster hat seine eigene Farbe und sein eigenes Zeichen. Der Balken
   laeuft ab, und beim Schwinger ist das Konterfenster als hellerer Teil
   eingezeichnet - der Kampf verlangt Timing, also muss man es sehen. */
const KAMPF_TELL={
  wind:   { farbe:P.rot,   zeichen:'!',  dauer:g=>kampfWerte(g).windup },
  finte:  { farbe:P.gold,  zeichen:'?',  dauer:()=>TUNE.finteDauer },
  anlauf: { farbe:P.neon2, zeichen:'>>', dauer:()=>TUNE.anlaufDauer },
};
function zeichneKracher(){
  const g=S.gegner;
  let rows=SPR.kracher;
  if(g.zustand==='schlag') rows=SPR.kracherAus;
  else if(g.zustand==='anlauf') rows=SPR.kracherAnlauf;
  else if(g.zustand==='sturm') rows=SPR.kracherSturm;
  else if(g.zustand==='benommen') rows=SPR.kracherBenommen;

  const oben=BODEN-rows.length;
  const blinkt = (g.zustand==='wind'&&Math.floor(S.t*16)%2===0)
              || (g.zustand==='benommen'&&Math.floor(S.t*5)%2===0);
  outline(rows,g.x,oben,1,.6);
  if(g.blick<0) spriteFlip(rows,g.x,oben,1,blinkt?'#ffffff':null);
  else sprite(rows,g.x,oben,1,blinkt?'#ffffff':null);

  /* Warnbalken ueber dem Kopf */
  const tell=KAMPF_TELL[g.zustand];
  if(tell){
    const bw=18, f=Math.max(0,1-g.t/tell.dauer(g));
    ctx.fillStyle='#000a'; ctx.fillRect(g.x-3,oben-6,bw+2,4);
    /* Konterfenster einzeichnen: der Teil, in dem E zaehlt */
    if(g.zustand==='wind'){
      const fenster=kampfWerte(g).fenster;
      ctx.fillStyle='#ffffff33';
      ctx.fillRect(g.x-2,oben-5,Math.round(bw*fenster),2);
    }
    ctx.fillStyle=tell.farbe; ctx.fillRect(g.x-2,oben-5,Math.round(bw*f),2);
    if(Math.floor(S.t*10)%2===0)
      text(tell.zeichen,g.x+3-textW(tell.zeichen)/2,oben-13,tell.farbe);
  }
  if(g.zustand==='benommen'&&Math.floor(S.t*6)%2===0)
    text('E',g.x+3-textW('E')/2,oben-8,P.gruen);

  /* Lebensbalken, in Treffer unterteilt - man soll sehen, wie weit es ist */
  const n=TUNE.gegnerTreffer, seg=10, bw=n*seg, bx=Math.round(S.kamX)+Math.round((W-bw)/2);
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,24,bw+4,8);
  for(let i=0;i<n;i++){
    ctx.fillStyle = i<g.hp ? P.rot : '#2a2440';
    ctx.fillRect(bx+i*seg+1,26,seg-2,4);
  }
  const titel='DER KRACHER';
  text(titel,bx+(bw-textW(titel))/2,34,P.dim);
}

/* ---- HUD ---- */
function hud(){
  /* Herzen */
  for(let i=0;i<TUNE.leben;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-12;
  text(uhr,W-textW(uhr)-6,6,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  /* Mut-Marke */
  ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*TUNE.mutAb/100),by-1,1,6);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Aufgabenliste */
  let y=22;
  for(const a of AUFGABEN){
    const ok=!!S.erledigt[a.id];
    text(ok?'X':'-',6,y,ok?P.gruen:P.dunkel);
    text(a.text,14,y,ok?P.dunkel:P.weiss);
    y+=8;
  }
  if(S.modus==='spiel'&&alleFertig()&&Math.floor(S.t*2)%2===0)
    textC('ALLE BEREIT - RAUS AUS DER WOHNUNG',H-42,P.gold);

  /* Inventar */
  let ix=W-30;
  if(S.inventar.jacke){ sprite(SPR.jacke,ix,16); ix-=12; }
  if(S.inventar.ausweis){ sprite(SPR.ausweis,ix,16); ix-=12; }
  if(S.inventar.dose){ sprite(SPR.dose,ix,16); ix-=10; }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Gespraech */
  if(S.reden){
    const p2=S.reden;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(p2.name,8,H-38,P.neon2);
    const zeile=p2._zeilen[S.redeZeile]||'';
    textC(zeile,H-24,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E',W-12,H-12,P.dunkel);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('BEI MORITZ',22,P.neon,3);
  textC('LEVEL 2 - VORGLUEHEN',44,P.dim);
  const zeilen=['DIE BAHN FAEHRT UM ZEHN','VIER LEUTE. KEINER WILL LOS.','MACH SIE FERTIG.'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=[['A D','LAUFEN'],['LEER','SPRINGEN'],['E','REDEN, SUCHEN, TRINKEN']];
  st.forEach((z,i)=>{ text(z[0],70,108+i*9,P.gold); text(z[1],104,108+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  const levelOben=levelZeilen(LEVEL_NR);
  if(Math.floor(S.t*1.6)%2===0) textGlowC('LEERTASTE ODER E',levelOben-9,P.weiss,1);
}
/* Levelauswahl unten auf dem Titelbild - aus fortschritt.js gebaut. */
function levelZeilen(eigenes){
  /* Von unten nach oben, damit das eigene Level immer sichtbar bleibt.
     Zurueck kommt die oberste Zeile - darueber darf nichts mehr stehen. */
  const alle=Fortschritt.auswahl(eigenes);
  const liste=alle.slice(-Math.min(alle.length,3));
  const oben=H-7-(liste.length-1)*6;
  liste.forEach((l,i)=>{
    const y=oben+i*6;
    /* Das eigene Level ist nie gesperrt - man steht ja schon drin. */
    const zu=!Fortschritt.spielbar(l.nr)&&l.nr!==eigenes;
    const taste=zu?'GESPERRT ':(l.nr===eigenes?'LEERTASTE':('TASTE '+l.nr+'  '));
    const txt=taste+' LEVEL '+l.nr+' - '+l.name;
    const farbe=zu?'#2f2a45':(l.nr===eigenes?P.dunkel:P.neon2);
    text(txt,(W-textW(txt))/2,y,farbe);
  });
  return oben;
}
function zeichneIntro(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,0,W,H);
  const m=Math.round(W/2);
  ctx.fillStyle='#241a2c'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#1d1727'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  /* Partylicht */
  const puls=(Math.sin(S.t*5)*.5+.5);
  ctx.globalAlpha=.14+puls*.12;
  ctx.drawImage(verlauf('introlicht',220,110,g=>{
    const gr=g.createRadialGradient(110,14,4,110,14,96);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,220,110); }),m-110,30);
  ctx.globalAlpha=1;
  sprite(SPR.sofa,m-60,124);
  sprite(SPR.schlaefer,m-52,122);
  sprite(SPR.steh,m+20,130-13);
  sprite(SPR.moritz,m+46,130-15);
  ctx.drawImage(verlauf('introvig',W,H,g=>{
    const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 2 GESCHAFFT',34,P.gold,2);
      textC('IHR SEID DRAUSSEN. GERADE NOCH.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegel),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      const n=Fortschritt.naechstes(LEVEL_NR);
      if(n){
        if(Math.floor(S.t*2)%2===0)
          textC('E  WEITER ZU LEVEL '+n.nr+' - '+n.name,130,P.gruen);
      } else {
        const kommt=Fortschritt.levelNr(LEVEL_NR+1);
        textC(kommt?('LEVEL '+kommt.nr+' - '+kommt.name+'  WIRD NOCH GEBAUT'):'',124,P.dunkel);
        if(Math.floor(S.t*2)%2===0) textC('LEERTASTE  NOCHMAL',136,P.dunkel);
      }
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC('LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */
let letzte=performance.now();
function bild(jetzt){
  const dt=Math.min(.05,(jetzt-letzte)/1000); letzte=jetzt;
  update(dt); draw(dt);
  requestAnimationFrame(bild);
}
requestAnimationFrame(bild);
</script>
