/* Musik: Song "moritz" (nacht/songs.js). Die Spannung steigt mit den erledigten
   Aufgaben, der Tuerkampf spielt den Abschnitt "kampf", danach geht es zurueck
   in die Folge. Pause, Handy und Kapitelkarte daempfen die Musik. */
let musikDaempf=null;   // zuletzt gesetzter Daempfzustand (nur bei Aenderung an MUSIK geben)
function musik(){
  if(typeof MUSIK==='undefined') return;
  MUSIK.spiele('moritz');
  MUSIK.spannung(erledigtAnteil());
  MUSIK.abschnitt(S.modus==='kampf'?'kampf':null);
  const an=S.modus==='pause'||!!(window.HANDY&&window.HANDY.offen)||
    (typeof kapitelAktiv==='function'&&!!kapitelAktiv());

const INTRO_SKIP=0.5;   // so lange halten, dann ist das Intro vorbei
function intro(dt){ S.szeneT+=dt;
  /* Halten ueberspringt das ganze Intro, Tippen eine Szene. */
  if(aktionGehalten){ S.skipT=(S.skipT||0)+dt; if(S.skipT>INTRO_SKIP){ starteLevel(); return; } }
  else S.skipT=Math.max(0,(S.skipT||0)-dt*2);

    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

function pruefeBlackout(){
  if(S.pegel<TUNE.blackoutBei||S.modus==='ende') return false;
  S.modus='ende'; S.gewonnen=false;
  S.faenger='BLACKOUT. AUF MORITZ SOFA.'; SFX.aua();

}
const alleFertig=()=>aktiveAufgaben().every(a=>S.erledigt[a.id]);

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  if(erzaehlTakt(dt)) return;
  PLAUSCH.sperre=!!S.reden;
  if(S.mitnehmenOffen&&S.modus==='spiel') mitnehmenStarten();
  S.t+=dt; musik();
  for(const k in S.striche) S.striche[k]+=dt;
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(S.minute>=TUNE.endMinute){ S.modus='ende'; S.gewonnen=false;
    S.faenger='DER BUS IST WEG'; SFX.aua(); return; }

  /* Pegel baut sich sehr langsam ab */
  if(pruefeBlackout()) return;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);
  if(S.modus==='spiel'){ const az=aktionsZiel(); if(az&&az.ding&&az.ding.art==='getraenk') hilfeTipp('schenken','E HALTEN, IM GRUENEN LOSLASSEN','SCHENKEN HALTEN, IM GRUENEN LOSLASSEN'); }
  if(S.pegel>70) hilfeTipp('pegel-langsam','ZU VIEL: DU WIRST LANGSAM','ZU VIEL: DU WIRST LANGSAM');
  if(S.modus==='spiel'&&alleFertig()) HILFE.ziel('ALLE BEREIT: TUER GANZ LINKS');

  if(S.modus==='kampf'){ kampf(dt); kamera(dt); return; }

  /* --- Gespraech laeuft --- */
  if(S.reden){
    S.redeT+=dt;
    while(aktionPuffer.length){ aktionPuffer.shift(); naechsteZeile(); }
    kamera(dt); return;
  }

  /* --- Einschenken: solange E gehalten wird, steht man am Glas --- */
  if(S.schenk){ schenkTakt(dt); kamera(dt); return; }

  /* --- Bewegung --- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*tempoBonus()*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  /* Tiefe. Ausgeschrieben statt bewegeTiefe(S,...), weil S.t hier die
     Spielzeit ist - der Engine-Aufruf wuerde sie ueberschreiben. */
  {
    const rt=tiefeAn()?((runterAn?1:0)-(hochAn?1:0)):0;
    const zielVt=rt*TUNE.tiefeTempo;
    S.vt += (zielVt-S.vt)*Math.min(1,14*dt);
    S.tiefe = Math.max(0,Math.min(1,S.tiefe+S.vt*dt));
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));

  /* Auch Tiefe bewegt die Beine - siehe tempo2D in welt.js. */
  if(S.amBoden&&tempo2D(S.vx,S.vt)>12){
    S.gehPhase+=tempo2D(S.vx,S.vt)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN;
    if(!S.amBoden){ SFX.landen(); if(SAFT_OK()) SAFT.landung(schirmX(S.x),BODEN-2,0.4); }
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  /* --- Suchen laeuft --- */
  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0) suchErgebnis();
    kamera(dt); return;
  }

  /* Moritz' zweite Zeile zu den Kartons, 15 s nach dem Fund. */
  if(S.kartonT>0){ S.kartonT-=dt; if(S.kartonT<=0) PLAUSCH.ausloeser('kartonNach'); }
  /* Anlauf 1: kurz vor der Tuer, wenn alle bereit sind. */
  if(!S.anlauf&&alleFertig()&&S.x<100){ S.anlauf=true; PLAUSCH.jetzt=null; PLAUSCH.warte=[]; PLAUSCH.ausloeser('tuer'); }
  if(S.kampfWartet&&!anlaufOffen()){ S.kampfWartet=false; starteKampf(); return; }

  /* --- Aktion --- */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    const z=aktionsZiel();
    if(z.person) rede(z.person);
    else if(z.ding) benutze(z.ding);
    else if(S.x<60&&alleFertig()){ if(anlaufOffen()) S.kampfWartet=true; else { starteKampf(); return; } }
    else if(S.x<60) { meldung('NICHT OHNE DIE JUNGS'); SFX.nichts(); }
  }
  kamera(dt);
}

/* Das Naehere gewinnt. Haetten Personen immer Vorrang, waeren Moebel
   direkt neben jemandem gar nicht erreichbar - genau so war das Bett
   neben Moritz unbenutzbar und der Ausweis unauffindbar. Gemeinsam fuer
   die Aktion und fuer die Knopfaufschrift am Handy (mobilKontext). */
function aktionsZiel(){
  let person=null, dPerson=1e9;
  for(const l of LEUTE){
    /* Wer in einer anderen Tiefe steht, ist nicht in Reichweite -
       man muss zu den Leuten hin, nicht nur an ihnen vorbei. */
    if(!tiefeNah(l.t||0.5,S.tiefe)) continue;
    const d=Math.abs(l.x-S.x);
    if(d<TUNE.reichweite&&d<dPerson){ person=l; dPerson=d; } }
  let ding=null, dDing=1e9;
  for(const d0 of DINGE){ const d=Math.abs(d0.x+6-S.x);
    if(d<TUNE.reichweite&&d<dDing){ ding=d0; dDing=d; } }
  if(person&&(!ding||dPerson<=dDing)) return {person};
  if(ding) return {ding};
  return {};
}
/* Laeuft die Zeile 'DU, ICH MUSS DIR WAS...' / '*ES KLINGELT*' noch? */
function anlaufOffen(){
  if(!S.anlauf) return false;
  const j=PLAUSCH.jetzt;
  if(j&&(j.text==='*ES KLINGELT*'||j.text==='DU, ICH MUSS DIR WAS...')) return true;
  return PLAUSCH.warte.some(z=>z.ausloeser==='tuer');
}

/* Knopfaufschriften am Handy. Reihenfolge wie in der Aktionsaufloesung. */
function mobilKontext(){
  const k=(typeof erzaehlKontext==='function')?erzaehlKontext():null; if(k) return k;
  if(S.modus==='titel')    return {aktion:'START',  zwei:null};
  if(S.modus==='intro')    return {aktion:'WEITER', zwei:null};
  if(S.modus==='cutscene') return {aktion:'WEITER', zwei:null};
  if(S.modus==='ende')     return S.gewonnen?{aktion:'WEITER',zwei:null}:(S.kampfVerloren?{aktion:'AN DER TUER',zwei:'VON VORN'}:{aktion:'NOCHMAL',zwei:null});
  if(S.modus==='pause')    return {aktion:'WEITER', zwei:null};
  if(S.modus==='kampf')    return {aktion:'KONTER', zwei:null};
  if(S.reden)              return {aktion:'WEITER', zwei:null};
  if(S.suchT>0)            return {aktion:null,     zwei:null};
  if(S.schenk)             return {aktion:'HALTEN', zwei:null};
  const z=aktionsZiel();
  if(z.person) return {aktion:'REDEN', zwei:null};
  if(z.ding){
    const a=z.ding.art; let was='SUCHEN';
    if(a==='getraenk') was='SCHENKEN';
    else if(a==='anlage') was=S.erledigt.musik?'LEER':'LAUTER';
    else if(a==='kuehl') was=S.inventar.dose?'LEER':'NEHMEN';
    else if(a==='spiegel') was='SPIEGEL';
    else if(a==='kartons') was=S.kartons?'LEER':'KARTONS';
    else if(a==='pinnwand') was=MOMENT.hat(2)?'LEER':'FOTO';
    else if(S.durchsucht[a]) was='LEER';
    return {aktion:was, zwei:null};
  }
  if(S.x<60) return {aktion:alleFertig()?'RAUS':'ZU', zwei:null};
  return {aktion:null, zwei:null};
}

/* ---- Dinge benutzen ---- */
function benutze(d){
  if(d.art==='getraenk'){
    if(S.schenk) return;
    startSchenk(d);
    return;
  }
  if(d.art==='anlage'){
    if(S.erledigt.musik){ meldung('LAEUFT SCHON',1); SFX.nichts(); return; }
    erledige('musik'); SFX.fund(); S.blitz=.3;
    meldung('JETZT LAUTER. DER NACHBAR KLOPFT.',2);
    if(SAFT_OK()) SAFT.fund(schirmX(d.x+6),BODEN-24,'LAUTER');
    return;
  }
  if(d.art==='kuehl'){
    if(S.inventar.dose){ meldung('HAST SCHON EINE',1); SFX.nichts(); return; }
    S.inventar.dose=true; SFX.fund(); S.blitz=.4;
    meldung('ENERGYDRINK EINGESTECKT',1.8);
    zeigeHinweis('DAMIT KRIEGST DU FINN WACH',3);
    return;
  }
  if(d.art==='spiegel'){
    meldung((S.pegel>=TUNE.mutAb||S.mut>=TUNE.davidMut)?'DU SIEHST GUT AUS':'GEHT SO',1.4); SFX.reden(); return;
  }
  if(d.art==='kartons'){
    if(S.kartons){ meldung('NUR ZEUG.',1); SFX.nichts(); return; }
    S.vx=0; SFX.reden();
    starteGespraech(KARTONS,'start',()=>{
      S.kartons=true;
      if(flag('moritzKartonGesehen')) S.kartonT=15;
    });
    return;
  }
  if(d.art==='pinnwand'){
    if(MOMENT.fund(2)){ SFX.fund(); S.vx=0; }
    else { meldung('NUR NOCH EIN LOCH IM KORK.',1.4); SFX.nichts(); }
    return;
  }
  if(S.durchsucht[d.art]){ S.fehl++; if(S.fehl>=2) hilfeTipp('fehlgriff','JEDER FEHLGRIFF KOSTET RANG','JEDER FEHLGRIFF KOSTET RANG'); meldung('SCHON DURCHSUCHT',1); SFX.nichts(); return; }
  S.suchT=TUNE.suchDauer; S.suchZiel=d; rauschen(.12,.03);
}
function suchErgebnis(){
  const d=S.suchZiel; S.suchZiel=null;
  S.durchsucht[d.art]=true;
  if(d.art===S.jackeBei&&!S.inventar.jacke){
    S.inventar.jacke=true; SFX.fund(); S.blitz=.6;
    if(SAFT_OK()) SAFT.fund(schirmX(d.x+6),BODEN-14,'JACKE');
    meldung('DEINE JACKE',2); erledige('jacke'); SFX.erledigt(); return;
  }
  if(d.art===S.ausweisBei&&!S.inventar.ausweis){
    S.inventar.ausweis=true; SFX.fund(); S.blitz=.6;
    if(SAFT_OK()) SAFT.fund(schirmX(d.x+6),BODEN-14,'AUSWEIS');
    meldung('MORITZ AUSWEIS',2);
    zeigeHinweis('BRING IHN MORITZ',3); return;
  }
  S.fehl++;
  if(S.fehl>=2) hilfeTipp('fehlgriff','JEDER FEHLGRIFF KOSTET RANG','JEDER FEHLGRIFF KOSTET RANG');
  SFX.nichts(); meldung(pick(['NICHTS','NUR KRAM','LEER']),1);
}

/* ---- Einschenken (Mikrospiel an den Getraenken) ----
   E halten fuellt das Glas, der Balken steigt mit TUNE.schenkTempo je Sekunde.
   Loslassen unter der Zone: getrunken, Pegel je nach Fuellstand. In der Zone
   (TUNE.schenkZone) PERFEKT: halber Pegel-Zuwachs, dazu Mut. Drueber, oder
   wenn das Glas ganz voll ist: VERSCHUETTET, kein Pegel. */
function startSchenk(d){
  S.vx=0;
  S.schenk={f:0, ding:d};
  hilfeTipp('schenken','E HALTEN, IM GRUENEN LOSLASSEN','SCHENKEN HALTEN, IM GRUENEN LOSLASSEN');
}
function schenkTakt(dt){
  const s=S.schenk;
  if(aktionGehalten&&s.f<1){ s.f=Math.min(1,s.f+TUNE.schenkTempo*dt); return; }
  S.schenk=null;
  schenkEnde(s.f,s.ding);
}
function schenkEnde(f,d){
  const [lo,hi]=TUNE.schenkZone;
  const x=schirmX(d.x+6), y=BODEN-18;
  if(f>hi){
    meldung('VERSCHUETTET',1.4); SFX.nichts();
    if(SAFT_OK()) SAFT.teilchen('glas',x,y,6);
    return;
  }
  if(f>=lo){
    S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.proSchluck*TUNE.schenkPerfektAnteil);
    S.mut+=TUNE.schenkMut;
    SFX.fund(); meldung('PERFEKT. MUT +'+TUNE.schenkMut,1.6);
    if(typeof ERFOLG!=='undefined') ERFOLG.gib('l2_perfekt');
    if(SAFT_OK()){ SAFT.popup('PERFEKT',x,y,P.gold); SAFT.teilchen('stern',x,y,8); }
  } else if(f<0.05){
    meldung('DAS GLAS BLEIBT LEER',1); SFX.nichts(); return;
  } else {
    /* Halb voll: die Menge entspricht dem Fuellstand. */
    S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.proSchluck*f);
    SFX.schluck(); meldung(pick(['AUF EX','RUNTER DAMIT','NOCH EINEN']),1.2);
    if(SAFT_OK()) SAFT.teilchen('glas',x,y,3);
  }
  /* Sofort pruefen, siehe benutze() frueher: der Blackout darf nicht am Bildende verloren gehen. */
  pruefeBlackout();
}

/* ---- Reden ---- */
function rede(p){
  S.reden=p; S.redeZeile=0; S.redeT=0; S.vx=0; SFX.reden();
  /* Bedingungen pruefen */
  p._zeilen = p.zeilen;
  if(p.id==='moritz'&&S.inventar.ausweis&&!S.erledigt.ausweis){
    p._zeilen=['DU HAST IHN','ALTER DANKE',...p.danach];
    S.inventar.ausweis=false; SFX.erledigt();
    erledige('ausweis');
  } else if(p.id==='schlaefer'&&S.inventar.dose&&!S.erledigt.schlaefer){
    p._zeilen=['*DU HAELTST IHM DIE DOSE HIN*',...p.danach];
    S.inventar.dose=false; SFX.erledigt();
    erledige('schlaefer');
    if(SAFT_OK()) SAFT.erfolg(schirmX(p.x)+3,BODEN-30,'WACH');
    PLAUSCH.ausloeser('finnWach');
  } else if(p.id==='schlaefer'&&S.erledigt.schlaefer&&!S.erledigt.zudecken){
    p._zeilen=['*DU ZIEHST IHM DIE DECKE HOCH*','ZZZ... DANKE','...'];
    SFX.erledigt();
    erledige('zudecken');
  } else if(p.id==='telefon'&&!S.erledigt.telefon){
    if(S.pegel>=TUNE.mutAb||S.mut>=TUNE.davidMut){
      p._zeilen=['*DU NIMMST IHM EINFACH DAS HANDY AB*',...p.danach];
      SFX.erledigt();
      erledige('telefon');
      PLAUSCH.ausloeser('davidAb');
    } else {
      p._zeilen=[...p.zeilen,'(DU TRAUST DICH NICHT, IHN ZU UNTERBRECHEN)'];
      hilfeTipp('david-mut','ERST MUT ANTRINKEN - BIS ZUR GRUENEN MARKE','ERST MUT ANTRINKEN - BIS ZUR GRUENEN MARKE');
    }
  } else if(p.id==='moritz'&&S.erledigt.ausweis){
    p._zeilen=['ALLES KLAR BEI DIR','WIR KOENNEN'];
  }
  if(p.id==='schlaefer'&&!S.inventar.dose&&!S.erledigt.schlaefer) hilfeTipp('finn-dose','FINN BRAUCHT WAS AUS DEM KUEHLSCHRANK','FINN BRAUCHT WAS AUS DEM KUEHLSCHRANK');
}
function naechsteZeile(){
  const p=S.reden;
  S.redeZeile++;
  if(S.redeZeile>=p._zeilen.length){ S.reden=null; return; }
  SFX.reden();
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   DER KRACHER - erster Kampf im Spiel
   ========================================================================== */
/* Mehr Leben je nach Schwierigkeit. Funktion statt const: neuesSpiel() laeuft schon beim Laden. */
function lebenMax(){ return TUNE.leben+schwer().leben; }
/* Ausholzeit: Schwierigkeit (Gegner-Uhr) und das langsamere Lern-Ausholen. */
function windupJetzt(){ const g=S.gegner; let w=TUNE.gegnerWindup/schwer().gegner; if(g&&g.lern) w*=TUNE.lernWindupFaktor; return w; }
function starteKampf(){
  PLAUSCH.jetzt=null; PLAUSCH.warte=[];   // sonst bleibt eine Zeile im Kampf stehen
  S.modus='kampf';
  S.gegner={ x:S.x-70, hp:TUNE.gegnerTreffer, zustand:'komm', t:0, getroffen:0 };
  S.x=Math.max(80,S.x); S.vx=0;
  if(!hilfeTipp('konter-gold','WARTE BIS DER BALKEN GOLD IST - DANN E','WARTE BIS DER BALKEN GOLD IST - DANN KONTER',4)) zeigeHinweis(tasteText('E IM GOLD: KONTER','KONTER IM GOLD'),2.5);
  HILFE.ziel('KONTER IHN '+TUNE.gegnerTreffer+'-MAL');
  SFX.warn(); meldung('WER IST DAS DENN',2);
}
/* Checkpoint an der Tuer: nach einer Niederlage im Kampf geht es hier weiter. */
function nochmalTuer(){ S.kampfVerloren=false; S.hp=lebenMax(); S.faenger=''; S.gewonnen=false; aktionPuffer.length=0; starteKampf(); }
function kampf(dt){
  const g=S.gegner; g.t+=dt;
  const dist=S.x-g.x;
  if(g.zustand==='komm'){
    g.x+=Math.sign(dist)*70*dt;
    /* Puffer leeren wie in allen anderen Zustaenden. Fehlte das, blieb ein
       Druck aus dem Heranlaufen liegen und kontert im naechsten Bild von
       selbst - damit war Dauerdruecken die beste Taktik. */
    while(aktionPuffer.length) aktionPuffer.shift();
    if(Math.abs(dist)<22){ g.zustand='wind'; g.t=0; g.verpasst=false; g.lern=!S.lernGehabt&&HILFE.lernt('konter'); S.lernGehabt=true; SFX.warn(); }
  } else if(g.zustand==='wind'){
    const imFenster = g.t >= windupJetzt()*(1-TUNE.konterFenster);
    while(aktionPuffer.length){ aktionPuffer.shift();
      /* Ein Versuch pro Ausholen. Ohne diese Sperre haette Dauerdruecken
         irgendwann von selbst ins Fenster getroffen. */
      if(g.verpasst) break;
      if(!imFenster){
        hilfeTipp('konter-frueh','ZU FRUEH: WARTE, BIS DER BALKEN GOLD IST','ZU FRUEH: WARTE, BIS DER BALKEN GOLD IST');
        if(schwierigkeit()==='locker'){ meldung('NOCH WARTEN - BIS GOLD',1.1); break; }   // LOCKER: nachdruecken erlaubt
        g.verpasst=true; meldung('ZU FRUEH',1.1); break; }
      g.hp--; g.zustand='getroffen'; g.t=0; g.getroffen++;
      HILFE.zaehle('konter'); HILFE.zaehle('konter-jetzt');
      if(SAFT_OK()){ SAFT.treffer(schirmX(g.x+8),BODEN-22,-1,0.7); SAFT.trauma(5/12); }
      S.blitz=.5; SFX.klatsch();
      meldung(pick(['SITZT','KONTER','GENAU DA']),1.2);
      break; }
    if(g.zustand==='wind'&&g.t>=windupJetzt()){ g.zustand='schlag'; g.t=0;
      /* Treffer, wenn du nicht gekontert hast */
      S.hp--; S.blitz=.5; SFX.aua();
      if(SAFT_OK()){ SAFT.schaden(0.6); SAFT.trauma(6/12); }
      meldung('AUTSCH',1.4);
      if(S.hp<=0){ S.modus='ende'; S.gewonnen=false; S.faenger='ER HAT DICH RAUSGEWORFEN'; S.kampfVerloren=true;
        if(SAFT_OK()) SAFT.schaden(1); }
    }
  } else if(g.zustand==='schlag'){
    if(g.t>=TUNE.gegnerSchlag){ g.zustand='pause'; g.t=0; }
    while(aktionPuffer.length) aktionPuffer.shift();
  } else if(g.zustand==='getroffen'){
    g.x-=Math.sign(dist)*90*dt;
    if(g.t>=0.5){
      if(g.hp<=0){ starteCutscene(); return; }
      g.zustand='pause'; g.t=0;
    }
    while(aktionPuffer.length) aktionPuffer.shift();
  } else if(g.zustand==='pause'){
    if(g.t>=TUNE.gegnerPause){ g.zustand='komm'; g.t=0; }
    while(aktionPuffer.length) aktionPuffer.shift();
  }
}

/* Wer in der Gruppe landet, haengt an der Wahl von MITNEHMEN (ganz am
   Levelanfang, siehe starteLevel). MORITZ kommt immer mit - er ist der
   Grund, warum man ueberhaupt hier war. */
function fuehreCrewZusammen(){

    speichereCrew('FINN');

function starteCutscene(){
  /* Die Wahl ist schon am Levelanfang gefallen (MITNEHMEN in starteLevel) -
     hier nur noch zusammenfuehren und die Szene starten. */

  fuehreCrewZusammen();
  S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0;
}
function levelGeschafft(){
  /* Die Crew steht schon aus der Entscheidung, siehe fuehreCrewZusammen. */
  speichereCrew('MORITZ');
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Der Pegel bleibt erhalten - Level 3 liest ihn als Startwert.
     Siehe speicherePegel in nacht/stand.js. */
  speicherePegel(S.pegel);
  if(typeof MUSIK!=='undefined') MUSIK.stinger('sieg');
  if(SAFT_OK()) SAFT.fund(W/2,40,'GESCHAFFT');
  /* Rang: vier Kriterien, je linear zwischen schlecht und gut (TUNE.rang). */
  const r=rangDaten();
  if(typeof WERTUNG!=='undefined'){
    try{ WERTUNG.abschluss(2,r.punkte,r.zeilen); }catch(e){}
  }
}
/* Der Rang: je Kriterium ein Anteil von 0..1, der auf die Punkte gerechnet wird.
   Die Zeilen sind gerundet, damit die Summe in der Tafel stimmt. */
function rangDaten(){
  const R=TUNE.rang;
  const teil=(wert,gut,schlecht,max)=>{
    const f=(wert-schlecht)/((gut-schlecht)||1);
    return Math.round(max*Math.max(0,Math.min(1,f)));
  };
  const minuten=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
  const versteckt=VERSTECKT.filter(v=>S.erledigt[v.id]).length;
  const kassiert=lebenMax()-S.hp;
  const zeilen=[
    {name:'ZEIT',      wert:minuten+':'+String(sek).padStart(2,'0'), pkt:teil(S.zeit,R.zeitGut,R.zeitSchlecht,30)},
    {name:'FEHLGRIFF', wert:String(S.fehl),                          pkt:teil(S.fehl,R.fehlGut,R.fehlSchlecht,30)},
    {name:'VERSTECKT', wert:versteckt+'/'+VERSTECKT.length,          pkt:teil(versteckt,R.versteckGut,R.versteckSchlecht,15)},
    {name:'KASSIERT',  wert:String(kassiert),                        pkt:teil(kassiert,R.kassiertGut,R.kassiertSchlecht,25)},
  ];
  const punkte=zeilen.reduce((s,z)=>s+z.pkt,0);
  return {punkte:Math.max(0,Math.min(100,punkte)), zeilen};
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const p=S.pegel/100;
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const wk=FX.wackel(1);   // 0 = Wackeln aus, sonst Faktor (Flackerschutz halbiert)
  /* Treffer-Wackeln kommt aus SAFT (trauma, kern.js); hier bleibt nur das Schwanken des Pegels. */
  const rx=(Math.sin(S.t*7)*wack)*wk;
  const ry=(Math.cos(S.t*5.2)*wack*.6)*wk;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneWohnung();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${FX.blitz(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  zeichneGespraech();
  bildschirme();
  erzaehlZeichne();
}

/* ==========================================================================
   DIE WOHNUNG ALS BILD (vorgezeichnet)
   malWohnung() zeichnet EINMAL die ganze Wohnung (LEVEL_B x H) in einen Cache
   (verlauf('wohnung')). Alle Zahlen stehen in TUNE.ort und ORTE, alle Farben
   in P. Nichts davon ist zufaellig je Bild; woZufall(seed) ist nur der
   Zufall fuer die Nachtstadt, einmal beim Backen. Bewegt sich nur das
   Licht (Lichterkette, Fernseher, Partylicht) - langsam und ueber FX.
   ========================================================================== */
const woRect=(g,x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,h); };
function woZufall(seed){ let s=seed>>>0;
  return ()=>((s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296); }

/* Tapete bzw. Wandflaeche eines Raums */
function woWand(g,o){
  const O=TUNE.ort, b=o.bis-o.von, hoehe=BODEN-20;
  woRect(g,o.von,20,b,hoehe,o.wand);
  if(o.tapete==='streifen'){
    for(let x=o.von+3;x<o.bis-2;x+=O.streifenAbst) woRect(g,x,24,O.streifenB,hoehe-4,o.wand2);
  } else if(o.tapete==='punkte'){
    for(let r=0,y=28;y<BODEN-8;r++,y+=O.punktAbst)
      for(let x=o.von+4+(r%2)*(O.punktAbst>>1);x<o.bis-3;x+=O.punktAbst) woRect(g,x,y,1,1,o.wand2);
  } else if(o.tapete==='fliesen'){
    /* Fliesen: Raster in Fugenfarbe, helle Fliesen im Wechsel */
    for(let y=O.fliesenOben,r=0;y<BODEN;y+=O.fliesenH,r++){
      woRect(g,o.von,y,b,1,o.wand2);
      for(let x=o.von+(r%2)*(O.fliesenB>>1);x<o.bis;x+=O.fliesenB) woRect(g,x,y,1,O.fliesenH,o.wand2);
    }
  } else if(o.tapete==='holz'){
    for(let y=O.holzOben;y<BODEN;y+=O.holzH) woRect(g,o.von,y,b,1,o.wand2);
  }
  /* Stuckleiste oben, Sockelleiste unten */
  woRect(g,o.von,20,b,3,P.leiste); woRect(g,o.von,23,b,1,'#00000066');
  woRect(g,o.von,BODEN-O.sockelH,b,O.sockelH,P.sockel); woRect(g,o.von,BODEN-O.sockelH,b,1,P.leisteHell);
}
/* Boden: je Raum ein anderes Muster */
function woBoden(g,o){
  const O=TUNE.ort, b=o.bis-o.von;
  woRect(g,o.von,BODEN,b,H-BODEN,o.boden);
  if(o.belag==='parkett'){
    for(let y=BODEN+4,r=0;y<H;y+=6,r++){ woRect(g,o.von,y,b,1,o.boden2);
      for(let x=o.von+(r%2)*11;x<o.bis;x+=22) woRect(g,x,y-5,1,5,o.boden2); }
  } else if(o.belag==='schach'){
    for(let r=0,y=BODEN;y<H;r++,y+=O.schachH)
      for(let x=o.von+((r%2)*O.schachB);x<o.bis;x+=O.schachB*2) woRect(g,x,y,Math.min(O.schachB,o.bis-x),O.schachH,o.boden2);
  } else if(o.belag==='fliese'){
    for(let y=BODEN+5,r=0;y<H;y+=9,r++){ woRect(g,o.von,y,b,1,o.boden2);
      for(let x=o.von+(r%2)*8;x<o.bis;x+=16) woRect(g,x,y-8,1,8,o.boden2); }
  } else if(o.belag==='teppich'){
    for(let y=BODEN+3;y<H;y+=4) for(let x=o.von+((y>>2)%2)*2;x<o.bis;x+=4) woRect(g,x,y,1,1,o.boden2);
  } else if(o.belag==='deck'){
    for(let y=BODEN+6;y<H;y+=7) woRect(g,o.von,y,b,1,o.boden2);
  }
  woRect(g,o.von,BODEN,b,1,P.bodenKante);
  woRect(g,o.von,BODEN+1,b,2,'#00000044');   // Schatten unter der Sockelleiste
  /* Trennwand */
  woRect(g,o.bis-2,20,2,BODEN-20,P.trenn);
}
/* Fenster mit Nachtstadt: f = [x,y,b,h,seed,vorhang(0/1),mond(0/1)] */
function woFenster(g,f){
  const O=TUNE.ort, [x,y,b,h,seed,vorhang,mond]=f, rnd=woZufall(seed);
  woRect(g,x-2,y-2,b+4,h+4,P.fensterRahmen);
  woRect(g,x,y,b,h,P.nachtHimmel);
  woRect(g,x,y+(h>>1),b,h>>1,P.nachtHimmel2);
  woRect(g,x,y+h-(h>>2),b,h>>2,P.nachtDunst);
  for(let i=0;i<O.sterne;i++) woRect(g,x+1+Math.floor(rnd()*(b-2)),y+1+Math.floor(rnd()*(h*.4)),1,1,i%3?'#ffffff55':'#ffffffaa');
  if(mond){ woRect(g,x+b-9,y+4,4,4,P.mond); woRect(g,x+b-8,y+3,2,6,P.mond); woRect(g,x+b-10,y+5,6,2,P.mond); }
  /* Haeuser mit beleuchteten Fenstern */
  for(let bx=0;bx<b;){
    const bw=4+Math.floor(rnd()*5), bh=Math.floor(h*(.22+rnd()*.34)), w2=Math.min(bw,b-bx);
    woRect(g,x+bx,y+h-bh,w2,bh,P.nachtStadt);
    for(let wy=y+h-bh+2;wy<y+h-2;wy+=3) for(let wx=x+bx+1;wx<x+bx+w2-1;wx+=2)
      if(rnd()<O.stadtLicht) woRect(g,wx,wy,1,1,rnd()<.25?P.neon2:P.fensterGelb);
    bx+=bw+1;
  }
  /* Rahmenkreuz */
  woRect(g,x+(b>>1),y,1,h,P.fensterRahmen);
  woRect(g,x,y+(h>>1)-1,b,1,P.fensterRahmen);
  woRect(g,x-3,y+h+2,b+6,2,P.leisteHell); woRect(g,x-3,y+h+4,b+6,1,'#00000066');   // Fensterbank
  if(vorhang){
    woRect(g,x-4,y-3,b+8,2,P.stange);
    woRect(g,x-3,y-1,5,h+4,P.vorhang); woRect(g,x+b-2,y-1,5,h+4,P.vorhang);
    for(let i=0;i<h+4;i+=4){ woRect(g,x-1,y-1+i,1,3,P.vorhangDunkel); woRect(g,x+b,y-1+i,1,3,P.vorhangDunkel); }
  }
}
/* Poster: p = [x,y,b,h,wort,farbe,farbe2] */

/* Lichterkette: Punkte [x,y,farbe] entlang der Baenge. Wird zum Backen UND fuer den Schimmer gebraucht. */
function woKettePunkte(){
  const K=TUNE.ort.kette, pts=[], n=Math.round((K.x1-K.x0)/K.bogenB), bw=(K.x1-K.x0)/n;
  for(let x=K.x0;x<=K.x1;x+=K.abst){
    const u=((x-K.x0)%bw)/bw, y=K.y+Math.round(K.haenge*4*u*(1-u));
    pts.push([x,y,K.farben[pts.length%K.farben.length]]);

  return pts;

function woKette(g){

function woMoritz(g){
  const M=TUNE.ort.moritz;
  M.poster.forEach(p=>woPoster(g,p));
  /* Schal ueber der Tuer zum Flur-Ende: Vereinsfarben */
  for(let x=M.schalX;x<M.schalX+M.schalB;x++){ woRect(g,x,M.schalY+Math.round(2*Math.sin((x-M.schalX)/M.schalB*Math.PI)),1,3,(x>>2)%2?P.weiss:P.blauTrikot); }
  /* Bettkopfteil */
  const b=M.bett;
  woRect(g,b[0],b[1],b[2],BODEN-b[1]-1,P.holzDunkel); woRect(g,b[0]+1,b[1]+1,b[2]-2,3,P.holz);
  woRect(g,b[0]+3,b[1]+14,b[2]-6,BODEN-b[1]-15,P.kissenBlau); woRect(g,b[0]+3,b[1]+14,b[2]-6,1,'#ffffff44');
  /* Schreibtischlampe und Schrank */
  const s=M.schrank;
  woRect(g,s[0],s[1],s[2],BODEN-s[1]-1,P.holzDunkel); woRect(g,s[0]+1,s[1]+1,(s[2]>>1)-1,BODEN-s[1]-3,P.holz); woRect(g,s[0]+(s[2]>>1)+1,s[1]+1,(s[2]>>1)-2,BODEN-s[1]-3,P.holz);
  woRect(g,s[0]+(s[2]>>1)-3,s[1]+30,1,5,P.gold); woRect(g,s[0]+(s[2]>>1)+2,s[1]+30,1,5,P.gold);
  /* Regalwand hinter dem Regal-Sprite */
  const r=M.regal;
  woRect(g,r[0],r[1],r[2],BODEN-r[1]-1,P.holzDunkel);
  for(let i=0;i<5;i++){ const y=r[1]+4+i*14;
    woRect(g,r[0]+1,y+10,r[2]-2,2,P.holz);
    for(let k=0,x=r[0]+2;x<r[0]+r[2]-3;k++){ const bw=2+(k+i)%3; woRect(g,x,y+10-(5+(k*2+i)%4),bw,5+(k*2+i)%4,P[M.buecher[(k+i)%M.buecher.length]]); x+=bw; } }

  woRect(g,M.teppich[0],M.teppich[1],M.teppich[2],M.teppich[3],P.teppichBlau); woRect(g,M.teppich[0]+2,M.teppich[1]+1,M.teppich[2]-4,1,P.kissenBlau);
}
/* ---- Bad ---- */

  woRect(g,d[0]-2,d[1]-2,d[2]+4,2,P.chrom);

  /* Spiegel, Waschbecken und Handtuch */

  woRect(g,s[0]+3,s[1]+2,2,s[3]-8,P.spiegelBlitz); woRect(g,s[0]+7,s[1]+2,1,s[3]-14,P.spiegelBlitz);
  woRect(g,s[0]+2,s[1]+s[3]+3,s[2]-4,2,P.chrom);

  woRect(g,w[0],w[1],w[2],10,P.weiss); woRect(g,w[0]+2,w[1]+10,w[2]-4,4,P.hellgrau); woRect(g,w[0],w[1],w[2],1,P.chrom);
  woRect(g,w[0]+(w[2]>>1)-1,w[1]-4,2,4,P.chrom);

  /* Wc-Ecke: Toilettenpapier */
  woRect(g,B.papierX,B.papierY,4,4,P.weiss);
  /* Fussmatte */
  woRect(g,B.matteX,BODEN+2,B.matteB,3,P.matteBad);

/* ---- Balkon ---- */
function woBalkon(g,o){
  const B=TUNE.ort.balkon, b=o.bis-o.von;
  woRect(g,o.von,20,b,BODEN-20,P.nachtHimmel); woRect(g,o.von,70,b,BODEN-70,P.nachtHimmel2); woRect(g,o.von,100,b,BODEN-100,P.nachtDunst);
  const rnd=woZufall(B.seed);
  for(let i=0;i<B.sterne;i++){ woRect(g,o.von+2+Math.floor(rnd()*(b-4)),22+Math.floor(rnd()*60),1,1,i%4===0?'#ffffffaa':'#ffffff44'); }
  woRect(g,o.von+B.mondX,B.mondY,7,7,P.mond); woRect(g,o.von+B.mondX+1,B.mondY-1,5,9,P.mond); woRect(g,o.von+B.mondX-1,B.mondY+1,9,5,P.mond);
  woRect(g,o.von+B.mondX+4,B.mondY+1,3,5,P.nachtHimmel);   // Sichel
  /* Haeuser dahinter in zwei Reihen */
  for(const [reihe,hmax,col] of B.skyline){
    for(let x=0;x<b;){ const bw=7+Math.floor(rnd()*9), bh=10+Math.floor(rnd()*hmax), w2=Math.min(bw,b-x);
      woRect(g,o.von+x,BODEN-bh-reihe,w2,bh+reihe,P[col]);
      for(let wy=BODEN-bh-reihe+3;wy<BODEN-26;wy+=4) for(let wx=o.von+x+2;wx<o.von+x+w2-2;wx+=3)
        if(rnd()<B.licht) woRect(g,wx,wy,1,2,rnd()<.2?P.neon2:P.fensterGelb);
      x+=bw+1+Math.floor(rnd()*3); }
  }
  /* Gelaender und Pflanzkasten */
  woRect(g,o.von,BODEN-26,b,2,P.gelaender);
  for(let x=o.von;x<o.bis;x+=8) woRect(g,x,BODEN-24,2,24,P.gelaender);
  woRect(g,o.von,BODEN-14,b,1,P.gelaender);
  woRect(g,o.von+B.kastenX,BODEN-12,B.kastenB,6,P.holzDunkel); woRect(g,o.von+B.kastenX,BODEN-12,B.kastenB,1,P.holz);
  for(let x=o.von+B.kastenX;x<o.von+B.kastenX+B.kastenB-2;x+=3) woRect(g,x,BODEN-17-(x%5),2,5+(x%5),P.gruenPflanze);
  woRect(g,o.von,BODEN-27,b,1,'#ffffff18');
  /* Lichterkette am Gelaender, warm */
  for(let x=o.von+4;x<o.bis-3;x+=B.lichtAbst){ woRect(g,x,B.lichtY+((x>>3)%2),2,2,x%3?P.gold:P.neon); }
}

/* Alles in ein Bild */
function malWohnung(g){
  for(const o of ORTE){

/* Lichtschimmer: Lichterkette (Punkt fuer Punkt), Fernseher, Partylicht - gebacken, nur Alpha bewegt sich */
function malKetteGlow(g){
  for(const [x,y,c] of woKettePunkte()){

function zeichneLicht(){
  const O=TUNE.ort, ruhig=FX.ruhig();
  /* Lichterkette: sanftes Atmen, ueber FX.hz gedeckelt */
  const atem=ruhig?.5:Math.sin(S.t*FX.hz(O.kette.hz)*6.283)*.5+.5;
  ctx.globalAlpha=O.kette.glowA+atem*O.kette.glowAtem;
  ctx.drawImage(verlauf('kettenglow',LEVEL_B,60,malKetteGlow),0,0);
  /* Fernseher: kuehles Licht auf Wand und Sofa */
  const tv=O.wohn.tv, a=ruhig?.5:Math.sin(S.t*FX.hz(O.tvHz)*6.283)*.5+.5;
  ctx.globalAlpha=O.tvA+a*O.tvAtem;
  ctx.drawImage(verlauf('tvlicht',130,100,g=>{
    const gr=g.createRadialGradient(65,28,3,65,28,64);
    gr.addColorStop(0,'rgba(120,255,200,1)'); gr.addColorStop(1,'rgba(60,200,255,0)');
    g.fillStyle=gr; g.fillRect(0,0,130,100); }),tv[0]+(tv[2]>>1)-65,tv[1]+(tv[3]>>1)-28);
  /* Partylicht im Wohnzimmer (wie zuvor, aber leiser und gedeckelt) */
  const puls=ruhig?.5:(Math.sin(S.t*FX.hz(O.partyHz)*6.283)*.5+.5);
  ctx.globalAlpha=O.partyA+puls*O.partyAtem;
  ctx.drawImage(verlauf('partylicht',200,120,g=>{
    const gr=g.createRadialGradient(100,20,4,100,20,100);

    g.fillStyle=gr; g.fillRect(0,0,200,120); }),160,26);
  ctx.globalAlpha=1;
}

function zeichneWohnung(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  /* Die ganze Wohnung ist ein vorgezeichnetes Bild (malWohnung); nur Namen, Tuer und Licht kommen je Bild. */
  ctx.drawImage(verlauf('wohnung',LEVEL_B,H,malWohnung),0,0);
  for(const o of ORTE) text(o.name,o.nameX||o.von+6,TUNE.raumNameY,'#ffffff22');
  /* Wohnungstuer im Flur */
  sprite(SPR.tuer,34,BODEN-12);
  text('RAUS',34+4-textW('RAUS')/2,BODEN-20,alleFertig()?P.gold:P.dim);
  zeichneLicht();

  /* Dinge */
  const taste=aktionsMarke();
  for(const d of DINGE){
    let y;
    if(d.eigen){ zeichneFund(d); y=d.markY+9; }
    else {
      const rows=SPR[d.moebel]; if(!rows) continue;
      y=d.hoch?BODEN-40:BODEN-rows.length;
      outline(rows,d.x,y,1,.5); sprite(rows,d.x,y);
    }
    const nah=Math.abs(d.x+6-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
    if(nah&&Math.floor(S.t*4)%2===0){
      const fertig=d.art==='kartons'?S.kartons:d.art==='pinnwand'?MOMENT.hat(2)
                  :d.art==='anlage'?!!S.erledigt.musik:d.art==='kuehl'?(!!S.inventar.dose||!!S.erledigt.schlaefer):S.durchsucht[d.art];
      const t=fertig?'OK':taste;
      text(t,d.x+6-textW(t)/2,y-9,fertig?P.dunkel:P.gold);
    }
  }

  /* Leute und Spieler nach Tiefe sortiert - wer weiter hinten steht,
     wird zuerst gezeichnet und damit verdeckt. */
  const inTiefe=[];
  for(const l of LEUTE){
    inTiefe.push({t:l.t||0.5, mal:()=>{
      const rows=SPR[l.spr]||SPR.steh;
      const fuss=bodenY(l.t||0.5);
      const y=l.liegt?fuss-8:fuss-rows.length;
      ctx.globalAlpha=.24; ctx.fillStyle='#000';
      ctx.fillRect(Math.round(l.x-3),Math.round(fuss),7,1); ctx.globalAlpha=1;
      outline(rows,l.x-3,y,1,.55);
      sprite(rows,l.x-3,y);
      const erledigt = l.id==='max' || S.erledigt[l.id==='moritz'?'ausweis':l.id];
      text(l.name,l.x+3-textW(l.name)/2,y-16,erledigt?P.gruen:P.dim);
      if(erledigt) text('OK',l.x+3-textW('OK')/2,y-9,P.gruen);
      else {
        const nah=Math.abs(l.x-S.x)<TUNE.reichweite
                 &&tiefeNah(l.t||0.5,S.tiefe)
                 &&S.modus==='spiel'&&!S.reden;
        if(nah&&Math.floor(S.t*4)%2===0) text(taste,l.x+2,y-9,P.gold);
      }
    }});
  }

  /* Der Kracher */
  if(S.gegner){
    const g=S.gegner;
    const rows = g.zustand==='schlag'?SPR.kracherAus:SPR.kracher;
    const blinkt = g.zustand==='wind'&&Math.floor(S.t*FX.hz(8)*2)%2===0;
    outline(rows,g.x,BODEN-rows.length,1,.6);
    sprite(rows,g.x,BODEN-rows.length,1,blinkt?'#ffffff':null);
    if(g.zustand==='wind'){
      if(Math.floor(S.t*FX.hz(3)*2)%2===0) text('!',g.x+3,BODEN-rows.length-9,P.rot);
      const f=1-g.t/windupJetzt(), bw=18;
      ctx.fillStyle='#000a'; ctx.fillRect(g.x-3,BODEN-rows.length-6,bw+2,4);
      ctx.fillStyle=P.rot; ctx.fillRect(g.x-2,BODEN-rows.length-5,Math.round(bw*f),2);
    }
    /* Lebensbalken */
    const bw=40, bx=Math.round(S.kamX)+W/2-bw/2;
    ctx.fillStyle='#000a'; ctx.fillRect(bx-1,25,bw+2,6);
    ctx.fillStyle=P.rot; ctx.fillRect(bx,26,Math.round(bw*g.hp/TUNE.gegnerTreffer),4);
  }

  /* Spieler - kommt in dieselbe Liste, damit die Tiefe stimmt */
  inTiefe.push({t:S.tiefe, mal:()=>{
    let rows;
    if(S.suchT>0) rows=SPR.suchen;
    else if(S.modus==='kampf'&&S.gegner&&S.gegner.zustand==='getroffen') rows=SPR.konter;
    else if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
    else if(tempo2D(S.vx,S.vt)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
    else rows=SPR.steh;
    /* S.y traegt die Sprunghoehe, die Tiefe verschiebt zusaetzlich. */
    const versatz=BODEN-bodenY(S.tiefe);
    const y=S.y-versatz-rows.length;
    ctx.globalAlpha=.28; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(S.x-3),Math.round(bodenY(S.tiefe)),7,1); ctx.globalAlpha=1;
    outline(rows,S.x-3,y,1,.6);
    if(S.blick<0) spriteFlip(rows,S.x-3,y); else sprite(rows,S.x-3,y);
  }});
  zeichneNachTiefe(inTiefe);

  ctx.restore();

  /* Vignette, staerker mit steigendem Pegel */
  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  /* Der Ausholbalken aus nacht/hud.js. Der Gegner hier ist keine Figur aus
     nacht/kampf.js - sein Zustand heisst 'wind' - deshalb ein kleiner
     Uebersetzer auf die Felder, die der Balken liest. */
  if(S.modus==='kampf'&&S.gegner&&S.gegner.zustand==='wind'){
    zeichneAusholbalken({ zustand:'ausholen', zT:S.gegner.t,
      ausholenDauer:windupJetzt(), fensterAnteil:TUNE.konterFenster },
      S.gegner.verpasst?'ZU FRUEH':'ER HOLT AUS', 30);
  }
  /* Herzen */
  for(let i=0;i<lebenMax();i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*FX.hz(3)*2)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-12;
  text(uhr,W-textW(uhr)-6,6,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  /* Mut-Marke */
  ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*TUNE.mutAb/100),by-1,1,6);
  /* PEGEL rechts neben dem Balken (Mitte der Balkenhoehe), MUT eigene Zeile darunter an der Marke: die
     beiden Woerter beruehren sich nicht mehr (vorher y=12 und y=18 direkt uebereinander, PEGEL in dunkelgrau). */
  text('PEGEL',bx+bw+5,by,P.dim);
  text('MUT',bx+Math.round(bw*TUNE.mutAb/100)-5,by+8,P.gruen);

  /* Aufgabenliste. Erledigte werden durchgestrichen: die Linie waechst in
     TUNE.durchstrichSek. Versteckte stehen als ??? bis man sie erledigt. */
  let y=22;
  /* Unterlage hinter der Liste: die Wand dahinter ist jetzt bunt, die Schrift muss lesbar bleiben. */
  { let bm=0; for(const a of alleAufgaben()){ const n=(VERSTECKT.includes(a)&&!S.erledigt[a.id])?3:a.text.length; bm=Math.max(bm,n*4-1); }
    ctx.fillStyle=P.listeGrund+'b0'; ctx.fillRect(2,y-3,bm+18,alleAufgaben().length*7+4); }
  for(const a of alleAufgaben()){
    const versteckt=VERSTECKT.includes(a);
    const ok=!!S.erledigt[a.id];
    const name=(versteckt&&!ok)?'???':a.text;
    text(ok?'X':(versteckt?'?':'-'),6,y,ok?P.gruen:P.dunkel);
    text(name,14,y,ok?P.dunkel:(versteckt?P.dim:P.weiss));
    if(S.striche[a.id]!==undefined){
      const f=Math.min(1,S.striche[a.id]/TUNE.durchstrichSek);
      ctx.fillStyle=P.dunkel; ctx.fillRect(14,y+2,Math.round(textW(name)*f),1);
    }
    y+=7;
  }
  if(alleFertig()&&Math.floor(S.t*2)%2===0) textC('ALLE BEREIT - RAUS AUS DER WOHNUNG',H-42,P.gold);

  /* Das Glas beim Einschenken: gruen die Zone, gold der Fuellstand, rot wenn es ueberlaeuft */
  if(S.schenk){
    const bw=60, bx=Math.round((W-bw)/2), by=H-62, f=S.schenk.f;
    const [lo,hi]=TUNE.schenkZone;
    ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,7);
    ctx.fillStyle=P.dunkel; ctx.fillRect(bx,by,bw,3);
    ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*lo),by,Math.round(bw*(hi-lo)),3);
    ctx.fillStyle=f>hi?P.rot:P.gold; ctx.fillRect(bx,by,Math.round(bw*f),3);
    text('GLAS',bx+(bw-textW('GLAS'))/2,by-7,P.dim);
  }

  /* Inventar */
  let ix=W-30;
  if(S.inventar.jacke){ sprite(SPR.jacke,ix,16); ix-=12; }
  if(S.inventar.ausweis){ sprite(SPR.ausweis,ix,16); ix-=12; }
  if(S.inventar.dose){ sprite(SPR.dose,ix,16); ix-=10; }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Gespraech */
  if(S.reden){
    const p2=S.reden;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(p2.name,8,H-38,P.neon2);
    const zeile=p2._zeilen[S.redeZeile]||'';
    textC(zeile,H-24,P.weiss);
    if(Math.floor(S.t*2)%2===0){ const w=IS_TOUCH?'TIPPEN':'E'; text(w,W-textW(w)-6,H-12,P.dunkel); }
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('BEI MORITZ',22,P.neon,3);
  textC('LEVEL 2 - VORGLUEHEN',44,P.dim);
  const zeilen=['DER BUS FAEHRT UM 22:00','VIER LEUTE. KEINER WILL LOS.','MACH SIE FERTIG.'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  /* Kein SPRUNG/LEER hier: Springen und Tiefe (W/S) haben in dieser flachen
     Wohnung keine Wirkung (TIEFE_PRO_SEITE['level2.html']=false, keine
     Hindernisse) - beigebracht wurde eine Taste, die nichts tut. */
  const st=IS_TOUCH?[['STICK','LAUFEN'],['KNOPF','REDEN, SUCHEN, SCHENKEN']]
                   :[['A D','LAUFEN'],['E','REDEN, SUCHEN, SCHENKEN']];
  st.forEach((z,i)=>{ text(z[0],70,108+i*9,P.gold); text(z[1],104,108+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'LEERTASTE ODER E',H-19,P.weiss,1);
  if(!IS_TOUCH){
    const a='TASTE 1    LEVEL 1 - DIE SCHULE';
    const b='LEERTASTE  LEVEL 2 - BEI MORITZ';
    text(a,(W-textW(a))/2,H-11,P.dunkel);
    text(b,(W-textW(b))/2,H-5,P.neon2);
  }
}
function zeichneIntro(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,0,W,H);
  const m=Math.round(W/2);
  ctx.fillStyle='#241a2c'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#1d1727'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  /* Partylicht */
  const puls=(Math.sin(S.t*5)*.5+.5);
  ctx.globalAlpha=.14+puls*.12;
  ctx.drawImage(verlauf('introlicht',220,110,g=>{
    const gr=g.createRadialGradient(110,14,4,110,14,96);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,220,110); }),m-110,30);
  ctx.globalAlpha=1;
  sprite(SPR.sofa,m-60,124);
  sprite(SPR.schlaefer,m-52,122);
  sprite(SPR.steh,m+20,130-13);
  sprite(SPR.moritz,m+46,130-15);
  ctx.drawImage(verlauf('introvig',W,H,g=>{
    const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0){ const w=IS_TOUCH?'TIPPEN  WEITER':'E  WEITER'; text(w,W-textW(w)-6,H-10,P.dunkel); }
  zeichneUeberspringen(S.skipT,INTRO_SKIP);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC(IS_TOUCH?'TIPPEN ZUM WEITERSPIELEN':'P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt){ if(s.txt.includes('|')) zeichneKarte(s.txt,H-33,P.weiss,1); else textC(s.txt,H-26,P.weiss); }
    if(Math.floor(S.t*2)%2===0){ const h=IS_TOUCH?'HALTEN ZUM UEBERSPRINGEN':'E HALTEN ZUM UEBERSPRINGEN'; text(h,W-textW(h)-6,H-10,P.dunkel); }
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 2 GESCHAFFT',34,P.gold,2);
      textC('IHR SEID DRAUSSEN. GERADE NOCH.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegel)+'   MUT '+S.mut,96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 3':'E  WEITER ZU LEVEL 3',134,P.gruen,1);
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
      if(S.kampfVerloren) textC(tasteText('E: NOCHMAL AN DER TUER','TIPPEN: NOCHMAL AN DER TUER'),96,P.gold);
    }
    if(!S.gewonnen&&Math.floor(S.t*2)%2===0) textC(tasteText('LEERTASTE: GANZ VON VORN','ODER: VON VORN'),H-18,P.gold);
  }
}

   SCHLEIFE
   ========================================================================== */


starteSchleife();
</script>
