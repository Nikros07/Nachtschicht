<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html.touch #touch { display:block; }

  /* ---- Vollbild-Knopf ---- */
  #fs { position:absolute; top:6px; right:8px; z-index:5;
    background:rgba(20,16,34,.75); color:#8d86a8; border:1px solid #2a2246;

  /* Im Vollbild verschwindet das Gehaeuse, das Bild fuellt alles.
     ACHTUNG: #cab ist SELBST das Vollbild-Element - also #cab:fullscreen,
     nicht :fullscreen #cab. Letzteres traefe nur Kindelemente. */
  #cab:fullscreen, #cab:-webkit-full-screen {

/* ---- ETAPPEN ------------------------------------------------------------- */

  { m:1000, name:'AFTERHOUR',  sky:['#0e1638','#050a1c'], hue:'#1f4d6b', neon:'#48ffd0', rain:.6,  boss:{name:'DIE MUEDIGKEIT', sub:'NUR NOCH KURZ',    hp:6, telMul:1.00} },

/* ==========================================================================

const SAY = {

  blackout:['LICHT AUS','FILMRISS','NICHTS MEHR DA','ZU VIEL DES GUTEN',
            'DER PEGEL HAT GEWONNEN','GUTE NACHT MARIE'],
  sperrstunde:['EINGEHOLT','ZU LANGE GETRODELT','DIE NACHT WAR SCHNELLER',

  bossTaunt:{
    'DER TUERSTEHER':['NICHT HEUTE','GESCHLOSSENE GESELLSCHAFT','GEH NACH HAUSE'],
    'DIE MEUTE':['ALLE AUF EINMAL','WO WILLST DU HIN','BLEIB DOCH'],
    'DIE MUEDIGKEIT':['LEG DICH HIN','NUR KURZ DIE AUGEN','ES IST VIER UHR'],
    'DIE SONNE':['ES WIRD HELL','ZU SPAET','GEH SCHLAFEN'],
  },
};
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ==========================================================================
   3x5 BITMAP-FONT
   ========================================================================== */
const F = {
 A:'010,101,111,101,101', B:'110,101,110,101,110', C:'011,100,100,100,011',
 D:'110,101,101,101,110', E:'111,100,110,100,111', F:'111,100,110,100,100',
 G:'011,100,101,101,011', H:'101,101,111,101,101', I:'111,010,010,010,111',
 J:'001,001,001,101,010', K:'101,110,100,110,101', L:'100,100,100,100,111',
 M:'101,111,111,101,101', N:'101,111,101,101,101', O:'010,101,101,101,010',
 P:'110,101,110,100,100', Q:'010,101,101,110,011', R:'110,101,110,101,101',
 S:'011,100,010,001,110', T:'111,010,010,010,010', U:'101,101,101,101,111',
 V:'101,101,101,101,010', W:'101,101,111,111,101', X:'101,101,010,101,101',
 Y:'101,101,010,010,010', Z:'111,001,010,100,111',
 0:'111,101,101,101,111', 1:'010,110,010,010,111', 2:'111,001,111,100,111',
 3:'111,001,111,001,111', 4:'101,101,111,001,001', 5:'111,100,111,001,111',
 6:'111,100,111,101,111', 7:'111,001,001,001,001', 8:'111,101,111,101,111',
 9:'111,101,111,001,111',
 ' ':'000,000,000,000,000', '.':'000,000,000,000,010', ':':'000,010,000,010,000',
 '-':'000,000,111,000,000', '!':'010,010,010,000,010', '?':'110,001,010,000,010',
 '/':'001,001,010,100,100', '%':'101,001,010,100,101', '+':'000,010,111,010,000',
 '<':'001,010,100,010,001', '>':'100,010,001,010,100', '*':'101,010,111,010,101',
 ',':'000,000,000,010,100',
};
const GLYPH = {}; for (const k in F) GLYPH[k] = F[k].split(',');
/* Zeichnet auf eine beliebige Leinwand - noetig, um Schrift vorzubacken. */
function textTo(g,str,x,y,col,s){
  g.fillStyle=col; str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const gl=GLYPH[str[i]]||GLYPH['?'];
    for(let r=0;r<5;r++) for(let c=0;c<3;c++)
      if(gl[r][c]==='1') g.fillRect(x+(i*4+c)*s, y+r*s, s, s); }
}
/* Jedes Zeichen wird einmal gebacken. Es gibt nur 43 Glyphen, also bleibt
   der Cache winzig - selbst bei einem Punktestand, der sich staendig aendert. */
const _glyphCache=new Map();
function text(str,x,y,col,s=1){
  str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){
    const ch=str[i]; if(ch===' ') continue;
    const k=ch+col+s;
    let c=_glyphCache.get(k);
    if(!c){ const [cc,xx]=leinwand(3*s,5*s); textTo(xx,ch,0,0,col,s); c=cc; _glyphCache.set(k,c); }
    ctx.drawImage(c,Math.round(x+i*4*s),Math.round(y));
  }
}
const textW=(s0,s=1)=>String(s0).length*4*s-s;
const textC=(s0,y,col,s=1)=>text(s0,Math.round((320-textW(s0,s))/2),y,col,s);
/* Leuchtschrift malte den Text fuenfmal. Jetzt einmal gebacken, dann kopiert. */
function textGlow(str,x,y,col,s=1){
  str=String(str).toUpperCase();
  const k=str+'|'+col+'|'+s;
  let c=_texts.get(k);
  if(!c){
    const pad=s, [cc,xx]=leinwand(textW(str,s)+2*pad, 5*s+2*pad);
    xx.globalAlpha=.25;
    textTo(xx,str,pad-s,pad,col,s); textTo(xx,str,pad+s,pad,col,s);
    textTo(xx,str,pad,pad-s,col,s); textTo(xx,str,pad,pad+s,col,s);
    xx.globalAlpha=1; textTo(xx,str,pad,pad,col,s);
    c=cc; if(_texts.size>400) _texts.clear();
    _texts.set(k,c);
  }
  ctx.drawImage(c,Math.round(x)-s,Math.round(y)-s);
}
function textShadow(str,x,y,col,s=1){ text(str,x+1,y+1,'#000',s); text(str,x,y,col,s); }

/* ==========================================================================
   SPRITES   ('.' = transparent)
   Der Kopf ist ueberall ein eigener Block -> da kommen eure Gesichter rein.
   ========================================================================== */
const KEY = {
  k:'#0a0810', s:'#e8b088', h:'#2a1c14', t:'#3ad1a0', p:'#2b2b48', w:'#f4f0ff',
  g:'#ffd447', n:'#ff3d8b', c:'#31e6ff', r:'#ff4d4d', d:'#4a4363', b:'#6b4a2a',
  o:'#a8681f', e:'#20182e', l:'#ffe08a', v:'#c8324a', m:'#7a2d3d', a:'#1a1626',
};
/* ==========================================================================
   BILD-CACHE
   Pixel einzeln zu malen kostet pro Sprite dutzende Aufrufe - und das
   60 mal pro Sekunde fuer jedes Objekt. Stattdessen wird jedes Sprite
   einmal auf eine eigene kleine Leinwand gebacken und danach nur noch
   als fertiges Bild kopiert. Aus ~2800 Aufrufen pro Bild werden ~150.
   ========================================================================== */
const _ids=new WeakMap(); let _nextId=0;
const _sprites=new Map(), _outlines=new Map(), _texts=new Map(), _grads=new Map();

/* Farbverlaeufe sind teuer und aendern sich fast nie - einmal backen. */
function verlauf(key,w,h,mal){
  let c=_grads.get(key);
  if(!c){ const [cc,xx]=leinwand(w,h); mal(xx); c=cc; _grads.set(key,c); }
  return c;
}
function rowsId(rows){
  let id=_ids.get(rows);
  if(id===undefined){ id=++_nextId; _ids.set(rows,id); }
  return id;
}
function leinwand(w,h){
  const c=document.createElement('canvas');
  c.width=Math.max(1,w); c.height=Math.max(1,h);
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  return [c,x];
}
function backeSprite(rows,sc,tint){
  let bw=0; for(const r of rows) if(r.length>bw) bw=r.length;
  const [c,x]=leinwand(bw*sc, rows.length*sc);
  for(let r=0;r<rows.length;r++){ const row=rows[r];
    for(let i=0;i<row.length;i++){ const ch=row[i]; if(ch==='.') continue;
      x.fillStyle=tint||KEY[ch]||'#fff'; x.fillRect(i*sc,r*sc,sc,sc); } }
  return c;
}
function holeSprite(rows,sc,tint){
  const k=rowsId(rows)+'|'+sc+'|'+(tint||'-');
  let c=_sprites.get(k);
  if(!c){ c=backeSprite(rows,sc,tint); _sprites.set(k,c); }
  return c;
}
function sprite(rows,x,y,sc=1,tint=null,alpha=1){
  const c=holeSprite(rows,sc,tint);
  if(alpha!==1) ctx.globalAlpha=alpha;
  ctx.drawImage(c,Math.round(x),Math.round(y));
  if(alpha!==1) ctx.globalAlpha=1;
}
/* Kontur: einmal als schwarzer, um 1 Pixel aufgeblasener Umriss backen.
   Vorher waren das vier volle Sprite-Durchlaeufe pro Objekt und Bild. */
function outline(rows,x,y,sc=1,a=.8){
  const k=rowsId(rows)+'|'+sc;
  let c=_outlines.get(k);
  if(!c){
    const s=holeSprite(rows,sc,'#000');
    const [cc,xx]=leinwand(s.width+2*sc, s.height+2*sc);
    xx.drawImage(s,0,sc); xx.drawImage(s,2*sc,sc);
    xx.drawImage(s,sc,0); xx.drawImage(s,sc,2*sc);
    c=cc; _outlines.set(k,c);
  }
  ctx.globalAlpha=a;
  ctx.drawImage(c,Math.round(x)-sc,Math.round(y)-sc);
  ctx.globalAlpha=1;
}
const HEAD=['..hhh..','.hsssh.','.sssss.','..sss..'];
const mkRun = legs => [...HEAD,'..ttt..',...legs];

const SPR = {
  run:[
    mkRun(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
    mkRun(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk']),
    mkRun(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','.p...p.','.p...p.','kk...kk']),

let AC=null, muted=false;
function ensureAudio(){ if(AC) return AC;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MUS.next=AC.currentTime+.05; }
  catch(e){ AC=null; } return AC; }
function tone(f,when,dur,type='square',vol=.05){
  if(!AC||muted) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,when);
  g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g); g.connect(AC.destination); o.start(when); o.stop(when+dur+.02);
}
function slide(f1,f2,dur,type='square',vol=.05){
  ensureAudio(); if(!AC||muted) return;
  const t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.02);
}
const beep=(f,d=.07,t='square',v=.05)=>{ ensureAudio(); if(AC) tone(f,AC.currentTime,d,t,v); };
function noise(dur=.25,vol=.08,when=null){
  ensureAudio(); if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(), g=AC.createGain();
  src.buffer=buf; g.gain.value=vol; src.connect(g); g.connect(AC.destination);
  src.start(when||AC.currentTime);
}
const SFX = {
  jump:  ()=>beep(520,.06,'square',.04),
  land:  ()=>beep(180,.04,'triangle',.03),
  swing: ()=>slide(300,120,.09,'sawtooth',.035),
  klatsch:()=>{ noise(.09,.14); slide(220,60,.14,'square',.07); },
  ko:    ()=>{ slide(400,90,.22,'square',.06); noise(.18,.08); },
  shot:  n=>{ beep(1000+n*80,.05); beep(1500+n*90,.05); },
  water: ()=>beep(400,.1,'sine',.05),
  hurt:  ()=>{ noise(.3,.1); beep(140,.3,'sawtooth',.06); },
  warn:  ()=>{ beep(880,.06,'square',.05); },
  bossIn:()=>{ slide(90,180,.5,'sawtooth',.06); noise(.4,.06); },
  win:   ()=>{ beep(880,.08); setTimeout(()=>beep(1180,.08),80); setTimeout(()=>beep(1560,.18),160); },
  etappe:()=>{ beep(660,.09); setTimeout(()=>beep(990,.13),90); },
};
const BASS=[110,0,164.8,0, 130.8,0,164.8,0, 98,0,146.8,0, 110,0,164.8,196];
const BASS_BOSS=[73.4,73.4,0,98, 73.4,0,87.3,0, 65.4,65.4,0,87.3, 65.4,0,98,110];
const MUS={step:0,next:0};
function musicTick(){
  if(!AC||muted||!TUNE.musicOn||S.mode==='pause') return;
  const boss=!!S.boss;
  const bpm=TUNE.musicBpm*(S.mode==='play'?(boss?1.18:1+S.etappe*.05):.8);
  const st=60/bpm/4, line=boss?BASS_BOSS:BASS;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%line.length, f=line[i];
    if(f) tone(f,MUS.next,st*.85,'square',S.mode==='play'?.028:.018);
    if(S.mode==='play'){
      if(i%4===2) noise(.02,.012,MUS.next);
      if(i%8===0) tone(70,MUS.next,.08,'sine',.06);
      if((S.pegel>55||boss)&&i%4===0) tone(f?f*3:330,MUS.next,st*.5,'triangle',.013);
    }
    MUS.next+=st; MUS.step++;
  }
}

function isFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function fit(){
  const pad = (isFs()||IS_TOUCH) ? 0 : 46;
  const raw = Math.min((innerWidth-pad)/W,(innerHeight-pad)/H);
  /* Ganzzahlig skalieren haelt die Pixel scharf. Auf kleinen Schirmen waere
     das aber verschenkter Platz - deshalb dort halbe Schritte erlauben. */
  const s = raw<3 ? Math.max(.5,Math.floor(raw*4)/4) : Math.floor(raw);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}

function toggleFullscreen(){
  const root=document.getElementById('cab');
  if(isFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
  const req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(!req) return;
  Promise.resolve(req.call(root)).then(()=>{
    /* Am Handy zusaetzlich ins Querformat zwingen, wo der Browser es zulaesst */
    if(screen.orientation&&screen.orientation.lock)
      screen.orientation.lock('landscape').catch(()=>{});
  }).catch(()=>{});
}

let PART=[], FLOAT=[];
function puff(x,y,n,col,spread=30,up=20){ if(!TUNE.particles) return;
  for(let i=0;i<n;i++) PART.push({x,y,vx:(Math.random()-.5)*spread,vy:-Math.random()*up,
    life:.3+Math.random()*.4,max:.7,col,g:120}); }
function shards(x,y,col,n=10,pow=90){ if(!TUNE.particles) return;
  for(let i=0;i<n;i++) PART.push({x,y,vx:(Math.random()-.5)*pow,vy:-Math.random()*70-10,
    life:.4+Math.random()*.5,max:.9,col,g:340}); }
function say(txt,x,y,col){ if(!TUNE.sprueche||!txt) return;
  FLOAT.push({txt,x,y,col,life:1.1,max:1.1}); }
function updateFx(dt){
  for(const p of PART){ p.life-=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  PART=PART.filter(p=>p.life>0);
  for(const f of FLOAT){ f.life-=dt; f.y-=22*dt; }
  FLOAT=FLOAT.filter(f=>f.life>0);
}
function drawFx(){
  for(const p of PART){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life/p.max));
    ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1); }
  ctx.globalAlpha=1;
  for(const f of FLOAT){ ctx.globalAlpha=Math.max(0,Math.min(1,f.life/f.max));
    const x=Math.round(Math.max(3,Math.min(W-textW(f.txt)-3,f.x-textW(f.txt)/2)));
    textShadow(f.txt,x,Math.round(f.y),f.col); }
  ctx.globalAlpha=1;
}

function mkThing(kind,x){
  const o={kind,x};
  if(kind==='cone')   Object.assign(o,{y:GROUND-7, w:7, h:7});
  if(kind==='kasten') Object.assign(o,{y:GROUND-12,w:8, h:12});
  if(kind==='tonne')  Object.assign(o,{y:GROUND-12,w:8, h:12});
  if(kind==='gitter') Object.assign(o,{y:GROUND-12,w:10,h:12});
  if(kind==='schild') Object.assign(o,{y:GROUND-46,w:16,h:32,hit:{ox:0,oy:0,w:16,h:16}});
  /* Gegner haben eine Kampf-KI: laufen -> ausholen -> schlagen -> offen stehen.
     hoch = Schlag auf Kopfhoehe (ducken), tief = Fegen (springen),
     voll  = trifft alles (zurueckweichen ist die einzige Antwort). */
  const foeBase={foe:true,hp:1,stun:0,st:'walk',t:0,
                 windSec:TUNE.foeWindSec,recSec:TUNE.foeRecSec,reach:TUNE.foeReach,zone:'hoch'};
  if(kind==='gegner') Object.assign(o,{y:GROUND-13,w:7, h:13,vx:24},foeBase);
  if(kind==='brocken')Object.assign(o,{y:GROUND-15,w:9, h:15,vx:15},foeBase,
                                    {hp:2,zone:'voll',windSec:TUNE.foeWindSec*1.5,
                                     recSec:TUNE.foeRecSec*1.25,panzer:true});
  if(kind==='flitzer')Object.assign(o,{y:GROUND-12,w:6, h:12,vx:52},foeBase,
                                    {zone:'tief',windSec:TUNE.foeWindSec*.72,recSec:TUNE.foeRecSec*.8});
  if(kind==='werfer') Object.assign(o,{y:GROUND-13,w:7, h:13,vx:18},foeBase,
                                    {ranged:true,reach:78,windSec:TUNE.foeWindSec*1.2});
  if(kind==='taube')  Object.assign(o,{y:GROUND-26,w:7, h:5, foe:true,vx:46,hp:1,stun:0,fly:true,st:'walk'});
  return o;
}

/* ---- Gegner-KI ---- */
function foeSwing(o){
  if(o.ranged){ S.shots.push({x:o.x-2,y:o.y+2,vx:-128,vy:-52,w:5,h:5,kind:'flasche'});
                slide(600,300,.18,'triangle',.045); return; }
  slide(280,150,.1,'sawtooth',.03);
}
function updateFoe(o,dt){
  if(o.stun>0){ o.stun-=dt; return; }
  if(o.fly){ o.x-=o.vx*dt; return; }
  /* Bist du an ihm vorbei, ist er raus aus dem Kampf. Ohne das bleibt er
     ewig stehen und schlaegt ins Leere - seine Trefferzone zeigt nach links. */
  if(o.x < S.px-2){ o.st='walk'; o.t=0; o.x-=o.vx*dt; return; }
  if(o.st==='wind'){ o.t-=dt; if(o.t<=0){ o.st='swing'; o.t=TUNE.foeSwingSec; foeSwing(o); } return; }
  if(o.st==='swing'){ o.t-=dt; if(o.t<=0){ o.st='rec'; o.t=o.recSec; } return; }
  if(o.st==='rec'){ o.t-=dt; if(o.t<=0) o.st='walk'; return; }
  const d=o.x-S.px;
  if(d>o.reach) o.x-=o.vx*dt;
  else { o.st='wind'; o.t=o.windSec; if(!o.ranged) beep(220,.05,'square',.025); }
}
/* Trefferzone eines ausgefuehrten Schlags */
function foeHitbox(o){
  if(o.st!=='swing'||o.ranged) return null;
  const r=TUNE.foeSwingReach;
  if(o.zone==='hoch') return {x:o.x-r,y:o.y+1, w:r+3,h:7};
  if(o.zone==='tief') return {x:o.x-r,y:GROUND-6,w:r+3,h:6};
  return {x:o.x-r,y:o.y,   w:r+3,h:o.h};
}
function spawn(){
  const r=Math.random();
  if(r<TUNE.chanceShot)
    S.things.push({kind:'shot',x:W+8,y:GROUND-34-Math.random()*24,w:5,h:5});
  else if(r<TUNE.chanceShot+TUNE.chanceWater)
    S.things.push({kind:'water',x:W+8,y:GROUND-30-Math.random()*18,w:5,h:5});
  else if(Math.random()<enemyChance()){
    /* Gegner kommen gern in Gruppen - dafuer gibt es Combos */
    const n = Math.random()<gruppeChance() ? (Math.random()<.35?3:2) : 1;
    for(let i=0;i<n;i++){
      const roll=Math.random();
      const kind = roll<.12 ? 'taube'   : roll<.28 ? 'brocken'
                 : roll<.44 ? 'flitzer' : roll<.56 ? 'werfer' : 'gegner';
      S.things.push(mkThing(kind, W+10+i*(26+Math.random()*16)));
    }
  }
  else if(Math.random()<TUNE.chanceOverhead)
    S.things.push(mkThing('schild',W+8));
  else
    S.things.push(mkThing(['cone','kasten','tonne','gitter'][Math.floor(Math.random()*4)],W+8));
  const d=diffScale();
  S.nextSpawn=(TUNE.gapMinPx+Math.random()*(TUNE.gapMaxPx-TUNE.gapMinPx))*d;
}

/* ==========================================================================
   BOSS  -  echter Kampf: telegrafierte Angriffe, Phasen, Schwachstelle
   ========================================================================== */
function startBoss(i){
  const b=ETAPPEN[i].boss; if(!b) return;
  const hp=b.hp||TUNE.bossHp;
  S.boss={ name:b.name, sub:b.sub, i, x:W+40, tx:214, hp, maxHp:hp, telMul:b.telMul||1,
           phase:1, state:'entry', t:0, tel:0, atk:null, iFrames:0, hurtT:0, dead:0, cd:1.2 };
  S.things=S.things.filter(o=>o.kind==='shot'||o.kind==='water');
  S.banner=2.2; S.bannerTxt=b.name; S.bannerSub=b.sub;
  SFX.bossIn();
}
function bossPhaseOf(b){
  const f=b.hp/b.maxHp;
  return f<=TUNE.bossPhase3At?3 : f<=TUNE.bossPhase2At?2 : 1;
}
function bossPickAttack(b){
  const opts = b.phase===1 ? ['flasche','flasche','sturm']
             : b.phase===2 ? ['flasche','sturm','doppel']
             :               ['sturm','doppel','flasche','sturm'];
  return pick(opts);
}
function updateBoss(dt){
  const b=S.boss; b.t+=dt;
  if(b.iFrames>0) b.iFrames-=dt*1000;
  if(b.hurtT>0)   b.hurtT-=dt;

  if(b.state==='entry'){
    b.x+=(b.tx-b.x)*Math.min(1,dt*2.2);
    if(Math.abs(b.x-b.tx)<2){ b.state='idle'; b.cd=.9; }
    return;
  }
  if(b.state==='dead'){ b.dead+=dt;
    if(b.dead>1.4){ S.score+=TUNE.bossBonus; S.banner=2.0;
      S.bannerTxt=pick(SAY.bossWin); S.bannerSub='+'+TUNE.bossBonus; S.boss=null; SFX.win(); }
    return;
  }

  b.phase=bossPhaseOf(b);

  switch(b.state){
    case 'idle':
      b.cd-=dt*(1+(b.phase-1)*.35);
      if(b.cd<=0){
        b.atk=bossPickAttack(b);
        b.state='telegraph'; b.tel=TUNE.bossTelegraphMs/1000*b.telMul; SFX.warn();
        /* Ansage, was zu tun ist - Bosse muessen fair telegrafieren */
        say(b.atk==='sturm'?'DUCKEN':'SPRINGEN', S.px+40, GROUND-66, P.danger);
        if(Math.random()<.5) say(pick(SAY.bossTaunt[b.name]||['!']), b.x+16, GROUND-78, P.dim);
      }
      break;
    case 'telegraph':
      b.tel-=dt; if(b.tel<=0) fireBossAttack(b);
      break;
    case 'charge':                    /* stuermt heran - drunter wegducken */
      b.x-=b.vx*dt;
      /* bleibt in Schlagreichweite des Spielers stehen, wo der gerade steht */
      if(b.x<=S.px+16){ b.x=S.px+16; b.state='punish'; b.punish=1.2-(b.phase-1)*.22;
                        puff(b.x+8,GROUND-4,14,'#6b6488',80,20); S.shake=3; }
      break;
    case 'punish':                    /* steht offen - JETZT draufhauen */
      b.punish-=dt; if(b.punish<=0) b.state='retreat';
      break;
    case 'retreat':
      b.x+=180*dt;
      if(b.x>=b.tx){ b.x=b.tx; b.state='idle'; b.cd=1.2-(b.phase-1)*.3; }
      break;
    case 'recover':
      b.cd-=dt; if(b.cd<=0){ b.state='idle'; b.cd=1.15-(b.phase-1)*.28; }
      break;
  }
}
function fireBossAttack(b){
  if(b.atk==='sturm'){                        // Sturmangriff -> wegducken, dann kontern
    b.state='charge'; b.vx=195+b.phase*30; slide(200,420,.25,'sawtooth',.05); return;
  }
  if(b.atk==='flasche'){                      // Flaschen im Bogen -> drueberspringen
    const n=b.phase>=3?2:1;
    for(let k=0;k<n;k++)
      S.shots.push({x:b.x+6,y:GROUND-30-k*12,vx:-118-k*22,vy:-58,w:5,h:5,kind:'flasche'});
    slide(600,300,.2,'triangle',.05);
  }
  if(b.atk==='doppel'){                       // Handlanger hoch und tief
    S.things.push(Object.assign(mkThing('taube',b.x),{vx:120}));
    S.things.push(Object.assign(mkThing('gegner',b.x+26),{vx:105}));
    slide(300,140,.3,'square',.05);
  }
  b.state='recover'; b.cd=.55;
}
function bossTakeHit(){
  const b=S.boss;                    // verwundbar ist er nur im Konterfenster
  if(!b||b.iFrames>0||b.state!=='punish') return false;
  b.hp--; b.iFrames=TUNE.bossIFramesMs; b.hurtT=.3;
  S.shake=5; S.freeze=TUNE.hitStopMs;
  shards(b.x+16,GROUND-40,P.danger,16,120);
  SFX.klatsch();
  if(b.hp<=0){ b.state='dead'; b.dead=0; SFX.ko();
    puff(b.x+16,GROUND-30,40,P.gold,140,90); say('DER LAG',b.x+16,GROUND-70,P.gold); }
  return true;
}

/* ==========================================================================
   UPDATE
   ========================================================================== */
function demoBrain(){
  const foe=S.things.find(o=>o.foe&&o.x>S.px-4&&o.x<S.px+30);
  const wall=S.things.find(o=>!o.foe&&o.kind!=='shot'&&o.kind!=='water'&&o.x>S.px-4&&o.x<S.px+64);
  if(foe&&S.t-S.hitT>TUNE.hitCooldownMs/1000+.04){ hitQueue.push(S.t); }
  duckHeld=!!(wall&&wall.kind==='schild')||!!(S.boss&&S.boss.state==='charge');
  if(!duckHeld&&wall&&wall.kind!=='schild'&&S.onGround&&wall.x<S.px+44){ jumpQueue.push(S.t); jumpHeld=true; }
  if(S.boss&&S.boss.state==='punish') hitQueue.push(S.t);
  /* Die Vorfuehrung muss selbst laufen - sonst holt die Sperrstunde sie ein */
  rightHeld = !foe || foe.x-S.px>19;
  leftHeld  = false;
  if(S.vy>-60) jumpHeld=false;
}

function update(dt){
  S.t+=dt; musicTick(); updateFx(dt);
  if(S.freeze>0){ S.freeze-=dt*1000; return; }          // Hit-Stop
  if(S.mode==='pause') return;
  if(S.mode==='over') S.overT+=dt;
  S.shake=Math.max(0,S.shake-dt*18);
  S.flash=Math.max(0,S.flash-dt*1.6);
  S.banner=Math.max(0,S.banner-dt);

  const running=S.mode==='play'||(S.mode==='attract'&&S.demo);
  if(!running) return;
  if(S.mode==='attract') demoBrain();

  const p=S.pegel/TUNE.pegelMax, delay=p*TUNE.fxInputDelayMs;
  S.pegel=Math.max(0,S.pegel-TUNE.pegelDecayPerSec*dt);
  if(S.inv>0) S.inv-=dt;

  /* Etappe + Boss */
  const e=etappeFor(S.dist/10);
  if(e!==S.etappe){
    S.etappe=e; SFX.etappe();
    if(S.mode==='play'&&ETAPPEN[e].boss&&S.bossDone<e){ S.bossDone=e; startBoss(e); }
    else { S.banner=2.0; S.bannerTxt=ETAPPEN[e].name; S.bannerSub='ETAPPE '+(e+1); }
  }
  if(S.boss) updateBoss(dt);

  if(S.combo>0){ S.comboT-=dt; if(S.comboT<=0) S.combo=0; }

  /* --- Schlag --- (alle Zeiten in Spielsekunden) */
  const now=S.t, delayS=delay/1000;
  const WIND=TUNE.hitWindupMs/1000, ACT=TUNE.hitActiveMs/1000, CD=TUNE.hitCooldownMs/1000;
  while(hitQueue.length&&now-hitQueue[0]>=delayS){
    hitQueue.shift();
    if(now-S.hitT>=CD){ S.hitT=now; S.hitDone=false; SFX.swing(); }
  }
  const hitAge=now-S.hitT;
  const hitActive = hitAge>=WIND && hitAge<=WIND+ACT;

  /* --- Sprung --- */
  S.ducking=duckHeld&&S.onGround&&hitAge>WIND+ACT;
  while(jumpQueue.length&&now-jumpQueue[0]>=delayS){
    jumpQueue.shift();
    if(S.onGround||(now-S.lastGround)<TUNE.coyoteMs/1000){
      S.vy=TUNE.jumpVel; S.onGround=false; puff(S.px+4,GROUND-1,5,'#6b6488',26,8); SFX.jump(); }
  }
  if(!jumpHeld&&S.vy<0&&TUNE.shortHopCut>0) S.vy*=(1-TUNE.shortHopCut*dt*12);
  S.vy+=TUNE.gravity*dt; S.y+=S.vy*dt;
  if(S.y>=0){ S.y=0; S.vy=0;
    if(!S.onGround){ puff(S.px+4,GROUND-1,7,'#6b6488',40,14); SFX.land(); }
    S.onGround=true; S.lastGround=now;
  } else S.onGround=false;

  /* --- Laufen --- Nichts bewegt sich, wenn du dich nicht bewegst.
     Laeufst du ueber pushX hinaus, schiebst du stattdessen die Welt. */
  const mv=(rightHeld?1:0)-(leftHeld?1:0);
  if(mv&&!S.ducking)
    S.px += mv*TUNE.walkSpeed*(S.onGround?1:TUNE.moveAirFactor)*(1-p*.25)*dt;
  const grenze = S.boss ? TUNE.playerMaxX : TUNE.pushX;
  let shift = 0;
  if(S.px>grenze){ if(!S.boss) shift = S.px-grenze; S.px = grenze; }
  S.px = Math.max(TUNE.playerMinX, S.px);

  /* --- Die Sperrstunde rueckt nach --- */
  if(!S.boss){
    const ramp = (S.dist/10/1000)*TUNE.lineRampPer1000m;
    const idle = mv>0 ? 0 : TUNE.lineIdlePush;
    S.lineX += (TUNE.lineSpeed+ramp+idle)*dt - shift;
    S.lineX = Math.max(-TUNE.lineMaxLag, Math.min(W, S.lineX));
    if(S.px < S.lineX) return crash(false, null, true);
  }

  /* --- Fortschritt --- kommt jetzt allein aus deiner Bewegung */
  S.dist += shift;
  bgT += shift;
  if(S.mode==='play')
    S.score += shift/10*TUNE.pointsPerMeter*(1+p*(TUNE.fxScoreMult-1));

  /* --- Welt bewegen --- */
  S.nextSpawn-=shift;
  if(!S.boss&&S.nextSpawn<=0) spawn();
  for(const o of S.things){
    o.x-=shift;
    if(o.foe) updateFoe(o,dt);
  }
  S.things=S.things.filter(o=>o.x>-44&&!o.gone);
  for(const s of S.shots){ s.x+=s.vx*dt; s.vy+=520*dt; s.y+=s.vy*dt; }
  S.shots=S.shots.filter(s=>s.x>-20&&s.y<H+20);

  /* --- Spieler-Box --- */
  const pw=S.ducking?7:5, ph=S.ducking?5:13;
  const px=S.px+(S.ducking?0:1), py=GROUND-ph+S.y;

  /* --- Faust trifft? --- */
  if(hitActive&&!S.hitDone){
    const fx=S.px+5, fy=GROUND-11+S.y, fw=TUNE.hitReach, fh=9;
    for(const o of S.things){
      if(!o.foe||o.dead) continue;
      if(fx<o.x+o.w&&fx+fw>o.x&&fy<o.y+o.h&&fy+fh>o.y){
        S.hitDone=true;
        /* Konter: du triffst waehrend er ausholt. Brocken sind gepanzert. */
        const konter = o.st==='wind' && !o.panzer
                     && o.t <= o.windSec*TUNE.konterFenster;
        if(konter) o.hp=0; else o.hp--;
        if(!o.panzer){ o.st='rec'; o.t=o.recSec; }   // Schlag wird unterbrochen
        S.freeze=TUNE.hitStopMs*(konter?1.6:1); S.shake=konter?6:4;
        o.x+=TUNE.hitKnockback*(o.hp>0?.6:1);
        SFX.klatsch();
        if(o.hp>0){
          o.stun=.42; shards(o.x+3,o.y+5,'#ffffff',7,70);
          say('AUA',o.x+3,o.y-6,P.white);
        } else {
          o.dead=true; o.gone=true;
          S.kos++; S.combo++; S.comboT=TUNE.comboWindowSec;
          S.score+=TUNE.pointsPerKO+S.combo*TUNE.comboStep+(konter?TUNE.konterBonus:0);
          shards(o.x+3,o.y+5,konter?P.gold:'#c8324a',konter?22:14,konter?150:110);
          say(konter?pick(SAY.konter):pick(SAY.ko),o.x+3,o.y-6,konter?P.neon:P.gold);
          if(konter){ S.flash=.28; S.flashCol='255,212,71'; SFX.win(); } else SFX.ko();
          /* Umfallender reisst den naechsten mit */
          for(const n of S.things){
            if(n===o||!n.foe||n.gone||n.fly) continue;
            if(n.x>o.x&&n.x<o.x+34){ n.hp--; n.stun=.5; n.st='rec'; n.t=n.recSec;
              n.x+=14; shards(n.x+3,n.y+5,'#ffffff',6,60);
              if(n.hp<=0){ n.gone=true; S.kos++; S.combo++; S.score+=TUNE.pointsPerKO;
                           say('UND DER AUCH',n.x,n.y-6,P.gold); }
              break; }
          }
        }
        break;
      }
    }
    if(!S.hitDone&&S.boss&&S.boss.state==='punish'){
      const b=S.boss, bw=32;
      if(fx+fw>b.x&&fx<b.x+bw){ if(bossTakeHit()) S.hitDone=true; }
    }
  }

  /* --- Kollisionen --- */
  const trifft=(bx,by,bw,bh)=> px<bx+bw&&px+pw>bx&&py<by+bh&&py+ph>by;
  for(const o of S.things){
    if(o.gone) continue;

    if(o.foe&&o.kind!=='taube'){
      /* Der Koerper blockt nur, verletzt nicht - sonst kaeme man nie in
         Schlagreichweite. Wehtun tut ausschliesslich der ausgefuehrte Schlag. */
      if(trifft(o.x,o.y,o.w,o.h)) S.px=Math.max(TUNE.playerMinX,o.x-pw-1);
      const hb=foeHitbox(o);
      if(hb&&trifft(hb.x,hb.y,hb.w,hb.h)&&hurt(o)) return;
      continue;
    }

    const h=o.hit||{ox:0,oy:0,w:o.w,h:o.h};
    const ox=o.x+h.ox, oy=o.y+h.oy;
    if(px<ox+h.w&&px+pw>ox&&py<oy+h.h&&py+ph>oy){
      if(o.kind==='shot'){
        o.gone=true; S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.shotPegel);
        S.combo++; S.comboT=3.4; S.score+=TUNE.pointsPerShot+S.combo*TUNE.comboStep;
        S.flash=.16; S.flashCol='255,255,255'; shards(o.x+2,o.y+2,P.gold,8,70);
        if(Math.random()<.35) say(pick(SAY.shot),o.x,o.y-8,P.gold);
        SFX.shot(S.combo);
      } else if(o.kind==='water'){
        o.gone=true; S.pegel=Math.max(0,S.pegel+TUNE.waterPegel);
        S.score+=TUNE.pointsPerWater; shards(o.x+2,o.y+2,P.neon2,8,70);
        if(Math.random()<.4) say(pick(SAY.water),o.x,o.y-8,P.neon2);
        SFX.water();
      } else if(hurt(o)) return;
    }
  }
  for(const s of S.shots){
    if(px<s.x+s.w&&px+pw>s.x&&py<s.y+s.h&&py+ph>s.y){ s.gone=true; if(hurt(s)) return; }
  }
  S.shots=S.shots.filter(s=>!s.gone);
  /* Sturmangriff des Bosses: trifft alles ausser einen geduckten Spieler */
  if(S.boss&&S.boss.state==='charge'){
    const bx=S.boss.x, by=GROUND-44, bw=32, bh=38;
    if(px<bx+bw&&px+pw>bx&&py<by+bh&&py+ph>by&&hurt({x:bx+14,y:GROUND-30})) return;
  }
  S.things=S.things.filter(o=>!o.gone);

  if(S.combo>0&&S.combo%5===0&&S.comboT>TUNE.comboWindowSec-.1)
    say(pick(SAY.combo),S.px+20,GROUND-40,P.neon);
  if(TUNE.blackoutAtMax&&S.pegel>=TUNE.pegelMax) return crash(true);
}

/* Treffer einstecken. Gibt true zurueck, wenn der Lauf damit vorbei ist. */
function hurt(obj=null){
  if(S.inv>0||S.mode!=='play') return false;
  S.hp--; S.combo=0; S.inv=TUNE.invulnMs/1000;
  S.px=Math.max(TUNE.playerMinX,S.px-TUNE.hurtKnockback);
  S.shake=6; S.freeze=90; S.flash=.42; S.flashCol='255,77,77';
  puff(S.px+4,GROUND-8,14,P.danger,80,50);
  if(S.hp<=0){ crash(false,obj); return true; }
  say(pick(SAY.aua),S.px+4,GROUND-30,P.danger);
  SFX.hurt();
  return false;
}

function crash(blackout=false,obj=null,line=false){
  if(S.mode==='attract'){ reset(); S.demo=true; return; }
  S.mode='over'; S.overT=0; S.shake=7; S.blackout=blackout; S.geschnappt=line;
  S.pendingScore=Math.floor(S.score);
  S.overTxt=pick(line?SAY.sperrstunde:blackout?SAY.blackout:SAY.over);
  S.flash=.5; S.flashCol=blackout?'255,61,139':line?'20,10,30':'255,77,77';
  S.freeze=110;
  puff(S.px+6,GROUND-9,24,blackout?P.neon:P.danger,110,70);
  if(obj) shards(obj.x+3,obj.y+4,P.dim,12,80);
  SFX.hurt();
}

/* ---- Initialen ---- */
const AZ='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ';
function toInitials(){
  const worst=scores.length>=5?scores[4].score:-1;
  if(S.pendingScore<=worst){ reset(); S.demo=true; return; }
  S.mode='initials'; S.initials=[0,0,0]; S.iSlot=0; beep(1000,.09);
}
function initialsKey(e){
  if(e.code==='ArrowUp'){ S.initials[S.iSlot]=(S.initials[S.iSlot]+1)%AZ.length; beep(700,.03); }
  if(e.code==='ArrowDown'){ S.initials[S.iSlot]=(S.initials[S.iSlot]-1+AZ.length)%AZ.length; beep(600,.03); }
  if(e.code==='ArrowRight'){ S.iSlot=Math.min(2,S.iSlot+1); beep(900,.03); }
  if(e.code==='ArrowLeft'){ S.iSlot=Math.max(0,S.iSlot-1); beep(900,.03); }
  if(e.code==='Enter'){ saveScore(S.initials.map(i=>AZ[i]).join('').trim()||'AAA',S.pendingScore);
    scores=loadScores(); beep(1400,.14); reset(); S.demo=true; }
}

   HINTERGRUND
   ========================================================================== */
const NEON_WORDS=['BAR','CLUB','SPAETI','DOENER','TAXI','24H','OPEN','KIOSK','LATE','ECK'];
let bgT=0, RAIN=[];
for(let i=0;i<70;i++) RAIN.push({x:Math.random()*W,y:Math.random()*H,v:180+Math.random()*160,l:3+Math.random()*4});

const loopX=(base,sp,span)=>{ const x=(base-bgT*sp)%span; return x<0?x+span:x; };
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function drawSky(et){
  ctx.drawImage(verlauf('sky'+S.etappe,W+16,GROUND+16,x=>{
    const g=x.createLinearGradient(0,8,0,GROUND+8);
    g.addColorStop(0,et.sky[0]); g.addColorStop(1,et.sky[1]);
    x.fillStyle=g; x.fillRect(0,0,W+16,GROUND+16);
  }),-8,-8);
  const mx=262,my=24;
  ctx.fillStyle='#f0e6c0'; ctx.beginPath(); ctx.arc(mx,my,9,0,7); ctx.fill();
  ctx.fillStyle=et.sky[0]; ctx.beginPath(); ctx.arc(mx-4,my-3,8,0,7); ctx.fill();
  for(let i=0;i<44;i++){
    const x=loopX(i*97,.03,W+30);
    ctx.fillStyle=i%9===0?et.neon:(i%3?'#ffffff26':'#ffffff44');
    ctx.fillRect(Math.floor(x)-15,(i*37)%64+4,1,1);
  }
}
function drawSkyline(et){
  if(!TUNE.parallax) return;
  ctx.fillStyle=shade(et.hue,-.72);
  for(let i=0;i<20;i++){
    const bw=26+(i*17)%30, bh=40+(i*31)%48;
    ctx.fillRect(Math.floor(loopX(i*58,.10,W+120))-60,GROUND-26-bh,bw,bh);
  }
  for(let i=0;i<16;i++){
    const bw=20+(i*13)%24, bh=24+(i*29)%44;
    const x=Math.floor(loopX(i*62,.22,W+130))-70, top=GROUND-22-bh;
    ctx.fillStyle=shade(et.hue,-.52); ctx.fillRect(x,top,bw,bh);
    ctx.fillStyle=shade(et.hue,-.28); ctx.fillRect(x,top,bw,1);
    ctx.fillStyle='#ffe08a3a';
    for(let wy=3;wy<bh-4;wy+=6) for(let wx=2;wx<bw-3;wx+=5)
      if(((i*7+wx*3+wy)*11)%5<2) ctx.fillRect(x+wx,top+wy,2,3);
    if(TUNE.neonSigns&&i%3===0&&bw>26){
      const word=NEON_WORDS[(i*3)%NEON_WORDS.length];
      const flick=((S.t*7+i*2.7)%6)>.25?1:.25;
      ctx.globalAlpha=flick; textGlow(word,x+3,top+5,i%2?et.neon:P.gold,1); ctx.globalAlpha=1;
    }
  }
}
function drawStreet(et){

      x.fillStyle=g; x.fillRect(0,0,52,60);
    });
    for(let i=0;i<5;i++){
      const x=Math.floor(loopX(i*86,.62,W+90))-20;

  ctx.fillStyle=shade(et.hue,-.55); ctx.fillRect(-8,GROUND+1,W+16,2);
  ctx.fillStyle=shade(et.hue,-.30); ctx.fillRect(-8,GROUND+4,W+16,1);
  ctx.fillStyle='#0d0a16';          ctx.fillRect(-8,GROUND+5,W+16,1);
  ctx.globalAlpha=.10; ctx.fillStyle=et.neon;
  for(let i=0;i<7;i++){ const x=Math.floor(loopX(i*61,.22,W+80))-40;
    ctx.fillRect(x,GROUND+3,10,1); ctx.fillRect(x+2,GROUND+7,6,1); }
  ctx.globalAlpha=1;
  for(let i=0;i<22;i++){
    ctx.fillStyle=P.roadLine;
    ctx.fillRect(Math.floor(loopX(i*26,1,W+40))-14,GROUND+12,13,1);
    ctx.fillStyle=shade(P.roadLine,.28);
    ctx.fillRect(Math.floor(loopX(i*40,1.5,W+60))-20,GROUND+21,10,2);
  }
  for(let i=0;i<4;i++){

    ctx.fillStyle='#0b0813'; ctx.fillRect(x,GROUND+15,9,4);
    ctx.fillStyle='#1c1730'; for(let k=0;k<3;k++) ctx.fillRect(x+1,GROUND+16+k,7,1);
    ctx.globalAlpha=.22; ctx.fillStyle=et.neon;
    ctx.fillRect(x+22,GROUND+8,16,1); ctx.fillRect(x+26,GROUND+9,9,1);
    ctx.globalAlpha=1;
  }
}
/* ---- Die Sperrstunde: eine kriechende Wand mit greifenden Haenden ---- */
function drawSperrstunde(et){
  if(S.mode!=='play'&&!(S.mode==='attract'&&S.demo)&&S.mode!=='over') return;
  const L=Math.round(S.lineX);
  if(L<-8) return;

  /* Schatten, den die Wand VOR sich her auf die Strasse wirft.
     Ohne den sieht man sie auf dunklem Hintergrund praktisch nicht. */
  ctx.drawImage(verlauf('sperrSchatten',52,H+16,x=>{
    const g=x.createLinearGradient(0,0,52,0);
    g.addColorStop(0,'rgba(0,0,0,.85)'); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.fillRect(0,0,52,H+16);
  }),L,-8);

  /* Die Wand: komplett schwarz, verschluckt alles dahinter */
  ctx.fillStyle='#000'; ctx.fillRect(-20,-8,L+20,H+16);

  /* Kriechendes Rauschen darin, damit es lebt */
  ctx.fillStyle=et.neon; ctx.globalAlpha=.13;
  for(let i=0;i<26;i++){
    const y=((i*47+S.t*38)%(H+14))-7;
    const w=2+((i*13)%9), x=L-4-((i*17)%Math.max(6,L+16));
    ctx.fillRect(x,Math.floor(y),w,1);
  }
  ctx.globalAlpha=1;

  /* Leuchtende Kante mit Halo */
  ctx.drawImage(verlauf('sperrHalo',12,H+16,x=>{
    const g=x.createLinearGradient(0,0,12,0);
    g.addColorStop(0,'rgba(255,61,139,0)'); g.addColorStop(1,'rgba(255,61,139,.5)');
    x.fillStyle=g; x.fillRect(0,0,12,H+16);
  }),L-7,-8);
  for(let y=-6;y<H+6;y+=3){
    const w=2+Math.round(Math.abs(Math.sin(y*.7+S.t*5))*2);
    ctx.fillStyle=P.white; ctx.globalAlpha=.9; ctx.fillRect(L-1,y,2,3);
    ctx.fillStyle=et.neon; ctx.globalAlpha=.85; ctx.fillRect(L-1-w,y,w,3);
  }
  ctx.globalAlpha=1;

  /* Greifende Haende. Schwarz allein verschwindet im eigenen Schatten,
     deshalb bekommen sie eine leuchtende Oberkante. */
  for(let i=0;i<5;i++){
    const hy=GROUND-5-i*9, reach=Math.round(4+Math.sin(S.t*3.4+i*1.7)*6);
    if(reach<=0) continue;
    ctx.fillStyle='#000';
    ctx.fillRect(L,hy,reach+2,3); ctx.fillRect(L+reach,hy-3,2,7);
    ctx.fillStyle=et.neon; ctx.globalAlpha=.75;
    ctx.fillRect(L,hy-1,reach+2,1);          // Oberkante
    ctx.fillRect(L+reach,hy-4,2,1);          // Fingerspitze
    ctx.globalAlpha=.35;
    ctx.fillRect(L+reach+2,hy,1,3);
    ctx.globalAlpha=1;
  }

  /* Naeher dran = mehr Druck: Rand dunkelt ein und pulsiert */
  const abstand=S.px-S.lineX;
  if(abstand<TUNE.lineWarnAbstand){
    const t=1-Math.max(0,abstand)/TUNE.lineWarnAbstand;
    const puls=(.5+.5*Math.sin(S.t*10))*t;
    ctx.globalAlpha=t;
    ctx.drawImage(verlauf('sperrWarn',W+16,H+16,x=>{
      const g=x.createLinearGradient(0,0,W*.75,0);
      g.addColorStop(0,'rgba(255,61,139,.28)'); g.addColorStop(1,'rgba(255,61,139,0)');
      x.fillStyle=g; x.fillRect(0,0,W+16,H+16);
    }),-8,-8);
    ctx.globalAlpha=1;
    ctx.globalAlpha=puls*.5; ctx.fillStyle=P.neon;
    ctx.fillRect(-8,-8,W+16,1); ctx.fillRect(-8,H-1,W+16,1); ctx.globalAlpha=1;
  }
}

function drawRain(et,dt){
  if(!TUNE.rain||!et.rain) return;
  ctx.strokeStyle=`rgba(150,200,255,${(.16*et.rain).toFixed(2)})`; ctx.lineWidth=1;
  ctx.beginPath();
  for(const r of RAIN){
    r.y+=r.v*dt; r.x-=r.v*.22*dt;
    if(r.y>H){ r.y=-4; r.x=Math.random()*(W+40); }
    if(r.x<-6) r.x=W+6;
    ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-1,r.y+r.l);
  }
  ctx.stroke();
}

/* ==========================================================================
   DRAW
   ========================================================================== */
function draw(dt){
  const et=ETAPPEN[S.etappe], p=S.pegel/TUNE.pegelMax;
  ctx.save();
  const wob=Math.sin(S.t*9)*TUNE.fxWobblePx*p+(Math.random()-.5)*S.shake;
  const wob2=Math.cos(S.t*6.3)*TUNE.fxWobblePx*.6*p+(Math.random()-.5)*S.shake;
  ctx.translate(Math.round(wob),Math.round(wob2));

  drawSky(et); drawSkyline(et);

  /* Boss-Arena: Hintergrund abdunkeln, Spotlight */
  if(S.boss){
    ctx.fillStyle='rgba(0,0,0,.42)'; ctx.fillRect(-8,-8,W+16,GROUND+10);
    ctx.drawImage(verlauf('bossLicht',152,110,x=>{
      const g=x.createRadialGradient(76,70,4,76,70,72);
      g.addColorStop(0,'rgba(255,80,120,.16)'); g.addColorStop(1,'rgba(255,80,120,0)');
      x.fillStyle=g; x.fillRect(0,0,152,110);
    }),Math.round(S.boss.x)-60,GROUND-100);
  }
  drawStreet(et);

  /* Boss */
  if(S.boss){
    const b=S.boss, rows=SPR[BOSS_SPR[b.name]]||SPR.bossTuer;
    const bob=Math.round(Math.sin(b.t*4)*2);
    const by=GROUND-rows.length*2+bob;
    let tint=null, alpha=1;
    if(b.state==='telegraph'&&Math.floor(b.t*22)%2===0) tint='#ffffff';
    if(b.hurtT>0&&Math.floor(b.t*30)%2===0) tint=P.danger;
    if(b.state==='dead') alpha=Math.max(0,1-b.dead/1.4);
    outline(rows,Math.round(b.x),by,2,.6);
    sprite(rows,Math.round(b.x),by,2,tint,alpha);
    /* Schwachstelle nur im Konterfenster - klare Ansage wann es zaehlt */
    if(b.state==='punish'&&b.iFrames<=0){
      const bl=Math.floor(S.t*9)%2===0;
      ctx.fillStyle=bl?P.gold:P.white; ctx.fillRect(Math.round(b.x)+12,by-7,8,3);
      if(bl) textShadow('SCHLAG',Math.round(b.x)-2,by-16,P.gold);
    }
  }

  /* Objekte */
  for(const o of S.things){
    const x=Math.round(o.x), y=Math.round(o.y);
    if(o.kind==='shot'||o.kind==='water'){
      const gold=o.kind==='shot';
      const fy=y+Math.round(Math.sin(S.t*6+o.x*.05)*1.5), cx=x+2, cy=fy+2;
      ctx.drawImage(verlauf(gold?'glowGold':'glowBlau',22,22,gx=>{
        const g=gx.createRadialGradient(11,11,0,11,11,11);
        g.addColorStop(0,gold?'rgba(255,212,71,.55)':'rgba(49,230,255,.5)');
        g.addColorStop(1,'rgba(0,0,0,0)');
        gx.fillStyle=g; gx.fillRect(0,0,22,22);
      }),cx-11,cy-11);
      sprite(gold?SPR.shot:SPR.water,x,fy);
    } else if(o.foe&&o.kind!=='taube'){
      const big=o.kind==='brocken', flink=o.kind==='flitzer';
      let rows;
      if(o.stun>0)            rows = big?SPR.brockenHit:SPR.gegnerHit;
      else if(o.st==='wind')  rows = flink?SPR.flitzerWind:big?SPR.brocken:SPR.gegnerWind;
      else if(o.st==='swing') rows = flink?SPR.flitzerWind:big?SPR.brocken:SPR.gegnerSwing;
      else rows = big?SPR.brocken:flink?SPR.flitzer:o.ranged?SPR.werfer:SPR.gegner;
      outline(rows,x,y);
      /* Ausholen blinkt weiss - das ist die Einladung zum Konter */
      sprite(rows,x,y,1, o.st==='wind'&&Math.floor(S.t*16)%2===0 ? '#ffffff' : null);
      if(big&&o.hp>1){ ctx.fillStyle=P.danger; ctx.fillRect(x+2,y-3,5,1); }
      /* Warnzeichen ueberm Kopf, mit Farbe fuer die richtige Abwehr */
      if(o.st==='wind'){
        const col=o.zone==='hoch'?P.neon2:o.zone==='tief'?P.gold:P.danger;
        if(Math.floor(S.t*10)%2===0) textShadow('!',x+2,y-9,col);
      }
      /* Der ausgefuehrte Schlag wird sichtbar gezeichnet */
      const hb=foeHitbox(o);
      if(hb){ ctx.globalAlpha=.5; ctx.fillStyle=P.danger;
              ctx.fillRect(Math.round(hb.x),Math.round(hb.y+hb.h/2),hb.w,1);
              ctx.globalAlpha=1; }
    } else if(o.kind==='taube'){
      const fy=y+Math.round(Math.sin(S.t*14+o.x*.1)*2);
      outline(SPR.taube,x,fy); sprite(SPR.taube,x,fy);
    } else { outline(SPR[o.kind],x,y); sprite(SPR[o.kind],x,y); }
  }
  /* Bossgeschosse */
  for(const s of S.shots){
    const x=Math.round(s.x),y=Math.round(s.y);
    ctx.globalAlpha=.35; ctx.fillStyle=P.gold; ctx.fillRect(x-1,y-1,7,7); ctx.globalAlpha=1;
    sprite(SPR.flasche,x,y);
  }

  /* Spieler */
  const hitAge=S.t-S.hitT;
  const punching=hitAge>=0&&hitAge<=(TUNE.hitWindupMs+TUNE.hitActiveMs+60)/1000;
  /* Blinken: beim Sterben, und solange man nach einem Treffer unverwundbar ist */
  const blink=(S.mode==='over'&&Math.floor(S.overT*12)%2===0)
            ||(S.inv>0&&Math.floor(S.t*18)%2===0);
  if(!blink&&(S.mode!=='attract'||S.demo)){
    const py=GROUND-13+S.y;
    let spr;
    if(punching)        spr=S.onGround?SPR.punch:SPR.punchAir;
    else if(S.ducking)  spr=SPR.duck;
    else if(!S.onGround)spr=S.vy<0?SPR.jump:SPR.fall;
    else                spr=SPR.run[Math.floor(S.dist/7)%4];
    const dx=Math.round(S.px);
    ctx.globalAlpha=.3; ctx.fillStyle='#000';
    const sw=Math.max(3,8-Math.abs(S.y)/6);
    ctx.fillRect(Math.round(dx+5-sw/2),GROUND,Math.round(sw),1);
    ctx.globalAlpha=1;
    outline(spr,dx,py,1,.55);
    sprite(spr,dx,py);
    /* Schlag-Wischer */
    if(hitAge>=TUNE.hitWindupMs/1000&&hitAge<=(TUNE.hitWindupMs+TUNE.hitActiveMs)/1000){
      ctx.globalAlpha=.55; ctx.fillStyle=P.white;
      ctx.fillRect(dx+9,GROUND-11+S.y,TUNE.hitReach,1);
      ctx.fillRect(dx+11,GROUND-13+S.y,TUNE.hitReach-4,1);
      ctx.globalAlpha=1;
    }
  }

  drawFx();
  drawSperrstunde(et);
  drawRain(et,dt);

  /* Tunnelblick einmal in voller Staerke gebacken, Intensitaet ueber Alpha */
  if(p>.04&&TUNE.fxTunnelVision>0){
    ctx.globalAlpha=Math.min(1,p*TUNE.fxTunnelVision);
    ctx.drawImage(verlauf('tunnel',W+16,H+16,x=>{
      const g=x.createRadialGradient(168,98,36,168,98,196);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)');
      x.fillStyle=g; x.fillRect(0,0,W+16,H+16);
    }),-8,-8);
    ctx.globalAlpha=1;
  }
  if(p>.5&&TUNE.fxColorShift>0){
    ctx.globalAlpha=(p-.5)*.22*TUNE.fxColorShift;
    ctx.fillStyle=et.neon; ctx.fillRect(-8,-8,W+16,H+16); ctx.globalAlpha=1;
  }
  if(S.flash>0){ ctx.fillStyle=`rgba(${S.flashCol},${(S.flash*.9).toFixed(3)})`; ctx.fillRect(-8,-8,W+16,H+16); }
  ctx.restore();

  drawHUD(et,p); drawScreens(et);
}

function drawHUD(et,p){
  if(S.mode==='attract') return;
  text('SCORE',6,6,P.dim);
  text(String(Math.floor(S.score)).padStart(6,'0'),6,14,P.white);
  /* Herzen - blinken wenn nur noch eins uebrig ist */
  for(let i=0;i<TUNE.leben;i++){
    const voll=i<S.hp, x=6+i*7, y=22;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    const kritisch=S.hp===1&&Math.floor(S.t*6)%2===0;
    ctx.fillStyle=kritisch?P.white:P.danger;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  if(S.kos>0) text('KO '+S.kos,6+TUNE.leben*7+4,22,P.dark);
  const m=Math.floor(S.dist/10)+'M';
  text(m,W-6-textW(m),6,P.dim);
  text(et.name,W-6-textW(et.name),14,et.neon);

  const bw=88,bx=(W-bw)/2,by=8;
  ctx.fillStyle='#000000aa'; ctx.fillRect(bx-2,by-2,bw+4,9);
  ctx.fillStyle='#2a2440';   ctx.fillRect(bx,by,bw,5);
  ctx.fillStyle=p<.5?P.neon2:p<.8?P.gold:P.danger; ctx.fillRect(bx,by,Math.round(bw*p),5);
  for(let i=1;i<4;i++){ ctx.fillStyle='#00000066'; ctx.fillRect(bx+Math.round(bw*i/4),by,1,5); }
  if(p>.8&&Math.floor(S.t*8)%2===0){ ctx.strokeStyle=P.danger; ctx.strokeRect(bx-1.5,by-1.5,bw+3,8); }
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+8,p>.8?P.danger:P.dim);
  if(p>0) text('X'+(1+p*(TUNE.fxScoreMult-1)).toFixed(1),bx+bw+6,by,P.gold);

  if(S.combo>1){
    const c='COMBO X'+S.combo;
    ctx.globalAlpha=Math.min(1,S.comboT);
    textGlow(c,(W-textW(c))/2,26,P.gold,1); ctx.globalAlpha=1;
  }

  /* Warnung, wenn die Sperrstunde aufholt.
     Bewusst oben: unten wuerde sie genau die Gegner verdecken. */
  const abstand=S.px-S.lineX;
  if(!S.boss&&abstand<TUNE.lineWarnAbstand&&Math.floor(S.t*5)%2===0){
    const w='SPERRSTUNDE  -  LOS WEITER';
    textGlow(w,(W-textW(w))/2,38,P.neon,1);
  }

  /* Boss-Lebensbalken */
  if(S.boss&&S.boss.state!=='entry'){
    const b=S.boss, w=140, x=(W-w)/2, y=H-14;
    ctx.fillStyle='#000000cc'; ctx.fillRect(x-2,y-2,w+4,9);
    ctx.fillStyle='#2a1420';   ctx.fillRect(x,y,w,5);
    ctx.fillStyle=P.danger;    ctx.fillRect(x,y,Math.round(w*Math.max(0,b.hp/b.maxHp)),5);
    for(let i=1;i<b.maxHp;i++){ ctx.fillStyle='#000000aa'; ctx.fillRect(x+Math.round(w*i/b.maxHp),y,1,5); }
    text(b.name,x+(w-textW(b.name))/2,y-8,P.white);
    text('PHASE '+b.phase,x+w+5,y,P.dark);
    if(b.state==='telegraph'&&Math.floor(S.t*14)%2===0) text('!',x-9,y-1,P.danger);
  }

  if(S.banner>0){
    ctx.globalAlpha=Math.min(1,S.banner*1.6);
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,62,W,34);
    ctx.fillStyle=et.neon; ctx.fillRect(0,62,W,1); ctx.fillRect(0,95,W,1);
    textC(S.bannerTxt,68,P.white,2); textC(S.bannerSub,86,P.gold,1);
    ctx.globalAlpha=1;
  }
}

function drawScreens(et){
  if(S.mode==='attract'){
    ctx.fillStyle='#00000094'; ctx.fillRect(0,0,W,H);
    textGlow('NACHTSCHICHT',(W-textW('NACHTSCHICHT',3))/2,20,P.neon,3);
    textC('EIN ABEND MIT DEN JUNGS',42,P.dim,1);
    text('HIGHSCORES',18,64,P.gold);
    scores.slice(0,5).forEach((s,i)=>{ const y=76+i*9;
      text((i+1)+'.',18,y,P.dark); text(s.name.padEnd(3,' '),30,y,P.white);
      const sc=String(s.score).padStart(6,'0'); text(sc,102-textW(sc),y,P.neon2); });
    text('SO GEHTS',170,60,P.gold);
    text('A D    LAUFEN',         170,72,P.white);
    text('LEER   SPRINGEN',       170,81,P.dim);
    text('RUNTER DUCKEN',         170,90,P.dim);
    text('E      SCHLAGEN',       170,99,P.white);
    text('DIE NACHT HOLT DICH EIN',170,112,P.neon);
    text('BLEIB NICHT STEHEN',    170,121,P.neon);
    text('BLAU DUCKEN',           170,134,P.neon2);
    text('GELB SPRINGEN',         170,143,P.gold);
    text('ROT  WEG DA',           170,152,P.danger);
    if(Math.floor(S.t*1.6)%2===0) textC('DRUECK LEERTASTE',146,P.white,2);
    textC('V0.3  PROTOTYP',168,P.dark,1);
  }
  if(S.mode==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textC('PAUSE',76,P.white,3); textC('P ODER LEERTASTE',100,P.dim,1);
  }
  if(S.mode==='over'){
    ctx.fillStyle=`rgba(0,0,0,${Math.min(.78,S.overT*1.5).toFixed(2)})`; ctx.fillRect(0,0,W,H);
    const t=S.blackout?'BLACKOUT':'FEIERABEND';
    textGlow(t,(W-textW(t,3))/2,38,S.blackout?P.neon:P.danger,3);
    textC(S.overTxt,60,P.white,1);
    textC('SCORE '+S.pendingScore,74,P.white,2);
    textC(Math.floor(S.dist/10)+' METER   '+S.kos+' UMGEHAUEN',94,P.dim,1);
    textC(ETAPPEN[S.etappe].name,104,ETAPPEN[S.etappe].neon,1);
    if(S.overT>.5&&Math.floor(S.t*2)%2===0) textC('LEERTASTE',132,P.gold,1);
  }
  if(S.mode==='initials'){
    ctx.fillStyle='#000000d0'; ctx.fillRect(0,0,W,H);
    textGlow('NEUER HIGHSCORE',(W-textW('NEUER HIGHSCORE',2))/2,30,P.gold,2);
    textC(String(S.pendingScore),50,P.neon2,2); textC('WER WARS',74,P.dim,1);
    for(let i=0;i<3;i++){ const x=130+i*24, sel=i===S.iSlot;
      text(AZ[S.initials[i]],x,90,sel?P.white:P.dark,3);
      if(sel&&Math.floor(S.t*3)%2===0){ ctx.fillStyle=P.neon; ctx.fillRect(x,108,9,2); } }
    textC('PFEILE WAEHLEN   ENTER FERTIG',138,P.dim,1);
  }
  if(muted) text('MUTE',W-6-textW('MUTE'),H-10,P.dark);
}

/* ==========================================================================
   LOOP
   ========================================================================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
