<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>NACHTSCHICHT</title>
<meta name="description" content="Level 1 - Die Schule. Find den Schluessel, komm raus.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%; background:#04030a; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:monospace; touch-action:none; -webkit-tap-highlight-color:transparent;
    background-image:radial-gradient(ellipse at 50% 40%,#140f26 0%,#04030a 70%);
  }
  #cab { position:relative; padding:10px 12px 14px; border-radius:10px;
         background:linear-gradient(#1b1730,#0e0b1a 60%,#17132a);
         box-shadow:0 0 0 2px #2a2246,0 0 60px rgba(120,60,220,.2),0 30px 60px rgba(0,0,0,.8); }
  #marquee { text-align:center; font:700 11px/1 monospace; letter-spacing:5px; color:#ff3d8b;
             text-shadow:0 0 8px #ff3d8b99,0 0 18px #ff3d8b55; padding:2px 0 8px; user-select:none; }
  #base { display:flex; justify-content:space-between; font:700 8px/1 monospace; letter-spacing:2px;
          color:#4a4363; padding-top:8px; user-select:none; }
  #screen { position:relative; line-height:0; border-radius:6px; overflow:hidden;
            box-shadow:inset 0 0 0 2px #000,0 0 24px rgba(80,200,255,.08); }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#000; }
  #crt { position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(105deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 38%),
      radial-gradient(ellipse at center,rgba(0,0,0,0) 54%,rgba(0,0,0,.6) 100%),
      repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,rgba(0,0,0,0) 1px 3px); }
  #crt::after { content:''; position:absolute; inset:0;
    box-shadow:inset 0 0 40px rgba(0,0,0,.8),inset 0 0 90px rgba(0,0,0,.5); }

  /* ---- Touch: Steuerkreuz links, runde Tasten rechts ---- */
  #touch { position:absolute; inset:0; display:none; }
  #touch .btn { position:absolute; border-radius:50%;
    background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.13);
    color:#ffffff55; font:700 11px/1 monospace; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center; user-select:none; }
  #touch .btn:active { background:rgba(255,61,139,.3); border-color:#ff3d8b; color:#fff; }
  #tleft  { left:3%;  bottom:8%;  width:17%; aspect-ratio:1; }
  #tright { left:22%; bottom:8%;  width:17%; aspect-ratio:1; }
  #thit   { right:3%; bottom:8%;  width:17%; aspect-ratio:1; }
  #tjump  { right:22%;bottom:8%;  width:17%; aspect-ratio:1; }
  #tup    { right:12%;bottom:34%; width:15%; aspect-ratio:1; }
  #tsneak { left:12%; bottom:34%; width:15%; aspect-ratio:1; font-size:8px; }
  #fs { position:absolute; top:6px; right:8px; z-index:5;
    background:rgba(20,16,34,.75); color:#8d86a8; border:1px solid #2a2246;
    border-radius:5px; font:700 9px monospace; letter-spacing:1px; padding:4px 7px; cursor:pointer; }
  #fs:hover { color:#ffd447; border-color:#ffd447; }
  html.touch #touch { display:block; }
  html.touch #marquee, html.touch #base, html.touch #fs { display:none; }
  html.touch #cab { padding:0; border-radius:0; box-shadow:none; background:#000; }
  #cab:fullscreen { padding:0; border-radius:0; box-shadow:none; background:#000;
    width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #cab:fullscreen #marquee, #cab:fullscreen #base { display:none; }
  #cab:fullscreen #screen { border-radius:0; }
  #rotate { position:fixed; inset:0; z-index:99; display:none; background:#06050c; color:#f4f0ff;
    flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; }
  #rotate .ph { width:52px; height:88px; border:3px solid #ff3d8b; border-radius:8px;
    animation:tip 1.8s ease-in-out infinite; }
  #rotate b { font:700 13px monospace; letter-spacing:3px; color:#ff3d8b; }
  #rotate span { font:400 10px monospace; letter-spacing:1px; color:#8d86a8; }
  @keyframes tip { 0%,35%{transform:rotate(0)} 65%,100%{transform:rotate(-90deg)} }
  @media (orientation:portrait){ html.touch #rotate{display:flex;} }
</style>
</head>
<body>
<div id="cab">
  <div id="marquee">N A C H T S C H I C H T</div>
  <div id="screen">
    <canvas id="c" width="320" height="180"></canvas>
    <div id="crt"></div>
    <div id="touch">
      <div class="btn" id="tleft">&#9664;</div><div class="btn" id="tright">&#9654;</div>
      <div class="btn" id="tup">&#9650;</div>
      <div class="btn" id="tjump">SPR</div><div class="btn" id="thit">E</div>
      <div class="btn" id="tsneak">LEISE</div>

  <button id="fs">VOLLBILD</button>
  <div id="base"><span>LEVEL 1 - DIE SCHULE</span><span>M TON &nbsp; P PAUSE &nbsp; F VOLLBILD</span></div>
</div>
<div id="rotate"><div class="ph"></div><b>HANDY DREHEN</b><span>NACHTSCHICHT LAEUFT IM QUERFORMAT</span></div>

<script>
/* ============================================================================
   NACHTSCHICHT - LEVEL 1: DIE SCHULE
   Kein Endlos-Runner mehr. Ein gebautes Level mit Etagen, Raeumen und Zielen.
   Der alte Modus liegt unveraendert in runner.html.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG - mit Beschleunigung statt an/aus */
  gehTempo:       104,   // Hoechstgeschwindigkeit
  beschleunigung: 900,   // wie schnell du auf Tempo kommst
  bremsung:      1250,   // wie schnell du stehst, wenn du loslaesst
  luftKontrolle:   0.55, // wie gut du in der Luft lenkst
  gravitation:    920,
  sprungKraft:   -252,
  kurzsprung:      0.45, // Taste loslassen macht den Sprung kleiner
  coyoteMs:        95,   // Gnadenfrist nach Kantenabgang
  puffermMs:      130,   // zu frueh gedrueckt zaehlt trotzdem

  /* (2) KAMERA */
  kameraTraegheit: 6.5,  // hoeher = folgt schneller
  blickVoraus:    26,    // Kamera schaut in Laufrichtung voraus

  /* (2b) SCHLEICHEN - langsam, dafuer sehen sie dich spaeter */
  schleichTempo:    0.42,  // Anteil vom normalen Gehtempo
  schleichSicht:    0.5,   // Anteil der Sichtweite eines Lehrers

  /* (2c) HINWEISE - Zettel, die die Suche eingrenzen */
  zettelAnzahl:     2,     // erster nennt die Etage, zweiter den Raum

  /* (2e) DEIN HANDY - Licht, Story und Risiko in einem Geraet */
  akkuStart:      100,
  akkuProSek:       3.4,   // wie schnell die Taschenlampe den Akku frisst
  lampeRadius:     58,     // wie weit du im Dunkeln siehst
  lampeSichtBonus:  1.7,   // so viel weiter sehen Lehrer dich mit Licht
  vibrationVerdacht:0.6,   // wie viel Verdacht eine Vibration ausloest
  vibrationWeite:  74,

  /* (2f) ABLENKEN - was werfen, damit sie woanders hinschauen */
  wurfWeite:       96,     // wie weit der Gegenstand fliegt
  wurfBogen:      150,     // wie hoch er dabei geht
  wurfSchwere:    760,     // wie schnell er wieder runterkommt
  wurfAbkuehlung:   6,
  laermWeite:     130,     // so weit hoeren Lehrer ein Geraeusch
  suchTempo:       40,     // Tempo, wenn sie einem Geraeusch nachgehen

  /* (2g) DIE DUNKLE ETAGE */
  dunkleEtage:      2,     // im zweiten Stock sind die Roehren kaputt
  dunkelRadius:    34,     // was du dort ohne Licht siehst

  /* (2h) DIE UHR - um halb sechs schliesst der Hausmeister endgueltig ab */
  startMinute:  16*60+40,
  endMinute:    17*60+30,
  levelSekunden:  240,     // Echtzeit bis dahin

  /* (2i) DAS FENSTER - der zweite Weg raus, ganz ohne Schluessel.
     Er kostet keinen Schluessel, dafuer Zeit an einem Ort, an dem
     jedes Knacken den halben Flur anlockt. */
  fensterDauer:     7,     // Sekunden Arbeit am Riegel
  fensterZerfall: 0.5,     // so schnell verfaellt die Arbeit, wenn du weggehst
  fensterLaerm:   1.5,     // Sekunden zwischen zwei Knack-Geraeuschen
  fensterReichweite:13,    // wie nah du am Fenster stehen musst

  /* (2d) DER DIREKTOR - langsam, sieht weit, gibt nicht auf */
  chefTempo:       19,
  chefJagdTempo:   54,
  chefSicht:      116,
  chefJagdDauer:    6.5,
  chefEtagenWechsel:16,    // Sekunden, bis er die Etage wechselt

  /* (3) LEHRER */
  lehrerTempo:     26,
  jagdTempo:       62,
  sichtWeite:      82,
  sichtHoehe:      22,
  verdachtProSek:   1.9, // wie schnell der Verdachtsbalken fuellt
  verdachtAbbau:    0.9,
  jagdDauer:        3.2, // wie lange er nach Sichtverlust weitersucht
  fangDistanz:       8,

  /* (3b) PATROUILLE - Pausen und Umschauen. Wer stumpf hin und her laeuft,
     ist nach dreissig Sekunden auswendig gelernt und danach kein Gegner mehr. */
  pausenChance:    0.2,  // Wahrscheinlichkeit pro Sekunde, stehenzubleiben
  pauseKurz:       1.0,  // kuerzeste Pause
  pauseLang:       2.6,  // laengste Pause
  umschauZeit:    0.85,  // Sekunden, bis er im Stehen den Kopf dreht
  wendePause:      0.8,  // Pause am Ende der Strecke, bevor er umdreht
  nahSicht:         14,  // so nah darf man an einen Stehenden nicht heran

  /* (4) SPIELER */
  leben:            3,
  unverwundbarMs:1400,

  /* (5) SUCHEN UND VERSTECKEN */
  suchDauer:       0.75, // wie lange eine Durchsuchung braucht
  spindAbkuehlung: 10,   // Sekunden, bis du dich wieder verstecken darfst
  spindReichweite: 11,   // wie nah du am Spind stehen musst

  /* (6) PUNKTE - schneller raus zahlt sich aus */
  punkteBasis:    500,   // fuers Rauskommen ueberhaupt
  punkteProSek:     5,   // fuer jede Sekunde, die du frueher draussen bist
  punkteProHerz:  250,   // fuer jedes Herz, das noch steht
  punkteProFund:  150,   // fuer jeden Zettel und fuer das Werkzeug
  punkteTuer:     600,   // vorne raus, am Direktor vorbei
  punkteFenster:  150,   // durchs Fenster - schneller, aber weniger wert

  /* (7) OPTIK */
  flackern:      true,
  staub:         true,
};

/* ---- Palette ---- */
const P = {
  ink:'#07060d', wand:'#1d2033', wandHell:'#2a2e46', boden:'#141726', bodenKante:'#3a3f5c',
  weiss:'#f2f0ff', dim:'#8d86a8', dunkel:'#484263',
  neon:'#ff3d8b', neon2:'#42d9ff', gold:'#ffd447', rot:'#ff4d4d', gruen:'#48e08a',
  licht:'#cfe3ff', tuer:'#5a4632', tuerHell:'#7a6244',
};

/* ==========================================================================
   3x5 BITMAP-FONT
   ========================================================================== */
const F = {
 A:'010,101,111,101,101', B:'110,101,110,101,110', C:'011,100,100,100,011',
 D:'110,101,101,101,110', E:'111,100,110,100,111', F:'111,100,110,100,100',
 G:'011,100,101,101,011', H:'101,101,111,101,101', I:'111,010,010,010,111',
 J:'001,001,001,101,010', K:'101,110,100,110,101', L:'100,100,100,100,111',
 M:'101,111,111,101,101', N:'101,111,101,101,101', O:'010,101,101,101,010',
 P:'110,101,110,100,100', Q:'010,101,101,110,011', R:'110,101,110,101,101',
 S:'011,100,010,001,110', T:'111,010,010,010,010', U:'101,101,101,101,111',
 V:'101,101,101,101,010', W:'101,101,111,111,101', X:'101,101,010,101,101',
 Y:'101,101,010,010,010', Z:'111,001,010,100,111',
 0:'111,101,101,101,111', 1:'010,110,010,010,111', 2:'111,001,111,100,111',
 3:'111,001,111,001,111', 4:'101,101,111,001,001', 5:'111,100,111,001,111',
 6:'111,100,111,101,111', 7:'111,001,001,001,001', 8:'111,101,111,101,111',
 9:'111,101,111,001,111',
 ' ':'000,000,000,000,000', '.':'000,000,000,000,010', ':':'000,010,000,010,000',
 '-':'000,000,111,000,000', '!':'010,010,010,000,010', '?':'110,001,010,000,010',
 '/':'001,001,010,100,100', '+':'000,010,111,010,000', ',':'000,000,000,010,100',
 '<':'001,010,100,010,001', '>':'100,010,001,010,100', '*':'101,010,111,010,101',
};
const GLYPH={}; for(const k in F) GLYPH[k]=F[k].split(',');

/* ==========================================================================
   BILD-CACHE  (einmal backen, danach nur noch kopieren)
   ========================================================================== */
const _ids=new WeakMap(); let _nid=0;
const _spr=new Map(), _out=new Map(), _txt=new Map(), _gly=new Map(), _grd=new Map();
const rowsId=r=>{ let i=_ids.get(r); if(i===undefined){ i=++_nid; _ids.set(r,i);} return i; };
function leinwand(w,h){ const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return [c,x]; }
function verlauf(key,w,h,mal){ let c=_grd.get(key);
  if(!c){ const [cc,xx]=leinwand(w,h); mal(xx); c=cc; _grd.set(key,c); } return c; }

let KEY={};
function backeSprite(rows,sc,tint){
  let bw=0; for(const r of rows) if(r.length>bw) bw=r.length;
  const [c,x]=leinwand(bw*sc,rows.length*sc);
  for(let r=0;r<rows.length;r++){ const row=rows[r];
    for(let i=0;i<row.length;i++){ const ch=row[i]; if(ch==='.') continue;
      x.fillStyle=tint||KEY[ch]||'#fff'; x.fillRect(i*sc,r*sc,sc,sc); } }
  return c;
}
function holeSprite(rows,sc,tint){ const k=rowsId(rows)+'|'+sc+'|'+(tint||'-');
  let c=_spr.get(k); if(!c){ c=backeSprite(rows,sc,tint); _spr.set(k,c);} return c; }
function sprite(rows,x,y,sc=1,tint=null,alpha=1){
  const c=holeSprite(rows,sc,tint);
  if(alpha!==1) ctx.globalAlpha=alpha;
  ctx.drawImage(c,Math.round(x),Math.round(y));
  if(alpha!==1) ctx.globalAlpha=1;
}
function spriteFlip(rows,x,y,sc=1,tint=null){
  const c=holeSprite(rows,sc,tint);
  ctx.save(); ctx.translate(Math.round(x)+c.width,Math.round(y)); ctx.scale(-1,1);
  ctx.drawImage(c,0,0); ctx.restore();
}
function outline(rows,x,y,sc=1,a=.75){
  const k=rowsId(rows)+'|'+sc; let c=_out.get(k);
  if(!c){ const s=holeSprite(rows,sc,'#000'); const [cc,xx]=leinwand(s.width+2*sc,s.height+2*sc);
    xx.drawImage(s,0,sc); xx.drawImage(s,2*sc,sc); xx.drawImage(s,sc,0); xx.drawImage(s,sc,2*sc);
    c=cc; _out.set(k,c); }
  ctx.globalAlpha=a; ctx.drawImage(c,Math.round(x)-sc,Math.round(y)-sc); ctx.globalAlpha=1;
}
function textTo(g,str,x,y,col,s){
  g.fillStyle=col; str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const gl=GLYPH[str[i]]||GLYPH['?'];
    for(let r=0;r<5;r++) for(let c=0;c<3;c++)
      if(gl[r][c]==='1') g.fillRect(x+(i*4+c)*s,y+r*s,s,s); } }
function text(str,x,y,col,s=1){
  str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const ch=str[i]; if(ch===' ') continue;
    const k=ch+col+s; let c=_gly.get(k);
    if(!c){ const [cc,xx]=leinwand(3*s,5*s); textTo(xx,ch,0,0,col,s); c=cc; _gly.set(k,c); }
    ctx.drawImage(c,Math.round(x+i*4*s),Math.round(y)); } }
const textW=(s0,s=1)=>String(s0).length*4*s-s;
const textC=(s0,y,col,s=1)=>text(s0,Math.round((W-textW(s0,s))/2),y,col,s);
function textGlow(str,x,y,col,s=1){
  str=String(str).toUpperCase(); const k=str+'|'+col+'|'+s;
  let c=_txt.get(k);
  if(!c){ const pad=s,[cc,xx]=leinwand(textW(str,s)+2*pad,5*s+2*pad);
    xx.globalAlpha=.25;
    textTo(xx,str,pad-s,pad,col,s); textTo(xx,str,pad+s,pad,col,s);
    textTo(xx,str,pad,pad-s,col,s); textTo(xx,str,pad,pad+s,col,s);
    xx.globalAlpha=1; textTo(xx,str,pad,pad,col,s);
    c=cc; if(_txt.size>300) _txt.clear(); _txt.set(k,c); }
  ctx.drawImage(c,Math.round(x)-s,Math.round(y)-s); }
const textGlowC=(s0,y,col,s=1)=>textGlow(s0,Math.round((W-textW(s0,s))/2),y,col,s);

/* ==========================================================================
   SPRITES
   ========================================================================== */
KEY={ k:'#07060d', s:'#e8b088', h:'#2a1c14', t:'#3ad1a0', p:'#2b2b48', w:'#f2f0ff',
      g:'#ffd447', n:'#ff3d8b', c:'#42d9ff', r:'#ff4d4d', d:'#484263', b:'#6b4a2a',
      o:'#a8681f', e:'#20182e', l:'#ffe08a', v:'#c8324a', m:'#7a2d3d', a:'#1a1626',
      z:'#5a4632', u:'#8c94ad', q:'#2e3350', j:'#3d2f22' };

const KOPF=['..hhh..','.hsssh.','.sssss.','..sss..'];
const geh = beine => [...KOPF,'..ttt..',...beine];

const SPR = {
  steh: geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
  geh:[
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk']),
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','.p...p.','.p...p.','kk...kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','.p.pp..','p..pp..','.kk.kk.']),
  ],
  sprung: [...KOPF,'k.ttt.k','.tttttt','..ttt..','..ttt..','..ppp..','.pp.pp.','.p...p.','kk...kk'],
  fall:   [...KOPF,'..ttt..','ktttttk','..ttt..','..ppp..','..p.p..','.pp.pp.','.p...p.','.k...k.'],
  ducken: ['.......','.......','.......','.......','.......','.......','.......','.hhh...',
           'hsssh..','.tttttt','ktttttk','.pppppp','.kk..kk'],
  suchen: [...KOPF,'..ttt..','.ttttts','k.ttt.s','..ttt..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  packen: ['..hhh....','.hsssh...','.sssss...','..sss....','..ttt....','.ttttssss',
           'k.ttt.ss.','..ttt....','..ppp....','..p.p....','..p.p....','.pp.pp...','.kk..kk..'],

  /* Lehrer - Hemd, Krawatte, Brille */
  lehrer: ['..ddd..','.duuud.','.uwuwu.','..uuu..','..qqq..','.qqqqq.','k.qnq.k','..qqq..',
           '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  lehrerGeh:['..ddd..','.duuud.','.uwuwu.','..uuu..','..qqq..','qqqqq..','k.qnq.k','..qqq..',
             '..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk'],
  /* Direktor - groesser, Anzug, Glatze */
  direktor:[
    '...uuuuu...','..uwwwwwu..','..uwqqqwu..','..wwwwwww..','...wwwww...','....qqq....',
    '..qqqqqqq..','.qqqqqqqqq.','qq.qqqqq.qq','qq.qqnqq.qq','qq.qqqqq.qq','...qqqqq...',
    '...qq.qq...','...qq.qq...','...pp.pp...','...pp.pp...','..kkk.kkk..',
  ],

  /* Einrichtung */
  spind:  ['uuuuuu','u....u','u..k.u','u....u','uuuuuu','u....u','u..k.u','u....u','uuuuuu','dddddd'],
  tisch:  ['zzzzzzzz','z......z','dd....dd','d......d','d......d','d......d'],
  regal:  ['zzzzzzz','zbbbbbz','zzzzzzz','zbbbbbz','zzzzzzz','zbbbbbz','zzzzzzz','ddddddd'],
  eimer:  ['.dddd.','.duud.','.duud.','.duud.','..dd..'],
  tafel:  ['dddddddddd','dqqqqqqqqd','dq.q..qq.d','dqqqqqqqqd','dq..qq..qd','dqqqqqqqqd','dddddddddd'],
  pflanze:['..ggg..','.ggggg.','g.ggg.g','..ggg..','...z...','..zzz..','.zzzzz.'],
  kiste:  ['oooooo','o....o','o.oo.o','o....o','oooooo'],
  /* Tuerblatt muss gefuellt sein - sonst sieht man durch die Tuer die Wand */
  tuer:   ['zzzzzzzz','zjjjjjjz','zjjjjjjz','zjjjjjjz','zjjjjjjz','zjjjjgjz','zjjjjjjz','zjjjjjjz',
           'zjjjjjjz','zjjjjjjz','zjjjjjjz','zzzzzzzz'],

let AC=null, muted=false;
function ensureAudio(){ if(AC) return AC;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MUS.next=AC.currentTime+.05; }
  catch(e){ AC=null; } return AC; }
function ton(f,when,dur,type='square',vol=.05){
  if(!AC||muted) return; const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,when);
  g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g); g.connect(AC.destination); o.start(when); o.stop(when+dur+.02); }
const piep=(f,d=.07,t='square',v=.05)=>{ ensureAudio(); if(AC) ton(f,AC.currentTime,d,t,v); };
function glissando(f1,f2,dur,type='square',vol=.05){
  ensureAudio(); if(!AC||muted) return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.02); }
function rauschen(dur=.25,vol=.08){
  ensureAudio(); if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(AC.destination); s.start(); }

const BASS=[98,0,0,0, 87,0,0,0, 73,0,0,0, 82,0,0,98];
const BASS_JAGD=[147,147,0,175, 147,0,131,0, 117,117,0,131, 117,0,175,196];
const MUS={step:0,next:0};
function musik(){
  if(!AC||muted||S.modus==='pause') return;
  const jagd = S.lehrerJagt;
  const bpm = jagd?126:74, st=60/bpm/4, linie=jagd?BASS_JAGD:BASS;
  while(MUS.next<AC.currentTime+.12){

    if(jagd&&i%4===0) ton(f?f*2:300,MUS.next,st*.5,'triangle',.012);
    MUS.next+=st; MUS.step++;

const cv=document.getElementById('c'), ctx=cv.getContext('2d');

const IS_TOUCH = navigator.maxTouchPoints>0 || 'ontouchstart' in window || /[?&]touch=1/.test(location.search);
if(IS_TOUCH) document.documentElement.classList.add('touch');
const imVollbild=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);

function anpassen(){
  const rand=(imVollbild()||IS_TOUCH)?0:46;
  const vw=innerWidth-rand, vh=innerHeight-rand;
  /* Breite waechst mit dem Bildschirm mit, damit auf langen Handys keine
     schwarzen Balken bleiben. Die Hoehe bleibt fest, damit die Pixel stimmen. */
  W = Math.max(320, Math.min(432, Math.round(H*(vw/vh)/2)*2));
  cv.width=W;
  ctx.imageSmoothingEnabled=false;
  const roh=Math.min(vw/W,vh/H);
  const s = roh<3 ? Math.max(.5,Math.floor(roh*4)/4) : Math.floor(roh);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize',anpassen);
addEventListener('orientationchange',()=>setTimeout(anpassen,120));
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>setTimeout(anpassen,60)));

  Promise.resolve(req.call(root)).then(()=>{

let S={};
function neuesSpiel(){
  S={
    modus:'titel',            // titel | spiel | raum | gefangen | cutscene | ende | pause
    t:0, zeit:0,
    x:60, y:BODEN[0], vx:0, vy:0, etage:0, amBoden:true, letzterBoden:0,
    blick:1, gehPhase:0,
    hp:TUNE.leben, unverwundbar:0,
    kamX:0, kamY:0,
    hatSchluessel:false, schluesselRaum:0, schluesselMoebel:0,
    hatWerkzeug:false, werkzeugMoebel:0,
    riegelt:false, fensterT:0, fensterLaermT:0, viaFenster:false,
    raum:null, raumX:0, suchT:0, suchZiel:-1, meldung:'', meldungT:0,
    imSpind:-1, spindAbkuehlung:0, schleicht:false,
    zettel:[], hinweisStufe:0, dunkelT:0, faenger:'', faengerX:null,
    lampe:false, akku:TUNE.akkuStart, stumm:false,
    chat:[], naechsteNachricht:0, vibriert:0,
    wurf:null, wurfAbkuehlung:0,
    minute:TUNE.startMinute, zeitWarnung:false,
    lehrer:LEHRER_START.map(l=>({...l, verdacht:0, jagd:0, gesehenPiep:false, steht:0, schauT:0})),
    lehrerJagt:false,
    entdeckt:new Set(),        // welche Raeume schon betreten wurden
    durchsucht:new Set(),      // "raumIndex:moebelIndex"
    ruettel:0, blitz:0, blende:0,
    szene:0, szeneT:0, packT:0, packSound:false, dirX:0, dirY:0,
    hinweis:'', hinweisT:0,
    schritte:0, gewonnen:false,
    nahesMoebel:-1, anTuerRaus:false,
  };
  /* Der Schluessel darf nicht im Raum direkt neben dem Start liegen -
     sonst ist die Runde nach zwanzig Sekunden vorbei und fuehlt sich
     jedes Mal gleich an. Etagen werden gleich gewichtet, damit nicht
     immer die Etage mit den meisten Raeumen gewinnt. */
  const startX=60;
  const erlaubt=RAEUME.map((r,i)=>i).filter(i=>!(RAEUME[i].e===0 && Math.abs(RAEUME[i].x-startX)<120));
  const etagen=[...new Set(erlaubt.map(i=>RAEUME[i].e))];
  const etage=etagen[Math.floor(Math.random()*etagen.length)];
  const inEtage=erlaubt.filter(i=>RAEUME[i].e===etage);
  const r=inEtage[Math.floor(Math.random()*inEtage.length)];
  S.schluesselRaum=r;
  S.schluesselMoebel=Math.floor(Math.random()*RAEUME[r].moebel.length);

  /* Das Brecheisen liegt immer beim Hausmeister - nur wo genau, wechselt.
     Der Schluessel kann dort nie liegen (der Raum ist zu nah am Start),
     also koennen sich die beiden Funde nicht in die Quere kommen. */
  S.werkzeugMoebel=Math.floor(Math.random()*RAEUME[WERKZEUG_RAUM].moebel.length);

  /* Zettel verstecken. Sie liegen bewusst NICHT im Schluesselraum -
     sonst findet man beides auf einmal und der Hinweis ist wertlos.
     Der Platz des Brecheisens ist ebenfalls tabu, sonst verschluckt ein
     Fund den anderen. */
  const frei=[];
  RAEUME.forEach((raum,ri)=>{ if(ri===r) return;
    raum.moebel.forEach((m,mi)=>{
      if(ri===WERKZEUG_RAUM && mi===S.werkzeugMoebel) return;
      frei.push({raum:ri,moebel:mi});
    }); });
  for(let i=frei.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
    [frei[i],frei[j]]=[frei[j],frei[i]]; }
  S.zettel=frei.slice(0,TUNE.zettelAnzahl).map((f,i)=>({...f,stufe:i+1,gefunden:false}));

  /* Der Direktor wandert ueber alle Etagen. Er ist langsam, sieht aber
     weit und gibt nicht so schnell auf wie die Lehrer. */
  S.lehrer.push({ chef:true, e:0, von:40, bis:LEVEL_B-40, x:LEVEL_B-120, v:-1,
                  verdacht:0, jagd:0, gesehenPiep:false, steht:0, schauT:0,
                  wechselT:TUNE.chefEtagenWechsel });

  /* Zwei Spielarten, damit sich Runden unterscheiden:
     entweder liegt der Schluessel irgendwo herum, oder der Hausmeister
     traegt ihn am Guertel und muss abgelenkt werden. */
  S.variante = Math.random()<0.5 ? 'hausmeister' : 'raum';
  if(S.variante==='hausmeister'){
    S.schluesselRaum=-1;
    S.lehrer.push({ hausmeister:true, e:0, von:150, bis:LEVEL_B-120, x:420, v:-1,
                    verdacht:0, jagd:0, gesehenPiep:false, steht:0, schauT:0,
                    hatSchluessel:true });
  }
  S.kamX=S.x-W/2; S.kamY=S.y-H*0.62;
}

  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(introText(S.szene),H-24,P.weiss);
  if(Math.floor(t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
}
function zeigeHinweis(t,d=2){ S.hinweis=t; S.hinweisT=d; }

addEventListener('keydown',e=>{

  if(e.code==='KeyH'){ e.preventDefault(); S.stumm=!S.stumm;
                       meldung(S.stumm?'HANDY STUMM':'HANDY LAUT',1.2); piep(S.stumm?300:600,.06); }
  if(e.code==='KeyR'){ e.preventDefault(); wirf(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';
});

/* ==========================================================================
   HILFEN
   ========================================================================== */
const raumBei=(e,x)=>RAEUME.findIndex(r=>r.e===e && Math.abs(r.x-x)<12);
const spindBei=(e,x)=>SPINDE.findIndex(s=>s.e===e && Math.abs(s.x-x)<TUNE.spindReichweite);
const amFenster=(e,x)=>e===FENSTER.e && Math.abs(FENSTER.x-x)<TUNE.fensterReichweite;
/* ---- Handy ---- */
function lampeSchalten(){
  if(S.modus!=='spiel'&&S.modus!=='raum') return;
  if(!S.lampe && S.akku<=0){ meldung('AKKU LEER',1.2); SFX.nichts(); return; }
  S.lampe=!S.lampe; piep(S.lampe?880:440,.05,'sine',.04);
  meldung(S.lampe?'TASCHENLAMPE AN':'TASCHENLAMPE AUS',1);
}
/* ---- Laerm: Lehrer gehen dem Geraeusch nach ---- */
function laerm(x,etage,weite){
  for(const L of S.lehrer){
    if(L.e!==etage||L.jagd>0) continue;
    if(Math.abs(L.x-x)<weite){ L.suchtX=x; L.verdacht=Math.min(1,L.verdacht+.15); }
  }
}
/* ---- Werfen: macht Laerm woanders, damit du hier durchkommst ----
   Das Tempo wird aus wurfWeite ausgerechnet, statt als feste Zahl
   danebenzustehen - sonst zeigt der Regler auf nichts. Flugzeit aus
   der Wurfparabel: 0 = wurfHoehe - bogen*t + schwere/2 * t^2. */
const WURF_HOEHE=10;                       // so hoch ueber dem Boden startet er
function wurfFlugzeit(){
  const b=TUNE.wurfBogen, g=TUNE.wurfSchwere;
  return (b+Math.sqrt(b*b+2*g*WURF_HOEHE))/g;
}
function wirf(){
  if(S.modus!=='spiel'||S.wurfAbkuehlung>0||S.wurf) return;
  S.wurf={ x:S.x+4, y:S.y-WURF_HOEHE, e:S.etage,
           vx:S.blick*TUNE.wurfWeite/wurfFlugzeit(), vy:-TUNE.wurfBogen };
  S.wurfAbkuehlung=TUNE.wurfAbkuehlung;
  piep(300,.05,'triangle',.03);
}

function rein(i){
  S.imSpind=i; S.vx=0; S.riegelt=false; S.x=SPINDE[i].x+1; SFX.tuer();
  meldung('VERSTECKT',1.2);
  /* Wer schon jagt, verliert die Spur - aber er sucht weiter in der Naehe. */
  S.lehrer.forEach(L=>{ if(L.e===S.etage) L.verdacht=0; });
}
function raus(){
  S.imSpind=-1; S.spindAbkuehlung=TUNE.spindAbkuehlung; SFX.tuer();
  meldung('RAUS AUS DEM SPIND',1);
}
const anTreppe=x=>Math.abs(x-TREPPE_L)<22 || Math.abs(x-TREPPE_R)<22;
const amAusgang=x=>S.etage===AUSGANG.e && Math.abs(x-AUSGANG.x)<13;

function meldung(t,d=1.4){ S.meldung=t; S.meldungT=d; }

/* Wohin der Schluessel zeigt - haengt an der Spielart der Runde.
   In der Hausmeister-Variante gibt es keinen Schluesselraum, ein
   ungepruefter Zugriff auf RAEUME[-1] wuerde alles abstuerzen lassen. */
const zielEtage=()=>S.variante==='hausmeister'?0:(RAEUME[S.schluesselRaum]||{e:0}).e;
function zielText(stufe){
  if(S.variante==='hausmeister')
    return stufe>=2 ? 'DER HAUSMEISTER HAT IHN AM GUERTEL'
                    : 'DER SCHLUESSEL IST IM ERDGESCHOSS';
  const kr=RAEUME[S.schluesselRaum]; if(!kr) return '';
  return stufe>=2 ? 'SCHLUESSEL IM RAUM '+kr.name
                  : 'DER SCHLUESSEL IST IN ETAGE '+(kr.e+1);
}
const zielKurz=()=>{
  if(S.variante==='hausmeister') return S.hinweisStufe>=2?'ZIEL: HAUSMEISTER':'ZIEL: ETAGE 1';
  const kr=RAEUME[S.schluesselRaum]; if(!kr) return '';
  return S.hinweisStufe>=2 ? 'ZIEL: '+kr.name : 'ZIEL: ETAGE '+(kr.e+1);
};

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  /* Die Blende lief bisher nur im Raum ab. Der Schnitt nach draussen hat
     sie zwar gesetzt, aber nie jemand heruntergezaehlt oder gezeichnet -
     der Schnitt fand also gar nicht statt. */
  if(S.blende>0) S.blende=Math.max(0,S.blende-dt*3);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;

  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt,true); return; }
  if(S.modus==='ende'){ S.zeit+=dt; return; }
  if(S.modus==='gefangen'){ S.szeneT+=dt; return; }

  S.zeit+=dt;
  if(S.unverwundbar>0) S.unverwundbar-=dt;

  if(S.modus==='raum'){ imRaum(dt); kamera(dt,true); return; }

  if(S.spindAbkuehlung>0) S.spindAbkuehlung=Math.max(0,S.spindAbkuehlung-dt);
  if(S.wurfAbkuehlung>0)  S.wurfAbkuehlung=Math.max(0,S.wurfAbkuehlung-dt);
  if(S.vibriert>0)        S.vibriert-=dt;

  /* Die Uhr laeuft. Um 17:30 schliesst der Hausmeister endgueltig ab. */
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(!S.zeitWarnung && S.minute>=TUNE.endMinute-15){
    S.zeitWarnung=true; zeigeHinweis('17:15 - GLEICH SCHLIESST ER AB',3.4); SFX.alarm();
  }
  if(S.minute>=TUNE.endMinute && S.modus!=='cutscene'){
    S.modus='ende'; S.gewonnen=false; S.faenger='DER HAUSMEISTER HAT ABGESCHLOSSEN';
    SFX.gefangt(); return;
  }

  /* Akku und Taschenlampe */
  if(S.lampe){ S.akku=Math.max(0,S.akku-TUNE.akkuProSek*dt);
    if(S.akku<=0){ S.lampe=false; meldung('AKKU LEER',1.6); SFX.nichts(); } }

  /* Nachrichten von den Jungs - und die Vibration, die dich verraet */
  while(S.naechsteNachricht<NACHRICHTEN.length && S.zeit>=NACHRICHTEN[S.naechsteNachricht].t){
    const n=NACHRICHTEN[S.naechsteNachricht++];
    S.chat.push({...n,alter:0});
    if(S.chat.length>3) S.chat.shift();
    if(S.stumm){ piep(200,.02,'sine',.01); }
    else {
      S.vibriert=.9; rauschen(.16,.05);
      if(S.modus==='spiel'&&S.imSpind<0) laerm(S.x,S.etage,TUNE.vibrationWeite);
    }
  }
  for(const c of S.chat) c.alter+=dt;

  /* Geworfener Gegenstand fliegt und macht beim Aufschlag Laerm */
  if(S.wurf){
    const w=S.wurf; w.vy+=TUNE.wurfSchwere*dt; w.x+=w.vx*dt; w.y+=w.vy*dt;
    if(w.y>=BODEN[w.e]){
      laerm(w.x,w.e,TUNE.laermWeite);
      rauschen(.12,.06); piep(180,.06,'square',.04);
      staub(w.x,BODEN[w.e],6);
      S.wurf=null;
    } else if(w.x<0||w.x>LEVEL_B) S.wurf=null;
  }

  /* Ab und zu faellt der Strom im Gang kurz aus. Rein atmosphaerisch,
     aber es macht aus dem Schulflur einen Ort, an dem man nicht sein will. */
  if(S.dunkelT>0) S.dunkelT-=dt;
  else if(Math.random()<0.055*dt){ S.dunkelT=0.4+Math.random()*1.1; rauschen(.12,.03); }

  /* ---------- Im Spind: nur rauskommen geht ---------- */
  if(S.imSpind>=0){
    while(aktionPuffer.length){ aktionPuffer.shift(); raus(); }
    lehrerLogik(dt); kamera(dt,false); return;
  }

  /* ---------- Am Fenster: der Riegel ----------
     Solange du dranbleibst, geht es voran. Jeder Handgriff knackt, und
     jedes Knacken zieht alles an, was in Hoerweite ist. Wer weggeht,
     verliert die Arbeit nur langsam wieder - Wegducken soll sich lohnen,
     Wegbleiben nicht. */
  if(S.riegelt){
    const stoert = !amFenster(S.etage,S.x) || linksAn || rechtsAn || hochAn
                 || !S.amBoden || S.lehrerJagt;
    if(stoert){ S.riegelt=false; meldung('ABGESETZT',1); }
    else {
      S.fensterT+=dt;
      S.fensterLaermT-=dt;
      if(S.fensterLaermT<=0){
        S.fensterLaermT=TUNE.fensterLaerm;
        laerm(S.x,S.etage,TUNE.laermWeite);
        SFX.riegel(); staub(S.x,S.y-16,3); S.ruettel=1.5;
      }
      if(S.fensterT>=TUNE.fensterDauer){
        S.riegelt=false; S.fensterT=TUNE.fensterDauer;
        SFX.fund(); S.blitz=.8; meldung('DER RIEGEL GIBT NACH',2);
        starteCutscene(true);
        return;
      }
    }
  } else if(S.fensterT>0){
    S.fensterT=Math.max(0,S.fensterT-TUNE.fensterZerfall*dt);
  }

  /* ---------- Korridor ---------- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  S.schleicht = schleichAn && S.amBoden;
  const hoechst = TUNE.gehTempo*(S.schleicht?TUNE.schleichTempo:1)*tempoBonus();
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx += richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx = Math.abs(S.vx)<=brems ? 0 : S.vx-Math.sign(S.vx)*brems;
  }
  S.x += S.vx*dt;
  S.x = Math.max(14, Math.min(LEVEL_B-14, S.x));

  /* Schrittgeraeusch - beim Schleichen bleibt es still */
  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase += Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0&&!S.schleicht) SFX.schritt(); }
  }

  /* Sprung */
  while(sprungPuffer.length && S.t-sprungPuffer[0]>=0){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); staub(S.x,S.y,5);
    }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  const boden=BODEN[S.etage];
  if(S.y>=boden){ S.y=boden; if(!S.amBoden){ SFX.landen(); staub(S.x,S.y,7); }
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; }
  else S.amBoden=false;

  /* Treppe: hoch und runter.
     Klammern sind hier wichtig - && bindet staerker als ||, sonst haengt
     die halbe Bedingung am falschen Zweig. */
  const treppe = S.amBoden && anTreppe(S.x);
  const runterAn = !!(keys['ArrowDown'] || keys['KeyS']);
  if(treppe && hochAn && S.etage < BODEN.length-1){
    S.etage++; S.y=BODEN[S.etage]; S.vy=0; hochAn=false;
    SFX.landen(); meldung('ETAGE '+(S.etage+1),1);
  } else if(treppe && runterAn && S.etage > 0){
    S.etage--; S.y=BODEN[S.etage]; S.vy=0;
    keys['ArrowDown']=false; keys['KeyS']=false;
    SFX.landen(); meldung('ETAGE '+(S.etage+1),1);
  }

  /* Aktion: Ausgang, Tuer oder Spind */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    const ri=raumBei(S.etage,S.x), si=spindBei(S.etage,S.x);
    const hm=S.lehrer.find(L=>L.hausmeister&&L.hatSchluessel&&L.e===S.etage&&Math.abs(L.x-S.x)<14);
    if(amAusgang(S.x)){
      if(S.hatSchluessel){ starteCutscene(); }
      else { meldung('ABGESCHLOSSEN'); SFX.nichts(); }
    } else if(hm){
      /* Nur wenn er abgelenkt ist, kommst du an den Schluessel. */
      if(hm.suchtX!=null||hm.abgelenkt>0){
        hm.hatSchluessel=false; S.hatSchluessel=true;
        SFX.fund(); S.blitz=1;
        meldung('SCHLUESSEL VOM GUERTEL GEZOGEN',2.4);
        zeigeHinweis('RAUS HIER - ERDGESCHOSS',3);
      } else { meldung('ER SCHAUT DIREKT HIN'); SFX.nichts(); }
    } else if(ri>=0){ betreteRaum(ri); }
    else if(amFenster(S.etage,S.x)){
      if(!S.hatWerkzeug){
        meldung('DER RIEGEL SITZT FEST'); SFX.nichts();
        zeigeHinweis('DA BRAUCHST DU WAS ZUM HEBELN',2.4);
      } else if(S.riegelt){
        S.riegelt=false; meldung('ABGESETZT',1);
      } else {
        S.riegelt=true; S.vx=0; S.fensterLaermT=0;
        meldung('DU SETZT AN',1.2);
      }
    }
    else if(si>=0){
      if(S.spindAbkuehlung>0){ meldung('NOCH '+Math.ceil(S.spindAbkuehlung)+' SEKUNDEN'); SFX.nichts(); }
      else rein(si);
    }
  }

  lehrerLogik(dt);
  kamera(dt,false);
}

/* ---- Raum betreten und verlassen ---- */
function betreteRaum(i){
  S.raum=i; S.modus='raum'; S.raumX=W/2; S.suchT=0; S.suchZiel=-1; S.riegelt=false;
  S.entdeckt.add(i); SFX.tuer(); S.blende=1;
  meldung(RAEUME[i].name,1.4);
}
function verlasseRaum(){
  S.modus='spiel'; S.raum=null; SFX.tuer(); S.blende=1; S.vx=0;
}
function imRaum(dt){
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  S.raumX += richtung*TUNE.gehTempo*.8*dt;
  const links=42, rechts=W-42;
  S.raumX=Math.max(links,Math.min(rechts,S.raumX));
  if(richtung&&Math.random()<.06) SFX.schritt();

  const r=RAEUME[S.raum];
  const plaetze=moebelPlaetze(r);
  let nah=-1;
  plaetze.forEach((p,i)=>{ if(Math.abs(p.x+8-S.raumX)<14) nah=i; });
  const anTuerRaus = S.raumX<=links+2;

  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0){
      S.durchsucht.add(S.raum+':'+S.suchZiel);
      const zettel=S.zettel.find(z=>z.raum===S.raum&&z.moebel===S.suchZiel&&!z.gefunden);
      if(S.raum===S.schluesselRaum && S.suchZiel===S.schluesselMoebel && !S.hatSchluessel){
        S.hatSchluessel=true; SFX.fund(); S.blitz=1;
        meldung('SCHLUESSEL GEFUNDEN',2.4); zeigeHinweis('RAUS HIER - ERDGESCHOSS',3);
      } else if(S.raum===WERKZEUG_RAUM && S.suchZiel===S.werkzeugMoebel && !S.hatWerkzeug){
        S.hatWerkzeug=true; SFX.fund(); S.blitz=.7;
        meldung('BRECHEISEN GEFUNDEN',2.2);
        zeigeHinweis('DAMIT KRIEGST DU EIN FENSTER AUF',3.4);
      } else if(zettel){
        zettel.gefunden=true;
        S.hinweisStufe=Math.max(S.hinweisStufe,zettel.stufe);
        SFX.fund(); S.blitz=.5;
        meldung(zettel.stufe===1?'ZETTEL GEFUNDEN':'NOTIZ GEFUNDEN',1.6);
        zeigeHinweis(zielText(zettel.stufe),4);
      } else { SFX.nichts(); meldung('NICHTS DRIN',1); }
    }
    return;
  }
  while(aktionPuffer.length){
    aktionPuffer.shift();
    if(anTuerRaus){ verlasseRaum(); return; }
    if(nah>=0){
      if(S.durchsucht.has(S.raum+':'+nah)){ meldung('SCHON DURCHSUCHT',1); SFX.nichts(); }
      else { S.suchT=TUNE.suchDauer; S.suchZiel=nah; SFX.suchen(); }
    }
  }
  S.nahesMoebel=nah; S.anTuerRaus=anTuerRaus;
}
/* Wanddeko je Raumstil - macht den Unterschied zwischen zehn gleichen
   Kisten und zehn Raeumen, die man auseinanderhaelt. */
function raumDeko(st,deckeY,bodenY){
  const m=Math.round(W/2);
  switch(st.deko){
    case 'rohre':                                   // Hausmeister
      ctx.fillStyle='#4a4130';
      ctx.fillRect(34,deckeY+8,W-68,3); ctx.fillRect(34,deckeY+18,W-68,2);
      ctx.fillStyle='#2a2418';
      for(let x=50;x<W-50;x+=44){ ctx.fillRect(x,deckeY+6,3,7); ctx.fillRect(x,deckeY+16,3,6); }
      ctx.fillStyle='#6b5a33';
      for(let x=70;x<W-60;x+=90) ctx.fillRect(x,deckeY+22,10,14);   // Werkzeugbrett
      break;
    case 'sprossen':                                // Turnhalle
      ctx.fillStyle='#6b5330';
      for(let i=0;i<9;i++) ctx.fillRect(44,deckeY+10+i*8,46,3);
      ctx.fillRect(44,deckeY+8,3,76); ctx.fillRect(87,deckeY+8,3,76);
      ctx.fillStyle='#c9552f';                                       // Korb
      ctx.fillRect(W-72,deckeY+16,22,3);
      ctx.fillStyle='#e8e2d0'; ctx.fillRect(W-76,deckeY+8,30,9);
      ctx.fillStyle='#3d5a3d';                                       // Linien am Boden
      ctx.fillRect(30,bodenY+6,W-60,1);
      break;
    case 'akten':                                   // Sekretariat
      ctx.fillStyle='#3a2f26';
      for(let x=40;x<W-70;x+=26){ ctx.fillRect(x,deckeY+14,22,40);
        ctx.fillStyle='#584636'; ctx.fillRect(x+2,deckeY+18,18,2); ctx.fillRect(x+2,deckeY+28,18,2);

function moebelPlaetze(r){

/* ---- Lehrer ---- */
function lehrerLogik(dt){
  let jagt=false;
  for(const L of S.lehrer){
    const tempo   = L.chef?TUNE.chefTempo:TUNE.lehrerTempo;
    const jagdT   = L.chef?TUNE.chefJagdTempo:TUNE.jagdTempo;
    const weite   = L.chef?TUNE.chefSicht:TUNE.sichtWeite;
    const dauer   = L.chef?TUNE.chefJagdDauer:TUNE.jagdDauer;
    if(L.jagd>0){
      jagt=true; L.jagd-=dt;
      const dir=Math.sign(S.x-L.x)||1;
      L.v=dir; L.x+=dir*jagdT*dt;
      L.x=Math.max(20,Math.min(LEVEL_B-20,L.x));
      /* Der Direktor folgt dir auch die Treppe hoch */
      if(L.chef && L.e!==S.etage && anTreppe(L.x)){ L.e+=Math.sign(S.etage-L.e); }
      if(L.e===S.etage && S.modus==='spiel' && S.imSpind<0
         && Math.abs(L.x-S.x)<TUNE.fangDistanz) gefangen(L);
    } else if(L.suchtX!=null){
      /* Geht einem Geraeusch nach - der eigentliche Nutzen vom Werfen */
      L.steht=0;                       // unterwegs steht er nicht
      const d=L.suchtX-L.x;
      L.v=Math.sign(d)||1;
      L.x+=L.v*TUNE.suchTempo*dt;
      if(Math.abs(d)<6){ L.suchtX=null; L.v=Math.random()<.5?1:-1;
        /* Am Zielort schaut er sich noch kurz um - dein Zeitfenster */
        L.steht=TUNE.pauseLang; L.schauT=TUNE.umschauZeit;
        if(L.hausmeister) L.abgelenkt=2.6; }
    } else {
      if(L.abgelenkt>0) L.abgelenkt-=dt;
      /* Pausen und Umschauen. Wer nur hin und her laeuft, hat einen Takt,
         den man einmal abzaehlt und danach nie wieder beachtet. Wer
         stehenbleibt und den Kopf dreht, bleibt eine Frage.
         Der Sichtkegel haengt an L.v - Kopf drehen heisst hier: v kippen. */
      if(L.steht>0){
        L.steht-=dt;
        /* Wer abgelenkt ist, schaut auf das, was ihn abgelenkt hat, und
           nicht in die Runde. Sonst waere das Zeitfenster am Guertel des
           Hausmeisters ein Muenzwurf statt einer Chance. */
        if(!(L.abgelenkt>0)){
          L.schauT-=dt;
          if(L.schauT<=0){ L.v=-L.v; L.schauT=TUNE.umschauZeit; }
        }
      } else {
        L.x+=L.v*tempo*dt;
        if(L.x<L.von||L.x>L.bis){
          L.x=Math.max(L.von,Math.min(L.bis,L.x));
          L.v=-L.v;
          L.steht=TUNE.wendePause; L.schauT=TUNE.umschauZeit;
        } else if(Math.random()<TUNE.pausenChance*dt){
          L.steht=TUNE.pauseKurz+Math.random()*(TUNE.pauseLang-TUNE.pauseKurz);
          L.schauT=TUNE.umschauZeit;
        }
      }
      /* Der Direktor wechselt regelmaessig die Etage */
      if(L.chef){
        L.wechselT-=dt;
        if(L.wechselT<=0 && anTreppe(L.x)){
          const richtung = L.e===0?1 : L.e===BODEN.length-1?-1 : (Math.random()<.5?1:-1);
          L.e+=richtung; L.wechselT=TUNE.chefEtagenWechsel;
          if(L.e===S.etage){ SFX.gesehen(); meldung('SCHRITTE IM TREPPENHAUS',1.6); }
        }
      }
    }
    /* Sicht - nur im Korridor, Raeume und Spinde sind sicher.
       Schleichen halbiert die Reichweite. */
    /* Licht macht dich weithin sichtbar - das ist der Preis der Lampe.
       Wer abgelenkt ist, schaut gerade woanders hin. */
    const abgelenkt = L.abgelenkt>0 || L.suchtX!=null;
    const reichweite = weite*(S.schleicht?TUNE.schleichSicht:1)
                     *(S.lampe?TUNE.lampeSichtBonus:1)*(abgelenkt?0.35:1);
    /* Wer stehenbleibt und sich umschaut, bemerkt auch den, der direkt
       neben ihm steht - Laufrichtung hin oder her. Ohne das war man genau
       dort unsichtbar, wo man am wenigsten sein sollte: der Sichttest
       vergleicht Vorzeichen, und direkt vor der Nase ist das Vorzeichen
       der Entfernung null. Wer marschiert, hat weiter Scheuklappen - und
       wer abgelenkt ist, erst recht. Genau davon lebt die Hausmeister-
       Variante: da muss man ihm nah genug kommen, um an den Guertel zu
       greifen, und das geht nur, solange er woanders hinschaut. */
    const direktDaneben = L.steht>0 && !abgelenkt && Math.abs(S.x-L.x)<TUNE.nahSicht;
    const imKegel = Math.sign(S.x-L.x)===Math.sign(L.v) && Math.abs(S.x-L.x)<reichweite;
    const sichtbar = S.modus==='spiel' && S.imSpind<0 && L.e===S.etage
      && (imKegel || direktDaneben)
      && Math.abs(S.y-BODEN[L.e])<TUNE.sichtHoehe;
    if(sichtbar){
      L.verdacht=Math.min(1,L.verdacht+TUNE.verdachtProSek*dt);
      if(!L.gesehenPiep&&L.verdacht>.25){ L.gesehenPiep=true; SFX.gesehen(); }
      if(L.verdacht>=1&&L.jagd<=0){ L.jagd=dauer; SFX.alarm(); S.ruettel=L.chef?6:4;
        meldung(L.chef?'DER DIREKTOR HAT DICH':'ER HAT DICH',1.6); }
    } else {
      L.verdacht=Math.max(0,L.verdacht-TUNE.verdachtAbbau*dt);
      if(L.verdacht<=0) L.gesehenPiep=false;
    }
  }
  S.lehrerJagt=jagt;
}
function gefangen(L){
  if(S.unverwundbar>0) return;
  S.hp--; S.modus='gefangen'; S.szeneT=0; S.ruettel=6; SFX.gefangt();
  S.riegelt=false;
  S.faenger = L&&L.chef ? 'DER DIREKTOR HAT DICH' : 'EIN LEHRER HAT DICH';
  S.faengerX = L ? L.x : S.x;
  S.lehrer.forEach(x=>{ x.jagd=0; x.verdacht=0; x.gesehenPiep=false; });
}
function weiterNachFang(){
  if(S.hp<=0){ S.modus='ende'; S.gewonnen=false; return; }
  S.modus='spiel'; S.unverwundbar=TUNE.unverwundbarMs/1000;
  /* Er schiebt dich ins Treppenhaus - und zwar in das, das von ihm
     wegfuehrt. Vorher wurde nach deiner eigenen Position entschieden,
     und weil er in dem Moment direkt neben dir stand, landetest du
     regelmaessig wieder vor seinen Fuessen. Das war das Willkuerliche
     daran, nicht die Treppe selbst. */
  const fx = S.faengerX!=null ? S.faengerX : S.x;
  S.x = Math.abs(fx-TREPPE_L) > Math.abs(fx-TREPPE_R) ? TREPPE_L+20 : TREPPE_R-20;
  S.vx=0; S.vy=0; S.y=BODEN[S.etage];
  /* Und er selbst steht erst mal und schaut sich um, statt sofort
     wieder loszulaufen. */
  S.lehrer.forEach(x=>{ if(x.e===S.etage){ x.steht=TUNE.wendePause; x.schauT=TUNE.umschauZeit; } });
}

/* ---- Kamera ---- */
function kamera(dt,sanft){
  const zielX = Math.max(0, Math.min(LEVEL_B-W, S.x - W/2 + S.blick*TUNE.blickVoraus));
  const zielY = S.y - H*0.62;
  const f = Math.min(1, TUNE.kameraTraegheit*dt);
  S.kamX += (zielX-S.kamX)*f;
  S.kamY += (zielY-S.kamY)*f;
}

let STAUB=[];
function staub(x,y,n){ if(!TUNE.staub) return;
  for(let i=0;i<n;i++) STAUB.push({x,y,vx:(Math.random()-.5)*34,vy:-Math.random()*18,

function staubUpdate(dt){ for(const p of STAUB){ p.leben-=dt; p.vy+=110*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  STAUB=STAUB.filter(p=>p.leben>0); }

const SZENE_DRAUSSEN=9;                 // ab hier spielt es vor der Schule

   ihn erst draussen an. Ein paar Zeilen lesen sich dann anders. */
const szeneText=i=>{ const s=SZENEN[i]; if(!s) return '';
  return (S.viaFenster&&s.alt)?s.alt:s.txt; };
function starteCutscene(viaFenster){
  S.modus='cutscene'; S.viaFenster=!!viaFenster;
  S.szene=viaFenster?SZENE_DRAUSSEN:0; S.szeneT=0; S.vx=0;
  S.dirX=S.x+58; S.dirY=BODEN[0]; S.packT=0;
  S.maxX=W+40; S.maxDa=false;
  if(viaFenster) S.blende=1;

}
function cutscene(dt){
  S.szeneT+=dt;
  const s=SZENEN[S.szene];
  if(S.szene<=1) S.dirX += (S.x+30 - S.dirX)*Math.min(1,3*dt);
  if(S.szene===5){ S.packT=Math.min(1,S.packT+dt*2.6);
    if(S.packT>=1&&!S.packSound){ S.packSound=true; SFX.packen(); S.ruettel=6; S.blitz=.8; } }
  if(S.szene===7){ S.dirX += 220*dt; S.dirY -= 40*dt; }
  /* Max Ferdi laeuft von rechts ins Bild */
  if(S.szene>=SZENE_DRAUSSEN+1){
    if(!S.maxDa){ S.maxDa=true; S.maxX=S.x+150; SFX.gesehen(); }
    const ziel=S.x+34;
    if(S.maxX>ziel) S.maxX=Math.max(ziel,S.maxX-130*dt);
  }
  /* Freischaltung */
  if(S.szene===SZENE_DRAUSSEN+7 && !S.crewGespeichert){
    S.crewGespeichert=true; speichereCrew('MAX FERDI'); S.blitz=.9; SFX.fund();
  }
  if(S.szeneT>=s.d){
    S.szene++; S.szeneT=0;
    if(S.szene===SZENE_DRAUSSEN) S.blende=1;          // Schnitt nach draussen
    if(S.szene>=SZENEN.length){
      S.modus='ende'; S.gewonnen=true; SFX.gewonnen();
      rechneAb();
    }
  }
}

/* ---- Abrechnung ----
   Die Uhr ist der Druck waehrend des Levels, die Punkte sind der Druck
   danach: wer den Abend nicht verpassen will, hat einen Grund zu rennen.
   Der Weg durchs Fenster ist der schnelle, aber er zaehlt weniger - sonst
   waere die Schluesselsuche in jeder Runde die schlechtere Wahl. */
function rechneAb(){
  S.neueBestzeit=false; S.neuerRekord=false;
  const rest=Math.max(0,TUNE.levelSekunden-S.zeit);
  const funde=S.zettel.filter(z=>z.gefunden).length+(S.hatWerkzeug?1:0);
  const p={
    zeit:  Math.round(rest*TUNE.punkteProSek),
    herzen:S.hp*TUNE.punkteProHerz,
    funde: funde*TUNE.punkteProFund,
    weg:   S.viaFenster?TUNE.punkteFenster:TUNE.punkteTuer,
  };
  p.gesamt=TUNE.punkteBasis+p.zeit+p.herzen+p.funde+p.weg;
  S.punkte=p;

  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  const rekord=ladeRekord();
  S.alterRekord=rekord;
  if(rekord===null||p.gesamt>rekord){ S.neuerRekord=true;
    try{ localStorage.setItem(PUNKTE_KEY,String(p.gesamt)); }catch(e){} }
}
/* Die Szene vor der Schule - eigener Hintergrund, kein Korridor mehr */
const DIALOG_OBEN = H-40;                 // ab hier liegt der Textkasten
function zeichneDraussen(){
  /* Boden bewusst deutlich ueber dem Textkasten, sonst stehen die Figuren
     mit den Fuessen im Dialog. Genau das war vorher der Fall. */
  const bodenY = DIALOG_OBEN - 26;
  ctx.fillStyle='#0d1024'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(verlauf('abendhimmel',W,bodenY,g=>{
    const gr=g.createLinearGradient(0,0,0,bodenY);
    gr.addColorStop(0,'#150f36'); gr.addColorStop(.55,'#4a2a48'); gr.addColorStop(1,'#9a5230');
    g.fillStyle=gr; g.fillRect(0,0,W,bodenY); }),0,0);
  for(let i=0;i<34;i++){ const x=(i*97)%W, y=(i*41)%46;
    ctx.fillStyle=i%5===0?'#ffffff66':'#ffffff26'; ctx.fillRect(x,y,1,1); }

  /* Schulgebaeude links, endet ueber dem Boden */
  const gebH=bodenY-24;
  ctx.fillStyle='#141828'; ctx.fillRect(0,24,116,gebH);
  ctx.fillStyle='#232a44'; ctx.fillRect(0,24,116,2);
  for(let y=34;y<bodenY-12;y+=15) for(let x=8;x<104;x+=20){
    ctx.fillStyle=((x+y)%3===0)?'#3f4a72':'#0e1120'; ctx.fillRect(x,y,13,8); }
  /* offenes Fenster, aus dem Max gestiegen ist */
  ctx.fillStyle='#4a5580'; ctx.fillRect(24,bodenY-26,20,15);
  ctx.fillStyle='#090b12'; ctx.fillRect(26,bodenY-24,16,11);
  ctx.fillStyle='#6a76a0'; ctx.fillRect(24,bodenY-27,20,1);
  sprite(SPR.tuer,92,bodenY-12);

  /* Boden und Zaun */
  ctx.fillStyle='#101320'; ctx.fillRect(0,bodenY,W,H-bodenY);
  ctx.fillStyle='#2e3550'; ctx.fillRect(0,bodenY,W,1);
  ctx.fillStyle='#1d2233';
  for(let x=126;x<W;x+=9) ctx.fillRect(x,bodenY-18,2,18);
  ctx.fillRect(126,bodenY-18,W-126,2);

  /* Strassenlaterne rechts */
  sprite(SPR.lampe,W-42,26);
  ctx.drawImage(verlauf('laternendraussen',80,80,g=>{
    const gr=g.createRadialGradient(40,5,2,40,5,64);
    gr.addColorStop(0,'rgba(255,220,150,.20)'); gr.addColorStop(1,'rgba(255,220,150,0)');
    g.fillStyle=gr; g.fillRect(0,0,80,80); }),W-82,26);

  /* Du - links von der Mitte, damit Max rechts Platz hat */
  const spielerX=Math.round(W*0.30);
  outline(SPR.steh,spielerX,bodenY-13,1,.6);
  sprite(SPR.steh,spielerX,bodenY-13);

  /* Max Ferdi */
  if(S.maxDa){
    const mx=Math.round(spielerX+(S.maxX-S.x));
    const laeuft=Math.abs(mx-(spielerX+34))>2;
    const rows=laeuft?SPR.geh[Math.floor(S.t*10)%4]:SPR.steh;
    outline(rows,mx,bodenY-13,1,.6);
    sprite(rows,mx,bodenY-13);
    ctx.fillStyle=P.neon2; ctx.fillRect(mx+2,bodenY-9,3,4);
    if(!laeuft&&Math.floor(S.t*2)%2===0)
      text('MAX FERDI',mx+4-textW('MAX FERDI')/2,bodenY-22,P.neon2);
  }
  /* Vignette, damit die Szene nicht flach wirkt */
  ctx.drawImage(verlauf('aussenvig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,bodenY-20,50,W/2,bodenY-20,W*.62);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.6)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
}

function draw(dt){
  staubUpdate(dt);
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const rx=(Math.random()-.5)*S.ruettel, ry=(Math.random()-.5)*S.ruettel;
  ctx.translate(Math.round(rx),Math.round(ry));

  if(S.modus==='cutscene'&&S.szene>=SZENE_DRAUSSEN) zeichneDraussen();
  else if(S.modus==='raum') zeichneRaum();
  else zeichneKorridor();

  ctx.restore();
  /* Eintrittsblende - Raumwechsel und der Schnitt nach draussen */
  if(S.blende>0){ ctx.fillStyle=`rgba(0,0,0,${S.blende.toFixed(2)})`; ctx.fillRect(0,0,W,H); }
  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

/* ---- Korridor ---- */
function zeichneKorridor(){
  const kx=Math.round(S.kamX), ky=Math.round(S.kamY);
  ctx.save(); ctx.translate(-kx,-ky);

  for(let e=0;e<BODEN.length;e++){
    const by=BODEN[e], deckeY=by-52;
    const fern = e!==S.etage;
    /* Wand */
    ctx.fillStyle = fern?'#12141f':P.wand;
    ctx.fillRect(0,deckeY,LEVEL_B,56);
    /* Sockelleiste und Boden */
    ctx.fillStyle = fern?'#0e1018':P.boden; ctx.fillRect(0,by,LEVEL_B,10);
    ctx.fillStyle = fern?'#1b1e2c':P.bodenKante; ctx.fillRect(0,by,LEVEL_B,1);
    /* Fliesenmuster */
    ctx.fillStyle = fern?'#101320':'#191d2e';
    for(let x=0;x<LEVEL_B;x+=16) ctx.fillRect(x,by+3,8,1);
    /* Wandkacheln */
    if(!fern){ ctx.fillStyle=P.wandHell;
      for(let x=0;x<LEVEL_B;x+=24) ctx.fillRect(x,deckeY+30,1,22);
      ctx.fillRect(0,deckeY+30,LEVEL_B,1); }
    /* Deckenlampen mit Flackern */
    for(let x=60;x<LEVEL_B;x+=120){
      const flack = TUNE.flackern ? (Math.sin(x*3.1+S.t*(x%7+3))>-.75?1:.25) : 1;
      ctx.globalAlpha=fern?.25:flack;
      sprite(SPR.lampe,x,deckeY+3);
      if(!fern&&flack>.5){
        ctx.drawImage(verlauf('lampenlicht',64,54,g=>{
          const gr=g.createRadialGradient(32,6,2,32,6,50);
          gr.addColorStop(0,'rgba(207,227,255,.16)'); gr.addColorStop(1,'rgba(207,227,255,0)');
          g.fillStyle=gr; g.fillRect(0,0,64,54); }), x-28, deckeY+4);
      }
      ctx.globalAlpha=1;
    }
    /* Spinde - hier kann man sich verstecken */
    SPINDE.forEach((sp,si)=>{ if(sp.e!==e) return;
      const sy=by-10;
      ctx.globalAlpha=fern?.4:1;
      const drin = S.imSpind===si;
      sprite(SPR.spind,sp.x,sy,1, drin?'#3a4155':null);
      if(!fern){
        const nah = S.etage===e && Math.abs(S.x-sp.x)<TUNE.spindReichweite && S.modus==='spiel';
        if(drin){
          /* Sehschlitz - du steckst drin und lugst raus */
          ctx.fillStyle='#000'; ctx.fillRect(sp.x+1,sy+3,4,1);
          ctx.fillStyle=P.neon2; ctx.fillRect(sp.x+2,sy+3,2,1);
          if(Math.floor(S.t*3)%2===0) text('E RAUS',sp.x+3-textW('E RAUS')/2,sy-9,P.gold);
        } else if(nah){
          const frei=S.spindAbkuehlung<=0;
          ctx.globalAlpha=.55; ctx.fillStyle=frei?P.gold:P.dunkel;
          ctx.fillRect(sp.x-1,sy-2,8,1); ctx.globalAlpha=1;
          if(Math.floor(S.t*4)%2===0){
            const t=frei?'E':Math.ceil(S.spindAbkuehlung)+'';
            text(t,sp.x+3-textW(t)/2,sy-9,frei?P.gold:P.rot);
          }
        }
      }
      ctx.globalAlpha=1;
    });

    /* Tueren */
    RAEUME.forEach((r,i)=>{ if(r.e!==e) return;
      const ty=by-12;
      ctx.globalAlpha=fern?.4:1;
      sprite(SPR.tuer,r.x,ty);
      if(!fern){
        /* Ab Hinweisstufe 2 ist der Zielraum markiert */
        const markiert = S.hinweisStufe>=2 && i===S.schluesselRaum && !S.hatSchluessel;
        const beschriftung=S.entdeckt.has(i)?r.name:'? ? ?';
        const col = markiert?P.gold : (S.entdeckt.has(i)?P.dim:P.dunkel);
        text(beschriftung, r.x+4-textW(beschriftung)/2, ty-8, col);
        if(markiert){
          const blink=Math.floor(S.t*3)%2===0;
          ctx.globalAlpha=blink?.85:.4; ctx.fillStyle=P.gold;
          ctx.fillRect(r.x-1,ty-1,10,1); ctx.fillRect(r.x-1,ty+12,10,1);
          ctx.globalAlpha=1;
          if(blink) sprite(SPR.schluessel,r.x+2,ty-17);
        }
      }
      ctx.globalAlpha=1;
    });

    /* Das Fenster - der zweite Weg raus. Es sieht bewusst nach Ausweg aus:
       das einzige Stueck Abendhimmel im ganzen Flur. */
    if(e===FENSTER.e){
      const fx=FENSTER.x, fy=by-42;          // Glas von fy bis fy+16
      ctx.globalAlpha=fern?.4:1;
      ctx.fillStyle='#3a3550'; ctx.fillRect(fx-9,fy-2,24,20);           // Laibung
      ctx.drawImage(verlauf('fensterhimmel',20,16,g=>{                  // Abendhimmel
        const gr=g.createLinearGradient(0,0,0,16);
        gr.addColorStop(0,'#3a2a55'); gr.addColorStop(.6,'#8a4a3a'); gr.addColorStop(1,'#d98a3a');
        g.fillStyle=gr; g.fillRect(0,0,20,16); }),fx-7,fy);
      ctx.fillStyle='#2a2540';                                          // Sprossen
      ctx.fillRect(fx+2,fy,1,16); ctx.fillRect(fx-7,fy+7,20,1);
      ctx.fillStyle='#4a4460';                                          // Rahmen
      ctx.fillRect(fx-9,fy-2,24,2); ctx.fillRect(fx-9,fy+16,24,2);
      ctx.fillStyle=S.fensterT>0?P.gold:'#6b6488';                      // Riegel
      ctx.fillRect(fx+11,fy+6,4,3);
      if(!fern){
        /* Warmes Licht auf dem Boden - der Grund, ueberhaupt hinzuschauen.
           Die Flaeche muss groesser sein als der Radius, sonst schneidet
           der Rand den Verlauf ab und aus dem Lichtschein wird ein Kasten. */
        ctx.drawImage(verlauf('fensterlicht',96,44,g=>{
          const gr=g.createRadialGradient(48,2,2,48,2,40);
          gr.addColorStop(0,'rgba(230,150,80,.16)'); gr.addColorStop(1,'rgba(230,150,80,0)');
          g.fillStyle=gr; g.fillRect(0,0,96,44); }),fx-46,fy+16);
        const nah = S.etage===e && amFenster(e,S.x) && S.modus==='spiel';
        /* Fortschritt am Riegel - er bleibt stehen, wenn du weg bist,
           damit sich Wegducken lohnt. Er faellt nur langsam zurueck. */
        if(S.fensterT>0){
          const bw=26, a=Math.min(1,S.fensterT/TUNE.fensterDauer);
          ctx.fillStyle='#000a'; ctx.fillRect(fx-9,by-22,bw+2,4);
          ctx.fillStyle=S.riegelt?P.gold:P.dunkel;
          ctx.fillRect(fx-8,by-21,Math.round(bw*a),2);
        }
        const bez = nah ? (S.hatWerkzeug?'E  HEBELN':'VERRIEGELT') : 'FENSTER';
        const col = nah ? (S.hatWerkzeug?P.gold:P.rot) : P.dunkel;
        if(!nah||Math.floor(S.t*3)%2===0) text(bez,fx+2-textW(bez)/2,by-51,col);
      }
      ctx.globalAlpha=1;
    }

    /* Ausgang */
    if(e===AUSGANG.e){
      const ay=by-14;
      ctx.fillStyle=S.hatSchluessel?P.gruen:'#3a2a2a';
      ctx.fillRect(AUSGANG.x-1,ay-1,12,15);
      sprite(SPR.tuer,AUSGANG.x,ay+2);
      text('AUSGANG',AUSGANG.x+4-textW('AUSGANG')/2,ay-9,S.hatSchluessel?P.gruen:P.rot);
      if(!S.hatSchluessel) text('X',AUSGANG.x+4,ay+4,P.rot);
    }

    /* Treppenhaus - muss auf einen Blick auffallen, sonst findet man es nicht */
    [[TREPPE_L,1],[TREPPE_R,-1]].forEach(([tx,dir])=>{
      ctx.globalAlpha=fern?.3:1;
      /* Nische in der Wand */
      ctx.fillStyle='#0d0f18'; ctx.fillRect(tx-20,by-46,40,46);
      ctx.fillStyle=P.wandHell; ctx.fillRect(tx-20,by-46,40,1);
      ctx.fillStyle='#0a0c14'; ctx.fillRect(tx-20,by-46,1,46); ctx.fillRect(tx+19,by-46,1,46);
      /* Stufen */
      for(let k=0;k<8;k++){
        ctx.fillStyle = k%2 ? '#39405c' : '#2b3149';
        ctx.fillRect(tx-16*dir+k*4*dir, by-3-k*4, 5, 4);
      }
      /* Gelaender */
      ctx.fillStyle='#525a7d';
      for(let k=0;k<8;k++) ctx.fillRect(tx-16*dir+k*4*dir+2, by-11-k*4, 1, 5);
      if(!fern){
        const oben=e<BODEN.length-1, unten=e>0;
        const nah=S.etage===e&&anTreppe(S.x)&&S.modus==='spiel';
        const blink=Math.floor(S.t*3)%2===0;
        text('TREPPE',tx-textW('TREPPE')/2,by-54,nah?P.gold:P.dunkel);
        /* Ab Hinweisstufe 1 steht hier, in welche Etage du musst */
        if(S.hinweisStufe>=1&&!S.hatSchluessel){
          const zE=zielEtage();
          if(zE!==e){ const pfeil=zE>e?'W':'S';
            if(Math.floor(S.t*2)%2===0) text(pfeil+' ETAGE '+(zE+1),tx-textW('W ETAGE 1')/2,by-62,P.gold); }
          else text('HIER',tx-textW('HIER')/2,by-62,P.gruen);
        }
        if(oben&&(!nah||blink)) text('W',tx-14,by-46,nah?P.gold:P.dim);
        if(unten&&(!nah||blink)) text('S',tx+11,by-46,nah?P.gold:P.dim);
        if(nah){ ctx.globalAlpha=.5; ctx.fillStyle=P.gold;
          ctx.fillRect(tx-20,by-1,40,1); ctx.globalAlpha=1; }
      }
      ctx.globalAlpha=1;
    });
  }

  /* Lehrer */
  for(const L of S.lehrer){
    const by=BODEN[L.e], fern=L.e!==S.etage;
    ctx.globalAlpha=fern?.35:1;
    /* Sichtkegel - schrumpft sichtbar mit, wenn du schleichst */
    if(!fern){
      ctx.globalAlpha=.10+L.verdacht*.22;
      ctx.fillStyle=L.jagd>0?P.rot:(L.chef?'#e0708f':P.gold);
      const w=(L.chef?TUNE.chefSicht:TUNE.sichtWeite)*(S.schleicht?TUNE.schleichSicht:1);
      const h=L.chef?20:16;
      if(L.v>0) ctx.fillRect(L.x+6,by-h,w,h); else ctx.fillRect(L.x-w+2,by-h,w,h);
      ctx.globalAlpha=1;
      /* Wer steht, schaut sich um. Der Streifen unter ihm zeigt, wie nah
         man ihm dabei nicht kommen darf - sonst waere die Regel unsichtbar. */
      if(L.steht>0){
        ctx.globalAlpha=.18; ctx.fillStyle=P.gold;
        ctx.fillRect(L.x+3-TUNE.nahSicht,by-1,TUNE.nahSicht*2,1);
        ctx.globalAlpha=1;
      }
    }
    /* Wer steht, soll auch stehen - sonst sieht man dem Lehrer nicht an,
       dass er sich gerade umschaut, und die Pause wirkt wie ein Ruckler. */
    const laeuft = L.jagd>0 || L.suchtX!=null || !(L.steht>0);
    const rows = L.chef ? SPR.direktor
               : (laeuft && Math.floor(S.t*6)%2 ? SPR.lehrerGeh : SPR.lehrer);
    const hoehe = L.chef?17:13;
    if(!fern) outline(rows,L.x,by-hoehe,1,.6);
    if(L.v>0) spriteFlip(rows,L.x,by-hoehe); else sprite(rows,L.x,by-hoehe);
    /* Hausmeister: Schluesselbund am Guertel und Statusanzeige */
    if(L.hausmeister&&!fern){
      if(L.hatSchluessel){
        sprite(SPR.schluessel,L.x+(L.v>0?-3:7),by-7);
        if(Math.floor(S.t*2)%2===0) text('HAUSMEISTER',L.x+3-textW('HAUSMEISTER')/2,by-24,P.gold);
      }
      const abgelenkt=L.abgelenkt>0||L.suchtX!=null;
      if(abgelenkt&&L.hatSchluessel&&Math.floor(S.t*5)%2===0)
        text('JETZT',L.x+3-textW('JETZT')/2,by-31,P.gruen);
    }
    /* Verdachtsbalken */
    if(!fern&&L.verdacht>.02){
      const bw=14;
      ctx.fillStyle='#000a'; ctx.fillRect(L.x-4,by-22,bw+2,4);
      ctx.fillStyle=L.jagd>0?P.rot:(L.verdacht>.6?P.gold:P.neon2);
      ctx.fillRect(L.x-3,by-21,Math.round(bw*L.verdacht),2);
      if(L.jagd>0&&Math.floor(S.t*8)%2===0) text('!',L.x+2,by-28,P.rot);
    }
    ctx.globalAlpha=1;
  }

  /* Spieler */
  const blinkt = S.unverwundbar>0 && Math.floor(S.t*16)%2===0;
  if(!blinkt&&S.modus!=='cutscene'&&S.imSpind<0) zeichneSpieler(S.x,S.y);

  /* Cutscene: Direktor und Spieler */
  if(S.modus==='cutscene'){
    const dy=S.dirY;
    outline(SPR.direktor,S.dirX,dy-17,1,.6);
    ctx.save();
    if(S.szene>=7){ ctx.translate(S.dirX+5,dy-8); ctx.rotate(S.szeneT*6); ctx.translate(-5,-9);
      sprite(SPR.direktor,0,0); ctx.restore(); }
    else { ctx.restore(); sprite(SPR.direktor,S.dirX,dy-17); }
    const rows = S.szene>=5 ? SPR.packen : SPR.steh;
    outline(rows,S.x,S.y-13,1,.6);
    if(S.blick<0) spriteFlip(rows,S.x,S.y-13); else sprite(rows,S.x,S.y-13);
  }

  /* Geworfener Gegenstand */
  if(S.wurf&&S.wurf.e===S.etage){
    ctx.fillStyle='#8c94ad';
    ctx.fillRect(Math.round(S.wurf.x),Math.round(S.wurf.y),3,3);
    ctx.fillStyle='#4a4363';
    ctx.fillRect(Math.round(S.wurf.x)-2,Math.round(S.wurf.y)+1,2,1);
  }
  /* Suchmarkierung, wenn ein Lehrer einem Geraeusch nachgeht */
  for(const L of S.lehrer){
    if(L.suchtX==null||L.e!==S.etage) continue;
    if(Math.floor(S.t*5)%2===0){
      ctx.fillStyle=P.gold;
      ctx.fillRect(Math.round(L.suchtX)-2,BODEN[L.e]-2,5,1);
      text('?',Math.round(L.suchtX),BODEN[L.e]-10,P.gold);
    }
  }

  /* Staub */
  for(const p of STAUB){ ctx.globalAlpha=Math.max(0,p.leben/p.max);
    ctx.fillStyle='#6b6488'; ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1); }
  ctx.globalAlpha=1;

  ctx.restore();

  /* Dunkelheit auf fremde Etagen */
  ctx.drawImage(verlauf('vignette',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.6,40,W/2,H*.6,W*.62);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.72)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);

  /* Dunkelheit: Stromausfall oder die kaputte Etage.
     Die Taschenlampe vergroessert den Kreis - deshalb lohnt sie sich. */
  const kaputteEtage = S.etage===TUNE.dunkleEtage;
  if(S.dunkelT>0 || kaputteEtage){
    const flackern = S.dunkelT>0 ? Math.min(1,S.dunkelT*2.2)*(Math.random()<.12?.4:1) : 1;
    const staerke = (S.dunkelT>0?.92:.86)*flackern;
    const radius = S.lampe ? TUNE.lampeRadius : (kaputteEtage?TUNE.dunkelRadius:24);
    const px=Math.round(S.x-S.kamX)+3, py=Math.round(S.y-S.kamY)-6;
    ctx.globalAlpha=staerke;
    ctx.drawImage(verlauf('dunkel'+radius,W*2,H*2,g=>{
      const gr=g.createRadialGradient(W,H,radius*.35,W,H,radius*2.2);
      gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
      g.fillStyle=gr; g.fillRect(0,0,W*2,H*2); }), px-W, py-H);
    ctx.globalAlpha=1;
    /* Warmer Lichtschein der Lampe */
    if(S.lampe){
      ctx.globalAlpha=.16;
      ctx.drawImage(verlauf('lampenschein',160,160,g=>{
        const gr=g.createRadialGradient(80,80,4,80,80,78);
        gr.addColorStop(0,'rgba(255,240,190,1)'); gr.addColorStop(1,'rgba(255,240,190,0)');
        g.fillStyle=gr; g.fillRect(0,0,160,160); }), px-80, py-80);
      ctx.globalAlpha=1;
    }
  }

  /* Blick aus dem Spind. Der Schlitz bleibt klar - vorher war er
     zusaetzlich abgedunkelt, dadurch sah man genau nichts. */
  if(S.imSpind>=0){
    const py=Math.round(S.y-S.kamY)-9;
    const hoehe=11;
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,Math.max(0,py));
    ctx.fillRect(0,py+hoehe,W,H-(py+hoehe));

    /* Nahaufnahme: wer vorbeigeht, wird gross gezeichnet.
       Das ist der Moment, den man aus dem Spind sehen soll. */
    const nah=S.lehrer.filter(L=>L.e===S.etage)
                      .sort((a,b)=>Math.abs(a.x-S.x)-Math.abs(b.x-S.x))[0];
    const abstand=nah?Math.abs(nah.x-S.x):999;
    if(nah&&abstand<80){
      const naehe=1-Math.min(1,abstand/80);
      const sc=Math.max(2,Math.round(2+naehe*2));
      const rows=nah.chef?SPR.direktor
                :(Math.floor(S.t*7)%2?SPR.lehrerGeh:SPR.lehrer);
      const bild=holeSprite(rows,sc);
      ctx.save();
      ctx.beginPath(); ctx.rect(0,py,W,hoehe); ctx.clip();
      const bx=Math.round(W/2+(nah.x-S.x)*2.4-bild.width/2);
      const by=Math.round(py+hoehe-bild.height*0.55);
      ctx.globalAlpha=.35; ctx.fillStyle='#000';
      ctx.fillRect(bx-2,py,bild.width+4,hoehe); ctx.globalAlpha=1;
      if(nah.v>0){ ctx.save(); ctx.translate(bx+bild.width,by); ctx.scale(-1,1);
                   ctx.drawImage(bild,0,0); ctx.restore(); }
      else ctx.drawImage(bild,bx,by);
      ctx.restore();
      /* Herzschlag, je naeher desto staerker */
      if(naehe>.35){
        const puls=(Math.sin(S.t*9)*.5+.5)*naehe;
        ctx.globalAlpha=puls*.35; ctx.fillStyle=P.rot;
        ctx.fillRect(0,py,W,hoehe); ctx.globalAlpha=1;
      }
    }
    /* Kanten der Spindtuer */
    ctx.fillStyle='#454e66'; ctx.fillRect(0,py-2,W,2); ctx.fillRect(0,py+hoehe,W,2);
    ctx.fillStyle='#1b2030'; ctx.fillRect(0,py-3,W,1); ctx.fillRect(0,py+hoehe+2,W,1);
    /* Luefterschlitze links und rechts als Rahmen */
    ctx.fillStyle='#2a3145';
    for(let x=4;x<W;x+=6){ ctx.fillRect(x,py-6,3,1); ctx.fillRect(x,py+hoehe+4,3,1); }
    if(Math.floor(S.t*2)%2===0) text('E  RAUS',W/2-textW('E  RAUS')/2,py+hoehe+10,P.dunkel);
  }
}

function zeichneSpieler(x,y){
  let rows;
  if(!S.amBoden) rows = S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows = SPR.geh[Math.floor(S.gehPhase)%4];
  else rows = SPR.steh;
  outline(rows,x,y-13,1,.6);
  if(S.blick<0) spriteFlip(rows,x,y-13); else sprite(rows,x,y-13);
  /* Schatten */
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(x),BODEN[S.etage],7,1); ctx.globalAlpha=1;
}

/* ---- Rauminneres ---- */
function zeichneRaum(){
  const r=RAEUME[S.raum];
  const st=STIL[r.stil]||STIL.klasse;
  const bodenY=136, deckeY=44;
  /* Wand in der Farbe des Raumstils */
  ctx.fillStyle=st.wand; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=st.kante; ctx.fillRect(26,deckeY,W-52,bodenY-deckeY);
  ctx.fillStyle=st.wand;  ctx.fillRect(28,deckeY+2,W-56,bodenY-deckeY-2);
  ctx.fillStyle='#00000055'; ctx.fillRect(26,deckeY,W-52,2);

  /* Fenster - Anzahl je Raum */
  const nF=st.fenster;
  for(let i=0;i<nF;i++){
    const fx=Math.round(W/2-(nF-1)*30-8+i*60);
    ctx.fillStyle='#0d1730'; ctx.fillRect(fx,deckeY+12,30,24);
    ctx.fillStyle='#1d3a63'; ctx.fillRect(fx+1,deckeY+13,28,22);
    ctx.fillStyle='#2b5488'; ctx.fillRect(fx+1,deckeY+13,28,4);
    ctx.fillStyle='#0f1322'; ctx.fillRect(fx+14,deckeY+12,2,24); ctx.fillRect(fx,deckeY+23,30,2);
    ctx.drawImage(verlauf('fenster',44,60,g=>{
      const gr=g.createLinearGradient(0,0,0,60);
      gr.addColorStop(0,'rgba(120,170,255,.13)'); gr.addColorStop(1,'rgba(120,170,255,0)');
      g.fillStyle=gr; g.fillRect(0,0,44,60); }), fx-7, deckeY+30);
  }
  /* Raumspezifische Ausstattung an der Wand */
  raumDeko(st,deckeY,bodenY);

  /* Boden in Raumfarbe */
  ctx.fillStyle=st.boden; ctx.fillRect(0,bodenY,W,H-bodenY);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,bodenY,W,1);
  ctx.fillStyle='#00000033'; for(let x=0;x<W;x+=18) ctx.fillRect(x,bodenY+4,9,1);
  /* Raumlicht von oben */
  ctx.drawImage(verlauf('raumlicht'+r.stil,W,90,g=>{
    const gr=g.createLinearGradient(0,0,0,90);
    gr.addColorStop(0,st.licht); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(0,0,W,90); }),0,deckeY);
  /* Tuer zurueck */
  sprite(SPR.tuer,30,bodenY-12);
  text('RAUS',30+4-textW('RAUS')/2,bodenY-20,S.anTuerRaus?P.gold:P.dunkel);

  /* Moebel */
  const plaetze=moebelPlaetze(r);
  plaetze.forEach((p,i)=>{
    const rows=SPR[p.typ]||SPR.kiste;
    const hoehe=rows.length;
    const y=bodenY-hoehe;
    outline(rows,p.x,y,1,.5);
    sprite(rows,p.x,y);
    const durchsucht=S.durchsucht.has(S.raum+':'+i);
    if(durchsucht){ text('OK',p.x+8-textW('OK')/2,y-8,P.dunkel); }
    else if(S.nahesMoebel===i){
      if(Math.floor(S.t*4)%2===0) text('E',p.x+8-1,y-9,P.gold);
      ctx.globalAlpha=.5; ctx.fillStyle=P.gold; ctx.fillRect(p.x,bodenY-1,16,1); ctx.globalAlpha=1;
    }
  });

  /* Spieler im Raum */
  const rows = Math.abs((rechtsAn?1:0)-(linksAn?1:0))>0 ? SPR.geh[Math.floor(S.t*8)%4]
             : (S.suchT>0?SPR.suchen:SPR.steh);
  outline(rows,S.raumX-3,bodenY-13,1,.6);
  if(S.blick<0) spriteFlip(rows,S.raumX-3,bodenY-13); else sprite(rows,S.raumX-3,bodenY-13);

  /* Suchbalken */
  if(S.suchT>0){
    const f=1-S.suchT/TUNE.suchDauer, bw=30;
    ctx.fillStyle='#000a'; ctx.fillRect(S.raumX-bw/2-1,bodenY-24,bw+2,5);
    ctx.fillStyle=P.gold;  ctx.fillRect(S.raumX-bw/2,bodenY-23,Math.round(bw*f),3);
    text('DURCHSUCHEN',(W-textW('DURCHSUCHEN'))/2,bodenY-34,P.dim);
  }

  /* Vignette */
  ctx.drawImage(verlauf('raumvig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,50,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.6)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
}

/* ---- HUD ---- */
function hud(){
  if(S.modus==='titel') return;
  /* Herzen */
  for(let i=0;i<TUNE.leben;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  /* Was du dabei hast: Brecheisen und Schluessel. Beide sind immer zu
     sehen, nur eben blass - dann weiss man von Anfang an, dass es sie gibt. */
  ctx.globalAlpha=S.hatWerkzeug?1:.22;   sprite(SPR.brecheisen,W-26,5); ctx.globalAlpha=1;
  ctx.globalAlpha=S.hatSchluessel?1:.28; sprite(SPR.schluessel,W-14,5); ctx.globalAlpha=1;
  /* Etage */
  if(S.modus!=='raum'){
    const t='ETAGE '+(S.etage+1);
    text(t,(W-textW(t))/2,6,P.dunkel);
  }
  /* Was du bisher weisst */
  if(!S.hatSchluessel&&S.hinweisStufe>0){
    const t=zielKurz();
    if(t) text(t,(W-textW(t))/2,14,P.gold);
  }
  /* Uhr - der Druck im Hintergrund */
  const std=Math.floor(S.minute/60), min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-15;
  text(uhr,W-textW(uhr)-6,14,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Handy: Akku und Zustand */
  const ax=6, ay=H-20;
  ctx.fillStyle='#000a'; ctx.fillRect(ax-1,ay-1,16,7);
  ctx.fillStyle=S.lampe?P.gold:'#2a2440'; ctx.fillRect(ax,ay,14,5);
  ctx.fillStyle=S.akku>30?P.gruen:P.rot; ctx.fillRect(ax+1,ay+1,Math.round(12*S.akku/100),3);
  if(S.lampe&&Math.floor(S.t*3)%2===0) text('Q',ax+18,ay,P.gold);
  if(S.stumm) text('STUMM',ax+18,ay,P.dunkel);
  if(S.vibriert>0&&Math.floor(S.t*20)%2===0) text('BZZZ',ax+18,ay-8,P.neon);

  /* Schleichen */
  if(S.schleicht) text('LEISE',6,H-12,P.neon2);
  /* Abkuehlungen */
  let rechts=[];
  if(S.spindAbkuehlung>0) rechts.push('SPIND '+Math.ceil(S.spindAbkuehlung));
  if(S.wurfAbkuehlung>0)  rechts.push('WURF '+Math.ceil(S.wurfAbkuehlung));
  /* Wie weit der Riegel ist - auch dann, wenn du gerade woanders stehst */
  if(S.fensterT>0) rechts.push('RIEGEL '+Math.round(S.fensterT/TUNE.fensterDauer*100));
  rechts.forEach((t,i)=>text(t,W-textW(t)-6,H-12-i*8,P.dunkel));

  /* Chat der Jungs */
  S.chat.forEach((c,i)=>{
    const y=H-46+i*9, a=Math.max(0,Math.min(1,(9-c.alter)));
    if(a<=0) return;
    ctx.globalAlpha=a*.9;
    text(c.von+':',8,y,c.von==='MAX FERDI'?P.neon2:P.dunkel);
    text(c.txt,8+textW(c.von+':')+4,y,P.weiss);
    ctx.globalAlpha=1;
  });
  /* Jagdanzeige */
  if(S.lehrerJagt&&Math.floor(S.t*6)%2===0) textGlowC('LAUF',18,P.rot,2);
  /* Meldung */
  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  /* Hinweis */
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
  /* Aktionshinweis im Korridor */
  if(S.modus==='spiel'){
    const ri=raumBei(S.etage,S.x);
    let t=null;
    if(amAusgang(S.x)) t = S.hatSchluessel?'E  RAUS HIER':'E  ABGESCHLOSSEN';
    else if(ri>=0) t='E  REIN';
    else if(amFenster(S.etage,S.x))
      t = S.riegelt ? 'E  AUFHOEREN'
        : S.hatWerkzeug ? 'E  RIEGEL AUFBRECHEN' : 'E  RIEGEL SITZT FEST';
    else if(anTreppe(S.x)) t = S.etage<BODEN.length-1 ? 'W  HOCH' : 'S  RUNTER';
    if(t&&Math.floor(S.t*3)%2===0) textC(t,H-42,P.gold);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#07060d'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){ const x=(i*79)%W, y=(i*53)%H;
    ctx.fillStyle=i%7===0?'#2a2440':'#15121f'; ctx.fillRect(x,y,1,1); }
  textGlowC('NACHTSCHICHT',24,P.neon,3);
  textC('LEVEL 1 - DIE SCHULE',46,P.dim);
  const zeilen=[
    'DU BIST NACH SCHULSCHLUSS EINGESPERRT',
    'FIND DEN SCHLUESSEL - ODER EIN FENSTER',
    'DIE LEHRER SIND NOCH DA',
  ];
  zeilen.forEach((z,i)=>textC(z,72+i*10,i===2?P.rot:P.weiss));
  const st=[['A D','LAUFEN'],['SHIFT','SCHLEICHEN'],['W S','TREPPE'],
            ['E','TUER, SPIND, DURCHSUCHEN'],['Q','TASCHENLAMPE'],
            ['R','WAS WERFEN - LENKT SIE AB'],['H','HANDY STUMM']];
  st.forEach((z,i)=>{ const y=100+i*8;
    text(z[0],44,y,P.gold); text(z[1],78,y,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', ')+'  +15% TEMPO',60,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC('LEERTASTE ODER E',H-9,P.weiss,1);
}
/* Eine Zeile der Abrechnung: Bezeichnung links, Zahl rechtsbuendig.
   Rechtsbuendig, weil untereinanderstehende Zahlen sich vergleichen lassen. */
const zeitText=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function punkteZeile(y,bez,wert,farbe){
  const m=Math.round(W/2), links=m-58, rechts=m+58;
  text(bez,links,y,P.dim);
  const w=String(Math.round(wert));
  text(w,rechts-textW(w),y,farbe||P.weiss);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='gefangen'){
    ctx.fillStyle=`rgba(0,0,0,${Math.min(.8,S.szeneT*2).toFixed(2)})`; ctx.fillRect(0,0,W,H);
    textGlowC('ERWISCHT',48,P.rot,3);
    textC(S.faenger||'ERWISCHT',72,P.dim);
    textC(S.hp>0?'ER SCHIEBT DICH INS TREPPENHAUS':'KEINE VERSUCHE MEHR',86,P.weiss);
    if(S.szeneT>.6&&Math.floor(S.t*2)%2===0) textC('LEERTASTE',104,P.gold);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=szeneText(S.szene);
    if(s) textC(s,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E',W-12,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    /* Dichter als vorher - hinter der Abrechnung soll der Flur nicht
       mitflimmern, sonst liest sich die Zahlenspalte schlecht. */
    ctx.fillStyle='#000000f2'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 1 GESCHAFFT',18,P.gold,2);
      textC(S.viaFenster?'DURCHS FENSTER RAUS':'VORNE RAUS, AM DIREKTOR VORBEI',34,P.dim);
      const zt=zeitText(S.zeit);
      textC('ZEIT  '+zt+(S.neueBestzeit?'   BESTZEIT':''),46,S.neueBestzeit?P.gold:P.weiss);
      const p=S.punkte||{zeit:0,herzen:0,funde:0,weg:0,gesamt:0};
      punkteZeile(60,'ZEIT',      p.zeit);
      punkteZeile(69,'HERZEN',    p.herzen);
      punkteZeile(78,'FUNDSTUECKE',p.funde);
      punkteZeile(87,S.viaFenster?'FENSTER':'AUSGANG', p.weg);
      punkteZeile(96,'RAUSGEKOMMEN', TUNE.punkteBasis);
      ctx.fillStyle=P.dunkel; ctx.fillRect(Math.round(W/2)-58,104,116,1);
      punkteZeile(109,'GESAMT',p.gesamt,P.gold);
      if(S.neuerRekord) textC('NEUER REKORD',122,P.neon);
      else if(S.alterRekord!=null) textC('REKORD  '+Math.round(S.alterRekord),122,P.dunkel);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),136,P.neon2);
      textC('NAECHSTES LEVEL FOLGT',148,P.dunkel);
    } else {
      textGlowC('GESCHNAPPT',48,P.rot,3);
      textC(S.faenger||'DIE SCHULE HAT GEWONNEN',76,P.weiss);
      textC('DURCHGEHALTEN  '+zeitText(S.zeit),92,P.dunkel);
    }
    if(Math.floor(S.t*2)%2===0) textC('LEERTASTE FUER NEUSTART',H-20,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */
let letzte=performance.now();
function bild(jetzt){
  const dt=Math.min(.05,(jetzt-letzte)/1000); letzte=jetzt;
  update(dt); draw(dt);
  requestAnimationFrame(bild);
}
requestAnimationFrame(bild);
</script>
