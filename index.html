/* Musik und Saft: Aufrufe nur ueber diese Helfer, damit fehlende Engine-Teile nichts kosten. */
function musikRuf(name,...a){ try{ if(typeof MUSIK!=='undefined'&&MUSIK[name]) return MUSIK[name](...a); }catch(e){} return undefined; }
function saftRuf(name,...a){ try{ if(typeof SAFT!=='undefined'&&SAFT[name]) SAFT[name](...a); }catch(e){} }

/* Naehe des naechsten Lehrers auf dieser Etage: 0 weit weg, 1 sehr nah. */
function lehrerNaehe(){
  let d=Infinity;
  for(const L of S.lehrer){ if(L.e===S.etage) d=Math.min(d,Math.abs(L.x-S.x)); }
  return isFinite(d)?Math.max(0,1-d/TUNE.musikNahe):0;
}

/* ==========================================================================
   WAS DIE KNOEPFE AM HANDY GERADE TUN
   nacht/mobil.js fragt das hier ab. Am Rechner sieht man an der Figur, was
   in Reichweite ist - am Handy ist der Daumen davor. Also sagt der Knopf,
   was er ausloest: TUER, SPIND, SUCHEN, REDEN.

   Die Lampe (Q) und der Wurf (R) waren am Handy vorher ueberhaupt nicht
   erreichbar, weil die feste Knopfleiste sie nicht kannte. Jetzt melden
   sie sich hier an - und nur dort, wo sie auch etwas bewirken.
   ========================================================================== */
function mobilKontext(){
  const ek=erzaehlKontext(); if(ek) return ek;
  if(S.modus==='titel')    return {aktion:'START',  zwei:null,
    extras:[{txt:'LEICHTER',code:'ArrowLeft'},{txt:'SCHWERER',code:'ArrowRight'}]};
  if(S.modus==='intro')    return {aktion:'WEITER', zwei:null};
  if(S.modus==='cutscene') return {aktion:'WEITER', zwei:null};
  if(S.modus==='gefangen') return {aktion:'WEITER', zwei:null};
  if(S.modus==='ende')     return {aktion:S.gewonnen?'WEITER':'NOCHMAL',zwei:null};
  if(S.modus==='pause')    return {aktion:null,     zwei:null};

  if(S.modus==='raum'){
    return { aktion: S.anTuerRaus ? 'RAUS'
           : S.nahesMoebel>=0 ? (S.durchsucht.has(S.raum+':'+S.nahesMoebel)?'LEER':'SUCHEN')
           : null,
             zwei:null,
             extras:[{txt:'LAMPE',code:'KeyQ'}] };
  }

  /* Korridor. Reihenfolge wie in der Aktionsaufloesung weiter unten -
     sonst steht auf dem Knopf etwas anderes, als er dann macht. */
  const hm=S.lehrer.find(L=>L.hausmeister&&L.hatSchluessel&&L.e===S.etage&&Math.abs(L.x-S.x)<14);
  const zuWeitVorne=tiefeAn()&&S.tiefe>TUNE.tuerTiefe;
  let was=null;
  if(S.codeOffen)            return {aktion:'PROBIEREN', zwei:null};
  if(amCodespind())          was=flag('ferdiSpindOffen')?'LEER':'CODE';
  else if(amPolaroid())      was='FOTO';
  else if(amAusgang(S.x))    was=S.hatSchluessel?'RAUS':'ZU';
  else if(hm)                 was=(hm.suchtX!=null||hm.abgelenkt>0)?'KLAUEN':'REDEN';
  else if(raumBei(S.etage,S.x)>=0)  was=zuWeitVorne?'NACH HINTEN':'TUER';
  else if(spindBei(S.etage,S.x)>=0) was=zuWeitVorne?'NACH HINTEN':'SPIND';

  const extras=[{txt:S.lampe?'LAMPE AUS':'LAMPE',code:'KeyQ'}];
  if(S.wurfAbkuehlung<=0) extras.push({txt:'WERFEN',code:'KeyR'});
  return { aktion:was, zwei:'SPRUNG', extras:extras };
}

const INTRO_SKIP=0.5;   // so lange halten, dann ist das Intro vorbei
function intro(dt){ S.szeneT+=dt;

function zeichneIntro(){

  ctx.fillStyle='#252b44'; ctx.fillRect(0,bodenY,W,1);
  /* Fenster mit tief stehender Sonne */
  const fx=m+44;
  ctx.fillStyle='#3d2a18'; ctx.fillRect(fx,56,44,40);
  ctx.fillStyle='#8a5a28'; ctx.fillRect(fx+2,58,40,36);
  ctx.fillStyle='#d98a3a'; ctx.fillRect(fx+2,58,40,14);
  ctx.fillStyle='#f0b45a'; ctx.beginPath(); ctx.arc(fx+30,76,7,0,7); ctx.fill();
  ctx.fillStyle='#3d2a18'; ctx.fillRect(fx+20,56,2,40); ctx.fillRect(fx,74,44,2);
  ctx.drawImage(verlauf('abendlicht',90,80,g=>{
    const gr=g.createLinearGradient(90,0,0,60);
    gr.addColorStop(0,'rgba(240,170,80,.20)'); gr.addColorStop(1,'rgba(240,170,80,0)');
    g.fillStyle=gr; g.fillRect(0,0,90,80); }), fx-46, 56);
  /* Tafel */
  ctx.fillStyle='#1a2a20'; ctx.fillRect(m-86,54,70,30);
  ctx.fillStyle='#6e7f74'; ctx.fillRect(m-78,62,44,1); ctx.fillRect(m-78,70,30,1);
  /* Uhr - Zeiger laufen */
  ctx.fillStyle='#2a3048'; ctx.beginPath(); ctx.arc(m-6,50,8,0,7); ctx.fill();
  ctx.fillStyle='#cfd6ea'; ctx.beginPath(); ctx.arc(m-6,50,6,0,7); ctx.fill();
  ctx.strokeStyle='#1a2030'; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(m-6,50); ctx.lineTo(m-6+Math.cos(t*1.6)*4,50+Math.sin(t*1.6)*4); ctx.stroke();
  /* Bankreihen */
  for(let i=0;i<4;i++){ const bx=26+i*62;

  /* Du sitzt hinten - Kopf sinkt langsam */
  const sink=Math.min(3,Math.max(0,(S.szene<2? Math.sin(t*.8)*2+2 : 0)));
  sprite(SPR.steh, 44, bodenY-13+sink);

    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(introText(S.szene),H-24,P.weiss);
  if(!IS_TOUCH&&Math.floor(t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
  zeichneUeberspringen(S.skipT,INTRO_SKIP);
}

const raumBei=(e,x)=>RAEUME.findIndex(r=>r.e===e && Math.abs(r.x-x)<12);

/* ---- Nachricht ausloesen. Jede Kategorie hat mehrere Zeilen, jede
   wird nur einmal benutzt, damit sich nichts wiederholt. ---- */
function nachricht(art){
  const liste=NACHRICHTEN[art]; if(!liste) return;
  S.genutzt=S.genutzt||{}; S.genutzt[art]=S.genutzt[art]||0;
  if(S.genutzt[art]>=liste.length) return;
  const n=liste[S.genutzt[art]++];
  S.chat.push({...n,alter:0});
  if(S.chat.length>3) S.chat.shift();
  if(S.stumm){ piep(200,.02,'sine',.01); return; }
  /* Vibration ist laut - genau das ist der Preis fuers Mithoeren. */
  S.vibriert=.9; rauschen(.16,.05);
  if(S.modus==='spiel') hilfeTipp('vibration','VIBRIERT - DAS HOEREN SIE. H: AUS','DEIN HANDY VIBRIERT - DAS HOEREN SIE');
  if(S.modus==='spiel'&&S.imSpind<0) laerm(S.x,S.etage,TUNE.vibrationWeite);
}

/* ---- Handy ---- */
function lampeSchalten(){
  if(S.modus!=='spiel'&&S.modus!=='raum') return;
  if(!S.lampe && S.akku<=0){ meldung('AKKU LEER',1.2); SFX.nichts(); return; }
  S.lampe=!S.lampe; piep(S.lampe?880:440,.05,'sine',.04);
  meldung(S.lampe?'TASCHENLAMPE AN':'TASCHENLAMPE AUS',1);
  if(S.lampe) hilfeTipp('lampe','LAMPE AN: SIE SEHEN DICH WEITER','LAMPE AN: SIE SEHEN DICH WEITER');
}
/* ---- Laerm: Lehrer gehen dem Geraeusch nach ----
   brichtJagd=true nur beim Wurf: ein Geraeusch weit weg von dir kann
   eine laufende Verfolgung abbrechen. Genau dafuer wirft man. */
function laerm(x,etage,weite,brichtJagd=false){
  for(const L of S.lehrer){
    if(L.e!==etage) continue;
    if(Math.abs(L.x-x)>=weite) continue;
    if(L.jagd>0){
      if(!brichtJagd) continue;
      if(Math.abs(x-S.x)<50) continue;      // direkt vor die Fuesse geworfen bringt nichts
      L.jagd=0; L.gesehenPiep=false; L.verdacht=.4;
      meldung('ER GEHT DEM NACH',1.2);
    } else {
      L.verdacht=Math.min(1,L.verdacht+.15);
    }
    L.suchtX=x;
  }
}
/* ---- Werfen: macht Laerm woanders, damit du hier durchkommst ---- */
function wirf(){
  if(S.modus!=='spiel'||S.wurfAbkuehlung>0||S.wurf) return;
  /* Flugbahn aus TUNE.wurfWeite berechnen, statt feste Werte zu raten.
     Vorher flog der Gegenstand nur 43 statt der eingestellten 96 Pixel -
     er landete zwischen dir und dem Lehrer und zog ihn zu dir hin. */
  const T=0.6, hoehe=10, g=760;
  S.wurf={ x:S.x+4, y:S.y-hoehe, e:S.etage,
           vx:S.blick*(TUNE.wurfWeite/T),
           vy:(hoehe-(g/2)*T*T)/T };
  S.wurfAbkuehlung=TUNE.wurfAbkuehlung;
  piep(300,.05,'triangle',.03);
  meldung('GEWORFEN',.8);
}

function rein(i){
  S.imSpind=i; S.vx=0; S.x=SPINDE[i].x+1; SFX.tuer();
  meldung('VERSTECKT',1.2);
  /* Wer schon jagt, verliert die Spur - aber er sucht weiter in der Naehe. */
  S.lehrer.forEach(L=>{ if(L.e===S.etage) L.verdacht=0; });
  hilfeTipp('spind-sicher','IM SPIND BIST DU SICHER','IM SPIND BIST DU SICHER');
}
function raus(){
  S.imSpind=-1; S.spindAbkuehlung=TUNE.spindAbkuehlung; SFX.tuer();
  meldung('RAUS AUS DEM SPIND',1);
}
const anTreppe=x=>Math.abs(x-TREPPE_L)<22 || Math.abs(x-TREPPE_R)<22;
const amAusgang=x=>S.etage===AUSGANG.e && Math.abs(x-AUSGANG.x)<13;

/* Wohin der Schluessel zeigt - haengt an der Spielart der Runde.

const zielEtage=()=>S.variante==='hausmeister'?0:(RAEUME[S.schluesselRaum]||{e:0}).e;

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  if(erzaehlTakt(dt)) return;
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;

  if(S.modus==='intro'){ intro(dt); return; }
  /* Laeuft ein Gespraech, steht der Rest still - sonst laeuft dir ein
     Lehrer waehrend der Antwortauswahl in den Ruecken. */
  if(gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  if(S.codeOffen){ aktionPuffer.length=0; lehrerLogik(dt); return; }
  fluchtPruefen();
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt,true); return; }
  if(S.modus==='ende'){ S.zeit+=dt; return; }
  if(S.modus==='gefangen'){ S.szeneT+=dt; return; }

  S.zeit+=dt;
  if(S.unverwundbar>0) S.unverwundbar-=dt;
  if(fluchtTakt(dt)) return;

  if(S.modus==='spiel'&&S.zeit>4) hilfeTipp('schleichen','SHIFT: LEISE - SIE SEHEN DICH SPAETER','STICK HALB: LEISE - SIE SEHEN DICH SPAETER');
    if(S.modus==='spiel'&&S.variante!=='hausmeister'&&S.zeit>40&&S.hinweisStufe===0) hilfeTipp('zettel-tipp','TIPP: IN DEN RAEUMEN LIEGEN ZETTEL','TIPP: IN DEN RAEUMEN LIEGEN ZETTEL');
    if(S.modus==='spiel'&&S.lehrer.some(L=>L.hausmeister&&L.hatSchluessel&&L.e===S.etage&&Math.abs(L.x-S.x)<80)) hilfeTipp('hausmeister','R WIRFT: ER GEHT NACHSEHEN. DANN E: KLAUEN','WERFEN: ER GEHT NACHSEHEN. DANN KLAUEN');
  if(S.modus==='raum'){ imRaum(dt); kamera(dt,true); return; }

  if(S.spindAbkuehlung>0) S.spindAbkuehlung=Math.max(0,S.spindAbkuehlung-dt);
  if(S.stromAus>0){ S.stromAus-=dt; if(S.stromAus<=0) meldung('DAS LICHT IST WIEDER AN',1.6); }
  if(S.wurfAbkuehlung>0)  S.wurfAbkuehlung=Math.max(0,S.wurfAbkuehlung-dt);
  if(S.vibriert>0)        S.vibriert-=dt;

  /* Die Uhr laeuft. Um 17:30 schliesst der Hausmeister endgueltig ab. */
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/(TUNE.levelSekunden*schwer().frist)*spanne);
  if(!S.zeitWarnung && S.minute>=TUNE.endMinute-15){
    S.zeitWarnung=true; zeigeHinweis('17:15 - GLEICH SCHLIESST ER AB',3.4); SFX.alarm();
  }
  if(S.minute>=TUNE.endMinute && S.modus!=='cutscene'){
    S.modus='ende'; S.gewonnen=false; S.faenger='DER HAUSMEISTER HAT ABGESCHLOSSEN';
    SFX.gefangt(); musikRuf('stinger','fail'); return;
  }

  /* Akku und Taschenlampe */
  if(S.lampe){ S.akku=Math.max(0,S.akku-TUNE.akkuProSek*dt);
    if(S.akku<=0){ S.lampe=false; meldung('AKKU LEER',1.6); SFX.nichts(); } }

  /* Erste Nachricht kurz nach dem Start, spaeter nur noch per Ereignis */
  if(!S.startNachricht && S.zeit>5){ S.startNachricht=true; nachricht('start'); }
  if(!S.knappNachricht && S.minute>=TUNE.endMinute-18){ S.knappNachricht=true; nachricht('knapp'); }
  for(const c of S.chat) c.alter+=dt;
  if(S.boost>0) S.boost-=dt;

  /* Geworfener Gegenstand fliegt und macht beim Aufschlag Laerm */
  if(S.wurf){
    const w=S.wurf; w.vy+=760*dt; w.x+=w.vx*dt; w.y+=w.vy*dt;
    if(w.y>=BODEN[w.e]){
      laerm(w.x,w.e,TUNE.laermWeite,true);
      rauschen(.12,.06); piep(180,.06,'square',.04);
      staub(w.x,BODEN[w.e],6);
      if(w.e===S.etage) saftRuf('treffer',w.x-S.kamX,BODEN[w.e]-S.kamY,0,0.25);
      S.wurf=null;
    } else if(w.x<0||w.x>LEVEL_B) S.wurf=null;
  }

  /* Ab und zu faellt der Strom im Gang kurz aus. Rein atmosphaerisch,
     aber es macht aus dem Schulflur einen Ort, an dem man nicht sein will. */
  if(S.dunkelT>0) S.dunkelT-=dt;
  else if(Math.random()<0.055*dt){ S.dunkelT=0.4+Math.random()*1.1; rauschen(.12,.03); }

  /* ---------- Im Spind: nur rauskommen geht ---------- */
  if(S.imSpind>=0){
    while(aktionPuffer.length){ aktionPuffer.shift(); raus(); }
    lehrerLogik(dt); kamera(dt,false); return;
  }

  /* ---------- Korridor ---------- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  S.schleicht = schleichAn && S.amBoden;
  const hoechst = TUNE.gehTempo*(S.schleicht?TUNE.schleichTempo:1)
                *tempoBonus()*(S.boost>0?1.35:1);
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx += richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx = Math.abs(S.vx)<=brems ? 0 : S.vx-Math.sign(S.vx)*brems;
  }
  S.x += S.vx*dt;
  S.x = Math.max(14, Math.min(LEVEL_B-14, S.x));

  /* Schrittgeraeusch - beim Schleichen bleibt es still */
  /* tempo2D statt nur vx: auch wer nach hinten oder vorne laeuft, bewegt
     die Beine. Vorher glitt die Figur dabei steif durchs Bild. */
  if(S.amBoden&&tempo2D(S.vx,S.vt)>12){
    S.gehPhase += tempo2D(S.vx,S.vt)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0&&!S.schleicht) SFX.schritt(); }
  }

  /* Sprung */
  while(sprungPuffer.length && S.t-sprungPuffer[0]>=0){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); staub(S.x,S.y,5);
    }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  const boden=BODEN[S.etage];
  if(S.y>=boden){
    S.y=boden;
    if(!S.amBoden){
      SFX.landen(); staub(S.x,S.y,7); saftRuf('landung',S.x-S.kamX,S.y-S.kamY,0.4);
      /* Landen ist laut. Damit wird Sprungspammen zum Risiko statt zum
         Trick - vorher war es die sicherste Fortbewegung im Spiel. */
      /* Hoerweite muss ueber der Sichtweite liegen, sonst merkt man das
         Risiko nie - man wird eh vorher gesehen. */
      /* schleichAn statt S.schleicht: S.schleicht ist in der Luft immer
         falsch, sonst waere leises Landen gar nicht moeglich. */
      if(!schleichAn) laerm(S.x,S.etage,TUNE.laermWeite*0.8);
    }
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t;
  }
  else S.amBoden=false;

  /* Treppe: hoch und runter.
     Klammern sind hier wichtig - && bindet staerker als ||, sonst haengt
     die halbe Bedingung am falschen Zweig. */
  const treppe = S.amBoden && anTreppe(S.x);
  const runterAn = !!(keys['ArrowDown'] || keys['KeyS']) || touchRunterAn;

  /* Tiefe. W und S sind kontextabhaengig: an der Treppe wechseln sie die
     Etage wie frueher, ueberall sonst gehen sie nach hinten und vorne.
     Das spart zwei zusaetzliche Knoepfe am Handy.

     ACHTUNG, hier steht bewusst KEIN bewegeTiefe(S,...): die Engine-Funktion
     schreibt auf e.t - und S.t ist in diesem Level die Spielzeit. Der Aufruf
     hat die Uhr jeden Frame ueberschrieben und auf 0..1 geklemmt, wodurch
     alle Animationen praktisch stehen blieben. Deshalb hier ausgeschrieben
     auf S.tiefe. */
  /* In diesem Level ist die Tiefe aus (siehe TIEFE_PRO_SEITE in welt.js):
     die Schule lebt von Sicht, Laerm und Timing, nicht vom Ausweichen zur
     Seite. W und S sind hier nur noch die Treppe. */
  if(!treppe&&tiefeAn()){
    const rt=(runterAn?1:0)-(hochAn?1:0);
    const langsam=S.schleicht?0.55:1;
    const zielVt=rt*TUNE.tiefeTempo*langsam;
    S.vt += (zielVt-S.vt)*Math.min(1,14*dt);
    S.tiefe = Math.max(0,Math.min(1,S.tiefe+S.vt*dt));
  }

  if(treppe && hochAn && S.etage < BODEN.length-1){
    S.etage++; S.y=BODEN[S.etage]; S.vy=0; hochAn=false;
    SFX.landen(); meldung('ETAGE '+(S.etage+1),1); nachricht('etage');
  } else if(treppe && runterAn && S.etage > 0){
    S.etage--; S.y=BODEN[S.etage]; S.vy=0;
    keys['ArrowDown']=false; keys['KeyS']=false; touchRunterAn=false;
    SFX.landen(); meldung('ETAGE '+(S.etage+1),1); nachricht('etage');
  }

  /* Aktion: Ausgang, Tuer oder Spind */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    const ri=raumBei(S.etage,S.x), si=spindBei(S.etage,S.x);
    const hm=S.lehrer.find(L=>L.hausmeister&&L.hatSchluessel&&L.e===S.etage&&Math.abs(L.x-S.x)<14);
    if(amCodespind()){ codeOeffnen(); }
    else if(amPolaroid()){
      if(MOMENT.fund(1)){ S.polaroidRunde=true; saftRuf('fund',S.x-S.kamX,S.y-S.kamY-14,'POLAROID'); }
    }
    else if(amAusgang(S.x)){
      if(S.hatSchluessel&&S.erwischtZahl>0&&!S.direktorGesprochen){
        S.direktorGesprochen=true;
        starteGespraech(DIREKTOR_AUSGANG,'start',()=>starteCutscene());
      }
      else if(S.hatSchluessel){ starteCutscene(); }
      else { meldung('ABGESCHLOSSEN'); SFX.nichts(); }
    } else if(hm){
      /* Zwei Wege: ablenken und zugreifen - oder ihn ansprechen.
         Wer ihn anschaut, waehrend er hinschaut, redet eben. */
      if(!(hm.suchtX!=null||hm.abgelenkt>0)){ starteHausmeisterGespraech(hm); }
      else if(hm.suchtX!=null||hm.abgelenkt>0){
        hm.hatSchluessel=false; S.hatSchluessel=true;
        SFX.fund(); S.blitz=1; nimmDing('SCHLUESSEL'); saftRuf('fund',S.x-S.kamX,S.y-S.kamY-14,'SCHLUESSEL');
        meldung('SCHLUESSEL VOM GUERTEL GEZOGEN',2.4); meldung('ROTE WOLLE AM SCHLUESSEL.',2);
        zeigeHinweis('RAUS HIER - ERDGESCHOSS',3);
      } else { meldung('ER SCHAUT DIREKT HIN'); SFX.nichts(); }
    } else if(ri>=0){
      /* Tueren liegen an der Rueckwand - man muss hin. */
      if(tiefeAn()&&S.tiefe>TUNE.tuerTiefe){ meldung('ZU WEIT VORNE - NACH HINTEN'); SFX.nichts(); }
      else betreteRaum(ri);
    }
    else if(si>=0){
      if(tiefeAn()&&S.tiefe>TUNE.tuerTiefe){ meldung('ZU WEIT VORNE - NACH HINTEN'); SFX.nichts(); }
      else
      if(S.spindAbkuehlung>0){ meldung('NOCH '+Math.ceil(S.spindAbkuehlung)+' SEKUNDEN'); SFX.nichts(); }
      else rein(si);
    }
  }

  lehrerLogik(dt);
  kamera(dt,false);
}

/* ---- Raum betreten und verlassen ---- */
function betreteRaum(i){
  const ersterRaum=S.entdeckt.size===0;
  S.raum=i; S.modus='raum'; S.raumX=W/2; S.suchT=0; S.suchZiel=-1;
  S.entdeckt.add(i); SFX.tuer(); S.blende=1;
  meldung(RAEUME[i].name,1.4);
  if(ersterRaum) nachricht('raum');
}
function verlasseRaum(){
  S.modus='spiel'; S.raum=null; SFX.tuer(); S.blende=1; S.vx=0;
}
function imRaum(dt){
  if(S.blende>0) S.blende=Math.max(0,S.blende-dt*3);
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  S.raumX += richtung*TUNE.gehTempo*.8*dt;
  const links=42, rechts=W-42;
  S.raumX=Math.max(links,Math.min(rechts,S.raumX));
  if(richtung&&Math.random()<.06) SFX.schritt();

  const r=RAEUME[S.raum];
  const plaetze=moebelPlaetze(r);
  let nah=-1;
  plaetze.forEach((p,i)=>{ if(Math.abs(p.x+8-S.raumX)<14) nah=i; });
  const anTuerRaus = S.raumX<=links+2;

  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0){
      S.durchsucht.add(S.raum+':'+S.suchZiel);
      const zettel=S.zettel.find(z=>z.raum===S.raum&&z.moebel===S.suchZiel&&!z.gefunden);
      const fund=S.funde.find(f=>f.raum===S.raum&&f.moebel===S.suchZiel&&!f.gefunden);
      if(S.raum===S.handyRaumNr && S.suchZiel===TUNE.handyMoebel && !S.handyGeholt){
        /* Dein eingezogenes Handy. Rein optional - aber ohne das bleibt
           die restliche Nacht ohne Nachrichten, siehe setzeFlag unten. */
        S.handyGeholt=true; SFX.fund(); S.blitz=1;
        setzeFlag('handyZurueck');
        aendereWert('ruf',5);
        meldung('DEIN HANDY - EINGEZOGEN UND WIEDER DA',2.6);
        zeigeHinweis('JETZT SCHREIBEN DIR DIE JUNGS WIEDER',3);
      } else if(S.raum===S.schluesselRaum && S.suchZiel===S.schluesselMoebel && !S.hatSchluessel){
        S.hatSchluessel=true; SFX.fund(); S.blitz=1; nimmDing('SCHLUESSEL'); saftRuf('fund',W/2,50,'SCHLUESSEL');
        meldung('SCHLUESSEL GEFUNDEN',2.4); meldung('ROTE WOLLE AM SCHLUESSEL.',2); zeigeHinweis('RAUS HIER - ERDGESCHOSS',3);
        nachricht('schluessel');
      } else if(RAEUME[S.raum].moebel[S.suchZiel]==='sicherung'){
        /* Der Sicherungskasten: der Flur wird dunkel. Die Lehrer sehen
           dann nur noch halb so weit - mit Lampe an bist du trotzdem ein
           Leuchtturm. */
        S.stromAus=TUNE.stromAusDauer; SFX.alarm(); S.blitz=.2;
        S.durchsucht.delete(S.raum+':'+S.suchZiel);
        meldung('SICHERUNG RAUS - DER FLUR IST DUNKEL',2.6);
      } else if(zettel){
        zettel.gefunden=true;
        S.hinweisStufe++;                     // erster Fund = Etage, zweiter = Raum
        SFX.fund(); S.blitz=.5; saftRuf('fund',W/2,50,'ZETTEL');
        meldung(S.hinweisStufe===1?'ZETTEL GEFUNDEN':'NOTIZ GEFUNDEN',1.6);
        zeigeHinweis(zielText(S.hinweisStufe),4);
        hilfeTipp('zettel','ZETTEL VERRATEN, WO DER SCHLUESSEL IST','ZETTEL VERRATEN, WO DER SCHLUESSEL IST'); HILFE.ziel(zielText(S.hinweisStufe));
        nachricht('zettel');
      } else if(fund){
        fund.gefunden=true; SFX.fund(); S.blitz=.35; saftRuf('fund',W/2,50,'FUND');
        if(fund.art==='akku'){ S.akku=Math.min(100,S.akku+40); meldung('AKKU +40',1.6); }
        else if(fund.art==='energie'){ S.boost=8; meldung('ENERGYDRINK - SCHNELLER',1.8); }
        else if(fund.art==='code'){ S.codeBekannt=true;
          meldung('ZETTEL: FERDIS SPIND, ETAGE 3 - '+S.code.join(' '),5); }
        else { meldung(pick(NOTIZEN),2.6); }
      } else { SFX.nichts(); meldung('NICHTS DRIN',1); }
    }
    return;
  }
  while(aktionPuffer.length){
    aktionPuffer.shift();
    if(anTuerRaus){ verlasseRaum(); return; }
    if(nah>=0){
      if(S.durchsucht.has(S.raum+':'+nah)){ meldung('SCHON DURCHSUCHT',1); SFX.nichts(); }
      else { S.suchT=TUNE.suchDauer; S.suchZiel=nah; SFX.suchen(); }
    }
  }
  S.nahesMoebel=nah; S.anTuerRaus=anTuerRaus;
}

    for(let i=-n;i<=n;i++) for(let y=y0;y<H;y++){ const f=(y-y0)/hgt; g.fillRect(Math.round(cx+i*(sp0+(sp1-sp0)*f)),y,1,1); }

function moebelPlaetze(r){

/* ---- Lehrer ---- */
function lehrerLogik(dt){
  let jagt=false;
  const fl = S.fluchtAn ? TUNE.fluchtTempo : 1;    // in der Flucht sind alle schneller
  for(const L of S.lehrer){
    const tempo   = (L.chef?TUNE.chefTempo:TUNE.lehrerTempo)*fl;
    const jagdT   = (L.chef?TUNE.chefJagdTempo:TUNE.jagdTempo)*fl;
    const weite   = L.chef?TUNE.chefSicht:TUNE.sichtWeite;
    const dauer   = L.chef?TUNE.chefJagdDauer:TUNE.jagdDauer;
    if(L.jagd>0){
      if(L.routine){ L.routine=null; L.weg=false; }
      jagt=true; L.jagd-=dt;
      const dir=Math.sign(S.x-L.x)||1;
      L.v=dir; L.x+=dir*jagdT*dt;
      L.x=Math.max(20,Math.min(LEVEL_B-20,L.x));
      /* Der Direktor folgt dir auch die Treppe hoch */
      if(L.chef && L.e!==S.etage && anTreppe(L.x)){ L.e+=Math.sign(S.etage-L.e); }
      if(L.e===S.etage && S.modus==='spiel' && S.imSpind<0
         && Math.abs(L.x-S.x)<TUNE.fangDistanz) gefangen(L);
    } else if(L.suchtX!=null){
      /* Geht einem Geraeusch nach - der eigentliche Nutzen vom Werfen */
      const d=L.suchtX-L.x;
      L.v=Math.sign(d)||1;
      L.x+=L.v*TUNE.suchTempo*dt;
      if(Math.abs(d)<6){ L.suchtX=null; L.v=Math.random()<.5?1:-1;
        /* Am Zielort schaut sich JEDER noch kurz um - das ist dein
           Zeitfenster, nicht nur beim Hausmeister. */
        L.abgelenkt=2.6; }
    } else if(L.routine){
      /* Routine: hingehen, dort stehen und wegschauen. Am Klo ist er ganz
         weg - das ist das groesste Fenster im Level. */
      const r=L.routine, d=r.x-L.x;
      if(!r.da){
        if(Math.abs(d)>3){ L.v=Math.sign(d); L.x+=L.v*tempo*1.1*dt; }
        else { r.da=true; r.rest=r.dauer; L.v=-(Math.sign(S.x-L.x)||1)*0.001; }
      } else {
        r.rest-=dt; L.abgelenkt=Math.max(L.abgelenkt||0,0.2);
        if(r.rest<=0){ L.routine=null; L.weg=false; L.v=Math.random()<.5?1:-1;
          L.routineT=TUNE.routinePauseMin+Math.random()*(TUNE.routinePauseMax-TUNE.routinePauseMin); }
        else if(r.weg) L.weg=true;
      }
    } else if(L.pause>0){
      /* Stehenbleiben und sich umschauen. Ohne das laufen sie wie auf
         Schienen und sind auf die langweilige Art berechenbar. */
      L.pause-=dt;
      if(!L.umgedreht && L.pause<L.pauseDauer*0.5){ L.umgedreht=true; L.v*=-1; }
      if(L.pause<=0){ L.umgedreht=false; }
    } else {
      if(L.abgelenkt>0) L.abgelenkt-=dt;
      /* Zeit fuer die Routine? Nur normale Lehrer - Direktor und Hausmeister
         haben andere Sorgen. */
      if(!L.chef&&!L.hausmeister&&(L.routineT-=dt)<=0){
        const ziel=ROUTINEN.find(r=>r.e===L.e);
        if(ziel){ L.routine={...ziel, da:false, rest:0}; continue; }
      }
      L.x+=L.v*tempo*dt;
      /* dreht=false am Rand: dort ist die Richtung schon korrigiert.
         Wuerde die Pause sie nochmal umdrehen, liefe er sofort wieder
         aus dem Bereich und pausierte endlos - 92 Prozent Stillstand. */
      const halt=(dreht)=>{ L.pauseDauer=0.7+Math.random()*1.1;
                            L.pause=L.pauseDauer; L.umgedreht=!dreht; };
      if(L.x<L.von){ L.x=L.von; L.v=1; halt(false); }
      else if(L.x>L.bis){ L.x=L.bis; L.v=-1; halt(false); }
      /* Und ab und zu mittendrin kurz zurueckschauen */
      else if(Math.random()<0.05*dt) halt(true);
      /* Der Direktor wechselt regelmaessig die Etage */
      if(L.chef){
        L.wechselT-=dt;
        if(L.wechselT<=0 && anTreppe(L.x)){
          const richtung = L.e===0?1 : L.e===BODEN.length-1?-1 : (Math.random()<.5?1:-1);
          L.e+=richtung; L.wechselT=TUNE.chefEtagenWechsel;
          if(L.e===S.etage){ SFX.gesehen(); meldung('SCHRITTE IM TREPPENHAUS',1.6); }
        }
      }
    }
    /* Sicht - nur im Korridor, Raeume und Spinde sind sicher.
       Schleichen halbiert die Reichweite. */
    /* Licht macht dich weithin sichtbar - das ist der Preis der Lampe.
       Wer abgelenkt ist, schaut gerade woanders hin. */
    const abgelenkt = L.abgelenkt>0 || L.suchtX!=null;
    const dunkel = S.stromAus>0 && !S.lampe;
    const reichweite = L.weg ? 0 :
                       weite*(S.schleicht?TUNE.schleichSicht:1)
                     *(S.lampe?TUNE.lampeSichtBonus:1)*(abgelenkt?0.35:1)
                     *(dunkel?TUNE.stromAusSicht:1);
    /* KEINE Hoehenpruefung mehr. Die Etage trennt bereits sauber, und die
       alte Pruefung auf 22 Pixel machte einen Sprung von 34 Pixeln
       faktisch unsichtbar - dadurch kam man durch reines Sprungspammen
       an jedem Lehrer vorbei. */
    /* Sichtkegel in der Flaeche statt auf der Linie. Wer weit genug
       vorne oder hinten laeuft, ist ausserhalb - das ist der eigentliche
       Gewinn der Tiefe. Die seitliche Grenze steckt in welt.js. */
    const wache={x:L.x,t:L.t,blick:Math.sign(L.v)||1};
    const sichtbar = S.modus==='spiel' && S.imSpind<0 && L.e===S.etage
      && imSichtkegel(wache,{x:S.x,t:S.tiefe},reichweite,TUNE.kegelOeffnung||0.5);
    if(sichtbar){
      L.verdacht=Math.min(1,L.verdacht+TUNE.verdachtProSek*schwer().verdacht*dt);
    if(L.verdacht>.05&&HILFE.lernt('verdacht')){ HILFE.zaehle('verdacht'); saftRuf('zeitlupe',0.5,0.8); hilfeTipp('verdacht','BALKEN VOLL: ER JAGT DICH. GEH WEG!','BALKEN VOLL: ER JAGT DICH. GEH WEG!'); }
    if(L.chef) hilfeTipp('direktor','DER DIREKTOR SIEHT WEITER UND FOLGT DIR','DER DIREKTOR SIEHT WEITER UND FOLGT DIR');
      if(!L.gesehenPiep&&L.verdacht>.25){ L.gesehenPiep=true; SFX.gesehen(); }
      if(L.verdacht>=1&&L.jagd<=0){ L.jagd=dauer; SFX.alarm(); S.ruettel=L.chef?6:4; S.alarme++;
        saftRuf('trauma',(L.chef?6:4)/12);
        if(L.e===S.etage) saftRuf('popup','!',L.x-S.kamX,BODEN[L.e]-S.kamY-44,'#ff4d6d');
        meldung(L.chef?'DER DIREKTOR HAT DICH':'ER HAT DICH',1.6);
        hilfeTipp('jagd','LAUF - ODER E AM SPIND: VERSTECK','LAUF - ODER AB IN DEN SPIND: VERSTECK'); }
    } else {
      L.verdacht=Math.max(0,L.verdacht-TUNE.verdachtAbbau*dt);
      if(L.verdacht<=0) L.gesehenPiep=false;
    }
  }
  S.lehrerJagt=jagt;
}

            : L&&L.hausmeister ? 'DER HAUSMEISTER HAT DICH'

/* ---- Kamera ---- */
function kamera(dt,sanft){
  const zielX = Math.max(0, Math.min(LEVEL_B-W, S.x - W/2 + S.blick*TUNE.blickVoraus));
  const zielY = S.y - H*0.62;
  const f = Math.min(1, TUNE.kameraTraegheit*dt);
  S.kamX += (zielX-S.kamX)*f;
  S.kamY += (zielY-S.kamY)*f;
}

let STAUB=[];
function staub(x,y,n){ if(!TUNE.staub) return;
  for(let i=0;i<n;i++) STAUB.push({x,y,vx:(Math.random()-.5)*34,vy:-Math.random()*18,
    leben:.28+Math.random()*.3,max:.58}); }
function staubUpdate(dt){ for(const p of STAUB){ p.leben-=dt; p.vy+=110*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  STAUB=STAUB.filter(p=>p.leben>0); }

/* Abschluss des Levels - egal ob durchgesehen oder uebersprungen. */
function levelGeschafft(){
  speichereCrew('MAX FERDI');
  if(typeof ERFOLG!=='undefined'&&S.alarme===0) ERFOLG.gib('l1_unsichtbar');
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  musikRuf('stinger','sieg');
  saftRuf('fund',W/2,60,'SCHULE GESCHAFFT');
  rangSchluss();
}
/* Rang: vier Kriterien, je linear zwischen schlecht und gut (TUNE.rang). Summe 100. */
function rangSchluss(){
  if(typeof WERTUNG==='undefined'||!WERTUNG.abschluss) return;
  const R=TUNE.rang, lin=(w,schlecht,gut)=>Math.max(0,Math.min(1,(w-schlecht)/(gut-schlecht)));
  const gefunden = S.zettel.filter(z=>z.gefunden).length + S.funde.filter(f=>f.gefunden).length
                 + (S.polaroidRunde?1:0);
  const zaehl = S.zettel.length + S.funde.length + (S.momentSchonDa?0:1);
  const anteil = zaehl>0 ? gefunden/zaehl : 0;
  const pZeit  = Math.round(40*lin(S.zeit, R.zeitSchlecht, R.zeitGut));
  const pAlarm = Math.round(30*lin(S.alarme, R.alarmSchlecht, 0));
  const pHerz  = Math.round(15*lin(S.hp, 0, TUNE.leben+schwer().leben));
  const pFunde = Math.round(15*lin(anteil, 0, R.fundeGut));
  const m=Math.floor(S.zeit/60), s=Math.floor(S.zeit%60);
  const zeilen=[
    {name:'ZEIT',   wert:m+':'+String(s).padStart(2,'0'), pkt:pZeit},
    {name:'ALARM',  wert:String(S.alarme),                pkt:pAlarm},
    {name:'HERZEN', wert:S.hp+'/'+(TUNE.leben+schwer().leben),             pkt:pHerz},
    {name:'FUNDE',  wert:gefunden+'/'+zaehl,              pkt:pFunde},
  ];
  try{ WERTUNG.abschluss(1, pZeit+pAlarm+pHerz+pFunde, zeilen); }catch(e){}
}

function cutscene(dt){
  /* E halten ueberspringt die ganze Szene. 35 Sekunden beim fuenften
     Anlauf sind eine Strafe, keine Belohnung. */
  if(aktionGehalten){
    S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); SFX.gewonnen(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  const s=SZENEN[S.szene];
  if(S.szene<=1) S.dirX += (S.x+30 - S.dirX)*Math.min(1,3*dt);
  if(S.szene===5){ S.packT=Math.min(1,S.packT+dt*2.6);
    if(S.packT>=1&&!S.packSound){ S.packSound=true; SFX.packen(); S.ruettel=6; S.blitz=.8; saftRuf('trauma',6/12); } }
  if(S.szene===7){ S.dirX += 220*dt; S.dirY -= 40*dt; }
  /* Max Ferdi laeuft von rechts ins Bild */
  if(S.szene>=SZENE_DRAUSSEN+1){
    if(!S.maxDa){ S.maxDa=true; S.maxX=S.x+150; SFX.gesehen(); }
    const ziel=S.x+34;
    if(S.maxX>ziel) S.maxX=Math.max(ziel,S.maxX-130*dt);
  }
  /* Freischaltung */
  if(S.szene===SZENE_DRAUSSEN+7 && !S.crewGespeichert){
    S.crewGespeichert=true; speichereCrew('MAX FERDI'); S.blitz=.9; SFX.fund();
  }
  if(S.szeneT>=s.d){
    S.szene++; S.szeneT=0;
    if(S.szene===SZENE_DRAUSSEN) S.blende=1;          // Schnitt nach draussen
    if(S.szene>=SZENEN.length){
      S.modus='ende'; S.gewonnen=true; SFX.gewonnen(); levelGeschafft();
    }
  }
}

const DIALOG_OBEN = H-40;                 // ab hier liegt der Textkasten
function zeichneDraussen(){
  /* Boden bewusst deutlich ueber dem Textkasten, sonst stehen die Figuren
     mit den Fuessen im Dialog. Genau das war vorher der Fall. */
  const bodenY = DIALOG_OBEN - 26;
  ctx.fillStyle='#0d1024'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(verlauf('abendhimmel',W,bodenY,g=>{
    const gr=g.createLinearGradient(0,0,0,bodenY);
    gr.addColorStop(0,'#150f36'); gr.addColorStop(.55,'#4a2a48'); gr.addColorStop(1,'#9a5230');
    g.fillStyle=gr; g.fillRect(0,0,W,bodenY); }),0,0);
  for(let i=0;i<34;i++){ const x=(i*97)%W, y=(i*41)%46;
    ctx.fillStyle=i%5===0?'#ffffff66':'#ffffff26'; ctx.fillRect(x,y,1,1); }

  /* Schulgebaeude links, endet ueber dem Boden */
  const gebH=bodenY-24;
  ctx.fillStyle='#141828'; ctx.fillRect(0,24,116,gebH);
  ctx.fillStyle='#232a44'; ctx.fillRect(0,24,116,2);
  for(let y=34;y<bodenY-12;y+=15) for(let x=8;x<104;x+=20){
    ctx.fillStyle=((x+y)%3===0)?'#3f4a72':'#0e1120'; ctx.fillRect(x,y,13,8); }
  /* offenes Fenster, aus dem Max gestiegen ist */
  ctx.fillStyle='#4a5580'; ctx.fillRect(24,bodenY-26,20,15);
  ctx.fillStyle='#090b12'; ctx.fillRect(26,bodenY-24,16,11);
  ctx.fillStyle='#6a76a0'; ctx.fillRect(24,bodenY-27,20,1);
  sprite(SPR.tuer,92,bodenY-12);

  /* Boden und Zaun */
  ctx.fillStyle='#101320'; ctx.fillRect(0,bodenY,W,H-bodenY);
  ctx.fillStyle='#2e3550'; ctx.fillRect(0,bodenY,W,1);
  ctx.fillStyle='#1d2233';
  for(let x=126;x<W;x+=9) ctx.fillRect(x,bodenY-18,2,18);
  ctx.fillRect(126,bodenY-18,W-126,2);

  /* Strassenlaterne rechts */
  sprite(SPR.lampe,W-42,26);
  ctx.drawImage(verlauf('laternendraussen',80,80,g=>{
    const gr=g.createRadialGradient(40,5,2,40,5,64);
    gr.addColorStop(0,'rgba(255,220,150,.20)'); gr.addColorStop(1,'rgba(255,220,150,0)');
    g.fillStyle=gr; g.fillRect(0,0,80,80); }),W-82,26);

  /* Du - links von der Mitte, damit Max rechts Platz hat */
  const spielerX=Math.round(W*0.30);
  outline(SPR.steh,spielerX,bodenY-13,1,.6);
  sprite(SPR.steh,spielerX,bodenY-13);

  /* Max Ferdi */
  if(S.maxDa){
    const mx=Math.round(spielerX+(S.maxX-S.x));
    const laeuft=Math.abs(mx-(spielerX+34))>2;
    const rows=laeuft?SPR.geh[Math.floor(S.t*10)%4]:SPR.steh;
    outline(rows,mx,bodenY-13,1,.6);
    sprite(rows,mx,bodenY-13);
    ctx.fillStyle=P.neon2; ctx.fillRect(mx+2,bodenY-9,3,4);
    if(!laeuft&&Math.floor(S.t*2)%2===0)
      text('MAX FERDI',mx+4-textW('MAX FERDI')/2,bodenY-22,P.neon2);
  }
  /* Vignette, damit die Szene nicht flach wirkt */
  ctx.drawImage(verlauf('aussenvig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,bodenY-20,50,W/2,bodenY-20,W*.62);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.6)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);

function zeichneAlles(dt){
  staubUpdate(dt);

  bildschirme();

/* ---- Korridor ---- */
/* Wie weit eine Figur wegen ihrer Tiefe nach oben rutscht.
   t=0 ist ganz hinten an der Wand, t=1 ganz vorne am Betrachter. */
/* Ohne Tiefe stehen alle auf der Bodenlinie - kein Versatz. */
const tiefeVersatz = t => tiefeAn()?Math.round(TUNE.tiefeBand*(1-Math.max(0,Math.min(1,t)))):0;


/* ---- Nacht-Kulisse ----
   Kleine, einmal gebackene Bilder (Fenster, Pinnwand, Notausgang, Himmel, Keller).
   Zufall nur beim Backen, und dort ein fester Startwert - das Bild ist immer gleich. */
function kulisseZufall(seed){ let z=seed>>>0; return ()=>{ z=(z*1664525+1013904223)>>>0; return z/4294967296; }; }
/* Skyline: Hausreihe mit festen Fenstern (Gold), von hinten nach vorn. */
function malStadt(g,w,yBasis,hMin,hMax,seed,farbe,fensterChance){
  const R=kulisseZufall(seed); let x=0;
  while(x<w){ const bw=3+Math.floor(R()*5), bh=hMin+Math.floor(R()*(hMax-hMin));
    g.fillStyle=farbe; g.fillRect(x,yBasis-bh,bw,bh);
    if(fensterChance>0) for(let yy=yBasis-bh+2; yy<yBasis-1; yy+=3) for(let xx=x+1; xx<x+bw-1; xx+=2)
      if(R()<fensterChance){ g.fillStyle=P.gold; g.globalAlpha=.55; g.fillRect(xx,yy,1,1); g.globalAlpha=1; }
    x+=bw; }
}
function fensterBild(v){
  return verlauf('kulFenster'+v,18,16,g=>{
    const gr=g.createLinearGradient(0,0,0,16); gr.addColorStop(0,P.himmelOben); gr.addColorStop(1,P.himmelUnten);
    g.fillStyle=gr; g.fillRect(0,0,18,16);
    const R=kulisseZufall(7+v*13); g.fillStyle=P.mond;
    for(let i=0;i<5;i++){ g.globalAlpha=.5; g.fillRect(1+Math.floor(R()*16),1+Math.floor(R()*5),1,1); } g.globalAlpha=1;
    if(v===0){ g.fillStyle=P.mond; g.fillRect(12,2,3,3); g.fillRect(11,3,5,1); g.fillStyle=P.himmelUnten; g.fillRect(14,3,1,1); }
    malStadt(g,18,15,3,7,31+v*5,P.stadt,.25);
    g.fillStyle=P.rahmen; g.fillRect(0,0,18,1); g.fillRect(0,0,1,16); g.fillRect(17,0,1,16); g.fillRect(0,15,18,1);
    g.fillRect(8,0,2,16); g.fillRect(0,7,18,1);
    g.fillStyle=P.rohrHell; g.fillRect(0,15,18,1); });
}

const kulBild=(c,x,y)=>ctx.drawImage(c,Math.round(x),Math.round(y));
/* Wandfelder einer Etage: Fenster mit Mond und Stadt, dazwischen Pinnwaende. */
function zeichneWandfelder(e,by,fern){
  const von=S.kamX-24, bis=S.kamX+W+24, deckeY=by-52;
  /* Fremde Etage oben am Bildrand: dort stehen HUD und Ziel - Wandfelder weglassen. */
  if(fern&&deckeY+9-S.kamY<TUNE.hudFrei) return;
  ctx.globalAlpha=fern?TUNE.fensterFern:1;
  let k=0;
  for(let x=TUNE.fensterX0;x<LEVEL_B-TREPPE_L-20;x+=TUNE.fensterRaster,k++){
    if(Math.abs(x-TREPPE_R)<30||x<von||x>bis) continue;
    const art=(k+e)%3;
    if(art===2){ kulBild(pinnwandBild(),x-9,deckeY+13); continue; }
    kulBild(fensterBild(art),x-9,deckeY+9);
    if(!fern){ ctx.globalAlpha=TUNE.fensterMond; ctx.fillStyle=P.mondlicht;
      ctx.beginPath(); ctx.moveTo(x-9,deckeY+25); ctx.lineTo(x+9,deckeY+25);
      ctx.lineTo(x+19,by-TUNE.tiefeBand); ctx.lineTo(x+1,by-TUNE.tiefeBand); ctx.fill(); ctx.globalAlpha=1; }
  }
  ctx.globalAlpha=fern?TUNE.fensterFern:1;
  for(const tx of [TREPPE_L,TREPPE_R]){ const sx=tx+(tx<LEVEL_B/2?27:-38);
    if(sx>von&&sx<bis) kulBild(notausgangBild(),sx,deckeY+14); }
  ctx.globalAlpha=1;
}

function zeichneKorridor(){
  const kx=Math.round(S.kamX), ky=Math.round(S.kamY);
  ctx.save(); ctx.translate(-kx,-ky);

  if(TUNE.kulisse){
    ctx.drawImage(dachBild(),0,BODEN[BODEN.length-1]-52-TUNE.dachHoehe);
    ctx.drawImage(kellerBild(),0,BODEN[0]+10);
  }
  for(let e=0;e<BODEN.length;e++){
    const by=BODEN[e], deckeY=by-52;
    const fern = e!==S.etage;
    /* Wand - endet jetzt oberhalb des Laufbandes */
    ctx.fillStyle = fern?'#12141f':P.wand;
    ctx.fillRect(0,deckeY,LEVEL_B,56-TUNE.tiefeBand);
    /* Laufband: die Flaeche, auf der man nach hinten und vorne geht.
       Ohne sichtbares Band wirkt die Tiefe wie ein Schwebefehler. */
    ctx.fillStyle = fern?'#0e1018':'#171a29';
    ctx.fillRect(0,by-TUNE.tiefeBand,LEVEL_B,TUNE.tiefeBand);
    ctx.fillStyle = fern?'#141622':'#1f2334';
    ctx.fillRect(0,by-TUNE.tiefeBand,LEVEL_B,1);
    /* Sockelleiste und Boden */
    ctx.fillStyle = fern?'#0e1018':P.boden; ctx.fillRect(0,by,LEVEL_B,10);
    ctx.fillStyle = fern?'#1b1e2c':P.bodenKante; ctx.fillRect(0,by,LEVEL_B,1);
    /* Fliesenmuster */
    ctx.fillStyle = fern?'#101320':'#191d2e';
    for(let x=0;x<LEVEL_B;x+=16) ctx.fillRect(x,by+3,8,1);
    /* Wandkacheln (auf fremden Etagen schwaecher: angedeutet, damit unten kein schwarzes Loch bleibt) */
    ctx.fillStyle=fern?'#20243a':P.wandHell;
    for(let x=0;x<LEVEL_B;x+=24) ctx.fillRect(x,deckeY+30,1,22);
    ctx.fillRect(0,deckeY+30,LEVEL_B,1);
    /* Fugen im Laufband - nur auf der eigenen Etage, ganz leise */
    if(TUNE.kulisse&&!fern){ ctx.fillStyle='#1f2438'; for(let x=20;x<LEVEL_B;x+=40) ctx.fillRect(x,by-TUNE.tiefeBand+1,1,TUNE.tiefeBand-1); }
    if(TUNE.kulisse){
      zeichneWandfelder(e,by,fern);
      if(TUNE.fussleiste){ ctx.fillStyle=fern?'#171a28':'#272b43'; ctx.fillRect(0,by-TUNE.tiefeBand-3,LEVEL_B,3);
        ctx.fillStyle=fern?'#1b1e2e':'#363b5a'; ctx.fillRect(0,by-TUNE.tiefeBand-3,LEVEL_B,1); }
    }
    /* Deckenlampen mit Flackern */
    for(let x=60;x<LEVEL_B;x+=120){
      const flack = TUNE.flackern ? (Math.sin(x*3.1+S.t*(x%7+3))>-.75?1:.25) : 1;
      ctx.globalAlpha=fern?.25:flack;
      sprite(SPR.lampe,x,deckeY+3);
      if(!fern&&flack>.5){
        ctx.drawImage(verlauf('lampenlicht',64,54,g=>{
          const gr=g.createRadialGradient(32,6,2,32,6,50);
          gr.addColorStop(0,'rgba(207,227,255,.16)'); gr.addColorStop(1,'rgba(207,227,255,0)');
          g.fillStyle=gr; g.fillRect(0,0,64,54); }), x-28, deckeY+4);
      }
      ctx.globalAlpha=1;
    }
    /* Spinde - hier kann man sich verstecken */
    SPINDE.forEach((sp,si)=>{ if(sp.e!==e) return;
      const sy=by-10;
      ctx.globalAlpha=fern?.4:1;
      const drin = S.imSpind===si;
      sprite(SPR.spind,sp.x,sy,1, drin?'#3a4155':null);
      if(!fern){
        const nah = S.etage===e && Math.abs(S.x-sp.x)<TUNE.spindReichweite && S.modus==='spiel';
        if(drin){
          /* Sehschlitz - du steckst drin und lugst raus */
          ctx.fillStyle='#000'; ctx.fillRect(sp.x+1,sy+3,4,1);
          ctx.fillStyle=P.neon2; ctx.fillRect(sp.x+2,sy+3,2,1);
          if(Math.floor(S.t*3)%2===0) text(tasteText('E RAUS','RAUS'),sp.x+3-textW(tasteText('E RAUS','RAUS'))/2,sy-9,P.gold);
        } else if(nah){
          const frei=S.spindAbkuehlung<=0;
          ctx.globalAlpha=.55; ctx.fillStyle=frei?P.gold:P.dunkel;
          ctx.fillRect(sp.x-1,sy-2,8,1); ctx.globalAlpha=1;
          if(Math.floor(S.t*4)%2===0){
            const t=frei?aktionsMarke():Math.ceil(S.spindAbkuehlung)+'';
            text(t,sp.x+3-textW(t)/2,sy-9,frei?P.gold:P.rot);
          }
        }
      }
      ctx.globalAlpha=1;
    });

    /* Routine-Orte: Kaffeeautomat, Kopierer, Klo. Man soll sehen, wohin
       ein Lehrer unterwegs ist, bevor er dort ankommt. */
    for(const ro of ROUTINEN){ if(ro.e!==e) continue;
      const rows=SPR[ro.spr];
      ctx.globalAlpha=fern?.4:1; sprite(rows,ro.x,by-rows.length); ctx.globalAlpha=1; }
    /* Max Ferdis Spind */
    if(CODESPIND.e===e){
      const sy=by-10, offen=flag('ferdiSpindOffen');
      ctx.globalAlpha=fern?.4:1;
      sprite(SPR.codespind,CODESPIND.x,sy,1,offen?'#3a3350':null);
      if(!fern){
        text('FERDI',CODESPIND.x+3-textW('FERDI')/2,sy-8,offen?P.dunkel:P.dim);
        if(amCodespind()&&S.modus==='spiel'&&Math.floor(S.t*4)%2===0)
          text(aktionsMarke(),CODESPIND.x+2,sy-15,P.gold);
      }
      ctx.globalAlpha=1;
    }

    if(POLAROID.e===e&&flag('ferdiSpindOffen')&&typeof MOMENT!=='undefined'){
      MOMENT.zeichneFund(POLAROID.x,by-9,1);
      if(!fern&&amPolaroid()&&S.modus==='spiel'&&Math.floor(S.t*4)%2===0)
        text(IS_TOUCH?'FOTO':'E: FOTO',POLAROID.x+4-textW(IS_TOUCH?'FOTO':'E: FOTO')/2,by-18,P.gold);
    }

    /* Tueren */
    RAEUME.forEach((r,i)=>{ if(r.e!==e) return;
      const ty=by-12;
      ctx.globalAlpha=fern?.4:1;
      sprite(SPR.tuer,r.x,ty);
      if(!fern){
        /* Ab Hinweisstufe 2 ist der Zielraum markiert */
        const markiert = S.hinweisStufe>=2 && i===S.schluesselRaum && !S.hatSchluessel;
        const beschriftung=S.entdeckt.has(i)?r.name:'? ? ?';
        const col = markiert?P.gold : (S.entdeckt.has(i)?P.dim:P.dunkel);
        text(beschriftung, r.x+4-textW(beschriftung)/2, ty-8, col);
        if(markiert){
          const blink=Math.floor(S.t*3)%2===0;
          ctx.globalAlpha=blink?.85:.4; ctx.fillStyle=P.gold;
          ctx.fillRect(r.x-1,ty-1,10,1); ctx.fillRect(r.x-1,ty+12,10,1);
          ctx.globalAlpha=1;
          if(blink) sprite(SPR.schluessel,r.x+2,ty-17);
        }
      }
      ctx.globalAlpha=1;
    });

    /* Ausgang */
    if(e===AUSGANG.e){
      const ay=by-14;
      ctx.fillStyle=S.hatSchluessel?P.gruen:'#3a2a2a';
      ctx.fillRect(AUSGANG.x-1,ay-1,12,15);
      sprite(SPR.tuer,AUSGANG.x,ay+2);
      text('AUSGANG',AUSGANG.x+4-textW('AUSGANG')/2,ay-9,S.hatSchluessel?P.gruen:P.rot);
      if(!S.hatSchluessel) text('X',AUSGANG.x+4,ay+4,P.rot);
    }

    /* Treppenhaus - muss auf einen Blick auffallen, sonst findet man es nicht */
    [[TREPPE_L,1],[TREPPE_R,-1]].forEach(([tx,dir])=>{
      ctx.globalAlpha=fern?.3:1;
      /* Nische in der Wand */
      ctx.fillStyle='#0d0f18'; ctx.fillRect(tx-20,by-46,40,46);
      ctx.fillStyle=P.wandHell; ctx.fillRect(tx-20,by-46,40,1);
      ctx.fillStyle='#0a0c14'; ctx.fillRect(tx-20,by-46,1,46); ctx.fillRect(tx+19,by-46,1,46);
      /* Stufen */
      for(let k=0;k<8;k++){
        ctx.fillStyle = k%2 ? '#39405c' : '#2b3149';
        ctx.fillRect(tx-16*dir+k*4*dir, by-3-k*4, 5, 4);
      }
      /* Gelaender */
      ctx.fillStyle='#525a7d';
      for(let k=0;k<8;k++) ctx.fillRect(tx-16*dir+k*4*dir+2, by-11-k*4, 1, 5);
      if(!fern){
        const oben=e<BODEN.length-1, unten=e>0;
        const nah=S.etage===e&&anTreppe(S.x)&&S.modus==='spiel';
        const blink=Math.floor(S.t*3)%2===0;
        text('TREPPE',tx-textW('TREPPE')/2,by-54,nah?P.gold:P.dunkel);
        /* Ab Hinweisstufe 1 steht hier, in welche Etage du musst */
        if(S.hinweisStufe>=1&&!S.hatSchluessel){
          const zE=zielEtage();
          if(zE!==e){ const pfeil=IS_TOUCH?(zE>e?'HOCH':'RUNTER'):(zE>e?'W':'S');
            if(Math.floor(S.t*2)%2===0) text(pfeil+' ETAGE '+(zE+1),tx-textW('W ETAGE 1')/2,by-62,P.gold); }
          else text('HIER',tx-textW('HIER')/2,by-62,P.gruen);
        }
        if(S.hatSchluessel){ if(e>0){ if(Math.floor(S.t*2)%2===0){ const at=tasteText('S AUSGANG','RUNTER: AUSGANG'); text(at,tx-textW(at)/2,by-62,P.gold); } } else text('AUSGANG >>>',tx-textW('AUSGANG >>>')/2,by-62,P.gruen); }
        if(!IS_TOUCH&&oben&&(!nah||blink)) text('W',tx-14,by-46,nah?P.gold:P.dim);
        if(!IS_TOUCH&&unten&&(!nah||blink)) text('S',tx+11,by-46,nah?P.gold:P.dim);
        if(nah){ ctx.globalAlpha=.5; ctx.fillStyle=P.gold;
          ctx.fillRect(tx-20,by-1,40,1); ctx.globalAlpha=1; }
      }
      ctx.globalAlpha=1;
    });
  }

  /* Lehrer */
  /* Sichtkegel zuerst, flach auf dem Laufband - sie liegen unter allen
     Figuren, sonst ueberdecken sie die Lehrer. */
  for(const L of S.lehrer){
    if(L.e!==S.etage||L.weg) continue;
    const by=BODEN[L.e];
    const w=(L.chef?TUNE.chefSicht:TUNE.sichtWeite)*(S.schleicht?TUNE.schleichSicht:1);
    ctx.globalAlpha=.10+L.verdacht*.22;
    ctx.fillStyle=L.jagd>0?P.rot:(L.chef?'#e0708f':P.gold);
    /* Der Kegel oeffnet sich mit der Entfernung und hat seitlich eine
       Grenze (welt.js). Als Trapez gezeichnet sieht man sofort, wo man
       hinten oder vorne vorbeikommt. */
    const richtung=Math.sign(L.v)||1;
    for(let d=3; d<w; d+=3){
      const px = richtung>0 ? L.x+6+d : L.x+2-d-3;
      const halbWelt = Math.min(TUNE.kegelOeffnung*d, TIEFE.kegelMax*TUNE.tiefeWelt);
      const halb = halbWelt/TUNE.tiefeWelt;
      const t0=Math.max(0,L.t-halb), t1=Math.min(1,L.t+halb);
      const y0=by-tiefeVersatz(t0), y1=by-tiefeVersatz(t1);
      ctx.fillRect(px,y0,3,Math.max(1,y1-y0+1));
    }
    ctx.globalAlpha=1;
  }

  /* Figuren der eigenen Etage nach Tiefe sortiert - wer hinten steht,
     wird zuerst gezeichnet und damit verdeckt. */
  const figuren=[];

  for(const L of S.lehrer){
    const by=BODEN[L.e], fern=L.e!==S.etage;
    const malen=()=>{
      if(L.weg) return;              // auf dem Klo - weg aus dem Flur
      ctx.globalAlpha=fern?.35:1;
      const versatz=fern?0:tiefeVersatz(L.t);
      const yb=by-versatz;
      const bewegt=Math.abs(L.v)>0;
      const rows = L.chef ? SPR.direktor
                 : ((L.jagd>0||bewegt) && Math.floor(S.t*6)%2 ? SPR.lehrerGeh : SPR.lehrer);
      const hoehe = L.chef?17:13;
      if(!fern){
        ctx.globalAlpha=.26; ctx.fillStyle='#000';
        ctx.fillRect(Math.round(L.x),Math.round(yb),7,1);
        ctx.globalAlpha=1;
        outline(rows,L.x,yb-hoehe,1,.6);
      }
      if(L.v>0) spriteFlip(rows,L.x,yb-hoehe); else sprite(rows,L.x,yb-hoehe);
      if(!fern&&L.routine&&L.routine.da) text(L.routine.was,L.x+3-textW(L.routine.was)/2,yb-hoehe-8,P.dim);
      if(L.hausmeister&&!fern){
        if(L.hatSchluessel){
          sprite(SPR.schluessel,L.x+(L.v>0?-3:7),yb-7);
          if(Math.floor(S.t*2)%2===0) text('HAUSMEISTER',L.x+3-textW('HAUSMEISTER')/2,yb-24,P.gold);
        }
        const abgelenkt=L.abgelenkt>0||L.suchtX!=null;
        if(abgelenkt&&L.hatSchluessel&&Math.floor(S.t*5)%2===0)
          text('JETZT',L.x+3-textW('JETZT')/2,yb-31,P.gruen);
        else if(!abgelenkt&&L.hatSchluessel&&L.e===S.etage&&Math.abs(L.x-S.x)<14&&Math.floor(S.t*4)%2===0){ const rt=tasteText('E REDEN','REDEN'); text(rt,L.x+3-textW(rt)/2,yb-31,P.gold); }
      }
      if(!fern&&L.verdacht>.02){
        const bw=14;
        ctx.fillStyle='#000a'; ctx.fillRect(L.x-4,yb-22,bw+2,4);
        ctx.fillStyle=L.jagd>0?P.rot:(L.verdacht>.6?P.gold:P.neon2);
        ctx.fillRect(L.x-3,yb-21,Math.round(bw*L.verdacht),2);
        if(L.jagd>0&&Math.floor(S.t*8)%2===0) text('!',L.x+2,yb-28,P.rot);
      }
      ctx.globalAlpha=1;
    };
    if(fern) malen(); else figuren.push({t:L.t, mal:malen});
  }

  /* Spieler */
  const blinkt = S.unverwundbar>0 && Math.floor(S.t*16)%2===0;
  if(!blinkt&&S.modus!=='cutscene'&&S.imSpind<0){
    figuren.push({t:S.tiefe, mal:()=>{
      const yb=S.y-tiefeVersatz(S.tiefe);
      ctx.globalAlpha=.26; ctx.fillStyle='#000';
      ctx.fillRect(Math.round(S.x),Math.round(S.y-tiefeVersatz(S.tiefe)),7,1);
      ctx.globalAlpha=1;
      zeichneSpieler(S.x,yb);
    }});
  }
  zeichneNachTiefe(figuren);

  /* Cutscene: Direktor und Spieler */
  if(S.modus==='cutscene'){
    const dy=S.dirY;
    outline(SPR.direktor,S.dirX,dy-17,1,.6);
    ctx.save();
    if(S.szene>=7){ ctx.translate(S.dirX+5,dy-8); ctx.rotate(S.szeneT*6); ctx.translate(-5,-9);
      sprite(SPR.direktor,0,0); ctx.restore(); }
    else { ctx.restore(); sprite(SPR.direktor,S.dirX,dy-17); }
    const rows = S.szene>=5 ? SPR.packen : SPR.steh;
    outline(rows,S.x,S.y-13,1,.6);
    if(S.blick<0) spriteFlip(rows,S.x,S.y-13); else sprite(rows,S.x,S.y-13);
  }

  /* Geworfener Gegenstand */
  if(S.wurf&&S.wurf.e===S.etage){
    ctx.fillStyle='#8c94ad';
    ctx.fillRect(Math.round(S.wurf.x),Math.round(S.wurf.y),3,3);
    ctx.fillStyle='#4a4363';
    ctx.fillRect(Math.round(S.wurf.x)-2,Math.round(S.wurf.y)+1,2,1);
  }
  /* Suchmarkierung, wenn ein Lehrer einem Geraeusch nachgeht */
  for(const L of S.lehrer){
    if(L.suchtX==null||L.e!==S.etage) continue;
    if(Math.floor(S.t*5)%2===0){
      ctx.fillStyle=P.gold;
      ctx.fillRect(Math.round(L.suchtX)-2,BODEN[L.e]-2,5,1);
      text('?',Math.round(L.suchtX),BODEN[L.e]-10,P.gold);
    }
  }

  /* Staub */
  for(const p of STAUB){ ctx.globalAlpha=Math.max(0,p.leben/p.max);
    ctx.fillStyle='#6b6488'; ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1); }
  ctx.globalAlpha=1;

  ctx.restore();

  /* Dunkelheit auf fremde Etagen */
  ctx.drawImage(verlauf('vignette',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.6,40,W/2,H*.6,W*.62);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,'+TUNE.vignetteStaerke+')');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);

  /* Dunkelheit: Stromausfall oder die kaputte Etage.
     Die Taschenlampe vergroessert den Kreis - deshalb lohnt sie sich. */
  const kaputteEtage = S.etage===TUNE.dunkleEtage;
  if(S.dunkelT>0 || kaputteEtage){
    const flackern = S.dunkelT>0 ? Math.min(1,S.dunkelT*2.2)*(Math.random()<.12?.4:1) : 1;
    const staerke = (S.dunkelT>0?.92:.86)*flackern;
    const radius = S.lampe ? TUNE.lampeRadius : (kaputteEtage?TUNE.dunkelRadius:24);
    const px=Math.round(S.x-S.kamX)+3, py=Math.round(S.y-S.kamY)-6;
    ctx.globalAlpha=staerke;
    ctx.drawImage(verlauf('dunkel'+radius,W*2,H*2,g=>{
      const gr=g.createRadialGradient(W,H,radius*.35,W,H,radius*2.2);
      gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
      g.fillStyle=gr; g.fillRect(0,0,W*2,H*2); }), px-W, py-H);
    ctx.globalAlpha=1;
    /* Warmer Lichtschein der Lampe */
    if(S.lampe){
      ctx.globalAlpha=.16;
      ctx.drawImage(verlauf('lampenschein',160,160,g=>{
        const gr=g.createRadialGradient(80,80,4,80,80,78);
        gr.addColorStop(0,'rgba(255,240,190,1)'); gr.addColorStop(1,'rgba(255,240,190,0)');
        g.fillStyle=gr; g.fillRect(0,0,160,160); }), px-80, py-80);
      ctx.globalAlpha=1;
    }
  }

  /* Blick aus dem Spind. Der Schlitz bleibt klar - vorher war er
     zusaetzlich abgedunkelt, dadurch sah man genau nichts. */
  if(S.imSpind>=0){
    const py=Math.round(S.y-S.kamY)-9;
    const hoehe=11;
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,Math.max(0,py));
    ctx.fillRect(0,py+hoehe,W,H-(py+hoehe));

    /* Nahaufnahme: wer vorbeigeht, wird gross gezeichnet.
       Das ist der Moment, den man aus dem Spind sehen soll. */
    const nah=S.lehrer.filter(L=>L.e===S.etage)
                      .sort((a,b)=>Math.abs(a.x-S.x)-Math.abs(b.x-S.x))[0];
    const abstand=nah?Math.abs(nah.x-S.x):999;
    if(nah&&abstand<80){
      const naehe=1-Math.min(1,abstand/80);
      const sc=Math.max(2,Math.round(2+naehe*2));
      const rows=nah.chef?SPR.direktor
                :(Math.floor(S.t*7)%2?SPR.lehrerGeh:SPR.lehrer);
      const bild=holeSprite(rows,sc);
      ctx.save();
      ctx.beginPath(); ctx.rect(0,py,W,hoehe); ctx.clip();
      const bx=Math.round(W/2+(nah.x-S.x)*2.4-bild.width/2);
      const by=Math.round(py+hoehe-bild.height*0.55);
      ctx.globalAlpha=.35; ctx.fillStyle='#000';
      ctx.fillRect(bx-2,py,bild.width+4,hoehe); ctx.globalAlpha=1;
      if(nah.v>0){ ctx.save(); ctx.translate(bx+bild.width,by); ctx.scale(-1,1);
                   ctx.drawImage(bild,0,0); ctx.restore(); }
      else ctx.drawImage(bild,bx,by);
      ctx.restore();
      /* Herzschlag, je naeher desto staerker */
      if(naehe>.35){
        const puls=(Math.sin(S.t*9)*.5+.5)*naehe;
        ctx.globalAlpha=puls*.35; ctx.fillStyle=P.rot;
        ctx.fillRect(0,py,W,hoehe); ctx.globalAlpha=1;
      }
    }
    /* Kanten der Spindtuer */
    ctx.fillStyle='#454e66'; ctx.fillRect(0,py-2,W,2); ctx.fillRect(0,py+hoehe,W,2);
    ctx.fillStyle='#1b2030'; ctx.fillRect(0,py-3,W,1); ctx.fillRect(0,py+hoehe+2,W,1);
    /* Luefterschlitze links und rechts als Rahmen */
    ctx.fillStyle='#2a3145';
    for(let x=4;x<W;x+=6){ ctx.fillRect(x,py-6,3,1); ctx.fillRect(x,py+hoehe+4,3,1); }
    if(Math.floor(S.t*2)%2===0) text(tasteText('E  RAUS','RAUS'),W/2-textW(tasteText('E  RAUS','RAUS'))/2,py+hoehe+10,P.dunkel);
  }
}

function zeichneSpieler(x,y){
  let rows;
  if(!S.amBoden) rows = S.vy<0?SPR.sprung:SPR.fall;
  else if(tempo2D(S.vx,S.vt)>12) rows = SPR.geh[Math.floor(S.gehPhase)%4];
  else rows = SPR.steh;
  outline(rows,x,y-13,1,.6);
  if(S.blick<0) spriteFlip(rows,x,y-13); else sprite(rows,x,y-13);
  /* Schatten */
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(x),BODEN[S.etage],7,1); ctx.globalAlpha=1;
}

/* ---- Rauminneres ---- */
function zeichneRaum(){
  const r=RAEUME[S.raum];
  const st=STIL[r.stil]||STIL.klasse;
  const bodenY=136, deckeY=44;
  /* Kulisse (einmal vorgezeichnet), Schild, Raumlicht von oben */
  ctx.drawImage(raumKulisse(S.raum),0,0);
  raumDeko(st,deckeY);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,bodenY,W,1);
  ctx.drawImage(verlauf('raumlicht'+r.stil,W,90,g=>{
    const gr=g.createLinearGradient(0,0,0,90);
    gr.addColorStop(0,st.licht); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(0,0,W,90); }),0,deckeY);
  /* Tuer zurueck */
  sprite(SPR.tuer,30,bodenY-12);
  text('RAUS',30+4-textW('RAUS')/2,bodenY-20,S.anTuerRaus?P.gold:P.dunkel);

  /* Moebel */
  const plaetze=moebelPlaetze(r);
  plaetze.forEach((p,i)=>{
    const rows=SPR[p.typ]||SPR.kiste;
    const hoehe=rows.length;
    const y=bodenY-hoehe;
    ctx.globalAlpha=TUNE.raum.kontaktSchatten; ctx.fillStyle='#000'; ctx.fillRect(p.x-1,bodenY,rows[0].length+2,2); ctx.globalAlpha=1;
    outline(rows,p.x,y,1,.5);
    sprite(rows,p.x,y);
    const durchsucht=S.durchsucht.has(S.raum+':'+i);
    if(durchsucht){ text('OK',p.x+8-textW('OK')/2,y-8,P.dunkel); }
    else if(S.nahesMoebel===i){
      if(Math.floor(S.t*4)%2===0) text(aktionsMarke(),p.x+8-1,y-9,P.gold);
      ctx.globalAlpha=.5; ctx.fillStyle=P.gold; ctx.fillRect(p.x,bodenY-1,16,1); ctx.globalAlpha=1;
    }
  });

  /* Spieler im Raum */
  const rows = Math.abs((rechtsAn?1:0)-(linksAn?1:0))>0 ? SPR.geh[Math.floor(S.t*8)%4]
             : (S.suchT>0?SPR.suchen:SPR.steh);
  outline(rows,S.raumX-3,bodenY-13,1,.6);
  if(S.blick<0) spriteFlip(rows,S.raumX-3,bodenY-13); else sprite(rows,S.raumX-3,bodenY-13);

  /* Suchbalken */
  if(S.suchT>0){
    const f=1-S.suchT/TUNE.suchDauer, bw=30;
    ctx.fillStyle='#000a'; ctx.fillRect(S.raumX-bw/2-1,bodenY-24,bw+2,5);
    ctx.fillStyle=P.gold;  ctx.fillRect(S.raumX-bw/2,bodenY-23,Math.round(bw*f),3);
    text('DURCHSUCHEN',(W-textW('DURCHSUCHEN'))/2,bodenY-34,P.dim);
  }

  /* Eintrittsblende */
  if(S.blende>0){ ctx.fillStyle=`rgba(0,0,0,${S.blende.toFixed(2)})`; ctx.fillRect(0,0,W,H); }
  /* Vignette */
  ctx.drawImage(verlauf('raumvig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,50,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.6)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
}

/* ---- HUD ---- */
function hud(){
  if(S.modus==='titel') return;
  /* Herzen */
  for(let i=0;i<TUNE.leben+schwer().leben;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  /* Schluessel */
  if(S.hatSchluessel){ sprite(SPR.schluessel,W-14,5); text('OK',W-24,6,P.gold); }
  else { ctx.globalAlpha=.3; sprite(SPR.schluessel,W-14,5); ctx.globalAlpha=1; }
  /* Etage */
  if(S.modus!=='raum'){
    const t='ETAGE '+(S.etage+1);
    text(t,(W-textW(t))/2,6,P.dunkel);
  }
  /* Flucht: der Countdown gross oben mittig. Unter fluchtWarnSek blinkt er rot. */
  if(S.fluchtAn&&S.modus!=='ende'){
    const sek=Math.ceil(S.fluchtT), zeit='0:'+String(sek).padStart(2,'0');
    const blinkt=Math.floor(S.t*(typeof FX!=='undefined'?FX.hz(2):2))%2===0;
    const farbe = sek<=TUNE.fluchtWarnSek ? (blinkt?P.rot:P.weiss) : P.gold;
    textC(zeit,22,farbe,2);
  }
  /* Was du bisher weisst */
  if(!S.hatSchluessel){
    const t=zielKurz();
    if(t) text(t,(W-textW(t))/2,14,P.gold);
  }
  /* Uhr - der Druck im Hintergrund */
  const std=Math.floor(S.minute/60), min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-15;
  text(uhr,W-textW(uhr)-6,14,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:(S.minute>=TUNE.endMinute-30?P.gold:P.dim)));

  /* Handy: Akku und Zustand */
  const ax=6, ay=H-20;
  ctx.fillStyle='#000a'; ctx.fillRect(ax-1,ay-1,16,7);
  ctx.fillStyle=S.lampe?P.gold:'#2a2440'; ctx.fillRect(ax,ay,14,5);
  ctx.fillStyle=S.akku>30?P.gruen:P.rot; ctx.fillRect(ax+1,ay+1,Math.round(12*S.akku/100),3);
  if(!IS_TOUCH&&S.lampe&&Math.floor(S.t*3)%2===0) text('Q',ax+18,ay,P.gold);
  if(S.stumm) text('STUMM',ax+18,ay,P.dunkel);
  if(S.vibriert>0&&Math.floor(S.t*20)%2===0) text('BZZZ',ax+18,ay-8,P.neon);

  /* Schleichen */
  if(S.schleicht) text('LEISE',6,H-12,P.neon2);
  /* Abkuehlungen */
  let rechts=[];
  if(S.spindAbkuehlung>0) rechts.push('SPIND '+Math.ceil(S.spindAbkuehlung));
  if(S.wurfAbkuehlung>0)  rechts.push('WURF '+Math.ceil(S.wurfAbkuehlung));
  rechts.forEach((t,i)=>text(t,W-textW(t)-6,H-12-i*8,P.dunkel));

  /* Chat der Jungs */
  S.chat.forEach((c,i)=>{
    const y=H-46+i*9, a=Math.max(0,Math.min(1,(9-c.alter)));
    if(a<=0) return;
    ctx.globalAlpha=a*.9;
    text(c.von+':',8,y,c.von==='MAX FERDI'?P.neon2:P.dunkel);
    text(c.txt,8+textW(c.von+':')+4,y,P.weiss);
    ctx.globalAlpha=1;
  });
  /* Jagdanzeige */
  if(S.lehrerJagt&&Math.floor(S.t*6)%2===0) textGlowC('LAUF',18,P.rot,2);
  /* Meldung */
  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  /* Hinweis */
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
  /* Aktionshinweis im Korridor */
  if(S.modus==='spiel'){
    const ri=raumBei(S.etage,S.x);
    let t=null;
    if(amAusgang(S.x)) t = S.hatSchluessel?tasteText('E  RAUS HIER','RAUS HIER'):tasteText('E  ABGESCHLOSSEN','ABGESCHLOSSEN');
    else if(ri>=0) t=tasteText('E  REIN','REIN');
    else if(anTreppe(S.x)) t = S.etage<BODEN.length-1 ? (IS_TOUCH?'HOCH':'W  HOCH') : (IS_TOUCH?'RUNTER':'S  RUNTER');
    if(t&&Math.floor(S.t*3)%2===0) textC(t,H-42,P.gold);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#07060d'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){ const x=(i*79)%W, y=(i*53)%H;
    ctx.fillStyle=i%7===0?'#2a2440':'#15121f'; ctx.fillRect(x,y,1,1); }
  textGlowC('NACHTSCHICHT',24,P.neon,3);
  textC('PARTY GAME DRUNK',34,P.dim);
  textC('LEVEL 1 - DIE SCHULE',46,P.dim);
  const zeilen=[
    'DU BIST NACH SCHULSCHLUSS EINGESPERRT',
    'FIND DEN SCHLUESSEL UND KOMM RAUS',
    'DIE LEHRER SIND NOCH DA',
  ];
  zeilen.forEach((z,i)=>textC(z,72+i*10,i===2?P.rot:P.weiss));
  if(IS_TOUCH){
    const st=[['STICK','LAUFEN'],['SANFT','SCHLEICHEN'],['AN TREPPE','HOCH ODER RUNTER'],
              ['KNOPF','TUER, SPIND, DURCHSUCHEN']];
    st.forEach((z,i)=>{ const y=100+i*8; text(z[0],44,y,P.gold); text(z[1],86,y,P.dim); });
  } else {
    /* Nur die vier Grundtasten - Lampe (Q), Wurf (R) kommen schon als
       eigene, ausprobierbare Schritte in der Lektion (nacht/lehre.js),
       H ist nur Audio und nicht spielentscheidend. Sieben Zeilen hier
       waren eine Bedienungsanleitung zum Lesen statt zum Merken. */
    const st=[['A D','LAUFEN'],['SHIFT','SCHLEICHEN'],['W S','AN DER TREPPE'],
              ['E','TUER, SPIND, DURCHSUCHEN']];
    st.forEach((z,i)=>{ const y=100+i*8; text(z[0],44,y,P.gold); text(z[1],78,y,P.dim); });
  }
  /* Schwierigkeit. Die alte Crew-Zeile stand hier - aber ein Start setzt
     die Nacht zurueck, die angezeigte Crew war also nie die, mit der man
     losging. */
  const sw=schwer().name;
  textC((IS_TOUCH?'':'< ')+'SCHWIERIGKEIT: '+sw+(IS_TOUCH?'':' >'),58,
        sw==='HART'?P.rot:sw==='LOCKER'?P.gruen:P.gold);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'LEERTASTE ODER E',H-19,P.weiss,1);
  /* Levelauswahl - ohne die sieht man nie, dass es Level 2 gibt.
     Am Handy uebernimmt die #levelbar unter dem Bild das - Tastenhinweise
     wie "Taste 2" gibt es dort schlicht nicht. */
  if(!IS_TOUCH){
    const a='LEERTASTE  LEVEL 1 - DIE SCHULE';
    const b='TASTE 2    LEVEL 2 - BEI MORITZ';
    text(a,(W-textW(a))/2,H-11,P.dunkel);
    text(b,(W-textW(b))/2,H-5,P.neon2);
    text('G: ENDEN',2,H-10,P.dim);
  }
  /* Am Handy liegt unten rechts der START-Knopf - UEBER steht dort oben rechts, gross genug zum Tippen. */
  if(IS_TOUCH){ ctx.fillStyle=P.dunkel; ctx.fillRect(W-40,3,38,13); text('UEBER',W-textW('UEBER')-9,7,P.weiss); }
  else text('U: UEBER',W-textW('U: UEBER')-2,H-10,P.dim);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC(tasteText('P ZUM WEITERSPIELEN','MENUE ZU: WEITER'),100,P.dim);
  }
  if(S.modus==='gefangen'){
    ctx.fillStyle=`rgba(0,0,0,${Math.min(.8,S.szeneT*2).toFixed(2)})`; ctx.fillRect(0,0,W,H);
    textGlowC('ERWISCHT',48,P.rot,3);
    textC(S.faenger||'ERWISCHT',72,P.dim);
    textC(S.hp>0?'ZURUECK ZUR TREPPE':'KEINE VERSUCHE MEHR',86,P.weiss);
    textC('UHR -'+TUNE.zeitstrafe+' SEK',95,P.rot);
    if(S.szeneT>.6&&Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN':'LEERTASTE',104,P.gold);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt){
      if(s.txt.includes('|')&&typeof zeichneKarte==='function') zeichneKarte(s.txt,H-31,P.weiss,1);
      else textC(s.txt.replace('|',' '),H-26,P.weiss);
    }
    if(!IS_TOUCH&&Math.floor(S.t*2)%2===0) text('E',W-12,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 1 GESCHAFFT',40,P.gold,2);
      textC('DIE NACHT FAENGT JETZT ERST AN',62,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      const zt=min+':'+String(sek).padStart(2,'0');
      textC('ZEIT  '+zt,84,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',94,P.gold);
      else { const b=ladeBest();
        if(b!==null) textC('BESTZEIT  '+Math.floor(b/60)+':'+String(Math.floor(b%60)).padStart(2,'0'),94,P.dunkel); }
      textC('RAEUME DURCHSUCHT  '+S.durchsucht.size,106,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),120,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(tasteText('E  WEITER ZU LEVEL 2','TIPPEN: WEITER ZU LEVEL 2'),134,P.gruen,1);
    } else {
      textGlowC('GESCHNAPPT',48,P.rot,3);
      textC('DIE SCHULE HAT GEWONNEN',76,P.weiss);
    }
    if(!S.gewonnen&&Math.floor(S.t*2)%2===0) textC(tasteText('E ODER LEERTASTE: NOCHMAL','TIPPEN: NOCHMAL'),H-20,P.gold);
  }
}
