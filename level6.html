const DROHN=[73,0,0,0, 87,0,0,0, 65,0,0,0, 98,0,0,0];

function musik(){
  if(!AC||muted||S.modus==='pause'||S.modus==='titel') return;
  const st=60/70/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%DROHN.length, f=DROHN[i];
    const wobble=1+(S.pegel/100)*0.04*Math.sin(MUS.step*1.7);
    if(f){ ton(f*wobble,MUS.next,st*1.6,'sine',.045);
      if(i%4===0) ton(f*2*wobble,MUS.next+st*0.5,st*0.8,'triangle',.02); }
    MUS.next+=st; MUS.step++;
  }
}

}

/* Sie - die aus dem Club. Welche es ist, steht im Speicherstand. */
function sieEcho(){
  const ja=['mia','sophie','kira'].find(n=>flag('clubJa_'+n)||flag('schreibt_'+n));
  if(ja){
    const name=ja.toUpperCase();
    return { name, baum:{
      start:{ wer:name, text:'Schreibst du mir morgen? Oder war das nur heute Nacht?',
        wahl:[
          { txt:'Ich schreib dir. Versprochen.',          geh:'ja',   tu:{flag:'versprochen_'+ja, mag:[name,6]} },
          { txt:'Mal sehen.',                              geh:'mal' },
          { txt:'Ich weiss nicht mal, ob ich mich erinnere.', geh:'nein', tu:{mut:-3} },
        ], zeit:10, standard:1 },
      ja:{ wer:name, text:'Dann halt dich dran.', geh:'@kraft' },
      mal:{ wer:name, text:'Mal sehen. Klar.', geh:'@ende' },
      nein:{ wer:name, text:'Dann erinner dich wenigstens daran.', geh:'@ende' },
    }};
  }
  const abfuhr=['mia','sophie','kira'].some(n=>beziehung(n.toUpperCase())<0);
  if(abfuhr) return { name:'DIE, DIE NEIN GESAGT HAT', baum:{
    start:{ wer:'SIE', text:'Du hast dich nicht getraut. Und dann zu sehr.',
      wahl:[
        { txt:'Ja. War nicht mein Abend.',       geh:'ok', tu:{mut:5, flag:'traumEinsicht'} },
        { txt:'Du hast mich nicht verstanden.',  geh:'@ende' },
      ], zeit:9, standard:1 },
    ok:{ wer:'SIE', text:'Naechstes Mal. Ehrlich gemeint.', geh:'@kraft' },
  }};
  return { name:'NIEMAND', baum:{
    start:{ wer:'NIEMAND', text:'Du hast mit keinem geredet. Wolltest du ueberhaupt?',
      wahl:[
        { txt:'Naechstes Mal.',           geh:'ok', tu:{mut:3} },
        { txt:'Ich war mit den Jungs da.', geh:'@ende' },
      ], zeit:9, standard:1 },
    ok:{ wer:'NIEMAND', text:'Das sagen alle.', geh:'@ende' },
  }};
}

let hochAn=false, runterAn=false;
let linksAn=false, rechtsAn=false, sprungAn=false, aktionGehalten=false;

function druckSprung(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  if(erzaehlTaste()) return;
  if(typeof gespraechAktiv==='function'&&gespraechAktiv()){ ensureAudio(); gespraechBestaetigen(); return; }
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='karte.html?nach=6'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}

function pauseTaste(){
  if(S.modus==='spiel'||S.modus==='pause') S.modus=S.modus==='spiel'?'pause':'spiel';
}

addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); hochAn=true; }
  if(['ArrowDown','KeyS'].includes(e.code)){ e.preventDefault(); runterAn=true; }
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['ArrowUp','KeyW'].includes(e.code)) hochAn=false;
  if(['ArrowDown','KeyS'].includes(e.code)) runterAn=false;
  if(['KeyE','Enter'].includes(e.code)) aktionGehalten=false;
  if(e.code==='Space') sprungAn=false; });
addEventListener('blur',()=>{ linksAn=rechtsAn=sprungAn=aktionGehalten=hochAn=runterAn=false; });

const INTRO=[
  { d:2.4, txt:'TIEF IN DER NACHT.' },
  { d:2.4, txt:'DER CLUB IST VORBEI. IRGENDWIE.' },
  { d:2.6, txt:'DEIN KOPF DREHT SICH.' },

  { d:2.8, txt:'DIE SCHULE. SCHON WIEDER.' },
  { d:2.6, txt:'DAS KANN NICHT SEIN. ODER?' },
];
function starte(){ neuesSpiel();
  /* Entscheidungen dieses Levels gelten nur fuer diesen Versuch. */
  ['schluesselVersprochen','moritzGeheimnis'].forEach(f=>setzeFlag(f,false));
  kapitelZeigen(6); S.modus='intro'; S.szene=0; S.szeneT=0; sicherTrail(true); piep(300,.12,'sine',.035); }
function starteLevel(){ S.modus='spiel'; zeigeHinweis('FIND DEINE ERINNERUNGEN. BLEIB WACH. SOFAS HELFEN.',4);
  piep(600,.09,'sine'); setTimeout(()=>piep(900,.13,'sine'),90); }
const INTRO_SKIP=0.5;   // so lange halten, dann ist das Intro vorbei
function intro(dt){ S.szeneT+=dt;
  /* Halten ueberspringt das ganze Intro, Tippen eine Szene. Level 1 hat
     sieben Szenen - beim zweiten Durchlauf war das siebenmal tippen. */
  if(aktionGehalten){ S.skipT=(S.skipT||0)+dt; if(S.skipT>INTRO_SKIP){ starteLevel(); return; } }
  else S.skipT=Math.max(0,(S.skipT||0)-dt*2);
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(420,.05,'sine',.025); } }

const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  PLAUSCH.sperre=S.modus!=='spiel'||gespraechAktiv();
  if(erzaehlTakt(dt)) return;
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }
  if(S.modus==='schwarz'){ S.schwarzT+=dt; if(S.schwarzT>2.2) aufwachen(); return; }

  S.zeit+=dt;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbauProSek*dt);

  /* --- Erschoepfung --- */
  if(S.ruht){
    S.kondition=Math.min(100,S.kondition+TUNE.sofaErholung*dt);
    if(linksAn||rechtsAn||hochAn||runterAn||S.kondition>=100){
      S.ruht=null; meldung(S.kondition>=100?'AUSGERUHT':'AUFGESTANDEN',1);
    }
    aktionPuffer.length=0; kamera(dt); return;
  }
  const renntAnteil=Math.min(1,Math.abs(S.vx)/TUNE.gehTempo);
  S.kondition-=(TUNE.konditionAbbau+TUNE.konditionPegel*S.pegel/100
               +TUNE.konditionRennen*renntAnteil)*schwer().muede*dt;
  if(S.kondition<=0){ S.kondition=0; wegknicken(); return; }

  const ort=ortBei(S.x);
  if(ort&&ort.wiederholt&&!S.wiederholungGezeigt){
    S.wiederholungGezeigt=true; zeigeHinweis('DIESEN RAUM GAB ES SCHON EINMAL',3);
  }

  /* --- Bewegung --- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = (S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1)
                * (S.kondition<TUNE.schwereAb ? 0.55+0.45*S.kondition/TUNE.schwereAb : 1);
  const hoechst = TUNE.gehTempo*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));
  /* Tiefe ausgeschrieben - S.t ist die Spielzeit (siehe WEITER.md). */
  const rt=tiefeAn()?((runterAn?1:0)-(hochAn?1:0)):0;
  S.vt+=(rt*TUNE.tiefeTempo*langsam-S.vt)*Math.min(1,14*dt);
  S.tiefe=Math.max(0,Math.min(1,S.tiefe+S.vt*dt));

  /* --- Die Schleife im Raum 101 --- */
  if(S.x>SCHLEIFE.x&&S.x<SCHLEIFE.x+12&&!S.erledigt[SCHLEIFE.braucht]){
    S.x=SCHLEIFE.zurueck; S.kamX=Math.max(0,S.x-W/2); S.schleifen++; S.blitz=.4;
    SFX.nichts();
    meldung(S.schleifen===1?'DIESEN RAUM GAB ES SCHON EINMAL':
            S.schleifen===2?'SCHON WIEDER RAUM 101':'WAS IST IM CHEMIERAUM PASSIERT?',2.4);
  }

  if(S.amBoden&&tempo2D(S.vx,S.vt)>12){
    S.gehPhase+=tempo2D(S.vx,S.vt)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0) suchErgebnis();
    kamera(dt); return;
  }

  while(aktionPuffer.length){
    aktionPuffer.shift();
    const z=naechstesZiel();
    if(!z) continue;
    if(z.art==='ding'){ benutze(z.obj); break; }
    if(z.art==='sofa'){
      S.ruht=z.obj; S.sofa=z.obj; S.vx=0; S.vt=0;
      meldung('DU LEGST DICH KURZ HIN',1.4); break;
    }
    if(z.art==='tuer'){
      S.x=z.obj.ziel; S.kamX=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2)); S.blitz=.6; SFX.nichts();
      meldung(z.obj.luegt?'DAS WAR NICHT RAUS':'DURCH DIE TUER',1.8); break;
    }
    if(z.art==='foto'){ if(MOMENT.fund(6)){ S.vx=0; } break; }
    redeImTraum(z); break;
  }
  kamera(dt);
}


/* ==========================================================================
   WAS IN REICHWEITE IST - eine Stelle fuer Aktion, Knopf und Anzeige.
   ========================================================================== */
function naechstesZiel(){
  let bestes=null, d0=1e9;
  const pruefe=(obj,art,tiefe)=>{
    if(!tiefeNah(tiefe,S.tiefe,TUNE.redeTiefe)) return;
    const d=Math.abs(obj.x-S.x);
    if(d<TUNE.reichweite&&d<d0){ bestes={art,obj}; d0=d; }
  };
  for(const d of DINGE) pruefe(d,'ding',d.t);
  for(const so of SOFAS) pruefe(so,'sofa',so.t);
  for(const t of TUEREN) pruefe(t,'tuer',t.t);
  for(const e of ECHOS) pruefe(e,'echo',e.t);
  for(const e of NACHTECHOS) if(!S.geredetMit[e.id]) pruefe(e,'nachtecho',e.t);
  pruefe(LEA,'lea',LEA.t);
  if(!MOMENT.hat(6)) pruefe(FOTO6,'foto',FOTO6.t);
  return bestes;
}

function redeImTraum(z){
  S.vx=0; S.vt=0; S.ruht=null; SFX.reden();
  if(z.art==='echo'){
    if(z.obj.id==='hausmeister'&&!S.geredetMit.hausmeister){
      S.geredetMit.hausmeister=true; starteGespraech(HAUSMEISTER_ECHO,'start',traumEnde); return; }
    starteGespraech(zeilenBaum(z.obj.name,z.obj.zeilen),'start',traumEnde); return; }
  if(z.art==='lea'){
    if(!alleErinnerungen()){ starteGespraech(LEA_NOCH_NICHT,'start',traumEnde); return; }
    S.leaVorher=flag('traumEinsicht');
    starteGespraech(MOMENT.anzahl()>=3?LEA_FRAGE_SEITE:LEA_FRAGE,'start',traumEnde); return;
  }
  const e=z.obj;
  S.geredetMit[e.id]=true;
  let baum;
  if(e.id==='moritz') baum=MORITZ_ECHO;
  else if(e.id==='sie') baum=sieEcho().baum;
  else baum=marvinEcho().baum;
  starteGespraech(baum,'start',traumEnde);
}
/* Wer das Echo ist, steht erst zur Laufzeit fest - der Name haengt an den
   Flags aus dem Club. */
const echoName=e=>e.id==='moritz'?'MORITZ':e.id==='sie'?sieEcho().name:marvinEcho().name;

/* Wegknicken. Kein Game Over - man wacht am letzten Sofa auf, Zeit ist
   vergangen, und der Pegel ist ein Stueck runter. */
function wegknicken(){
  S.modus='schwarz'; S.schwarzT=0; S.weggeknickt++; S.vx=0; S.vt=0;
  SFX.nichts();
}
function aufwachen(){
  S.modus='spiel'; S.x=S.sofa.x+8; S.tiefe=S.sofa.t+0.1;
  S.kondition=TUNE.aufwachenMit; S.pegel=Math.max(0,S.pegel-10);
  S.kamX=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2));
  meldung(S.weggeknickt>1?'SCHON WIEDER WEGGEKNICKT':'DU BIST WEGGEKNICKT',2.2);
  zeigeHinweis('AUF DEM SOFA AUFGEWACHT',2.4);
}

function mobilKontext(){
  const ek=(typeof erzaehlKontext==='function')?erzaehlKontext():null; if(ek) return ek;
  if(S.modus==='titel')    return {aktion:'START',  zwei:null};
  if(S.modus==='intro'||S.modus==='cutscene') return {aktion:'WEITER', zwei:null};
  if(S.modus==='ende')     return {aktion:S.gewonnen?'WEITER':'NOCHMAL', zwei:null};
  if(S.modus==='pause'||S.modus==='schwarz') return {aktion:null, zwei:null};
  if(S.ruht)               return {aktion:'AUFSTEHEN', zwei:null};
  const z=naechstesZiel();
  const txt=!z?null:{ding:S.durchsucht[z.obj.art]?'LEER':'SUCHEN',sofa:'AUSRUHEN',tuer:'TUER',
                     echo:'REDEN',nachtecho:'REDEN',lea:'LEA',foto:'FOTO'}[z.art];
  return {aktion:txt, zwei:'SPRUNG'};
}

/* ---- Erinnerungen suchen ---- */
function benutze(d){
  if(S.durchsucht[d.art]){ meldung('SCHON DURCHSUCHT',1); SFX.nichts(); return; }
  S.suchT=TUNE.suchDauer; S.suchZiel=d; rauschen(.12,.03);
}
function suchErgebnis(){
  const d=S.suchZiel; S.suchZiel=null;
  S.durchsucht[d.art]=true;
  const info=ERINNERUNGEN[d.art];
  if(info&&!S.erledigt[d.art]){
    S.erledigt[d.art]=true; SFX.fund(); S.blitz=.5; S.ruettel=4;
    S.pegel=Math.max(0,S.pegel-TUNE.proKlarheit);
    meldung(info,2.4); SFX.erledigt();
    const fehlt=AUFGABEN.length-AUFGABEN.filter(a=>S.erledigt[a.id]).length;
    zeigeHinweis(fehlt>0?('NOCH '+fehlt+' ERINNERUNGEN'):'GEH ZURUECK ZU LEA',3);
    return;
  }
  SFX.nichts(); meldung(pick(['NICHTS','NUR STAUB','LEER','KALT']),1);
}


/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

function levelGeschafft(){

  try{ localStorage.setItem(PEGEL_KEY,String(S.pegel)); }catch(e){}
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  /* 1) Die Szene unverzerrt in einen Hilfs-Canvas zeichnen */
  sicherWarp(); sicherTrail(false);
  warpCtx.clearRect(0,0,W,H);
  const echt=ctx; ctx=warpCtx;
  zeichneFlur();
  ctx=echt;

  /* 2) Nachbild-Puffer leicht ausblenden, dann die neue Szene wellenfoermig
     hineinkopieren - Zeile fuer Zeile mit einem eigenen Sinus-Versatz.
     Das ergibt gleichzeitig das Wabern UND die Echo-Schweife. */
  /* Verzerrung und Nachbild nur ueber FX: bei Flackerschutz/ohne Wackeln steht das Bild. */
  const fade=FX.ruhig()?1:Math.max(0.12,TUNE.trailFadeBasis-(S.pegel/100)*TUNE.trailFadePegel);
  trailCtx.fillStyle=`rgba(8,6,15,${fade.toFixed(3)})`;
  trailCtx.fillRect(0,0,W,H);
  const staerke=FX.ruhig()?0:FX.wackel(TUNE.basisWelle+(S.pegel/100)*TUNE.pegelWelle);
  for(let y=0;y<H;y++){
    const off=Math.sin(S.t*TUNE.wellenSpeed+y*TUNE.wellenFreq)*staerke;
    trailCtx.drawImage(warpCV,0,y,W,1,Math.round(off),y,W,1);
  }
  ctx.drawImage(trailCV,0,0);

  /* 3) Farbwasch, staerker mit dem Pegel */
  const wasch=TUNE.farbwaschBasis+(S.pegel/100)*TUNE.farbwaschPegel;
  ctx.globalAlpha=wasch;
  ctx.fillStyle=Math.sin(S.t*0.6)>0?P.neon:P.neon2;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;

  /* 4) Alles Bedienbare bleibt scharf - egal wie stark es gerade wabert */
  zeichnePrompts();
  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${FX.blitz(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
  erzaehlZeichne();
}

function zeichneFlur(){
  ctx.save();
  const rw=FX.wackel(S.ruettel), rx=(Math.random()-.5)*rw, ry=(Math.random()-.5)*rw*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  const kx=Math.round(S.kamX);
  ctx.translate(-kx,0);

  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,TIEFE.hinten-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,TIEFE.hinten-20);
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,TIEFE.hinten,o.bis-o.von,H-TIEFE.hinten);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,TIEFE.hinten,o.bis-o.von,1);
    text(raumName(o),o.von+6,26,'#ffffff18');
  }
  /* Wanddeko: Plakate/Spinde ueber die ganze Flurbreite, eine Sorte,
     wiederholt - passend zum Traum (PLAYTEST.md: obere Bildhaelfte leer).
     Naeher an der Bildmitte als die Decke, sonst schluckt die Vignette
     (zeichneFlur unten) den Kontrast fast vollstaendig. */
  for(let x=24;x<LEVEL_B;x+=60){
    ctx.fillStyle='#0d0a14'; ctx.fillRect(x,70,24,22);
    ctx.fillStyle='#3a3350'; ctx.fillRect(x+2,72,20,18);
    ctx.globalAlpha=.4+Math.sin(S.t*2+x)*.2;
    ctx.fillStyle=P.dim; ctx.fillRect(x+5,76,14,2); ctx.fillRect(x+5,81,14,2); ctx.fillRect(x+5,86,10,2);
    ctx.globalAlpha=1;
  }
  /* Dieselbe Tafel, zweimal - der Raum wiederholt sich absichtlich */
  sprite(SPR.tafel,260,TIEFE.hinten-34);
  sprite(SPR.tafel,640,TIEFE.hinten-34);
  /* Die Wand am Ende des zweiten Raum 101 - sichtbar, solange sie gilt */
  if(!S.erledigt[SCHLEIFE.braucht]){
    ctx.globalAlpha=.35+Math.sin(S.t*3)*.15;
    for(let y=TIEFE.hinten-10;y<H;y+=14) sprite(SPR.wand,SCHLEIFE.x+4,y-14);
    ctx.globalAlpha=1;
  }

  /* Wanduhren: alle stehen auf 17:30 */
  for(const ux of UHREN){
    ctx.fillStyle='#0d0a14'; ctx.fillRect(ux-12,34,24,11);
    ctx.fillStyle='#d8d2c0'; ctx.fillRect(ux-11,35,22,9);
    text(UHR_ZEIT,ux-textW(UHR_ZEIT)/2,37,'#1d1830');
  }

  const liste=[];
  liste.push({t:FOTO6.t, mal:()=>{
    MOMENT.zeichneFund(FOTO6.x-4,bodenY(FOTO6.t)-9,6); }});
  for(const d of DINGE){ const rows=SPR[d.moebel];
    liste.push({t:d.t, mal:()=>{ const y=bodenY(d.t)-rows.length;
      outline(rows,d.x,y,1,.5); sprite(rows,d.x,y,1,S.durchsucht[d.art]?'#3a3350':null); }}); }
  for(const so of SOFAS) liste.push({t:so.t, mal:()=>{
    const y=bodenY(so.t)-SPR.sofa.length; sprite(SPR.sofa,so.x-6,y);
    if(S.ruht===so){ const rows=SPR.fall; spriteFlip(rows,so.x-4,y-6); } }});
  for(const tu of TUEREN) liste.push({t:tu.t, mal:()=>{
    const y=bodenY(tu.t)-SPR.tuer.length; sprite(SPR.tuer,tu.x-4,y);
    text(tu.name,tu.x-textW(tu.name)/2,y-8,P.dim); }});
  for(const e of ECHOS) liste.push({t:e.t, mal:()=>{
    const rows=SPR.steh, y=bodenY(e.t)-rows.length;
    outline(rows,e.x-3,y,1,.4); sprite(rows,e.x-3,y,1,e.tint,.8);
    if(Math.abs(e.x-S.x)<60) text(e.name,e.x+2-textW(e.name)/2,y-9,P.dim); }});
  for(const e of NACHTECHOS){ if(S.geredetMit[e.id]) continue;
    liste.push({t:e.t, mal:()=>{
      const rows=SPR.steh, y=bodenY(e.t)-rows.length+Math.round(Math.sin(S.t*2+e.x)*1);
      sprite(rows,e.x-3,y,1,e.tint,.7);
      if(Math.abs(e.x-S.x)<70){ const n=echoName(e); text(n,e.x+2-textW(n)/2,y-9,e.tint); } }}); }
  liste.push({t:LEA.t, mal:()=>{
    const rows=SPR.lea, y=bodenY(LEA.t)-rows.length;
    outline(rows,LEA.x-3,y,1,.7); sprite(rows,LEA.x-3,y);
    textGlow('LEA',LEA.x+2-textW('LEA')/2,y-9,P.neon2); }});

  if(!S.ruht&&S.modus!=='schwarz') liste.push({t:S.tiefe, mal:()=>{
    let rows;
    if(S.suchT>0) rows=SPR.suchen;
    else if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
    else if(tempo2D(S.vx,S.vt)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
    else rows=SPR.steh;
    const versatz=BODEN-bodenY(S.tiefe), y=S.y-versatz-rows.length;
    ctx.globalAlpha=.28; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(S.x-3),Math.round(bodenY(S.tiefe)),7,1); ctx.globalAlpha=1;
    outline(rows,S.x-3,y,1,.6);
    if(S.blick<0) spriteFlip(rows,S.x-3,y); else sprite(rows,S.x-3,y);
  }});
  zeichneNachTiefe(liste);
  ctx.restore();

  /* Erschoepfung zieht das Bild von den Raendern zu */
  const muede=Math.max(0,1-S.kondition/TUNE.schwereAb);
  ctx.globalAlpha=Math.min(1,.5+muede*.5);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  if(muede>0){ ctx.globalAlpha=muede*.45*(0.6+0.4*Math.sin(S.t*1.3)); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); }
  ctx.globalAlpha=1;
}

/* ---- Scharfe Overlay-Ebene: alles was man bedienen kann, bleibt lesbar,
   auch wenn die Welt darunter gerade stark wabert. ---- */
function zeichnePrompts(){
  if(S.modus!=='spiel'||S.suchT>0||S.ruht||gespraechAktiv()) return;
  if(Math.floor(S.t*2*FX.hz(2))%2!==0) return;
  const z=naechstesZiel(); if(!z) return;
  const sx=Math.round(z.obj.x-S.kamX), sy=Math.round(bodenY(z.obj.t))-26;
  const t=z.art==='ding'&&S.durchsucht[z.obj.art]?'OK':'E';
  text(t,sx-textW(t)/2,sy,t==='OK'?P.dunkel:P.gold);
}

/* ---- HUD ---- */
function hud(){
  const bw=64,bx=(W-bw)/2,by=6,p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  const zeitStr=Math.floor(S.zeit/60)+':'+String(Math.floor(S.zeit%60)).padStart(2,'0');
  text(zeitStr,W-textW(zeitStr)-6,6,P.dunkel);

  /* Wachheit - der eigentliche Gegner in diesem Level */
  { const kw=54, kx=W-kw-6, ky=15, k=S.kondition/100;
    ctx.fillStyle='#000a'; ctx.fillRect(kx-2,ky-2,kw+4,7);
    ctx.fillStyle='#2a2440'; ctx.fillRect(kx,ky,kw,3);
    const knapp=S.kondition<TUNE.schwereAb;
    ctx.fillStyle=knapp&&Math.floor(S.t*2*FX.hz(2))%2===0?P.rot:(knapp?P.gold:P.neon2);
    ctx.fillRect(kx,ky,Math.round(kw*k),3);
    text(S.ruht?'AUSRUHEN':'WACH',kx+kw-textW(S.ruht?'AUSRUHEN':'WACH'),ky+6,P.dunkel); }

  let y=16;
  for(const a of AUFGABEN){
    const ok=!!S.erledigt[a.id];
    text(ok?'X':'-',6,y,ok?P.gruen:P.dunkel);
    text(a.text,14,y,ok?P.dunkel:P.weiss);
    y+=8;
  }
  if(alleErinnerungen()&&Math.floor(S.t*2)%2===0) textC('GEH ZU LEA',H-42,P.gold);
  zeichneGespraech();
  if(S.modus==='schwarz'){ ctx.fillStyle=`rgba(0,0,0,${Math.min(1,S.schwarzT*1.5).toFixed(3)})`;
    ctx.fillRect(0,0,W,H); if(S.schwarzT>0.8) textC('...',H/2,P.dunkel); }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('AFTERHOUR',22,P.neon,3);
  textC('LEVEL 6 - DIE SCHULE, VERZERRT',44,P.dim);
  const zeilen=['DU BIST TIEF DRIN IN DER NACHT','FIND DEINE ERINNERUNGEN','UND GEH ZU LEA'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=IS_TOUCH?[['STICK','LAUFEN'],['KNOPF','REDEN, SUCHEN, AUSRUHEN']]
                   :[['WASD','LAUFEN'],['E','REDEN, SUCHEN, AUSRUHEN']];
  st.forEach((z,i)=>{ text(z[0],70,108+i*9,P.gold); text(z[1],104,108+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'LEERTASTE ODER E',H-19,P.weiss,1);
}
function zeichneIntro(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#20182e'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#170f20'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  sprite(SPR.steh,W/2-3,130-13);
  ctx.drawImage(verlauf('introvig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,80,40,W/2,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(!IS_TOUCH&&Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
  zeichneUeberspringen(S.skipT,INTRO_SKIP);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt){ if(typeof zeichneKarte==='function') zeichneKarte(s.txt,H-33,P.weiss);
      else textC(s.txt.split('|')[0],H-26,P.weiss); }
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 6 GESCHAFFT',30,P.gold,2);
      textC('DU BIST WACH. FUER JETZT.',52,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),70,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',80,P.gold);
      textC('PEGEL  '+Math.round(S.pegel),92,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),106,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 7':'E  WEITER ZU LEVEL 7',134,P.gruen,1);
    } else {
      /* Kein Verlieren vorgesehen in diesem Level - dieser Zweig bleibt
         als Absicherung stehen, falls hier spaeter doch mal ein Fehlschlag
         dazukommt, ist aber aktuell unerreichbar. */
      textGlowC('VERLOREN',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */


starteSchleife();
</script>
