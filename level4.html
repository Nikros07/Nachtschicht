<script>
/* ============================================================================
   NACHTSCHICHT - LEVEL 4: DIE SCHLANGE

   Die Gruppe steht vor dem Club, die Schlange zieht sich um die Ecke - und
   vorne steht einer, der euch nicht reinlaesst. Der erste echte Boss im
   Spiel: der Tuersteher. Bewusst EIN Schauplatz, EIN Gegner, keine Laufwege -
   das ist ein reiner Konter-Zweikampf. Die Vorlage fuer "im Ausholen kontern"
   ist der Kracher-Kampf aus level2.html; hier wird sie enger und haerter:
   zwei Angriffsmuster, Konterfenster nur im letzten Drittel des Ausholens,
   und ein Fehlgriff kostet spuerbar Zeit statt nur eine Chance zu verpassen.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) DER TUERSTEHER - zwei Angriffsmuster, damit nicht immer dasselbe
     Timing reicht. SCHWUNG ist der lange, deutlich angekuendigte Haken.
     JAB ist kurz und gemein. */
  bossTreffer:        5,     // so oft musst du kontern, dann liegt er
  bossPause:          0.9,   // Erholung zwischen zwei Angriffen
  schwungWindup:      1.25,  // Ausholzeit SCHWUNG
  schwungSchlag:      0.24,  // wie lange der Treffer selbst dauert
  jabWindup:          0.55,  // Ausholzeit JAB - viel kuerzer
  jabSchlag:          0.16,
  fensterAnteil:      0.34,  // Konterfenster = letztes Drittel des Ausholens
  serieMax:           2,     // max. gleiche Angriffe hintereinander

  /* (2) SPIELER */
  leben:              3,
  fehlschlagErholung: 0.6,   // Strafe fuers verfrueht/falsch gedrueckte E
  unverwundbarNachTreffer: 0.5,

  /* (3) DER PEGEL WIRKT SICH AUFS KONTERN AUS - er wird hier nicht getrunken,
     kommt aber aus Level 2/3 mit und macht das Timing wackliger. */
  pegelFensterStrafeMax: 0.4,  // bei Pegel 100: Konterfenster bis zu 40% enger
  pegelWackelAb:      35,      // ab hier zittert das Bild sichtbar
  pegelWackelMax:     2.2,

  /* (4) TEMPO STEIGT MIT JEDEM TREFFER LEICHT AN */
  musikBeschleunigung: 0.05,

  /* (5) BEWEGUNG - du stehst nicht mehr fest, vor dem Club ist Platz.
     Die Tiefe ist hier kein Schmuck: der Rammstoss laesst sich NUR durch
     Ausweichen loesen, blocken hilft dagegen nicht. */
  gehTempo:        74,
  arenaLinks:      20,
  arenaRechtsRand: 28,   // Abstand zum rechten Bildrand
  tiefeHinten:    124,   // Boden-Y der hintersten Laufebene
  tiefeVorne:     154,

  /* (6) DER RAMMSTOSS - unblockbar, kommt ab Phase 2 */
  rammeWindup:    0.80,
  rammeSchlag:    0.30,
  rammeAb:           2,  // ab dieser Phase
  rammeTempo:      150,  // er setzt nach, wenn er rammt

  /* (7) PHASEN - er wird ungemuetlicher, je naeher er am Boden ist */
  phase2Ab:         0.66,  // Anteil Rest-Leben
  phase3Ab:         0.33,
  phasePauseKuerzer: 0.22, // pro Phase weniger Verschnaufen
  phaseWindupKuerzer:0.12, // pro Phase kuerzere Vorwarnung
};

const P = {
  ink:'#08060f', weiss:'#f2f0ff', dim:'#8d86a8', dunkel:'#4a4363',
  neon:'#ff3d8b', neon2:'#42d9ff', gold:'#ffd447', rot:'#ff4d4d', gruen:'#48e08a',
  boden:'#20182a', bodenKante:'#4a3a58',
};

/* ==========================================================================
   3x5 BITMAP-FONT
   ========================================================================== */


/* ==========================================================================
   BILD-CACHE
   ========================================================================== */


const KEY={ k:'#08060f', s:'#e8b088', h:'#2a1c14', w:'#f2f0ff',
  g:'#ffd447', n:'#ff3d8b', c:'#42d9ff', r:'#ff4d4d', d:'#4a4363', p:'#2b2b48',
  o:'#a8681f', e:'#20182e', u:'#8c94ad', z:'#5a4632',
  /* Tuersteher: schwarzer Anzug, Glatze, Sonnenbrille */
  b:'#191420', x:'#0c0a12', y:'#c99a6a' };


/* ==========================================================================
   SPRITES
   ========================================================================== */
const KOPF=['..hhh..','.hsssh.','.sssss.','..sss..'];
const SPR={
  /* Spieler - Grundstellung, Konter-Ausfallschritt, Treffer-Ruecklage */
  steh:[...KOPF,'..ttt..','.ttttt.','k.ttt.k','..ttt..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  konter:[...KOPF,'..ttt....','.tttttss.','k.ttt.ss.','..ttt....','..ppp....','..p.p....','.pp.pp...','.kk..kk..'],
  treffer:[...KOPF,'..ttt..','k.ttttt','..ttt.k','..ppp..','..pp...','.pp....','kk.....'],

  /* Tuersteher - breite Schultern, Glatze, Sonnenbrille, schwarzer Anzug */
  bossKopf:['.yyyyy.','yyxxxyy','.yyyyy.','..yyy..'],
  bossSteh:['.bbbbb..','bbwbbbbb','kbbbbb.k','.bbbbb..','..bpb...','..p.p...','.pp.pp..','kk...kk.'],
  bossWind:['bb.bbbb..','bwbbbbbb.','kbbbbb..k','.bbbbb...','..bpb....','..p.p....','.pp.pp...','kk...kk..'],
  bossSchlag:['.bbbbb..bb','bbwbbbbbrr','kbbbbb...k','.bbbbb....','..bpb.....','..p.p.....','.pp.pp....','kk...kk...'],

  /* Kulisse */
  absperrpfosten:['.ggg.','.ggg.','.ggg.','dddddd'],
};

/* ==========================================================================
   AUDIO
   ========================================================================== */


const SFX={
  warn:    ()=>piep(880,.07,'square',.05),
  klatsch: ()=>{ rauschen(.09,.13); glissando(220,60,.14,'square',.07); },
  aua:     ()=>{ rauschen(.28,.09); glissando(300,90,.3,'sawtooth',.06); },
  fehl:    ()=>piep(180,.08,'sine',.035),
  nichts:  ()=>piep(220,.09,'sine',.03),
  sieg:    ()=>{ [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>piep(f,.14),i*110)); },
  reden:   ()=>piep(520+Math.random()*180,.04,'square',.025),
};
/* Musik: dumpfer Bass vor dem Club, wird mit jedem Treffer etwas schneller */
const BASS=[73,0,73,0, 98,0,73,0, 65,0,65,0, 87,0,98,110];

function musik(){
  if(!AC||muted||S.modus==='pause'||S.modus==='titel') return;
  const tempo=1+ (S.boss?(TUNE.bossTreffer-S.boss.hp):0)*TUNE.musikBeschleunigung;
  const st=60/118/4/tempo;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    if(f) ton(f,MUS.next,st*.85,'square',.03);
    if(i%4===0) ton(48,MUS.next,.09,'sine',.045);
    MUS.next+=st; MUS.step++;
  }
}

/* ==========================================================================
   AUFBAU
   ========================================================================== */


const BODEN=142;


/* ==========================================================================
   ZUSTAND
   ========================================================================== */


const BEST_KEY='nachtschicht.bestzeit4';
const ladeBest=()=>{ const v=parseFloat(localStorage.getItem(BEST_KEY)); return isFinite(v)?v:null; };

/* DENNIS - boxt, koerperlich selbstbewusst, hilft im Kampf. Er wird ERST am
   Ende DIESES Levels freigeschaltet, kann also in diesem Kampf selbst noch
   nicht helfen. Die Funktion ist trotzdem hier definiert und wird schon
   angewendet (wie tempoBonus() in level2.html) - falls die Crew doch schon
   vor Levelstart DENNIS enthaelt (z.B. bei kuenftigen Nachschlage-Runs),
   greift sein Bonus sofort: ein Extra-Herz und ein 15% breiteres
   Konterfenster. Kuenftige Level (ab 5) sollen denselben Helfer verwenden. */
const dennisKampfBonus=()=>ladeCrew().includes('DENNIS')?{leben:1,fenster:1.15}:{leben:0,fenster:1};

let S={};
/* Die Gruppengroesse aus Level 2 wirkt hier: mit vier Mann faellt ihr auf
   und er laesst sich mehr bitten, zu zweit kommt ihr leichter durch.
   Das ist die andere Haelfte des Tauschs - im grossen Fight ist es umgekehrt. */
function trefferZiel(){
  let n=TUNE.bossTreffer;
  if(typeof flag==='function'){
    if(flag('gruppeGross')) n+=1;
    else if(flag('gruppeKlein')) n-=1;
  }
  return Math.max(3,n);
}
function neuesSpiel(){
  const bonus=dennisKampfBonus();
  setzeTiefenband(TUNE.tiefeHinten,TUNE.tiefeVorne);
  S={
    modus:'titel', t:0, zeit:0,
    maxHp:TUNE.leben+bonus.leben, hp:TUNE.leben+bonus.leben, fensterMult:bonus.fenster,
    pegelStart:parseFloat(localStorage.getItem(PEGEL_KEY))||0,
    treffer:0, erholungT:0,
    ruettel:0, blitz:0,
    meldung:'', meldungT:0, hinweis:'', hinweisT:0,
    szene:0, szeneT:0, skipT:0,
    boss:null, gewonnen:false, faenger:'', neueBestzeit:false,
    spieler:null, blockAn:false,
  };
  S.spieler=kaempfer({ x:96, t:0.5, blick:1, hp:S.maxHp, maxHp:S.maxHp });
}
neuesSpiel();

/* ==========================================================================
   EINGABE
   ========================================================================== */

let aktionGehalten=false;
let aktionPuffer=[];

function druckAktion(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='karte.html?nach=4'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  if(S.modus==='pause') return;
  aktionPuffer.push(S.t);
}
/* Knopf-Aufschriften fuer nacht/mobil.js: Leertaste ist hier die Rolle,
   nicht der Sprung, und ohne block:true fehlte am Handy der Blockknopf. */
function mobilKontext(){
  if(S.modus==='titel')    return {aktion:'START',  zwei:null};
  if(S.modus==='intro'||S.modus==='cutscene') return {aktion:'WEITER', zwei:null};
  if(S.modus==='ende')     return {aktion:'WEITER', zwei:null};
  if(S.modus==='pause')    return {aktion:null, zwei:null};
  return {aktion:'SCHLAG', zwei:'ROLLE', block:true};
}
let linksAn=false, rechtsAn=false, hochAn=false, runterAn=false, rolleGedrueckt=false;

/* Was P in diesem Level heisst. nacht/eingabe.js ruft es auf. */
function pauseTaste(){
  if(S.modus==='kampf'||S.modus==='pause') S.modus=S.modus==='kampf'?'pause':'kampf';
}

addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(['ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); hochAn=true; }
  if(['ArrowDown','KeyS'].includes(e.code)){ e.preventDefault(); runterAn=true; }
  if(['ShiftLeft','ShiftRight'].includes(e.code)){ e.preventDefault(); S.blockAn=true; }
  if(e.code==='Space'){ e.preventDefault();
    if(S.modus==='kampf') rolleGedrueckt=true; else druckAktion(); }
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['KeyE','Enter'].includes(e.code)) aktionGehalten=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['ArrowUp','KeyW'].includes(e.code)) hochAn=false;
  if(['ArrowDown','KeyS'].includes(e.code)) runterAn=false;
  if(['ShiftLeft','ShiftRight'].includes(e.code)) S.blockAn=false; });
addEventListener('blur',()=>{ aktionGehalten=false;
  linksAn=rechtsAn=hochAn=runterAn=false; if(S) S.blockAn=false; });


/* Der Konterknopf muss instantan feuern - touchstart, nicht click, sonst
   verliert der Handy-Spieler genau die Millisekunden, um die es hier geht. */


/* ==========================================================================
   INTRO
   ========================================================================== */
const INTRO=[
  { d:2.2, txt:'23:15. VOR DEM CLUB.' },
  { d:2.4, txt:'DIE SCHLANGE ZIEHT SICH UM DIE ECKE.' },
  { d:2.4, txt:'VORNE STEHT EINER, DER EUCH NICHT REINLAESST.' },
  { d:2.2, txt:'DER TUERSTEHER.' },
  { d:2.6, txt:'E IM RICHTIGEN MOMENT IM AUSHOLEN - DAS IST KONTERN.' },
];
function starte(){ neuesSpiel(); S.modus='intro'; S.szene=0; S.szeneT=0; piep(330,.1,'sine',.04); }
function starteLevel(){
  S.modus='kampf';
  S.boss=kaempfer({ x:W+30, t:0.5, blick:-1, art:'tuersteher',
    hp:trefferZiel(), maxHp:trefferZiel(), reichweite:19,
    pauseT:0.9, anlauf:true, vorZustand:'frei' });
  zeigeHinweis('E IM AUSHOLEN - GANZ AM ENDE DES BALKENS',3.5);
  SFX.warn(); meldung('NA WARTE',1.4);
}
const INTRO_SKIP=0.5;   // so lange halten, dann ist das Intro vorbei
function intro(dt){ S.szeneT+=dt;
  /* Halten ueberspringt das ganze Intro, Tippen eine Szene. Level 1 hat
     sieben Szenen - beim zweiten Durchlauf war das siebenmal tippen. */
  if(aktionGehalten){ S.skipT=(S.skipT||0)+dt; if(S.skipT>INTRO_SKIP){ starteLevel(); return; } }
  else S.skipT=Math.max(0,(S.skipT||0)-dt*2);
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };

/* ==========================================================================
   DER TUERSTEHER - der Kampf
   ========================================================================== */
function bossPhase(b){
  const anteil=b.hp/b.maxHp;
  return anteil<=TUNE.phase3Ab?3:anteil<=TUNE.phase2Ab?2:1;
}
function naechsteArt(b){
  /* Ab Phase 2 kommt der Rammstoss dazu. Der ist unblockbar - ab da reicht
     Decken allein nicht mehr, man muss ausweichen. */
  const moeglich = bossPhase(b)>=TUNE.rammeAb ? ['schwung','jab','ramme']
                                              : ['schwung','jab'];
  let art=pick(moeglich);
  if(b.letzteArt===art) b.serie=(b.serie||0)+1; else b.serie=0;
  if(b.serie>=TUNE.serieMax){
    const andere=moeglich.filter(a=>a!==art);
    art=pick(andere); b.serie=0;
  }
  b.letzteArt=art;
  return art;
}
function starteAngriff(b,art){
  const phase=bossPhase(b);
  const kuerzer=1-(phase-1)*TUNE.phaseWindupKuerzer;
  b.art=art;
  b.ausholenDauer=(art==='schwung'?TUNE.schwungWindup
                  :art==='jab'?TUNE.jabWindup:TUNE.rammeWindup)*kuerzer;
  b.schlagDauer=(art==='schwung'?TUNE.schwungSchlag
                :art==='jab'?TUNE.jabSchlag:TUNE.rammeSchlag);
  b.unblockbarJetzt=(art==='ramme');
  /* Der Pegel aus den vorigen Leveln macht das Fenster enger, Dennis in der
     Crew macht es wieder breiter. */
  const pegelFaktor=1-(S.pegelStart/100)*TUNE.pegelFensterStrafeMax;
  b.fensterAnteil=Math.max(0.12,TUNE.fensterAnteil*S.fensterMult*pegelFaktor);
  b.zustand='ausholen'; b.zT=0; b.trefferGesetzt=false;
  SFX.warn();
}
function fehlschlag(){
  if(S.erholungT>0) return;
  S.erholungT=TUNE.fehlschlagErholung; S.ruettel=2; SFX.fehl();
  meldung('DANEBEN',0.9);
}
function bossTakt(b,dt,ziel){
  kaempferTakt(b,dt);
  if(b.hp<=0) return;
  b.blick=Math.sign(ziel.x-b.x)||b.blick;

  /* Beim Rammen setzt er nach - deshalb reicht Stehenbleiben nicht. */
  if(b.art==='ramme'){
    if(b.zustand==='ausholen') b.x+=b.blick*TUNE.rammeTempo*0.18*dt;
    if(b.zustand==='schlag')   b.x+=b.blick*TUNE.rammeTempo*dt;
  }

  /* Nach jedem Angriff einmal Luft holen. Je tiefer die Phase, desto kuerzer. */
  if(b.zustand==='frei'&&b.vorZustand!=='frei'){
    const phase=bossPhase(b);
    b.pauseT=Math.max(0.25,TUNE.bossPause-(phase-1)*TUNE.phasePauseKuerzer);
  }
  b.vorZustand=b.zustand;

  if(b.zustand!=='frei') return;

  if(b.anlauf){
    const ziel2=Math.round(W*0.62);
    b.x+=(ziel2-b.x)*Math.min(1,6*dt);
    if(Math.abs(b.x-ziel2)<1){ b.x=ziel2; b.anlauf=false; b.pauseT=TUNE.bossPause; }
    return;
  }

  b.pauseT-=dt;
  /* Er schlaegt erst zu, wenn er auch hinkommt. Im ersten Spieltest hat
     er aus 65 Pixeln Entfernung ausgeholt und ins Leere geschlagen -
     seine Reichweite sind 19. Deshalb ist Naehe jetzt Bedingung. */
  const dx=ziel.x-b.x;
  const dtf=(ziel.t||0)-(b.t||0);
  const zuWeit=Math.abs(dx)>b.reichweite*0.8||Math.abs(dtf)>KAMPF.tiefeToleranz*0.8;
  if(b.pauseT>0||zuWeit){
    /* Er geht auf dich zu und zieht in deine Tiefe - wegrennen allein
       loest das Problem nicht. */
    if(Math.abs(dx)>b.reichweite*0.75) b.x+=Math.sign(dx)*46*dt;
    if(Math.abs(dtf)>0.05) bewegeTiefe(b,Math.sign(dtf),dt,TIEFE.tempo*0.6,9);
    return;
  }
  starteAngriff(b,naechsteArt(b));
}

function kampf(dt){
  const b=S.boss, s=S.spieler; if(!b||!s) return;

  /* Hit-Stop: nach einem Treffer steht die Welt ganz kurz. */
  kampfStopTakt(dt);
  const zdt=dt*kampfZeitFaktor();
  if(zdt<=0) return;

  if(S.erholungT>0) S.erholungT=Math.max(0,S.erholungT-zdt);

  /* ---- Ausweichrolle ---- */
  if(rolleGedrueckt){
    rolleGedrueckt=false;
    const r=(runterAn?1:0)-(hochAn?1:0);
    if(!rolle(s,r||(s.t<0.5?1:-1))&&s.ausdauer<KAMPF.ausdauerRolle)
      meldung('KEINE PUSTE',0.8);
  }

  /* ---- Blocken ----
     Liegt ein Tastendruck an, wird die Deckung in diesem Bild fallen
     gelassen. Sonst haelt man Block, drueckt E und nichts passiert - das
     fuehlt sich an wie eine verschluckte Eingabe. */
  blocke(s,!!S.blockAn && aktionPuffer.length===0);

  /* ---- Laufen, auch in die Tiefe ---- */
  if(s.zustand==='frei'||s.zustand==='block'){
    const rx=(rechtsAn?1:0)-(linksAn?1:0);
    const langsamer=s.zustand==='block'?0.45:1;
    if(rx){ s.x+=rx*TUNE.gehTempo*langsamer*zdt; s.blick=rx; }
    const rt=(runterAn?1:0)-(hochAn?1:0);
    kampfTiefe(s,rt,zdt,langsamer);
  }
  s.x=Math.max(TUNE.arenaLinks,Math.min(W-TUNE.arenaRechtsRand,s.x));

  /* ---- Zuschlagen ----
     Der Konter wird im Moment des Druckens geprueft. Siehe konterVersuch()
     in kampf.js - sonst frisst die eigene Ausholzeit das Fenster auf. */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    if(S.erholungT>0) continue;
    rasteAufGegner(s,[b],KAMPF.reichweite);
    if(s.ausdauer<KAMPF.ausdauerSchlag){ meldung('AUSSER PUSTE',0.9); continue; }
    if(konterVersuch(s,b,{konterAnteil:b.fensterAnteil,schaden:1,
                          unblockbar:b.unblockbarJetzt})){
      S.treffer++; S.ruettel=5; S.blitz=.5; SFX.klatsch();
      meldung(pick(['SITZT','KONTER','GEHT AUFS AUGE']),1.1);
      continue;
    }
    /* Kein Konter. In Reichweite zaehlt es als verfrueht - das ist die
       Strafe fuers blinde Draufdruecken. Sonst ein normaler Schlag, der
       nur den erwischt, der sich gerade erholt. */
    if(trifftRaeumlich(s,b,KAMPF.reichweite)&&b.zustand==='ausholen') fehlschlag();
    else schlage(s);
  }

  kaempferTakt(s,zdt);
  bossTakt(b,zdt,s);

  /* ---- Treffer aufloesen: erst du, dann er ---- */
  /* Ein normaler Schlag landet nur, wenn er sich gerade erholt oder
     betaeubt ist - sonst deckt er. Das haelt den Konter als Hauptweg. */
  if(s.zustand==='schlag'&&!s.trefferGesetzt){
    const offen=b.zustand==='erholung'||b.zustand==='getroffen';
    const r=loeseTreffer(s,b,{schaden:offen?1:0.001});
    if(r==='treffer'&&offen){
      S.treffer++; S.ruettel=3; SFX.klatsch(); meldung('NACHGESETZT',0.9);
    } else if(r==='block'||r==='gardebruch'){
      meldung(r==='gardebruch'?'DECKUNG WEG':'ER BLOCKT',0.9);
    } else if(r==='treffer'){
      meldung('ER STECKT DAS WEG',0.8);
    }
  }
  if(b.zustand==='schlag'&&!b.trefferGesetzt){
    const r=loeseTreffer(b,s,{schaden:1,unblockbar:b.unblockbarJetzt,
                              reichweite:b.reichweite,betaeubung:0.35});
    if(r==='treffer'||r==='gardebruch'){
      S.ruettel=6; S.blitz=.5; SFX.aua();
      meldung(r==='gardebruch'?'DURCH DIE DECKUNG'
             :b.art==='ramme'?'UMGERANNT'
             :b.art==='schwung'?'VOLL ERWISCHT':'AUTSCH',1.2);
    } else if(r==='block'){
      S.ruettel=2; meldung('GEBLOCKT',0.8);
    } else if(r==='daneben'){
      meldung('AUSGEWICHEN',0.9);
    }
  }

  /* ---- Ausgang ---- */
  S.hp=Math.max(0,Math.ceil(s.hp));
  if(s.hp<=0&&S.modus==='kampf'){
    S.modus='ende'; S.gewonnen=false;
    S.faenger=pick(['RAUSGESCHMISSEN','KEIN EINLASS HEUTE','DU LIEGST VOR DER TUER']);
    return;
  }
  if(b.hp<=0&&S.modus==='kampf'){ starteCutscene(); }
}


/* ==========================================================================
   CUTSCENE + ENDE
   ========================================================================== */
const SZENEN=[
  { d:1.0, txt:'' },
  { d:2.2, txt:'*ER GEHT ZU BODEN*' },
  { d:2.2, txt:'TUERSTEHER: ...OKAY. OKAY.' },
  { d:2.0, txt:'DU: DARF ICH JETZT' },
  { d:2.2, txt:'*ER TRITT ZUR SEITE*' },
  { d:2.4, txt:'EINER AUS DER SCHLANGE KOMMT MIT' },
  { d:2.4, txt:'DENNIS: RESPEKT. ICH KOMM MIT REIN.' },
  { d:1.2, txt:'' },
  { d:2.6, txt:'DENNIS IST JETZT DABEI' },
  { d:2.6, txt:'ER BOXT UND HAT EUREN RUECKEN IM CLUB' },
  { d:2.2, txt:'LEVEL 4 GESCHAFFT' },
];
function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; S.boss=null; SFX.sieg(); }
function levelGeschafft(){
  speichereCrew('DENNIS');
  /* Level 5 kennt das: Sophie will eine gute Geschichte hoeren. */
  setzeFlag('tuersteherBesiegt');
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Der Pegel bleibt unveraendert - dieses Level wird nicht getrunken, aber
     der aktuelle Wert muss trotzdem weitergereicht werden, sonst startet
     Level 5 faelschlich bei 0. */
  try{ localStorage.setItem(PEGEL_KEY,String(S.pegelStart)); }catch(e){}
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; if(S.modus!=='titel') S.zeit+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel'||S.modus==='ende'){ return; }
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='kampf'){ kampf(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); return; }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const wack = S.pegelStart>TUNE.pegelWackelAb
    ? (S.pegelStart-TUNE.pegelWackelAb)/(100-TUNE.pegelWackelAb)*TUNE.pegelWackelMax : 0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneArena();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneKulisse(){
  /* Nachthimmel */
  ctx.fillStyle='#0b0a1a'; ctx.fillRect(0,0,W,BODEN);
  for(let i=0;i<40;i++){ ctx.fillStyle=i%5===0?'#ffffff44':'#ffffff1c';
    ctx.fillRect((i*57)%W,4+(i*31)%(BODEN-40),1,1); }
  /* Fassade */
  ctx.fillStyle='#171224'; ctx.fillRect(0,18,W,BODEN-18);
  ctx.fillStyle='#0f0c1a'; ctx.fillRect(0,18,W,3);
  /* Neonschild CLUB - bewusst UNTER der HUD-Zeile (Herzen, Lebensbalken,
     Angriffsname, Ausholbalken belegen y 0-36), sonst ueberlappt sich das
     Schild mit dem Kampf-HUD. */
  const puls=(Math.sin(S.t*5)*.5+.5);
  ctx.globalAlpha=.16+puls*.14;
  ctx.drawImage(verlauf('clublicht',220,90,g=>{
    const gr=g.createRadialGradient(110,10,4,110,10,90);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,220,90); }),W/2-110,34);
  ctx.globalAlpha=1;
  textGlowC('CLUB',42,P.neon,2);
  /* Boden */
  ctx.fillStyle=P.boden; ctx.fillRect(0,BODEN,W,H-BODEN);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,W,1);
  for(let x=0;x<W;x+=14) { ctx.fillStyle='#00000033'; ctx.fillRect(x,BODEN+5,7,1); }

  /* Die Schlange - Silhouetten, die um die Ecke warten */
  for(let i=0;i<7;i++){
    const x=8+i*11, wippe=Math.sin(S.t*2+i)*1;
    ctx.fillStyle='#0d0a16';
    ctx.fillRect(x,BODEN-11+wippe,3,4); ctx.fillRect(x-1,BODEN-7+wippe,5,7);
  }
  /* Absperrung vor dem Boss */
  const px=Math.round(W*0.46), py=Math.round(W*0.78);
  sprite(SPR.absperrpfosten,px,BODEN-14);
  sprite(SPR.absperrpfosten,py,BODEN-14);
  ctx.fillStyle=P.neon; ctx.fillRect(px+4,BODEN-13,py-px-4,1);
}

function zeichneArena(){
  zeichneKulisse();
  const b=S.boss, s=S.spieler;

  /* Das Laufband sichtbar machen - ohne das schwebt bei Tiefe alles. */
  ctx.fillStyle='#1a1526';
  ctx.fillRect(0,bodenY(0)-2,W,bodenY(1)-bodenY(0)+6);
  ctx.fillStyle='#2b2340'; ctx.fillRect(0,bodenY(0)-2,W,1);
  ctx.fillStyle='#0d0a16'; ctx.fillRect(0,bodenY(1)+3,W,1);
  /* Absperrung hinten - macht die hintere Grenze lesbar */
  for(let x=6;x<W;x+=26){
    ctx.fillStyle='#3a3152'; ctx.fillRect(x,bodenY(0)-9,1,8);
    ctx.fillStyle='#4a3f66'; ctx.fillRect(x,bodenY(0)-10,2,1);
  }

  /* Erst NACH dem Boden: die Spuren und die Marke unter dem Gegner wurden
     sonst vom Laufband wieder uebermalt. */
  zeichneTiefenlinien(0,W);
  zeichneTiefenMarke(b,s);

  const zeichnungen=[];

  /* ---- Tuersteher ---- */
  if(b){
    zeichnungen.push({t:b.t, mal:()=>{
      let rows=SPR.bossSteh, kopf=SPR.bossKopf;
      /* Gehzyklus aus der echten Bewegung - vorher glitt er mit festen
         Beinen auf dich zu. */
      const lauf=laufBild(b);
      if(lauf>=0&&(b.zustand==='frei'||b.zustand==='block')) rows=gehBeine(rows,lauf);
      if(b.zustand==='ausholen') rows=SPR.bossWind;
      else if(b.zustand==='schlag') rows=SPR.bossSchlag;
      const blinkt=b.zustand==='getroffen'&&Math.floor(S.t*20)%2===0;
      const fuss=bodenY(b.t);
      const y=fuss-rows.length-kopf.length;
      bodenSchatten(b,9,.3);
      outline(kopf,b.x,y,1,.6); outline(rows,b.x,y+kopf.length,1,.6);
      const tint=blinkt?'#ffffff':(b.zustand==='block'?'#42d9ff':null);
      spriteFlip(kopf,b.x,y,1,tint); spriteFlip(rows,b.x,y+kopf.length,1,tint);
      if(b.zustand==='ausholen'&&Math.floor(S.t*10)%2===0)
        text('!',b.x+2,y-9,b.unblockbarJetzt?P.gold:P.rot);
    }});
  }

  /* ---- Spieler ---- */
  zeichnungen.push({t:s.t, mal:()=>{
    let rows=SPR.steh;
    const lauf=laufBild(s);
    if(lauf>=0&&(s.zustand==='frei'||s.zustand==='block')) rows=gehBeine(rows,lauf);
    if(s.zustand==='getroffen') rows=SPR.treffer;
    else if(s.zustand==='schlag'||s.zustand==='ausholen') rows=SPR.konter;
    const fuss=bodenY(s.t);
    const rollt=s.zustand==='rolle';
    const y=fuss-rows.length+(rollt?3:0);
    bodenSchatten(s,7,.28);
    const blinkt=s.unverwundbar>0&&Math.floor(S.t*18)%2===0;
    const tint=rollt?'#8d86a8':(s.zustand==='block'?'#42d9ff':(blinkt?'#ffffff':null));
    outline(rows,s.x,y,1,.6);
    if(s.blick<0) spriteFlip(rows,s.x,y,1,tint); else sprite(rows,s.x,y,1,tint);
    /* Deckung sichtbar machen */
    if(s.zustand==='block'){
      ctx.fillStyle='#42d9ff';
      const bx=s.x+(s.blick>0?8:-2);
      ctx.fillRect(bx,y+3,1,7);
    }
  }});

  zeichneNachTiefe(zeichnungen);

  /* Ausholbalken - steht seit nacht/hud.js an einer Stelle fuer alle
     vier Kaempfe im Spiel. */
  if(b) zeichneAusholbalken(b, b.art==='schwung'?'SCHWUNG'
                             :b.art==='jab'?'JAB':'RAMME - AUSWEICHEN');

  /* ---- Lebensbalken des Tuerstehers ---- */
  if(b){
    const bw=40, bx=Math.round(W/2-bw/2);
    ctx.fillStyle='#000a'; ctx.fillRect(bx-1,13,bw+2,6);
    ctx.fillStyle=P.rot;
    ctx.fillRect(bx,14,Math.round(bw*Math.max(0,b.hp)/b.maxHp),4);
    /* Phasenstriche, damit man sieht wann es haerter wird */
    ctx.fillStyle='#0008';
    ctx.fillRect(bx+Math.round(bw*TUNE.phase2Ab),13,1,6);
    ctx.fillRect(bx+Math.round(bw*TUNE.phase3Ab),13,1,6);
  }
}

/* ---- HUD ---- */
function hud(){
  const s=S.spieler;
  for(let i=0;i<S.maxHp;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }

  /* Ausdauer - der Balken, der das Knopf-Haemmern beendet. Rot, sobald
     kein Schlag mehr drin ist. */
  if(s){
    const bw=46, bx=6, by=14, f=s.ausdauer/KAMPF.ausdauerMax;
    ctx.fillStyle='#000a'; ctx.fillRect(bx-1,by-1,bw+2,5);
    ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,3);
    ctx.fillStyle=s.ausdauer<KAMPF.ausdauerSchlag?P.rot:P.gruen;
    ctx.fillRect(bx,by,Math.round(bw*f),3);
    ctx.fillStyle='#0008';
    ctx.fillRect(bx+Math.round(bw*KAMPF.ausdauerSchlag/KAMPF.ausdauerMax),by,1,3);
  }

  const tr='TREFFER '+S.treffer+'/'+(S.boss?S.boss.maxHp:TUNE.bossTreffer);
  text(tr,W-textW(tr)-6,6,P.dim);
  if(S.boss&&!S.boss.anlauf){
    const ph='PHASE '+bossPhase(S.boss);
    text(ph,W-textW(ph)-6,14,bossPhase(S.boss)>1?P.gold:P.dunkel);
  }
  if(S.erholungT>0) textC('DANEBEN - WARTEN',H-52,P.rot);

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('DIE SCHLANGE',22,P.neon,3);
  textC('LEVEL 4 - VOR DEM CLUB',44,P.dim);
  const zeilen=['ER LAESST EUCH NICHT REIN','EIN GEGNER. EIN ARENA.','IM AUSHOLEN KONTERN.'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=IS_TOUCH?[['TIPPEN','KONTERN IM RICHTIGEN MOMENT']]
                   :[['E','KONTERN IM RICHTIGEN MOMENT']];
  st.forEach((z,i)=>{ text(z[0],92,110+i*9,P.gold); text(z[1],118,110+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  const best=ladeBest();
  if(best!==null) textC('BESTZEIT '+Math.floor(best/60)+':'+String(Math.floor(best%60)).padStart(2,'0'),150,P.dim);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'E ODER LEERTASTE',H-13,P.weiss,1);
}
function zeichneIntro(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,0,W,H);
  const m=Math.round(W/2);
  ctx.fillStyle='#171224'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#1d1727'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  const puls=(Math.sin(S.t*5)*.5+.5);
  ctx.globalAlpha=.14+puls*.12;
  ctx.drawImage(verlauf('introlicht',220,110,g=>{
    const gr=g.createRadialGradient(110,14,4,110,14,96);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,220,110); }),m-110,30);
  ctx.globalAlpha=1;
  sprite(SPR.bossKopf,m+10,124); sprite(SPR.bossSteh,m+10,124+SPR.bossKopf.length);
  spriteFlip(SPR.steh,m-30,131-SPR.steh.length);
  ctx.drawImage(verlauf('introvig',W,H,g=>{
    const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
  zeichneUeberspringen(S.skipT,INTRO_SKIP);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 4 GESCHAFFT',34,P.gold,2);
      textC('ER GEHT ZUR SEITE. IHR SEID DRIN.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegelStart),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 5':'E  WEITER ZU LEVEL 5',134,P.gruen,1);
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
      textC('TREFFER GESCHAFFT: '+S.treffer+'/'+TUNE.bossTreffer,90,P.dim);
    }
    if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'E FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */


starteSchleife();
</script>
