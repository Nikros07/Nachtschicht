}

  text-shadow:0 0 8px #ff3d8b99,0 0 18px #ff3d8b55; padding-bottom:18px;
}
#mond{
  display:block; margin:0 auto 18px; width:128px; height:128px; border-radius:6px;
  image-rendering:pixelated; image-rendering:crisp-edges;
  box-shadow:0 0 0 2px #000,0 0 28px rgba(255,61,139,.22);

.fehler{ font-weight:700; font-size:14px; letter-spacing:.3em; color:var(--gold); margin-bottom:6px; }
h1{

p{ color:var(--text); margin:0 auto 26px; max-width:24rem; }
.knopf{

}
.knopf:hover{ background:rgba(255,212,71,.2); }
.knopf:focus-visible{ outline:3px solid var(--rosa); outline-offset:3px; }
/* Der Mond schwebt ganz langsam - nur, wenn das System keine Bewegung sparen will */
@media (prefers-reduced-motion:no-preference){
  #mond{ animation:schweben 7s ease-in-out infinite; }
  @keyframes schweben{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
}
</style>
