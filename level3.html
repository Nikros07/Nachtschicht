<script>
/* ============================================================================
   NACHTSCHICHT - LEVEL 3: DER NACHTBUS

   Level 1 war Schleichen, Level 2 war eine Meute in Bewegung kriegen.
   Hier ist der Boden selbst das Problem: der Bus faehrt, und Du stehst
   drin. Drei Sachen tragen das Level:

     FAHRENDER UNTERGRUND  Der Bus schwankt, rumpelt, bremst und faehrt an.
                           Wer nicht festhaelt, fliegt hin - und das hoert man.
     KONTROLLEURE          Sie steigen zu und arbeiten sich durch den Bus.
                           Ohne Fahrschein wird es teuer.
     TIMING                An jeder Haltestelle gehen die Tueren fuer ein
                           paar Sekunden auf. Draussen sieht Dich keiner -
                           aber der Bus wartet nicht.

   Der Pegel aus Level 2 kommt mit. Er ist hier kein Mutmacher mehr,
   sondern eine Rechnung: betrunken haelst Du schlechter das Gleichgewicht.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const LEVEL_NR=3;

const TUNE = {
  /* (1) BEWEGUNG */
  gehTempo:        96,
  beschleunigung: 820,
  bremsung:      1150,
  /* Gesprungen wird hier nicht - im Bus haelt man sich fest. */

  /* (2) KAMERA */
  kameraTraegheit:  6.5,
  blickVoraus:     22,

  /* (3) DER FAHRENDE UNTERGRUND
     Alles hier wirkt auf S.drift - die Seitwaerts-Geschwindigkeit, die
     nicht von Dir kommt. Reibung baut sie ab, Festhalten schluckt sie.
     Wird sie groesser als standFestigkeit, liegst Du. */
  schwanken:       30,     // Dauerpendeln waehrend der Fahrt (px/s^2)
  schwankTakt:      0.42,  // wie schnell der Bus pendelt (Hz)
  reibung:          2.2,   // wie schnell Drift von allein abklingt
  griffAbbau:       9,     // ... wenn Du Dich festhaeltst
  standFestigkeit: 62,     // soviel Drift haelst Du im Stehen aus
  schlaglochAb:     3.4,   // fruehestens soviel Sekunden bis zum naechsten Ruck
  schlaglochBis:    6.5,
  schlaglochWarnung:0.55,  // so lange rumpelt es vorher
  schlaglochStoss: 34,     // wie hart der Ruck ist (px/s)
  /* Nuechtern faengst Du ein Schlagloch im Stehen ab (34 + Pendeln gegen 62).
     Betrunken nicht mehr, und im Gelenk nie - dort zaehlt es doppelt. */
  bremsKraft:     165,     // beim Anhalten druecke es Dich nach vorn
  anfahrKraft:    150,     // beim Losfahren nach hinten
  gelenkFaktor:     2.0,   // im Gelenk schwankt alles staerker
  umfallDauer:      1.15,  // so lange liegst Du
  umfallLaerm:    130,     // so weit hoert man den Sturz

  /* (4) DER PEGEL - aus Level 2 mitgebracht */
  pegelMax:       100,
  pegelAbbau:       0.5,
  pegelSchwanken:   1.5,   // Faktor auf alle Kraefte bei vollem Pegel
  pegelStand:       0.55,  // soviel weniger haelst Du dann aus
  wackelnAb:       55,     // ab hier wackelt das Bild
  langsamAb:       70,
  blackoutBei:    100,
  /* Musik - dieselbe Kette wie in Level 2 */
  verzerrungAb:    35,
  verzerrungMax:    0.85,
  lautBonus:        0.5,
  schwankMax:       0.08,
  schwebungMax:     0.018,

  /* (5) DER FAHRPLAN */
  fahrtZeit:       16,     // Sekunden zwischen zwei Haltestellen
  bremsZeit:        2.4,   // davon am Ende das Bremsen
  anfahrZeit:       2.0,   // und am Anfang das Anfahren
  tuerZeit:         6.5,   // so lange stehen die Tueren offen
  startMinute:  22*60+4,

  /* (6) DIE KONTROLLEURE */
  kontrolleurTempo: 30,
  pruefweite:      16,     // ab hier will er Deinen Fahrschein sehen
  pruefDauer:       1.0,   // so lange braucht er pro Fahrgast
  hoerweite:      130,     // soweit hoeren sie einen Sturz
  strafe:           1,     // soviel Herzen kostet Erwischtwerden

  /* (7) DER FAHRSCHEIN */
  preis:            3,     // soviele Muenzen
  suchDauer:        0.9,   // Unter dem Sitz suchen - dabei haelst Du nichts fest
  reichweite:      15,     // wie nah Du an Leuten und Sachen sein musst
  griffweite:      18,     // wie nah an einer Stange

  leben:            3,
};

const P = {
  ink:'#06060e', weiss:'#f2f0ff', dim:'#8d86a8', dunkel:'#4a4363',
  neon:'#ff3d8b', neon2:'#42d9ff', gold:'#ffd447', rot:'#ff4d4d', gruen:'#48e08a',
  boden:'#232030', bodenKante:'#4c4664', strasse:'#0c0b14',
};
/* ==========================================================================
   3x5 BITMAP-FONT
   ========================================================================== */
const F = {
 A:'010,101,111,101,101', B:'110,101,110,101,110', C:'011,100,100,100,011',
 D:'110,101,101,101,110', E:'111,100,110,100,111', F:'111,100,110,100,100',
 G:'011,100,101,101,011', H:'101,101,111,101,101', I:'111,010,010,010,111',
 J:'001,001,001,101,010', K:'101,110,100,110,101', L:'100,100,100,100,111',
 M:'101,111,111,101,101', N:'101,111,101,101,101', O:'010,101,101,101,010',
 P:'110,101,110,100,100', Q:'010,101,101,110,011', R:'110,101,110,101,101',
 S:'011,100,010,001,110', T:'111,010,010,010,010', U:'101,101,101,101,111',
 V:'101,101,101,101,010', W:'101,101,111,111,101', X:'101,101,010,101,101',
 Y:'101,101,010,010,010', Z:'111,001,010,100,111',
 0:'111,101,101,101,111', 1:'010,110,010,010,111', 2:'111,001,111,100,111',
 3:'111,001,111,001,111', 4:'101,101,111,001,001', 5:'111,100,111,001,111',
 6:'111,100,111,101,111', 7:'111,001,001,001,001', 8:'111,101,111,101,111',
 9:'111,101,111,001,111',
 ' ':'000,000,000,000,000', '.':'000,000,000,000,010', ':':'000,010,000,010,000',
 '-':'000,000,111,000,000', '!':'010,010,010,000,010', '?':'110,001,010,000,010',
 '/':'001,001,010,100,100', '+':'000,010,111,010,000', ',':'000,000,000,010,100',
 '<':'001,010,100,010,001', '>':'100,010,001,010,100', '*':'101,010,111,010,101',
};
const GLYPH={}; for(const k in F) GLYPH[k]=F[k].split(',');

/* ==========================================================================
   BILD-CACHE
   ========================================================================== */
const _ids=new WeakMap(); let _nid=0;
const _spr=new Map(), _out=new Map(), _txt=new Map(), _gly=new Map(), _grd=new Map();
const rowsId=r=>{ let i=_ids.get(r); if(i===undefined){ i=++_nid; _ids.set(r,i);} return i; };
function leinwand(w,h){ const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return [c,x]; }
function verlauf(key,w,h,mal){ let c=_grd.get(key);
  if(!c){ const [cc,xx]=leinwand(w,h); mal(xx); c=cc; _grd.set(key,c); } return c; }

const KEY={ k:'#08060f', s:'#e8b088', h:'#2a1c14', t:'#3ad1a0', p:'#2b2b48', w:'#f2f0ff',
  g:'#ffd447', n:'#ff3d8b', c:'#42d9ff', r:'#ff4d4d', d:'#4a4363', b:'#6b4a2a',
  o:'#a8681f', e:'#20182e', l:'#ffe08a', v:'#c8324a', m:'#7a2d3d', a:'#1a1626',
  j:'#3d2f22', u:'#8c94ad', q:'#2e3350', z:'#5a4632',
  /* Moritz: dunkle Haare, weiss-blaues Trikot */
  H:'#1d150e', T:'#eef2ff', B:'#2f6fd0' };

function backeSprite(rows,sc,tint){
  let bw=0; for(const r of rows) if(r.length>bw) bw=r.length;
  const [c,x]=leinwand(bw*sc,rows.length*sc);
  for(let r=0;r<rows.length;r++){ const row=rows[r];
    for(let i=0;i<row.length;i++){ const ch=row[i]; if(ch==='.') continue;
      x.fillStyle=tint||KEY[ch]||'#fff'; x.fillRect(i*sc,r*sc,sc,sc); } }
  return c;
}
function holeSprite(rows,sc,tint){ const k=rowsId(rows)+'|'+sc+'|'+(tint||'-');
  let c=_spr.get(k); if(!c){ c=backeSprite(rows,sc,tint); _spr.set(k,c);} return c; }
function sprite(rows,x,y,sc=1,tint=null,alpha=1){
  const c=holeSprite(rows,sc,tint);
  if(alpha!==1) ctx.globalAlpha=alpha;
  ctx.drawImage(c,Math.round(x),Math.round(y));
  if(alpha!==1) ctx.globalAlpha=1;
}
function spriteFlip(rows,x,y,sc=1,tint=null){
  const c=holeSprite(rows,sc,tint);
  ctx.save(); ctx.translate(Math.round(x)+c.width,Math.round(y)); ctx.scale(-1,1);
  ctx.drawImage(c,0,0); ctx.restore();
}
function outline(rows,x,y,sc=1,a=.7){
  const k=rowsId(rows)+'|'+sc; let c=_out.get(k);
  if(!c){ const s=holeSprite(rows,sc,'#000'); const [cc,xx]=leinwand(s.width+2*sc,s.height+2*sc);
    xx.drawImage(s,0,sc); xx.drawImage(s,2*sc,sc); xx.drawImage(s,sc,0); xx.drawImage(s,sc,2*sc);
    c=cc; _out.set(k,c); }
  ctx.globalAlpha=a; ctx.drawImage(c,Math.round(x)-sc,Math.round(y)-sc); ctx.globalAlpha=1;
}
function textTo(g,str,x,y,col,s){
  g.fillStyle=col; str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const gl=GLYPH[str[i]]||GLYPH['?'];
    for(let r=0;r<5;r++) for(let c=0;c<3;c++)
      if(gl[r][c]==='1') g.fillRect(x+(i*4+c)*s,y+r*s,s,s); } }
function text(str,x,y,col,s=1){
  str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const ch=str[i]; if(ch===' ') continue;
    const k=ch+col+s; let c=_gly.get(k);
    if(!c){ const [cc,xx]=leinwand(3*s,5*s); textTo(xx,ch,0,0,col,s); c=cc; _gly.set(k,c); }
    ctx.drawImage(c,Math.round(x+i*4*s),Math.round(y)); } }
const textW=(s0,s=1)=>String(s0).length*4*s-s;
const textC=(s0,y,col,s=1)=>text(s0,Math.round((W-textW(s0,s))/2),y,col,s);
function textGlow(str,x,y,col,s=1){
  str=String(str).toUpperCase(); const k=str+'|'+col+'|'+s;
  let c=_txt.get(k);
  if(!c){ const pad=s,[cc,xx]=leinwand(textW(str,s)+2*pad,5*s+2*pad);
    xx.globalAlpha=.25;
    textTo(xx,str,pad-s,pad,col,s); textTo(xx,str,pad+s,pad,col,s);
    textTo(xx,str,pad,pad-s,col,s); textTo(xx,str,pad,pad+s,col,s);
    xx.globalAlpha=1; textTo(xx,str,pad,pad,col,s);
    c=cc; if(_txt.size>300) _txt.clear(); _txt.set(k,c); }
  ctx.drawImage(c,Math.round(x)-s,Math.round(y)-s); }
const textGlowC=(s0,y,col,s=1)=>textGlow(s0,Math.round((W-textW(s0,s))/2),y,col,s);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ==========================================================================
   SPRITES
   ========================================================================== */
/* Zusatzfarben fuer den Bus. KEY kommt aus dem Bild-Cache oben. */
Object.assign(KEY,{
  U:'#1c3a5c',   // Uniform der Kontrolleure
  Y:'#ffdc55',   // Warnweste
  S:'#6e7a94',   // Stangen und Halterungen
  F:'#151a2c',   // Fensterglas bei Nacht
});

const KOPF=['..hhh..','.hsssh.','.sssss.','..sss..'];
const geh=b=>[...KOPF,'..ttt..',...b];
const SPR={
  steh: geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
  geh:[
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk']),
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','.p...p.','.p...p.','kk...kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','.p.pp..','p..pp..','.kk.kk.']),
  ],
  sprung:[...KOPF,'k.ttt.k','.tttttt','..ttt..','..ttt..','..ppp..','.pp.pp.','.p...p.','kk...kk'],
  fall:  [...KOPF,'..ttt..','ktttttk','..ttt..','..ppp..','..p.p..','.pp.pp.','.p...p.','.k...k.'],
  /* Festhalten: ein Arm nach oben an der Stange. */
  griff:['..s....','..s....','..hhh..','.hsssh.','.sssss.','..sss..','..ttt..','.ttttt.',
         'k.ttt..','..ttt..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  /* Unter den Sitz greifen. */
  suchen:[...KOPF,'..ttt..','.ttttts','k.ttt.s','..ttt..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  /* Und wenn es Dich hinlegt. */
  liegt:['..........','..........','..........','.h........','hsssttttts',
         'hsssttttt.','.h.ppppp..','...k...k..'],

  /* MORITZ - dunkle Haare, weiss-blaues Trikot. Aus Level 2 mitgenommen. */
  moritz:['..HHH..','.HsssH.','.sssss.','..sss..','..sss..','..TBT..','.TTBTT.',
          'kTTBTTk','.TTBTT.','..TBT..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* MAX FERDI - Sportler, aus Level 1. */
  max:['..hhh..','.hsssh.','.sssss.','..sss..','..ccc..','.ccccc.','k.ccc.k','..ccc..',
       '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* DER LANGE - zwei Koepfe groesser als alle anderen, steht im Gelenk,
     weil er das lustig findet. */
  lange:['..zzz..','.zsssz.','.sssss.','..sss..','..sss..','..ooo..','.ooooo.',
         'kooooook','.ooooo.','..ooo..','..ooo..','..ppp..','..p.p..','..p.p..',
         '..p.p..','.pp.pp.','.kk..kk'],
  /* Der Fahrer sitzt und schaut nach vorn. */
  fahrer:['..hhh..','.hsssh.','.sssss.','..ttt..','.ttttt.','.ttttt.','..ppp..','.kk.kk.'],
  /* Die Kontrolleure: dunkelblau, Warnweste, Kaeppi. */
  kontrolleur:['.UUUUU.','..UUU..','.hsssh.','.sssss.','..sss..','.UYYYU.','UUYYYUU',
               'kUYYYUk','.UYYYU.','..UUU..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  kontrolleurPrueft:['.UUUUU.','..UUU..','.hsssh.','.sssss.','..sss..','.UYYYUs','UUYYYUs',
                     'kUYYYU.','.UYYYU.','..UUU..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],

  /* Einrichtung */
  /* Bussitz von der Seite: Lehne, Flaeche, zwei Fuesse. */
  sitz:  ['.vv.....','vvv.....','vvv.....','vvvvvvv.','vvvvvvv.','..S...S.','..S...S.'],
  stange:['.SS.','.SS.','.SS.','.SS.','.SS.','.SS.','.SS.','.SS.','.SS.','.SS.',
          '.SS.','.SS.','.SS.','.SS.','.SS.','.SS.','SSSS'],
  automat:['SSSSSSS','S.....S','S.FFF.S','S.FFF.S','S.....S','S.ggg.S','S.....S',
           'S..kk.S','S.....S','SSSSSSS','.S...S.','.S...S.'],
  muenze:['.gg.','gllg','gllg','.gg.'],
  schein:['ggggggg','g.....g','g.kkk.g','g.....g','ggggggg'],
  /* Der Haltewunsch-Knopf leuchtet, wenn der Bus haelt. */
  knopf: ['.SSS.','SrrrS','.SSS.'],
};
let AC=null, muted=false;
/* Alles laeuft durch dieselbe Kette:
       Tonquelle --> DRY  ----------------> MASTER --> Boxen
                 \-> WET --> Verzerrer --/
   Je hoeher der Pegel, desto mehr Signal geht ueber WET und desto lauter
   steht MASTER. Nuechtern hoert man die Anlage, betrunken hoert man sie
   zerren. */
let MASTER=null, DRY=null, WET=null;
function zerrKurve(menge){
  const n=256, c=new Float32Array(n), k=menge*100;
  for(let i=0;i<n;i++){ const x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); }
  return c; }
function ensureAudio(){ if(AC) return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=1; MASTER.connect(AC.destination);
    DRY=AC.createGain(); DRY.gain.value=1; DRY.connect(MASTER);
    const shaper=AC.createWaveShaper();
    shaper.curve=zerrKurve(.5); shaper.oversample='2x'; shaper.connect(MASTER);
    WET=AC.createGain(); WET.gain.value=0; WET.connect(shaper);
    MUS.next=AC.currentTime+.05;
  }
  catch(e){ AC=null; } return AC; }
/* Jede Quelle haengt an beiden Wegen - das Verhaeltnis macht die Verzerrung. */
function anschliessen(g){ if(DRY) g.connect(DRY); if(WET) g.connect(WET);
  if(!DRY&&!WET) g.connect(AC.destination); }
function ton(f,when,dur,type='square',vol=.05){
  if(!AC||muted) return; const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,when);
  g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g); anschliessen(g); o.start(when); o.stop(when+dur+.02); }
const piep=(f,d=.07,t='square',v=.05)=>{ ensureAudio(); if(AC) ton(f,AC.currentTime,d,t,v); };
function glissando(f1,f2,dur,type='square',vol=.05){
  ensureAudio(); if(!AC||muted) return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); anschliessen(g); o.start(t0); o.stop(t0+dur+.02); }
function rauschen(dur=.25,vol=.08){
  ensureAudio(); if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); anschliessen(g); s.start(); }
const SFX={
  schritt:()=>piep(88+Math.random()*18,.03,'triangle',.014),
  griff:  ()=>piep(240,.05,'triangle',.03),
  los:    ()=>piep(180,.04,'triangle',.022),
  reden:  ()=>piep(500+Math.random()*170,.04,'square',.024),

  rumpeln:()=>{ rauschen(.3,.05); glissando(70,45,.32,'sawtooth',.045); },
  stoss:  ()=>{ rauschen(.14,.1); glissando(150,60,.18,'square',.06); },
  sturz:  ()=>{ rauschen(.3,.13); glissando(260,60,.34,'sawtooth',.07); },
  tuer:   ()=>{ glissando(320,520,.22,'sine',.04); rauschen(.14,.03); },
  tuerZu: ()=>{ glissando(520,300,.22,'sine',.04); rauschen(.14,.03); },
  bremse: ()=>glissando(900,300,.6,'sine',.03),
  hupe:   ()=>{ piep(330,.18,'square',.05); setTimeout(()=>piep(262,.24,'square',.05),150); },
  warn:   ()=>piep(880,.07,'square',.05),
  erledigt:()=>{ piep(660,.08); setTimeout(()=>piep(990,.12),85); },
  strafe: ()=>{ rauschen(.3,.1); glissando(300,80,.4,'sawtooth',.06); },
  halt:   ()=>{ piep(1046,.08,'sine',.045); setTimeout(()=>piep(784,.12,'sine',.04),90); },

};

/* Musik: kein Vorgluehen mehr, sondern der Motor. Ein tiefer Dauerton,
   der mit dem Tempo des Busses steigt und faellt, und darueber das
   Ticken der Anzeige. Der Pegel zerrt weiter mit - dieselbe Kette. */
const MUS={next:0,step:0,zerre:-1,motor:null,motorG:null};
const pegelAnteil=()=>{
  const ab=TUNE.verzerrungAb;
  return Math.max(0,Math.min(1,(S.pegel-ab)/Math.max(1,TUNE.pegelMax-ab)));
};
function pegelKlang(){
  const p=(S.modus==='spiel')?pegelAnteil():0;
  if(MUS.zerre>=0&&Math.abs(p-MUS.zerre)<.02) return;
  MUS.zerre=p;
  const nass=p*TUNE.verzerrungMax, jetzt=AC.currentTime;
  DRY.gain.setTargetAtTime(1-nass*.75,jetzt,.25);
  WET.gain.setTargetAtTime(nass,jetzt,.25);
  MASTER.gain.setTargetAtTime(1+p*TUNE.lautBonus,jetzt,.25);
}
/* Der Motor laeuft durch, statt in Toenen gestueckelt zu werden -
   ein Bus macht keine Achtelnoten. */
function motorAn(){
  if(!AC||MUS.motor) return;
  const o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=52;
  f.type='lowpass'; f.frequency.value=260;
  g.gain.value=0;
  o.connect(f); f.connect(g); anschliessen(g); o.start();
  MUS.motor=o; MUS.motorG=g; MUS.motorF=f;
}
const BIMMEL=[0,0,659,0, 0,0,0,0, 523,0,0,0, 0,0,0,0];
function musik(){
  if(!AC) return;
  if(muted||S.modus==='pause'){
    if(MUS.motorG) MUS.motorG.gain.setTargetAtTime(0,AC.currentTime,.15);
    MUS.next=Math.max(MUS.next,AC.currentTime); return;
  }
  if(MUS.next<AC.currentTime) MUS.next=AC.currentTime;
  pegelKlang();
  motorAn();
  /* Motorton haengt am Tempo des Busses */
  if(MUS.motorG){
    const spielt=S.modus==='spiel'||S.modus==='cutscene';
    const laut=spielt?(.02+S.tempo*.045):0;
    MUS.motorG.gain.setTargetAtTime(laut,AC.currentTime,.18);
    MUS.motor.frequency.setTargetAtTime(44+S.tempo*30,AC.currentTime,.25);
    if(MUS.motorF) MUS.motorF.frequency.setTargetAtTime(180+S.tempo*420,AC.currentTime,.25);
  }
  const p=(S.modus==='spiel')?pegelAnteil():0;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BIMMEL.length, f=BIMMEL[i];
    const st=60/104/4*(1+Math.sin(MUS.step*.37)*TUNE.schwankMax*p);
    if(f&&(S.modus==='spiel'||S.modus==='titel')) ton(f,MUS.next,st*.6,'triangle',.014+p*.008);
    MUS.next+=st; MUS.step++;
  }
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende') return;

  S.zeit+=dt;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);
  if(S.pegel>=TUNE.blackoutBei){ verloren('BLACKOUT. IM BUS EINGESCHLAFEN.'); return; }

  fahrplan(dt);
  if(S.modus!=='spiel') return;
  untergrund(dt);
  kontrolle(dt);

  if(S.liegt>0){
    S.liegt=Math.max(0,S.liegt-dt);
    aktionPuffer.length=0;
    kamera(dt); return;
  }
  if(S.reden){
    while(aktionPuffer.length){ aktionPuffer.shift(); naechsteZeile(); }
    kamera(dt); return;
  }
  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0) suchErgebnis();
    aktionPuffer.length=0;
    kamera(dt); return;
  }
  bewegung(dt);
  while(aktionPuffer.length){ aktionPuffer.shift(); aktion(); }
  kamera(dt);
}

/* --------------------------------------------------------------------------
   DER FAHRPLAN

   Ein Zyklus: anfahren -> fahrt -> bremsen -> halt (Tueren auf) -> anfahren.
   Alles andere im Level haengt daran, deshalb steht es zuerst.
   -------------------------------------------------------------------------- */
function fahrplan(dt){
  S.phaseT+=dt;
  const spanne=HALTESTELLEN.length;
  S.minute=TUNE.startMinute+S.halt*2+Math.min(2,S.phaseT/8);

  if(S.phase==='anfahren'){
    S.tempo=Math.min(1,S.phaseT/TUNE.anfahrZeit);
    if(S.phaseT>=TUNE.anfahrZeit){ S.phase='fahrt'; S.phaseT=0; }

  } else if(S.phase==='fahrt'){
    S.tempo=1;
    const rest=TUNE.fahrtZeit-TUNE.anfahrZeit-TUNE.bremsZeit;
    if(S.phaseT>=rest){
      S.phase='bremsen'; S.phaseT=0; SFX.bremse();
      zeigeHinweis('DER BUS BREMST - FESTHALTEN',2.2);
    }

  } else if(S.phase==='bremsen'){
    S.tempo=Math.max(0,1-S.phaseT/TUNE.bremsZeit);
    if(S.phaseT>=TUNE.bremsZeit){
      S.phase='halt'; S.phaseT=0; S.tempo=0;
      /* Angekommen - erst jetzt ist die naechste Haltestelle die aktuelle. */
      S.halt=Math.min(HALTESTELLEN.length-1,S.halt+1);
      tuerenAuf();
    }

  } else if(S.phase==='halt'){
    S.tempo=0;
    S.tuerT=Math.max(0,TUNE.tuerZeit-S.phaseT);
    if(S.tuerenAuf&&S.tuerT<=0) tuerenZu();
    if(S.phaseT>=TUNE.tuerZeit+0.8){
      /* Wer jetzt noch draussen steht, hat den Bus verpasst. */
      if(S.draussen){ verloren('DER BUS IST OHNE DICH LOSGEFAHREN.'); return; }
      if(halteStelle().ziel){ verloren('AM CLUB VORBEIGEFAHREN.'); return; }
      S.phase='anfahren'; S.phaseT=0;
      SFX.hupe();
      /* Wer lange genug mitgefahren ist, steigt hier aus. */
      const vorher=S.kontrolleure.length;
      S.kontrolleure=S.kontrolleure.filter(k=>k.aussteigen>S.halt);
      if(vorher&&!S.kontrolleure.length) meldung('SIE SIND RAUS',1.6);
    }
  }
}
function tuerenAuf(){
  S.tuerenAuf=true; S.tuerT=TUNE.tuerZeit; SFX.tuer();
  const h=halteStelle();
  meldung(h.name,2);
  if(h.ziel){ zeigeHinweis('AUSSTEIGEN - E AN EINER TUER',4); return; }
  if(h.kontrolle) steigenEin(h.kontrolle);
}
function tuerenZu(){
  S.tuerenAuf=false; SFX.tuerZu();
  if(S.draussen) zeigeHinweis('DIE TUEREN SIND ZU',2);
  else if(!halteStelle().ziel) zeigeHinweis('ER FAEHRT GLEICH AN - FESTHALTEN',2.4);
}

/* --------------------------------------------------------------------------
   DER FAHRENDE UNTERGRUND

   S.drift ist die Seitwaerts-Geschwindigkeit, die NICHT von Dir kommt.
   Der Bus schiebt sie hoch, Reibung baut sie ab, Festhalten schluckt sie.
   Wird sie groesser als das, was Du aushaeltst, liegst Du.
   -------------------------------------------------------------------------- */
function untergrund(dt){
  /* Draussen an der Haltestelle steht der Boden still. */
  if(S.draussen){ S.drift*=Math.max(0,1-12*dt); S.haelt=false; return; }

  const pegelP=Math.max(0,Math.min(1,S.pegel/TUNE.pegelMax));
  const staerker=1+pegelP*TUNE.pegelSchwanken;
  const imGelenk=abschnittBei(S.x).gelenk;
  const platz=imGelenk?TUNE.gelenkFaktor:1;

  /* Festhalten geht nur an einer Stange, auf einem Sitz oder auf der
     Rueckbank. Sonst greifst Du ins Leere. Auf der Rueckbank sitzt Du -
     das haelt von allein. */
  S.haltePunkt=griffInDerNaehe();
  const aufDerBank = S.x<SICHER_BIS;
  S.haelt = S.liegt<=0 && (aufDerBank || (haltenAn && S.haltePunkt!==null));
  /* Wer liegt, sammelt keine neue Drift - sonst steht man auf und faellt
     im selben Bild wieder hin. */
  if(S.liegt>0){ S.drift*=Math.max(0,1-6*dt); S.standGnade=0.55; return; }
  if(S.standGnade>0) S.standGnade-=dt;

  let kraft=0;
  if(S.phase==='fahrt'||S.phase==='bremsen'||S.phase==='anfahren'){
    /* Das Dauerpendeln wird vom Pegel verstaerkt - Bremsen und Anfahren
       nicht. Die druecken so oder so ueber alles, was man aushaelt; sie
       noch zu skalieren wuerde nur die Zahl aendern, nicht das Ergebnis. */
    kraft+=Math.sin(S.t*TUNE.schwankTakt*Math.PI*2)*TUNE.schwanken*S.tempo*staerker;
    if(S.phase==='bremsen') kraft+=TUNE.bremsKraft*(1-S.phaseT/TUNE.bremsZeit*.4);
    if(S.phase==='anfahren') kraft-=TUNE.anfahrKraft*(1-S.phaseT/TUNE.anfahrZeit*.4);
  }
  kraft*=platz;

  /* Schlagloecher. Sie kuendigen sich an - ein Ruck ohne Vorwarnung
     waere nicht zu spielen, nur zu ertragen. */
  if(S.phase==='fahrt'||S.phase==='anfahren'){
    S.schlagT-=dt;
    if(S.schlagT<=0&&S.schlagWarnt<=0){
      S.schlagWarnt=TUNE.schlaglochWarnung;
      S.schlagRichtung=Math.random()<.5?-1:1;
      SFX.rumpeln();
    }
    if(S.schlagWarnt>0){
      S.schlagWarnt-=dt;
      S.ruettel=Math.max(S.ruettel,2.2);
      if(S.schlagWarnt<=0){
        S.drift+=S.schlagRichtung*TUNE.schlaglochStoss*platz;
        S.ruettel=6; SFX.stoss();
        S.schlagT=TUNE.schlaglochAb+Math.random()*(TUNE.schlaglochBis-TUNE.schlaglochAb);
      }
    }
  }

  if(S.haelt){
    S.drift*=Math.max(0,1-TUNE.griffAbbau*dt);
  } else {
    S.drift+=kraft*dt;
    S.drift*=Math.max(0,1-TUNE.reibung*dt);
    const haltbar=TUNE.standFestigkeit*(1-pegelP*TUNE.pegelStand);
    if(S.standGnade<=0&&Math.abs(S.drift)>haltbar) umfallen();
  }
}
/* Was in Reichweite ist, um sich daran festzuhalten. Die Rueckbank zaehlt
   immer - dort sitzt man.

   Und DER LANGE zaehlt auch. Im Gelenk gibt es genau eine Stange, und er
   steht mitten drin; ohne ihn koennte man dort nicht mal mit ihm reden,
   ohne umzufallen. Er findet das lustig. */
const LANGE=LEUTE.find(l=>l.id==='lange');
function griffInDerNaehe(){
  if(S.x<SICHER_BIS) return {art:'bank',x:S.x};
  for(const x of STANGEN) if(Math.abs(x-S.x)<TUNE.griffweite) return {art:'stange',x};
  for(const x of SITZE)   if(Math.abs(x+4-S.x)<TUNE.griffweite) return {art:'sitz',x};
  if(Math.abs(LANGE.x-S.x)<TUNE.griffweite) return {art:'lange',x:LANGE.x};
  return null;
}
function umfallen(){
  S.liegt=TUNE.umfallDauer; S.drift=0; S.vx=0;
  S.ruettel=7; SFX.sturz();
  meldung(pick(['HINGEFLOGEN','AUFS GESICHT','DAS WAR LAUT']),1.4);
  /* Und das hoert man. Wer in Hoerweite ist, dreht um und kommt schneller -
     auch wenn er seine Runde schon durch hatte. Hinter ihm zu stehen hilft
     nur, solange man leise ist. */
  for(const k of S.kontrolleure){
    if(k.dichGeprueft) continue;
    if(Math.abs(k.x-S.x)<TUNE.umfallLaerm){
      k.richtung=Math.sign(S.x-k.x)||k.richtung;
      k.ziel=k.richtung<0?10:LEVEL_B-10;
      k.fertig=false; k.aufmerksam=2.5;
    }
  }
}

/* --------------------------------------------------------------------------
   BEWEGUNG
   -------------------------------------------------------------------------- */
function bewegung(dt){
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  /* Wer sich festhaelt, bleibt stehen. Das ist der Preis. */
  const frei=!S.haelt;
  const langsam=S.pegel>TUNE.langsamAb?1-(S.pegel-TUNE.langsamAb)/100:1;
  const hoechst=TUNE.gehTempo*tempoBonus()*langsam;
  if(richtung&&frei){
    S.vx+=richtung*TUNE.beschleunigung*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=(S.vx+(S.haelt?0:S.drift))*dt;
  if(S.x<8||S.x>LEVEL_B-8){ S.vx=0; S.drift=0; }
  S.x=Math.max(8,Math.min(LEVEL_B-8,S.x));

  if(Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  S.y=S.draussen?STRASSE:BODEN;
}

/* --------------------------------------------------------------------------
   DIE AKTIONSTASTE

   Das Naehere gewinnt, wie in Level 2 - sonst waere der Automat neben dem
   Fahrgast nicht mehr zu erreichen.
   -------------------------------------------------------------------------- */
function aktion(){
  /* Tuer zuerst: an einer offenen Tuer ist Rein und Raus wichtiger als
     alles andere, was zufaellig danebensteht. */
  const tuer=TUEREN.find(t=>Math.abs(t.x-S.x)<TUNE.reichweite+4);
  if(tuer&&S.tuerenAuf){ durchDieTuer(tuer); return; }

  if(S.draussen){ meldung('DIE TUER IST DA DRUEBEN',1.2); SFX.nichts(); return; }

  let person=null, dPerson=1e9;
  for(const l of ANSPRECHBAR){ const d=Math.abs(l.x-S.x);
    if(d<TUNE.reichweite&&d<dPerson){ person=l; dPerson=d; } }
  let sitz=null, dSitz=1e9;
  for(const x of SITZE){ const d=Math.abs(x+4-S.x);
    if(d<TUNE.reichweite&&d<dSitz){ sitz=x; dSitz=d; } }
  const dAutomat=Math.abs(AUTOMAT+3-S.x);

  if(dAutomat<TUNE.reichweite&&dAutomat<=dPerson&&dAutomat<=dSitz){ ziehFahrschein(); return; }
  if(person&&(sitz===null||dPerson<=dSitz)){ rede(person); return; }
  if(sitz!==null){ durchsuche(sitz); return; }
  if(tuer){ meldung('DIE TUER IST ZU',1.2); SFX.nichts(); return; }
  SFX.nichts();
}

function durchDieTuer(tuer){
  if(S.draussen){
    S.draussen=false; S.y=BODEN; SFX.tuer();
    meldung('WIEDER DRIN',1.2);
    return;
  }
  const h=halteStelle();
  if(h.ziel){ gewonnen(); return; }
  S.draussen=true; S.y=STRASSE; S.drift=0; SFX.tuer();
  meldung('RAUS AUF DEN BORDSTEIN',1.4);
  zeigeHinweis('REIN BEVOR DIE TUEREN ZUGEHEN',2.6);
}

function durchsuche(x){
  if(S.durchsucht[x]){ meldung('DA WAR NICHTS',1); SFX.nichts(); return; }
  S.suchT=TUNE.suchDauer; S.suchZiel=x; SFX.suchen();
}
function suchErgebnis(){
  const x=S.suchZiel; S.suchZiel=null;
  S.durchsucht[x]=true;
  if(S.geld[x]){
    S.muenzen++; SFX.fund(); S.blitz=.4;
    meldung('EINE MUENZE  '+S.muenzen+'/'+TUNE.preis,1.6);
    if(S.muenzen>=TUNE.preis&&!S.entwertet)
      zeigeHinweis('DAS REICHT - AUTOMAT IST GANZ VORNE',3.2);
  } else {
    SFX.nichts(); meldung(pick(['NUR STAUB','EIN KAUGUMMI','NICHTS']),1.2);
  }
}
function ziehFahrschein(){
  if(S.entwertet){ meldung('HAST SCHON EINEN',1.2); SFX.nichts(); return; }
  if(S.muenzen<TUNE.preis){
    meldung('ZU WENIG  '+S.muenzen+'/'+TUNE.preis,1.6); SFX.nichts();
    zeigeHinweis('UNTER DEN SITZEN LIEGT KLEINGELD',2.6);
    return;
  }
  S.muenzen-=TUNE.preis; S.entwertet=true; S.blitz=.7;
  SFX.erledigt(); meldung('FAHRSCHEIN. ENTWERTET.',2.2);
  zeigeHinweis('JETZT KANN DIR KEINER MEHR WAS',3);
}

/* ---- Reden ---- */
function rede(p){
  S.reden=p; S.redeZeile=0; S.vx=0; SFX.reden();
  p._zeilen=(p.spaet&&S.pegel>=TUNE.wackelnAb)?p.spaet:p.zeilen;
  if(p.id==='lange'&&S.entwertet) p._zeilen=['DU HAST EINEN FAHRSCHEIN','ORDENTLICH','RESPEKT'];
}
function naechsteZeile(){
  const p=S.reden;
  S.redeZeile++;
  if(S.redeZeile>=p._zeilen.length){ S.reden=null; return; }
  SFX.reden();
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* --------------------------------------------------------------------------
   DIE KONTROLLEURE

   Einer steigt an der Tuer ein und arbeitet sich in EINE Richtung durch
   den Bus, bis zum Ende. Dann bleibt er stehen. Das ist wichtig: dadurch
   gibt es einen Bereich, den er nie sieht - alles VOR seiner Tuer. Wer
   an der Haltestelle rausgeht und hinter ihm wieder einsteigt, ist durch.
   Das ist der ganze Trick, und am RATHAUS kann man ihn lernen.

   Am SUEDPARK steigen zwei ein, von beiden Tueren, und laufen aufeinander
   zu. Dann bleibt kein Bereich mehr uebrig. Bis dahin muss der Fahrschein
   stehen - deshalb sind die Kontrollhaltestellen im Fahrplan von Anfang
   an rot markiert.

   Einmal geprueft ist geprueft. Wer aber hinfaellt, macht Laerm: dann
   dreht der naechste um und kommt zurueck, auch wenn er schon fertig war.
   -------------------------------------------------------------------------- */
function steigenEin(von){
  S.kontrolleure=von.map(seite=>({
    seite,
    x: seite==='vorne'?TUEREN[1].x:TUEREN[0].x,
    richtung: seite==='vorne'?-1:1,
    ziel:     seite==='vorne'?10:LEVEL_B-10,
    prueft:null, pruefT:0, aufmerksam:0, dichGeprueft:false, fertig:false,
    geprueft:{},
    /* Sie fahren eine Haltestelle mit. Ohne das waeren sie an derselben
       Haltestelle wieder draussen, an der sie eingestiegen sind. */
    aussteigen:S.halt+1,
  }));
  SFX.warn(); S.ruettel=3;
  meldung(von.length>1?'ZWEI IN UNIFORM STEIGEN EIN':'EINER IN UNIFORM STEIGT EIN',2.6);
  if(S.entwertet) zeigeHinweis('DU HAST JA EINEN FAHRSCHEIN',3);
  else if(von.length>1) zeigeHinweis('VON BEIDEN SEITEN. DA HILFT NICHTS MEHR.',3.6);
  else zeigeHinweis('GEH RAUS UND STEIG HINTER IHM WIEDER EIN',4);
}
function kontrolle(dt){
  for(const k of S.kontrolleure){
    if(k.aufmerksam>0) k.aufmerksam-=dt;
    /* Prueft gerade jemanden */
    if(k.prueft){
      k.pruefT-=dt;
      if(k.pruefT<=0){ k.prueft=null; }
      continue;
    }
    if(!k.fertig){
      const tempo=TUNE.kontrolleurTempo*(k.aufmerksam>0?1.6:1);
      k.x+=k.richtung*tempo*dt;
      /* Am Ende seiner Richtung bleibt er stehen. Er laeuft nicht zurueck -
         sonst gaebe es keinen Bereich, in dem man sicher ist. */
      if((k.richtung<0&&k.x<=k.ziel)||(k.richtung>0&&k.x>=k.ziel)){
        k.x=k.ziel; k.fertig=true;
      }
    }

    /* Fahrgast in Reichweite? */
    const gast=ANSPRECHBAR.find(l=>l.id!=='fahrer'&&Math.abs(l.x-k.x)<TUNE.pruefweite
                                   &&!k.geprueft[l.id]);
    if(gast){
      k.geprueft[gast.id]=true;
      k.prueft=gast; k.pruefT=TUNE.pruefDauer; continue;
    }
    /* Und Du? Draussen und liegend gilt nicht - draussen sieht er Dich
       gar nicht, liegend leider besonders gut. */
    if(!S.draussen&&!k.dichGeprueft&&Math.abs(S.x-k.x)<TUNE.pruefweite){
      k.dichGeprueft=true; k.prueft={id:'du',name:'DU',x:S.x}; k.pruefT=TUNE.pruefDauer;
      if(S.entwertet){ meldung('DANKE. SCHOENEN ABEND.',2); SFX.erledigt(); }
      else erwischt();
    }
  }
}
function erwischt(){
  S.hp-=TUNE.strafe; S.ruettel=7; S.blitz=.6; SFX.strafe();
  meldung('SCHWARZFAHREN. VIERZIG EURO.',2.6);
  if(S.hp<=0){ verloren('SIE HABEN DICH RAUSGESETZT.'); return; }
  zeigeHinweis('NOCH '+S.hp+' MAL, DANN FLIEGST DU RAUS',3);
}

/* --------------------------------------------------------------------------
   SCHLUSS
   -------------------------------------------------------------------------- */
function verloren(grund){
  S.modus='ende'; S.gewonnen=false; S.grund=grund; SFX.strafe();
  Fortschritt.setzePegel(S.pegel);
}
function gewonnen(){
  S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0;
  S.draussen=true; S.y=STRASSE; S.kontrolleure=[];
  SFX.sieg();
}
const SZENEN=[
  { d:1.2, txt:'' },
  { d:2.4, txt:'*IHR STEHT AN DER HALTESTELLE CLUB*' },
  { d:2.2, txt:'MORITZ: DAS WAR KNAPP' },
  { d:2.4, txt:'MAX FERDI: DER STAND DIE GANZE ZEIT IM GELENK' },
  { d:1.2, txt:'' },
  { d:2.6, txt:'DER LANGE: ICH FAHR DA IMMER MIT' },
  { d:2.4, txt:'DER LANGE: UND ICH KENN DEN TUERSTEHER' },
  { d:2.2, txt:'DU: DANN KOMM MIT' },
  { d:2.0, txt:'' },
  { d:2.8, txt:'DER LANGE IST JETZT DABEI' },
  { d:2.8, txt:'MIT IHM SIEHST DU UEBER DIE LEUTE HINWEG' },
  { d:2.4, txt:'LEVEL 3 GESCHAFFT' },
];
function levelGeschafft(){
  Fortschritt.nimmAuf('DER LANGE');
  Fortschritt.geschafft(LEVEL_NR);
  Fortschritt.setzePegel(S.pegel);
  S.neueBestzeit=Fortschritt.setzeBestzeit(LEVEL_NR,S.zeit);
  Fortschritt.leiste(LEVEL_NR);
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}
/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  /* Das Bild kippt mit dem Bus. Bei Pegel kommt das eigene Schwanken dazu. */
  const wack=S.pegel>TUNE.wackelnAb?(S.pegel-TUNE.wackelnAb)/45*2.6:0;
  const busNeigung=S.draussen?0:(S.drift/TUNE.standFestigkeit)*2.2;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack+busNeigung;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneBus(dt);
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

/* Die Nacht draussen zieht vorbei - das ist der einzige Beweis, dass der
   Bus faehrt. Steht er, steht sie auch.

   Sie wird zweimal gezeichnet: einmal ueber dem Bus als Himmel, und einmal
   IN jedem Fenster. Das Fenster ist ein Loch, kein blaues Rechteck - sonst
   sieht ein stehender Bus genauso aus wie ein fahrender. */
let strassenVersatz=0;
function nachtVersatz(dt){
  strassenVersatz=(strassenVersatz+S.tempo*300*dt)%2000;
}
/* Zeichnet Stadt und Laternen in ein Rechteck. `tiefe` verschiebt die
   Ebene gegeneinander - der Himmel oben zieht langsamer als die Haeuser
   im Fenster, sonst wirkt es flach. */
function zeichneDraussen(x0,y0,bw,bh,tiefe){
  ctx.save();
  ctx.beginPath(); ctx.rect(x0,y0,bw,bh); ctx.clip();
  ctx.fillStyle='#080a16'; ctx.fillRect(x0,y0,bw,bh);
  const v=strassenVersatz*tiefe, unten=y0+bh;
  for(let i=0;i<26;i++){
    const roh=(i*97-v)%460; const x=x0+((roh%460)+460)%460-60;
    const h=Math.min(bh, 10+(i*29)%30), y=unten-h;
    ctx.fillStyle=i%5===0?'#161d36':'#111629';
    ctx.fillRect(x,y,9+(i%3)*7,h);
    if(i%3===0){ ctx.fillStyle='#2c3760'; ctx.fillRect(x+2,y+3,2,2); }
    if(i%4===0){ ctx.fillStyle='#402c5e'; ctx.fillRect(x+6,y+8,2,2); }
    if(i%6===0){ ctx.fillStyle='#5a4a2a'; ctx.fillRect(x+4,y+13,2,2); }
  }
  /* Laternen ziehen schneller vorbei - sie stehen naeher */
  for(let i=0;i<8;i++){
    const roh=(i*118-v*2.2)%460; const x=x0+((roh%460)+460)%460-60;
    ctx.fillStyle='#242a44'; ctx.fillRect(x,y0,1,bh);
    ctx.fillStyle='#ffdf9a'; ctx.fillRect(x-1,y0+2,3,2);
    ctx.globalAlpha=.12; ctx.fillStyle='#ffdf9a';
    ctx.fillRect(x-6,y0+2,13,bh-4); ctx.globalAlpha=1;
  }
  ctx.restore();
}

function zeichneBus(dt){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  nachtVersatz(dt);
  /* Himmel ueber dem Bus */
  zeichneDraussen(0,0,LEVEL_B,42,.35);

  /* Strasse unter dem Bus */
  ctx.fillStyle=P.strasse; ctx.fillRect(0,42,LEVEL_B,H-42);
  ctx.fillStyle='#171426'; ctx.fillRect(0,STRASSE,LEVEL_B,H-STRASSE);
  ctx.fillStyle='#2a2540'; ctx.fillRect(0,STRASSE,LEVEL_B,1);

  /* Der Bus als Kasten */
  const dach=42, unten=STRASSE-1;
  ctx.fillStyle='#171b2c'; ctx.fillRect(0,dach,LEVEL_B,unten-dach);
  ctx.fillStyle='#20263c'; ctx.fillRect(0,dach,LEVEL_B,3);
  ctx.fillStyle=P.boden;   ctx.fillRect(0,BODEN,LEVEL_B,unten-BODEN);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,LEVEL_B,1);
  ctx.fillStyle='#00000033';
  for(let x=0;x<LEVEL_B;x+=16) ctx.fillRect(x,BODEN+6,8,1);

  /* Fenster sind Loecher, keine blauen Rechtecke - dahinter zieht die
     Nacht vorbei, und daran sieht man, ob der Bus faehrt. */
  for(let x=10;x<LEVEL_B-16;x+=54){
    const inTuer=TUEREN.some(t=>Math.abs(t.x-(x+20))<26);
    if(inTuer) continue;
    zeichneDraussen(x+1,dach+9,40,38,1);
    /* Spiegelung auf dem Glas */
    ctx.globalAlpha=.13; ctx.fillStyle='#7d9ee0';
    ctx.fillRect(x+1,dach+9,40,7); ctx.globalAlpha=1;
    /* Rahmen */
    ctx.fillStyle='#20263c';
    ctx.fillRect(x,dach+8,42,1); ctx.fillRect(x,dach+47,42,1);
    ctx.fillRect(x,dach+8,1,40); ctx.fillRect(x+41,dach+8,1,40);
  }

  /* Das Gelenk in der Mitte: Faltenbalg */
  const g=ABSCHNITTE.find(a=>a.gelenk);
  ctx.fillStyle='#0e1120'; ctx.fillRect(g.von,dach,g.bis-g.von,unten-dach);
  ctx.fillStyle='#1a1f33';
  for(let x=g.von;x<g.bis;x+=6) ctx.fillRect(x,dach,3,unten-dach);
  ctx.fillStyle=P.boden; ctx.fillRect(g.von,BODEN,g.bis-g.von,unten-BODEN);
  /* Die Drehscheibe im Boden - sie dreht sich sichtbar mit dem Schwanken */
  const dreh=Math.sin(S.t*TUNE.schwankTakt*Math.PI*2)*S.tempo*3;
  ctx.fillStyle='#3a3350';
  ctx.fillRect(g.von+8,BODEN+2+Math.round(dreh),g.bis-g.von-16,1);
  ctx.fillStyle='#151828';
  ctx.fillRect(g.von,dach,1,unten-dach); ctx.fillRect(g.bis-1,dach,1,unten-dach);

  /* Tueren */
  for(const t of TUEREN){
    const auf=S.tuerenAuf;
    ctx.fillStyle=auf?'#05070e':'#131826';
    ctx.fillRect(t.x-13,dach+6,26,unten-dach-6);
    ctx.fillStyle=auf?'#2f3a58':'#232a42';
    ctx.fillRect(t.x-13,dach+6,1,unten-dach-6);
    ctx.fillRect(t.x+12,dach+6,1,unten-dach-6);
    if(!auf){ ctx.fillStyle='#232a42'; ctx.fillRect(t.x-1,dach+6,2,unten-dach-6); }
    else {
      /* Offene Tuer: Licht faellt auf den Bordstein */
      ctx.globalAlpha=.16; ctx.fillStyle='#ffe6a8';
      ctx.fillRect(t.x-14,BODEN,28,STRASSE-BODEN+2); ctx.globalAlpha=1;
      if(Math.floor(S.t*3)%2===0)
        text('E',t.x-1,BODEN-10,P.gold);
    }
    /* Haltewunsch-Knopf */
    sprite(SPR.knopf,t.x+16,dach+22,1,S.tuerenAuf?null:'#3a3350');
  }

  /* Stangen */
  for(const x of STANGEN){
    const rows=SPR.stange;
    const nah=S.haltePunkt&&S.haltePunkt.art==='stange'&&S.haltePunkt.x===x;
    sprite(rows,x-2,BODEN-rows.length,1,nah?(S.haelt?P.gruen:P.gold):null);
  }

  /* Sitze */
  for(const x of SITZE){
    const rows=SPR.sitz;
    outline(rows,x,BODEN-rows.length,1,.45);
    sprite(rows,x,BODEN-rows.length);
    if(S.durchsucht[x]) text('OK',x+4-textW('OK')/2,BODEN-rows.length-8,P.dunkel);
    else if(!S.draussen&&Math.abs(x+4-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden
            &&Math.floor(S.t*4)%2===0)
      text('E',x+3,BODEN-rows.length-8,P.gold);
  }

  /* Automat */
  {
    const rows=SPR.automat;
    outline(rows,AUTOMAT,BODEN-rows.length,1,.5);
    sprite(rows,AUTOMAT,BODEN-rows.length);
    const bereit=S.muenzen>=TUNE.preis&&!S.entwertet;
    text('AUTOMAT',AUTOMAT+3-textW('AUTOMAT')/2,BODEN-rows.length-9,
         S.entwertet?P.dunkel:(bereit?P.gold:P.dim));
    if(!S.draussen&&Math.abs(AUTOMAT+3-S.x)<TUNE.reichweite&&Math.floor(S.t*4)%2===0)
      text('E',AUTOMAT+2,BODEN-rows.length-16,bereit?P.gold:P.dunkel);
  }

  /* Fahrgaeste */
  for(const m of MITFAHRER){
    const rows=m.rows, y=BODEN-rows.length+(Math.sin(S.t*2.1+m.takt)>.6?1:0);
    const schaut=Math.sin(S.t*.35+m.takt)>0?1:-1;
    outline(rows,m.x-3,y,1,.45);
    if(schaut<0) spriteFlip(rows,m.x-3,y); else sprite(rows,m.x-3,y);
    if(!S.draussen&&Math.abs(m.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden
       &&Math.floor(S.t*4)%2===0) text('E',m.x+2,y-9,P.dunkel);
  }

  /* Die Jungs und der Fahrer */
  LEUTE.forEach((l,i)=>{
    const rows=SPR[l.spr]||SPR.steh;
    const y=BODEN-rows.length;
    outline(rows,l.x-3,y,1,.55);
    sprite(rows,l.x-3,y);
    const dabei=Fortschritt.hat(l.name);
    /* Versetzt, sonst schieben sich MORITZ und MAX FERDI ineinander. */
    text(l.name,l.x+3-textW(l.name)/2,y-16-(i%2)*7,dabei?P.gruen:P.dim);
    if(!S.draussen&&Math.abs(l.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden
       &&Math.floor(S.t*4)%2===0) text('E',l.x+2,y-9,P.gold);
  });

  /* Kontrolleure */
  for(const k of S.kontrolleure){
    const rows=k.prueft?SPR.kontrolleurPrueft:SPR.kontrolleur;
    const y=BODEN-rows.length;
    outline(rows,k.x-3,y,1,.7);
    if(k.richtung<0) spriteFlip(rows,k.x-3,y); else sprite(rows,k.x-3,y);
    if(k.prueft){
      const t='FAHRSCHEIN';
      textGlow(t,k.x+3-textW(t)/2,y-10,P.rot);
    } else if(k.fertig){
      if(Math.floor(S.t*1.5)%2===0) text('...',k.x+3-textW('...')/2,y-10,P.dunkel);
    } else if(Math.floor(S.t*5)%2===0){
      text('!',k.x+2,y-10,k.aufmerksam>0?P.rot:P.gold);
    }
    /* Wie weit ist er noch weg */
    ctx.globalAlpha=.25; ctx.fillStyle=P.rot;
    ctx.fillRect(Math.min(k.x,S.x),BODEN+2,Math.abs(k.x-S.x),1); ctx.globalAlpha=1;
  }

  /* Spieler */
  let rows;
  if(S.liegt>0) rows=SPR.liegt;
  else if(S.suchT>0) rows=SPR.suchen;
  else if(S.haelt) rows=SPR.griff;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  const py=S.y-rows.length;
  outline(rows,S.x-3,py,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,py); else sprite(rows,S.x-3,py);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),S.y,7,1); ctx.globalAlpha=1;

  /* Was gerade greifbar ist */
  if(!S.draussen&&S.haltePunkt&&!S.haelt&&S.liegt<=0&&Math.floor(S.t*3)%2===0&&S.x>=SICHER_BIS)
    text('SHIFT',S.haltePunkt.x+2-textW('SHIFT')/2,py-10,P.neon2);
  if(S.haelt&&S.haltePunkt&&S.haltePunkt.art==='lange')
    text('HAELT DICH',LANGE.x+3-textW('HAELT DICH')/2,BODEN-SPR.lange.length-24,P.gruen);

  /* Suchbalken */
  if(S.suchT>0){
    const f=1-S.suchT/TUNE.suchDauer, bw=26;
    ctx.fillStyle='#000a'; ctx.fillRect(S.x-bw/2-1,py-9,bw+2,5);
    ctx.fillStyle=P.gold;  ctx.fillRect(S.x-bw/2,py-8,Math.round(bw*f),3);
  }

  ctx.restore();

  /* Vignette */
  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.42+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g2=>{
    const gr=g2.createRadialGradient(W/2,H*.5,48,W/2,H*.5,W*.62);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g2.fillStyle=gr; g2.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  /* Herzen */
  for(let i=0;i<TUNE.leben;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  text(uhr,W-textW(uhr)-6,6,P.dim);

  /* Der Fahrplan als Perlenschnur - man muss sehen, wie weit es noch ist */
  const n=HALTESTELLEN.length, br=Math.min(120,W-120);
  const bx=Math.round((W-br)/2), by=8;
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,br,1);
  HALTESTELLEN.forEach((h,i)=>{
    const x=bx+Math.round(br*i/(n-1));
    const durch=i<S.halt, jetzt=i===S.halt&&S.phase==='halt';
    ctx.fillStyle=h.ziel?P.gold:(durch?P.dunkel:(jetzt?P.neon2:'#3a3350'));
    ctx.fillRect(x-1,by-2,3,5);
    if(h.kontrolle&&i>=S.halt){ ctx.fillStyle=P.rot; ctx.fillRect(x-1,by-5,3,2); }
  });
  /* Der Bus selbst auf der Schnur */
  const anteil=S.phase==='halt'?0:Math.min(1,S.phaseT/
    (S.phase==='anfahren'?TUNE.anfahrZeit
    :S.phase==='bremsen'?TUNE.bremsZeit
    :TUNE.fahrtZeit-TUNE.anfahrZeit-TUNE.bremsZeit));
  const stufe=S.phase==='anfahren'?anteil*.2:S.phase==='fahrt'?.2+anteil*.6
             :S.phase==='bremsen'?.8+anteil*.2:0;
  const bpos=bx+Math.round(br*Math.min(n-1,S.halt+stufe)/(n-1));
  ctx.fillStyle=P.weiss; ctx.fillRect(bpos-1,by-1,2,3);
  const naechste=HALTESTELLEN[Math.min(n-1,S.halt+(S.phase==='halt'?0:1))];
  const nam=(S.phase==='halt'?'':'> ')+naechste.name;
  text(nam,bx+(br-textW(nam))/2,by+5,naechste.ziel?P.gold:P.dim);

  /* Standfestigkeit - der wichtigste Balken im Level */
  if(!S.draussen){
    const pegelP=Math.max(0,Math.min(1,S.pegel/TUNE.pegelMax));
    const haltbar=TUNE.standFestigkeit*(1-pegelP*TUNE.pegelStand);
    const f=Math.min(1,Math.abs(S.drift)/haltbar);
    const bw=40, x0=6, y0=20;
    ctx.fillStyle='#000a'; ctx.fillRect(x0-1,y0-1,bw+2,6);
    ctx.fillStyle='#2a2440'; ctx.fillRect(x0,y0,bw,4);
    /* nach links oder rechts, je nachdem wohin es Dich zieht */
    const mitte=x0+bw/2, len=Math.round(bw/2*f);
    ctx.fillStyle=S.haelt?P.gruen:(f>.75?P.rot:f>.45?P.gold:P.neon2);
    if(S.drift>=0) ctx.fillRect(mitte,y0,len,4); else ctx.fillRect(mitte-len,y0,len,4);
    ctx.fillStyle=P.dunkel; ctx.fillRect(mitte,y0-1,1,6);
    const wie=S.x<SICHER_BIS?'SITZT':(S.haelt?'FESTGEHALTEN':'STAND');
    text(wie,x0,y0+6,S.haelt?P.gruen:P.dunkel);
  }

  /* Fahrschein und Kleingeld */
  let ix=W-30;
  if(S.entwertet){ sprite(SPR.schein,ix,16); ix-=12; }
  else {
    for(let i=0;i<S.muenzen;i++){ sprite(SPR.muenze,ix,16); ix-=6; }
    const t=S.muenzen+'/'+TUNE.preis;
    text(t,W-textW(t)-6,24,S.muenzen>=TUNE.preis?P.gold:P.dunkel);
  }

  /* Tuer-Countdown - das ist die Uhr, die im Halt zaehlt */
  if(S.tuerenAuf){
    const rest=Math.max(0,S.tuerT), f=rest/TUNE.tuerZeit;
    const bw=70, x0=Math.round((W-bw)/2), y0=H-14;
    ctx.fillStyle='#000a'; ctx.fillRect(x0-1,y0-1,bw+2,6);
    ctx.fillStyle=f<.35?P.rot:P.gruen; ctx.fillRect(x0,y0,Math.round(bw*f),4);
    const t='TUEREN  '+rest.toFixed(1);
    text(t,Math.round((W-textW(t))/2),y0-7,f<.35?P.rot:P.dim);
  }

  /* Kontrolleur-Warnung */
  if(S.kontrolleure.length&&!S.entwertet&&!S.draussen&&Math.floor(S.t*3)%2===0)
    textC('KONTROLLE',34,P.rot);

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-32,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-22,P.gold,1); ctx.globalAlpha=1; }

  /* Gespraech */
  if(S.reden){
    const p2=S.reden;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(p2.name,8,H-38,P.neon2);
    textC(p2._zeilen[S.redeZeile]||'',H-24,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E',W-12,H-12,P.dunkel);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#06060e'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<46;i++){ ctx.fillStyle=i%6===0?'#242040':'#12101d';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('DER NACHTBUS',22,P.neon,3);
  textC('LEVEL 3 - FAHRENDER UNTERGRUND',44,P.dim);
  const zeilen=['DER BODEN FAEHRT MIT.','DU HAST KEINEN FAHRSCHEIN.','SECHS HALTESTELLEN.'];
  zeilen.forEach((z,i)=>textC(z,64+i*10,i===2?P.gold:P.weiss));
  const st=[['A D','LAUFEN'],['SHIFT','FESTHALTEN'],['E','REDEN, SUCHEN, TUER']];
  st.forEach((z,i)=>{ text(z[0],70,104+i*9,P.gold); text(z[1],104,104+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),136,P.neon2);
  const levelOben=levelZeilen(LEVEL_NR);
  if(Math.floor(S.t*1.6)%2===0) textGlowC('LEERTASTE ODER E',levelOben-9,P.weiss,1);
}
/* Levelauswahl unten auf dem Titelbild - aus fortschritt.js gebaut. */
function levelZeilen(eigenes){
  /* Von unten nach oben, damit das eigene Level immer sichtbar bleibt.
     Zurueck kommt die oberste Zeile - darueber darf nichts mehr stehen. */
  const alle=Fortschritt.auswahl(eigenes);
  const liste=alle.slice(-Math.min(alle.length,3));
  const oben=H-7-(liste.length-1)*6;
  liste.forEach((l,i)=>{
    const y=oben+i*6;
    /* Das eigene Level ist nie gesperrt - man steht ja schon drin. */
    const zu=!Fortschritt.spielbar(l.nr)&&l.nr!==eigenes;
    const taste=zu?'GESPERRT ':(l.nr===eigenes?'LEERTASTE':('TASTE '+l.nr+'  '));
    const txt=taste+' LEVEL '+l.nr+' - '+l.name;
    const farbe=zu?'#2f2a45':(l.nr===eigenes?P.dunkel:P.neon2);
    text(txt,(W-textW(txt))/2,y,farbe);
  });
  return oben;
}
function zeichneIntro(){

  const m=Math.round(W/2);
  /* Der Bus von aussen, an der Haltestelle */
  ctx.fillStyle='#0b0d1a'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#171426'; ctx.fillRect(0,140,W,H-140);
  ctx.fillStyle='#2a2540'; ctx.fillRect(0,140,W,1);
  ctx.fillStyle='#1a2036'; ctx.fillRect(m-110,58,220,82);
  ctx.fillStyle='#242c48'; ctx.fillRect(m-110,58,220,4);
  for(let i=0;i<4;i++){
    ctx.fillStyle='#111730'; ctx.fillRect(m-100+i*54,70,44,32);
    ctx.globalAlpha=.16; ctx.fillStyle='#ffe6a8';
    ctx.fillRect(m-100+i*54,70,44,32); ctx.globalAlpha=1;
  }
  ctx.fillStyle='#0c0f1c'; ctx.fillRect(m-104,110,208,30);
  ctx.fillStyle='#ffdf9a'; ctx.fillRect(m-108,112,4,3); ctx.fillRect(m+104,112,4,3);
  text('NACHTBUS  CLUB',m-textW('NACHTBUS  CLUB')/2,62,'#ffd447');
  ctx.drawImage(verlauf('introvig',W,H,g=>{
    const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.85)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0)
      text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 3 GESCHAFFT',32,P.gold,2);
      textC('IHR STEHT VOR DEM CLUB.',54,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),72,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',82,P.gold);
      else { const b=ladeBest();
        if(b!==null) textC('BESTZEIT  '+Math.floor(b/60)+':'+String(Math.floor(b%60)).padStart(2,'0'),82,P.dunkel); }
      textC(S.entwertet?'MIT FAHRSCHEIN. ORDENTLICH.':'OHNE FAHRSCHEIN DURCHGEKOMMEN.',94,P.dim);
      textC('PEGEL  '+Math.round(S.pegel),104,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),116,P.neon2);
      const n=Fortschritt.naechstes(LEVEL_NR);
      if(n){ if(Math.floor(S.t*2)%2===0)
               textC('E  WEITER ZU LEVEL '+n.nr+' - '+n.name,130,P.gruen); }
      else {
        const kommt=Fortschritt.levelNr(LEVEL_NR+1);
        textC(kommt?('LEVEL '+kommt.nr+' - '+kommt.name+'  WIRD NOCH GEBAUT'):'',128,P.dunkel);
        if(Math.floor(S.t*2)%2===0) textC('LEERTASTE  NOCHMAL',140,P.dunkel);
      }
    } else {
      textGlowC('RAUSGEFLOGEN',48,P.rot,3);
      textC(S.grund||'',76,P.weiss);
      textC('HALTESTELLE  '+halteStelle().name,90,P.dim);
    }
    if(Math.floor(S.t*2)%2===0) textC('LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */
let letzte=performance.now();
function bild(jetzt){
  const dt=Math.min(.05,(jetzt-letzte)/1000); letzte=jetzt;
  update(dt); draw(dt);
  requestAnimationFrame(bild);
}
requestAnimationFrame(bild);
</script>
