<script>
/* ============================================================================
   NACHTSCHICHT - LEVEL 3: DER NACHTBUS

   Level 1 war Verstecken, Level 2 war Ueberreden. Hier ist der Boden das
   Problem. Der Bus bremst, faehrt an und faehrt Kurven, und wer sich nicht
   festhaelt, liegt - ausgerechnet dann, wenn zwei Kontrolleure durchgehen.

   Drei Dinge machen das Level aus:

     FAHRENDER UNTERGRUND  Vor jedem Halt kommt eine Vorwarnung. Wer in dem
                           Fenster keine Haltestange erwischt, kippt nach
                           vorne und liegt eine Sekunde flach. Die
                           Kontrolleure kippen mit - das ist deine Chance.
     KONTROLLEURE          Sie gehen den Bus ab und pruefen jeden Fahrgast.
                           Was sie aufhaelt, hilft dir.
     TIMING                An jedem Halt gehen die Tueren fuer ein paar
                           Sekunden auf. Draussen sieht dich keiner - aber
                           der Bus wartet nicht.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG */
  gehTempo:       100,
  beschleunigung: 880,
  bremsung:      1200,
  luftKontrolle:   0.5,
  gravitation:    920,
  sprungKraft:   -215,
  kurzsprung:      0.45,
  coyoteMs:        95,
  puffermMs:      130,

  /* (2) KAMERA */
  kameraTraegheit: 6.5,
  blickVoraus:    24,

  /* (3) DER BUS
     Der ganze Rhythmus des Levels steht in diesen sieben Zahlen. */
  fahrtDauer:     15,      // Sekunden zwischen zwei Halten
  warnDauer:       1.7,    // Vorwarnung. Dein Fenster, um dich festzuhalten
  bremsDauer:      1.15,
  haltDauer:       8,      // wie lange die Tueren offen sind
  /* Am letzten Halt musst du wirklich raus, und zwar von dort, wo du
     gerade stehst. Vom Heck bis zur mittleren Tuer sind 500 Pixel, das
     sind fuenf Sekunden ohne einen einzigen Umweg. Die Zugabe macht aus
     einem Rennen eine Entscheidung. */
  letzterHaltPlus: 4,
  tuerWarnung:     2.4,    // davon blinkt es am Ende
  anfahrDauer:     1.35,
  kurvePause:      4.5,    // fruehestens so oft kommt eine Kurve

  /* (4) WAS DICH SCHIEBT
     Der Schub ist bewusst eine eigene Geschwindigkeit neben deiner. Wuerde
     er auf S.vx addiert, wuerde ihn die normale Bremsung (1200 gegen 200)
     im selben Bild wieder auffressen - der fahrende Untergrund waere Deko.
     So schiebt der Bus dich wirklich, und du kannst dagegen anlaufen. */
  bremsSchub:    200,      // nach vorne, beim Bremsen
  anfahrSchub:   130,      // nach hinten, beim Anfahren
  kurveSchub:    110,      // seitlich, in Kurven
  schubAbbau:    120,      // wie schnell der Schub von selbst nachlaesst
  schubMax:      220,
  sturzSchub:    150,      // womit ein Sturz dich nach vorne wirft
  sturzZeit:       1.1,    // wie lange du liegst, wenn es dich hinlegt
  sturzHoerweite:120,      // so weit hoert man dich hinfallen
  sturzVerdacht:   0.45,   // und mit so viel Vorsprung suchen sie dich dann
  stangeReichweite:14,

  /* (5) DIE KONTROLLEURE */
  kontrTempo:     30,
  pruefDauer:      2.6,    // wie lange ein Fahrgast sie aufhaelt
  kontrSicht:     50,      // nach vorne
  kontrRuecken:   13,      // was sie im Ruecken noch mitkriegen
  pruefSicht:      0.5,    // Sicht mal diesem Wert, solange sie pruefen
  liegendSicht:    1.6,    // Sicht mal diesem Wert, wenn du am Boden liegst
  /* Wer sich an einer Stange festhaelt, sieht aus wie jeder andere
     Fahrgast. Ohne das war Festhalten reine Strafe: man steht 1,7 Sekunden
     still, waehrend jemand auf einen zulaeuft. Jetzt ist es beides -
     sicherer Stand und weniger auffaellig, aber du kommst nicht weg. */
  haltenSicht:     0.5,
  verdachtProSek:  0.9,
  verdachtAbbau:   0.8,
  kontrTaumeln:    1.4,    // wie lange eine Bremsung sie aus dem Tritt bringt
  kontrPause:      4,      // nach einer Kontrolle lassen sie dich in Ruhe
  zweiterAb:       2,      // ab dieser Haltestelle steigt der zweite zu

  /* (6) VERSTECKE */
  versteckReichweite: 14,
  versteckAbkuehlung: 7,

  /* (7) DER PEGEL - kommt aus Level 2 mit */
  pegelMax:      100,
  proSchluck:     14,
  pegelAbbau:      0.9,
  wackelnAb:      55,
  langsamAb:      70,
  blackoutBei:   100,
  verzerrungAb:   25,
  verzerrungMax:   9,
  dumpfVon:     9000,
  dumpfBis:     1500,

  /* (8) SONST */
  reichweite:     15,
  suchDauer:       0.55,
  leben:           3,
};

const P = {
  ink:'#06070f', weiss:'#f2f4ff', dim:'#8d94a8', dunkel:'#454d63',
  neon:'#ff3d8b', neon2:'#42d9ff', gold:'#ffd447', rot:'#ff4d4d', gruen:'#48e08a',
  boden:'#232a36', bodenKante:'#48536b', decke:'#161c26',
};

/* ==========================================================================
   3x5 BITMAP-FONT
   ========================================================================== */
const F = {
 A:'010,101,111,101,101', B:'110,101,110,101,110', C:'011,100,100,100,011',
 D:'110,101,101,101,110', E:'111,100,110,100,111', F:'111,100,110,100,100',
 G:'011,100,101,101,011', H:'101,101,111,101,101', I:'111,010,010,010,111',
 J:'001,001,001,101,010', K:'101,110,100,110,101', L:'100,100,100,100,111',
 M:'101,111,111,101,101', N:'101,111,101,101,101', O:'010,101,101,101,010',
 P:'110,101,110,100,100', Q:'010,101,101,110,011', R:'110,101,110,101,101',
 S:'011,100,010,001,110', T:'111,010,010,010,010', U:'101,101,101,101,111',
 V:'101,101,101,101,010', W:'101,101,111,111,101', X:'101,101,010,101,101',
 Y:'101,101,010,010,010', Z:'111,001,010,100,111',
 0:'111,101,101,101,111', 1:'010,110,010,010,111', 2:'111,001,111,100,111',
 3:'111,001,111,001,111', 4:'101,101,111,001,001', 5:'111,100,111,001,111',
 6:'111,100,111,101,111', 7:'111,001,001,001,001', 8:'111,101,111,101,111',
 9:'111,101,111,001,111',
 ' ':'000,000,000,000,000', '.':'000,000,000,000,010', ':':'000,010,000,010,000',
 '-':'000,000,111,000,000', '!':'010,010,010,000,010', '?':'110,001,010,000,010',
 '/':'001,001,010,100,100', '+':'000,010,111,010,000', ',':'000,000,000,010,100',
 '<':'001,010,100,010,001', '>':'100,010,001,010,100', '*':'101,010,111,010,101',
 '^':'010,111,111,010,010',
};
const GLYPH={}; for(const k in F) GLYPH[k]=F[k].split(',');

/* ==========================================================================
   BILD-CACHE
   ========================================================================== */
const _ids=new WeakMap(); let _nid=0;
const _spr=new Map(), _out=new Map(), _txt=new Map(), _gly=new Map(), _grd=new Map();
const rowsId=r=>{ let i=_ids.get(r); if(i===undefined){ i=++_nid; _ids.set(r,i);} return i; };
function leinwand(w,h){ const c=document.createElement('canvas');
  c.width=Math.max(1,w|0); c.height=Math.max(1,h|0);
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return [c,x]; }
function verlauf(key,w,h,mal){ let c=_grd.get(key);
  if(!c){ const [cc,xx]=leinwand(w,h); mal(xx); c=cc; _grd.set(key,c); } return c; }

const KEY={ k:'#08060f', s:'#e8b088', h:'#2a1c14', t:'#3ad1a0', p:'#2b2b48', w:'#f2f0ff',
  g:'#ffd447', n:'#ff3d8b', c:'#42d9ff', r:'#ff4d4d', d:'#4a4363', b:'#6b4a2a',
  o:'#a8681f', e:'#20182e', l:'#ffe08a', v:'#c8324a', m:'#7a2d3d', a:'#1a1626',
  j:'#3d2f22', u:'#8c94ad', q:'#2e3350', z:'#5a4632',
  /* Moritz aus Level 2: dunkle Haare, weiss-blaues Trikot */
  H:'#1d150e', T:'#eef2ff', B:'#2f6fd0',
  /* Kontrolleur: Dienstblau, Muetze, Geraet in der Hand */
  U:'#1b3a63', M:'#0f2340', G:'#5b6b82' };

function backeSprite(rows,sc,tint){
  let bw=0; for(const r of rows) if(r.length>bw) bw=r.length;
  const [c,x]=leinwand(bw*sc,rows.length*sc);
  for(let r=0;r<rows.length;r++){ const row=rows[r];
    for(let i=0;i<row.length;i++){ const ch=row[i]; if(ch==='.') continue;
      x.fillStyle=tint||KEY[ch]||'#fff'; x.fillRect(i*sc,r*sc,sc,sc); } }
  return c;
}
function holeSprite(rows,sc,tint){ const k=rowsId(rows)+'|'+sc+'|'+(tint||'-');
  let c=_spr.get(k); if(!c){ c=backeSprite(rows,sc,tint); _spr.set(k,c);} return c; }
function sprite(rows,x,y,sc=1,tint=null,alpha=1){
  const c=holeSprite(rows,sc,tint);
  if(alpha!==1) ctx.globalAlpha=alpha;
  ctx.drawImage(c,Math.round(x),Math.round(y));
  if(alpha!==1) ctx.globalAlpha=1;
}
function spriteFlip(rows,x,y,sc=1,tint=null){
  const c=holeSprite(rows,sc,tint);
  ctx.save(); ctx.translate(Math.round(x)+c.width,Math.round(y)); ctx.scale(-1,1);
  ctx.drawImage(c,0,0); ctx.restore();
}
function outline(rows,x,y,sc=1,a=.7){
  const k=rowsId(rows)+'|'+sc; let c=_out.get(k);
  if(!c){ const s=holeSprite(rows,sc,'#000'); const [cc,xx]=leinwand(s.width+2*sc,s.height+2*sc);
    xx.drawImage(s,0,sc); xx.drawImage(s,2*sc,sc); xx.drawImage(s,sc,0); xx.drawImage(s,sc,2*sc);
    c=cc; _out.set(k,c); }
  ctx.globalAlpha=a; ctx.drawImage(c,Math.round(x)-sc,Math.round(y)-sc); ctx.globalAlpha=1;
}
function textTo(g,str,x,y,col,s){
  g.fillStyle=col; str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const gl=GLYPH[str[i]]||GLYPH['?'];
    for(let r=0;r<5;r++) for(let c=0;c<3;c++)
      if(gl[r][c]==='1') g.fillRect(x+(i*4+c)*s,y+r*s,s,s); } }
function text(str,x,y,col,s=1){
  str=String(str).toUpperCase();
  for(let i=0;i<str.length;i++){ const ch=str[i]; if(ch===' ') continue;
    const k=ch+col+s; let c=_gly.get(k);
    if(!c){ const [cc,xx]=leinwand(3*s,5*s); textTo(xx,ch,0,0,col,s); c=cc; _gly.set(k,c); }
    ctx.drawImage(c,Math.round(x+i*4*s),Math.round(y)); } }
const textW=(s0,s=1)=>String(s0).length*4*s-s;
const textC=(s0,y,col,s=1)=>text(s0,Math.round((W-textW(s0,s))/2),y,col,s);
function textGlow(str,x,y,col,s=1){
  const k=str+col+s;
  let c=_txt.get(k);
  if(!c){ const [cc,xx]=leinwand(textW(str,s)+6*s,5*s+6*s);
    xx.shadowColor=col; xx.shadowBlur=6*s; textTo(xx,str,3*s,3*s,col,s);
    xx.shadowBlur=3*s; textTo(xx,str,3*s,3*s,col,s);
    c=cc; _txt.set(k,c); }
  ctx.drawImage(c,Math.round(x)-3*s,Math.round(y)-3*s);
}
const textGlowC=(s0,y,col,s=1)=>textGlow(s0,Math.round((W-textW(s0,s))/2),y,col,s);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ==========================================================================
   SPRITES
   ========================================================================== */
const KOPF=['..hhh..','.hsssh.','.sssss.','..sss..'];
const geh=b=>[...KOPF,'..ttt..',...b];
/* Sitzende Fahrgaeste: eine Vorlage, das Hemd wird eingesetzt. Zehn eigene
   Sprites fuer zehn Leute waeren zehnmal derselbe Koerper in anderer Farbe. */
const sitzer=f=>['..hhh...','.hsssh..','.sssss..','..fff...','.ffffff.','.fff.pp.',
                 '......pp','.....kk.'].map(r=>r.replace(/f/g,f));
const SPR={
  steh: geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
  geh:[
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk']),
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','.p...p.','.p...p.','kk...kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','.p.pp..','p..pp..','.kk.kk.']),
  ],
  sprung:[...KOPF,'k.ttt.k','.tttttt','..ttt..','..ttt..','..ppp..','.pp.pp.','.p...p.','kk...kk'],
  fall:  [...KOPF,'..ttt..','ktttttk','..ttt..','..ppp..','..p.p..','.pp.pp.','.p...p.','.k...k.'],
  suchen:[...KOPF,'..ttt..','.ttttts','k.ttt.s','..ttt..','..ppp..','..p.p..','.pp.pp.','.kk..kk'],
  /* Festhalten: ein Arm hoch an der Stange */
  halten:['..hhh..','.hsssh.','.sssss.','..sss.s','..ttt.s','.ttttts','k.ttt..','..ttt..',
          '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* Hingefallen. Liegt laengs im Gang. */
  liegt: ['..........','..........','..........','..........','..........',
          '...hhh....','..hsssh.ss','.stttttts.','..ppppp...','.kk...kk..'],

  /* Die Crew aus den Leveln davor */
  moritz:['..HHH..','.HsssH.','.sssss.','..sss..','..sss..','..TBT..','.TTBTT.',
          'kTTBTTk','.TTBTT.','..TBT..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  max:['..hhh..','.hsssh.','.sssss.','..sss..','..ccc..','.ccccc.','k.ccc.k','..ccc..',
       '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* DER LANGE - zwei Koepfe groesser als alle anderen, deshalb steht er
     auch nie gerade. Schlaefer-Variante lehnt an der Scheibe. */
  lang:['..zzz..','.zsssz.','.sssss.','..sss..','..sss..','..ooo..','.ooooo.','k.ooo.k',
        '..ooo..','..ooo..','..qqq..','..q.q..','..q.q..','..q.q..','.qq.qq.','.kk..kk'],
  langSchlaeft:['....zzz..','...zsssz.','...sssss.','....sss..','..oooooo.','.ooooooo.',
                'k.oooooo.','..ooooo..','..qqqq...','..qq.qq..','..qq..qq.','..kk...kk'],

  /* Die Kontrolleure. Muetze, Dienstjacke, Geraet in der Hand. */
  kontr:['..MMM..','.MMMMM.','.hsssh.','..sss..','..UUU..','.UUUUU.','k.UUU.G','..UUU..',
         '..MMM..','..M.M..','..M.M..','.MM.MM.','.kk..kk'],
  kontrGeh:['..MMM..','.MMMMM.','.hsssh.','..sss..','..UUU..','.UUUUU.','k.UUU.G','..UUU..',

   ========================================================================== */
let AC=null, muted=false, MBUS=null, MOTOR=null;
function zerrKurve(k){
  const n=1024, c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); }
  return c;
}
function baueMusikbus(){
  const ein=AC.createGain(), zerr=AC.createWaveShaper(),
        dumpf=AC.createBiquadFilter(), aus=AC.createGain();
  zerr.curve=zerrKurve(0); zerr.oversample='2x';
  dumpf.type='lowpass'; dumpf.frequency.value=TUNE.dumpfVon; dumpf.Q.value=0.7;
  aus.gain.value=1;
  ein.connect(zerr); zerr.connect(dumpf); dumpf.connect(aus); aus.connect(AC.destination);
  MBUS={ein,zerr,dumpf,aus,stufe:-1};
}
/* Der Motor. Ein einziger durchlaufender Oszillator, dessen Tonhoehe an der
   Busgeschwindigkeit haengt - beim Anfahren zieht er hoch, beim Bremsen
   faellt er ab. Das ist die halbe Information des Levels, ohne ein Wort. */
function baueMotor(){
  const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
  o.type='sawtooth'; o.frequency.value=44;
  f.type='lowpass'; f.frequency.value=260; f.Q.value=3;
  g.gain.value=0;
  o.connect(f); f.connect(g); g.connect(AC.destination); o.start();
  MOTOR={o,f,g};
}
function ensureAudio(){ if(AC) return AC;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MUS.next=AC.currentTime+.05;
       baueMusikbus(); baueMotor(); }
  catch(e){ AC=null; MBUS=null; MOTOR=null; } return AC; }
function ton(f,when,dur,type='square',vol=.05,ziel=null){
  if(!AC||muted) return; const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,when);
  g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g); g.connect(ziel||AC.destination); o.start(when); o.stop(when+dur+.02); }
const piep=(f,d=.07,t='square',v=.05)=>{ ensureAudio(); if(AC) ton(f,AC.currentTime,d,t,v); };
function glissando(f1,f2,dur,type='square',vol=.05){
  ensureAudio(); if(!AC||muted) return;
  const t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.02); }
function rauschen(dur=.25,vol=.08){
  ensureAudio(); if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(AC.destination); s.start(); }
const SFX={
  schritt:()=>piep(92+Math.random()*20,.03,'triangle',.015),
  sprung: ()=>piep(430,.06,'square',.03),
  landen: ()=>piep(150,.05,'triangle',.028),
  reden:  ()=>piep(520+Math.random()*180,.04,'square',.025),
  fund:   ()=>{ piep(880,.08); setTimeout(()=>piep(1320,.1),80); setTimeout(()=>piep(1760,.15),170); },
  nichts: ()=>piep(210,.09,'sine',.03),
  schluck:()=>{ glissando(300,160,.22,'sine',.05); rauschen(.1,.03); },
  erledigt:()=>{ piep(660,.08); setTimeout(()=>piep(990,.12),85); },
  /* Der Haltewunsch-Gong. Deine Vorwarnung. */
  gong:   ()=>{ piep(1046,.16,'sine',.055); setTimeout(()=>piep(784,.3,'sine',.05),150); },
  tuer:   ()=>{ glissando(160,320,.35,'sine',.04); rauschen(.2,.04); },
  tuerZu: ()=>{ glissando(320,140,.35,'sine',.04); rauschen(.22,.05); },
  warnPiep:()=>piep(1400,.06,'square',.045),
  sturz:  ()=>{ rauschen(.3,.1); glissando(260,70,.32,'sawtooth',.06); },
  aua:    ()=>{ rauschen(.28,.09); glissando(300,90,.3,'sawtooth',.06); },
  erwischt:()=>{ piep(220,.2,'sawtooth',.06); setTimeout(()=>piep(165,.3,'sawtooth',.06),180); },

/* Musik: schleppend, tief, drei Toene. Ein Nachtbus swingt nicht. */
const BASS=[73,0,0,0, 73,0,98,0, 65,0,0,0, 87,0,73,0];
const HIHAT=2200;
const MUS={step:0,next:0};
const kippGrad=()=>Math.max(0,Math.min(1,
  (S.pegel-TUNE.verzerrungAb)/Math.max(1,TUNE.blackoutBei-TUNE.verzerrungAb)));
function busEinstellen(){
  if(!MBUS) return;
  const k0=kippGrad(), k=Math.pow(k0,1.4)*TUNE.verzerrungMax;
  const stufe=Math.round(k0*12);
  if(stufe!==MBUS.stufe){ MBUS.stufe=stufe; MBUS.zerr.curve=zerrKurve(k); }
  MBUS.aus.gain.value=1/(1+k*0.55);
  MBUS.dumpf.frequency.value=TUNE.dumpfVon+(TUNE.dumpfBis-TUNE.dumpfVon)*(S.pegel/100);
}
function motorEinstellen(){
  if(!MOTOR) return;
  const an = !muted && (S.modus==='spiel'||S.modus==='reden');
  /* Im Stand tuckert er nur, in Fahrt zieht er hoch. */
  MOTOR.o.frequency.value = 38 + S.tempo*26;
  MOTOR.f.frequency.value = 190 + S.tempo*220;
  MOTOR.g.gain.value = an ? 0.012+S.tempo*0.016 : 0;
}
function musik(){
  if(!AC||muted||S.modus==='pause') return;
  busEinstellen(); motorEinstellen();
  const st=60/104/4;
  const ziel=MBUS?MBUS.ein:null;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut=S.modus==='titel'?.014:.03;
    if(f) ton(f,MUS.next,st*1.6,'triangle',laut,ziel);
    if(S.modus!=='titel'&&i%8===0) ton(HIHAT,MUS.next,.03,'square',.01,ziel);
    MUS.next+=st; MUS.step++;
  }
}

function druckSprung(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='index.html'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }

  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'){ e.preventDefault(); haltAn=true; }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(S.modus==='titel'&&(e.code==='Digit1'||e.code==='Numpad1')){
    e.preventDefault(); location.href='index.html'; }
  if(S.modus==='titel'&&(e.code==='Digit2'||e.code==='Numpad2')){

  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';

/* ==========================================================================
   DER BUS - die Phasen

   fahrt -> warnung -> bremsen -> halt -> anfahren -> fahrt ...

   Alles, was das Level ausmacht, haengt an diesem Kreislauf: wann du dich
   festhalten musst, wann die Tueren aufgehen, wann die Kontrolleure aus dem
   Tritt kommen.
   ========================================================================== */
function setzePhase(p){
  S.phase=p; S.phaseT=0;
  if(p==='warnung'){
    SFX.gong();
    /* Die Ansage vor der letzten Haltestelle ist die wichtigste im Level:
       wer sie ueberhoert, steht beim Oeffnen der Tueren im Heck. */
    if(S.naechste===LETZTE){
      zeigeHinweis('NAECHSTER HALT IST EURER - AN EINE TUER',TUNE.warnDauer+2);
      meldung('ALTSTADT. GLEICH.',2);
    } else {
      zeigeHinweis('HALT '+HALTE[S.naechste]+' - FESTHALTEN',TUNE.warnDauer);
    }
  }
  if(p==='bremsen'){
    /* Der Moment, um den es geht. Wer weder haelt noch sitzt noch versteckt
       ist noch draussen steht, kippt nach vorne. */
    /* Wer gerade redet, faellt nicht - sonst reisst ein Halt mitten im
       Gespraech den Dialog auseinander, und das ist keine Entscheidung,
       die der Spieler getroffen hat. */
    if(!S.haelt&&S.versteckIn<0&&!S.draussen&&!S.reden&&S.liegtT<=0&&S.suchT<=0) sturz();
    /* Die Kontrolleure kippen mit. Sie halten sich nicht fest, weil sie
       beide Haende voll haben - das ist dein Fenster. */
    for(const K of S.kontr){ K.taumelT=TUNE.kontrTaumeln; K.verdacht=0; }
    S.ruettel=Math.max(S.ruettel,4);
  }
  if(p==='halt'){
    SFX.tuer();
    if(S.naechste===LETZTE) zeigeHinweis('DEINE HALTESTELLE - RAUS HIER',3);
    /* Ab der eingestellten Haltestelle steigt der zweite zu. */
    if(S.naechste===TUNE.zweiterAb&&S.kontr.length<2){
      S.kontr.push(neuerKontrolleur(TUEREN[1].x,1));
      meldung('NOCH EINER STEIGT EIN',2); SFX.warnPiep();
    }
  }
  if(p==='anfahren'){
    SFX.tuerZu();
    /* Tueren zu. Wer jetzt noch draussen steht, faehrt nicht mit. */
    if(S.draussen){ verloren('DER BUS IST OHNE DICH WEITER'); return; }
    if(S.naechste===LETZTE){ verloren('VORBEIGEFAHREN. NAECHSTER HALT: NIRGENDWO.'); return; }
  }
}
function busUpdate(dt){
  S.phaseT+=dt;
  S.streifen+=S.tempo*260*dt;
  switch(S.phase){
    case 'fahrt':
      S.tempo=1;
      kurven(dt);
      if(S.phaseT>=TUNE.fahrtDauer-TUNE.warnDauer) setzePhase('warnung');
      break;
    case 'warnung':
      S.tempo=1;
      if(S.phaseT>=TUNE.warnDauer) setzePhase('bremsen');
      break;
    case 'bremsen':
      S.tempo=Math.max(0,1-S.phaseT/TUNE.bremsDauer);
      schiebe(-TUNE.bremsSchub*dt);
      if(S.phaseT>=TUNE.bremsDauer) setzePhase('halt');
      break;
    case 'halt':
      S.tempo=0;
      /* Kurz vorm Schliessen piept es. */
      if(S.phaseT>=haltZeit()-TUNE.tuerWarnung){
        const seit=S.phaseT-(haltZeit()-TUNE.tuerWarnung);
        if(Math.floor(seit*3)!==Math.floor((seit-dt)*3)) SFX.warnPiep();
      }
      if(S.phaseT>=haltZeit()) setzePhase('anfahren');
      break;
    case 'anfahren':
      S.tempo=Math.min(1,S.phaseT/TUNE.anfahrDauer);
      schiebe(TUNE.anfahrSchub*dt);
      if(S.phaseT>=TUNE.anfahrDauer){ S.naechste++; setzePhase('fahrt'); }
      break;
  }
}
/* Wer sich festhaelt, im Versteck steckt oder draussen steht, wird nicht
   geschoben. Alle anderen schon. */
function schiebe(d){
  if(S.haelt||S.draussen||S.versteckIn>=0){ S.schub=0; return; }
  S.schub=Math.max(-TUNE.schubMax,Math.min(TUNE.schubMax,S.schub+d));
}
/* Kurven waehrend der Fahrt. Kein Sturz, aber du wirst geschoben - und wer
   gerade an einem Kontrolleur vorbeischleicht, steht ploetzlich woanders. */
function kurven(dt){
  if(S.kurveRest>0){
    S.kurveRest-=dt;
    schiebe(S.kurveRichtung*TUNE.kurveSchub*dt);
    return;
  }
  S.kurveT-=dt;
  if(S.kurveT<=0){
    S.kurveT=TUNE.kurvePause+Math.random()*5;
    S.kurveRest=0.8+Math.random()*0.5;
    S.kurveRichtung=Math.random()<.5?-1:1;
    S.ruettel=Math.max(S.ruettel,2.5);
    meldung(S.kurveRichtung<0?'LINKSKURVE':'RECHTSKURVE',0.9);
  }
}
function sturz(){
  S.liegtT=TUNE.sturzZeit; S.haelt=false; S.vx=0; S.schub=-TUNE.sturzSchub;
  S.ruettel=6; SFX.sturz(); meldung('NICHT FESTGEHALTEN',1.6);
  /* Ein Sturz ist laut. Wer in Hoerweite ist, dreht sich um und sucht mit
     Vorsprung - deshalb kostet ein verpasster Halt nicht nur eine Sekunde,
     sondern die Deckung. Sie taumeln selbst noch, also faengt die Suche
     erst an, wenn sie wieder stehen. */
  for(const K of S.kontr){
    if(Math.abs(K.x-S.x)>TUNE.sturzHoerweite) continue;
    K.richtung=Math.sign(S.x-K.x)||K.richtung;
    K.verdacht=Math.min(0.9,K.verdacht+TUNE.sturzVerdacht);
  }
}

/* ==========================================================================
   DIE KONTROLLEURE
   ========================================================================== */
function kontrolleurLogik(dt){
  for(const K of S.kontr){
    if(K.pauseT>0) K.pauseT-=dt;
    if(K.taumelT>0){ K.taumelT-=dt; K.verdacht=0; continue; }

    if(K.zustand==='pruefen'){
      K.t-=dt;
      if(K.t<=0) K.zustand='gehen';
    } else {
      K.x+=K.richtung*TUNE.kontrTempo*dt;
      /* Jeder Fahrgast haelt sie auf. Deshalb ist der volle Bus dein Freund. */
      for(const f of FAHRGAESTE){
        const sz=sitzBei(f.sitz); if(!sz) continue;
        if(!K.geprueft[f.id]&&Math.abs(sz.x-K.x)<7){
          K.geprueft[f.id]=true; K.zustand='pruefen'; K.t=TUNE.pruefDauer; break;
        }
      }
      /* Am Ende umdrehen und von vorne anfangen. */
      if(K.x<=VORN+6){ K.x=VORN+6; K.richtung=1; K.geprueft={}; }
      if(K.x>=HINTEN-6){ K.x=HINTEN-6; K.richtung=-1; K.geprueft={}; }
    }

    /* Sehen. Nach vorne weit, im Ruecken fast nichts - und waehrend einer
       Kontrolle nur halb so weit. Genau daran kommst du vorbei. */
    const dx=S.x-K.x;
    const vorne=Math.sign(dx)===K.richtung||dx===0;
    let reich=(vorne?TUNE.kontrSicht:TUNE.kontrRuecken);
    if(K.zustand==='pruefen') reich*=TUNE.pruefSicht;
    if(S.haelt) reich*=TUNE.haltenSicht;
    if(S.liegtT>0) reich*=TUNE.liegendSicht;
    const sichtbar = S.modus==='spiel' && !S.draussen && S.versteckIn<0
                  && K.pauseT<=0 && Math.abs(dx)<reich;
    if(sichtbar){
      K.verdacht+=TUNE.verdachtProSek*dt;
      if(K.verdacht>=1){ erwischt(K); return; }
    } else {
      K.verdacht=Math.max(0,K.verdacht-TUNE.verdachtAbbau*dt);
    }
  }
}
function erwischt(K){
  K.verdacht=0;
  for(const k of S.kontr) k.pauseT=TUNE.kontrPause;
  /* Der Fahrschein rettet dich genau einmal. */
  if(S.schein){
    S.schein=false; SFX.erledigt();
    meldung('DER SCHEIN GILT. EINMAL.',2.4);
    zeigeHinweis('DAS WAR DEIN EINZIGER',2.5);
    return;
  }
  S.hp--; S.ruettel=8; S.rot=1; SFX.erwischt();
  S.reden=null; S.versteckIn=-1; S.haelt=false; S.liegtT=0;
  if(S.hp<=0){ verloren('RAUSGEWORFEN. MITTEN AUF DER STRECKE.'); return; }
  /* Sie nehmen dich mit nach vorne und lassen dich dort stehen. */
  S.x=TUEREN[0].x+10; S.vx=0;
  meldung('KEIN FAHRSCHEIN',2.2);
  zeigeHinweis('SIE HABEN DICH NACH VORNE GEBRACHT',3);
}
function verloren(grund){
  S.modus='ende'; S.gewonnen=false; S.faenger=grund; SFX.aua();
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  S.rot=Math.max(0,S.rot-dt*1.6);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende') return;

  S.zeit+=dt;
  busUpdate(dt);
  if(S.modus==='ende') return;      // busUpdate kann das Level beenden

  /* Pegel baut sich langsam ab. Bei 100 schlaefst du ein - im Nachtbus die
     zuverlaessigste Art, seine Haltestelle zu verpassen. */
  if(S.pegel>=TUNE.blackoutBei){ verloren('EINGESCHLAFEN. ENDSTATION.'); return; }
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  gaesteUpdate(dt);
  kontrolleurLogik(dt);
  if(S.modus==='ende') return;

  if(S.versteckAb>0) S.versteckAb=Math.max(0,S.versteckAb-dt);

  /* --- Gespraech laeuft --- */
  if(S.reden){
    while(aktionPuffer.length){ aktionPuffer.shift(); naechsteZeile(); }
    kamera(dt); return;
  }

  /* --- Im Versteck --- */
  if(S.versteckIn>=0){
    S.vx=0;
    while(aktionPuffer.length){ aktionPuffer.shift(); ausVersteck(); break; }
    kamera(dt); return;
  }

  /* --- Suchen laeuft --- */
  if(S.suchT>0){
    S.suchT-=dt;
    if(S.suchT<=0) suchErgebnis();
    schubAnwenden(dt); grenzen();
    while(aktionPuffer.length) aktionPuffer.shift();
    kamera(dt); return;
  }

  /* --- Am Boden --- */
  if(S.liegtT>0){
    S.liegtT-=dt;
    S.vx=0;
    schubAnwenden(dt); grenzen();
    while(aktionPuffer.length) aktionPuffer.shift();
    kamera(dt); return;
  }

  /* --- Festhalten --- */
  const stange=stangeBei(S.x);
  S.haelt = haltAn && stange!==null && S.amBoden && !S.draussen;
  if(S.haelt){ S.vx=0; S.schub=0; S.x+=(stange-S.x)*Math.min(1,10*dt); }

  /* --- Bewegung --- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung&&!S.haelt) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*tempoBonus()*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(!S.haelt){
    if(richtung){
      S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
      if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
    } else {
      const brems=TUNE.bremsung*kontrolle*dt;
      S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
    }
    S.x+=S.vx*dt;
    schubAnwenden(dt);
  }
  grenzen();

  if(S.amBoden&&Math.abs(S.vx)>12&&!S.haelt){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if((S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000)&&!S.haelt){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  const boden=S.draussen?STEIG:BODEN;
  if(S.y>=boden){ S.y=boden; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  /* --- Aktion --- */
  while(aktionPuffer.length){ aktionPuffer.shift(); aktion(); }
  kamera(dt);
}
/* Der Schub bewegt dich unabhaengig von deinem eigenen Antrieb und laesst
   nur langsam nach. Deshalb kann man gegen ihn anlaufen, aber nicht einfach
   stehenbleiben. */
function schubAnwenden(dt){
  if(S.schub===0) return;
  S.x+=S.schub*dt;
  const ab=TUNE.schubAbbau*dt;
  S.schub=Math.abs(S.schub)<=ab?0:S.schub-Math.sign(S.schub)*ab;
}
function grenzen(){
  if(S.draussen){
    /* Draussen kommst du nur so weit, wie der Bahnsteig reicht. */
    S.x=Math.max(TUEREN[0].x-70,Math.min(TUEREN[1].x+70,S.x));
  } else {
    S.x=Math.max(VORN,Math.min(HINTEN,S.x));
  }
}

/* Was E gerade macht. Die Reihenfolge ist die Reihenfolge der Dringlichkeit:
   Tuer, Versteck, Person, Sitz. */
function aktion(){
  /* Tuer - nur wenn sie offen ist */
  const t=tuerBei(S.x);
  if(t&&anHalt()){
    if(S.draussen){ S.draussen=false; S.y=BODEN; S.vy=0; S.amBoden=true; SFX.landen();
      meldung('WIEDER DRIN',1.2); return; }
    if(S.naechste===LETZTE){
      if(alleFertig()){ starteCutscene(); return; }
      meldung('NICHT OHNE DIE JUNGS',1.6); SFX.nichts(); return;
    }
    S.draussen=true; S.y=STEIG; S.vy=0; S.amBoden=true; S.haelt=false;
    meldung('DRAUSSEN. DER BUS WARTET NICHT.',2); SFX.landen(); return;
  }
  if(t&&!anHalt()&&!S.draussen){ meldung('DIE TUER GEHT NUR AM HALT AUF',1.4); SFX.nichts(); return; }
  if(S.draussen) return;

  /* Versteck */
  const vi=versteckBei(S.x);
  if(vi>=0){
    if(S.versteckAb>0){ meldung('NOCH NICHT WIEDER',1.2); SFX.nichts(); return; }
    S.versteckIn=vi; S.vx=0; S.haelt=false;
    meldung(VERSTECKE[vi].txt,1.4); rauschen(.12,.03); return;
  }

  /* Person */
  let person=null, dPerson=1e9;
  for(const l of LEUTE){ const d=Math.abs(l.x-S.x);
    if(d<TUNE.reichweite&&d<dPerson){ person=l; dPerson=d; } }
  if(person){ rede(person); return; }

  /* Sitz durchsuchen */
  let sz=null, dSz=1e9;
  for(const s of SITZE){ const d=Math.abs(s.x-S.x);
    if(d<TUNE.reichweite&&d<dSz){ sz=s; dSz=d; } }
  if(sz){
    if(FAHRGAESTE.some(f=>f.sitz===sz.id)){ meldung('DA SITZT JEMAND',1.2); SFX.nichts(); return; }
    if(S.durchsucht[sz.id]){ meldung('SCHON NACHGESEHEN',1); SFX.nichts(); return; }
    S.suchT=TUNE.suchDauer; S.suchZiel=sz; rauschen(.1,.025); return;
  }
}
function suchErgebnis(){
  const sz=S.suchZiel; S.suchZiel=null;
  S.durchsucht[sz.id]=true;
  if(sz.id===S.scheinBei&&!S.schein){
    S.schein=true; SFX.fund(); S.blitz=.6;
    meldung('EIN FAHRSCHEIN. JEMAND HAT IHN LIEGENLASSEN.',2.6);
    zeigeHinweis('DER RETTET DICH GENAU EINMAL',3); return;
  }
  SFX.nichts(); meldung(pick(['NICHTS','KAUGUMMI','EINE LEERE DOSE','NUR STAUB']),1.2);
}
function ausVersteck(){
  S.versteckIn=-1; S.versteckAb=TUNE.versteckAbkuehlung;
  meldung('RAUS DA',1); rauschen(.1,.025);
}

/* ---- Reden ---- */
function rede(p){
  S.reden=p; S.redeZeile=0; S.vx=0; S.haelt=false; SFX.reden();
  p._zeilen=p.zeilen;
  if(p.id==='moritz'&&!S.erledigt.moritz){
    p._zeilen=[...p.zeilen,...p.danach];
    S.erledigt.moritz=true; SFX.erledigt();
  } else if(p.id==='moritz'){
    p._zeilen=['ICH BIN DABEI','SAG WANN'];
  } else if(p.id==='lange'&&!S.erledigt.lange){
    p._zeilen=['*DU RUETTELST IHN WACH*',...p.danach];
    S.erledigt.lange=true; SFX.erledigt();
  } else if(p.id==='lange'){
    p._zeilen=['ICH STEH SCHON','WO MUESSEN WIR RAUS'];
  } else if(p.id==='max'){
    /* Der Schluck. Bringt dir nichts - genau deshalb ist er da. Man nimmt
       ihn trotzdem. Ab 80 nimmt Max die Flasche weg: mit einem Pegel aus
       Level 2 wuerde ein einziger Schluck sonst direkt in den Blackout
       fuehren, und daran waere nichts zu erkennen gewesen. */
    if(S.pegel>80){
      p._zeilen=['DU HAST GENUG','IM ERNST'];
      SFX.nichts();
    } else {
      S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.proSchluck);
      p._zeilen=[...p.zeilen,'*DU NIMMST EINEN*'];
      SFX.schluck();
    }
  }
}
function naechsteZeile(){
  const p=S.reden;
  S.redeZeile++;
  if(S.redeZeile>=p._zeilen.length){ S.reden=null; return; }
  SFX.reden();
}

/* ---- Fahrgaeste reden vor sich hin ---- */
function gaesteUpdate(dt){
  for(let i=0;i<FAHRGAESTE.length;i++){
    const z=S.gaeste[i];
    if(z.txtT>0){ z.txtT-=dt; if(z.txtT<=0) z.txt=''; continue; }
    z.warten-=dt; if(z.warten>0) continue;
    z.txt=pick(FAHRGAESTE[i].sprueche); z.txtT=2.4;
    z.warten=9+Math.random()*11;
  }
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   CUTSCENE
   ========================================================================== */
const SZENEN=[
  { d:1.2, txt:'' },
  { d:2.4, txt:'*IHR STEHT AN DER ALTSTADT*' },
  { d:2.4, txt:'DER LANGE: ZWEI STUNDEN. IM KREIS.' },
  { d:2.2, txt:'MORITZ: WARUM BIST DU NICHT AUSGESTIEGEN' },
  { d:2.6, txt:'DER LANGE: ICH HAB GESCHLAFEN.' },
  { d:1.6, txt:'' },
  { d:2.6, txt:'MAX FERDI: DA VORNE IST DIE SCHLANGE' },
  { d:2.4, txt:'DU: WIE LANG' },
  { d:2.2, txt:'MAX FERDI: LANG.' },
  { d:1.8, txt:'' },
  { d:2.8, txt:'DER LANGE IST JETZT DABEI' },
  { d:2.8, txt:'ER SIEHT UEBER JEDE MENGE HINWEG - EIN HERZ MEHR' },
  { d:2.4, txt:'LEVEL 3 GESCHAFFT' },
];
function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; SFX.sieg(); }
function levelGeschafft(){
  speichereCrew('DER LANGE');
  speicherePegel(S.pegel);
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  /* Drei Quellen von Unruhe: der laufende Motor, die Bremsung, der Pegel. */
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*2.6 : 0;
  const motor = S.tempo*0.7;
  const rx=(Math.random()-.5)*(S.ruettel+motor)+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*(S.ruettel*.6+motor)+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneBus();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  if(S.rot>0){ ctx.fillStyle=`rgba(255,40,40,${(S.rot*.28).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneBus(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  /* Nacht draussen, unter dem Bus die Strasse. Die Strasse zieht mit
     derselben Zahl weg wie die Lichter in den Fenstern - das ist der
     zweite Ort, an dem man sieht, dass der Bus faehrt. */
  ctx.fillStyle='#080b14'; ctx.fillRect(kx,0,W,H);
  ctx.fillStyle='#0c1020'; ctx.fillRect(kx,STEIG-8,W,H-(STEIG-8));
  if(S.tempo>0.02){
    const laenge=6+S.tempo*22;
    for(let i=0;i<20;i++){
      const bahn=STEIG+4+((i*7)%26);
      const roh=(i*97-S.streifen*(0.7+(i%3)*0.3))%(W+60);
      const px=kx+((roh%(W+60))+(W+60))%(W+60)-30;
      ctx.globalAlpha=.13+(i%4===0?.12:0);
      ctx.fillStyle=i%4===0?'#8fa4c0':'#39445a';
      ctx.fillRect(Math.round(px),bahn,Math.round(laenge),1);
    }
    ctx.globalAlpha=1;
  }

  /* Bahnsteig - nur am Halt beleuchtet */
  if(anHalt()){
    ctx.fillStyle='#242e3e'; ctx.fillRect(kx,STEIG,W,H-STEIG);
    ctx.fillStyle='#5e6d85'; ctx.fillRect(kx,STEIG,W,1);
    ctx.fillStyle='#39445a'; ctx.fillRect(kx,STEIG+1,W,1);
    for(let x=kx-(kx%18);x<kx+W;x+=18){ ctx.fillStyle='#00000044'; ctx.fillRect(x,STEIG+6,9,1); }
    /* Haltestellenschild */
    const hx=TUEREN[0].x-46;
    ctx.fillStyle='#3a4358'; ctx.fillRect(hx+5,STEIG-40,2,40);
    ctx.fillStyle='#e8d24a'; ctx.fillRect(hx-16,STEIG-52,42,14);
    text(HALTE[S.naechste].slice(0,9),hx-14,STEIG-48,'#20242e');
  }

  /* Abteile: Wand, Decke, Boden */
  for(const a of ABTEILE){
    ctx.fillStyle=a.wand; ctx.fillRect(a.von,DECKE,a.bis-a.von,BODEN-DECKE);
    ctx.fillStyle=P.decke; ctx.fillRect(a.von,DECKE,a.bis-a.von,6);
    ctx.fillStyle=a.boden; ctx.fillRect(a.von,BODEN,a.bis-a.von,3);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(a.von,BODEN,a.bis-a.von,1);
  }
  /* Alles unter dem Boden ist Bus von aussen: die Flanke, auf der er steht.
     Ohne diese Trennung sieht es aus, als stuende man drinnen weiter unten,
     statt draussen daneben. */
  ctx.fillStyle='#121824'; ctx.fillRect(0,BODEN+3,LEVEL_B,STEIG-BODEN-3);
  ctx.fillStyle='#1d2634'; ctx.fillRect(0,BODEN+3,LEVEL_B,1);
  for(let rx=120;rx<LEVEL_B;rx+=300){
    ctx.fillStyle='#0a0e16'; ctx.fillRect(rx,BODEN+6,34,STEIG-BODEN-6);
    ctx.fillStyle='#232c3c'; ctx.fillRect(rx,BODEN+6,34,1);
  }
  /* Innenausbau. Ohne das ist der Bus eine Roehre mit Fenstern: eine
     durchgehende Deckenstange, an der die Haltestangen haengen, die
     Leuchtstoffroehren darueber, die Bruestung unter den Fenstern und ein
     paar Werbetafeln in den Feldern dazwischen. */
  ctx.fillStyle='#4a5568'; ctx.fillRect(0,DECKE+6,LEVEL_B,2);
  ctx.fillStyle='#5d6b80'; ctx.fillRect(0,DECKE+6,LEVEL_B,1);
  for(let x=40;x<LEVEL_B;x+=74){
    ctx.fillStyle='#e6f0ff'; ctx.globalAlpha=.5; ctx.fillRect(x,DECKE+1,26,2);
    ctx.globalAlpha=.07; ctx.fillStyle='#cfe2ff'; ctx.fillRect(x-6,DECKE+3,38,14);
    ctx.globalAlpha=1;
  }
  /* Bruestung unter den Fenstern */
  ctx.fillStyle='#2c3546'; ctx.fillRect(0,82,LEVEL_B,3);
  ctx.fillStyle='#39445a'; ctx.fillRect(0,82,LEVEL_B,1);
  for(let x=16;x<LEVEL_B;x+=42){ ctx.fillStyle='#1a2030'; ctx.fillRect(x,85,1,BODEN-85); }

  /* Gelenk: die Falten des Faltenbalgs */
  const gel=ABTEILE[2];
  for(let x=gel.von;x<gel.bis;x+=6){
    ctx.fillStyle='#0e131b'; ctx.fillRect(x,DECKE,2,BODEN-DECKE);
    ctx.fillStyle='#2a3242'; ctx.fillRect(x+2,DECKE,1,BODEN-DECKE);
  }

  /* Fenster. Hier passiert das, was das Level erzaehlt: draussen zieht die
     Stadt vorbei, solange der Bus faehrt - und steht still, wenn er haelt. */
  for(let fx=124;fx<LEVEL_B-40;fx+=84){
    if(fx>gel.von-30&&fx<gel.bis+6) continue;
    zeichneFenster(fx,46,64,34);
  }
  /* Fahrerkabine */
  ctx.fillStyle='#161c26'; ctx.fillRect(0,DECKE,26,BODEN-DECKE);
  zeichneFenster(30,46,52,34);
  ctx.fillStyle='#2a3242'; ctx.fillRect(22,DECKE,3,BODEN-DECKE);
  ctx.fillStyle='#39445a'; ctx.fillRect(6,92,16,4);   // Lenkrad-Andeutung
  sprite(SPR.stehGast,4,BODEN-13,1,null,.9);          // der Fahrer

  /* Anzeigetafel unter der Decke */
  const tafel = anHalt() ? HALTE[S.naechste]
              : 'NAECHSTER HALT  '+HALTE[Math.min(LETZTE,S.naechste)];
  for(let bx=190;bx<LEVEL_B-160;bx+=440){
    ctx.fillStyle='#0a0d14'; ctx.fillRect(bx,DECKE+7,textW(tafel)+8,9);
    text(tafel,bx+4,DECKE+9,anHalt()?P.gold:'#c8722a');
  }

  /* Haltestangen */
  for(const sx of STANGEN){
    const nah = Math.abs(sx-S.x)<TUNE.stangeReichweite && !S.draussen && S.modus==='spiel';
    const anGriff = S.haelt && Math.abs(sx-S.x)<TUNE.stangeReichweite;
    ctx.fillStyle=anGriff?P.gold:(nah?'#9aa6bd':'#6b7789');
    ctx.fillRect(sx,DECKE+6,2,BODEN-DECKE-6);
    ctx.fillStyle='#4a5568'; ctx.fillRect(sx-2,DECKE+6,6,2);
    if(nah&&!anGriff&&Math.floor(S.t*4)%2===0)
      text('SHIFT',sx+1-textW('SHIFT')/2,BODEN-24,P.gold);
  }

  /* Sitze */
  for(const s of SITZE){
    sprite(SPR.bank,s.x-6,BODEN-9);
    const nah=Math.abs(s.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.draussen&&!S.reden;
    const belegt=FAHRGAESTE.some(f=>f.sitz===s.id);
    if(nah&&!belegt&&Math.floor(S.t*4)%2===0)
      text(S.durchsucht[s.id]?'OK':'E',s.x-1,BODEN-18,S.durchsucht[s.id]?P.dunkel:P.gold);
  }

  /* Fahrgaeste */
  for(let i=0;i<FAHRGAESTE.length;i++){
    const f=FAHRGAESTE[i], sz=sitzBei(f.sitz); if(!sz) continue;
    const rows=SPR[f.spr]||SPR.sitzU;
    outline(rows,sz.x-5,BODEN-rows.length-4,1,.35);
    sprite(rows,sz.x-5,BODEN-rows.length-4,1,null,.92);
    const z=S.gaeste[i];
    if(z&&z.txtT>0&&z.txt&&!S.reden){
      ctx.globalAlpha=Math.min(1,z.txtT*1.6)*.6;
      text(z.txt,Math.round(sz.x-textW(z.txt)/2),DECKE+20,P.dim);
      ctx.globalAlpha=1;
    }
  }

  /* Verstecke */
  for(let i=0;i<VERSTECKE.length;i++){
    const v=VERSTECKE[i];
    ctx.fillStyle=S.versteckIn===i?'#39445a':'#1a2029';
    ctx.fillRect(v.x-9,BODEN-26,18,26);
    ctx.fillStyle='#2a3242'; ctx.fillRect(v.x-9,BODEN-26,18,1);
    text(v.name.slice(0,7),v.x-textW(v.name.slice(0,7))/2,BODEN-34,
         S.versteckIn===i?P.gold:'#ffffff22');
    const nah=Math.abs(v.x-S.x)<TUNE.versteckReichweite&&S.modus==='spiel'&&!S.draussen;
    if(nah&&S.versteckIn<0&&Math.floor(S.t*4)%2===0){
      const frei=S.versteckAb<=0;
      const t=frei?'E':Math.ceil(S.versteckAb)+'';
      text(t,v.x-textW(t)/2,BODEN-42,frei?P.gold:P.dunkel);
    }
  }

  /* Tueren */
  for(const t of TUEREN){
    const offen=anHalt();
    /* Kurz vorm Schliessen blinken sie. */
    const gleich = offen && S.phaseT>=haltZeit()-TUNE.tuerWarnung;
    const blink = gleich && Math.floor(S.t*6)%2===0;
    ctx.fillStyle=offen?(blink?'#5a2020':'#0d1119'):'#2b3444';
    ctx.fillRect(t.x-14,DECKE+8,28,BODEN-DECKE-8);
    ctx.fillStyle=offen?(blink?P.rot:'#48536b'):'#3d4a5e';
    ctx.fillRect(t.x-14,DECKE+8,1,BODEN-DECKE-8);
    ctx.fillRect(t.x+13,DECKE+8,1,BODEN-DECKE-8);
    if(!offen){ ctx.fillStyle='#1c2432'; ctx.fillRect(t.x-1,DECKE+8,2,BODEN-DECKE-8); }
    const nah=Math.abs(t.x-S.x)<16&&S.modus==='spiel';
    if(nah&&Math.floor(S.t*4)%2===0)
      text(offen?'E':'ZU',t.x-textW(offen?'E':'ZU')/2,DECKE+2,offen?P.gold:P.dunkel);
  }

  /* Die Jungs */
  for(const l of LEUTE){
    const wach = l.id!=='lange' || S.erledigt.lange;
    const rows = (l.id==='lange'&&!wach) ? SPR.langSchlaeft : (SPR[l.spr]||SPR.steh);
    const y=BODEN-rows.length;
    outline(rows,l.x-3,y,1,.55);
    if(l.blick<0) spriteFlip(rows,l.x-3,y); else sprite(rows,l.x-3,y);
    const fertig=!AUFGABEN.some(a=>a.id===l.id)||S.erledigt[l.id];
    text(l.name,l.x+3-textW(l.name)/2,y-16,fertig?P.gruen:P.dim);
    if(fertig) text('OK',l.x+3-textW('OK')/2,y-9,P.gruen);
    else if(Math.abs(l.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden&&!S.draussen
            &&Math.floor(S.t*4)%2===0) text('E',l.x+2,y-9,P.gold);
  }

  /* Die Kontrolleure */
  for(const K of S.kontr) zeichneKontrolleur(K);

  /* Du */
  zeichneSpieler();

  ctx.restore();

  /* Vignette */
  ctx.globalAlpha=Math.min(1,.45+(S.pegel/100)*.35);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.5,48,W/2,H*.5,W*.62);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* Ein Fenster mit der Stadt dahinter. Faehrt der Bus, werden die Lichter zu
   Strichen; steht er, sind es wieder Punkte. */
function zeichneFenster(x,y,w,h){
  ctx.fillStyle='#080c16'; ctx.fillRect(x,y,w,h);
  const laenge=1+S.tempo*13;
  for(let i=0;i<16;i++){
    const saat=(x*7+i*53);
    const px=x+((saat*13-S.streifen*(0.6+(i%4)*0.22))%w+w*3)%w;
    const py=y+3+((saat*29)%(h-6));
    const hell=i%5===0;
    ctx.fillStyle=hell?'#ffd88a':(i%3===0?'#6fa8d6':'#3d5a78');
    ctx.globalAlpha=hell?.85:.5;
    ctx.fillRect(Math.round(px),Math.round(py),Math.round(laenge),1);
  }
  ctx.globalAlpha=1;
  /* Rahmen */
  ctx.fillStyle='#39445a';
  ctx.fillRect(x-1,y-1,w+2,1); ctx.fillRect(x-1,y+h,w+2,1);
  ctx.fillRect(x-1,y-1,1,h+2); ctx.fillRect(x+w,y-1,1,h+2);
}

function zeichneKontrolleur(K){
  const rows = K.zustand==='pruefen' ? SPR.kontrPrueft
             : (K.taumelT>0 ? SPR.kontr
             : (Math.floor(S.t*7)%2===0 ? SPR.kontrGeh : SPR.kontr));
  const y=BODEN-rows.length + (K.taumelT>0?1:0);
  /* Sichtkegel, damit man sieht, wo man nicht hin darf */
  let reich=TUNE.kontrSicht;
  if(K.zustand==='pruefen') reich*=TUNE.pruefSicht;
  if(K.taumelT<=0&&K.pauseT<=0){
    ctx.globalAlpha=.10;
    ctx.fillStyle=P.gold;
    const von=K.richtung>0?K.x+4:K.x-reich;
    ctx.fillRect(von,BODEN-18,reich,18);
    ctx.globalAlpha=1;
  }
  outline(rows,K.x-3,y,1,.6);
  if(K.richtung<0) spriteFlip(rows,K.x-3,y); else sprite(rows,K.x-3,y);
  /* Verdachtsbalken - deine Reaktionszeit, kein Sofortalarm */
  if(K.verdacht>0){
    const bw=16;
    ctx.fillStyle='#000a'; ctx.fillRect(K.x-4,y-8,bw+2,4);
    ctx.fillStyle=K.verdacht>.66?P.rot:P.gold;
    ctx.fillRect(K.x-3,y-7,Math.round(bw*Math.min(1,K.verdacht)),2);
  }
  if(K.taumelT>0&&Math.floor(S.t*8)%2===0) text('*',K.x+2,y-9,P.neon2);
  if(K.pauseT>0) text('OK',K.x+3-textW('OK')/2,y-9,P.gruen);
}

function zeichneSpieler(){
  if(S.versteckIn>=0){
    /* Im Versteck siehst du nur raus. */
    const v=VERSTECKE[S.versteckIn];
    ctx.fillStyle=P.gold; ctx.globalAlpha=.5;
    ctx.fillRect(v.x-4,BODEN-18,8,2); ctx.globalAlpha=1;
    return;
  }
  let rows;
  if(S.liegtT>0) rows=SPR.liegt;
  else if(S.suchT>0) rows=SPR.suchen;
  else if(S.haelt) rows=SPR.halten;
  else if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  const fuss=S.draussen?STEIG:BODEN;
  const y=S.y-rows.length;
  outline(rows,S.x-3,y,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,y); else sprite(rows,S.x-3,y);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),fuss,7,1); ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  const leben=maxLeben();
  for(let i=0;i<leben;i++){
    const x=6+i*7,y=6, voll=i<S.hp;
    if(!voll){ ctx.fillStyle='#26303e'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
    ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
    ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
  }

  /* Haltestellen als Perlenkette. Das ist die Uhr dieses Levels: sie laeuft
     nicht ab, sie zaehlt hoch - du willst, dass Zeit vergeht. */
  const bx=W-8-HALTE.length*8;
  for(let i=0;i<HALTE.length;i++){
    const x=bx+i*8;
    const durch=i<S.naechste, jetzt=i===S.naechste;
    ctx.fillStyle=durch?P.dunkel:(jetzt?(i===LETZTE?P.gold:P.neon2):'#26303e');
    ctx.fillRect(x,6,5,5);
    if(jetzt&&Math.floor(S.t*3)%2===0){ ctx.fillStyle=P.weiss; ctx.fillRect(x+1,7,3,3); }
  }
  const halt=HALTE[Math.min(LETZTE,S.naechste)];
  text(halt,W-8-textW(halt),14,S.naechste===LETZTE?P.gold:P.dim);

  /* Was der Bus gerade macht */
  let zust='', farbe=P.dim;
  if(S.phase==='fahrt')    { zust='FAEHRT'; }
  if(S.phase==='warnung')  { zust='HALT KOMMT'; farbe=P.gold; }
  if(S.phase==='bremsen')  { zust='BREMST'; farbe=P.rot; }
  if(S.phase==='halt')     { zust='TUEREN AUF'; farbe=P.gruen;
    const rest=haltZeit()-S.phaseT;
    if(rest<=TUNE.tuerWarnung){ zust='TUEREN GEHEN ZU'; farbe=P.rot; } }
  if(S.phase==='anfahren') { zust='FAEHRT AN'; farbe=P.gold; }
  textC(zust,22,farbe);
  /* Balken fuer die laufende Phase - beim Halt der wichtigste im Spiel */
  if(S.phase==='halt'||S.phase==='warnung'){
    const ganz=S.phase==='halt'?haltZeit():TUNE.warnDauer;
    const f=Math.max(0,1-S.phaseT/ganz), bw=70, x=(W-bw)/2;
    ctx.fillStyle='#000a'; ctx.fillRect(x-1,29,bw+2,5);
    ctx.fillStyle=farbe; ctx.fillRect(x,30,Math.round(bw*f),3);
  }

  /* Pegel, klein - er ist hier Nebensache, aber er ist noch da */
  const pw=40, px=6, py=H-12, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(px-1,py-1,pw+2,5);
  ctx.fillStyle='#26303e'; ctx.fillRect(px,py,pw,3);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(px,py,Math.round(pw*p),3);
  text('PEGEL',px,py-7,P.dunkel);

  /* Aufgaben. Mit dunklem Ruecken: die Anzeigetafeln im Bus scrollen darunter
     durch, und zwei Texte uebereinander sind keiner. */
  let y=40;
  let breit=0; for(const a of AUFGABEN) breit=Math.max(breit,textW(a.text));
  ctx.fillStyle='#00000099'; ctx.fillRect(3,y-3,breit+14,AUFGABEN.length*8+3);
  for(const a of AUFGABEN){
    const ok=!!S.erledigt[a.id];
    text(ok?'X':'-',6,y,ok?P.gruen:P.dunkel);
    text(a.text,14,y,ok?P.dunkel:P.weiss);
    y+=8;
  }
  if(alleFertig()){
    const t=S.naechste===LETZTE?'AN DER ALTSTADT RAUS':'ALLE WACH - JETZT NUR NOCH ANKOMMEN';
    if(Math.floor(S.t*2)%2===0) textC(t,y+2,P.gold);
  }
  if(S.schein){ sprite(SPR.schein,W-12,H-14); }

  /* Draussen: der Bus wartet nicht */
  if(S.draussen){
    const rest=Math.max(0,haltZeit()-S.phaseT);
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-58,W,12);
    textC('DRAUSSEN - '+rest.toFixed(1)+' SEKUNDEN',H-55,rest<3?P.rot:P.gold);
  }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Gespraech */
  if(S.reden){
    const p2=S.reden;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.gold; ctx.fillRect(0,H-44,W,1);
    text(p2.name,8,H-38,P.neon2);
    textC(p2._zeilen[S.redeZeile]||'',H-24,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E',W-12,H-12,P.dunkel);
  }

  /* Im Versteck */
  if(S.versteckIn>=0){
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0d1119'; ctx.fillRect(0,0,W,H);
    /* Sehschlitz. Wie im Spind in Level 1: du siehst genau einen Streifen
       Bus, und in dem Streifen laufen sie an dir vorbei. Ohne das waere
       Verstecken ein schwarzer Bildschirm und damit ein toter Moment. */
    const sy=Math.round(H/2)-9, sh=18;
    ctx.fillStyle='#131a26'; ctx.fillRect(18,sy-3,W-36,sh+6);
    ctx.fillStyle='#39445a'; ctx.fillRect(18,sy-3,W-36,1);
    ctx.fillStyle='#000'; ctx.fillRect(22,sy,W-44,sh);
    ctx.save(); ctx.beginPath(); ctx.rect(22,sy,W-44,sh); ctx.clip();
    /* Der Streifen zeigt die Fusshoehe des Busses: Boden, Sitzbeine, Schuhe */
    const versatz=sy+sh-BODEN;               // Busboden auf die Schlitzhoehe legen
    ctx.translate(-Math.round(S.kamX),versatz);
    ctx.fillStyle='#232a36'; ctx.fillRect(S.kamX,BODEN-sh,W,sh);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(S.kamX,BODEN,W,1);
    for(const s of SITZE) sprite(SPR.bank,s.x-6,BODEN-9,1,'#1b2230');
    for(const l of LEUTE){
      const rows=SPR[l.spr]||SPR.steh;
      sprite(rows,l.x-3,BODEN-rows.length,1,'#2a3242');
    }
    for(const K of S.kontr){
      const rows=K.zustand==='pruefen'?SPR.kontrPrueft:SPR.kontr;
      outline(rows,K.x-3,BODEN-rows.length,1,.8);
      if(K.richtung<0) spriteFlip(rows,K.x-3,BODEN-rows.length);
      else sprite(rows,K.x-3,BODEN-rows.length);
    }
    ctx.restore();
    textC(VERSTECKE[S.versteckIn].txt,sy+sh+8,P.dim);
    /* Wie weit der naechste noch weg ist - das ist die einzige Information,
       nach der man hier drin entscheidet. */
    let naechster=null;
    for(const K of S.kontr){ const d=Math.abs(K.x-S.x);
      if(naechster===null||d<naechster) naechster=d; }
    if(naechster!==null)
      textC('NAECHSTER KONTROLLEUR  '+Math.round(naechster),sy+sh+18,
            naechster<60?P.rot:P.dunkel);
    if(Math.floor(S.t*2)%2===0) textC('E  RAUS',sy+sh+30,P.gold);
    textC('DANACH '+Math.ceil(TUNE.versteckAbkuehlung)+' SEKUNDEN GESPERRT',sy+sh+40,P.dunkel);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#06070f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#26303e':'#111722';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('DER NACHTBUS',22,P.gold,3);
  textC('LEVEL 3 - N7 RICHTUNG ALTSTADT',44,P.dim);
  const zeilen=['FUENF HALTESTELLEN','ZWEI KONTROLLEURE','UND EIN BODEN DER SICH BEWEGT'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=[['A D','LAUFEN'],['SHIFT','FESTHALTEN'],['E','REDEN, SUCHEN, TUER, VERSTECK']];
  st.forEach((z,i)=>{ text(z[0],62,108+i*9,P.gold); text(z[1],96,108+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC('LEERTASTE ODER E',H-19,P.weiss,1);
  const a='TASTE 1  LEVEL 1     TASTE 2  LEVEL 2';
  const b='LEERTASTE  LEVEL 3 - DER NACHTBUS';
  text(a,(W-textW(a))/2,H-11,P.dunkel);
  text(b,(W-textW(b))/2,H-5,P.gold);
}
function zeichneIntro(){
  ctx.fillStyle='#080b14'; ctx.fillRect(0,0,W,H);
  const m=Math.round(W/2);
  /* Der Bus von aussen, an einer Haltestelle, im Regenlicht */
  ctx.fillStyle='#0c1020'; ctx.fillRect(0,120,W,H-120);
  ctx.fillStyle='#1a2130'; ctx.fillRect(0,132,W,H-132);
  ctx.fillStyle='#2e3a4e'; ctx.fillRect(0,132,W,1);
  ctx.fillStyle='#20293a'; ctx.fillRect(m-118,58,236,74);
  ctx.fillStyle='#141a26'; ctx.fillRect(m-118,58,236,7);
  for(let i=0;i<5;i++){
    const x=m-108+i*46;
    ctx.fillStyle='#0a0e18'; ctx.fillRect(x,70,36,26);
    for(let j=0;j<5;j++){ ctx.fillStyle=j%2?'#3d5a78':'#ffd88a';
      ctx.globalAlpha=.6; ctx.fillRect(x+3+((i*13+j*7)%30),74+((j*9)%18),2,1); }
    ctx.globalAlpha=1;
    ctx.fillStyle='#39445a'; ctx.fillRect(x-1,69,38,1); ctx.fillRect(x-1,96,38,1);
  }
  /* Scheinwerfer */
  ctx.globalAlpha=.5;
  ctx.drawImage(verlauf('licht',120,80,g=>{
    const gr=g.createRadialGradient(10,40,2,10,40,110);
    gr.addColorStop(0,'rgba(255,216,138,1)'); gr.addColorStop(1,'rgba(255,216,138,0)');
    g.fillStyle=gr; g.fillRect(0,0,120,80); }),m+110,60);
  ctx.globalAlpha=1;
  ctx.fillStyle='#e8d24a'; ctx.fillRect(m-100,62,40,5);
  text('N7 ALTSTADT',m-98,62,'#20242e');
  /* Ihr drei davor */
  sprite(SPR.steh,m-40,132-13);
  sprite(SPR.moritz,m-18,132-15);
  sprite(SPR.max,m+6,132-13);
  ctx.drawImage(verlauf('introvig',W,H,g=>{
    const gr=g.createRadialGradient(m,84,44,m,84,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.85)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.gold; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.gold; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0)
      text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 3 GESCHAFFT',34,P.gold,2);
      textC('ANGEKOMMEN. UND ZU VIERT.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegel),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      textC('LEVEL 4 FOLGT - DIE SCHLANGE',124,P.dunkel);
      if(Math.floor(S.t*2)%2===0) textC('E  ZURUECK ZU LEVEL 1',136,P.dunkel);
    } else {
      textGlowC('NICHT ANGEKOMMEN',44,P.rot,2);
      textC(S.faenger||'',70,P.weiss);
      textC('HALT '+Math.min(LETZTE+1,S.naechste+1)+' VON '+HALTE.length,88,P.dim);
    }
    if(Math.floor(S.t*2)%2===0) textC('LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */
neuesSpiel();
let letzte=performance.now();
function bild(jetzt){
  const dt=Math.min(.05,(jetzt-letzte)/1000); letzte=jetzt;
  update(dt);
  draw(dt);
  requestAnimationFrame(bild);
}
requestAnimationFrame(bild);
</script>
