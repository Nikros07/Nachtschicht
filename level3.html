/* ============================================================================
   NACHTSCHICHT - LEVEL 3: DER NACHTBUS

   Zwei Teile in einem Level: erst ein Sprint zur Haltestelle gegen die Uhr
   (Hindernisse ueberspringen), dann der Bus selbst - ohne Ticket, mit
   Kontrolleuren im Gang. Ausweichen, hinter Sitzen und Gepaeck verstecken,
   bis die Ausstiegstuer erreicht ist.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG */
  gehTempo:       106,
  beschleunigung: 900,
  bremsung:      1250,
  luftKontrolle:   0.55,
  gravitation:    920,
  sprungKraft:   -230,
  kurzsprung:      0.45,
  coyoteMs:        95,
  puffermMs:      130,

  /* (2) KAMERA */
  kameraTraegheit: 6.5,
  blickVoraus:    24,

  /* (3) SPRINT ZUR HALTESTELLE - alte Vorarbeit aus Level 2, hier wiederverwendet */
  sprintSekunden:    34,   // so viel Zeit bleibt, bis die Bahn faehrt
  sprintTempo:      118,   // Grundtempo beim Rennen
  sprintRampe:        9,   // das Tempo steigt so pro Sekunde Rennzeit
  hindernisAbstand: 140,   // Abstand zwischen Hindernissen
  hindernisAnzahl:   16,
  hindernisBreite:   12,   // Trefferbreite pro Hindernis
  stolperDauer:      0.4,  // kurzer Tempoverlust nach einem Treffer
  stolperVerlust:    0.55, // Anteil vom Hoechsttempo, der beim Stolpern fehlt

  /* (4) IM BUS - Kontrolleure */
  /* Gemessen: bei 740 Pixeln Laenge war der Bus in sieben Sekunden
     durchlaufen, und der Verdacht kam nie ueber 46 von 100. Ein Level,
     das kuerzer ist als seine eigene Anspannung, kann nicht spannend
     werden. Drei Waggons statt einem - das ist auch der Plan. */
  busLaenge:       1680,
  einstiegX:         24,
  ausstiegX:       1600,
  sichtWeite:        50,   // wie weit ein Kontrolleur nach vorn sieht
  verdachtProSek:    58,   // Fuellrate im Sichtkegel
  verdachtAbbau:     26,   // Abbau pro Sekunde ausserhalb
  verdachtAbbauVersteckt: 70, // schnellerer Abbau beim Verstecken
  kontrolleurTempo:  24,
  patrouillePause:    0.8,
  versteckReichweite: 22,   // grosszuegig: im Laufen muss man ein Versteck
                            // treffen koennen, ohne stehenzubleiben
  erwischtRueckstoss: 46,  // Ruecksetzung nach einer Kontrolle
  unverwundbarDauer:  1.6,
  leben:               3,

  /* (4b) TIEFE - der Bus ist ein Raum, kein Gang.
     Die Kontrolleure laufen im Gang (gangTiefe) und sehen nach vorn. Wer
     sich in die Sitzreihe druckt (sitzTiefe), kommt an ihnen vorbei -
     vorausgesetzt, der Kegel greift seitlich nicht ueber das ganze Band.
     Dafuer sorgt TIEFE.kegelMax in welt.js. */
  tiefeHinten:   116,    // Boden-Y der Sitzreihe
  tiefeVorne:    148,    // Boden-Y der Gangkante
  tiefeWelt:      46,    // wie tief das Band in Weltmass ist
  tiefeTempo:    1.05,
  kegelOeffnung: 0.42,
  sitzTiefe:     0.26,   // so weit hinten muss man sein, um durchzukommen
  gangTiefe:     0.72,   // dort patrouillieren die Kontrolleure

  /* (4b2) SITZBLOECKE
     Gemessen: wer sich einfach an die Rueckwand druckt, laeuft den ganzen
     Bus in sechs Sekunden durch, Verdacht null. Die Tiefe war damit keine
     Entscheidung, sondern eine Abkuerzung. Deshalb ist die Sitzreihe nicht
     durchgehend: an diesen Stellen stehen Sitze im Weg, und man muss in
     den Gang raus - genau dorthin, wo die Kontrolleure schauen.
     Die Zahl ist die Tiefe, die man dort MINDESTENS haben muss. */
  sitzbloecke: [
    { von: 120, bis: 260, tiefe:0.50 },   // Zone 1
    { von: 350, bis: 470, tiefe:0.52 },   // Zone 2
    { von: 560, bis: 640, tiefe:0.44 },   // Uebergang, ruhiger
    { von: 690, bis: 830, tiefe:0.50 },   // Zone 3
    { von: 900, bis:1040, tiefe:0.52 },   // Zone 4
    { von:1100, bis:1180, tiefe:0.44 },   // Uebergang
    { von:1210, bis:1380, tiefe:0.50 },   // Zone 5
  ],
  kontrolleurPendel: 0.13,   // wie weit sie selbst in der Tiefe wandern
  kontrolleurPendelTempo: 0.45,

  /* (4b3) SIE SETZEN NACH
     Gemessen: der Spieler ist mit 106 Pixeln pro Sekunde viermal so
     schnell wie ein Kontrolleur. Wer einfach durchlaeuft, ist nach einer
     halben Sekunde am Kegel vorbei - der Verdacht kam nie ueber 27 von
     100, egal welche Spur man nimmt. Ein Balken, der sich fuellt und
     sonst nichts, ist keine Bedrohung.
     Also: wer gesehen wird, wird verfolgt. Dann faellt auch der
     Geschwindigkeitsvorteil weg, weil ein Verfolger hinter einem bleibt
     und die naechste Luecke schon besetzt ist. */
  jagdTempo:        74,   // so schnell kommt ein alarmierter hinterher
  jagdDauer:       3.5,   // so lange bleibt er dran, nachdem er dich verlor
  jagdNah:          34,   // ab hier wird es schnell eng
  jagdVerdacht:     18,   // Fuellrate, solange er dran ist. Bewusst so
                          // niedrig, dass eine Verfolgung allein den Balken
                          // NICHT vollmacht - sonst waere jedes Gesehen-
                          // werden automatisch eine Kontrolle, und Weglaufen
                          // haette keinen Sinn.
  jagdVerdachtNah: 105,   // Fuellrate, wenn er direkt neben dir steht

  /* (4c) DREI WAGGONS. Die Grenzen sind die Durchgaenge. */
  waggonGrenzen: [540, 1080],

  /* (4d) REDEN, KAUFEN, BREMSEN */
  redeReichweite:  16,
  ticketPreis:      9,   // Euro - das Geld fehlt danach an der Tuer
  ablenkDauer:      8,   // so lange bindet eine Szene die Kontrolleure
  notbremsRuf:    -14,   // was die Notbremse kostet
  notbremsAblenk:  14,   // dafuer laufen alle nach vorn

  /* (4e) DIE KLOPPE IM LETZTEN WAGGON
     Der erste Kampf der Nacht. Klein, weil er die Regeln beibringt:
     zwei Gegner, keine Phasen, kein Zeitdruck. */
  kloppeX:       1508,   // ab hier stehen sie im Weg
  kloppeLeben:      4,   // Treffer, die der Spieler einstecken kann
  kloppeSchaden:    1,
  kloppeReich:     17,
  kloppeTiefe:   0.55,   // Mitte des Gangs - sie stellen sich breit hin
  kloppeGeld:      -6,   // was eine Niederlage kostet

  /* (5) DAS RUCKELN - der Bus faehrt nicht immer ruhig */
  ruckelMin:    4.5,
  ruckelMax:      9,
  ruckelDauer:  0.55,
  ruckelStaerke:  6,
  ruckelVerdachtNachlass: 14, // ein Ruckeln lenkt auch die Kontrolleure ab

  /* (6) DER PEGEL - geerbt aus Level 2, baut sich hier nur langsam weiter ab */
  wackelnAb:    55,
  langsamAb:    70,
  blackoutBei: 100,
  pegelAbbau:    0.5,
};

/* Musik: dumpfes Motorbrummen, wird unruhiger je hoeher der Verdacht */
const BASS=[55,0,55,0, 73,0,55,0, 49,0,49,0, 65,0,73,82];

function musik(){
  if(!AC||muted||S.modus==='pause'||S.modus==='titel') return;
  const st=60/100/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut = S.modus==='spiel' ? .022+(S.verdacht/100)*.022 : .016;
    if(f) ton(f,MUS.next,st*.85,'square',laut);
    if(S.modus==='spiel'&&i%4===0) ton(f/2,MUS.next,.12,'sine',.035);
    MUS.next+=st; MUS.step++;
  }
}

/* -- Teil 1: der Sprint -- */
const SPRINT_B = 180 + TUNE.hindernisAnzahl*TUNE.hindernisAbstand + 160;
function erzeugeHindernisse(){
  const arr=[];
  for(let i=0;i<TUNE.hindernisAnzahl;i++)
    arr.push({ x:180+i*TUNE.hindernisAbstand, art:pick(['muelltonne','poller','pfuetze']), getroffen:false });
  return arr;
}

/* Drei Kontrolleure, jeder patrouilliert seine eigene Zone im Gang. */
function erzeugeKontrolleure(){
  /* Jeder haelt seinen Waggon. Die Tiefe streut leicht, damit nicht alle
     auf derselben Linie stehen und dieselbe Luecke lassen. */
  return [
    { x:190, minX: 100, maxX: 300, blick: 1, pauseT:0, t:0.70, heimT:0.70, heim: 190, alarm:0 },
    { x:410, minX: 340, maxX: 490, blick:-1, pauseT:0, t:0.62, heimT:0.62, heim: 410, alarm:0 },
    { x:760, minX: 670, maxX: 860, blick: 1, pauseT:0, t:0.74, heimT:0.74, heim: 760, alarm:0 },
    { x:970, minX: 890, maxX:1070, blick:-1, pauseT:0, t:0.66, heimT:0.66, heim: 970, alarm:0 },
    { x:1300,minX:1200, maxX:1400, blick: 1, pauseT:0, t:0.70, heimT:0.70, heim:1300, alarm:0 },
  ];

/* Der naechste Fahrgast in Reichweite - Abstand zaehlt in BEIDEN Achsen,
   sonst redet man quer durch den halben Bus mit jemandem. */
function naherFahrgast(){
  let bester=null, d0=1e9;
  for(const f of FAHRGAESTE){
    if(Math.abs(f.t-S.tiefe)>0.3) continue;
    const d=Math.abs(f.x-S.x);
    if(d<TUNE.redeReichweite&&d<d0){ bester=f; d0=d; }
  }
  return bester;
}

/* Der Kampf selbst. Zwei Gegner, unterschiedlich schnell - damit man lernt,
   dass ein Konter auf den Flitzer anders getimt ist als auf den Schlaeger. */
function starteKloppe(){
  S.modus='kloppe'; S.kloppeStand='kampf';
  S.ich=kaempfer({ x:S.x, t:TUNE.kloppeTiefe, blick:1,
                   hp:TUNE.kloppeLeben, maxHp:TUNE.kloppeLeben });
  S.tiefe=TUNE.kloppeTiefe;
  /* Drei, so viele wie im Gespraech stehen. Unterschiedlich schnell, damit
     man merkt, dass ein Konter auf den Flitzer anders getimt ist als auf
     den mit der Kappe. Der Anfuehrer haelt mehr aus - er ist der Grund,
     warum der Kampf laenger dauert als ein Schlagabtausch. */
  const kappe=gegner('schlaeger', TUNE.kloppeX+34, 0.52);
  kappe.hp=kappe.maxHp=3; kappe.anfuehrer=true;
  S.gegner=[ gegner('flitzer',   TUNE.kloppeX+20, 0.70),
             kappe,
             gegner('schlaeger', TUNE.kloppeX+58, 0.38) ];
  zeigeHinweis('E SCHLAEGT - UMSCHALT BLOCKT - LEERTASTE WEICHT AUS',4);
  SFX.warn();
}

function kloppeVorbei(gewonnen){
  S.kloppeStand = gewonnen ? 'gewonnen' : 'verloren';
  S.modus='spiel'; S.gegner=[]; S.ich=null;
  S.tiefe=TUNE.gangTiefe; S.unverwundbarT=TUNE.unverwundbarDauer;
  if(gewonnen){
    wirke({mut:8, ruf:8, flag:'busKloppeGewonnen'});
    meldung('SIE MACHEN PLATZ',2.2); SFX.sieg();
  } else {
    /* Verlieren beendet nichts. Es kostet - und die Tuer ist trotzdem frei,
       weil sie dich nach dem Geld einfach stehen lassen. */
    wirke({geld:TUNE.kloppeGeld, ruf:-6, flag:'busKloppeVerloren'});
    meldung('SIE NEHMEN DAS GELD UND GEHEN',2.6); SFX.erwischt();
  }
}

function kloppe(dt){
  kampfStopTakt(dt);
  const z=kampfZeitFaktor(); if(z===0) return;
  const d=dt*z;

  const ich=S.ich;
  kaempferTakt(ich,d);
  S.tiefe=ich.t;

  /* Laufen und Ausweichen in der Flaeche */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  const rt=(runterAn?1:0)-(hochAn?1:0);
  if(ich.zustand==='frei'||ich.zustand==='block'){
    if(richtung){ ich.x+=richtung*TUNE.gehTempo*0.62*d; ich.blick=richtung; }
    if(rt) bewegeTiefe(ich,rt,d,TIEFE.tempo*0.8,16);
  }
  ich.x=Math.max(TUNE.kloppeX-40,Math.min(BUS_B-14,ich.x));
  S.x=ich.x;

  if(S.rolleGedrueckt){ S.rolleGedrueckt=false; rolle(ich, rt||(ich.t<0.5?1:-1)); }
  blocke(ich, !!S.blockAn && aktionPuffer.length===0);

  /* Schlagen. Der Konter wird beim DRUECKEN geprueft, nicht wenn der
     eigene Schlag aktiv wird - sonst frisst die eigene Ausholzeit das
     ganze Fenster. Steht so auch in kampf.js. */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    let gekontert=false;
    for(const g of S.gegner){
      if(g.hp<=0) continue;
      if(konterVersuch(ich,g,{reichweite:TUNE.kloppeReich})){ gekontert=true; SFX.warn(); break; }
    }
    if(!gekontert) schlage(ich);
  }

  if(ich.zustand==='schlag'){
    for(const g of S.gegner){
      if(g.hp<=0) continue;
      const was=spielerTrifft(ich,g,{reichweite:TUNE.kloppeReich,schaden:1});
      if(was==='treffer'||was==='konter'||was==='gardebruch'){ SFX.stolper(); break; }
    }
  }

  for(const g of S.gegner){
    if(g.hp<=0) continue;
    gegnerTakt(g,d,ich);
    if(g.zustand==='schlag'){
      const was=loeseTreffer(g,ich,{reichweite:g.reichweite,schaden:TUNE.kloppeSchaden});
      if(was==='treffer'){ S.ruettel=7; S.blitz=.4; SFX.erwischt(); }
      else if(was==='block') SFX.nichts();
    }
  }

  if(S.gegner.every(g=>g.hp<=0)) kloppeVorbei(true);
  else if(ich.hp<=0) kloppeVorbei(false);

  kamera(dt);
}

function zeichneKloppe(){
  const liste=[];
  for(const g of S.gegner){
    if(g.hp<=0) continue;
    liste.push({ t:g.t, mal:()=>{
      const rows = g.art==='flitzer'?SPR.schmal:(g.anfuehrer?SPR.breit:SPR.sitzend);
      const fuss=bodenY(g.t), y=fuss-rows.length;
      ctx.globalAlpha=.22; ctx.fillStyle='#000';
      ctx.fillRect(Math.round(g.x-3),Math.round(fuss),7,1); ctx.globalAlpha=1;
      /* Ausholen faerbt die Figur - das ist das Konterfenster, und das
         muss man sehen koennen, sonst ist der Konter Gluecksache.
         Gefaerbt wird der Sprite, nicht der Umriss: outline() kennt keine
         Farbe, das macht bild.js absichtlich nur einfarbig schwarz. */
      const tint = g.zustand==='ausholen' ? P.gold
                 : g.zustand==='block'    ? P.neon2
                 : g.zustand==='getroffen'? '#ff8080' : null;
      outline(rows,g.x-3,y,1,.55);
      if(g.blick<0) spriteFlip(rows,g.x-3,y,1,tint); else sprite(rows,g.x-3,y,1,tint);
      for(let i=0;i<g.maxHp;i++){
        ctx.fillStyle=i<g.hp?P.rot:'#2a2440';
        ctx.fillRect(Math.round(g.x-3+i*3),y-7,2,2);
      }
    }});
  }
  const ich=S.ich;
  liste.push({ t:ich.t, mal:()=>{
    const rows = ich.zustand==='rolle' ? SPR.versteckt
               : ich.zustand==='block' ? SPR.steh
               : ich.zustand==='schlag'||ich.zustand==='ausholen' ? SPR.geh[1]
               : SPR.steh;
    const fuss=bodenY(ich.t), y=fuss-rows.length;
    if(ich.unverwundbar>0&&Math.floor(S.t*14)%2===0) return;
    ctx.globalAlpha=.26; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(ich.x-3),Math.round(fuss),7,1); ctx.globalAlpha=1;
    const tint = ich.zustand==='block' ? P.neon2
               : ich.zustand==='getroffen' ? '#ff8080' : null;
    outline(rows,ich.x-3,y,1,.7);
    if(ich.blick<0) spriteFlip(rows,ich.x-3,y,1,tint); else sprite(rows,ich.x-3,y,1,tint);
  }});
  zeichneNachTiefe(liste);
}

/* Ausdauer- und Lebensbalken - ohne die sieht man nicht, warum ein
   Dauerblock irgendwann nicht mehr geht. */
function kloppeHud(){
  const ich=S.ich; if(!ich) return;
  for(let i=0;i<ich.maxHp;i++){
    ctx.fillStyle=i<ich.hp?P.rot:'#2a2440';
    ctx.fillRect(6+i*7,6,5,4);
  }
  const bw=54;
  ctx.fillStyle='#000a'; ctx.fillRect(4,13,bw+4,5);
  ctx.fillStyle='#2a2440'; ctx.fillRect(6,14,bw,3);
  ctx.fillStyle=ich.ausdauer<KAMPF.ausdauerSchlag?P.rot:P.neon2;
  ctx.fillRect(6,14,Math.round(bw*ich.ausdauer/KAMPF.ausdauerMax),3);
  textC('DIE TUER IST HINTER IHNEN',24,P.dim);
}

let linksAn=false, rechtsAn=false, sprungAn=false, aktionGehalten=false;
let hochAn=false, runterAn=false;
let sprungPuffer=[], aktionPuffer=[];

function druckSprung(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus=S.pausiertVon||'sprint'; return; }
  if(S.modus==='cutscene') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  if(typeof gespraechAktiv==='function'&&gespraechAktiv()){ ensureAudio(); gespraechBestaetigen(); return; }
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='level4.html'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(gespraechAktiv()){
    if(['ArrowLeft','KeyA','ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); gespraechWaehle(-1); return; }
    if(['ArrowRight','KeyD','ArrowDown','KeyS'].includes(e.code)){ e.preventDefault(); gespraechWaehle(1); return; }
  }
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(['ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); hochAn=true; }
  if(['ArrowDown','KeyS'].includes(e.code)){ e.preventDefault(); runterAn=true; }
  if(['ShiftLeft','ShiftRight'].includes(e.code)){ e.preventDefault(); S.blockAn=true; }
  if(e.code==='Space'&&S.modus==='kloppe'){ e.preventDefault(); S.rolleGedrueckt=true; return; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(S.modus==='titel'&&(e.code==='Digit1'||e.code==='Numpad1')){
    e.preventDefault(); location.href='index.html'; }
  if(S.modus==='titel'&&(e.code==='Digit2'||e.code==='Numpad2')){
    e.preventDefault(); location.href='level2.html'; }
  if(e.code==='KeyP'&&(S.modus==='sprint'||S.modus==='spiel'||S.modus==='kloppe'||S.modus==='pause')){
    if(S.modus==='pause'){ S.modus=S.pausiertVon||'sprint'; }
    else { S.pausiertVon=S.modus; S.modus='pause'; }
  }
});

/* ==========================================================================
   WAS DIE KNOEPFE AM HANDY GERADE TUN
   nacht/mobil.js fragt das ab. Im Bus ist E dreierlei: reden, verstecken,
   auftauchen - und am Handy sieht man die Figur nicht, weil der Daumen
   davor ist. Also sagt es der Knopf.
   ========================================================================== */
function mobilKontext(){
  if(S.modus==='titel')    return {aktion:'START',  zwei:null};
  if(S.modus==='intro')    return {aktion:'WEITER', zwei:null};
  if(S.modus==='cutscene') return {aktion:'WEITER', zwei:null};
  if(S.modus==='ende')     return {aktion:S.gewonnen?'WEITER':'NOCHMAL', zwei:null};
  if(S.modus==='pause')    return {aktion:null,     zwei:null};
  /* Im Sprint gibt es nur eine Sache zu tun: springen. */
  if(S.modus==='sprint')   return {aktion:null, zwei:'SPRINGEN'};

  if(S.modus==='kloppe')   return {aktion:'SCHLAG', zwei:'AUSWEICHEN', block:true};
  if(S.versteckt)          return {aktion:'RAUS', zwei:null};
  const f=naherFahrgast();
  if(f) return {aktion:f.ding?(f.id==='automat'?'TICKET':'BREMSE'):'REDEN', zwei:null};
  if(naheVersteck())       return {aktion:'VERSTECKEN', zwei:null};
  return {aktion:null, zwei:null};
}

const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };

/* ==========================================================================
   TEIL 1: SPRINT ZUR HALTESTELLE
   ========================================================================== */
function sprint(dt){
  S.zeit+=dt; S.sprintZeit+=dt;
  if(TUNE.sprintSekunden-S.sprintZeit<=0){
    S.modus='ende'; S.gewonnen=false; S.faenger='DIE BAHN IST WEG'; SFX.verpasst(); return;
  }
  S.stolperT=Math.max(0,S.stolperT-dt);

  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const rampe = TUNE.sprintTempo+TUNE.sprintRampe*S.sprintZeit;
  const stolperFaktor = S.stolperT>0 ? (1-TUNE.stolperVerlust) : 1;
  const hoechst = rampe*tempoBonus()*langsam*stolperFaktor;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(SPRINT_B-14,S.x));

  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  if(S.amBoden){
    for(const h of S.hindernisse){
      if(h.getroffen) continue;
      const dx=Math.abs((h.x+4)-S.x);
      if(dx<TUNE.hindernisBreite){ h.getroffen=true; S.stolperT=TUNE.stolperDauer; S.ruettel=6;
        SFX.stolper(); meldung('AUA',1); }
    }
  }

  aktionPuffer.length=0; // im Sprint gibt es nichts zum Anfassen

  kamera(dt);

  if(S.x>=SPRINT_B-20) starteBus();
}
function starteBus(){
  /* Entscheidungen, die nur fuer DIESE Fahrt gelten, muessen zurueck auf
     null. Sonst haette ein "Dann macht doch was" aus dem letzten Versuch
     beim naechsten Mal sofort wieder einen Kampf gestartet, auch wenn man
     gerade bezahlt hat - die Wahl stand ja schon im Speicherstand.
     Der Fahrschein bleibt: der ist bezahlt. */
  ['busSzene','busKloppe','notbremse','jonasDabei','busTipp',
   'busDurchDieCrew','busAngeblafft','busGezahlt',
   'busKloppeGewonnen','busKloppeVerloren'].forEach(f=>setzeFlag(f,false));
  S.modus='spiel'; S.letzteSzene='bus';
  S.x=EINSTIEG_X; S.y=BODEN; S.vx=0; S.vy=0; S.amBoden=true; S.blick=1; S.kamX=0;
  S.verdacht=0; S.versteckt=null; S.warnGespielt=false;
  zeigeHinweis('KEIN TICKET. NICHT AUFFALLEN.',3);
  SFX.einstieg();
}

/* ==========================================================================
   TEIL 2: IM BUS
   ========================================================================== */
function naheVersteck(){
  let besten=null,d0=1e9;
  for(const v of VERSTECKE){
    /* Verstecke liegen alle in der Sitzreihe - wer im Gang steht, greift
       ins Leere. Damit ist auch das Verstecken eine Bewegung. */
    if(Math.abs((v.t!=null?v.t:TUNE.sitzTiefe)-S.tiefe)>0.3) continue;
    const d=Math.abs(v.x-S.x);
    if(d<TUNE.versteckReichweite&&d<d0){ besten=v; d0=d; }
  }
  return besten;
}
function verlasseVersteck(){ S.versteckt=null; SFX.auftauchen(); }
function ruckeln(){
  S.ruckelT=TUNE.ruckelDauer;
  S.naechstesRuckel=TUNE.ruckelMin+Math.random()*(TUNE.ruckelMax-TUNE.ruckelMin);
  S.vx+=(Math.random()-.5)*40;
  S.verdacht=Math.max(0,S.verdacht-TUNE.ruckelVerdachtNachlass);
  SFX.ruckel();
}
function erwischt(){
  S.hp--; S.verdacht=0; S.unverwundbarT=TUNE.unverwundbarDauer; S.warnGespielt=false;
  /* Die Kontrolle beendet die Verfolgung. Ohne das blieb der Alarm stehen,
     der Verdacht war nach der Unverwundbarkeit sofort wieder voll, und man
     verlor alle drei Leben am selben Kontrolleur - in jedem einzelnen
     Testlauf exakt drei Kontrollen hintereinander. Er hat dich ja gerade
     kontrolliert; er faengt nicht sofort wieder von vorn an. */
  S.kontrolleure.forEach(k=>{ k.alarm=0; k.zielX=null; });
  S.x=Math.max(EINSTIEG_X-10,S.x-TUNE.erwischtRueckstoss);
  S.ruettel=8; S.blitz=.5; SFX.erwischt();
  meldung(pick(['AUSWEIS BITTE','KONTROLLE','SIE DA']),1.6);
  if(S.hp<=0){ S.modus='ende'; S.gewonnen=false; S.faenger='KEIN TICKET. RAUSGESCHMISSEN.'; }
}

function bus(dt){
  S.zeit+=dt; S.busZeit+=dt;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  S.naechstesRuckel-=dt;
  if(S.ruckelT>0) S.ruckelT-=dt;
  if(S.naechstesRuckel<=0) ruckeln();
  if(S.unverwundbarT>0) S.unverwundbarT-=dt;

  if(S.ablenkT>0){
    S.ablenkT-=dt;
    if(S.ablenkT<=0) S.kontrolleure.forEach(k=>{ k.zielX=null; });
  }

  /* Bewegung aus dem Versteck bricht es automatisch ab */
  if(S.versteckt&&(linksAn||rechtsAn||hochAn||runterAn)) verlasseVersteck();

  /* Tiefe. Ausgeschrieben statt bewegeTiefe(S,...): die Engine-Funktion
     schreibt auf obj.t - und S.t ist hier die Spielzeit. Der Aufruf wuerde
     jeden Frame die Uhr ueberschreiben, ohne dass etwas abstuerzt. */
  if(!S.versteckt){
    const rt=(runterAn?1:0)-(hochAn?1:0);
    S.vt += (rt*TUNE.tiefeTempo-S.vt)*Math.min(1,14*dt);
    S.tiefe = Math.max(0,Math.min(1,S.tiefe+S.vt*dt));
    /* Wo Sitze stehen, kommt man nicht hinten durch. Man wird in den Gang
       gedrueckt - und der Gang ist die Gefahr. */
    for(const b of TUNE.sitzbloecke){
      if(S.x>b.von&&S.x<b.bis&&S.tiefe<b.tiefe){ S.tiefe=b.tiefe; S.vt=0; }
    }
  } else S.vt=0;

  const richtung = S.versteckt?0:(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  if(!S.versteckt){
    const langsam=S.pegel>TUNE.langsamAb?1-(S.pegel-TUNE.langsamAb)/100:1;
    const hoechst=TUNE.gehTempo*tempoBonus()*langsam;
    if(richtung){ S.vx+=richtung*TUNE.beschleunigung*dt; if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx); }
    else { const brems=TUNE.bremsung*dt; S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems; }
    S.x+=S.vx*dt;
    S.x=Math.max(EINSTIEG_X-10,Math.min(BUS_B-10,S.x));
    if(Math.abs(S.vx)>12){ S.gehPhase+=Math.abs(S.vx)*dt*.09; const n=Math.floor(S.gehPhase);
      if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); } }
  } else S.vx=0;

  while(aktionPuffer.length){
    aktionPuffer.shift();
    if(S.versteckt){ verlasseVersteck(); continue; }
    /* Reden geht vor Verstecken: wer direkt vor jemandem steht, meint den. */
    const f=naherFahrgast();
    if(f){
      starteGespraech(BAUM_FUER[f.id],'start',()=>gespraechFolgen(f));
      continue;
    }
    const spot=naheVersteck();
    if(spot){ S.versteckt=spot.id; SFX.verstecken(); meldung('VERSTECKT',1); }
    else { meldung('HIER NICHT',0.8); SFX.nichts(); }
  }

  for(const k of S.kontrolleure){
    if(k.alarm>0) k.alarm-=dt;
    /* Verstecken bricht die Verfolgung ab - das ist der Zweck der
       Verstecke, und ohne das waere eine Jagd nicht mehr abzuschuetteln. */
    if(S.versteckt||S.ticket) k.alarm=0;

    /* Alarm geht vor allem anderen: er laesst seine Zone stehen und
       kommt hinterher. */
    if(k.alarm>0&&S.modus==='spiel'){
      const d=S.x-k.x;
      if(Math.abs(d)>2) k.blick=Math.sign(d);
      k.x+=k.blick*TUNE.jagdTempo*dt;
      k.t += Math.sign((S.tiefe-k.t)||0)*Math.min(Math.abs(S.tiefe-k.t),0.9*dt);
      continue;
    }

    /* Abgelenkt: sie verlassen ihre Zone und gehen zum Laerm. Solange sie
       unterwegs sind, schauen sie dorthin und nicht auf dich. */
    if(k.zielX!=null){
      const d=k.zielX-k.x;
      if(Math.abs(d)>3){ k.blick=Math.sign(d); k.x+=k.blick*TUNE.kontrolleurTempo*1.6*dt; }
      continue;
    }
    /* Zurueck auf Posten, nachdem die Ablenkung vorbei ist */
    if(Math.abs(k.x-k.heim)>60){
      const d=k.heim-k.x; k.blick=Math.sign(d);
      k.x+=k.blick*TUNE.kontrolleurTempo*1.2*dt; continue;
    }
    /* Sie stehen nicht auf einer festen Linie: wer im Gang pendelt,
       verschiebt seinen Kegel - damit gibt es keine Spur, die immer
       sicher ist. */
    k.t = k.heimT + Math.sin(S.busZeit*TUNE.kontrolleurPendelTempo + k.heim)*TUNE.kontrolleurPendel;
    if(k.pauseT>0){ k.pauseT-=dt; continue; }
    k.x+=k.blick*TUNE.kontrolleurTempo*dt;
    if(k.x>=k.maxX){ k.x=k.maxX; k.blick=-1; k.pauseT=TUNE.patrouillePause; }
    else if(k.x<=k.minX){ k.x=k.minX; k.blick=1; k.pauseT=TUNE.patrouillePause; }
  }

  if(!S.versteckt&&S.unverwundbarT<=0&&!S.ticket){
    /* Sichtkegel in der Flaeche: wer weit genug in der Sitzreihe ist,
       liegt seitlich ausserhalb und kommt vorbei. Genau davon lebt die
       Tiefe - ohne die Kappung in welt.js waere der Kegel am Ende so
       breit wie der Bus und Ausweichen braechte nichts. */
    let gesehen=false;
    for(const k of S.kontrolleure){
      if(imSichtkegel({x:k.x,t:k.t,blick:k.blick},{x:S.x,t:S.tiefe},
                      TUNE.sichtWeite,TUNE.kegelOeffnung)){
        gesehen=true;
        k.alarm=TUNE.jagdDauer;          // er hat dich, und er bleibt dran
      }
    }
    /* Wer verfolgt wird, wird auch dann verdaechtiger, wenn er gerade
       aus dem Kegel raus ist - sonst reicht ein Schritt zur Seite.
       Direkt neben dir geht es schnell: dann bleibt etwa eine Sekunde, um
       in ein Versteck zu kommen oder durch einen Durchgang zu sein.
       Bewusst KEIN sofortiges Zugreifen - das hat im Test jeden erwischt,
       der stehen geblieben ist, ohne dass der Balken je etwas gezeigt
       haette. Ein Tod ohne Vorwarnung ist kein Stealth, das ist eine
       Falle. */
    let jagdRate=0;
    for(const k of S.kontrolleure){
      if(k.alarm<=0) continue;
      const nah=Math.abs(S.x-k.x)<TUNE.jagdNah;
      jagdRate=Math.max(jagdRate, nah?TUNE.jagdVerdachtNah:TUNE.jagdVerdacht);
    }
    if(jagdRate)
      S.verdacht=Math.min(100,S.verdacht+jagdRate*verdachtMultiplikator()*dt);
    if(gesehen) S.verdacht=Math.min(100,S.verdacht+TUNE.verdachtProSek*verdachtMultiplikator()*dt);
    else S.verdacht=Math.max(0,S.verdacht-TUNE.verdachtAbbau*dt);
  } else if(S.versteckt){
    S.verdacht=Math.max(0,S.verdacht-TUNE.verdachtAbbauVersteckt*dt);
  }

  if(S.verdacht>=70&&!S.warnGespielt){ S.warnGespielt=true; SFX.warn(); meldung('VORSICHT - ER SIEHT DICH',1.4); }
  if(S.verdacht<40) S.warnGespielt=false;
  if(S.verdacht>=100&&S.unverwundbarT<=0) erwischt();

  kamera(dt);

  /* Der letzte Waggon: vor der Tuer stehen drei. Erst wird geredet. */
  if(S.modus==='spiel'&&S.kloppeStand==='offen'&&S.x>=TUNE.kloppeX&&!S.versteckt){
    S.kloppeStand='geredet';
    starteGespraech(DIE_DREI,'start',()=>{
      if(flag('busKloppe')) starteKloppe();
      else { S.kloppeStand='vorbei'; meldung('SIE LASSEN DICH DURCH',1.8); }
    });
    return;
  }
  /* Solange sie noch da stehen, kommt niemand an der Tuer vorbei. */
  if(S.kloppeStand==='geredet'||S.kloppeStand==='kampf'){
    S.x=Math.min(S.x,TUNE.kloppeX+2);
  }

  if(S.modus==='spiel'&&S.x>=TUER_X&&!S.versteckt) starteCutscene();
}

/* ==========================================================================
   KAMERA
   ========================================================================== */
function szeneFuerModus(){
  if(S.modus==='sprint') return 'sprint';
  if(S.modus==='spiel'||S.modus==='kloppe') return 'bus';
  return S.letzteSzene;
}
function kamera(dt){
  const lvlB = szeneFuerModus()==='sprint' ? SPRINT_B : BUS_B;
  const ziel=Math.max(0,Math.min(lvlB-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   CUTSCENE UND ENDE
   ========================================================================== */
const SZENEN=[
  { d:1.0, txt:'' },
  { d:2.2, txt:'*DIE BAHN HAELT AN DEINER HALTESTELLE*' },
  { d:2.2, txt:'DU: GESCHAFFT. NIEMAND HATS GEMERKT.' },
  { d:2.2, txt:'MAX FERDI: REDEN WIR NIE WIEDER DRUEBER.' },
  { d:2.4, txt:'LEVEL 3 GESCHAFFT' },
];
function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; SFX.sieg(); }
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}
function levelGeschafft(){
  /* Jonas kommt nur mit, wenn man ihn ueberzeugt hat. Vorher stand er
     automatisch in der Crew, egal ob man ihn ueberhaupt gesehen hat -
     das war keine Begegnung, das war eine Zeile Code. */
  if(flag('jonasDabei')) speichereCrew('JONAS');
  /* Wer die Notbremse gezogen hat, kommt spaeter an. Level 4 liest das:
     die Schlange ist dann laenger und der Tuersteher schlechter gelaunt. */
  if(flag('notbremse')) setzeFlag('spaetDran');
  setzeKapitel(4);
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Der Pegel wird unveraendert an Level 4 weitergereicht. */
  try{ localStorage.setItem(PEGEL_KEY,String(S.pegel)); }catch(e){}
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  /* Waehrend eines Gespraechs steht der Bus still - sonst laeuft dir ein
     Kontrolleur waehrend der Antwortauswahl in den Ruecken. */
  if(gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  if(S.modus==='sprint'){ sprint(dt); return; }
  if(S.modus==='spiel'){ bus(dt); return; }
  if(S.modus==='kloppe'){ kloppe(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const ruckelAmt = S.ruckelT>0 ? S.ruckelT/TUNE.ruckelDauer : 0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack+(Math.random()-.5)*TUNE.ruckelStaerke*2*ruckelAmt;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));

  if(szeneFuerModus()==='sprint') zeichneSprint();
  else { zeichneBus(); if(S.modus==='kloppe'){ ctx.save(); ctx.translate(-Math.round(S.kamX),0);
         zeichneKloppe(); ctx.restore(); } }

  ctx.restore();

  hud();
  if(S.modus==='kloppe') kloppeHud();
  zeichneGespraech();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneSpieler(){
  if(S.unverwundbarT>0&&Math.floor(S.t*12)%2===0) return;
  let rows;
  if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  /* Im Sprint gibt es keine Tiefe - da bleibt S.y der Boden. Im Bus
     verschiebt die Tiefe zusaetzlich, S.y traegt weiter die Sprunghoehe. */
  const versatz = szeneFuerModus()==='bus' ? BODEN-bodenY(S.tiefe) : 0;
  const y=S.y-versatz-rows.length;
  if(versatz!==0){
    ctx.globalAlpha=.26; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(S.x-3),Math.round(bodenY(S.tiefe)),7,1); ctx.globalAlpha=1;
  }
  outline(rows,S.x-3,y,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,y); else sprite(rows,S.x-3,y);
}

function zeichneBusAussen(x){
  const y=BODEN-46;
  ctx.fillStyle=KEY.y; ctx.fillRect(x,y,70,46);
  ctx.fillStyle=KEY.i; ctx.fillRect(x,y+38,70,8);
  ctx.fillStyle='#0e0b1a'; ctx.fillRect(x+4,y+40,10,6); ctx.fillRect(x+54,y+40,10,6);
  for(let i=0;i<4;i++){ ctx.fillStyle='#ffd447cc'; ctx.fillRect(x+6+i*15,y+8,10,12); }
  ctx.fillStyle=P.gold; ctx.fillRect(x+2,y+2,66,3);
  if(Math.floor(S.t*4)%2===0){ ctx.fillStyle=P.rot; ctx.fillRect(x+62,y+30,4,4); }
  text('BUS',x+27,y+46+4,P.dim);
}

function zeichneSprint(){
  const kx=Math.round(S.kamX);

  /* Haeuser im Hintergrund, leichtes Parallax */
  ctx.fillStyle='#0c0a18'; ctx.fillRect(0,0,W,BODEN);
  ctx.save(); ctx.translate(-kx*0.5,0);
  for(let i=0;i<24;i++){ const bx=i*70, bh=26+((i*53)%36);
    ctx.fillStyle='#171025'; ctx.fillRect(bx,BODEN-bh,44,bh);
    ctx.fillStyle='#2a2240';
    for(let wy=BODEN-bh+4;wy<BODEN-4;wy+=8) ctx.fillRect(bx+6,wy,6,4);
  }
  ctx.restore();

  ctx.save(); ctx.translate(-kx,0);
  ctx.fillStyle='#1a1622'; ctx.fillRect(0,BODEN,SPRINT_B,H-BODEN);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,SPRINT_B,1);
  ctx.fillStyle='#33304a';
  for(let x=0;x<SPRINT_B;x+=26) ctx.fillRect(x,BODEN+6,14,1);

  for(const h of S.hindernisse){
    const rows=SPR[h.art]; const y=BODEN-rows.length;
    outline(rows,h.x,y,1,.5); sprite(rows,h.x,y,1,null,h.getroffen?0.55:1);
  }

  zeichneBusAussen(SPRINT_B-70);
  zeichneSpieler();

  ctx.restore();

  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.35+p*.35);
  ctx.drawImage(verlauf('vigSprint',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,50,W/2,H*.55,W*.65);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

function zeichneBus(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  ctx.fillStyle=KEY.e; ctx.fillRect(0,14,BUS_B,BODEN-14);
  ctx.fillStyle='#0b1024'; ctx.fillRect(0,24,BUS_B,26);
  for(let i=0;i<70;i++){ const lx=((i*53)-Math.floor(S.t*50)%BUS_B+BUS_B*4)%BUS_B;
    ctx.fillStyle=i%5===0?'#ffe08a99':'#ffffff33'; ctx.fillRect(lx,30+((i*37)%14),2,1); }
  ctx.fillStyle=KEY.q; ctx.fillRect(0,BODEN,BUS_B,H-BODEN);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,BODEN,BUS_B,1);
  ctx.fillStyle='#00000033';
  for(let x=0;x<BUS_B;x+=14) ctx.fillRect(x,BODEN+5,7,1);

  for(let x=60;x<BUS_B-20;x+=90) sprite(SPR.stange,x,BODEN-30);

  /* Die Waggon-Uebergaenge. Sie sind nicht nur Deko: an ihnen sieht man,
     wo die Zone des naechsten Kontrolleurs anfaengt. */
  for(const gx of TUNE.waggonGrenzen){
    ctx.fillStyle='#0d0a18'; ctx.fillRect(gx-5,18,10,BODEN-18);
    ctx.fillStyle=KEY.u;     ctx.fillRect(gx-5,18,1,BODEN-18); ctx.fillRect(gx+4,18,1,BODEN-18);
    ctx.fillStyle='#161230'; ctx.fillRect(gx-3,26,6,BODEN-34);
  }

  /* Alles mit Tiefe kommt in eine Liste und wird von hinten nach vorn
     gemalt. Sonst steht der Kontrolleur vor dem Sitz, hinter dem man
     sich gerade versteckt. */
  const inTiefe=[];

  /* Die Sitzbloecke sichtbar machen. Eine unsichtbare Wand waere die
     unfairste Art, dem Spieler die Abkuerzung wegzunehmen. */
  for(const b of TUNE.sitzbloecke){
    inTiefe.push({ t:b.tiefe-0.16, mal:()=>{
      const fuss=bodenY(Math.max(0,b.tiefe-0.16)), rows=SPR.sitz;
      for(let x=b.von;x<b.bis-6;x+=10){
        outline(rows,x,fuss-rows.length,1,.5);
        sprite(rows,x,fuss-rows.length);
      }
    }});
  }

  for(const v of VERSTECKE){
    inTiefe.push({ t:v.t, mal:()=>{
      const rows=SPR[v.art], fuss=bodenY(v.t), y=fuss-rows.length;
      outline(rows,v.x,y,1,.6); sprite(rows,v.x,y);
      const nah=Math.abs(v.x-S.x)<TUNE.versteckReichweite
               &&Math.abs(v.t-S.tiefe)<=0.3&&S.modus==='spiel'&&!S.versteckt;
      if(nah&&Math.floor(S.t*4)%2===0) text('E',v.x+2,y-9,P.gold);
      if(S.versteckt===v.id) text('OK',v.x+2,y-9,P.gruen);
    }});
  }

  for(const f of FAHRGAESTE){
    inTiefe.push({ t:f.t, mal:()=>{
      const rows=SPR[f.spr], fuss=bodenY(f.t), y=fuss-rows.length;
      ctx.globalAlpha=.22; ctx.fillStyle='#000';
      ctx.fillRect(Math.round(f.x-3),Math.round(fuss),7,1); ctx.globalAlpha=1;
      outline(rows,f.x-3,y,1,.55); sprite(rows,f.x-3,y);
      const nah=Math.abs(f.x-S.x)<TUNE.redeReichweite
               &&Math.abs(f.t-S.tiefe)<=0.3&&S.modus==='spiel'&&!S.versteckt;
      /* Namen nur in der Naehe - sonst stehen bei 320 Pixeln Breite fuenf
         Beschriftungen gleichzeitig im Bild und man sieht den Bus nicht. */
      if(Math.abs(f.x-S.x)<46){
        const farbe=S.geredet[f.id]?P.dim:P.gold;
        text(f.name,f.x+3-textW(f.name)/2,y-16,farbe);
      }
      if(nah&&Math.floor(S.t*4)%2===0) text('E',f.x+2,y-9,P.gold);
    }});
  }

  { const rows=SPR.tuerBus, fuss=bodenY(TUNE.gangTiefe), y=fuss-rows.length;
    inTiefe.push({ t:TUNE.gangTiefe, mal:()=>{
      outline(rows,TUER_X,y,1,.6); sprite(rows,TUER_X,y);
      text('AUSSTIEG',TUER_X+4-textW('AUSSTIEG')/2,y-9,P.gold); }}); }

  for(const k of S.kontrolleure){
    inTiefe.push({ t:k.t, mal:()=>{
      const fuss=bodenY(k.t);
      /* Der Kegel wird als Flaeche gemalt, nicht als Balken - sonst sieht
         man nicht, dass er sich seitlich nicht beliebig oeffnet. */
      if(!S.ticket){
        ctx.globalAlpha=S.ablenkT>0?.07:(k.alarm>0?.28:.15);
        ctx.fillStyle=k.alarm>0?P.gold:P.rot;
        const seit=Math.min(TIEFE.kegelMax,TUNE.kegelOeffnung)*(TIEFE.vorne-TIEFE.hinten);
        ctx.beginPath();
        ctx.moveTo(k.x+k.blick*4,fuss-6);
        ctx.lineTo(k.x+k.blick*(4+TUNE.sichtWeite),fuss-6-seit);
        ctx.lineTo(k.x+k.blick*(4+TUNE.sichtWeite),fuss-6+seit);
        ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
      }
      const rows=SPR.kontrolleur, y=fuss-rows.length;
      ctx.globalAlpha=.22; ctx.fillStyle='#000';
      ctx.fillRect(Math.round(k.x-3),Math.round(fuss),7,1); ctx.globalAlpha=1;
      outline(rows,k.x-3,y,1,.55);
      if(k.blick<0) spriteFlip(rows,k.x-3,y); else sprite(rows,k.x-3,y);
      if(S.ablenkT>0) text('?',k.x+2,y-9,P.gold);
      else if(k.alarm>0&&Math.floor(S.t*6)%2===0) text('!',k.x+2,y-9,P.rot);
    }});
  }

  if(S.versteckt){
    const spot=VERSTECKE.find(v=>v.id===S.versteckt);
    if(spot) inTiefe.push({ t:spot.t+0.01, mal:()=>{
      const rows=SPR.versteckt, y=bodenY(spot.t)-rows.length;
      sprite(rows,spot.x,y,1,null,.85); }});
  } else if(S.modus!=='kloppe'){
    /* Im Kampf zeichnet zeichneKloppe() die Figur mit ihren Kampfzustaenden.
       Beides zusammen haette den Block- und Rollzustand ueberdeckt. */
    inTiefe.push({ t:S.tiefe, mal:()=>zeichneSpieler() });
  }

  zeichneNachTiefe(inTiefe);

  ctx.restore();

  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.4+p*.4);
  ctx.drawImage(verlauf('vigBus',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,46,W/2,H*.55,W*.62);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  const szene=szeneFuerModus();

  /* Im Kampf gilt die Kampfanzeige. Vorher lagen Herzen und Verdachtsbalken
     genau unter Leben und Ausdauer - zwei Anzeigen an derselben Stelle. */
  if(S.modus==='kloppe'){ return; }

  if(szene==='bus'){
    for(let i=0;i<TUNE.leben;i++){
      const x=6+i*7,y=6, voll=i<S.hp;
      if(!voll){ ctx.fillStyle='#2a2440'; ctx.fillRect(x,y,5,4); ctx.fillRect(x+1,y+4,3,1); continue; }
      ctx.fillStyle=(S.hp===1&&Math.floor(S.t*6)%2===0)?P.weiss:P.rot;
      ctx.fillRect(x,y,2,3); ctx.fillRect(x+3,y,2,3); ctx.fillRect(x+1,y+2,3,2); ctx.fillRect(x+2,y+4,1,1);
    }
    const bw=64,bx=(W-bw)/2,by=6,v=S.verdacht/100;
    ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
    ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
    ctx.fillStyle=v<.5?P.gold:P.rot; ctx.fillRect(bx,by,Math.round(bw*v),4);
    text('VERDACHT',bx+(bw-textW('VERDACHT'))/2,by+6,P.dunkel);
  } else if(szene==='sprint'){
    const rest=Math.max(0,TUNE.sprintSekunden-S.sprintZeit);
    const knapp=rest<10;
    textC('BAHN IN '+Math.ceil(rest)+'S',6,knapp&&Math.floor(S.t*4)%2===0?P.rot:P.gold);
  }

  { const bw=50,bx=W-bw-6,by=6,p=S.pegel/100;
    ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
    ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
    ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot; ctx.fillRect(bx,by,Math.round(bw*p),4);
  }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2); textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT); textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('DER NACHTBUS',22,P.neon,2);
  textC('LEVEL 3',44,P.dim);
  const zeilen=['DIE LETZTE BAHN FAEHRT GLEICH','KEIN TICKET. KONTROLLEURE AN BORD.','NICHT ERWISCHEN LASSEN.'];
  zeilen.forEach((z,i)=>textC(z,64+i*10,i===2?P.gold:P.weiss));
  const st=IS_TOUCH?[['< >','LAUFEN'],['SPR','SPRINGEN'],['E','VERSTECKEN']]
                   :[['A D','LAUFEN'],['LEER','SPRINGEN'],['E','VERSTECKEN']];
  st.forEach((z,i)=>{ text(z[0],70,104+i*9,P.gold); text(z[1],104,104+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),136,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'LEERTASTE ODER E',161,P.weiss,1);
}
function zeichneIntro(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,0,W,H);
  const m=Math.round(W/2);
  ctx.fillStyle='#171025'; ctx.fillRect(0,40,W,90);
  ctx.fillStyle='#1a1622'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  for(let i=0;i<8;i++){ ctx.fillStyle=(i%3===0)?'#ffd44755':'#2a2240'; ctx.fillRect(20+i*36,54+((i*17)%30),8,10); }
  sprite(SPR.steh,m-30,130-13);
  sprite(SPR.geh[1],m,130-13);
  ctx.drawImage(verlauf('introvig3',W,H,g=>{ const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)'); g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 3 GESCHAFFT',34,P.gold,2);
      textC('DIE LETZTE BAHN. GERADE NOCH.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegel),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 4':'E  WEITER ZU LEVEL 4',134,P.gruen,1);
    } else {
      textGlowC(S.faenger==='DIE BAHN IST WEG'?'VERPASST':'ERWISCHT',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */


starteSchleife();
</script>
