/* Musik: schneller Vierviertel-Beat, wird lauter je hoeher der Pegel */
const BASS=[110,110,0,110, 146,146,0,110, 98,98,0,98, 130,130,146,164];

function musik(){
  if(!AC||muted||S.modus==='pause') return;
  const st=60/136/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut=S.modus!=='titel'?.024+(S.pegel/100)*.022:.014;
    if(f) ton(f,MUS.next,st*.8,'square',laut);
    if(S.modus!=='titel'){
      if(i%4===0) ton(55,MUS.next,.08,'sine',.05);
      if(i%2===1) rauschenKurz(MUS.next);
    }
    MUS.next+=st; MUS.step++;
  }
}
function rauschenKurz(when){
  if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*.02), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=.010; s.connect(g); g.connect(AC.destination); s.start(when);
}

let linksAn=false, rechtsAn=false, aktionGehalten=false, hochAn=false, runterAn=false;
let aktionPuffer=[];

function druckAktion(){
  if(typeof gespraechAktiv==='function'&&gespraechAktiv()){ ensureAudio(); gespraechBestaetigen(); return; }
  ensureAudio();
  if(S.modus==='ecke'){ eckeWeiter(); return; }
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='level6.html'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(gespraechAktiv()){
    if(['ArrowLeft','KeyA','ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); gespraechWaehle(-1); return; }
    if(['ArrowRight','KeyD','ArrowDown','KeyS'].includes(e.code)){ e.preventDefault(); gespraechWaehle(1); return; }
  }
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(['ArrowUp','KeyW'].includes(e.code)){ e.preventDefault(); hochAn=true; }
  if(['ArrowDown','KeyS'].includes(e.code)){ e.preventDefault(); runterAn=true; }
  if(['ShiftLeft','ShiftRight'].includes(e.code)){ e.preventDefault(); S.blockAn=true; }
  /* Im Kampf ist die Leertaste die Ausweichrolle, sonst wie E. */
  if(e.code==='Space'&&S.modus==='kloppe'){ e.preventDefault(); S.rolleGedrueckt=true; return; }
  if(['KeyE','Enter','Space'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(S.modus==='titel'&&(e.code==='Digit1'||e.code==='Numpad1')){
    e.preventDefault(); location.href='index.html'; }
  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['ArrowUp','KeyW'].includes(e.code)) hochAn=false;
  if(['ArrowDown','KeyS'].includes(e.code)) runterAn=false;
  if(['ShiftLeft','ShiftRight'].includes(e.code)) S.blockAn=false;
  if(['KeyE','Enter','Space'].includes(e.code)) aktionGehalten=false; });
addEventListener('blur',()=>{ linksAn=rechtsAn=aktionGehalten=hochAn=runterAn=false; if(S) S.blockAn=false; });

function pruefeBlackout(){
  if(S.pegel<TUNE.blackoutBei||S.modus==='ende') return false;
  S.modus='ende'; S.gewonnen=false;
  S.faenger='BLACKOUT AUF DER TANZFLAECHE.'; SFX.aua();

function tempoMultiplikator(){
  let m=1;
  if(S.pegel>TUNE.langsamAb) m*=1-(S.pegel-TUNE.langsamAb)/100;
  if(S.confidenceT>0) m*=TUNE.confidenceTempo;
  if(S.geknicktT>0) m*=TUNE.geknicktTempo;
  return Math.max(.25,m);
}
function reichweiteAktuell(){
  let r=TUNE.reichweite;
  if(S.confidenceT>0) r*=TUNE.confidenceReichweite;
  if(S.geknicktT>0) r*=TUNE.geknicktReichweite;
  return r;
}
/* Dreieckswelle - reiner Funktion von t, deshalb auf Tastatur und Touch
   exakt gleich, egal welcher Input den Treffer ausloest. */
function markerPos(t,tempo,breite){
  const cyc=breite*2; let x=(t*tempo)%cyc; if(x<0) x+=cyc;
  return x>breite?cyc-x:x;
}
function aktuellesFenster(){
  if(!S.mini) return TUNE.ansprechFenster;
  if(S.mini.art==='ex') return TUNE.exBreite;
  let f=TUNE.ansprechFenster;
  if(ladeCrew().includes('MORITZ')) f+=TUNE.ansprechBonus;
  if(S.pegel>=TUNE.mutAb) f+=TUNE.ansprechMutBonus;
  if(S.confidenceT>0) f+=TUNE.confidenceFensterBonus;
  return Math.min(TUNE.minigameBreite-4,f);
}
const aktuellesTempo=()=>S.mini&&S.mini.art==='ex'?TUNE.exTempo:TUNE.ansprechTempo;
function naechsteMitte(){
  const breite=TUNE.minigameBreite, fenster=aktuellesFenster();
  return fenster/2+Math.random()*(breite-fenster);
}
function starteMinigame(art,ziel){
  S.modus='mini';
  S.mini={ art, ziel, runden:0, fehler:0, t0:S.t, mitte:0 };
  S.mini.mitte=naechsteMitte();
  S.vx=0;
  zeigeHinweis(art==='ex'?'E BEIM AUF-EX TREFFEN':'IM TAKT: E IM FENSTER TREFFEN',3);
}
function pruefeMinigame(){
  const m=S.mini; if(!m) return;
  const breite=TUNE.minigameBreite, fenster=aktuellesFenster(), tempo=aktuellesTempo();
  const pos=markerPos(S.t-m.t0,tempo,breite);
  const treffer=Math.abs(pos-m.mitte)<=fenster/2;
  if(treffer){
    m.runden++; SFX.hit(); S.blitz=.2;
    const rundenZiel=m.art==='ex'?1:TUNE.ansprechRunden;
    if(m.runden>=rundenZiel){ beendeMinigame(true); return; }
    meldung(pick(['GUT','WEITER SO','PASST']),.9);
    m.mitte=naechsteMitte(); m.t0=S.t;
  } else {
    m.fehler++; SFX.miss();
    const fehlerMax=m.art==='ex'?0:TUNE.ansprechFehlerMax;
    if(m.fehler>fehlerMax){ beendeMinigame(false); return; }
    meldung(pick(['DANEBEN','NOCHMAL']),.9);
    m.mitte=naechsteMitte(); m.t0=S.t;
  }
}
function beendeMinigame(erfolgreich){
  const m=S.mini;
  if(m.art==='ex'){
    if(erfolgreich){ S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.exProSchluck);
      meldung('AUF EX',1.4); SFX.schluck(); }
    else { S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.exMissSchluck);
      meldung('DANEBEN GEKIPPT',1.4); SFX.nichts(); }
    S.mini=null; S.modus='spiel'; pruefeBlackout();
    return;
  }
  /* Tanzen - danach geht das Gespraech weiter, je nachdem wie es lief. */
  const z=m.ziel;
  S.mini=null; S.modus='spiel';
  if(erfolgreich){ SFX.erledigt(); S.confidenceT=TUNE.confidenceDauer; }
  else SFX.aua();
  speicherePegel(S.pegel);
  starteGespraech(BAUM_FUER[z.id], erfolgreich?'tanzGut':'tanzSchlecht', e=>gespraechEnde(z,e));
  return;
  S.mini=null; S.modus='spiel';
}
/* Stroboskop - reine Funktion von t, siehe TUNE (6). Lange, sanfte
   Verdunklung statt hartem Blitzen im Bildwiederholtakt. */
function stroboskop(){
  const phase=S.t%TUNE.strobeZyklus;
  if(phase<TUNE.strobeDauer){
    return { dunkel:TUNE.strobeMaxDunkel*Math.sin(Math.PI*(phase/TUNE.strobeDauer)), flacker:0 };
  }
  const nach=phase-TUNE.strobeDauer;
  if(nach<TUNE.strobeFlackerDauer){
    return { dunkel:0, flacker:TUNE.strobeFlackerMax*Math.sin(Math.PI*(nach/TUNE.strobeFlackerDauer)) };
  }
  return { dunkel:0, flacker:0 };
}


/* ==========================================================================
   WAS IN REICHWEITE IST
   Eine Stelle, die alle fragen: die Aktion, die Knopf-Aufschrift am Handy
   und das blinkende E. Sonst steht auf dem Knopf etwas anderes, als er tut.
   ========================================================================== */
function naechstesZiel(){
  const r=reichweiteAktuell();
  let bestes=null, d0=1e9;
  const pruefe=(obj,art,tiefeOk)=>{
    if(!tiefeOk) return;
    const d=Math.abs(obj.x-S.x);
    if(d<r&&d<d0){ bestes={art,obj}; d0=d; }
  };
  for(const z of ZIELE){
    if(z.stand!=='offen') continue;
    pruefe(z,'reden',Math.abs(z.t-S.tiefe)<=TUNE.redeTiefe);
  }
  pruefe(BARTHEKE,'bar',S.tiefe<=TUNE.barTiefe);
  pruefe(WASCHBECKEN,'wasser',S.tiefe<=TUNE.barTiefe);
  pruefe(AUSGANG,'tuer',true);
  return bestes;
}

/* ==========================================================================
   GESPRAECHE UND IHRE FOLGEN
   Die Baeume setzen Zuneigung und Flags. Was danach im Club passiert,
   steht hier an einer Stelle.
   ========================================================================== */
function redeMit(z){
  /* Der Pegel lebt in diesem Level in S.pegel, die Bedingungen der Baeume
     lesen ihn aus dem Speicher. Vorher abgleichen, sonst gilt der Wert vom
     Levelstart - und "betrunken" waere nie freigeschaltet. */
  speicherePegel(S.pegel);
  S.vx=0; S.vt=0;
  starteGespraech(BAUM_FUER[z.id],'start',e=>gespraechEnde(z,e));
}
function gespraechEnde(z,e){
  S.pegel=ladePegel();        // Shots aus dem Gespraech zaehlen
  const m=S.marvin;
  if(e==='@tanz'){ starteMinigame('tanz',z); return; }
  if(e==='@ja'){
    if(m.ziel===z) m.wut=true;
    starteEcke(z); return;
  }
  if(e==='@nummer'){
    z.stand='nummer'; S.erfolge++;
    wirke({ruf:4, flag:'schreibt_'+z.id});
    if(m.ziel===z) m.wut=true;
    S.confidenceT=TUNE.confidenceDauer;
    meldung('NUMMER VON '+z.name,2); SFX.erledigt(); return;
  }
  if(e==='@nett'){
    z.stand='nett'; wirke({ruf:2});
    meldung('FREUNDLICH AUSEINANDER',1.6); return;
  }
  if(e==='@nein'){
    /* Eine Abfuhr bleibt nicht unter vier Augen. Der Ruf sinkt - und mit
       ihm die Antworten, die bei den anderen noch gehen. */
    z.stand='nein'; S.abfuhren++;
    wirke({ruf:TUNE.abfuhrRuf, mut:-4});
    S.geknicktT=TUNE.geknicktDauer; S.confidenceT=0;
    meldung(S.abfuhren>1?'DAS SPRICHT SICH RUM':'AUA. ABFUHR',1.8); SFX.aua(); return;
  }
  /* Neutral beendet: man darf nochmal hin. */
}

/* ==========================================================================
   DIE ECKE
   Erzaehlt statt gezeigt. Das Bild wird dunkel, die Zeilen kommen einzeln,
   man tippt weiter. Danach ist der Abend ein anderer.
   ========================================================================== */
function starteEcke(z){
  S.modus='ecke'; S.ecke={ z, i:0, t:0 }; S.vx=0;
}
function eckeWeiter(){
  const e=S.ecke; if(!e) return;
  if(e.t<0.35) return;              // kein versehentliches Durchtippen
  e.i++; e.t=0;
  if(e.i>=ECKE[e.z.id].length) eckeVorbei();
}
function eckeTakt(dt){
  const e=S.ecke; if(!e) return;
  e.t+=dt;
  if(e.t>3.4) eckeWeiter();
  aktionPuffer.length=0;
}
function eckeVorbei(){
  const z=S.ecke.z;
  S.ecke=null; S.modus='spiel';
  z.stand='ja'; S.erfolge++;
  wirke({ruf:8, mut:6, flag:'clubJa_'+z.id, mag:[z.name,15]});
  setzeFlag('schreibt_'+z.id);
  /* Kira faehrt mit dem Taxi - danach ist sie weg. */
  if(z.id==='kira') z.weg=true;
  S.confidenceT=TUNE.confidenceDauer; S.geknicktT=0;
  meldung('DER ABEND IST EIN ANDERER',2.4); SFX.sieg();
  /* Marvin hat es gesehen. Erfolg zieht den Rivalen an - so bricht die
     Schlaegerei aus, die im Plan steht, und zwar als Folge von etwas, das
     man selbst getan hat. */
  const m=S.marvin;
  if(m.da&&!m.fertig){ m.wut=true; m.ziel=null; zeigeHinweis('MARVIN HAT DAS GESEHEN',2.6); }
}

/* ==========================================================================
   MARVIN
   Geht dieselben Leute an wie du. Steht er lange genug ungestoert bei
   jemandem, mit dem du noch nicht geredet hast, ist sie fuer heute weg.
   Er zoegert, solange du daneben stehst - Konkurrenz sieht man.
   Nimmst du ihm eine weg, auf die er zuging, wird er sauer und stellt dich.
   ========================================================================== */
function marvinTakt(dt){
  const m=S.marvin;
  if(m.fertig) return;
  if(!m.da){
    if(S.zeit<TUNE.marvinKommtNach) return;
    m.da=true; m.x=30; m.t=0.5; setzeFlag('marvinKennt');
    meldung('MARVIN IST DA',1.8);
  }
  /* Wut: er kommt direkt auf dich zu. */
  if(m.wut){
    const dx=S.x-m.x;
    m.blick=Math.sign(dx)||1;
    m.x+=m.blick*TUNE.marvinTempo*1.8*dt;
    m.t+=(S.tiefe-m.t)*Math.min(1,2*dt);
    if(Math.abs(dx)<TUNE.marvinStellt&&S.modus==='spiel') marvinStellt();
    return;
  }
  if(m.pause>0){ m.pause-=dt; return; }
  if(!m.ziel||m.ziel.stand!=='offen'){
    const frei=ZIELE.filter(z=>z.stand==='offen'&&Math.abs(z.x-S.x)>40);
    frei.sort((a,b)=>Math.abs(a.x-m.x)-Math.abs(b.x-m.x));
    m.ziel=frei[0]||null; m.beiT=0;
  }
  if(!m.ziel) return;
  const zx=m.ziel.x+11, dx=zx-m.x;
  if(Math.abs(dx)>3){
    m.blick=Math.sign(dx); m.x+=m.blick*TUNE.marvinTempo*dt;
    m.t+=(m.ziel.t+0.06-m.t)*Math.min(1,2*dt);
    return;
  }
  m.blick=-1;
  if(Math.abs(S.x-m.ziel.x)<34){ m.beiT=Math.max(0,m.beiT-dt); return; }
  m.beiT+=dt;
  if(m.beiT>=TUNE.marvinNimmt){
    m.ziel.stand='weg'; m.hat.push(m.ziel.id);
    meldung(m.ziel.name+' IST JETZT MIT MARVIN UNTERWEGS',2.4); SFX.aua();
    m.ziel=null; m.pause=TUNE.marvinPause;
  }
}
function marvinStellt(){
  const m=S.marvin; m.wut=false;
  S.vx=0; S.vt=0;
  starteGespraech(MARVIN_BAUM,'start',e=>{
    if(e==='@kampf') starteKloppe();
    else { m.fertig=true; meldung(flag('marvinRueckzug')?'ER ZIEHT AB':'ER LACHT DICH AUS',1.8); }
  });
}

/* ==========================================================================
   DIE KLEINE SCHLAEGEREI
   Der Vorgeschmack aufs Finale. Im Stroboskop sieht man das Ausholen oft
   nicht - Blocken und Ausweichen in die Tiefe werden wichtiger als Kontern.
   Gewinnen ist nicht noetig: danach fliegen beide raus.
   ========================================================================== */
function starteKloppe(){
  S.modus='kloppe'; S.kloppeStand='kampf';
  S.ich=kaempfer({ x:S.x, t:S.tiefe, blick:1, hp:TUNE.kloppeLeben, maxHp:TUNE.kloppeLeben });
  const mv=gegner('schlaeger', S.x+26, S.tiefe);
  mv.hp=mv.maxHp=TUNE.marvinHp; mv.marvin=true;
  S.gegner=[ mv, gegner('flitzer', S.x-30, Math.min(1,S.tiefe+0.25)) ];
  S.marvin.fertig=true;
  zeigeHinweis('E SCHLAEGT - UMSCHALT BLOCKT - LEERTASTE WEICHT AUS',4);
  SFX.aua();
}
function kloppeVorbei(gewonnen){
  S.kloppeStand=gewonnen?'gewonnen':'verloren';
  wirke(gewonnen?{mut:8,ruf:6,flag:'clubKloppeGewonnen'}:{ruf:-4,flag:'clubKloppeVerloren'});
  S.ich=null; S.gegner=[];
  starteCutscene('rausschmiss');
}
function kloppe(dt){
  kampfStopTakt(dt);
  const z=kampfZeitFaktor(); if(z===0) return;
  const d=dt*z, ich=S.ich;
  kaempferTakt(ich,d);
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  const rt=(runterAn?1:0)-(hochAn?1:0);
  if(ich.zustand==='frei'||ich.zustand==='block'){
    if(richtung){ ich.x+=richtung*TUNE.gehTempo*0.62*d; ich.blick=richtung; }
    if(rt) bewegeTiefe(ich,rt,d,TIEFE.tempo*0.8,16);
  }
  ich.x=Math.max(14,Math.min(LEVEL_B-14,ich.x));
  S.x=ich.x; S.tiefe=ich.t;
  if(S.rolleGedrueckt){ S.rolleGedrueckt=false; rolle(ich, rt||(ich.t<0.5?1:-1)); }
  blocke(ich, !!S.blockAn && aktionPuffer.length===0);
  while(aktionPuffer.length){
    aktionPuffer.shift();
    let gekontert=false;
    for(const g of S.gegner){ if(g.hp<=0) continue;
      if(konterVersuch(ich,g,{reichweite:TUNE.kloppeReich})){ gekontert=true; SFX.hit(); break; } }
    if(!gekontert) schlage(ich);
  }
  if(ich.zustand==='schlag'){
    for(const g of S.gegner){ if(g.hp<=0) continue;
      const was=spielerTrifft(ich,g,{reichweite:TUNE.kloppeReich,schaden:1});
      if(was==='treffer'||was==='konter'||was==='gardebruch'){ SFX.hit(); break; } }
  }
  for(const g of S.gegner){ if(g.hp<=0) continue;
    gegnerTakt(g,d,ich);
    if(g.zustand==='schlag'){
      const was=loeseTreffer(g,ich,{reichweite:g.reichweite,schaden:1});
      if(was==='treffer'){ S.ruettel=7; S.blitz=.3; SFX.aua(); }
    }
  }
  if(S.gegner.every(g=>g.hp<=0)) kloppeVorbei(true);
  else if(ich.hp<=0) kloppeVorbei(false);
  kamera(dt);
}

/* ==========================================================================
   WAS DIE KNOEPFE AM HANDY GERADE TUN
   ========================================================================== */
function mobilKontext(){
  if(S.modus==='titel')    return {aktion:'START',  zwei:null};
  if(S.modus==='intro'||S.modus==='cutscene'||S.modus==='ecke') return {aktion:'WEITER', zwei:null};
  if(S.modus==='ende')     return {aktion:S.gewonnen?'WEITER':'NOCHMAL', zwei:null};
  if(S.modus==='pause')    return {aktion:null, zwei:null};
  if(S.modus==='mini')     return {aktion:'JETZT', zwei:null};
  if(S.modus==='kloppe')   return {aktion:'SCHLAG', zwei:'ROLLE', block:true};
  const z=naechstesZiel();
  const txt=!z?null:z.art==='reden'?'REDEN':z.art==='bar'?'AUF EX':z.art==='wasser'?'WASSER':'RAUS';
  return {aktion:txt, zwei:null};
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  /* Waehrend eines Gespraechs steht der Club - auch die Uhr und Marvin. */
  if(gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }
  if(S.modus==='ecke'){ eckeTakt(dt); return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  /* Um eins geht das Licht an. Keine Niederlage mehr - die Nacht geht
     weiter, nur mit dem, was man bis dahin geschafft hat. */
  if(S.minute>=TUNE.endMinute&&S.modus==='spiel'){ starteCutscene('licht'); return; }

  /* Stroboskop nur auf der Tanzflaeche */
  if(ortBei(S.x).strobe){ const st=stroboskop(); S.dunkel=st.dunkel; S.flacker=st.flacker; }
  else { S.dunkel=Math.max(0,S.dunkel-dt*3); S.flacker=0; }

  if(pruefeBlackout()) return;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);
  S.confidenceT=Math.max(0,S.confidenceT-dt);
  S.geknicktT=Math.max(0,S.geknicktT-dt);
  if(S.stolpernT>0) S.stolpernT=Math.max(0,S.stolpernT-dt);
  if(S.wasserT>0) S.wasserT-=dt;

  if(S.modus==='kloppe'){ kloppe(dt); return; }
  if(S.modus==='mini'){
    while(aktionPuffer.length){ aktionPuffer.shift(); pruefeMinigame(); }
    kamera(dt); return;
  }

  /* Anrempeln im Dunkeln - jetzt in der Flaeche: man kann auch hinter der
     Menge vorbei. */
  if(S.dunkel>TUNE.strobeGefahrAb&&S.stolpernT<=0&&S.confidenceT<=0){
    for(const tz of TANZER){
      if(Math.abs(tz.x-S.x)<8&&Math.abs(tz.t-S.tiefe)<0.14){
        S.stolpernT=TUNE.stolpernDauer; S.vx=0; S.vt=0; S.ruettel=4;
        SFX.stolper(); meldung('ANGERANNT',1.2); break; } }
  }

  /* Bewegung. Tiefe ausgeschrieben statt bewegeTiefe(S,...): S.t ist die
     Spielzeit, siehe WEITER.md. */
  if(S.stolpernT<=0){
    const richtung=(rechtsAn?1:0)-(linksAn?1:0);
    if(richtung) S.blick=richtung;
    const hoechst=TUNE.gehTempo*tempoMultiplikator();
    if(richtung){
      S.vx+=richtung*TUNE.beschleunigung*dt;
      if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
    } else {
      const brems=TUNE.bremsung*dt;
      S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
    }
    const rt=(runterAn?1:0)-(hochAn?1:0);
    S.vt+=(rt*TUNE.tiefeTempo*tempoMultiplikator()-S.vt)*Math.min(1,14*dt);
  } else S.vt=0;
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));
  S.tiefe=Math.max(0,Math.min(1,S.tiefe+S.vt*dt));

  if(tempo2D(S.vx,S.vt)>12){
    S.gehPhase+=tempo2D(S.vx,S.vt)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }

  marvinTakt(dt);
  if(gespraechAktiv()) return;      // Marvin hat dich gerade gestellt

  while(aktionPuffer.length){
    aktionPuffer.shift();
    const z=naechstesZiel();
    if(!z){ meldung('HIER IST NICHTS',0.8); SFX.nichts(); continue; }
    if(z.art==='reden'){ redeMit(z.obj); return; }
    if(z.art==='bar'){ starteMinigame('ex',z.obj); return; }
    if(z.art==='wasser'){
      if(S.wasserT>0){ meldung('GERADE ERST',0.9); SFX.nichts(); continue; }
      S.pegel=Math.max(0,S.pegel+TUNE.wasserPegel); S.wasserT=TUNE.wasserPause;
      meldung('KALTES WASSER INS GESICHT',1.6); SFX.schluck(); continue;
    }
    if(z.art==='tuer'){ starteCutscene('hinten'); return; }
  }
  kamera(dt);
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   CUTSCENE / SIEG
   ========================================================================== */
/* Semih kommt nur mit, wenn die Nacht im Club etwas hergegeben hat. Er
   kennt jeden - und er haengt sich nicht an jemanden, der leer ausgeht. */
const semihKommt=()=>S.erfolge>=1||flag('clubKloppeGewonnen')||wert('ruf')>=60;

/* Wie der Club endet, haengt davon ab, wie man rauskommt. */
function starteCutscene(grund){
  const z=[{ d:0.8, txt:'' }];
  if(grund==='rausschmiss') z.push(
    { d:2.4, txt:'DIE TUERSTEHER SIND SCHNELLER ALS GEDACHT.' },
    { d:2.4, txt:'ZWEI GREIFEN DICH. ZWEI GREIFEN MARVIN.' },
    { d:2.4, txt:flag('clubKloppeGewonnen')?'ER BLUTET. DU NICHT.':'DEINE LIPPE BLUTET.' },
    { d:2.4, txt:'UND DANN STEHST DU DRAUSSEN.' });
  else if(grund==='licht') z.push(
    { d:2.4, txt:'UM EINS GEHT DAS LICHT AN.' },
    { d:2.6, txt:'ALLE SEHEN PLOETZLICH SO AUS, WIE SIE SIND.' },
    { d:2.2, txt:'RAUS HIER.' });
  else z.push(
    { d:2.4, txt:'DU GEHST HINTEN RAUS.' },
    { d:2.2, txt:'DIE LUFT IST KALT UND TUT GUT.' });
  if(semihKommt()) z.push(
    { d:2.4, txt:'AN DER TUER STEHT SEMIH.' },
    { d:2.4, txt:'SEMIH KENNT JEDEN. AUCH DIE AFTERHOUR.' });
  else z.push(
    { d:2.6, txt:'KEINER WARTET AUF DICH. ALSO WEITER.' });
  z.push({ d:2.4, txt:'LEVEL 5 GESCHAFFT' });
  S.szenen=z;
  S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; SFX.sieg();
}
function levelGeschafft(){
  if(semihKommt()) speichereCrew('SEMIH');
  setzeKapitel(6);
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Pegel wird immer geschrieben, auch unveraendert - Level 6 braucht den
     korrekten Startwert. */
  try{ localStorage.setItem(PEGEL_KEY,String(S.pegel)); }catch(e){}
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=S.szenen[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=S.szenen.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const wack=S.pegel>TUNE.wackelnAb?(S.pegel-TUNE.wackelnAb)/45*3:0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneClub();
  ctx.restore();

  /* Stroboskop - deckt die Spielwelt ab, nicht das HUD darunter, damit
     Pegel und Uhr immer lesbar bleiben. */
  if(S.dunkel>0){ ctx.fillStyle=`rgba(4,2,10,${S.dunkel.toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  if(S.flacker>0){ ctx.fillStyle=`rgba(255,255,255,${S.flacker.toFixed(3)})`; ctx.fillRect(0,0,W,H); }

  hud();
  zeichneGespraech();
  if(S.modus==='ecke') zeichneEcke();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.4).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

/* Die Ecke: das Bild wird schwarz, die Zeilen kommen einzeln. */
function zeichneEcke(){
  const e=S.ecke; if(!e) return;
  ctx.fillStyle='#030208'; ctx.fillRect(0,0,W,H);
  const zeilen=ECKE[e.z.id];
  const y0=Math.round(H/2-zeilen.length*6);
  for(let i=0;i<=e.i&&i<zeilen.length;i++){
    const alpha=i<e.i?0.45:Math.min(1,e.t*2);
    ctx.globalAlpha=alpha;
    textC(zeilen[i],y0+i*12,i===e.i?P.weiss:P.dim);
  }
  ctx.globalAlpha=1;
  textC(e.z.name,y0-18,P.neon);
  if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN':'E',H-14,P.dunkel);
}

function zeichneClub(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,TIEFE.hinten-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,TIEFE.hinten-20);
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,TIEFE.hinten,o.bis-o.von,H-TIEFE.hinten);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,TIEFE.hinten,o.bis-o.von,1);
    ctx.fillStyle='#00000033';
    for(let y=TIEFE.hinten+8;y<H;y+=9) for(let x=o.von+((y>>1)%14);x<o.bis;x+=14) ctx.fillRect(x,y,7,1);
    text(o.name,o.von+6,26,'#ffffff18');
  }

  /* Partylicht - nur ueber der Tanzflaeche, gedaempft, nie reines Weiss */
  const lichter=[[240,'#ff3d8b',0],[390,'#42d9ff',1.4],[540,'#ffd447',.6]];
  for(const [lx,col,off] of lichter){
    const puls=(Math.sin(S.t*1+off)*.5+.5);
    ctx.globalAlpha=.08+puls*.09;
    ctx.drawImage(verlauf('licht'+col,180,110,g=>{
      const gr=g.createRadialGradient(90,18,4,90,18,90);
      const rgb=col==='#ff3d8b'?'255,60,180':col==='#42d9ff'?'70,210,255':'255,210,80';
      gr.addColorStop(0,`rgba(${rgb},1)`); gr.addColorStop(1,`rgba(${rgb},0)`);
      g.fillStyle=gr; g.fillRect(0,0,180,110); }),lx-90,20);
  }
  ctx.globalAlpha=1;
  /* Raucherecke: eine Laterne statt Discolicht */
  ctx.globalAlpha=.12; ctx.fillStyle='#ffd447'; ctx.fillRect(900,30,120,TIEFE.hinten-30); ctx.globalAlpha=1;

  sprite(SPR.dj,120,TIEFE.hinten-14);

  const naechst=S.modus==='spiel'?naechstesZiel():null;
  const blink=Math.floor(S.t*4)%2===0;
  const liste=[];
  const schatten=(x,t)=>{ ctx.globalAlpha=.24; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(x-3),Math.round(bodenY(t)),7,1); ctx.globalAlpha=1; };

  for(const tz of TANZER){
    liste.push({t:tz.t, mal:()=>{
      const y=bodenY(tz.t)-SPR.tanzer.length+Math.round(Math.sin(S.t*6+tz.seed));
      sprite(SPR.tanzer,tz.x-3,y,1,'#3a3052');
    }});
  }

  /* Bar und Waschbecken stehen an der Rueckwand */
  liste.push({t:BARTHEKE.t, mal:()=>{
    const y=bodenY(BARTHEKE.t)-4;
    outline(SPR.theke,BARTHEKE.x-6,y,1,.5); sprite(SPR.theke,BARTHEKE.x-6,y);
    text('BAR',BARTHEKE.x-textW('BAR')/2+0,y-10,P.dim);
    if(naechst&&naechst.obj===BARTHEKE&&blink) text('E',BARTHEKE.x-2,y-18,P.gold);
  }});
  liste.push({t:WASCHBECKEN.t, mal:()=>{
    const y=bodenY(WASCHBECKEN.t)-SPR.waschbecken.length;
    sprite(SPR.waschbecken,WASCHBECKEN.x-3,y);
    if(naechst&&naechst.obj===WASCHBECKEN&&blink) text('E',WASCHBECKEN.x-1,y-8,P.gold);
  }});
  liste.push({t:AUSGANG.t, mal:()=>{
    const y=bodenY(AUSGANG.t)-SPR.tuer.length;
    sprite(SPR.tuer,AUSGANG.x-4,y);
    text('AFTERHOUR',AUSGANG.x-textW('AFTERHOUR')/2,y-8,P.gold);
    if(naechst&&naechst.obj===AUSGANG&&blink) text('E',AUSGANG.x-1,y-16,P.gold);
  }});

  for(const z of ZIELE){
    if(z.weg) continue;
    liste.push({t:z.t, mal:()=>{
      const rows=SPR[z.spr], y=bodenY(z.t)-rows.length;
      schatten(z.x,z.t);
      outline(rows,z.x-3,y,1,.55); sprite(rows,z.x-3,y);
      /* Name nur in der Naehe - sonst ist das Bild voller Beschriftung */
      if(Math.abs(z.x-S.x)<60){
        const farbe={offen:P.weiss,ja:P.gold,nummer:P.gruen,nett:P.dim,nein:P.rot,weg:P.dunkel}[z.stand];
        text(z.name,z.x+3-textW(z.name)/2,y-9,farbe);
        if(z.stand==='weg') text('MIT MARVIN',z.x+3-textW('MIT MARVIN')/2,y-16,P.dunkel);
      }
      if(naechst&&naechst.obj===z&&blink) text('E',z.x+2,y-16,P.gold);
    }});
  }
  liste.push({t:LENA.t, mal:()=>{
    const rows=SPR.lena, y=bodenY(LENA.t)-rows.length;
    schatten(LENA.x,LENA.t); sprite(rows,LENA.x-3,y);
    if(Math.abs(LENA.x-S.x)<40) text('LENA',LENA.x+3-textW('LENA')/2,y-9,P.dunkel);
  }});

  const m=S.marvin;
  if(m.da&&!m.fertig&&S.modus!=='kloppe'){
    liste.push({t:m.t, mal:()=>{
      const lauf=laufBild(m);
      const rows=lauf>=0?gehBeine(SPR.marvin,lauf):SPR.marvin, y=bodenY(m.t)-rows.length;
      schatten(m.x,m.t);
      outline(rows,m.x-3,y,1,.6);
      if(m.blick<0) spriteFlip(rows,m.x-3,y,1,m.wut?'#ff8080':null);
      else sprite(rows,m.x-3,y,1,m.wut?'#ff8080':null);
      /* Eine Zeile hoeher als die Namen der anderen - er steht meistens
         direkt neben jemandem, und dann lagen beide Namen uebereinander. */
      if(Math.abs(m.x-S.x)<80) text('MARVIN',m.x+3-textW('MARVIN')/2,y-17,m.wut?P.rot:P.dim);
      /* Wie lange er schon bei ihr steht - man soll sehen, dass es eng wird */
      if(m.beiT>0&&m.ziel){
        const f=Math.min(1,m.beiT/TUNE.marvinNimmt);
        ctx.fillStyle='#2a2440'; ctx.fillRect(Math.round(m.x-5),y-8,11,2);
        ctx.fillStyle=P.rot; ctx.fillRect(Math.round(m.x-5),y-8,Math.round(11*f),2);
      }
    }});
  }

  if(S.modus==='kloppe') zeichneKloppe(liste);
  else liste.push({t:S.tiefe, mal:()=>{
    let rows;
    if(S.stolpernT>0) rows=SPR.steh;
    else if(tempo2D(S.vx,S.vt)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
    else rows=SPR.steh;
    const tint=S.stolpernT>0?'#ff4d4d':(S.confidenceT>0?'#ffd447':null);
    const y=bodenY(S.tiefe)-rows.length;
    schatten(S.x,S.tiefe);
    outline(rows,S.x-3,y,1,.6);
    if(S.blick<0) spriteFlip(rows,S.x-3,y,1,tint); else sprite(rows,S.x-3,y,1,tint);
  }});

  zeichneNachTiefe(liste);
  ctx.restore();

  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* Die Schlaegerei. Im Stroboskop ist das Ausholen oft nicht zu sehen -
   das ist Absicht und steht so im Plan: schlechte Sicht, Leute im Weg. */
function zeichneKloppe(liste){
  const malK=(k,steh,grund)=>liste.push({t:k.t, mal:()=>{
    const lauf=laufBild(k);
    let rows=steh;
    if(lauf>=0&&(k.zustand==='frei'||k.zustand==='block')) rows=steh===SPR.steh?SPR.geh[lauf]:gehBeine(steh,lauf);
    const y=bodenY(k.t)-rows.length+(k.zustand==='rolle'?3:0);
    const blinkt=k.unverwundbar>0&&Math.floor(S.t*18)%2===0;
    const tint=k.zustand==='block'?'#42d9ff':k.zustand==='ausholen'?P.gold:
               k.zustand==='getroffen'?'#ff8080':blinkt?'#ffffff':grund;
    ctx.globalAlpha=.24; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(k.x-3),Math.round(bodenY(k.t)),7,1); ctx.globalAlpha=1;
    outline(rows,k.x-3,y,1,.6);
    if(k.blick<0) spriteFlip(rows,k.x-3,y,1,tint); else sprite(rows,k.x-3,y,1,tint);
    if(k!==S.ich) for(let i=0;i<k.maxHp;i++){
      ctx.fillStyle=i<k.hp?P.rot:'#2a2440'; ctx.fillRect(Math.round(k.x-4+i*3),y-6,2,2); }
  }});
  for(const g of S.gegner) if(g.hp>0) malK(g, g.marvin?SPR.marvin:SPR.handlanger, null);
  if(S.ich) malK(S.ich, SPR.steh, null);
}

/* ---- HUD ---- */
function hud(){
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-10;
  text(uhr,W-textW(uhr)-6,6,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*TUNE.mutAb/100),by-1,1,6);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Erfolge und Ruf - der Ruf entscheidet, welche Antworten noch gehen */
  text('ERFOLGE '+S.erfolge,6,6,P.weiss);
  text('RUF '+Math.round(wert('ruf')),6,14,wert('ruf')<40?P.rot:P.dim);
  if(S.modus==='kloppe'&&S.ich){
    for(let i=0;i<S.ich.maxHp;i++){ ctx.fillStyle=i<S.ich.hp?P.rot:'#2a2440'; ctx.fillRect(6+i*7,24,5,4); }
    ctx.fillStyle='#2a2440'; ctx.fillRect(6,31,54,3);
    ctx.fillStyle=S.ich.ausdauer<KAMPF.ausdauerSchlag?P.rot:P.neon2;
    ctx.fillRect(6,31,Math.round(54*S.ich.ausdauer/KAMPF.ausdauerMax),3);
  }

  /* Status */
  if(S.modus!=='kloppe'){
    if(S.confidenceT>0&&Math.floor(S.t*3)%2===0) text('CONFIDENCE',6,24,P.gold);
    if(S.geknicktT>0&&Math.floor(S.t*3)%2===0) text('GEKNICKT',6,24,P.rot);
  }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0&&S.modus!=='mini'){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Minispiel-Leiste */
  if(S.modus==='mini'){
    const m=S.mini, breite=TUNE.minigameBreite, fenster=aktuellesFenster(), tempo=aktuellesTempo();
    const pos=markerPos(S.t-m.t0,tempo,breite);
    const bx2=Math.round((W-breite)/2), by2=H-24;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(m.art==='ex'?'AUF EX':'TANZEN MIT '+m.ziel.name,8,H-38,P.neon2);
    const rundenZiel=m.art==='ex'?1:TUNE.ansprechRunden;
    text('RUNDE '+(m.runden+1)+'/'+rundenZiel,W-textW('RUNDE '+(m.runden+1)+'/'+rundenZiel)-6,H-38,P.dim);
    ctx.fillStyle='#2a2440'; ctx.fillRect(bx2,by2,breite,6);
    ctx.fillStyle=P.gruen; ctx.fillRect(Math.round(bx2+m.mitte-fenster/2),by2,Math.round(fenster),6);
    ctx.fillStyle=P.weiss; ctx.fillRect(Math.round(bx2+pos)-1,by2-2,2,10);
    if(Math.floor(S.t*2)%2===0) text('E TREFFEN',W-textW('E TREFFEN')-6,H-12,P.gold);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('CLUB',22,P.neon,3);
  textC('LEVEL 5 - STROBOSKOP',44,P.dim);
  const zeilen=['AUF DER TANZFLAECHE SIEHT MAN NICHTS','WAS DU SAGST, ENTSCHEIDET','UND MARVIN IST AUCH HIER'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=IS_TOUCH?[['STICK','LAUFEN'],['KNOPF','REDEN, TRINKEN, TUER']]
                   :[['WASD','LAUFEN'],['E','REDEN, TRINKEN, TUER']];
  st.forEach((z,i)=>{ text(z[0],70,112+i*9,P.gold); text(z[1],104,112+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'E ODER LEERTASTE',H-19,P.weiss,1);
  if(!IS_TOUCH){
    const a='TASTE 1    LEVEL 1 - DIE SCHULE';
    text(a,(W-textW(a))/2,H-8,P.dunkel);
  }
}

}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=S.szenen[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 5 GESCHAFFT',34,P.gold,2);
      textC('DU BIST DRAUSSEN RICHTUNG AFTERHOUR.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('ERFOLGE  '+S.erfolge+'   RUF  '+Math.round(wert('ruf')),96,P.dim);
      textC('PEGEL  '+Math.round(S.pegel),106,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),120,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 6':'E  WEITER ZU LEVEL 6',134,P.gruen,1);
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}
