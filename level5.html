/* ============================================================================
   NACHTSCHICHT - LEVEL 5: CLUB

   Drinnen jetzt. Zwei Dinge tragen dieses Level: das Stroboskop, das die
   Sicht regelmaessig fast auf null bringt (aber bewusst kein hartes
   Weiss-Blitzen - siehe TUNE (6)), und das Ansprechen-Minispiel: ein
   Marker faehrt ueber eine Leiste, E im gruenen Fenster treffen, ein paar
   Runden davon gewinnen. Erfolg gibt kurz Confidence (schneller, groesserer
   Radius, das naechste Fenster leichter). Misserfolg macht kurz geknickt
   (langsamer, kleinerer Radius), bis man sich faengt.

   Kein Sprung in diesem Level - die Tanzflaeche ist eben, das spart eine
   ganze Klasse Bugs (Coyote-Zeit, Sprungpuffer) die hier niemand braucht.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG - flache Tanzflaeche, kein Sprung noetig */
  gehTempo:       100,
  beschleunigung: 850,
  bremsung:      1200,

  /* (2) KAMERA */
  kameraTraegheit: 6.5,
  blickVoraus:    24,

  /* (3) DER PEGEL - laeuft aus Level 2 weiter und bleibt erhalten */
  pegelMax:       100,
  proSchluck:      14,   // normaler Schluck an der Theke, ohne Minispiel
  exProSchluck:    22,   // Auf-Ex getroffen: ordentlich Pegel auf einmal
  exMissSchluck:    6,   // Auf-Ex verpatzt: nur ein kleiner Schluck
  pegelAbbau:       0.5,
  mutAb:           35,   // etwas Pegel macht das Ansprechen leichter
  wackelnAb:       55,
  langsamAb:       70,
  blackoutBei:    100,

  /* (4) DIE UHR */
  startMinute:   22*60,
  endMinute:     22*60+45,
  levelSekunden: 170,

  /* (5) REICHWEITE */
  reichweite:      15,

  /* (6) STROBOSKOP - bewusst KEIN echtes Blitzen im Bildwiederholtakt.
     Ein Zyklus dauert mehrere Sekunden: lange Verdunklung, kurzes
     helles Nachglimmen. Kein reines Weiss auf vollem Bildschirm. */
  strobeZyklus:      5.0,
  strobeDauer:       1.1,   // wie lange pro Zyklus verdunkelt wird
  strobeMaxDunkel:   0.80,  // Deckkraft der Verdunklung, nie ganz 1
  strobeFlackerDauer:0.18,  // kurzes helles Nachglimmen danach
  strobeFlackerMax:  0.16,  // gedaempft, kein harter weisser Blitz
  strobeGefahrAb:    0.45,  // ab dieser Dunkelheit droht Anrempeln

  /* (7) ANREMPELN - Kollision mit Tanzenden, wenn man nichts sieht */
  stolpernDauer:     1.0,

  /* (8) ANSPRECHEN-MINISPIEL - Marker faehrt ueber eine Leiste hin und her */
  ansprechRunden:    3,    // so viele Treffer braucht ein Erfolg
  ansprechFenster:   22,   // Breite des guten Fensters
  ansprechBonus:      9,   // groesseres Fenster mit MORITZ in der Crew
  ansprechMutBonus:   5,   // etwas Pegel macht mutiger
  ansprechTempo:    170,   // Tempo des Markers
  ansprechFehlerMax:  2,   // so viele Fehlversuche sind erlaubt
  minigameBreite:    90,   // Breite der Leiste

  /* (9) AUF-EX-MINISPIEL - gleiche Mechanik, an der Theke, nur ein Versuch */
  exBreite:         26,
  exTempo:         150,

  /* (10) CONFIDENCE / GEKNICKT */
  confidenceDauer:      9,
  confidenceTempo:      1.35,
  confidenceReichweite: 1.6,
  confidenceFensterBonus: 6,  // TODO nennt "mehr Schaden" - hier: das naechste
                               // Ansprechen faellt fuer die Dauer leichter
  geknicktDauer:        7,
  geknicktTempo:        0.6,
  geknicktReichweite:   0.6,

  /* (11) ZIEL */
  erfolgeZumSieg:    2,   // von 3 moeglichen
};

const P = {

};

const KEY={ k:'#08060f', s:'#e8b088', h:'#2a1c14', t:'#3ad1a0', p:'#2b2b48',
  n:'#ff3d8b', c:'#42d9ff', g:'#ffd447', w:'#f2f0ff', m:'#c8324a',

/* ==========================================================================

const KOPF=['..hhh..','.hsssh.','.sssss.','..sss..'];
const geh=b=>[...KOPF,'..ttt..',...b];
const SPR={
  /* Der Spieler - selbe Figur wie in den anderen Leveln */

  girlB:[...KOPF,'..ccc..','.ccccc.','.ccccc.','..c.c..'],

  /* Tanzende Menge - nur Deko, aber im Dunkeln ein Hindernis */

  /* Bar */

  /* DJ-Pult */

  /* Tuer zur Afterhour */
  tuer:['zzzzzzzz','zjjjjjjz','zjjjjjjz','zjjjjjjz','zjjjjjjz','zjjjjgjz','zjjjjjjz','zjjjjjjz',

/* ==========================================================================

const SFX={
  schritt: ()=>piep(90+Math.random()*20,.03,'triangle',.014),
  schluck: ()=>{ glissando(300,160,.22,'sine',.05); rauschen(.1,.03); },
  nichts:  ()=>piep(220,.09,'sine',.03),
  erledigt:()=>{ piep(660,.08); setTimeout(()=>piep(990,.12),85); },
  aua:     ()=>{ rauschen(.28,.09); glissando(300,90,.3,'sawtooth',.06); },
  sieg:    ()=>{ [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>piep(f,.14),i*110)); },
  hit:     ()=>piep(760+Math.random()*120,.05,'square',.035),
  miss:    ()=>piep(150,.08,'sawtooth',.04),
  stolper: ()=>{ rauschen(.08,.09); glissando(220,80,.12,'square',.05); },
};
/* Musik: schneller Vierviertel-Beat, wird lauter je hoeher der Pegel */
const BASS=[110,110,0,110, 146,146,0,110, 98,98,0,98, 130,130,146,164];

function musik(){
  if(!AC||muted||S.modus==='pause') return;
  const st=60/136/4;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%BASS.length, f=BASS[i];
    const laut=S.modus!=='titel'?.024+(S.pegel/100)*.022:.014;
    if(f) ton(f,MUS.next,st*.8,'square',laut);
    if(S.modus!=='titel'){
      if(i%4===0) ton(55,MUS.next,.08,'sine',.05);
      if(i%2===1) rauschenKurz(MUS.next);
    }
    MUS.next+=st; MUS.step++;
  }
}
function rauschenKurz(when){
  if(!AC||muted) return;
  const n=Math.floor(AC.sampleRate*.02), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=.010; s.connect(g); g.connect(AC.destination); s.start(when);
}

/* ==========================================================================
   AUFBAU
   ========================================================================== */


const BODEN=142;


/* ==========================================================================
   DER CLUB
   ========================================================================== */
const LEVEL_B=880;
const ORTE=[
  { von:0,   bis:150, name:'EINGANG',       wand:'#241a30', boden:'#1a1322' },
  { von:150, bis:560, name:'TANZFLAECHE',   wand:'#2c1c38', boden:'#20142a' },
  { von:560, bis:720, name:'BAR',           wand:'#26303a', boden:'#1a222a' },
  { von:720, bis:880, name:'RICHTUNG AFTERHOUR', wand:'#141a2c', boden:'#101624' },
];
const ortBei=x=>ORTE.find(o=>x>=o.von&&x<o.bis)||ORTE[0];

/* Die drei Leute, die man ansprechen kann. erledigt wird bei neuesSpiel() zurueckgesetzt. */
const ZIELE=[
  { id:'mia',    x:235, name:'MIA',    spr:'girlA', erledigt:false },
  { id:'sophie', x:345, name:'SOPHIE', spr:'girlB', erledigt:false },
  { id:'kira',   x:455, name:'KIRA',   spr:'girlC', erledigt:false },
];
/* Tanzende Menge - Deko, aber im Dunkeln ein Hindernis (siehe TUNE (7)) */
const TANZER=[175,205,255,295,365,395,465,500].map((x,i)=>({x,seed:i*1.37}));
const BARTHEKE={ x:610 };
const AUSGANG={ x:830 };

/* ==========================================================================
   SPEICHERSTAND
   ========================================================================== */


const BEST_KEY='nachtschicht.bestzeit5';
const ladeBest=()=>{ const v=parseFloat(localStorage.getItem(BEST_KEY)); return isFinite(v)?v:null; };
/* Der Pegel ist levelübergreifend. Level 5 liest den Endwert aus Level 2 (und
   allem danach) als Startwert und schreibt seinen eigenen Endwert fuer
   Level 6 zurueck - auch wenn er sich in dieser Runde nicht veraendert hat. */


/* ==========================================================================
   ZUSTAND
   ========================================================================== */
let S={};
function neuesSpiel(){
  S={
    modus:'titel', t:0, zeit:0,
    x:40, y:BODEN, vx:0, blick:1, gehPhase:0, schritte:0,
    kamX:0,
    pegel:parseFloat(localStorage.getItem(PEGEL_KEY))||0,
    minute:TUNE.startMinute,
    erfolge:0,
    confidenceT:0, geknicktT:0, stolpernT:0,
    dunkel:0, flacker:0,
    mini:null,
    meldung:'', meldungT:0, hinweis:'', hinweisT:0,
    ruettel:0, blitz:0,
    szene:0, szeneT:0, skipT:0,
    gewonnen:false, faenger:'', neueBestzeit:false,
  };
  for(const z of ZIELE) z.erledigt=false;
  S.kamX=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2));
}
neuesSpiel();

/* ==========================================================================
   EINGABE
   ========================================================================== */

let linksAn=false, rechtsAn=false, aktionGehalten=false;
let aktionPuffer=[];

function druckAktion(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='level6.html'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(['KeyE','Enter','Space'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(S.modus==='titel'&&(e.code==='Digit1'||e.code==='Numpad1')){
    e.preventDefault(); location.href='index.html'; }
  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['KeyE','Enter','Space'].includes(e.code)) aktionGehalten=false; });
addEventListener('blur',()=>{ linksAn=rechtsAn=aktionGehalten=false; });


bind('tleft',['touchstart','mousedown'],()=>linksAn=true);
bind('tleft',['touchend','mouseup','touchcancel'],()=>linksAn=false);
bind('tright',['touchstart','mousedown'],()=>rechtsAn=true);
bind('tright',['touchend','mouseup','touchcancel'],()=>rechtsAn=false);
bind('thit',['touchstart','mousedown'],()=>{ aktionGehalten=true; druckAktion(); });
bind('thit',['touchend','mouseup','touchcancel'],()=>aktionGehalten=false);


/* ==========================================================================
   INTRO
   ========================================================================== */
const INTRO=[
  { d:2.4, txt:'22:00. DER CLUB.' },
  { d:2.4, txt:'DRINNEN IST ES LAUT UND DUNKEL.' },
  { d:2.6, txt:'DAS STROBOSKOP MACHT DIE SICHT KAPUTT.' },
  { d:2.6, txt:'SUCH DIR LEUTE ZUM ANSPRECHEN.' },
  { d:2.8, txt:'GENUG ERFOLGE, DANN GEHT ES RICHTUNG AFTERHOUR.' },
];
function starte(){ neuesSpiel(); S.modus='intro'; S.szene=0; S.szeneT=0; piep(330,.1,'sine',.04); }
function starteLevel(){ S.modus='spiel'; zeigeHinweis('E ZUM ANSPRECHEN, TRINKEN, TUER',3);
  piep(660,.08); setTimeout(()=>piep(990,.12),90); }
function intro(dt){ S.szeneT+=dt;
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

/* ==========================================================================
   HELFER
   ========================================================================== */
const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };
function pruefeBlackout(){
  if(S.pegel<TUNE.blackoutBei||S.modus==='ende') return false;
  S.modus='ende'; S.gewonnen=false;
  S.faenger='BLACKOUT AUF DER TANZFLAECHE.'; SFX.aua();
  return true;
}
function tempoMultiplikator(){
  let m=1;
  if(S.pegel>TUNE.langsamAb) m*=1-(S.pegel-TUNE.langsamAb)/100;
  if(S.confidenceT>0) m*=TUNE.confidenceTempo;
  if(S.geknicktT>0) m*=TUNE.geknicktTempo;
  return Math.max(.25,m);
}
function reichweiteAktuell(){
  let r=TUNE.reichweite;
  if(S.confidenceT>0) r*=TUNE.confidenceReichweite;
  if(S.geknicktT>0) r*=TUNE.geknicktReichweite;
  return r;
}
/* Dreieckswelle - reiner Funktion von t, deshalb auf Tastatur und Touch
   exakt gleich, egal welcher Input den Treffer ausloest. */
function markerPos(t,tempo,breite){
  const cyc=breite*2; let x=(t*tempo)%cyc; if(x<0) x+=cyc;
  return x>breite?cyc-x:x;
}
function aktuellesFenster(){
  if(!S.mini) return TUNE.ansprechFenster;
  if(S.mini.art==='ex') return TUNE.exBreite;
  let f=TUNE.ansprechFenster;
  if(ladeCrew().includes('MORITZ')) f+=TUNE.ansprechBonus;
  if(S.pegel>=TUNE.mutAb) f+=TUNE.ansprechMutBonus;
  if(S.confidenceT>0) f+=TUNE.confidenceFensterBonus;
  return Math.min(TUNE.minigameBreite-4,f);
}
const aktuellesTempo=()=>S.mini&&S.mini.art==='ex'?TUNE.exTempo:TUNE.ansprechTempo;
function naechsteMitte(){
  const breite=TUNE.minigameBreite, fenster=aktuellesFenster();
  return fenster/2+Math.random()*(breite-fenster);
}
function starteMinigame(art,ziel){
  S.modus='mini';
  S.mini={ art, ziel, runden:0, fehler:0, t0:S.t, mitte:0 };
  S.mini.mitte=naechsteMitte();
  S.vx=0;
  zeigeHinweis(art==='ex'?'E BEIM AUF-EX TREFFEN':'E IM FENSTER TREFFEN',3);
}
function pruefeMinigame(){
  const m=S.mini; if(!m) return;
  const breite=TUNE.minigameBreite, fenster=aktuellesFenster(), tempo=aktuellesTempo();
  const pos=markerPos(S.t-m.t0,tempo,breite);
  const treffer=Math.abs(pos-m.mitte)<=fenster/2;
  if(treffer){
    m.runden++; SFX.hit(); S.blitz=.2;
    const rundenZiel=m.art==='ex'?1:TUNE.ansprechRunden;
    if(m.runden>=rundenZiel){ beendeMinigame(true); return; }
    meldung(pick(['GUT','WEITER SO','PASST']),.9);
    m.mitte=naechsteMitte(); m.t0=S.t;
  } else {
    m.fehler++; SFX.miss();
    const fehlerMax=m.art==='ex'?0:TUNE.ansprechFehlerMax;
    if(m.fehler>fehlerMax){ beendeMinigame(false); return; }
    meldung(pick(['DANEBEN','NOCHMAL']),.9);
    m.mitte=naechsteMitte(); m.t0=S.t;
  }
}
function beendeMinigame(erfolgreich){
  const m=S.mini;
  if(m.art==='ex'){
    if(erfolgreich){ S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.exProSchluck);
      meldung('AUF EX',1.4); SFX.schluck(); }
    else { S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.exMissSchluck);
      meldung('DANEBEN GEKIPPT',1.4); SFX.nichts(); }
    S.mini=null; S.modus='spiel'; pruefeBlackout();
    return;
  }
  /* Ansprechen */
  if(erfolgreich){
    m.ziel.erledigt=true; S.erfolge++;
    S.confidenceT=TUNE.confidenceDauer; S.geknicktT=0;
    meldung('DAS LIEF GUT',1.8); SFX.erledigt();
    zeigeHinweis('CONFIDENCE',2);
  } else {
    S.geknicktT=TUNE.geknicktDauer; S.confidenceT=0;
    meldung('AUA. ABBLITZEN LASSEN',1.8); SFX.aua();
  }
  S.mini=null; S.modus='spiel';
}
/* Stroboskop - reine Funktion von t, siehe TUNE (6). Lange, sanfte
   Verdunklung statt hartem Blitzen im Bildwiederholtakt. */
function stroboskop(){
  const phase=S.t%TUNE.strobeZyklus;
  if(phase<TUNE.strobeDauer){
    return { dunkel:TUNE.strobeMaxDunkel*Math.sin(Math.PI*(phase/TUNE.strobeDauer)), flacker:0 };
  }
  const nach=phase-TUNE.strobeDauer;
  if(nach<TUNE.strobeFlackerDauer){
    return { dunkel:0, flacker:TUNE.strobeFlackerMax*Math.sin(Math.PI*(nach/TUNE.strobeFlackerDauer)) };
  }
  return { dunkel:0, flacker:0 };
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(S.minute>=TUNE.endMinute){ S.modus='ende'; S.gewonnen=false;
    S.faenger='DIE MUSIK HOERT AUF. ZU SPAET.'; SFX.aua(); return; }

  const st=stroboskop(); S.dunkel=st.dunkel; S.flacker=st.flacker;

  if(pruefeBlackout()) return;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  S.confidenceT=Math.max(0,S.confidenceT-dt);
  S.geknicktT=Math.max(0,S.geknicktT-dt);
  if(S.stolpernT>0) S.stolpernT=Math.max(0,S.stolpernT-dt);

  /* --- Minispiel laeuft --- */
  if(S.modus==='mini'){
    while(aktionPuffer.length){ aktionPuffer.shift(); pruefeMinigame(); }
    kamera(dt); return;
  }

  /* --- Anrempeln im Dunkeln --- */
  if(S.dunkel>TUNE.strobeGefahrAb&&S.stolpernT<=0&&S.confidenceT<=0){
    for(const tz of TANZER){ if(Math.abs(tz.x-S.x)<9){
      S.stolpernT=TUNE.stolpernDauer; S.vx=0; S.ruettel=4;
      SFX.stolper(); meldung('ANGERANNT',1.2); break; } }
  }

  /* --- Bewegung --- */
  if(S.stolpernT<=0){
    const richtung=(rechtsAn?1:0)-(linksAn?1:0);
    if(richtung) S.blick=richtung;
    const hoechst=TUNE.gehTempo*tempoMultiplikator();
    if(richtung){
      S.vx+=richtung*TUNE.beschleunigung*dt;
      if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
    } else {
      const brems=TUNE.bremsung*dt;
      S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
    }
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));

  if(Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }

  /* --- Aktion --- */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    let beste=null, bestD=1e9, art=null;
    for(const z of ZIELE){ if(z.erledigt) continue;
      const d=Math.abs(z.x-S.x);
      if(d<reichweiteAktuell()&&d<bestD){ beste=z; bestD=d; art='ansprechen'; } }
    const dBar=Math.abs(BARTHEKE.x-S.x);
    if(dBar<reichweiteAktuell()&&dBar<bestD){ beste=BARTHEKE; bestD=dBar; art='ex'; }
    const dTuer=Math.abs(AUSGANG.x-S.x);
    if(dTuer<reichweiteAktuell()&&dTuer<bestD){ beste=AUSGANG; bestD=dTuer; art='tuer'; }
    if(art==='ansprechen') starteMinigame('ansprechen',beste);
    else if(art==='ex') starteMinigame('ex',beste);
    else if(art==='tuer'){
      if(S.erfolge>=TUNE.erfolgeZumSieg) starteCutscene();
      else { meldung('NOCH NICHT GENUG MUT',1.6); SFX.nichts(); }
    }
  }
  kamera(dt);
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   CUTSCENE / SIEG
   ========================================================================== */
const SZENEN=[
  { d:1.0, txt:'' },
  { d:2.2, txt:'DU HAST GENUG LEUTE KENNENGELERNT' },
  { d:2.2, txt:'DRAUSSEN WARTET SCHON DIE NAECHSTE RUNDE' },
  { d:2.4, txt:'AN DER TUER STEHT SEMIH' },
  { d:2.4, txt:'SEMIH KENNT JEDEN HIER' },
  { d:2.0, txt:'MIT IHM KOMMST DU UEBERALL REIN' },
  { d:2.4, txt:'LEVEL 5 GESCHAFFT' },
];
function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; SFX.sieg(); }
function levelGeschafft(){
  speichereCrew('SEMIH');
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Pegel wird immer geschrieben, auch unveraendert - Level 6 braucht den
     korrekten Startwert. */
  try{ localStorage.setItem(PEGEL_KEY,String(S.pegel)); }catch(e){}
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const wack=S.pegel>TUNE.wackelnAb?(S.pegel-TUNE.wackelnAb)/45*3:0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneClub();
  ctx.restore();

  /* Stroboskop - deckt die Spielwelt ab, nicht das HUD darunter, damit
     Pegel und Uhr immer lesbar bleiben. */
  if(S.dunkel>0){ ctx.fillStyle=`rgba(4,2,10,${S.dunkel.toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  if(S.flacker>0){ ctx.fillStyle=`rgba(255,255,255,${S.flacker.toFixed(3)})`; ctx.fillRect(0,0,W,H); }

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.4).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneClub(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,BODEN-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,BODEN-20);
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,BODEN,o.bis-o.von,H-BODEN);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,BODEN,o.bis-o.von,1);
    ctx.fillStyle='#00000033';
    for(let x=o.von;x<o.bis;x+=14) ctx.fillRect(x,BODEN+5,7,1);
    text(o.name,o.von+6,26,'#ffffff18');
  }

  /* Partylicht - mehrere Farben, gedaempft, nie reines Weiss */
  const lichter=[[220,'#ff3d8b',5.4,0],[330,'#42d9ff',4.1,1.4],[470,'#ffd447',6.2,.6]];
  for(const [lx,col,freq,off] of lichter){
    const puls=(Math.sin(S.t*1+off)*.5+.5);
    ctx.globalAlpha=.08+puls*.09;
    ctx.drawImage(verlauf('licht'+col,180,110,g=>{
      const gr=g.createRadialGradient(90,18,4,90,18,90);
      const rgb=col==='#ff3d8b'?'255,60,180':col==='#42d9ff'?'70,210,255':'255,210,80';
      gr.addColorStop(0,`rgba(${rgb},1)`); gr.addColorStop(1,`rgba(${rgb},0)`);
      g.fillStyle=gr; g.fillRect(0,0,180,110); }),lx-90,20);
  }
  ctx.globalAlpha=1;

  /* DJ-Pult */
  sprite(SPR.dj,90,BODEN-14);

  /* Tanzende Menge */
  for(const tz of TANZER){
    const y=BODEN-5+Math.round(Math.sin(S.t*3+tz.seed)*1);
    sprite(SPR.tanzer,tz.x,y);
  }

  /* Theke */
  outline(SPR.theke,BARTHEKE.x-6,BODEN-4,1,.5); sprite(SPR.theke,BARTHEKE.x-6,BODEN-4);
  text('BAR',BARTHEKE.x-textW('BAR')/2,BODEN-14,P.dim);
  if(Math.abs(BARTHEKE.x-S.x)<reichweiteAktuell()&&S.modus==='spiel'&&Math.floor(S.t*4)%2===0)
    text('E',BARTHEKE.x-3,BODEN-22,P.gold);

  /* Tuer Richtung Afterhour */
  const bereit=S.erfolge>=TUNE.erfolgeZumSieg;
  sprite(SPR.tuer,AUSGANG.x,BODEN-12);
  text('AFTERHOUR',AUSGANG.x+6-textW('AFTERHOUR')/2,BODEN-22,bereit?P.gold:P.dunkel);
  if(Math.abs(AUSGANG.x-S.x)<reichweiteAktuell()&&S.modus==='spiel'&&Math.floor(S.t*4)%2===0)
    text('E',AUSGANG.x+4,BODEN-14,bereit?P.gold:P.dunkel);

  /* Die drei Leute */
  for(const z of ZIELE){
    const rows=SPR[z.spr];
    const y=BODEN-rows.length;
    outline(rows,z.x-3,y,1,.55); sprite(rows,z.x-3,y);
    text(z.name,z.x+3-textW(z.name)/2,y-9,z.erledigt?P.gruen:P.dim);
    if(z.erledigt) text('OK',z.x+3-textW('OK')/2,y-16,P.gruen);
    else if(Math.abs(z.x-S.x)<reichweiteAktuell()&&S.modus==='spiel'&&Math.floor(S.t*4)%2===0)
      text('E',z.x+2,y-16,P.gold);
  }

  /* Spieler */
  let rows;
  if(S.stolpernT>0) rows=SPR.steh;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  const tintSpieler=S.stolpernT>0?'#ff4d4d':(S.confidenceT>0?'#ffd447':null);
  outline(rows,S.x-3,S.y-rows.length,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,S.y-rows.length,1,tintSpieler);
  else sprite(rows,S.x-3,S.y-rows.length,1,tintSpieler);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),BODEN,7,1); ctx.globalAlpha=1;

  ctx.restore();

  /* Vignette, staerker mit steigendem Pegel */
  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-10;
  text(uhr,W-textW(uhr)-6,6,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*TUNE.mutAb/100),by-1,1,6);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Erfolge */
  text('ERFOLGE '+S.erfolge+'/'+TUNE.erfolgeZumSieg,6,6,P.weiss);

  /* Status */
  if(S.confidenceT>0&&Math.floor(S.t*3)%2===0) text('CONFIDENCE',6,22,P.gold);
  if(S.geknicktT>0&&Math.floor(S.t*3)%2===0) text('GEKNICKT',6,22,P.rot);

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0&&S.modus!=='mini'){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Minispiel-Leiste */
  if(S.modus==='mini'){
    const m=S.mini, breite=TUNE.minigameBreite, fenster=aktuellesFenster(), tempo=aktuellesTempo();
    const pos=markerPos(S.t-m.t0,tempo,breite);
    const bx2=Math.round((W-breite)/2), by2=H-24;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(m.art==='ex'?'AUF EX':'ANSPRECHEN',8,H-38,P.neon2);
    const rundenZiel=m.art==='ex'?1:TUNE.ansprechRunden;
    text('RUNDE '+(m.runden+1)+'/'+rundenZiel,W-textW('RUNDE '+(m.runden+1)+'/'+rundenZiel)-6,H-38,P.dim);
    ctx.fillStyle='#2a2440'; ctx.fillRect(bx2,by2,breite,6);
    ctx.fillStyle=P.gruen; ctx.fillRect(Math.round(bx2+m.mitte-fenster/2),by2,Math.round(fenster),6);
    ctx.fillStyle=P.weiss; ctx.fillRect(Math.round(bx2+pos)-1,by2-2,2,10);
    if(Math.floor(S.t*2)%2===0) text('E TREFFEN',W-textW('E TREFFEN')-6,H-12,P.gold);
  }
}

                   :[['A D','LAUFEN'],['E','ANSPRECHEN, TRINKEN, TUER']];

  ctx.globalAlpha=1;
  sprite(SPR.dj,m-70,130-14);
  sprite(SPR.tanzer,m-6,130-5);
  sprite(SPR.tanzer,m+16,130-5);
  sprite(SPR.steh,m+40,130-13);
  ctx.drawImage(verlauf('introvig5',W,H,g=>{
    const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E WEITER',W-textW('E WEITER')-6,H-10,P.dunkel);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 5 GESCHAFFT',34,P.gold,2);
      textC('DU BIST DRAUSSEN RICHTUNG AFTERHOUR.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('ERFOLGE  '+S.erfolge+'/'+TUNE.erfolgeZumSieg,96,P.dim);
      textC('PEGEL  '+Math.round(S.pegel),106,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),120,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 6':'E  WEITER ZU LEVEL 6',134,P.gruen,1);
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}
