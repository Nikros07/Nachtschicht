   Drinnen jetzt. Zwei Dinge tragen dieses Level: das Stroboskop, das die
   Sicht regelmaessig fast auf null bringt (aber bewusst kein hartes
   Weiss-Blitzen - siehe TUNE (6)), und das Ansprechen-Minispiel: ein
   Marker faehrt ueber eine Leiste, E im gruenen Fenster treffen, ein paar
   Runden davon gewinnen. Erfolg gibt kurz Confidence (schneller, groesserer
   Radius, das naechste Fenster leichter). Misserfolg macht kurz geknickt
   (langsamer, kleinerer Radius), bis man sich faengt.

   Kein Sprung in diesem Level - die Tanzflaeche ist eben, das spart eine
   ganze Klasse Bugs (Coyote-Zeit, Sprungpuffer) die hier niemand braucht.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */

  /* (1) BEWEGUNG - flache Tanzflaeche, kein Sprung noetig */

  neustartPegelMax: 60,  // Neustart nie mit mehr Pegel - sonst endet jeder Neustart sofort im Blackout

  /* (4) DIE UHR */

  /* (5) REICHWEITE */
  reichweite:      15,

  /* (6) STROBOSKOP - bewusst KEIN echtes Blitzen im Bildwiederholtakt.
     Ein Zyklus dauert mehrere Sekunden: lange Verdunklung, kurzes
     helles Nachglimmen. Kein reines Weiss auf vollem Bildschirm. */

/* Musik: der Song "club" aus nacht/songs.js, gespielt von nacht/musik.js (MUSIK).
   Spannung = Pegel, Abschnitt "dj" beim DJ-Ereignis, "drop" solange man auf der
   Tanzflaeche steht. Gedaempft bei Pause, offenem Handy und Kapitelkarte. */
function musik(){
  if(typeof MUSIK==='undefined'||typeof S==='undefined') return;
  try{
    const an=S.modus==='pause'||!!(window.HANDY&&window.HANDY.offen)||!!(typeof kapitelAktiv==='function'&&kapitelAktiv());
    if(an!==musikMerk.an){ musikMerk.an=an; MUSIK.daempfen(an); }
    MUSIK.spiele('club');
    MUSIK.spannung(S.pegel/100);
    const ab=S.ef.dj.rest>0?'dj':(S.modus!=='titel'&&S.modus!=='intro'&&ortBei(S.x).strobe?'drop':null);
    if(ab!==musikMerk.abschnitt){ musikMerk.abschnitt=ab; MUSIK.abschnitt(ab); }
  }catch(e){}
}
const musikMerk={ an:null, abschnitt:'#' };
function musikDo(f){ if(typeof MUSIK!=='undefined'){ try{ f(MUSIK); }catch(e){} } }
function saftDo(f){ if(typeof SAFT!=='undefined'){ try{ f(SAFT); }catch(e){} } }
/* Wackeln laeuft jetzt ueber SAFT (Trauma), nicht mehr ueber S.ruettel. */
function wackel(n){ saftDo(s=>s.trauma(Math.min(1,n/12))); }
function bildPos(){ return { x:Math.round(S.x-S.kamX), y:Math.round(bodenY(S.tiefe)-SPR.steh.length) }; }

function tempoMultiplikator(){
  let m=1;
  if(S.pegel>TUNE.langsamAb) m*=1-(S.pegel-TUNE.langsamAb)/100;
  if(S.confidenceT>0) m*=TUNE.confidenceTempo;
  if(S.geknicktT>0) m*=TUNE.geknicktTempo;
  return Math.max(.25,m);
}
function reichweiteAktuell(){
  let r=TUNE.reichweite;

}
/* Dreieckswelle - reiner Funktion von t, deshalb auf Tastatur und Touch
   exakt gleich, egal welcher Input den Treffer ausloest. */
function markerPos(t,tempo,breite){
  const cyc=breite*2; let x=(t*tempo)%cyc; if(x<0) x+=cyc;
  return x>breite?cyc-x:x;
}
function aktuellesFenster(){
  if(!S.mini) return TUNE.ansprechFenster;
  if(S.mini.art==='ex') return TUNE.exBreite;
  let f=TUNE.ansprechFenster;
  if(ladeCrew().includes('MORITZ')) f+=TUNE.ansprechBonus;
  if(S.pegel>=TUNE.mutAb) f+=TUNE.ansprechMutBonus;
  if(S.confidenceT>0) f+=TUNE.confidenceFensterBonus;
  return Math.min(TUNE.minigameBreite-4,f);
}
const aktuellesTempo=()=>S.mini&&S.mini.art==='ex'?TUNE.exTempo:TUNE.ansprechTempo;
function naechsteMitte(){
  const breite=TUNE.minigameBreite, fenster=aktuellesFenster();
  return fenster/2+Math.random()*(breite-fenster);
}
function starteMinigame(art,ziel){
  S.modus='mini';
  S.mini={ art, ziel, runden:0, fehler:0, t0:S.t, mitte:0 };
  S.mini.mitte=naechsteMitte();
  S.vx=0;
  if(!hilfeTipp('leiste','E, WENN DER STRICH IM GRUENEN IST','JETZT, WENN DER STRICH IM GRUENEN IST')) zeigeHinweis(tasteText('E IM GRUENEN TREFFEN','IM GRUENEN TREFFEN'),2.5);
}
function pruefeMinigame(){
  const m=S.mini; if(!m) return;
  const breite=TUNE.minigameBreite, fenster=aktuellesFenster(), tempo=aktuellesTempo();
  const pos=markerPos(S.t-m.t0,tempo,breite);
  const treffer=Math.abs(pos-m.mitte)<=fenster/2;
  if(treffer){
    m.runden++; SFX.hit(); blitze(.2);
    const rundenZiel=m.art==='ex'?1:TUNE.ansprechRunden;
    if(m.runden>=rundenZiel){ beendeMinigame(true); return; }
    meldung(pick(['GUT','WEITER SO','PASST']),.9);
    m.mitte=naechsteMitte(); m.t0=S.t;
  } else {
    m.fehler++; SFX.miss();
    const fehlerMax=m.art==='ex'?0:TUNE.ansprechFehlerMax;
    if(m.fehler>fehlerMax){ beendeMinigame(false); return; }
    meldung(pick(['DANEBEN','NOCHMAL']),.9);
    m.mitte=naechsteMitte(); m.t0=S.t;
  }
}
function beendeMinigame(erfolgreich){
  const m=S.mini;
  if(m.art==='ex'){
    if(erfolgreich){ S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.exProSchluck);
      meldung('AUF EX',1.4); SFX.schluck(); }
    else { S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.exMissSchluck);
      meldung('DANEBEN GEKIPPT',1.4); SFX.nichts(); }
    S.mini=null; S.modus='spiel'; pruefeBlackout();
    return;
  }
  /* Tanzen - danach geht das Gespraech weiter, je nachdem wie es lief. */
  const z=m.ziel;
  S.mini=null; S.modus='spiel';
  if(erfolgreich){ SFX.erledigt(); S.confidenceT=TUNE.confidenceDauer; }
  else SFX.aua();
  speicherePegel(S.pegel);
  starteGespraech(BAUM_FUER[z.id], erfolgreich?'tanzGut':'tanzSchlecht', e=>gespraechEnde(z,e));
  return;
  S.mini=null; S.modus='spiel';
}
/* Stroboskop - reine Funktion von t, siehe TUNE (6). Lange, sanfte
   Verdunklung statt hartem Blitzen im Bildwiederholtakt. */
function stroboskop(){
  const phase=S.t%TUNE.strobeZyklus;
  if(phase<TUNE.strobeDauer){
    return { dunkel:TUNE.strobeMaxDunkel*Math.sin(Math.PI*(phase/TUNE.strobeDauer)), flacker:0 };
  }
  const nach=phase-TUNE.strobeDauer;
  if(nach<TUNE.strobeFlackerDauer){
    return { dunkel:0, flacker:TUNE.strobeFlackerMax*Math.sin(Math.PI*(nach/TUNE.strobeFlackerDauer)) };
  }
  return { dunkel:0, flacker:0 };
}


/* ==========================================================================
   WAS IN REICHWEITE IST
   Eine Stelle, die alle fragen: die Aktion, die Knopf-Aufschrift am Handy
   und das blinkende E. Sonst steht auf dem Knopf etwas anderes, als er tut.
   ========================================================================== */
function naechstesZiel(){
  const r=reichweiteAktuell();
  let bestes=null, d0=1e9;
  const pruefe=(obj,art,tiefeOk)=>{
    if(!tiefeOk) return;
    const d=Math.abs(obj.x-S.x);
    if(d<r&&d<d0){ bestes={art,obj}; d0=d; }
  };
  for(const z of ZIELE){
    if(z.stand!=='offen') continue;
    pruefe(z,'reden',tiefeNah(z.t,S.tiefe,TUNE.redeTiefe));
  }
  pruefe(BARTHEKE,'bar',!tiefeAn()||S.tiefe<=TUNE.barTiefe);
  pruefe(WASCHBECKEN,'wasser',!tiefeAn()||S.tiefe<=TUNE.barTiefe);
  pruefe(GARDEROBE,'garderobe',!S.garderobeFertig);
  pruefe(FOTO5,'foto',!MOMENT.hat(5));
  pruefe(RAUCHER1,'raucher',true);
  pruefe(RAUCHER2,'raucher',true);
  pruefe(LIEFERANT,'raucher',true);
  /* Der Ausgang zaehlt erst, wenn im Club etwas passiert ist - sonst
     verlaesst man ihn mit null Interaktionen, kaum dass man drin ist. */
  pruefe(AUSGANG,'tuer',S.warAktiv);
  /* Auf der Tanzflaeche ist E ohne anderes Ziel das Tanzen (TUNE 17). */
  if(!bestes&&ortBei(S.x).strobe) bestes={art:'tanzen',obj:TANZPUNKT};
  return bestes;
}

/* ==========================================================================
   GESPRAECHE UND IHRE FOLGEN
   Die Baeume setzen Zuneigung und Flags. Was danach im Club passiert,
   steht hier an einer Stelle.
   ========================================================================== */
function redeMit(z){
  /* Der Pegel lebt in diesem Level in S.pegel, die Bedingungen der Baeume
     lesen ihn aus dem Speicher. Vorher abgleichen, sonst gilt der Wert vom
     Levelstart - und "betrunken" waere nie freigeschaltet. */
  speicherePegel(S.pegel);
  S.vx=0; S.vt=0;
  /* Eine Abfuhr bleibt nicht unter vier Augen (siehe TUNE (15)) - die naechste,
     die man anspricht, hat schon davon gehoert. Nur einmal pro Figur, sonst
     wiederholt sich die Zeile bei jedem erneuten Ansprechen. */
  const abfuhrGehoert = !z._abfuhrGesagt && ZIELE.some(o=>o!==z&&o.stand==='nein');
  if(abfuhrGehoert) z._abfuhrGesagt=true;
  starteGespraech(BAUM_FUER[z.id], abfuhrGehoert?'startAbfuhr':'start', e=>gespraechEnde(z,e));
}
function gespraechEnde(z,e){
  S.pegel=ladePegel();        // Shots aus dem Gespraech zaehlen
  const m=S.marvin;
  if(e==='@tanz'){ starteMinigame('tanz',z); return; }
  if(e==='@ja'){
    if(m.ziel===z) m.wut=true;
    starteEcke(z); return;
  }
  if(e==='@nummer'){
    z.stand='nummer'; S.erfolge++;
    wirke({ruf:4, flag:'schreibt_'+z.id});
    if(m.ziel===z) m.wut=true;
    S.confidenceT=TUNE.confidenceDauer;
    if(z.id==='kira') S.kiraTschuessT=2.4;
    meldung('NUMMER VON '+z.name,2); SFX.erledigt();
    { const p=bildPos(); saftDo(s=>s.fund(p.x,p.y,'NUMMER!')); }
    return;
  }
  if(e==='@nett'){
    z.stand='nett'; wirke({ruf:2});
    meldung('FREUNDLICH AUSEINANDER',1.6); return;
  }
  if(e==='@nein'){
    /* Eine Abfuhr bleibt nicht unter vier Augen. Der Ruf sinkt - und mit
       ihm die Antworten, die bei den anderen noch gehen. */
    z.stand='nein'; S.abfuhren++;
    wirke({ruf:TUNE.abfuhrRuf, mut:-4});
    S.geknicktT=TUNE.geknicktDauer; S.confidenceT=0;
    meldung(S.abfuhren>1?'DAS SPRICHT SICH RUM':'AUA. ABFUHR',1.8); SFX.aua();
    saftDo(s=>s.schaden(0.3));
    return;
  }
  /* Neutral beendet: man darf nochmal hin. */
}

/* ==========================================================================
   DIE ECKE
   Erzaehlt statt gezeigt. Das Bild wird dunkel, die Zeilen kommen einzeln,
   man tippt weiter. Danach ist der Abend ein anderer.
   ========================================================================== */
function starteEcke(z){
  S.modus='ecke'; S.ecke={ z, i:0, t:0 }; S.vx=0;
}
function eckeWeiter(){
  const e=S.ecke; if(!e) return;
  if(e.t<0.35) return;              // kein versehentliches Durchtippen
  e.i++; e.t=0;
  if(e.i>=ECKE[e.z.id].length) eckeVorbei();
}
function eckeTakt(dt){
  const e=S.ecke; if(!e) return;
  e.t+=dt;
  if(e.t>3.4) eckeWeiter();
  aktionPuffer.length=0;
}
function eckeVorbei(){
  const z=S.ecke.z;
  S.ecke=null; S.modus='spiel';
  z.stand='ja'; S.erfolge++;
  wirke({ruf:8, mut:6, flag:'clubJa_'+z.id, mag:[z.name,15]});
  setzeFlag('schreibt_'+z.id);
  /* Kira faehrt mit dem Taxi - danach ist sie weg. */
  if(z.id==='kira'){ z.weg=true; S.kiraTschuessT=1.2; }
  S.confidenceT=TUNE.confidenceDauer; S.geknicktT=0;
  meldung('DER ABEND IST EIN ANDERER',2.4); SFX.sieg();
  { const p=bildPos(); saftDo(s=>s.fund(p.x,p.y,'ZUSAMMEN RAUS')); }
  /* Marvin hat es gesehen. Erfolg zieht den Rivalen an - so bricht die
     Schlaegerei aus, die im Plan steht, und zwar als Folge von etwas, das
     man selbst getan hat. */
  const m=S.marvin;
  if(m.da&&!m.fertig){ m.wut=true; m.ziel=null; zeigeHinweis('MARVIN HAT DAS GESEHEN',2.6); }
}

/* ==========================================================================
   MARVIN
   Geht dieselben Leute an wie du. Steht er lange genug ungestoert bei
   jemandem, mit dem du noch nicht geredet hast, ist sie fuer heute weg.
   Er zoegert, solange du daneben stehst - Konkurrenz sieht man.
   Nimmst du ihm eine weg, auf die er zuging, wird er sauer und stellt dich.
   ========================================================================== */
function marvinTakt(dt){
  const m=S.marvin;
  if(m.fertig) return;
  if(!m.da){
    /* Wer ihn vor der Tuer angepampt hat (Umweg auf der Karte), den sucht
       er frueher. */
    if(S.zeit<TUNE.marvinKommtNach*schwer().frist*(flag('marvinGereizt')?0.4:1)) return;
    m.da=true; m.x=30; m.t=0.5; setzeFlag('marvinKennt');
    meldung('MARVIN IST DA',1.8);
    /* Die Trikot-Szene laeuft ohne Stroboskop: Dauerlicht, kein Blitz. */
    if(!S.trikotGesehen&&S.modus==='spiel'){
      S.trikotGesehen=true; S.vx=0; S.vt=0; S.dunkel=0; S.flacker=0; S.blitz=0;
      starteGespraech(TRIKOT,'start',()=>{
        if(flag('marvinNachgerufen')) meldung('MARVIN HAT SICH UMGEDREHT.',2.4);
      });
      return;
    }
  }
  /* Wut: er kommt direkt auf dich zu. */
  if(m.wut){
    const dx=S.x-m.x;
    m.blick=Math.sign(dx)||1;
    m.x+=m.blick*TUNE.marvinTempo*1.8*dt;
    m.t+=(S.tiefe-m.t)*Math.min(1,2*dt);
    if(Math.abs(dx)<TUNE.marvinStellt&&S.modus==='spiel') marvinStellt();
    return;
  }
  if(m.pause>0){ m.pause-=dt; return; }
  if(!m.ziel||m.ziel.stand!=='offen'){
    const frei=ZIELE.filter(z=>z.stand==='offen'&&Math.abs(z.x-S.x)>40);
    frei.sort((a,b)=>Math.abs(a.x-m.x)-Math.abs(b.x-m.x));
    m.ziel=frei[0]||null; m.beiT=0;
    if(m.ziel) hilfeTipp('marvin','MARVIN WILL ZU IHR - STELL DICH DAZU','MARVIN WILL ZU IHR - STELL DICH DAZU');
  }
  if(!m.ziel) return;
  const zx=m.ziel.x+11, dx=zx-m.x;
  if(Math.abs(dx)>3){
    m.blick=Math.sign(dx); m.x+=m.blick*TUNE.marvinTempo*dt;
    m.t+=(m.ziel.t+0.06-m.t)*Math.min(1,2*dt);
    return;
  }
  m.blick=-1;
  if(Math.abs(S.x-m.ziel.x)<34){ m.beiT=Math.max(0,m.beiT-dt); return; }
  m.beiT+=dt;
  if(m.beiT>=(TUNE.marvinNimmt*schwer().frist)){
    m.ziel.stand='weg'; m.hat.push(m.ziel.id);
    meldung(m.ziel.name+' IST JETZT MIT MARVIN UNTERWEGS',2.4); SFX.aua();
    m.ziel=null; m.pause=TUNE.marvinPause;
  }
}
/* Zieht einen Satz, ohne einen schon gezogenen zu wiederholen, bis alle dran
   waren - dann neu mischen (ohne direkten Wiederholer an der Nahtstelle). */
function ambientZieheSatz(){
  if(!S.ambientKiste.length){
    S.ambientKiste=[...TUNE.CLUB_EREIGNISSE];
    for(let i=S.ambientKiste.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [S.ambientKiste[i],S.ambientKiste[j]]=[S.ambientKiste[j],S.ambientKiste[i]];
    }
    if(S.ambientKiste.length>1&&S.ambientKiste[S.ambientKiste.length-1]===S.ambientLetzter){
      [S.ambientKiste[0],S.ambientKiste[S.ambientKiste.length-1]]=
        [S.ambientKiste[S.ambientKiste.length-1],S.ambientKiste[0]];
    }
  }
  return S.ambientKiste.pop();
}
function ambientTakt(dt){
  S.ambientT-=dt;
  if(S.ambientT<=0){
    S.ambientLetzter=ambientZieheSatz();
    meldung(S.ambientLetzter,2.0);
    ereignisWirkung(S.ambientLetzter);
    if(S.ambientLetzter.indexOf('GLAS')>=0){
      const p=bildPos(); saftDo(s=>s.teilchen('glas',p.x,p.y-6,10));
    }
    S.ambientT+=TUNE.ambientAlle;
  }
}
/* Ein Club-Ereignis wirkt: LICHT AUS, NEBEL, DJ oder SHOT (TUNE 18). Die Zeit
   laeuft in wirkungTakt() ab; Lichtstaerke in efStaerke(). */
function ereignisWirkung(text){
  const art=TUNE.ereignisArt[text];
  if(!art||!S.ef[art]) return;
  const e=S.ef[art];
  if(e.rest<=0) e.alt=0;                 // neu einblenden, nicht schlagartig
  const dauer={ licht:TUNE.lichtAusDauer, nebel:TUNE.nebelDauer, dj:TUNE.djDauer, shot:TUNE.shotDauer }[art];
  e.rest=Math.max(e.rest,dauer);
}
function wirkungTakt(dt){
  for(const k of ['licht','nebel','dj','shot']){
    const e=S.ef[k];
    if(e.rest>0){ e.rest=Math.max(0,e.rest-dt); e.alt+=dt; }
  }
  if(S.tanzPoseT>0) S.tanzPoseT=Math.max(0,S.tanzPoseT-dt);
  if(S.shotPauseT>0) S.shotPauseT=Math.max(0,S.shotPauseT-dt);
}
/* 0..1: wie stark das Ereignis gerade wirkt. Weich ein- und ausgeblendet. */
function efStaerke(k){
  const e=S.ef[k];
  if(!e||e.rest<=0) return 0;
  return Math.min(1,e.alt/TUNE.ereignisEin,e.rest/TUNE.ereignisAus);
}
function marvinStellt(){
  const m=S.marvin; m.wut=false;
  S.vx=0; S.vt=0; S.warAktiv=true;
  saftDo(s=>s.schaden(0.6));
  starteGespraech(MARVIN_BAUM,'start',e=>{
    if(e==='@kampf') starteAuftakt();
    else { m.fertig=true; meldung(flag('marvinRueckzug')?'ER ZIEHT AB':'ER LACHT DICH AUS',1.8); }
  });
}

/* ==========================================================================
   DIE KLEINE SCHLAEGEREI
   Der Vorgeschmack aufs Finale. Im Stroboskop sieht man das Ausholen oft
   nicht - Blocken und Ausweichen in die Tiefe werden wichtiger als Kontern.
   Gewinnen ist nicht noetig: danach fliegen beide raus.
   ========================================================================== */
/* Zwei Karten vor dem Kampf (Anlauf 3 und Marvins Startschuss). */
function starteAuftakt(){
  S.auftakt=true; S.dunkel=0; S.flacker=0;
  S.szenen=[{ d:2.2, txt:'MORITZ: DU, ICH MUSS DIR WAS...' },{ d:1.6, txt:'MARVIN: JETZT.' }];
  S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0;
}
function starteKloppe(){
  /* Im Stroboskop ist Ausweichen in die Tiefe die halbe Miete - hier geht
     sie an, sonst ist der Club flach. */
  setzeTiefe(true); S.tiefe=0.5;
  S.modus='kloppe'; S.kloppeStand='kampf';
  S.ich=kaempfer({ x:S.x, t:S.tiefe, blick:1, hp:TUNE.kloppeLeben, maxHp:TUNE.kloppeLeben });
  const mv=gegner('schlaeger', S.x+26, S.tiefe);
  mv.hp=mv.maxHp=TUNE.marvinHp; mv.marvin=true;
  S.gegner=[ mv ]; S.flitzerT=TUNE.flitzerVerzug; S.flitzerTiefe=Math.min(1,S.tiefe+0.25);
  S.marvin.fertig=true;
  if(!hilfeTipp('kampf-tasten','GOLD: E KONTERT. SHIFT BLOCKT. LEER ROLLT','GOLD: SCHLAG KONTERT. BLOCK UND AUSWEICHEN',6)) zeigeHinweis(tasteText('E SCHLAEGT - SHIFT BLOCKT - LEER ROLLT','SCHLAG - BLOCK - ROLLE: KNOEPFE RECHTS'),4);
  SFX.aua();
}
function kloppeVorbei(gewonnen){
  setzeTiefe(false);
  S.kloppeStand=gewonnen?'gewonnen':'verloren';
  wirke(gewonnen?{mut:8,ruf:6,flag:'clubKloppeGewonnen'}:{ruf:-4,flag:'clubKloppeVerloren'});
  S.ich=null; S.gegner=[];
  starteCutscene('rausschmiss');
}
function kloppe(dt){
  kampfStopTakt(dt);
  const z=kampfZeitFaktor(); if(z===0) return;
  if(S.flitzerT>0){ S.flitzerT-=dt; if(S.flitzerT<=0) S.gegner.push(gegner('flitzer', S.ich.x-30, S.flitzerTiefe)); }
  const d=dt*z, ich=S.ich;
  kaempferTakt(ich,d);
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  const rt=(runterAn?1:0)-(hochAn?1:0);
  if(ich.zustand==='frei'||ich.zustand==='block'){
    if(richtung){ ich.x+=richtung*TUNE.gehTempo*0.62*d; ich.blick=richtung; }
    if(rt) kampfTiefe(ich,rt,d);
  }
  ich.x=Math.max(14,Math.min(LEVEL_B-14,ich.x));
  S.x=ich.x; S.tiefe=ich.t;
  if(S.rolleGedrueckt){ S.rolleGedrueckt=false; rolle(ich, rt||(ich.t<0.5?1:-1)); }
  blocke(ich, !!S.blockAn && aktionPuffer.length===0);
  while(aktionPuffer.length){
    aktionPuffer.shift();
    rasteAufGegner(ich,S.gegner,TUNE.kloppeReich);
    let gekontert=false;
    for(const g of S.gegner){ if(g.hp<=0) continue;
      if(konterVersuch(ich,g,{reichweite:TUNE.kloppeReich})){ gekontert=true; SFX.hit(); break; } }
    if(!gekontert) schlage(ich);
  }
  if(ich.zustand==='schlag'){
    for(const g of S.gegner){ if(g.hp<=0) continue;
      const was=spielerTrifft(ich,g,{reichweite:TUNE.kloppeReich,schaden:1});
      if(was==='treffer'||was==='konter'||was==='gardebruch'){ SFX.hit();
        saftDo(s=>s.treffer(g.x-S.kamX,bodenY(g.t)-SPR.steh.length,S.blick,0.5)); break; } }
  }
  for(const g of S.gegner){ if(g.hp<=0) continue;
    gegnerTakt(g,d,ich);
    if(g.zustand==='schlag'){
      const was=loeseTreffer(g,ich,{reichweite:g.reichweite,schaden:1});
      if(was==='treffer'){ wackel(7); blitze(.3); SFX.aua(); saftDo(s=>s.schaden(0.7)); }
    }
  }
  if(S.gegner.every(g=>g.hp<=0)) kloppeVorbei(true);
  else if(ich.hp<=0) kloppeVorbei(false);
  kamera(dt);
}

/* ==========================================================================
   TANZEN IM TAKT (TUNE 17)
   Auf der Tanzflaeche E auf den Schlag. Gewertet wird der Abstand zum
   naechsten Viertel aus MUSIK.schlag(). Ohne Ton (null) laeuft eine eigene
   Uhr mit TUNE.tanzBpm, und unten mittig pulst ein Taktpunkt - damit es auch
   ohne Musik geht.
   ========================================================================== */
function tanzSchlag(){
  let s=null;
  try{ if(typeof MUSIK!=='undefined') s=MUSIK.schlag(); }catch(e){ s=null; }
  if(s&&isFinite(s.bisSchlag)&&isFinite(s.seitSchlag)) return { bis:s.bisSchlag, seit:s.seitSchlag, echt:true, idx:(s.takt|0)*4+((s.schritt|0)>>2) };
  const per=60/TUNE.tanzBpm, ph=((S.t%per)+per)%per;
  return { bis:per-ph, seit:ph, echt:false, idx:Math.floor(S.t/per) };
}
function tanzSchritt(){
  const s=tanzSchlag(), abst=Math.min(s.seit,s.bis), p=bildPos();
  if(abst<=TUNE.tanzFenster){
    S.tanzCombo++; S.tanzBeste=Math.max(S.tanzBeste,S.tanzCombo);
    S.tanzPoseT=TUNE.tanzPose; S.tanzSeite=-S.tanzSeite;
    SFX.hit();
    saftDo(f=>f.treffer(p.x,p.y,S.tanzSeite,Math.min(1,TUNE.tanzHitBasis+TUNE.tanzHitJe*S.tanzCombo)));
    saftDo(f=>f.popup(String(S.tanzCombo),p.x,p.y-12,P.gold));
    if(S.tanzCombo%TUNE.tanzRufAlle===0){
      wirke({ruf:TUNE.tanzRuf});
      S.confidenceT=TUNE.confidenceDauer;
      meldung('ON FIRE! RUF +'+TUNE.tanzRuf,1.6);
      saftDo(f=>f.erfolg(p.x,p.y-22,'ON FIRE!'));
      if(typeof ERFOLG!=='undefined') ERFOLG.gib('l5_tanz');
    }
  } else {
    S.tanzCombo=0;
    SFX.nichts();
    saftDo(f=>f.popup('AUS DEM TAKT',p.x,p.y-12,P.dim));
  }
}
/* Theke gratis (Ereignis SHOT): kein Auf-Ex-Spiel, jeder Druck ein Schluck.
   true = das Level ist durch (Blackout). */
function gratisShot(){
  if(S.shotPauseT>0){ meldung('GLEICH WIEDER',0.9); SFX.nichts(); return false; }
  S.pegel=Math.min(TUNE.pegelMax,S.pegel+TUNE.shotSchluck);
  S.shotPauseT=TUNE.shotPause;
  meldung('GRATIS SHOT!',1.4); SFX.schluck();
  const p=bildPos();
  saftDo(f=>{ f.teilchen('glas',p.x,p.y,8); f.erfolg(p.x,p.y-14,'PROST'); });
  return pruefeBlackout();
}

/* ==========================================================================
   RANG (TUNE.rang): Flirt 35, Tanz-Combo 25, Ruf 20, Zeit 20.
   ========================================================================== */
function rangPkt(w,schlecht,sehrGut,max){
  const f=(w-schlecht)/(sehrGut-schlecht);
  return Math.round(max*Math.max(0,Math.min(1,f)));
}
function rangAbschluss(){
  if(typeof WERTUNG==='undefined') return;
  const R=TUNE.rang;
  const flirtWert=ZIELE.reduce((s,z)=>s+(z.stand==='ja'?1:z.stand==='nummer'?0.85:z.stand==='nett'?0.35:0),0);
  const gut=ZIELE.filter(z=>z.stand==='ja'||z.stand==='nummer').length;
  const ruf=wert('ruf');
  const flirt=rangPkt(flirtWert,R.flirtSchlecht,R.flirtSehrGut,35);
  const tanz=rangPkt(S.tanzBeste,R.tanzSchlecht,R.tanzSehrGut,25);
  const rufP=rangPkt(ruf,R.rufSchlecht,R.rufSehrGut,20);
  const zeit=rangPkt(S.zeit,R.zeitSchlecht,R.zeitSehrGut,20);
  const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
  const zeilen=[
    { name:'FLIRT', wert:gut+'/3', pkt:flirt },
    { name:'TANZ',  wert:'X'+S.tanzBeste, pkt:tanz },
    { name:'RUF',   wert:String(Math.round(ruf)), pkt:rufP },
    { name:'ZEIT',  wert:min+':'+String(sek).padStart(2,'0'), pkt:zeit },
  ];
  WERTUNG.abschluss(5, Math.min(100,flirt+tanz+rufP+zeit), zeilen);
}

/* ==========================================================================
   ZEICHNEN DER NEUEN ELEMENTE (Bildschirmkoordinaten)
   ========================================================================== */
/* NEBEL: dunkler Schleier ueber allem, nur um den Spieler bleibt ein Kreis frei. */
function zeichneNebel(){
  const a=efStaerke('nebel'); if(a<=0) return;
  const cx=Math.round(S.x-S.kamX), cy=Math.round(bodenY(S.tiefe)-10), r=TUNE.nebelRadius;
  const g=ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,r);
  g.addColorStop(0,'rgba(10,8,18,0)');
  g.addColorStop(1,'rgba(10,8,18,'+(0.93*a).toFixed(3)+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
/* Taktpunkt unten mittig: wird auf dem Schlag groesser und gelb. */
function zeichneTaktpunkt(){
  if(S.modus!=='spiel'||!ortBei(S.x).strobe) return;
  const s=tanzSchlag(), nah=Math.min(s.seit,s.bis);
  const f=Math.max(0,1-nah/0.2);
  const gr=2+Math.round(f*2), x=Math.round(W/2), y=H-40;
  ctx.globalAlpha=0.35+0.65*f;
  ctx.fillStyle=f>0.6?P.gold:P.neon2;
  ctx.fillRect(x-gr,y-gr,gr*2+1,gr*2+1);
  ctx.globalAlpha=1;
}
/* Status: aktive Ereignisse rechts unter der Uhr, die Combo links. */
function hudEreignisse(){
  if(S.tanzCombo>=2&&S.modus==='spiel') text('TANZ X'+S.tanzCombo,6,32,P.gold);
  const liste=[
    ['licht','LICHT AUS'], ['nebel','NEBEL'], ['dj','DJ SET'], ['shot','GRATIS SHOT'],
  ];
  let i=0;
  for(const [k,name] of liste){
    const e=S.ef[k]; if(!e||e.rest<=0) continue;
    const l=name+' '+Math.ceil(e.rest);
    text(l,W-textW(l)-6,14+i*8,P.neon2); i++;
  }
}

/* ==========================================================================
   WAS DIE KNOEPFE AM HANDY GERADE TUN
   ========================================================================== */
function mobilKontext(){
  const k=(typeof erzaehlKontext==='function')?erzaehlKontext():null; if(k) return k;
  if(S.modus==='titel')    return {aktion:'START',  zwei:null};
  if(S.modus==='intro'||S.modus==='cutscene'||S.modus==='ecke') return {aktion:'WEITER', zwei:null};
  if(S.modus==='ende')     return {aktion:S.gewonnen?'WEITER':'NOCHMAL', zwei:null};
  if(S.modus==='pause')    return {aktion:null, zwei:null};
  if(S.modus==='mini')     return {aktion:'JETZT', zwei:null};
  if(S.modus==='kloppe')   return {aktion:'SCHLAG', zwei:'ROLLE', block:true};
  const z=naechstesZiel();
  const txt=!z?null:z.art==='tanzen'?'TANZEN':z.art==='reden'?'REDEN'
    :z.art==='bar'?(S.ef.shot.rest>0?'GRATIS':'AUF EX'):z.art==='wasser'?'WASSER'
    :z.art==='garderobe'?'JACKE':z.art==='foto'?'FOTO':z.art==='raucher'?'REDEN':'RAUS';
  return {aktion:txt, zwei:null};
}

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  if(erzaehlTakt(dt)) return;
  S.t+=dt;
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  S.blitzSperre=Math.max(0,(S.blitzSperre||0)-dt);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  /* Waehrend eines Gespraechs steht der Club - auch die Uhr und Marvin. */
  if(gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }
  if(S.modus==='ecke'){ eckeTakt(dt); return; }

  S.zeit+=dt;
  wirkungTakt(dt);
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(S.modus==='spiel'){
    if(S.warAktiv&&!S.zielRaus){ S.zielRaus=true; HILFE.ziel('HINTEN RECHTS RAUS ZUR AFTERHOUR'); }
    if(S.pegel>=50) hilfeTipp('zu-voll','ZU BETRUNKEN? WASSER AN DEN KLOS','ZU BETRUNKEN? WASSER AN DEN KLOS');
    if(wert('ruf')<40) hilfeTipp('ruf-40','RUF UNTER 40: BESTE ANTWORTEN WEG','RUF UNTER 40: BESTE ANTWORTEN WEG');
    if(S.confidenceT>0) hilfeTipp('confidence','CONFIDENCE: SCHNELLER, KEIN ANREMPELN','CONFIDENCE: SCHNELLER, KEIN ANREMPELN');
    { const nz=naechstesZiel(); if(nz&&nz.art==='bar') hilfeTipp('bar-pegel','ETWAS PEGEL MACHT MUTIG. ZU VIEL NICHT','ETWAS PEGEL MACHT MUTIG. ZU VIEL NICHT'); }
  }
  /* Um eins geht das Licht an. Keine Niederlage mehr - die Nacht geht
     weiter, nur mit dem, was man bis dahin geschafft hat. */
  if(S.minute>=TUNE.endMinute&&S.modus==='spiel'){ starteCutscene('licht'); return; }

  /* Stroboskop nur auf der Tanzflaeche */
  if(ortBei(S.x).strobe){ const st=stroboskop(); S.dunkel=st.dunkel; S.flacker=st.flacker; }
  else { S.dunkel=Math.max(0,S.dunkel-dt*3); S.flacker=0; }
  /* LICHT AUS legt sich ueber alles, auch ueber das Stroboskop (weich, TUNE 18). */
  S.dunkel=Math.max(S.dunkel,TUNE.lichtAusDunkel*efStaerke('licht'));

  if(!S.tanzHinweis&&ortBei(S.x).strobe){
    S.tanzHinweis=true;
    hilfeTipp('tanzen','AUF DEN BEAT E: TANZEN BRINGT RUF','AUF DEN BEAT TIPPEN: TANZEN BRINGT RUF');
  }

  if(pruefeBlackout()) return;
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);
  S.confidenceT=Math.max(0,S.confidenceT-dt);
  S.geknicktT=Math.max(0,S.geknicktT-dt);
  if(S.stolpernT>0){
    S.stolpernT=Math.max(0,S.stolpernT-dt);
    /* Wieder auf den Beinen: kleine Staubwolke, nicht nur ein Standbild. */
    if(S.stolpernT<=0){ const p=bildPos(); saftDo(s=>s.landung(p.x,p.y,0.4)); }
  }
  if(S.wasserT>0) S.wasserT-=dt;

  if(S.modus==='kloppe'){ kloppe(dt); return; }
  if(S.modus==='mini'){
    while(aktionPuffer.length){ aktionPuffer.shift(); pruefeMinigame(); }
    kamera(dt); return;
  }

  /* Anrempeln im Dunkeln - jetzt in der Flaeche: man kann auch hinter der
     Menge vorbei. */
  if(S.dunkel>TUNE.strobeGefahrAb&&S.stolpernT<=0&&S.confidenceT<=0){
    for(const tz of TANZER){
      if(Math.abs(tz.x-S.x)<TUNE.rempelRadius&&tiefeNah(tz.t,S.tiefe,0.14)){
        S.stolpernT=TUNE.stolpernDauer; S.vx=0; S.vt=0; wackel(4);
        SFX.stolper(); meldung('ANGERANNT',1.2);
        hilfeTipp('rempeln','IM DUNKELN STEHEN BLEIBEN','IM DUNKELN STEHEN BLEIBEN');
        saftDo(s=>s.schaden(0.4));
        break; } }
  }

  /* Bewegung. Tiefe ausgeschrieben statt bewegeTiefe(S,...): S.t ist die
     Spielzeit, siehe WEITER.md. */
  if(S.stolpernT<=0){
    const richtung=(rechtsAn?1:0)-(linksAn?1:0);
    if(richtung) S.blick=richtung;
    const hoechst=TUNE.gehTempo*tempoMultiplikator();
    if(richtung){
      S.vx+=richtung*TUNE.beschleunigung*dt;
      if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
    } else {
      const brems=TUNE.bremsung*dt;
      S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
    }
    const rt=(runterAn?1:0)-(hochAn?1:0);
    S.vt+=(rt*TUNE.tiefeTempo*tempoMultiplikator()-S.vt)*Math.min(1,14*dt);
  } else S.vt=0;
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));
  S.tiefe=Math.max(0,Math.min(1,S.tiefe+S.vt*dt));

  if(tempo2D(S.vx,S.vt)>12){
    S.gehPhase+=tempo2D(S.vx,S.vt)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }

  marvinTakt(dt);
  if(gespraechAktiv()) return;      // Marvin hat dich gerade gestellt
  ambientTakt(dt);
  /* Kiras Tschuess, kurz nachdem sie ins Taxi gestiegen ist (oder die
     Nummer gegeben hat). Nur einmal, nur im freien Spiel. */
  if(S.kiraTschuessT>0&&S.modus==='spiel'){
    S.kiraTschuessT-=dt;
    if(S.kiraTschuessT<=0&&!S.kiraTschuessGesagt){
      S.kiraTschuessGesagt=true; S.vx=0; S.vt=0; S.dunkel=0; S.flacker=0;
      starteGespraech(KIRA_TSCHUESS,'start');
      return;
    }
  }

  while(aktionPuffer.length){
    aktionPuffer.shift();
    const z=naechstesZiel();
    if(!z){ meldung(Math.abs(S.x-AUSGANG.x)<30&&!S.warAktiv?'ERST NOCH WAS ERLEBEN':'HIER IST NICHTS',1); SFX.nichts(); continue; }
    if(z.art==='tanzen'){ tanzSchritt(); continue; }
    S.warAktiv=true;
    if(z.art==='reden'){ redeMit(z.obj); return; }
    if(z.art==='bar'&&S.ef.shot.rest>0){ if(gratisShot()) return; continue; }
    if(z.art==='bar'){ starteMinigame('ex',z.obj); return; }
    if(z.art==='wasser'){
      if(S.wasserT>0){ meldung('GERADE ERST',0.9); SFX.nichts(); continue; }
      S.pegel=Math.max(0,S.pegel+TUNE.wasserPegel); S.wasserT=TUNE.wasserPause;
      meldung('KALTES WASSER INS GESICHT',1.6); SFX.schluck(); continue;
    }
    if(z.art==='tuer'){ starteCutscene('hinten'); return; }
    if(z.art==='garderobe'){
      S.garderobeFertig=true;
      starteGespraech(GARDEROBE_BAUM,'start');
      return;
    }
    if(z.art==='foto'){ if(MOMENT.fund(5)){ S.vx=0; } return; }
    if(z.art==='raucher'){ meldung(z.obj.satz,2.2); continue; }
  }
  kamera(dt);
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   CUTSCENE / SIEG
   ========================================================================== */
/* Semih kommt nur mit, wenn die Nacht im Club etwas hergegeben hat. Er
   kennt jeden - und er haengt sich nicht an jemanden, der leer ausgeht. */
const semihKommt=()=>S.erfolge>=1||flag('clubKloppeGewonnen')||wert('ruf')>=60;

/* Wie der Club endet, haengt davon ab, wie man rauskommt. */
function starteCutscene(grund){
  const z=[{ d:0.8, txt:'' }];
  if(grund==='rausschmiss') z.push(
    { d:2.4, txt:'DIE TUERSTEHER SIND SCHNELLER ALS GEDACHT.' },
    { d:2.4, txt:'ZWEI GREIFEN DICH. ZWEI GREIFEN MARVIN.' },
    { d:2.4, txt:flag('clubKloppeGewonnen')?'ER BLUTET. DU NICHT.':'DEINE LIPPE BLUTET.' },
    { d:2.4, txt:'UND DANN STEHST DU DRAUSSEN.' });
  else if(grund==='licht') z.push(
    { d:2.4, txt:'UM EINS GEHT DAS LICHT AN.' },
    { d:2.6, txt:'ALLE SEHEN PLOETZLICH SO AUS, WIE SIE SIND.' },
    { d:2.2, txt:'RAUS HIER.' });
  else z.push(
    { d:2.4, txt:'DU GEHST HINTEN RAUS.' },
    { d:2.2, txt:'DIE LUFT IST KALT UND TUT GUT.' });
  if(semihKommt()) z.push(
    { d:2.4, txt:'AN DER TUER STEHT SEMIH.' },
    { d:2.4, txt:'SEMIH KENNT JEDEN. AUCH DIE AFTERHOUR.', semih:true });
  else z.push(
    { d:2.6, txt:'KEINER WARTET AUF DICH. ALSO WEITER.' });
  z.push({ d:2.4, txt:'LEVEL 5 GESCHAFFT' });
  S.szenen=z;
  S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; SFX.sieg();
}
function levelGeschafft(){
  if(semihKommt()) speichereCrew('SEMIH');
  setzeKapitel(6);
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Pegel wird immer geschrieben, auch unveraendert - Level 6 braucht den
     korrekten Startwert. */
  speicherePegel(S.pegel);
  musikDo(m=>m.stinger('sieg'));
  saftDo(s=>s.fund(W/2,H/2,'DRAUSSEN!'));
  /* Rang genau einmal pro Durchgang (WERTUNG, Stufe 2). */
  if(!S.rangFertig){ S.rangFertig=true; rangAbschluss(); }
}
function cutscene(dt){
  /* Der Kampfauftakt ist kurz und wird nicht uebersprungen-beendet. */
  if(S.auftakt){
    S.szeneT+=dt;
    if(S.szeneT>=S.szenen[S.szene].d){
      S.szene++; S.szeneT=0;
      if(S.szene>=S.szenen.length){ S.auftakt=false; S.modus='spiel'; starteKloppe(); }
    }
    return;
  }
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  const sz=S.szenen[S.szene];
  if(S.szeneT>=sz.d){
    /* Semih spricht an der Tuer, bevor die Szene weitergeht. */
    if(sz.semih){ sz.semih=false; starteGespraech(SEMIH_BAUM,'start'); return; }
    S.szene++; S.szeneT=0;
    if(S.szene>=S.szenen.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  /* Musik wird auch hier gefuehrt: sie muss bei offenem Handy und Kapitelkarte
     gedaempft werden, und dort laeuft update() nicht. Mehrfach rufen ist sicher. */
  musik();
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  /* Das Pegel-Schwanken bleibt hier. Treffer-Wackeln kommt jetzt aus SAFT (kern.js). */
  const wack=S.pegel>TUNE.wackelnAb?(S.pegel-TUNE.wackelnAb)/45*3:0;
  const rx=Math.sin(S.t*7)*wack;
  const ry=Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneClub();
  ctx.restore();

  /* Stroboskop - deckt die Spielwelt ab, nicht das HUD darunter, damit
     Pegel und Uhr immer lesbar bleiben. */
  if(S.dunkel>0){ ctx.fillStyle=`rgba(4,2,10,${(FX.ruhig()?S.dunkel*.6:S.dunkel).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  if(S.flacker>0){ ctx.fillStyle=`rgba(255,255,255,${FX.blitz(S.flacker).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  zeichneNebel();

  hud();
  hudEreignisse();
  zeichneTaktpunkt();
  zeichneGespraech();
  if(S.modus==='ecke') zeichneEcke();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${FX.blitz(S.blitz*.4).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
  erzaehlZeichne();
}

/* Die Ecke: das Bild wird schwarz, die Zeilen kommen einzeln. */
function zeichneEcke(){
  const e=S.ecke; if(!e) return;
  ctx.fillStyle='#030208'; ctx.fillRect(0,0,W,H);
  const zeilen=ECKE[e.z.id];
  const y0=Math.round(H/2-zeilen.length*6);
  for(let i=0;i<=e.i&&i<zeilen.length;i++){
    const alpha=i<e.i?0.45:Math.min(1,e.t*2);
    ctx.globalAlpha=alpha;
    textC(zeilen[i],y0+i*12,i===e.i?P.weiss:P.dim);
  }
  ctx.globalAlpha=1;
  textC(e.z.name,y0-18,P.neon);
  if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN':'E',H-14,P.dunkel);
}

/* ==========================================================================
   DER ORT: Club-Kulisse. Statisches (Waende, Boden, Regale, Tuerme) wird einmal
   in eine Ebene gebacken; pro Bild kommen nur Menge, DJ, Strahlen, Equalizer und
   Dunst dazu. Alles Bewegte im Takt oder mit Helligkeit laeuft ueber FX
   (FX.hz klemmt auf hoechstens 3 Hz, FX.ruhig() = Standbild). Keine Zufallszahlen
   je Bild: Streuung kommt aus einem Hash des Index.
   ========================================================================== */
/* Tanzende Silhouetten, 9 breit, 11 hoch: unten Boden, 'q' wird eingefaerbt. */
const SIL5=[
  /* 0 Arme unten */ ['...qqq...','...qqq...','....q....','..qqqqq..','.qqqqqqq.','.q.qqq.q.','.q.qqq.q.','...q.q...','...q.q...','...q.q...','..qq.qq..'],
  /* 1 beide Arme hoch */ ['q..qqq..q','q..qqq..q','qq..q..qq','.qqqqqqq.','..qqqqq..','..qqqqq..','...qqq...','...q.q...','...q.q...','...q.q...','..qq.qq..'],
  /* 2 ein Arm hoch */ ['.......q.','...qqq.q.','...qqq.q.','....qqq..','..qqqqq..','.qqqqqq..','.q.qqq...','...q.q...','...q.q...','...q.q...','..qq.qq..'],
];
const POSEN5=[0,1,0,2];   // Reihenfolge ueber vier Schlaege
const _beat5={idx:0,ph:0};
function beat5(){
  const s=tanzSchlag(), per=Math.max(.05,s.seit+s.bis);
  _beat5.idx=s.idx; _beat5.ph=Math.min(1,s.seit/per); return _beat5;
}
/* Eine Silhouette im Takt. h = Hash des Tanzenden (Versatz, Spiegelung); ruhig: Standbild. */
function silhouette5(x,fuss,h,farbe,bt,ruhig){
  const pose=ruhig?0:POSEN5[(bt.idx+(h%4))&3], rows=SIL5[pose], y=Math.round(fuss)-rows.length;
  if(!ruhig&&(h&1)&&pose===2) spriteFlip(rows,x-4,y,1,farbe); else sprite(rows,x-4,y,1,farbe);
}
const hash5=(i,m=97)=>((i*37+11)*(i*7+3)+i*13)%m;

/* Baut Waende, Boden und festes Inventar - einmal, ueber die ganze Levelbreite. */
function ortEbene5(){
  const O=TUNE.ort, hi=TIEFE.hinten;
  return verlauf('club5|'+H,LEVEL_B,H,g=>{
    const r=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,h); };
    const strahl=(x,y,w,h,rgb,a)=>{ const gr=g.createLinearGradient(0,y,0,y+h);
      gr.addColorStop(0,`rgba(${rgb},${a})`); gr.addColorStop(1,`rgba(${rgb},0)`); g.fillStyle=gr; g.fillRect(x,y,w,h); };
    const kegel=(cx,y,w0,w1,h,rgb,a)=>{ const gr=g.createLinearGradient(0,y,0,y+h);
      gr.addColorStop(0,`rgba(${rgb},${a})`); gr.addColorStop(1,`rgba(${rgb},0)`); g.fillStyle=gr;
      g.beginPath(); g.moveTo(cx-w0/2,y); g.lineTo(cx+w0/2,y); g.lineTo(cx+w1/2,y+h); g.lineTo(cx-w1/2,y+h); g.closePath(); g.fill(); };
    const glanz=(x,y,w,h,rgb,a)=>{ const gr=g.createRadialGradient(x+w/2,y+h/2,1,x+w/2,y+h/2,Math.max(w,h)/2);
      gr.addColorStop(0,`rgba(${rgb},${a})`); gr.addColorStop(1,`rgba(${rgb},0)`); g.fillStyle=gr; g.fillRect(x,y,w,h); };

    /* Waende und Boeden je Bereich */
    for(const o of ORTE){
      const w=o.bis-o.von;
      const gr=g.createLinearGradient(0,20,0,hi); gr.addColorStop(0,o.oben); gr.addColorStop(1,o.wand);
      g.fillStyle=gr; g.fillRect(o.von,20,w,hi-20);
      /* Paneele: senkrechte Fugen, dezent */
      for(let x=o.von+O.paneelB;x<o.bis;x+=O.paneelB) r(x,22,1,hi-22,P.fuge+'66');
      r(o.von,20,w,2,P.fuge);                 // Deckenkante
      r(o.von,hi-3,w,3,P.fuge+'aa');          // Sockelleiste
      r(o.von,hi-4,w,1,o.kante+'55');
      r(o.von,hi,w,H-hi,o.boden); r(o.von,hi,w,1,P.bodenKante);
      r(o.bis-2,20,2,hi-20,P.fuge);
    }
    /* Boden: Dielen mit Fugen ueberall, auf der Tanzflaeche Kacheln (unten) */
    for(const o of ORTE){ if(o.fliesen) continue;
      for(let y=hi+9;y<H;y+=9) for(let x=o.von+((y>>1)%14);x<o.bis;x+=14) r(x,y,7,1,'#00000033'); }

    /* ---- EINGANG (0-170): Portal mit Strassenlicht, Garderobe, Seil, Polaroids */
    { const e=ORTE[0], tx=O.tuer;
      r(tx[0]-2,tx[1]-2,tx[2]+4,hi-tx[1]+2,P.fuge);
      const gt=g.createLinearGradient(0,tx[1],0,hi); gt.addColorStop(0,'#2a3a5a'); gt.addColorStop(1,'#5a6a8a');
      g.fillStyle=gt; g.fillRect(tx[0],tx[1],tx[2],hi-tx[1]);
      r(tx[0]+tx[2]/2,tx[1],1,hi-tx[1],P.fuge+'aa');                // Tuerspalt
      strahl(tx[0]-4,tx[1],tx[2]+8,60,'150,170,210',.18);
      kegel(tx[0]+tx[2]/2,hi,tx[2],tx[2]+26,26,'150,170,210',.12);   // Lichtspill auf den Boden
      r(tx[0]-3,tx[1]-4,tx[2]+6,2,P.neon);                            // Leuchtkante oben
      /* Garderobe: Garderobenstange mit Jacken ueber dem Tresen */
      const gx=O.garderobe[0];
      r(gx,64,O.garderobe[1],1,P.stahlLicht);
      for(let i=0;i<O.garderobe[2];i++){ const jx=gx+3+i*5, c=O.jacken[(i*3+1)%O.jacken.length];
        r(jx,64,1,2,P.stahlLicht); r(jx-1,66,4,14,c); r(jx-1,66,4,1,'#ffffff22'); }
      /* Polaroid-Wand */
      O.polaroids.forEach((p,i)=>{ r(p[0],p[1],8,9,'#d8d0c0'); r(p[0]+1,p[1]+1,6,6,p[2]); r(p[0]+1,p[1]+1,6,1,'#ffffff33'); });
      /* Absperrpfosten mit Samtseil */
      for(const px of O.seilPfosten){ r(px,hi-14,2,14,P.messing); r(px-1,hi-16,4,2,P.messing); }
      for(let i=0;i<=8;i++){ const ph=O.seilPfosten, d=i/8; r(Math.round(ph[0]+1+d*(ph[1]-ph[0])),hi-14+Math.round(Math.sin(d*Math.PI)*3),2,1,P.samt); }
      r(e.von+O.neonEingang[0],O.neonEingang[1],O.neonEingang[2],1,P.neon);
      r(e.von+O.neonEingang[0],O.neonEingang[1]+1,O.neonEingang[2],3,P.neon+'22');
    }

    /* ---- TANZFLAECHE (170-620): Kacheln, Traverse, Boxentuerme, LED-Wand, DJ-Podest */
    { const t=ORTE[1], k=O.kachel, y0=hi+1;
      for(let cy=0,y=y0;y<H;cy++,y+=k[1]) for(let cx=0,x=t.von;x<t.bis;cx++,x+=k[0]){
        const c=O.fliesen[hash5(cx*5+cy*3)%O.fliesen.length];
        r(x,y,k[0],k[1],c); r(x,y,k[0],1,'#ffffff0c'); r(x,y,1,k[1],'#ffffff06');
        r(x+k[0]-1,y,1,k[1],P.fuge+'88'); r(x,y+k[1]-1,k[0],1,P.fuge+'88'); }
      /* Wand-Waschlicht: farbiges Aufleuchten unten, damit Silhouetten davor lesbar bleiben */
      O.waschlicht.forEach(([x,w,rgb])=>{ const gr=g.createLinearGradient(0,hi-O.waschH,0,hi);
        gr.addColorStop(0,`rgba(${rgb},0)`); gr.addColorStop(1,`rgba(${rgb},${O.waschA})`);
        g.fillStyle=gr; g.fillRect(x,hi-O.waschH,w,O.waschH); });
      /* Traverse */
      r(t.von+2,O.traverse[0],t.bis-t.von-4,O.traverse[1],P.stahl);
      r(t.von+2,O.traverse[0],t.bis-t.von-4,1,P.stahlLicht);

function dunstBild5(key,w,h,rgb,a){
  return verlauf(key,w,h,g=>{ const gr=g.createRadialGradient(w/2,h/2,1,w/2,h/2,w/2);
    gr.addColorStop(0,`rgba(${rgb},${a})`); gr.addColorStop(1,`rgba(${rgb},0)`);
    g.save(); g.translate(0,h/2); g.scale(1,h/w); g.translate(0,-w/2); g.fillStyle=gr; g.fillRect(0,0,w,w); g.restore(); });
}

/* Bewegtes: Strahlen, Kugeln, LED-Wand, Boxen, DJ, Menge, Kachelglimmen, Dunst. */
function zeichneOrt5(kx){
  const O=TUNE.ort, hi=TIEFE.hinten, ruhig=FX.ruhig(), bt=beat5();
  ctx.drawImage(ortEbene5(),kx,0,W,H,kx,0,W,H);
  const sicht=(x,b=0)=>x>kx-b-4&&x<kx+W+b+4;

  /* Kachelglimmen: wenige Kacheln heller, langsam (FX.hz), unter ruhig gleichmaessig */
  const t=ORTE[1], k=O.kachel;
  const ph=ruhig?.5:Math.sin(S.t*FX.hz(O.glimmHz)*6.283)*.5+.5;
  for(let cy=0;cy*k[1]+hi+1<H;cy++) for(let cx=0;t.von+cx*k[0]<t.bis;cx++){
    const x=t.von+cx*k[0]; if(x<kx-k[0]||x>kx+W) continue;
    const h=hash5(cx*5+cy*3); if(h%O.glimmJeN!==0) continue;
    ctx.globalAlpha=O.glimmMin+(ruhig?0:(O.glimmMax-O.glimmMin)*Math.sin(S.t*FX.hz(O.glimmHz)*6.283+h)*.5+(O.glimmMax-O.glimmMin)*.5);
    ctx.fillStyle=O.glimmFarben[h%O.glimmFarben.length]; ctx.fillRect(x+1,hi+1+cy*k[1]+1,k[0]-2,k[1]-2);
  }
  ctx.globalAlpha=1;

  /* LED-Wand: Equalizer. Hoehe folgt langsamen Sinuswellen (je Balken eigene Frequenz, alle <= FX.hz). */
  { const L=O.ledWand, n=O.eqN, bw=Math.floor((L[2]-2)/n);
    for(let i=0;i<n;i++){
      const w=ruhig?.55:Math.sin(S.t*FX.hz(O.eqHz*(0.5+(i%3)*.25))*6.283+i*1.9)*.5+.5;
      const seg=Math.max(1,Math.round((L[3]-4)/3*(.18+.82*w)));
      for(let j=0;j<seg;j++){
        ctx.fillStyle=j>=O.eqSegmente-2?P.neon:(j>=O.eqSegmente-5?P.gold:P.gruen);
        ctx.globalAlpha=.85; ctx.fillRect(L[0]+2+i*bw,L[1]+L[3]-3-j*3,bw-1,2);
      }
    }
    ctx.globalAlpha=1; }

  /* Boxen: Basskegel schlaegt im Takt aus (nur Ringhelligkeit, klein) */
  for(const bx of O.tuerme){ if(!sicht(bx,O.turmB)) continue;
    const puls=ruhig?0:Math.max(0,1-bt.ph*3);
    ctx.globalAlpha=.10+.22*puls; ctx.fillStyle='#8a7aa8';
    for(let c=0;c<3;c++){ const ch=(O.turmH/3|0)-1, cy=hi-O.turmH+c*(O.turmH/3|0), mx=bx+(O.turmB>>1), my=cy+(ch>>1);
      ctx.fillRect(mx-2,my-2,5,5); }
    ctx.globalAlpha=1; }

  /* Strahlen von der Traverse: langsames Schwenken, additiv; unter ruhig feststehend */
  ctx.globalCompositeOperation='lighter';
  for(const lp of O.lampen){ if(!sicht(lp.x,O.strahlB)) continue;
    const sk=(ruhig?Math.sin(lp.ph):Math.sin(S.t*FX.hz(O.schwenkHz)*6.283+lp.ph))*O.schwenk;
    const y0=O.traverse[0]+O.traverse[1]+3, y1=y0+O.strahlH, x1=lp.x+sk*O.strahlH, hb=O.strahlB/2;
    const gr=ctx.createLinearGradient(0,y0,0,y1);
    gr.addColorStop(0,`rgba(${lp.rgb},${O.strahlA*5})`); gr.addColorStop(.7,`rgba(${lp.rgb},${O.strahlA*2})`); gr.addColorStop(1,`rgba(${lp.rgb},0)`);
    ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(lp.x-1,y0); ctx.lineTo(lp.x+1,y0); ctx.lineTo(x1+hb,y1); ctx.lineTo(x1-hb,y1); ctx.closePath(); ctx.fill(); }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;

  /* Discokugeln */
  for(const kxx of O.kugeln){ if(!sicht(kxx,8)) continue;
    const ky=O.traverse[0]+O.traverse[1]+O.kugelKette;
    sprite(SPR.kugel,kxx-3,ky);
    ctx.globalAlpha=.5; ctx.fillStyle='#fff'; ctx.fillRect(kxx-1+(ruhig?0:Math.round(Math.sin(S.t*FX.hz(1)*6.283)*1)),ky+1,1,1); ctx.globalAlpha=1; }

  /* DJ-Pult: DJ dahinter, Pult davor */
  { const D=O.dj, py=hi-D.podest;
    if(sicht(D.x,D.b)){
      const pose=ruhig?0:POSEN5[(bt.idx)&3];
      const rows=SIL5[pose===2?1:pose], y=py-D.tisch+3-rows.length+D.dju;
      sprite(rows,D.x-4,y,1,'#08060f');
      ctx.fillStyle=P.neon2; ctx.fillRect(D.x-3,y+1,1,2); ctx.fillRect(D.x+3,y+1,1,2);    // Kopfhoerer
      const tx=D.x-D.b/2+4, tw=D.b-8, ty=py-D.tisch;
      ctx.fillStyle='#1c1628'; ctx.fillRect(tx,ty,tw,D.tisch); ctx.fillStyle=P.stahlLicht; ctx.fillRect(tx,ty,tw,1);
      for(const dx of [tx+5,tx+tw-13]){ ctx.fillStyle='#0a0810'; ctx.fillRect(dx,ty-2,9,3); ctx.fillStyle='#4a4660'; ctx.fillRect(dx+2,ty-2,5,1); }
      ctx.fillStyle='#2a2a38'; ctx.fillRect(D.x-5,ty-4,10,3); ctx.fillStyle=P.neon2; ctx.globalAlpha=.55; ctx.fillRect(D.x-4,ty-4,8,2); ctx.globalAlpha=1;
      for(let i=0;i<D.leds;i++){
        const an=ruhig?.75:(Math.floor(S.t*FX.hz(O.ledHz)+i*.37)%2?.95:.45);
        ctx.globalAlpha=an; ctx.fillStyle=O.glimmFarben[i%O.glimmFarben.length];
        ctx.fillRect(tx+3+i*Math.floor((tw-6)/D.leds),ty+3,3,2); ctx.fillRect(tx+3+i*Math.floor((tw-6)/D.leds),ty+6,3,1); }
      ctx.globalAlpha=1;
    } }

  /* Menge: zwei Reihen am Wandfuss, tanzend im Takt (ausserhalb des DJ-Podests) */
  { const M=O.menge, t0=ORTE[1];
    for(const reihe of M.reihen){
      for(let i=0;;i++){
        const x=t0.von+reihe.x0+i*reihe.abst; if(x>t0.bis-6) break;
        if(x<kx-8||x>kx+W+8) continue;
        if(x>O.dj.x-O.dj.b/2-4&&x<O.dj.x+O.dj.b/2+4) continue;
        const h=hash5(i*3+reihe.fuss);
        silhouette5(x+(h%5)-2,hi+reihe.fuss,h,M.farben[h%M.farben.length],bt,ruhig);
      } } }

  /* Dunst ueber der Tanzflaeche und in der Raucherecke - treibt langsam, unter ruhig still */
  ctx.globalCompositeOperation='source-over';
  for(const d of O.dunst){
    if(!sicht(d.x,d.b)) continue;
    const dr=ruhig?0:Math.sin(S.t*O.dunstTempo+d.ph)*d.drift;
    ctx.globalAlpha=d.a; ctx.drawImage(dunstBild5('dunst5'+d.rgb+d.b,d.b,d.h,d.rgb,1),Math.round(d.x-d.b/2+dr),d.y);
  }
  ctx.globalAlpha=1;
  /* Rauch steigt in der Raucherecke auf (Schleife aus Zeit und Index, still unter ruhig) */
  for(let i=0;i<O.rauch.n;i++){
    const R=O.rauch, x=R.x0+i*R.abst+(hash5(i)%7), z=ruhig?(i*.37)%1:((S.t*R.tempo/R.h+i*.29)%1);
    ctx.globalAlpha=R.a*Math.sin(z*Math.PI);
    ctx.drawImage(dunstBild5('rauch5',R.b,R.bh,'200,200,210',1),Math.round(x-R.b/2),Math.round(R.y0-z*R.h));
  }
  ctx.globalAlpha=1;
}

function zeichneClub(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  zeichneOrt5(kx);
  /* Raumnamen zuletzt: Strahlen, Tuerme und Dunst decken sie sonst zu. */
  for(const o of ORTE) text(o.name,o.von+6,TUNE.raumNameY,TUNE.raumNameFarbe);

  const naechst=S.modus==='spiel'?naechstesZiel():null;
  const blink=Math.floor(S.t*4)%2===0;
  const liste=[];
  const schatten=(x,t)=>{ ctx.globalAlpha=.24; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(x-3),Math.round(bodenY(t)),7,1); ctx.globalAlpha=1; };

  const bt5=beat5(), ruhig5=FX.ruhig(), OM=TUNE.ort.menge;
  for(const tz of TANZER){
    liste.push({t:tz.t, mal:()=>{
      const h=Math.round(tz.seed*10), rows=ruhig5?SIL5[0]:SIL5[POSEN5[(bt5.idx+(h%4))&3]];
      const y=Math.round(bodenY(tz.t))-rows.length;
      outline(rows,tz.x-4,y,1,.5); silhouette5(tz.x,bodenY(tz.t),h,OM.vorn[h%OM.vorn.length],bt5,ruhig5);
    }});
  }

  /* Bar und Waschbecken stehen an der Rueckwand */
  liste.push({t:BARTHEKE.t, mal:()=>{
    /* Der Schankplatz: Glaeser auf der Theke im Warmlicht. Der Name BAR steht schon als Raumname an der Wand. */
    const y=Math.round(bodenY(BARTHEKE.t))-TUNE.ort.theke[2]-3;
    ctx.globalAlpha=.22; ctx.fillStyle='#ffb85a'; ctx.fillRect(BARTHEKE.x-10,y-1,22,5); ctx.globalAlpha=1;
    for(let i=0;i<3;i++){ ctx.fillStyle=P.glas; ctx.fillRect(BARTHEKE.x-6+i*5,y,3,4); ctx.fillStyle='#ffffff44'; ctx.fillRect(BARTHEKE.x-6+i*5,y,1,4); }
    if(naechst&&naechst.obj===BARTHEKE&&blink) text(aktionsMarke(),BARTHEKE.x-2,y-10,P.gold);
  }});
  liste.push({t:WASCHBECKEN.t, mal:()=>{
    const y=bodenY(WASCHBECKEN.t)-SPR.waschbecken.length;
    sprite(SPR.waschbecken,WASCHBECKEN.x-3,y);
    if(naechst&&naechst.obj===WASCHBECKEN&&blink) text(aktionsMarke(),WASCHBECKEN.x-1,y-8,P.gold);
  }});
  liste.push({t:AUSGANG.t, mal:()=>{
    const y=bodenY(AUSGANG.t)-SPR.tuer.length;
    sprite(SPR.tuer,AUSGANG.x-4,y);
    text('AFTERHOUR',AUSGANG.x-textW('AFTERHOUR')/2,y-8,P.gold);
    if(naechst&&naechst.obj===AUSGANG&&blink) text(aktionsMarke(),AUSGANG.x-1,y-16,P.gold);
  }});
  /* Garderobe am Eingang - gleicher Tresen wie die Bar, wiederverwendet. */
  liste.push({t:GARDEROBE.t, mal:()=>{
    const y=bodenY(GARDEROBE.t)-4;
    outline(SPR.theke,GARDEROBE.x-6,y,1,.5); sprite(SPR.theke,GARDEROBE.x-6,y);
    text('GARDEROBE',GARDEROBE.x-textW('GARDEROBE')/2,y-10,P.dim);
    if(naechst&&naechst.obj===GARDEROBE&&blink) text(aktionsMarke(),GARDEROBE.x-2,y-18,P.gold);
  }});
  MOMENT.zeichneFund && liste.push({t:FOTO5.t, mal:()=>{
    MOMENT.zeichneFund(FOTO5.x-4,bodenY(FOTO5.t)-9,5);
    if(!MOMENT.hat(5)&&naechst&&naechst.obj===FOTO5&&blink) text(aktionsMarke(),FOTO5.x-2,bodenY(FOTO5.t)-17,P.gold);
  }});
  /* Raucherecke - vorhandener Tanzer-Umriss, nur eingefaerbt. */
  for(const r of [RAUCHER1,RAUCHER2]){
    liste.push({t:r.t, mal:()=>{
      const y=bodenY(r.t)-SPR.tanzer.length;
      schatten(r.x,r.t);
      sprite(SPR.tanzer,r.x-3,y,1,r===RAUCHER1?'#8a6a3a':'#5a4632');
      if(naechst&&naechst.obj===r&&blink) text(aktionsMarke(),r.x-2,y-9,P.gold);

  }
  /* Hinterausgang: Kisten als reine Deko, der Lieferant nutzt den
     vorhandenen Handlanger-Umriss. */
  for(const k of KISTEN){
    liste.push({t:k.t, mal:()=>{
      /* Gestapelt bis in die sonst leere Wand hinein - eine einzelne
         Kiste am Boden geht im Gewusel der Tuer unter (siehe Messung
         in NACHT-TODO.md). */
      const boden=bodenY(k.t);
      for(let i=0;i<4;i++){
        const y=boden-6-i*7;
        ctx.fillStyle='#8a6a3a'; ctx.fillRect(k.x-4,y-5,9,5);
        ctx.fillStyle='#c8a868'; ctx.fillRect(k.x-4,y-5,9,1);
        ctx.fillStyle='#4a3a2a'; ctx.fillRect(k.x-4,y,9,1);
      }
    }});
  }
  liste.push({t:LIEFERANT.t, mal:()=>{
    const y=bodenY(LIEFERANT.t)-SPR.handlanger.length;
    schatten(LIEFERANT.x,LIEFERANT.t);
    sprite(SPR.handlanger,LIEFERANT.x-3,y);
    if(naechst&&naechst.obj===LIEFERANT&&blink) text(aktionsMarke(),LIEFERANT.x-2,y-9,P.gold);
  }});

  for(const z of ZIELE){
    if(z.weg) continue;
    liste.push({t:z.t, mal:()=>{
      const rows=SPR[z.spr], y=bodenY(z.t)-rows.length;
      schatten(z.x,z.t);
      outline(rows,z.x-3,y,1,.55); sprite(rows,z.x-3,y);
      /* Name nur in der Naehe - sonst ist das Bild voller Beschriftung */
      if(Math.abs(z.x-S.x)<60){
        const farbe={offen:P.weiss,ja:P.gold,nummer:P.gruen,nett:P.dim,nein:P.rot,weg:P.dunkel}[z.stand];
        text(z.name,z.x+3-textW(z.name)/2,y-9,farbe);
        if(z.stand==='weg') text('MIT MARVIN',z.x+3-textW('MIT MARVIN')/2,y-16,P.dunkel);
      }
      if(naechst&&naechst.obj===z&&blink) text(aktionsMarke(),z.x+2,y-16,P.gold);
    }});
  }
  liste.push({t:JULE.t, mal:()=>{
    const rows=SPR.lena, y=bodenY(JULE.t)-rows.length;
    schatten(JULE.x,JULE.t); sprite(rows,JULE.x-3,y);
    if(Math.abs(JULE.x-S.x)<40) text('JULE',JULE.x+3-textW('JULE')/2,y-9,P.dunkel);
  }});

  const m=S.marvin;
  if(m.da&&!m.fertig&&S.modus!=='kloppe'){
    liste.push({t:m.t, mal:()=>{
      const lauf=laufBild(m);
      const rows=lauf>=0?gehBeine(SPR.marvin,lauf):SPR.marvin, y=bodenY(m.t)-rows.length;
      schatten(m.x,m.t);
      outline(rows,m.x-3,y,1,.6);
      if(m.blick<0) spriteFlip(rows,m.x-3,y,1,m.wut?'#ff8080':null);
      else sprite(rows,m.x-3,y,1,m.wut?'#ff8080':null);
      /* Eine Zeile hoeher als die Namen der anderen - er steht meistens
         direkt neben jemandem, und dann lagen beide Namen uebereinander. */
      if(Math.abs(m.x-S.x)<80) text('MARVIN',m.x+3-textW('MARVIN')/2,y-17,m.wut?P.rot:P.dim);
      /* Wie lange er schon bei ihr steht - man soll sehen, dass es eng wird */
      if(m.beiT>0&&m.ziel){
        const f=Math.min(1,m.beiT/(TUNE.marvinNimmt*schwer().frist));
        ctx.fillStyle='#2a2440'; ctx.fillRect(Math.round(m.x-5),y-8,11,2);
        ctx.fillStyle=P.rot; ctx.fillRect(Math.round(m.x-5),y-8,Math.round(11*f),2);
      }
    }});
  }

  if(S.modus==='kloppe') zeichneKloppe(liste);
  else liste.push({t:S.tiefe, mal:()=>{
    let rows;
    /* Tanzpose: kurz hoch und zur Seite versetzt (Treffer im Takt) */
    const tanzt=S.tanzPoseT>0;
    if(S.stolpernT>0||tanzt) rows=SPR.steh;
    else if(tempo2D(S.vx,S.vt)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
    else rows=SPR.steh;
    const tint=S.stolpernT>0?'#ff4d4d':(S.confidenceT>0?'#ffd447':null);
    const hub=tanzt?3:0, seite=tanzt?S.tanzSeite:0;
    const y=bodenY(S.tiefe)-rows.length-hub;
    schatten(S.x,S.tiefe);
    outline(rows,S.x-3+seite,y,1,.6);
    if(S.blick<0) spriteFlip(rows,S.x-3+seite,y,1,tint); else sprite(rows,S.x-3+seite,y,1,tint);
    if(naechst&&naechst.art==='tanzen'&&blink) text(aktionsMarke(),Math.round(S.x)-1,y-8,P.gold);
  }});

  zeichneNachTiefe(liste);
  ctx.restore();

  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* Die Schlaegerei. Im Stroboskop ist das Ausholen oft nicht zu sehen -
   das ist Absicht und steht so im Plan: schlechte Sicht, Leute im Weg. */
function zeichneKloppe(liste){
  zeichneTiefenlinien(Math.round(S.kamX)-4,Math.round(S.kamX)+W+4);
  for(const g of S.gegner) zeichneTiefenMarke(g,S.ich);
  const malK=(k,steh,grund)=>liste.push({t:k.t, mal:()=>{
    const lauf=laufBild(k);
    let rows=steh;
    if(lauf>=0&&(k.zustand==='frei'||k.zustand==='block')) rows=steh===SPR.steh?SPR.geh[lauf]:gehBeine(steh,lauf);
    const y=bodenY(k.t)-rows.length+(k.zustand==='rolle'?3:0);
    const blinkt=k.unverwundbar>0&&Math.floor(S.t*2*FX.hz(3))%2===0;
    const tint=k.zustand==='block'?'#42d9ff':k.zustand==='ausholen'?P.gold:
               k.zustand==='getroffen'?'#ff8080':blinkt?'#ffffff':grund;
    ctx.globalAlpha=.24; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(k.x-3),Math.round(bodenY(k.t)),7,1); ctx.globalAlpha=1;
    outline(rows,k.x-3,y,1,.6);
    if(k.blick<0) spriteFlip(rows,k.x-3,y,1,tint); else sprite(rows,k.x-3,y,1,tint);
    if(k!==S.ich) for(let i=0;i<k.maxHp;i++){
      ctx.fillStyle=i<k.hp?P.rot:'#2a2440'; ctx.fillRect(Math.round(k.x-4+i*3),y-6,2,2); }
  }});
  for(const g of S.gegner) if(g.hp>0) malK(g, g.marvin?SPR.marvin:SPR.handlanger, null);
  if(S.ich) malK(S.ich, SPR.steh, null);
}

/* ---- HUD ---- */
function hud(){
  /* Uhr */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  const knapp=S.minute>=TUNE.endMinute-10;
  text(uhr,W-textW(uhr)-6,6,knapp&&Math.floor(S.t*4)%2===0?P.rot:(knapp?P.gold:P.dim));

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6, p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  ctx.fillStyle=P.gruen; ctx.fillRect(bx+Math.round(bw*TUNE.mutAb/100),by-1,1,6);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Erfolge und Ruf - der Ruf entscheidet, welche Antworten noch gehen */
  text('ERFOLGE '+S.erfolge,6,6,P.weiss);
  text('RUF '+Math.round(wert('ruf')),6,14,wert('ruf')<40?P.rot:P.dim);
  if(S.modus==='kloppe'&&S.ich){
    for(let i=0;i<S.ich.maxHp;i++){ ctx.fillStyle=i<S.ich.hp?P.rot:'#2a2440'; ctx.fillRect(6+i*7,24,5,4); }
    ctx.fillStyle='#2a2440'; ctx.fillRect(6,31,54,3);
    ctx.fillStyle=S.ich.ausdauer<KAMPF.ausdauerSchlag?P.rot:P.neon2;
    ctx.fillRect(6,31,Math.round(54*S.ich.ausdauer/KAMPF.ausdauerMax),3);
    zeichneAusholbalken(naechsterAngreifer(S.gegner,S.ich),null,40);
  }

  /* Status */
  if(S.modus!=='kloppe'){
    if(S.confidenceT>0&&Math.floor(S.t*3)%2===0) text('CONFIDENCE',6,24,P.gold);
    if(S.geknicktT>0&&Math.floor(S.t*3)%2===0) text('GEKNICKT',6,24,P.rot);
  }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    const hy=S.modus==='mini'?40:H-20;
    textGlowC(S.hinweis,hy,P.gold,1); ctx.globalAlpha=1; }

  /* Minispiel-Leiste */
  if(S.modus==='mini'){
    const m=S.mini, breite=TUNE.minigameBreite, fenster=aktuellesFenster(), tempo=aktuellesTempo();
    const pos=markerPos(S.t-m.t0,tempo,breite);
    const bx2=Math.round((W-breite)/2), by2=H-24;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(m.art==='ex'?'AUF EX':'TANZEN MIT '+m.ziel.name,8,H-38,P.neon2);
    const rundenZiel=m.art==='ex'?1:TUNE.ansprechRunden;
    text('RUNDE '+(m.runden+1)+'/'+rundenZiel,W-textW('RUNDE '+(m.runden+1)+'/'+rundenZiel)-6,H-38,P.dim);
    ctx.fillStyle='#2a2440'; ctx.fillRect(bx2,by2,breite,6);
    ctx.fillStyle=P.gruen; ctx.fillRect(Math.round(bx2+m.mitte-fenster/2),by2,Math.round(fenster),6);
    ctx.fillStyle=P.weiss; ctx.fillRect(Math.round(bx2+pos)-1,by2-2,2,10);
    if(Math.floor(S.t*2)%2===0){ const et=tasteText('E TREFFEN','JETZT TREFFEN'); text(et,W-textW(et)-6,H-12,P.gold); }
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('CLUB',22,P.neon,3);
  textC('LEVEL 5 - STROBOSKOP',44,P.dim);
  const zeilen=['AUF DER TANZFLAECHE SIEHT MAN NICHTS','WAS DU SAGST, ENTSCHEIDET','UND MARVIN IST AUCH HIER'];
  zeilen.forEach((z,i)=>textC(z,66+i*10,i===2?P.gold:P.weiss));
  const st=IS_TOUCH?[['STICK','LAUFEN'],['KNOPF','REDEN, TRINKEN, TUER']]
                   :[['WASD','LAUFEN'],['E','REDEN, TRINKEN, TUER']];
  st.forEach((z,i)=>{ text(z[0],70,112+i*9,P.gold); text(z[1],104,112+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),140,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'E ODER LEERTASTE',H-19,P.weiss,1);
  if(!IS_TOUCH){
    const a='TASTE 1    LEVEL 1 - DIE SCHULE';
    text(a,(W-textW(a))/2,H-8,P.dunkel);
  }
}
function zeichneIntro(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,0,W,H);
  const m=Math.round(W/2);
  ctx.fillStyle='#241a30'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#1d1727'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  const puls=(Math.sin(S.t*5)*.5+.5);
  ctx.globalAlpha=.14+puls*.12;
  ctx.drawImage(verlauf('introlicht5',220,110,g=>{
    const gr=g.createRadialGradient(110,14,4,110,14,96);
    gr.addColorStop(0,'rgba(255,60,180,1)'); gr.addColorStop(1,'rgba(255,60,180,0)');
    g.fillStyle=gr; g.fillRect(0,0,220,110); }),m-110,30);
  ctx.globalAlpha=1;
  sprite(SPR.dj,m-70,130-14);
  sprite(SPR.tanzer,m-6,130-5);
  sprite(SPR.tanzer,m+16,130-5);
  sprite(SPR.steh,m+40,130-13);
  ctx.drawImage(verlauf('introvig5',W,H,g=>{
    const gr=g.createRadialGradient(m,80,40,m,80,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.82)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(!IS_TOUCH&&Math.floor(S.t*2)%2===0) text('E WEITER',W-textW('E WEITER')-6,H-10,P.dunkel);
  zeichneUeberspringen(S.skipT,INTRO_SKIP);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC(tasteText('P ZUM WEITERSPIELEN','MENUE ZU: WEITER'),100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=S.szenen[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0){ const ut=tasteText('E HALTEN ZUM UEBERSPRINGEN','HALTEN ZUM UEBERSPRINGEN'); text(ut,W-textW(ut)-6,H-10,P.dunkel); }
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 5 GESCHAFFT',34,P.gold,2);
      textC('DU BIST DRAUSSEN RICHTUNG AFTERHOUR.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('ERFOLGE  '+S.erfolge+'   RUF  '+Math.round(wert('ruf')),96,P.dim);
      textC('PEGEL  '+Math.round(S.pegel),106,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),120,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 6':'E  WEITER ZU LEVEL 6',134,P.gruen,1);
    } else {
      textGlowC('VERPASST',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
    }
    if(!S.gewonnen&&Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
  }
}

starteSchleife();
