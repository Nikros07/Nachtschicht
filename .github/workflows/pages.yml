name: Deploy to GitHub Pages

# Bei jedem Push auf main wird die Seite neu veroeffentlicht.
# enablement: true schaltet GitHub Pages beim ersten Lauf selbst ein,
# damit man das nicht von Hand in den Einstellungen suchen muss.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
