name: Deploy to GitHub Pages

# Bei jedem Push auf main wird die Seite neu veroeffentlicht.
# enablement: true schaltet GitHub Pages beim ersten Lauf selbst ein,
# damit man das nicht von Hand in den Einstellungen suchen muss.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5 laeuft auf Node 24. v4 ist auf Node 20 und wird abgekuendigt.
      - uses: actions/checkout@v5

      # enablement:true schaltet Pages selbst ein - klappt aber nur, wenn
      # unter Settings > Actions > General die Workflow-Rechte auf
      # "Read and write" stehen. Sonst einmalig unter Settings > Pages
      # die Quelle auf "GitHub Actions" stellen, dann laeuft es hier durch.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
