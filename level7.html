/* Musik: ruhiges, langsames Pad - die Nacht kommt kurz zur Ruhe */
const PAD=[130.81,0,0,0, 164.81,0,0,0, 196.00,0,0,0, 146.83,0,0,0];

function musik(){
  if(!AC||muted||S.modus==='pause'||S.modus==='titel') return;
  const st=60/70/2;
  while(MUS.next<AC.currentTime+.15){
    const i=MUS.step%PAD.length, f=PAD[i];
    if(f) ton(f,MUS.next,st*1.6,'sine',.02);
    MUS.next+=st; MUS.step++;
  }
}

/* Die Crew auf der Bank. Wer schlecht behandelt wurde, ist nicht mehr da -
   die Beziehung aus Level 2 bis 6 entscheidet. */
function baueCrew(){
  const alle=ladeCrew().filter(n=>n!=='TOBI');
  const da=[], weg=[];
  /* MAX FERDI und MORITZ gehen nie heim: Finale, Anlauf 4 und Abspann brauchen beide. */
  for(const n of alle) ((n==='MAX FERDI'||n==='MORITZ'||beziehung(n)>-5)?da:weg).push(n);
  const sprite={ 'MAX FERDI':'max', 'MORITZ':'moritz' };
  return { weg, da: da.map((name,i)=>({
    id:'crew'+i, name, x:560+i*18, t:0.10+(i%2)*0.08, spr:sprite[name]||'steh', tint:sprite[name]?null:P.neon2 })) };
}

function druckSprung(){
  if(erzaehlTaste()) return;
  ensureAudio();
  if(S.karte){ S.karte.t=99; return; }
  if(S.modus==='titel'){ starte(); return; }

  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene') return;

}
function druckAktion(){
  if(erzaehlTaste()) return;
  if(S.karte){ ensureAudio(); S.karte.t=99; return; }
  if(typeof gespraechAktiv==='function'&&gespraechAktiv()){ ensureAudio(); gespraechBestaetigen(); return; }
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='karte.html?nach=7'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}

addEventListener('keydown',e=>{

  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }

});

const INTRO_SKIP=0.5;   // so lange halten, dann ist das Intro vorbei
function intro(dt){ S.szeneT+=dt;
  /* Halten ueberspringt das ganze Intro, Tippen eine Szene. Level 1 hat
     sieben Szenen - beim zweiten Durchlauf war das siebenmal tippen. */
  if(aktionGehalten){ S.skipT=(S.skipT||0)+dt; if(S.skipT>INTRO_SKIP){ starteLevel(); return; } }
  else S.skipT=Math.max(0,(S.skipT||0)-dt*2);
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  if(erzaehlTakt(dt)) return;
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.karte){ karteTakt(dt); return; }
  if(gespraechAktiv()){ gespraechTakt(dt); aktionPuffer.length=0; return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));
  /* Tiefe ausgeschrieben - S.t ist die Spielzeit. */
  const rt=tiefeAn()?((runterAn?1:0)-(hochAn?1:0)):0;
  S.vt+=(rt*TUNE.tiefeTempo*langsam-S.vt)*Math.min(1,14*dt);
  S.tiefe=Math.max(0,Math.min(1,S.tiefe+S.vt*dt));

  if(S.amBoden&&tempo2D(S.vx,S.vt)>12){
    S.gehPhase+=tempo2D(S.vx,S.vt)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  heinzTakt(dt);
  radioTakt(dt);

  while(aktionPuffer.length){
    aktionPuffer.shift();
    const z=naechstesZiel();
    if(!z) continue;
    if(z.art==='pfand'){
      z.obj.weg=true; nimmDing('PFAND'); SFX.fund();
      const n=NACHT.inventar.PFAND||0;
      meldung('PFAND: '+n+' FLASCHEN',1); continue;
    }
    if(z.art==='kasse'){ redeMit(OEZDEMIR_BAUM,'oezdemir'); return; }
    if(z.art==='regal'){
      meldung(z.obj.art==='wasser'?'WASSER - 2 EURO. BEZAHLEN AN DER KASSE':'SNACKS - 3 EURO. BEZAHLEN AN DER KASSE',2);
      continue;
    }
    if(z.art==='mensch'){ redeMit(z.obj.id==='marvin'?marvinBaum():{taxi:TAXI_BAUM,nele:NELE_BAUM,tobi:TOBI_BAUM}[z.obj.id],z.obj.id); return; }
    if(z.art==='foto'){ if(MOMENT.fund(7)) S.vx=0; return; }
    if(z.art==='bank'){ bankStart(); return; }
    if(z.art==='heinz'){ redeMit(HEINZ_BAUM,'heinz'); return; }
    if(z.art==='crew'){
      const c=z.obj;
      const zeilen=beziehung(c.name)>=10?['DAS WAR EINE NACHT.','DANKE, DASS DU MICH MITGENOMMEN HAST.']:
                   ['ICH BIN SO DURCH.','HAST DU WAS ZU TRINKEN?'];
      const b={}; zeilen.forEach((t,i)=>b[i?'z'+i:'start']={wer:c.name,text:t,geh:i+1<zeilen.length?'z'+(i+1):'@ende'});
      redeMit(b,c.name); return;
    }
    if(z.art==='ecke'){
      if(!alleFertig()){ meldung('ERST WASSER UND WAS ZU ESSEN',1.8); SFX.nichts(); continue; }
      if(!S.anlauf){ S.anlauf=true; PLAUSCH.sperre=true;   // Moritz setzt zum vierten Mal an
        S.karte={ i:0, t:0, txt:['MORITZ: DU, ICH MUSS DIR WAS...','MORITZ: ...SPAETER. AUF DEM HEIMWEG.|VERSPROCHEN.'] };
        S.vx=0; S.vt=0; return; }
      redeMit(ENDE_BAUM,'crew'); return;
    }
  }
  kamera(dt);
}

function naechstesZiel(){
  let bestes=null, d0=1e9;
  const pruefe=(obj,art,tiefe,reich)=>{
    if(!tiefeNah(tiefe,S.tiefe,TUNE.redeTiefe)) return;
    const d=Math.abs(obj.x-S.x);
    if(d<(reich||TUNE.reichweite)&&d<d0){ bestes={art,obj}; d0=d; }
  };
  for(const f of S.pfand) if(!f.weg) pruefe(f,'pfand',f.t,11);
  pruefe(OEZDEMIR,'kasse',OEZDEMIR.t);
  for(const d of DINGE) pruefe(d,'regal',d.t);
  for(const m of NACHTMENSCHEN){
    if(!nachtmenschDa(m)) continue;
    pruefe(m,'mensch',m.t,m.id==='marvin'?9:0);
  }
  if(S.crew.length) pruefe(BANKRUNDE,'bank',BANKRUNDE.t);
  if(!MOMENT.hat(7)) pruefe(FOTO7,'foto',FOTO7.t,8);
  if(!S.heinz.friedlich) pruefe(S.heinz,'heinz',S.heinz.t);
  for(const c of S.crew) pruefe(c,'crew',c.t);
  pruefe({x:TUNE.ausgangX},'ecke',S.tiefe,20);
  return bestes;
}

/* Was nach einem Gespraech passiert. Die Baeume setzen Flags und Geld -
   was es im Laden bewirkt, steht hier. */
function spaetiEnde(e,wer){
  if(e==='@snack'){
    /* Direkt in den Speicherstand - der Endbaum fragt {kondition:50} ab. */
    aendereWert('kondition',TUNE.snackKondition);
    meldung('SNACKS FUER ALLE',1.6); SFX.fund(); return redeMit(OEZDEMIR_BAUM,'oezdemir');
  }
  if(e==='@pfand'){
    let n=0; while(gibDing('PFAND')) n++;
    const euro=n*TUNE.pfandWert;
    aendereWert('geld',euro);
    meldung(n+' FLASCHEN - '+euro.toFixed(2).replace('.',',')+' EURO',2);
    SFX.erledigt(); return redeMit(OEZDEMIR_BAUM,'oezdemir');
  }
  if(e==='@gut'){ S.nele.weg=true; meldung('NELE LAEUFT ZU IHREN FREUNDINNEN',2); SFX.erledigt(); return; }
  if(e==='@wasserWeg'){ S.nele.weg=true; S.neleWasser=true; setzeFlag('spaetiWasser',false);
    meldung('DEIN WASSER IST WEG. NOCHMAL KAUFEN?',2.4); return; }
  if(e.startsWith('@bank:')){ S.bankFrag[e.slice(6)]=true; return redeMit(baueBank(),'bank','mehr'); }
  if(e==='@marvin'){ meldung('MARVIN NICKT',2); SFX.erledigt(); return; }
  if(e==='@tobi'){ meldung('TOBI KOMMT MIT',2); SFX.erledigt(); return; }
  if(e==='@heinz'){ S.heinz.friedlich=true; meldung('HEINZ LAESST DIR EINEN SCHLUCK DA',2); return; }
  if(e==='@heim'||e==='@weiter'||e==='@sonne'){
    setzeFlag({'@heim':'endeHeim','@weiter':'endeWeiter','@sonne':'endeSonne'}[e]);
    starteCutscene(e); return;
  }
}

/* Heinz sammelt dieselben Flaschen. Er geht zur naechsten freien, bueckt
   sich, und weg ist sie. Das ist das Wettrennen - und wer ihn anspricht,
   kann es auch einfach lassen. */
function heinzTakt(dt){
  const h=S.heinz;
  if(h.friedlich){ h.x+=(40-h.x)*Math.min(1,dt); return; }
  if(!h.ziel||h.ziel.weg){
    const frei=S.pfand.filter(f=>!f.weg);
    frei.sort((a,b)=>Math.abs(a.x-h.x)-Math.abs(b.x-h.x));
    h.ziel=frei[0]||null; h.greifT=0;
  }
  if(!h.ziel) return;
  const dx=h.ziel.x-h.x;
  if(Math.abs(dx)>2){
    h.blick=Math.sign(dx); h.x+=h.blick*TUNE.heinzTempo*dt;
    h.t+=(h.ziel.t-h.t)*Math.min(1,1.5*dt);
    return;
  }
  h.greifT+=dt;
  if(h.greifT>=TUNE.heinzGreift){ h.ziel.weg=true; h.ziel=null; }
}

}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   CUTSCENE - kurzer Ausklang, bevor es zum Heimweg geht
   ========================================================================== */
/* Die Bilanz. Was man heute Nacht fuer andere getan hat, steht hier noch
   einmal - und die Entscheidung, wie es weitergeht. */
function starteCutscene(wahl){
  const z=[{ d:1.0, txt:'' }, { d:2.4, txt:'DRAUSSEN WIRD ES SCHON WIEDER HELLER.' }];
  if(flag('oezdemirGeschichte')) z.push({ d:2.4, txt:'HERR OEZDEMIR WINKT DURCH DIE SCHEIBE.' });
  if(flag('neleGeholfen'))       z.push({ d:2.4, txt:'IRGENDWO ZWEI STRASSEN WEITER LACHT NELE.' });
  if(flag('heinzGeholfen'))      z.push({ d:2.4, txt:'HEINZ SCHIEBT SEINEN WAGEN UM DIE ECKE.' });
  if(flag('tobiDabei'))          z.push({ d:2.4, txt:'TOBI GEHT MIT. ER REDET ZUM ERSTEN MAL.' });
  if(S.crewWeg.length)           z.push({ d:2.4, txt:S.crewWeg.join(', ')+' MUSSTE HEIM.' });
  z.push({ d:2.6, txt: wahl==='@heim'   ? 'DU: HEIM. EINFACH NUR HEIM.'
                     : wahl==='@weiter' ? 'DU: DIE NACHT IST NOCH NICHT VORBEI.'
                     :                    'DU: ZUR BRUECKE. DIE SONNE KOMMT GLEICH.' });
  if(flag('taxiTipp')) z.push({ d:2.4, txt:'DER TAXIFAHRER HAT GESAGT: STEHENBLEIBEN UND BLOCKEN.' });
  z.push({ d:2.4, txt:'LEVEL 7 GESCHAFFT' });
  S.szenen=z; S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; SFX.sieg();
}
function levelGeschafft(){
  setzeKapitel(8);
  S.crewWeg.forEach(entferneCrew);
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Der Pegel geht als Startwert an Level 8 - immer speichern, auch wenn
     er sich in diesem Level nur nach unten bewegt hat. */
  try{ localStorage.setItem(PEGEL_KEY,String(S.pegel)); }catch(e){}
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=S.szenen[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=S.szenen.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const ruettelW=FX.wackel(S.ruettel);
  const rx=(Math.random()-.5)*ruettelW+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*ruettelW+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneSzene();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${FX.blitz(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
  if(S.karte) zeichneAnlauf();
  erzaehlZeichne();
}
/* Anlauf 4: dunkle Karte, je 2,4 s. */
function zeichneAnlauf(){
  const k=S.karte, a=Math.max(0,Math.min(1,k.t/.3,(2.4-k.t)/.3));
  ctx.fillStyle='#08060fcc'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=a; zeichneKarte(k.txt[k.i],H/2-10,P.weiss); ctx.globalAlpha=1;
}

function zeichneSzene(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,TIEFE.hinten-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,TIEFE.hinten-20);
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,TIEFE.hinten,o.bis-o.von,H-TIEFE.hinten);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,TIEFE.hinten,o.bis-o.von,1);
    text(o.name,o.von+6,26,'#ffffff18');
    if(!o.drinnen){
      for(let i=0;i<Math.round((o.bis-o.von)/9);i++){
        const sx=o.von+(i*37)%(o.bis-o.von), sy=24+(i*17)%50;
        ctx.fillStyle=i%4===0?'#ffffff55':'#ffffff22'; ctx.fillRect(sx,sy,1,1);
      }
    }
  }
  /* Regal an der Rueckwand und Leuchtreklame im Schaufenster - oben
     fehlte die Ladenwand (PLAYTEST.md). Mittig in der Bildhoehe, sonst
     schluckt die Vignette unten den Kontrast fast vollstaendig. */
  ctx.fillStyle='#1a1424'; ctx.fillRect(302,70,216,24);
  ctx.fillStyle='#000000aa'; ctx.fillRect(302,82,216,1);
  for(let x=306;x<516;x+=18){
    ctx.fillStyle=(Math.floor(x/18)%2===0)?'#4a7a5c':'#7a5a3a';
    ctx.fillRect(x,73,12,8);
    ctx.fillRect(x,85,12,7);
  }
  ctx.fillStyle='#1a1424'; ctx.fillRect(302,96,216,14);
  ctx.fillStyle='#000000aa'; ctx.fillRect(302,100,216,1);
  for(let x=310;x<510;x+=14){
    ctx.fillStyle=(Math.floor(x/14)%2===0)?'#5c4a2a':'#2a3c4a';
    ctx.fillRect(x,98,8,10);
  }
  ctx.globalAlpha=.55+Math.sin(S.t*4)*.25;
  ctx.fillStyle=P.gold; ctx.fillRect(356,30,52,9);
  ctx.globalAlpha=1;
  text('OFFEN',356+26-textW('OFFEN')/2,32,'#1a1424');
  /* Das Schaufenster wirft Licht auf den Gehweg */
  ctx.globalAlpha=.10; ctx.fillStyle='#ffe08a'; ctx.fillRect(300,TIEFE.hinten,220,H-TIEFE.hinten); ctx.globalAlpha=1;
  /* Die Ecke: der Himmel faengt an, heller zu werden */
  ctx.globalAlpha=.18; ctx.fillStyle='#ff9a5a'; ctx.fillRect(760,20,140,30); ctx.globalAlpha=1;

  const naechst=S.modus==='spiel'&&!gespraechAktiv()?naechstesZiel():null;
  const blink=Math.floor(S.t*4)%2===0;
  const liste=[];
  const figur=(o,rows,name,tint,farbe)=>liste.push({t:o.t, mal:()=>{
    const y=bodenY(o.t)-rows.length;
    ctx.globalAlpha=.24; ctx.fillStyle='#000'; ctx.fillRect(Math.round(o.x-3),Math.round(bodenY(o.t)),7,1); ctx.globalAlpha=1;
    outline(rows,o.x-3,y,1,.55);
    if(o.blick<0) spriteFlip(rows,o.x-3,y,1,tint); else sprite(rows,o.x-3,y,1,tint);
    if(name&&Math.abs(o.x-S.x)<60) text(name,o.x+3-textW(name)/2,y-9,farbe||P.dim);
    if(naechst&&naechst.obj===o&&blink) text('E',o.x+2,y-16,P.gold);
  }});

  liste.push({t:0.02, mal:()=>{ sprite(SPR.taxi,70,bodenY(0.02)-SPR.taxi.length); }});
  liste.push({t:0.05, mal:()=>{ sprite(SPR.bank,556,bodenY(0.05)-SPR.bank.length);
    if(naechst&&naechst.obj===BANKRUNDE&&blink) text('E',BANKRUNDE.x,bodenY(0.05)-12,P.gold); }});
  liste.push({t:FOTO7.t, mal:()=>{
    const y=bodenY(FOTO7.t)-9;
    MOMENT.zeichneFund(FOTO7.x-4,y,7);
    if(!MOMENT.hat(7)&&naechst&&naechst.obj===FOTO7&&blink) text('E',FOTO7.x-1,y-8,P.gold); }});
  for(const d of DINGE){ const rows=SPR[d.moebel];
    liste.push({t:d.t, mal:()=>{ const y=bodenY(d.t)-rows.length;
      outline(rows,d.x-3,y,1,.5); sprite(rows,d.x-3,y);
      if(flag(d.art==='wasser'?'spaetiWasser':'spaetiSnack')) text('OK',d.x+1-textW('OK')/2,y-8,P.gruen);
      if(naechst&&naechst.obj===d&&blink) text('E',d.x,y-16,P.gold); }}); }
  liste.push({t:KASSE.t, mal:()=>{ sprite(SPR.tisch,KASSE.x-4,bodenY(KASSE.t)-SPR.tisch.length); }});
  figur(OEZDEMIR,SPR.verkaeufer,OEZDEMIR.name,null,P.gold);

  for(const f of S.pfand) if(!f.weg) liste.push({t:f.t, mal:()=>{
    const y=bodenY(f.t)-SPR.pfand.length; sprite(SPR.pfand,f.x-1,y);
    if(naechst&&naechst.obj===f&&blink) text('E',f.x-1,y-8,P.gold); }});

  for(const m of NACHTMENSCHEN){
    if(!nachtmenschDa(m)) continue;
    figur(m,SPR[m.spr],m.name,m.tint||null);
  }
  if(flag('tobiDabei')) figur({x:S.x-16,t:Math.min(1,S.tiefe+0.1),blick:S.blick},SPR.tobi,null);
  const h=S.heinz;
  liste.push({t:h.t+0.01, mal:()=>{ sprite(SPR.wagen,h.x+(h.blick>0?-9:4),bodenY(h.t)-SPR.wagen.length); }});
  { const lauf=laufBild(h), rows=lauf>=0?gehBeine(SPR.heinz,lauf):SPR.heinz;
    const gebueckt=h.greifT>0&&h.ziel;
    figur(h, gebueckt?rows.slice(2):rows, 'HEINZ', null, h.friedlich?P.gruen:P.dim); }
  for(const c of S.crew) figur(c,SPR[c.spr]||SPR.steh,c.name,c.tint);

  liste.push({t:S.tiefe, mal:()=>{
    let rows;
    if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
    else if(tempo2D(S.vx,S.vt)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
    else rows=SPR.steh;
    const versatz=BODEN-bodenY(S.tiefe), y=S.y-versatz-rows.length;
    ctx.globalAlpha=.28; ctx.fillStyle='#000';
    ctx.fillRect(Math.round(S.x-3),Math.round(bodenY(S.tiefe)),7,1); ctx.globalAlpha=1;
    outline(rows,S.x-3,y,1,.6);
    if(S.blick<0) spriteFlip(rows,S.x-3,y); else sprite(rows,S.x-3,y);
  }});
  zeichneNachTiefe(liste);

  const bereit=alleFertig();
  text('WEITER',TUNE.ausgangX-textW('WEITER')/2,TIEFE.hinten-12,bereit?P.gold:P.dunkel);
  ctx.restore();

  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  /* Uhr - reine Erzaehl-Anzeige */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  text(uhr,W-textW(uhr)-6,6,P.dim);

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6,p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Geld, Pfand und was noch fehlt */
  text('GELD '+Number(wert('geld')).toFixed(2).replace('.',',')+' EURO',6,6,P.weiss);
  const pf=NACHT.inventar.PFAND||0;
  if(pf) text('PFAND '+pf,6,14,P.gruen);
  let y=24;
  for(const [f,t] of [['spaetiWasser','WASSER'],['spaetiSnack','SNACKS']]){
    const ok=flag(f);
    text(ok?'X':'-',6,y,ok?P.gruen:P.dunkel); text(t,14,y,ok?P.dunkel:P.weiss); y+=8;
  }
  if(alleFertig()&&Math.floor(S.t*2)%2===0) textC('ZUR ECKE - WIE GEHT DIE NACHT WEITER?',H-42,P.gold);

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  zeichneGespraech();
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('SPAETI',22,P.neon,3);
  textC('LEVEL 7 - BILANZ',44,P.dim);
  const zeilen=['WASSER UND SNACKS KOSTEN GELD','WER PLEITE IST, SAMMELT PFAND','UND DANN: WIE GEHT DIE NACHT ZU ENDE?'];
  zeilen.forEach((z,i)=>textC(z,64+i*10,i===2?P.gold:P.weiss));
  const st=IS_TOUCH?[['STICK','LAUFEN'],['KNOPF','REDEN, AUFHEBEN, KASSE']]
                   :[['WASD','LAUFEN'],['E','REDEN, AUFHEBEN, KASSE']];
  st.forEach((z,i)=>{ text(z[0],90,104+i*9,P.gold); text(z[1],122,104+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),128,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'LEERTASTE ODER E',H-14,P.weiss,1);
}
function zeichneIntro(){
  ctx.fillStyle='#0a0e18'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#141c2c'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#101422'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  const m=Math.round(W/2);
  for(let i=0;i<26;i++){ ctx.fillStyle=i%4===0?'#ffffff55':'#ffffff22';
    ctx.fillRect((i*53)%W,34+(i*23)%70,1,1); }
  sprite(SPR.steh,m-30,130-13);
  sprite(SPR.max,m,130-13);
  sprite(SPR.moritz,m+30,130-15);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(!IS_TOUCH&&Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
  zeichneUeberspringen(S.skipT,INTRO_SKIP);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=S.szenen[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 7 GESCHAFFT',34,P.gold,2);
      textC('KURZ DURCHATMEN. WEITER GEHTS.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegel),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 8':'E  WEITER ZU LEVEL 8',134,P.gruen,1);
    } else {
      /* Kein Kampf in diesem Level - dieser Zweig ist ein reines
         Sicherheitsnetz und wird im normalen Spielverlauf nie erreicht. */
      textGlowC('MOMENT MAL',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
      if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
    }
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */


starteSchleife();
</script>
