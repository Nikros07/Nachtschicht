<script>
/* ============================================================================
   NACHTSCHICHT - LEVEL 7: SPAETI

   Ruhepause. Kein Kampf, keine Uhr die dich hetzt. Nach dem Afterhour-Rausch
   braucht die Truppe eine Pause: Wasser und Snacks besorgen, an der Kasse
   bezahlen, kurz mit jedem reden. Der Pegel baut hier spuerbar ab - Kopf
   wird wieder klar, bevor es auf den Heimweg geht.

   >>> ALLE REGLER STEHEN HIER OBEN. <<<
   ========================================================================== */
const TUNE = {
  /* (1) BEWEGUNG - ruhiger Spaziergang, kein Zeitdruck */
  gehTempo:        90,
  beschleunigung: 800,
  bremsung:      1100,
  luftKontrolle:   0.55,
  gravitation:    920,
  sprungKraft:   -220,
  kurzsprung:      0.45,
  coyoteMs:        95,
  puffermMs:      130,

  /* (2) KAMERA */
  kameraTraegheit: 6.5,
  blickVoraus:    22,

  /* (3) DER PEGEL - baut hier deutlich ab. Bewusste Ruhepause zum
     Runterkommen, bevor es Richtung Heimweg geht. */
  pegelAbbau:      1.0,    // pro Sekunde, spuerbar schneller als sonst
  wackelnAb:       55,     // ab hier schwankt das Bild noch
  langsamAb:       70,     // ab hier bist du noch spuerbar langsamer

  /* (4) DIE UHR - reine Erzaehl-Anzeige. Kein Zeitdruck in diesem Level,
     kein Verlieren durch Zeitablauf. */
  startMinute:   3*60+15,
  endMinute:     3*60+45,
  levelSekunden:   75,

  /* (5) REDEN UND EINPACKEN */
  reichweite:      15,     // wie nah du an Leuten und Sachen sein musst

  /* (6) DER AUSGANG - die Ecke Richtung Heimweg */
  ausgangX:       430,
};

const P = {
  ink:'#08060f', weiss:'#f2f0ff', dim:'#8d86a8', dunkel:'#4a4363',
  neon:'#ff3d8b', neon2:'#42d9ff', gold:'#ffd447', rot:'#ff4d4d', gruen:'#48e08a',
  boden:'#20182a', bodenKante:'#4a3a58',
};

/* ==========================================================================
   3x5 BITMAP-FONT
   ========================================================================== */


/* ==========================================================================
   BILD-CACHE
   ========================================================================== */


const KEY={ k:'#08060f', s:'#e8b088', h:'#2a1c14', t:'#3ad1a0', p:'#2b2b48', w:'#f2f0ff',
  g:'#ffd447', n:'#ff3d8b', c:'#42d9ff', r:'#ff4d4d', d:'#4a4363', b:'#6b4a2a',
  o:'#a8681f', e:'#20182e', l:'#ffe08a', v:'#c8324a', m:'#7a2d3d', a:'#1a1626',
  j:'#3d2f22', u:'#8c94ad', q:'#2e3350', z:'#5a4632',
  /* Moritz: dunkle Haare, weiss-blaues Trikot */
  H:'#1d150e', T:'#eef2ff', B:'#2f6fd0' };


/* ==========================================================================
   SPRITES
   ========================================================================== */
const KOPF=['..hhh..','.hsssh.','.sssss.','..sss..'];
const geh=b=>[...KOPF,'..ttt..',...b];
const SPR={
  steh: geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
  geh:[
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','..pp.p.','..pp..p','.kk..kk']),
    geh(['.tttttt','k.ttt.k','..ttt..','..ppp..','..p.p..','.p...p.','.p...p.','kk...kk']),
    geh(['tttttt.','k.ttt.k','..ttt..','..ppp..','..ppp..','.p.pp..','p..pp..','.kk.kk.']),
  ],
  sprung:[...KOPF,'k.ttt.k','.tttttt','..ttt..','..ttt..','..ppp..','.pp.pp.','.p...p.','kk...kk'],
  fall:  [...KOPF,'..ttt..','ktttttk','..ttt..','..ppp..','..p.p..','.pp.pp.','.p...p.','.k...k.'],

  /* MORITZ - aus Level 2: dunkle Haare, weiss-blaues Trikot */
  moritz:['..HHH..','.HsssH.','.sssss.','..sss..','..sss..','..TBT..','.TTBTT.',
          'kTTBTTk','.TTBTT.','..TBT..','..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* MAX FERDI - aus Level 1, Sportler */
  max:['..hhh..','.hsssh.','.sssss.','..sss..','..ccc..','.ccccc.','k.ccc.k','..ccc..',
       '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],
  /* Der Verkaeufer hinter der Kasse */
  verkaeufer:['..hhh..','.hsssh.','.sssss.','..sss..','..ooo..','.ooooo.','k.ooo.k','..ooo..',
              '..ppp..','..p.p..','..p.p..','.pp.pp.','.kk..kk'],

  /* Einrichtung im Laden */
  kuehl: ['uuuuuuu','u.....u','u....gu','uuuuuuu','u.....u','u.....u','u....gu','u.....u','uuuuuuu','ddddddd'],
  regal: ['zzzzzzz','zbbbbbz','zzzzzzz','zbbbbbz','zzzzzzz','zbbbbbz','zzzzzzz','ddddddd'],
  tisch: ['zzzzzzzz','z......z','dd....dd','d......d','d......d','d......d'],

  /* Sachen zum Einpacken */
  flasche:['..gg..','..gg..','.gggg.','.gwgg.','.gggg.','.gggg.','..gg..'],
  snack:  ['.ggg.','g...g','g.r.g','g...g','.ggg.'],
};

/* ==========================================================================
   AUDIO
   ========================================================================== */


const SFX={
  schritt:()=>piep(90+Math.random()*16,.03,'triangle',.014),
  sprung: ()=>piep(400,.06,'square',.028),
  landen: ()=>piep(150,.05,'triangle',.024),
  reden:  ()=>piep(480+Math.random()*160,.04,'square',.022),
  fund:   ()=>{ piep(780,.08); setTimeout(()=>piep(1180,.1),80); },
  nichts: ()=>piep(220,.09,'sine',.03),
  erledigt:()=>{ piep(620,.08); setTimeout(()=>piep(920,.12),85); },
  sieg:   ()=>{ [560,700,880,1040].forEach((f,i)=>setTimeout(()=>piep(f,.14),i*120)); },
};
/* Musik: ruhiges, langsames Pad - die Nacht kommt kurz zur Ruhe */
const PAD=[130.81,0,0,0, 164.81,0,0,0, 196.00,0,0,0, 146.83,0,0,0];

function musik(){
  if(!AC||muted||S.modus==='pause'||S.modus==='titel') return;
  const st=60/70/2;
  while(MUS.next<AC.currentTime+.15){
    const i=MUS.step%PAD.length, f=PAD[i];
    if(f) ton(f,MUS.next,st*1.6,'sine',.02);
    MUS.next+=st; MUS.step++;
  }
}

/* ==========================================================================
   AUFBAU
   ========================================================================== */


const BODEN=142;


/* ==========================================================================
   SPEICHERSTAND
   ========================================================================== */


const BEST_KEY='nachtschicht.bestzeit7';
const ladeBest=()=>{ try{ const v=parseFloat(localStorage.getItem(BEST_KEY)); return isFinite(v)?v:null; }catch(e){ return null; } };
/* Der Pegel ist levelübergreifend - hier baut er bewusst deutlich ab
   (siehe TUNE.pegelAbbau) und der Endwert geht als Startwert an Level 8.
   Das Lesen laeuft synchron beim Start von neuesSpiel() - faengt lokalStorage-
   Fehler ab, damit ein blockierter Speicher nicht die ganze Seite schwarz laesst. */

const ladeStartPegel=()=>{ try{ const v=parseFloat(localStorage.getItem(PEGEL_KEY)); return isFinite(v)?v:0; }catch(e){ return 0; } };

/* ==========================================================================
   DER SPAETI
   ========================================================================== */
const LEVEL_B=460;
const ORTE=[
  { von:0,   bis:170, name:'GEHWEG',    wand:'#141c2c', boden:'#101422' },
  { von:170, bis:350, name:'IM SPAETI', wand:'#2a2336', boden:'#1d1727', drinnen:true },
  { von:350, bis:460, name:'ECKE',      wand:'#141c2c', boden:'#101422' },
];

/* Sachen zum Einpacken - liegen fest, keine Zufallssuche noetig,
   das hier ist die Ruhepause, kein Schleich- oder Suchlevel. */
const DINGE=[
  { x:210, art:'wasser', label:'KUEHLREGAL',  moebel:'kuehl' },
  { x:270, art:'snack',  label:'SNACKREGAL',  moebel:'regal' },
];

/* Die Crew, die bis hierhin unterwegs ist - kommt direkt aus dem Spielstand.
   Bekannte Gesichter kriegen ihr eigenes Sprite und eigene Zeilen, alles
   andere faellt auf eine generische Figur mit generischen Zeilen zurueck,
   damit das Level auch dann nicht leer wirkt, wenn frueher noch niemand
   unterwegs war. */
const CREW_NAMEN = ladeCrew();

function baueCrew(){
  const namen = CREW_NAMEN.length?CREW_NAMEN:['DEIN KUMPEL'];
  const n=namen.length;
  return namen.map((name,i)=>{
    const x = n===1?70:Math.round(20+(140/(n-1))*i);
    if(name==='MAX FERDI') return { id:'crew'+i, x, name, spr:'max', art:'crew',
      zVorher:['GEH SCHON MAL REIN','ICH WART HIER'],
      zeilen:['PAUSE TUT GUT','ICH BIN DURCH, EHRLICH GESAGT','GIBST DU MIR WASSER?'],
      zNachher:['DANKE, ALTER','GLEICH GEHTS WEITER'],
      zSpaeter:['GEHT SCHON WIEDER','KOMM, WEITER'] };
    if(name==='MORITZ') return { id:'crew'+i, x, name, spr:'moritz', art:'crew',
      zVorher:['ALLES GUT','GEH NUR SCHON REIN'],
      zeilen:['MEIN TRIKOT RIECHT SCHON KOMISCH','ABER ES BRINGT GLUECK, BLEIBT AN','HAST DU WAS ZU ESSEN?'],
      zNachher:['PERFEKT','JETZT GEHTS MIR BESSER'],
      zSpaeter:['NOCH IMMER GLUECKSTRIKOT','KOMM, WEITER'] };
    return { id:'crew'+i, x, name, spr:'steh', art:'crew', tint:P.neon2,
      zVorher:['ALLES OKAY','GEH SCHON REIN'],
      zeilen:['WAS FUER EINE NACHT',name+' BRAUCHT GRAD WAS ZU TRINKEN','...'],
      zNachher:['DANKE DIR','GEHEN WIR WEITER'],
      zSpaeter:['GEHT SCHON BESSER','KOMM, WEITER'] };
  });
}
const CREW = baueCrew();
const VERKAEUFER = { id:'verkaeufer', x:320, name:'VERKAEUFER', spr:'verkaeufer', art:'verkaeufer',
  zVorher:['ERST EINSAMMELN','DANN KOMM ZUR KASSE'],
  zKasse:['DAS MACHT ZUSAMMEN','KLEINGELD REICHT','GUTE BESSERUNG'],
  zDanke:['ALLES BEZAHLT','SCHOENEN REST NOCH'] };
const LEUTE=[...CREW,VERKAEUFER];

/* Was du hier erledigst */
const AUFGABEN=[
  { id:'wasser',    text:'WASSER HOLEN' },
  { id:'snack',     text:'SNACKS HOLEN' },
  { id:'bezahlen',  text:'AN DER KASSE BEZAHLEN' },
  ...CREW.map(p=>({ id:p.id, text:'MIT '+p.name+' REDEN' })),
];

/* ==========================================================================
   ZUSTAND
   ========================================================================== */
let S={};
function neuesSpiel(){
  S={
    modus:'titel', t:0, zeit:0,
    x:40, y:BODEN, vx:0, vy:0, amBoden:true, letzterBoden:0, blick:1, gehPhase:0, schritte:0,
    kamX:0,
    pegel: ladeStartPegel(), minute:TUNE.startMinute,
    inventar:{}, erledigt:{},
    reden:null, redeZeile:0, redeT:0,
    meldung:'', meldungT:0, hinweis:'', hinweisT:0,
    ruettel:0, blitz:0,
    szene:0, szeneT:0, skipT:0,
    gewonnen:false, faenger:'',
  };
  S.kamX=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2));
}
neuesSpiel();

/* ==========================================================================
   EINGABE
   ========================================================================== */

let linksAn=false, rechtsAn=false, sprungAn=false, aktionGehalten=false;
let sprungPuffer=[], aktionPuffer=[];

function druckSprung(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ neuesSpiel(); return; }
  if(S.modus==='pause'){ S.modus='spiel'; return; }
  if(S.modus==='cutscene') return;
  sprungPuffer.push(S.t); sprungAn=true;
}
function druckAktion(){
  ensureAudio();
  if(S.modus==='titel'){ starte(); return; }
  if(S.modus==='intro'){ S.szeneT+=99; return; }
  if(S.modus==='ende'){ if(S.gewonnen){ location.href='level8.html'; return; } neuesSpiel(); return; }
  if(S.modus==='cutscene'){ S.szeneT+=99; return; }
  aktionPuffer.push(S.t);
}
addEventListener('keydown',e=>{
  if(keys[e.code]) return; keys[e.code]=true;
  if(['ArrowLeft','KeyA'].includes(e.code)){ e.preventDefault(); linksAn=true; }
  if(['ArrowRight','KeyD'].includes(e.code)){ e.preventDefault(); rechtsAn=true; }
  if(e.code==='Space'){ e.preventDefault(); druckSprung(); }
  if(['KeyE','Enter'].includes(e.code)){ e.preventDefault(); aktionGehalten=true; druckAktion(); }
  if(e.code==='KeyM'){ muted=!muted; if(!muted) ensureAudio(); }
  if(e.code==='KeyF'){ e.preventDefault(); vollbild(); }
  if(e.code==='KeyP'&&(S.modus==='spiel'||S.modus==='pause')) S.modus=S.modus==='spiel'?'pause':'spiel';
});
addEventListener('keyup',e=>{ keys[e.code]=false;
  if(['ArrowLeft','KeyA'].includes(e.code)) linksAn=false;
  if(['ArrowRight','KeyD'].includes(e.code)) rechtsAn=false;
  if(['KeyE','Enter'].includes(e.code)) aktionGehalten=false;
  if(e.code==='Space') sprungAn=false; });
addEventListener('blur',()=>{ linksAn=rechtsAn=sprungAn=aktionGehalten=false; });


bind('tleft',['touchstart','mousedown'],()=>linksAn=true);
bind('tleft',['touchend','mouseup','touchcancel'],()=>linksAn=false);
bind('tright',['touchstart','mousedown'],()=>rechtsAn=true);
bind('tright',['touchend','mouseup','touchcancel'],()=>rechtsAn=false);
bind('tjump',['touchstart','mousedown'],druckSprung);
bind('tjump',['touchend','mouseup','touchcancel'],()=>sprungAn=false);
bind('thit',['touchstart','mousedown'],()=>{ aktionGehalten=true; druckAktion(); });
bind('thit',['touchend','mouseup','touchcancel'],()=>aktionGehalten=false);


/* ==========================================================================
   INTRO
   ========================================================================== */
const INTRO=[
  { d:2.4, txt:'CA. 3 UHR. IRGENDWO AN DER ECKE.' },
  { d:2.6, txt:'NACH DER AFTERHOUR SEID IHR ALLE FERTIG.' },
  { d:2.6, txt:'ZUM GLUECK HAT DER SPAETI NOCH AUF.' },
  { d:2.4, txt:'WASSER. SNACKS. FUENF MINUTEN RUHE.' },
];
function starte(){ neuesSpiel(); S.modus='intro'; S.szene=0; S.szeneT=0; piep(330,.1,'sine',.04); }
function starteLevel(){ S.modus='spiel'; zeigeHinweis('BESORG WAS FUER DIE TRUPPE',3);
  piep(620,.08); setTimeout(()=>piep(920,.12),90); }
function intro(dt){ S.szeneT+=dt;
  if(S.szeneT>=INTRO[S.szene].d){ S.szene++; S.szeneT=0;
    if(S.szene>=INTRO.length) starteLevel(); else piep(440,.05,'sine',.03); } }

const meldung=(t,d=1.5)=>{ S.meldung=t; S.meldungT=d; };
const zeigeHinweis=(t,d=2)=>{ S.hinweis=t; S.hinweisT=d; };
const alleFertig=()=>AUFGABEN.every(a=>S.erledigt[a.id]);

/* ==========================================================================
   AKTUALISIEREN
   ========================================================================== */
function update(dt){
  S.t+=dt; musik();
  S.ruettel=Math.max(0,S.ruettel-dt*16);
  S.blitz=Math.max(0,S.blitz-dt*2.2);
  if(S.hinweisT>0) S.hinweisT-=dt;
  if(S.meldungT>0) S.meldungT-=dt;
  if(S.modus==='pause'||S.modus==='titel') return;
  if(S.modus==='intro'){ intro(dt); return; }
  if(S.modus==='cutscene'){ cutscene(dt); kamera(dt); return; }
  if(S.modus==='ende'){ return; }

  S.zeit+=dt;
  const spanne=TUNE.endMinute-TUNE.startMinute;
  S.minute=TUNE.startMinute+Math.min(spanne,S.zeit/TUNE.levelSekunden*spanne);

  /* Der Pegel baut hier spuerbar ab - kein Blackout-Risiko, nur Erholung. */
  if(S.pegel>0) S.pegel=Math.max(0,S.pegel-TUNE.pegelAbbau*dt);

  /* --- Gespraech laeuft --- */
  if(S.reden){
    S.redeT+=dt;
    while(aktionPuffer.length){ aktionPuffer.shift(); naechsteZeile(); }
    kamera(dt); return;
  }

  /* --- Bewegung --- */
  const richtung=(rechtsAn?1:0)-(linksAn?1:0);
  if(richtung) S.blick=richtung;
  const langsam = S.pegel>TUNE.langsamAb ? 1-(S.pegel-TUNE.langsamAb)/100 : 1;
  const hoechst = TUNE.gehTempo*langsam;
  const kontrolle = S.amBoden?1:TUNE.luftKontrolle;
  if(richtung){
    S.vx+=richtung*TUNE.beschleunigung*kontrolle*dt;
    if(Math.abs(S.vx)>hoechst) S.vx=hoechst*Math.sign(S.vx);
  } else {
    const brems=TUNE.bremsung*kontrolle*dt;
    S.vx=Math.abs(S.vx)<=brems?0:S.vx-Math.sign(S.vx)*brems;
  }
  S.x+=S.vx*dt;
  S.x=Math.max(14,Math.min(LEVEL_B-14,S.x));

  if(S.amBoden&&Math.abs(S.vx)>12){
    S.gehPhase+=Math.abs(S.vx)*dt*.09;
    const n=Math.floor(S.gehPhase);
    if(n!==S.schritte){ S.schritte=n; if(n%2===0) SFX.schritt(); }
  }
  while(sprungPuffer.length){
    const t0=sprungPuffer.shift();
    if(S.t-t0>TUNE.puffermMs/1000) continue;
    if(S.amBoden||(S.t-S.letzterBoden)<TUNE.coyoteMs/1000){
      S.vy=TUNE.sprungKraft; S.amBoden=false; SFX.sprung(); }
  }
  if(!sprungAn&&S.vy<0) S.vy*=(1-TUNE.kurzsprung*dt*12);
  S.vy+=TUNE.gravitation*dt; S.y+=S.vy*dt;
  if(S.y>=BODEN){ S.y=BODEN; if(!S.amBoden) SFX.landen();
    S.vy=0; S.amBoden=true; S.letzterBoden=S.t; } else S.amBoden=false;

  /* --- Aktion --- */
  while(aktionPuffer.length){
    aktionPuffer.shift();
    let person=null, dPerson=1e9;
    for(const l of LEUTE){ const d=Math.abs(l.x-S.x);
      if(d<TUNE.reichweite&&d<dPerson){ person=l; dPerson=d; } }
    let ding=null, dDing=1e9;
    for(const d0 of DINGE){ const d=Math.abs(d0.x+6-S.x);
      if(d<TUNE.reichweite&&d<dDing){ ding=d0; dDing=d; } }
    const beiAusgang=Math.abs(S.x-TUNE.ausgangX)<TUNE.reichweite;
    if(person&&(!ding||dPerson<=dDing)) rede(person);
    else if(ding) benutze(ding);
    else if(beiAusgang&&alleFertig()) starteCutscene();
    else if(beiAusgang){ meldung('ERST NOCH WAS ERLEDIGEN'); SFX.nichts(); }
  }
  kamera(dt);
}

/* ---- Dinge einpacken ---- */
function benutze(d){
  if(d.art==='wasser'){
    if(S.inventar.wasser){ meldung('HAST SCHON WASSER',1); SFX.nichts(); return; }
    S.inventar.wasser=true; S.erledigt.wasser=true; SFX.fund(); S.blitz=.3;
    meldung('WASSER EINGEPACKT',1.6); return;
  }
  if(d.art==='snack'){
    if(S.inventar.snack){ meldung('HAST SCHON SNACKS',1); SFX.nichts(); return; }
    S.inventar.snack=true; S.erledigt.snack=true; SFX.fund(); S.blitz=.3;
    meldung('SNACKS EINGEPACKT',1.6); return;
  }
}

/* ---- Reden ---- */
function rede(p){
  S.reden=p; S.redeZeile=0; S.redeT=0; S.vx=0; SFX.reden();
  if(p.art==='verkaeufer'){
    if(S.erledigt.bezahlen){ p._zeilen=p.zDanke; return; }
    if(S.inventar.wasser&&S.inventar.snack){
      p._zeilen=p.zKasse; S.erledigt.bezahlen=true; SFX.erledigt();
      zeigeHinweis('JETZT NOCH DER TRUPPE BESCHEID SAGEN',3);
      return;
    }
    p._zeilen=p.zVorher; return;
  }
  /* Crew */
  if(S.erledigt[p.id]){ p._zeilen=p.zSpaeter; return; }
  if(!S.erledigt.bezahlen){ p._zeilen=p.zVorher; return; }
  p._zeilen=[...p.zeilen,...p.zNachher];
  S.erledigt[p.id]=true; SFX.erledigt();
}
function naechsteZeile(){
  const p=S.reden;
  S.redeZeile++;
  if(S.redeZeile>=p._zeilen.length){ S.reden=null; return; }
  SFX.reden();
}

/* ---- Kamera ---- */
function kamera(dt){
  const ziel=Math.max(0,Math.min(LEVEL_B-W,S.x-W/2+S.blick*TUNE.blickVoraus));
  S.kamX+=(ziel-S.kamX)*Math.min(1,TUNE.kameraTraegheit*dt);
}

/* ==========================================================================
   CUTSCENE - kurzer Ausklang, bevor es zum Heimweg geht
   ========================================================================== */
function baueSzenen(){
  const s=[
    { d:1.2, txt:'' },
    { d:2.4, txt:'DRAUSSEN WIRD ES SCHON WIEDER HELLER.' },
  ];
  if(CREW_NAMEN.includes('MAX FERDI')) s.push({ d:2.4, txt:'MAX FERDI: BESSER. VIEL BESSER.' });
  if(CREW_NAMEN.includes('MORITZ')) s.push({ d:2.4, txt:'MORITZ: MEIN TRIKOT UEBERLEBT DAS NICHT.' });
  s.push({ d:2.2, txt:'DU: NOCH EIN STUECK BIS NACH HAUSE.' });
  s.push({ d:1.2, txt:'' });
  s.push({ d:2.6, txt:'PEGEL RUNTER. KOPF WIEDER KLARER.' });
  s.push({ d:2.4, txt:'LEVEL 7 GESCHAFFT' });
  return s;
}
const SZENEN=baueSzenen();
function starteCutscene(){ S.modus='cutscene'; S.szene=0; S.szeneT=0; S.skipT=0; SFX.sieg(); }
function levelGeschafft(){
  const best=ladeBest();
  if(best===null||S.zeit<best){ S.neueBestzeit=true;
    try{ localStorage.setItem(BEST_KEY,String(S.zeit)); }catch(e){} }
  /* Der Pegel geht als Startwert an Level 8 - immer speichern, auch wenn
     er sich in diesem Level nur nach unten bewegt hat. */
  try{ localStorage.setItem(PEGEL_KEY,String(S.pegel)); }catch(e){}
}
function cutscene(dt){
  if(aktionGehalten){ S.skipT+=dt;
    if(S.skipT>0.7){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); return; }
  } else S.skipT=Math.max(0,S.skipT-dt*2);
  S.szeneT+=dt;
  if(S.szeneT>=SZENEN[S.szene].d){
    S.szene++; S.szeneT=0;
    if(S.szene>=SZENEN.length){ S.modus='ende'; S.gewonnen=true; levelGeschafft(); }
  }
}

/* ==========================================================================
   ZEICHNEN
   ========================================================================== */
function draw(dt){
  ctx.fillStyle=P.ink; ctx.fillRect(0,0,W,H);
  if(S.modus==='titel'){ titelbild(); return; }
  if(S.modus==='intro'){ zeichneIntro(); return; }

  ctx.save();
  const wack = S.pegel>TUNE.wackelnAb ? (S.pegel-TUNE.wackelnAb)/45*3 : 0;
  const rx=(Math.random()-.5)*S.ruettel+Math.sin(S.t*7)*wack;
  const ry=(Math.random()-.5)*S.ruettel+Math.cos(S.t*5.2)*wack*.6;
  ctx.translate(Math.round(rx),Math.round(ry));
  zeichneSzene();
  ctx.restore();

  hud();
  if(S.blitz>0){ ctx.fillStyle=`rgba(255,255,255,${(S.blitz*.5).toFixed(3)})`; ctx.fillRect(0,0,W,H); }
  bildschirme();
}

function zeichneSzene(){
  const kx=Math.round(S.kamX);
  ctx.save(); ctx.translate(-kx,0);

  /* Bereiche */
  for(const o of ORTE){
    ctx.fillStyle=o.wand; ctx.fillRect(o.von,20,o.bis-o.von,BODEN-20);
    ctx.fillStyle='#00000044'; ctx.fillRect(o.von,20,o.bis-o.von,2);
    ctx.fillStyle='#0d0a14'; ctx.fillRect(o.bis-2,20,2,BODEN-20);
    ctx.fillStyle=o.boden; ctx.fillRect(o.von,BODEN,o.bis-o.von,H-BODEN);
    ctx.fillStyle=P.bodenKante; ctx.fillRect(o.von,BODEN,o.bis-o.von,1);
    ctx.fillStyle='#00000033';
    for(let x=o.von;x<o.bis;x+=14) ctx.fillRect(x,BODEN+5,7,1);
    text(o.name,o.von+6,26,'#ffffff18');
    if(!o.drinnen){
      for(let i=0;i<Math.round((o.bis-o.von)/9);i++){
        const sx=o.von+(i*37)%(o.bis-o.von), sy=24+(i*17)%50;
        ctx.fillStyle=i%4===0?'#ffffff55':'#ffffff22'; ctx.fillRect(sx,sy,1,1);
      }
    }
  }

  /* Ausgang Richtung Heimweg */
  const bereit=alleFertig();
  text('WEITER',TUNE.ausgangX-textW('WEITER')/2,BODEN-20,bereit?P.gold:P.dunkel);

  /* Theke, rein dekorativ */
  sprite(SPR.tisch,304,BODEN-SPR.tisch.length);

  /* Dinge zum Einpacken */
  for(const d of DINGE){
    const rows=SPR[d.moebel]; if(!rows) continue;
    const y=BODEN-rows.length;
    outline(rows,d.x,y,1,.5); sprite(rows,d.x,y);
    const erledigt=!!S.erledigt[d.art];
    const nah=Math.abs(d.x+6-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
    if(erledigt) text('OK',d.x+6-textW('OK')/2,y-9,P.gruen);
    else if(nah&&Math.floor(S.t*4)%2===0) text('E',d.x+6-2,y-9,P.gold);
  }

  /* Leute */
  for(const l of LEUTE){
    const rows=SPR[l.spr]||SPR.steh;
    const y=BODEN-rows.length;
    outline(rows,l.x-3,y,1,.55);
    sprite(rows,l.x-3,y,1,l.tint||null);
    const fertig = l.art==='crew' ? !!S.erledigt[l.id] : !!S.erledigt.bezahlen;
    text(l.name,l.x+3-textW(l.name)/2,y-16,fertig?P.gruen:P.dim);
    if(fertig) text('OK',l.x+3-textW('OK')/2,y-9,P.gruen);
    else {
      const nah=Math.abs(l.x-S.x)<TUNE.reichweite&&S.modus==='spiel'&&!S.reden;
      if(nah&&Math.floor(S.t*4)%2===0) text('E',l.x+2,y-9,P.gold);
    }
  }

  /* Spieler */
  let rows;
  if(!S.amBoden) rows=S.vy<0?SPR.sprung:SPR.fall;
  else if(Math.abs(S.vx)>12) rows=SPR.geh[Math.floor(S.gehPhase)%4];
  else rows=SPR.steh;
  outline(rows,S.x-3,S.y-rows.length,1,.6);
  if(S.blick<0) spriteFlip(rows,S.x-3,S.y-rows.length); else sprite(rows,S.x-3,S.y-rows.length);
  ctx.globalAlpha=.28; ctx.fillStyle='#000';
  ctx.fillRect(Math.round(S.x-3),BODEN,7,1); ctx.globalAlpha=1;

  ctx.restore();

  /* Vignette, die mit sinkendem Pegel spuerbar heller wird */
  const p=S.pegel/100;
  ctx.globalAlpha=Math.min(1,.5+p*.4);
  ctx.drawImage(verlauf('vig',W,H,g=>{
    const gr=g.createRadialGradient(W/2,H*.55,44,W/2,H*.55,W*.6);
    gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)');
    g.fillStyle=gr; g.fillRect(0,0,W,H); }),0,0);
  ctx.globalAlpha=1;
}

/* ---- HUD ---- */
function hud(){
  /* Uhr - reine Erzaehl-Anzeige */
  const std=Math.floor(S.minute/60)%24, min=Math.floor(S.minute%60);
  const uhr=std+':'+String(min).padStart(2,'0');
  text(uhr,W-textW(uhr)-6,6,P.dim);

  /* Pegel */
  const bw=64,bx=(W-bw)/2,by=6,p=S.pegel/100;
  ctx.fillStyle='#000a'; ctx.fillRect(bx-2,by-2,bw+4,8);
  ctx.fillStyle='#2a2440'; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=p<.35?P.neon2:p<.7?P.gold:P.rot;
  ctx.fillRect(bx,by,Math.round(bw*p),4);
  text('PEGEL',bx+(bw-textW('PEGEL'))/2,by+6,P.dunkel);

  /* Aufgabenliste */
  let y=22;
  for(const a of AUFGABEN){
    const ok=!!S.erledigt[a.id];
    text(ok?'X':'-',6,y,ok?P.gruen:P.dunkel);
    text(a.text,14,y,ok?P.dunkel:P.weiss);
    y+=8;
  }
  if(alleFertig()&&Math.floor(S.t*2)%2===0) textC('ALLES ERLEDIGT - WEITER ZUR ECKE',H-42,P.gold);

  /* Inventar */
  let ix=W-30;
  if(S.inventar.wasser){ sprite(SPR.flasche,ix,16); ix-=10; }
  if(S.inventar.snack){ sprite(SPR.snack,ix,16); ix-=9; }

  if(S.meldungT>0){ ctx.globalAlpha=Math.min(1,S.meldungT*2);
    textGlowC(S.meldung,H-30,P.weiss,1); ctx.globalAlpha=1; }
  if(S.hinweisT>0){ ctx.globalAlpha=Math.min(1,S.hinweisT);
    textGlowC(S.hinweis,H-20,P.gold,1); ctx.globalAlpha=1; }

  /* Gespraech */
  if(S.reden){
    const p2=S.reden;
    ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-44,W,44);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-44,W,1);
    text(p2.name,8,H-38,P.neon2);
    const zeile=p2._zeilen[S.redeZeile]||'';
    textC(zeile,H-24,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E',W-12,H-12,P.dunkel);
  }
}

/* ---- Bildschirme ---- */
function titelbild(){
  ctx.fillStyle='#08060f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<44;i++){ ctx.fillStyle=i%6===0?'#2a2440':'#151020';
    ctx.fillRect((i*83)%W,(i*47)%H,1,1); }
  textGlowC('SPAETI',22,P.neon,3);
  textC('LEVEL 7 - RUHEPAUSE',44,P.dim);
  const zeilen=['NACH DER AFTERHOUR BRAUCHT IHR EINE PAUSE','WASSER. SNACKS. EIN PAAR MINUTEN LUFT.','KEIN STRESS HIER.'];
  zeilen.forEach((z,i)=>textC(z,64+i*10,i===2?P.gold:P.weiss));
  const st=IS_TOUCH?[['< >','LAUFEN'],['E','REDEN UND EINPACKEN']]
                   :[['A D','LAUFEN'],['E','REDEN UND EINPACKEN']];
  st.forEach((z,i)=>{ text(z[0],90,104+i*9,P.gold); text(z[1],122,104+i*9,P.dim); });
  const crew=ladeCrew();
  if(crew.length) textC('DABEI: '+crew.join(', '),128,P.neon2);
  if(Math.floor(S.t*1.6)%2===0) textGlowC(IS_TOUCH?'TIPPEN ZUM START':'LEERTASTE ODER E',H-14,P.weiss,1);
}
function zeichneIntro(){
  ctx.fillStyle='#0a0e18'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#141c2c'; ctx.fillRect(0,30,W,100);
  ctx.fillStyle='#101422'; ctx.fillRect(0,130,W,H-130);
  ctx.fillStyle=P.bodenKante; ctx.fillRect(0,130,W,1);
  const m=Math.round(W/2);
  for(let i=0;i<26;i++){ ctx.fillStyle=i%4===0?'#ffffff55':'#ffffff22';
    ctx.fillRect((i*53)%W,34+(i*23)%70,1,1); }
  sprite(SPR.steh,m-30,130-13);
  sprite(SPR.max,m,130-13);
  sprite(SPR.moritz,m+30,130-15);
  ctx.fillStyle='#000000cc'; ctx.fillRect(0,H-38,W,38);
  ctx.fillStyle=P.neon; ctx.fillRect(0,H-38,W,1);
  if(S.szene<INTRO.length) textC(INTRO[S.szene].txt,H-24,P.weiss);
  if(Math.floor(S.t*2)%2===0) text('E  WEITER',W-textW('E  WEITER')-6,H-10,P.dunkel);
}
function bildschirme(){
  if(S.modus==='pause'){
    ctx.fillStyle='#000000bb'; ctx.fillRect(0,0,W,H);
    textGlowC('PAUSE',76,P.weiss,3); textC('P ZUM WEITERSPIELEN',100,P.dim);
  }
  if(S.modus==='cutscene'){
    ctx.fillStyle='#000000aa'; ctx.fillRect(0,H-40,W,40);
    ctx.fillStyle=P.neon; ctx.fillRect(0,H-40,W,1);
    const s=SZENEN[S.szene];
    if(s&&s.txt) textC(s.txt,H-26,P.weiss);
    if(Math.floor(S.t*2)%2===0) text('E HALTEN ZUM UEBERSPRINGEN',W-textW('E HALTEN ZUM UEBERSPRINGEN')-6,H-10,P.dunkel);
  }
  if(S.modus==='ende'){
    ctx.fillStyle='#000000dd'; ctx.fillRect(0,0,W,H);
    if(S.gewonnen){
      textGlowC('LEVEL 7 GESCHAFFT',34,P.gold,2);
      textC('KURZ DURCHATMEN. WEITER GEHTS.',56,P.weiss);
      const min=Math.floor(S.zeit/60), sek=Math.floor(S.zeit%60);
      textC('ZEIT  '+min+':'+String(sek).padStart(2,'0'),74,S.neueBestzeit?P.gold:P.dim);
      if(S.neueBestzeit) textC('NEUE BESTZEIT',84,P.gold);
      textC('PEGEL  '+Math.round(S.pegel),96,P.dim);
      const crew=ladeCrew();
      if(crew.length) textC('DABEI: '+crew.join(', '),110,P.neon2);
      if(Math.floor(S.t*2)%2===0) textGlowC(IS_TOUCH?'TIPPEN  WEITER ZU LEVEL 8':'E  WEITER ZU LEVEL 8',134,P.gruen,1);
    } else {
      /* Kein Kampf in diesem Level - dieser Zweig ist ein reines
         Sicherheitsnetz und wird im normalen Spielverlauf nie erreicht. */
      textGlowC('MOMENT MAL',48,P.rot,3);
      textC(S.faenger||'',74,P.weiss);
      if(Math.floor(S.t*2)%2===0) textC(IS_TOUCH?'TIPPEN FUER NEUSTART':'LEERTASTE FUER NEUSTART',H-18,P.gold);
    }
  }
}

/* ==========================================================================
   SCHLEIFE
   ========================================================================== */


starteSchleife();
</script>
